# 배포 시에는 GitHub Actions가 --baseURL 로 실제 주소를 넘겨줍니다.
baseURL = "https://yeomyaloo.github.io/yeomyaloo.github.io-infra/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "yeomyaloo · Infra Study"

enableRobotsTXT = true
enableGitInfo = false
summaryLength = 80
titleCaseStyle = "none"   # 태그 이름을 대문자로 바꾸지 않음

[params]
  shortTitle = "Infra Study"   # 좁은 화면 상단에 쓰는 짧은 제목
  description = "인프라·AI·보안·해킹·자격증 — 하루 한 주제씩 쌓는 학습 기록"
  author = "yeomyaloo"
  github = "https://github.com/yeomyaloo"
  # 글에 image 가 없을 때 쓰는 대표 이미지 (static/ 기준)
  defaultImage = "og-default.png"

  # 상단 탭. 챕터 _index.md 의 tab 값과 key 가 같아야 합니다.
  # 글이 없는 탭은 "준비 중"으로 표시됩니다.
  [[params.tabs]]
    key = "infra"
    name = "인프라"
    description = "Docker → Kubernetes → OpenStack, 그리고 GitOps·SRE까지"
  [[params.tabs]]
    key = "ai"
    name = "AI"
    description = "LLM 서빙, RAG, GPU 인프라"
  [[params.tabs]]
    key = "security"
    name = "보안"
    description = "4C 레이어별로 지키는 인프라 보안"
  [[params.tabs]]
    key = "hacking"
    name = "해킹"
    description = "화이트해커 트랙 — 본인 소유 격리 실습장에서만"
  [[params.tabs]]
    key = "cert"
    name = "자격증 준비"
    description = "RHCSA(EX200) 등 자격증 대비"

  # 글 안의 .md 링크를 블로그 주소로 바꿀 때, infra 폴더 이름 → 블로그 폴더 이름
  # (해킹 트랙은 /hacking/ 탭 주소와 겹치지 않게 posts/10-hacking/ 에 둠)
  [params.linkPathMap]
    hacking = "10-hacking"

  # Giscus 댓글: https://giscus.app 에서 값을 받아 채우면 댓글이 켜집니다.
  [params.giscus]
    repo = "yeomyaloo/yeomyaloo.github.io-infra"
    repoId = "R_kgDOVua_cA"
    category = "General"
    categoryId = "DIC_kwDOVua_cM4DLIhy"

# 글은 posts/ 에, 사이트 전용 페이지(전체 글 목록 등)는 content/ 에 둡니다.
# posts/ 안의 이미지 같은 비-마크다운 파일은 assets 로도 마운트해서
# 마크다운의 ./images/xxx.svg 상대 경로를 그대로 쓸 수 있게 합니다.
[module]
  [[module.mounts]]
    source = "posts"
    target = "content"
    files = ["**/*.md"]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "posts"
    target = "assets/posts"
    files = ["! **/*.md"]
  [[module.mounts]]
    source = "assets"
    target = "assets"

[taxonomies]
  tag = "tags"
  tab = "tabs"   # 챕터 _index.md 의 cascade 로 글마다 자동 지정

# 탭 첫 화면 주소: /infra/, /ai/, /security/ ...
[permalinks]
  [permalinks.term]
    tabs = "/:slug/"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    # 글 안의 <details> 퀴즈 같은 HTML을 그대로 쓰기 위해 허용 (본인 글만 올리는 저장소)
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menus]
  [[menus.main]]
    name = "전체 글"
    pageRef = "/all"
    weight = 10
  [[menus.main]]
    name = "태그"
    pageRef = "/tags"
    weight = 20

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]   # 태그별·탭별 RSS

[sitemap]
  changeFreq = "weekly"
