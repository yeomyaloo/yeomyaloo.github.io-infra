# 배포 시에는 GitHub Actions가 --baseURL 로 실제 주소를 넘겨줍니다.
baseURL = "https://yeomyaloo.github.io/yeomyaloo.github.io-infra/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Stack Overflow — 쌓다 보니 넘쳤다"

enableRobotsTXT = true
enableGitInfo = false
summaryLength = 80
titleCaseStyle = "none"   # 태그 이름을 대문자로 바꾸지 않음

[params]
  shortTitle = "Stack Overflow"   # 좁은 화면 상단에 쓰는 짧은 제목
  description = "인프라에서 시작해 AI·보안·해킹·클라우드·자격증까지, 한 층씩 쌓아 올린 학습 기록"
  # 이름·핸들은 화면에 넣지 않습니다. 하단 GitHub 링크는 이 블로그 저장소로.
  github = "https://github.com/yeomyaloo/yeomyaloo.github.io-infra"
  # 글에 image 가 없을 때 쓰는 대표 이미지 (static/ 기준)
  defaultImage = "og-default.png"

  # GoatCounter 방문자 통계 (https://<code>.goatcounter.com). 비우면 추적·카운터를 모두 끕니다.
  # 카운터 숫자는 GoatCounter 설정의 "Allow adding visitor counts on your website" 가 켜져 있어야 보입니다.
  goatcounter = "yeom456"

  # 상단 탭. 챕터 _index.md 의 tab 값과 key 가 같아야 합니다.
  # 글이 없는 탭은 "준비 중"으로 표시됩니다.
  [[params.tabs]]
    key = "infra"
    name = "인프라"
    description = "Docker → Kubernetes → OpenStack, 그리고 GitOps·SRE까지"
  [[params.tabs]]
    key = "ai"
    name = "AI"
    description = "LLM 서빙, RAG, GPU 인프라"
  [[params.tabs]]
    key = "security"
    name = "보안"
    description = "4C 레이어별로 지키는 인프라 보안"
  [[params.tabs]]
    key = "hacking"
    name = "해킹"
    description = "화이트해커 트랙 — 본인 소유 격리 실습장에서만"
  [[params.tabs]]
    key = "cloud"
    name = "클라우드"
    description = "홈랩에서 만든 것을 AWS에 다시 세우기 — 본인 AWS 계정, 비용 발생 가능"
  [[params.tabs]]
    key = "platform"
    name = "플랫폼 엔지니어링"
    description = "개발자가 스스로 쓰는 내부 플랫폼 — Backstage, Crossplane, Cluster API (kind 기반, 비용 없음)"
  [[params.tabs]]
    key = "cert"
    name = "자격증 준비"
    description = "RHCSA · CKA · CKS · CKAD · 정보보안기사 · KCNA · KCSA · AWS SAA · Terraform · OSCP — 직접 만든 연습 문제와 학습 가이드"

  # 글 안의 .md 링크를 블로그 주소로 바꿀 때, infra 폴더 이름 → 블로그 폴더 이름
  # (해킹·클라우드·플랫폼은 탭 주소 /hacking/ /cloud/ /platform/ 과 겹치지 않게 번호 붙은 폴더에 둠)
  [params.linkPathMap]
    hacking = "10-hacking"
    cloud = "11-cloud"
    platform = "12-platform"

  # Giscus 댓글: https://giscus.app 에서 값을 받아 채우면 댓글이 켜집니다.
  [params.giscus]
    repo = "yeomyaloo/yeomyaloo.github.io-infra"
    repoId = "R_kgDOVua_cA"
    category = "General"
    categoryId = "DIC_kwDOVua_cM4DLIhy"

# 글은 posts/ 에, 사이트 전용 페이지(전체 글 목록 등)는 content/ 에 둡니다.
# posts/ 안의 이미지 같은 비-마크다운 파일은 assets 로도 마운트해서
# 마크다운의 ./images/xxx.svg 상대 경로를 그대로 쓸 수 있게 합니다.
[module]
  [[module.mounts]]
    source = "posts"
    target = "content"
    files = ["**/*.md"]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "posts"
    target = "assets/posts"
    files = ["! **/*.md"]
  [[module.mounts]]
    source = "assets"
    target = "assets"

[taxonomies]
  tag = "tags"
  tab = "tabs"   # 챕터 _index.md 의 cascade 로 글마다 자동 지정

# 탭 첫 화면 주소: /infra/, /ai/, /security/ ...
[permalinks]
  [permalinks.term]
    tabs = "/:slug/"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    # 글 안의 <details> 퀴즈 같은 HTML을 그대로 쓰기 위해 허용 (본인 글만 올리는 저장소)
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menus]
  [[menus.main]]
    name = "전체 글"
    pageRef = "/all"
    weight = 10
  [[menus.main]]
    name = "태그"
    pageRef = "/tags"
    weight = 20
  [[menus.main]]
    name = "검색"
    pageRef = "/search"
    weight = 30

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]   # 태그별·탭별 RSS

[sitemap]
  changeFreq = "weekly"
