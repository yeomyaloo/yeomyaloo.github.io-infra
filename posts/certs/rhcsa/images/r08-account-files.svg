<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">useradd가 읽는 파일과 쓰는 파일</text>

  <!-- inputs -->
  <text x="140" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">읽는 기본값</text>
  <rect x="20" y="84" width="240" height="96" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="140" y="108" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#78350f">/etc/login.defs</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">
    <text x="36" y="132">UID_MIN 1000  PASS_MAX_DAYS</text>
    <text x="36" y="150">PASS_MIN_DAYS PASS_WARN_AGE</text>
    <text x="36" y="168">CREATE_HOME   HOME_MODE</text>
  </g>
  <rect x="20" y="196" width="240" height="78" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="140" y="220" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#78350f">/etc/default/useradd</text>
  <text x="140" y="244" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">SHELL  HOME  SKEL</text>
  <text x="140" y="262" text-anchor="middle" font-size="12" fill="#78350f">(useradd -D 로 확인)</text>
  <rect x="20" y="290" width="240" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="140" y="316" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#78350f">/etc/skel/</text>
  <text x="140" y="337" text-anchor="middle" font-size="12" fill="#78350f">새 홈에 복사될 파일</text>

  <!-- command -->
  <rect x="320" y="150" width="280" height="130" rx="12" fill="#ee0000"/>
  <text x="460" y="186" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="17" font-weight="700" fill="#ffffff">useradd</text>
  <text x="460" y="214" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#ffffff">-u 2101 -G ops</text>
  <text x="460" y="234" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#ffffff">-s /bin/bash kim</text>
  <text x="460" y="262" text-anchor="middle" font-size="12" fill="#fde8e8">옵션이 기본값보다 우선</text>

  <!-- outputs -->
  <text x="800" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">쓰는 파일</text>
  <g font-family="Consolas,'D2Coding',monospace">
    <rect x="660" y="84" width="280" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="676" y="108" font-size="13" font-weight="700" fill="#14532d">/etc/passwd</text>
    <text x="676" y="130" font-size="11" fill="#14532d">kim:x:2101:2101::/home/kim:/bin/bash</text>
    <rect x="660" y="156" width="280" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="676" y="180" font-size="13" font-weight="700" fill="#14532d">/etc/shadow</text>
    <text x="676" y="202" font-size="11" fill="#14532d">kim:!!:20407:0:99999:7:::</text>
    <rect x="660" y="228" width="280" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="676" y="252" font-size="13" font-weight="700" fill="#14532d">/etc/group (+ gshadow)</text>
    <text x="676" y="274" font-size="11" fill="#14532d">kim:x:2101:   ops:x:3000:kim</text>
    <rect x="660" y="300" width="280" height="50" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="676" y="331" font-size="13" font-weight="700" fill="#14532d">/home/kim  (0700)</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="260" y1="140" x2="316" y2="190" marker-end="url(#arrow)"/>
    <line x1="260" y1="235" x2="316" y2="225" marker-end="url(#arrow)"/>
    <line x1="260" y1="320" x2="316" y2="262" marker-end="url(#arrow)"/>
    <line x1="600" y1="180" x2="656" y2="118" marker-end="url(#arrow)"/>
    <line x1="600" y1="200" x2="656" y2="188" marker-end="url(#arrow)"/>
    <line x1="600" y1="230" x2="656" y2="258" marker-end="url(#arrow)"/>
    <line x1="600" y1="262" x2="656" y2="322" marker-end="url(#arrow)"/>
  </g>

  <!-- footer -->
  <rect x="20" y="378" width="920" height="64" rx="10" fill="#fde8e8" stroke="#ee0000"/>
  <text x="40" y="404" font-size="14" fill="#991b1b"><tspan font-weight="700">수정은 전용 명령으로:</tspan> passwd·group → usermod / groupmod / gpasswd,  shadow 에이징 → chage</text>
  <text x="40" y="428" font-size="14" fill="#991b1b"><tspan font-weight="700">login.defs 변경</tspan>은 앞으로 만들 계정에만 적용 — 기존 계정은 그대로</text>
</svg>
