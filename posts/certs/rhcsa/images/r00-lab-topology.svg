<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RHCSA 실습 환경 — Windows Home + VirtualBox + Vagrant</text>

  <!-- Windows host -->
  <rect x="20" y="56" width="920" height="484" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#334155">Windows 10/11 Home 호스트</text>

  <!-- PowerShell / vagrant -->
  <rect x="40" y="100" width="210" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="145" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PowerShell</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">
    <text x="56" y="152">vagrant up</text>
    <text x="56" y="174">vagrant ssh servera</text>
    <text x="56" y="196">vagrant snapshot ...</text>
  </g>

  <!-- Internet / NAT -->
  <rect x="40" y="250" width="210" height="96" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="145" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">인터넷 (NAT, 1번째 NIC)</text>
  <text x="145" y="302" text-anchor="middle" font-size="13" fill="#78350f">Vagrant Cloud 박스 다운로드</text>
  <text x="145" y="324" text-anchor="middle" font-size="13" fill="#78350f">AlmaLinux 미러 · Flathub</text>

  <!-- Snapshot -->
  <rect x="40" y="376" width="210" height="140" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="145" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">스냅샷</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="414" width="170" height="28" rx="6" fill="#c7d2fe"/><text x="145" y="433" fill="#312e81">clean (초기 상태)</text>
    <rect x="60" y="450" width="170" height="28" rx="6" fill="#c7d2fe"/><text x="145" y="469" fill="#312e81">after-r04 …</text>
  </g>
  <text x="145" y="502" text-anchor="middle" font-size="12" fill="#64748b">복원 → 과제 → 재부팅 → 검증</text>

  <!-- VirtualBox area -->
  <rect x="280" y="100" width="640" height="416" rx="12" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="300" y="126" font-size="15" font-weight="700" fill="#991b1b">VirtualBox 7.2 · 박스 almalinux/10 (RHEL 10 호환)</text>

  <!-- servera -->
  <rect x="300" y="144" width="290" height="262" rx="10" fill="#ffffff" stroke="#ee0000"/>
  <rect x="300" y="144" width="290" height="40" rx="10" fill="#ee0000"/>
  <rect x="300" y="170" width="290" height="14" fill="#ee0000"/>
  <text x="445" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">servera</text>
  <text x="445" y="208" text-anchor="middle" font-size="13" fill="#334155">시험 대상 서버 · 2 vCPU / 2 GB</text>
  <text x="445" y="230" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">192.168.56.11</text>
  <g font-size="13">
    <rect x="320" y="248" width="250" height="34" rx="6" fill="#e2e8f0"/>
    <text x="334" y="270" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">sda</text>
    <text x="380" y="270" fill="#334155">OS 디스크 (건드리지 않기)</text>
    <rect x="320" y="292" width="250" height="34" rx="6" fill="#86efac"/>
    <text x="334" y="314" font-family="Consolas,'D2Coding',monospace" fill="#14532d">sdb</text>
    <text x="380" y="314" fill="#14532d">빈 디스크 5 GB (R04·R05)</text>
    <rect x="320" y="336" width="250" height="34" rx="6" fill="#86efac"/>
    <text x="334" y="358" font-family="Consolas,'D2Coding',monospace" fill="#14532d">sdc</text>
    <text x="380" y="358" fill="#14532d">빈 디스크 2 GB (R04·R05)</text>
  </g>
  <text x="445" y="392" text-anchor="middle" font-size="12" fill="#64748b">장치명은 lsblk로 크기 보고 확인</text>

  <!-- serverb -->
  <rect x="610" y="144" width="290" height="262" rx="10" fill="#ffffff" stroke="#ee0000"/>
  <rect x="610" y="144" width="290" height="40" rx="10" fill="#ee0000"/>
  <rect x="610" y="170" width="290" height="14" fill="#ee0000"/>
  <text x="755" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">serverb</text>
  <text x="755" y="208" text-anchor="middle" font-size="13" fill="#334155">서비스 제공 서버 · 2 vCPU / 2 GB</text>
  <text x="755" y="230" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">192.168.56.12</text>
  <g font-size="13">
    <rect x="630" y="248" width="250" height="56" rx="6" fill="#fde68a"/>
    <text x="644" y="270" font-weight="700" fill="#78350f">httpd 로컬 저장소</text>
    <text x="644" y="292" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">/custom  /dvd/BaseOS …</text>
    <rect x="630" y="314" width="250" height="34" rx="6" fill="#fde68a"/>
    <text x="644" y="336" fill="#78350f">NFS 서버 (R05에서 구성)</text>
    <rect x="630" y="358" width="250" height="34" rx="6" fill="#e2e8f0"/>
    <text x="644" y="380" fill="#334155">ISO 광학 드라이브 (선택)</text>
  </g>

  <!-- host-only network -->
  <rect x="300" y="430" width="600" height="40" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="2"/>
  <text x="600" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Host-only 네트워크 192.168.56.0/24 (2번째 NIC · nmcli 프로필 lab-net)</text>
  <text x="600" y="498" text-anchor="middle" font-size="13" fill="#334155">이름 해석: /etc/hosts — servera.lab.example.com, serverb.lab.example.com</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="445" y1="406" x2="445" y2="426" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <line x1="755" y1="406" x2="755" y2="426" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <line x1="250" y1="160" x2="296" y2="190" marker-end="url(#arrow)"/>
    <line x1="296" y1="300" x2="254" y2="300" marker-end="url(#arrow)"/>
  </g>
  <text x="266" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">ssh</text>
</svg>
