<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">비밀번호 에이징 타임라인 — chage -m 2 -M 45 -W 5 -I 7</text>

  <!-- segments -->
  <rect x="60" y="120" width="80" height="44" fill="#fca5a5"/>
  <rect x="140" y="120" width="440" height="44" fill="#86efac"/>
  <rect x="580" y="120" width="100" height="44" fill="#fde68a"/>
  <rect x="680" y="120" width="140" height="44" fill="#fed7aa"/>
  <rect x="820" y="120" width="110" height="44" fill="#e2e8f0"/>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <text x="100" y="147">변경 불가</text>
    <text x="360" y="147">정상 사용</text>
    <text x="630" y="147">경고</text>
    <text x="750" y="147">로그인 시 변경 강요</text>
    <text x="875" y="147">계정 잠김</text>
  </g>

  <!-- axis -->
  <line x1="60" y1="190" x2="940" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="60" y1="182" x2="60" y2="198"/>
    <line x1="140" y1="182" x2="140" y2="198"/>
    <line x1="580" y1="182" x2="580" y2="198"/>
    <line x1="680" y1="182" x2="680" y2="198"/>
    <line x1="820" y1="182" x2="820" y2="198"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#334155">
    <text x="60" y="216">0일</text>
    <text x="140" y="216">2일</text>
    <text x="580" y="216">40일</text>
    <text x="680" y="216">45일</text>
    <text x="820" y="216">52일</text>
  </g>

  <!-- labels -->
  <g font-size="13" fill="#0f172a">
    <text x="60" y="100" text-anchor="middle" font-weight="700">마지막 변경</text>
    <text x="60" y="80" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">-d</text>
    <text x="140" y="100" text-anchor="middle" font-weight="700">최소</text>
    <text x="140" y="80" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">-m 2</text>
    <text x="580" y="100" text-anchor="middle" font-weight="700">경고 시작</text>
    <text x="580" y="80" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">-W 5</text>
    <text x="680" y="100" text-anchor="middle" font-weight="700">비밀번호 만료</text>
    <text x="680" y="80" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">-M 45</text>
    <text x="820" y="100" text-anchor="middle" font-weight="700">비활성 기간 끝</text>
    <text x="820" y="80" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">-I 7</text>
  </g>

  <!-- notes -->
  <rect x="40" y="250" width="430" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="60" y="278" font-size="15" font-weight="700" fill="#0f172a">자주 쓰는 조합</text>
  <g font-size="13" fill="#334155">
    <text x="60" y="306"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">chage -d 0 user</tspan> : 다음 로그인 때 변경 강제</text>
    <text x="60" y="332"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">chage -l user</tspan> : 현재 설정 확인</text>
    <text x="60" y="358"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">chage -M 99999</tspan> : 만료 없음(기본값)</text>
    <text x="60" y="384"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">chage -E -1</tspan> : 계정 만료일 해제</text>
  </g>

  <rect x="490" y="250" width="430" height="150" rx="10" fill="#fde8e8" stroke="#ee0000"/>
  <text x="510" y="278" font-size="15" font-weight="700" fill="#991b1b">계정 만료(-E)는 별개</text>
  <g font-size="13" fill="#0f172a">
    <text x="510" y="306"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">chage -E 2026-12-31 user</tspan></text>
    <text x="510" y="332">→ 그 날짜부터 비밀번호와 상관없이</text>
    <text x="510" y="354">   <tspan font-weight="700">로그인 자체 불가</tspan></text>
    <text x="510" y="384" fill="#64748b">비밀번호 만료(-M)는 "새로 정하라"는 요구일 뿐</text>
  </g>
</svg>
