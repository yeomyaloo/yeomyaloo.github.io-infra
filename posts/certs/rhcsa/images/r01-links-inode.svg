<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">하드 링크 vs 심볼릭 링크 — 이름표와 inode</text>

  <text x="140" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">디렉터리 항목 (이름)</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">inode</text>
  <text x="810" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">데이터 블록</text>

  <!-- names -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" text-anchor="middle">
    <rect x="30" y="90" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="140" y="117" fill="#0f172a">/opt/lab/notes.txt</text>
    <rect x="30" y="160" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="140" y="187" fill="#0f172a">/opt/lab/notes.hard</text>
    <rect x="30" y="290" width="220" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="140" y="317" fill="#312e81">/root/notes.link</text>
  </g>

  <!-- inode 1001 -->
  <rect x="370" y="96" width="220" height="102" rx="10" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="480" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">inode 1001</text>
  <text x="480" y="146" text-anchor="middle" font-size="13" fill="#334155">권한·소유자·크기·시간</text>
  <text x="480" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">링크 수 2</text>

  <!-- inode 2002 -->
  <rect x="370" y="270" width="220" height="84" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="480" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">inode 2002</text>
  <text x="480" y="320" text-anchor="middle" font-size="13" fill="#334155">종류: 심볼릭 링크</text>
  <text x="480" y="342" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">"/opt/lab/notes.txt"</text>

  <!-- data -->
  <rect x="700" y="114" width="220" height="64" rx="10" fill="#86efac"/>
  <text x="810" y="152" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="16" fill="#14532d">RHCSA</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="250" y1="112" x2="366" y2="134" marker-end="url(#arrow)"/>
    <line x1="250" y1="182" x2="366" y2="162" marker-end="url(#arrow)"/>
    <line x1="590" y1="146" x2="696" y2="146" marker-end="url(#arrow)"/>
  </g>
  <line x1="250" y1="312" x2="366" y2="312" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowP)"/>
  <path d="M372,282 C330,250 310,150 256,124" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowP)"/>
  <text x="300" y="250" text-anchor="end" font-size="12" fill="#4f46e5">경로 이름으로 다시 찾아감</text>

  <!-- legends -->
  <rect x="640" y="230" width="290" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="656" y="256" font-size="13" font-weight="700" fill="#991b1b">하드 링크: 같은 inode의 또 다른 이름</text>
  <text x="656" y="280" font-size="12" fill="#334155">원본 이름을 지워도 데이터는 남는다</text>
  <rect x="640" y="312" width="290" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="656" y="338" font-size="13" font-weight="700" fill="#312e81">심볼릭 링크: 경로를 적은 작은 파일</text>
  <text x="656" y="362" font-size="12" fill="#334155">원본 경로가 사라지면 깨진 링크</text>

  <text x="480" y="414" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">ls -li 로 inode 번호와 링크 수 확인 · readlink 로 링크 대상 확인</text>
</svg>
