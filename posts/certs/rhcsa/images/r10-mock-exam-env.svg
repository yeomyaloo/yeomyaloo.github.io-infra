<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RHCSA 모의고사 실습 환경 (R10 · R11 공통)</text>

  <!-- Windows host -->
  <rect x="20" y="70" width="190" height="340" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Windows 호스트</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <rect x="35" y="118" width="160" height="40" rx="8" fill="#e2e8f0"/>
    <text x="115" y="143">VirtualBox 7.2 + Vagrant</text>
    <rect x="35" y="172" width="160" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="194">PowerShell</text>
    <text x="115" y="213" font-size="11" font-family="Consolas,'D2Coding',monospace">vagrant upload / ssh</text>
    <rect x="35" y="238" width="160" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="260">VirtualBox 콘솔(표시)</text>
    <text x="115" y="279" font-size="12" fill="#64748b">부팅 중단 · root 복구</text>
    <rect x="35" y="304" width="160" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="326">스냅샷 clean</text>
    <text x="115" y="345" font-size="12" fill="#64748b">디스크까지 함께 복원</text>
  </g>
  <text x="115" y="388" text-anchor="middle" font-size="12" fill="#64748b">NAT(eth0) 경유 vagrant ssh</text>

  <!-- servera -->
  <rect x="240" y="70" width="330" height="300" rx="12" fill="#fff5f5" stroke="#ee0000" stroke-width="2"/>
  <rect x="240" y="70" width="330" height="44" rx="12" fill="#ee0000"/>
  <rect x="240" y="98" width="330" height="16" fill="#ee0000"/>
  <text x="405" y="99" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">servera · 192.168.56.11</text>
  <g font-size="13" fill="#0f172a">
    <text x="258" y="142">응시 대상 서버 (대부분의 문항)</text>
    <rect x="258" y="156" width="294" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="270" y="178" font-family="Consolas,'D2Coding',monospace">/dev/sda</text>
    <text x="352" y="178" fill="#64748b">OS 디스크 (건드리지 않음)</text>
    <rect x="258" y="198" width="294" height="34" rx="6" fill="#fde8e8" stroke="#ee0000"/>
    <text x="270" y="220" font-family="Consolas,'D2Coding',monospace">/dev/sdb</text>
    <text x="352" y="220">5 GB · LVM 문항</text>
    <rect x="258" y="240" width="294" height="34" rx="6" fill="#fde8e8" stroke="#ee0000"/>
    <text x="270" y="262" font-family="Consolas,'D2Coding',monospace">/dev/sdc</text>
    <text x="352" y="262">2 GB · swap · VFAT 문항</text>
    <text x="258" y="300">셋업 후 root 비밀번호 = 무작위(모름)</text>
    <text x="258" y="324">채점: 재부팅 후 grade.sh 실행</text>
    <text x="258" y="348" fill="#64748b">serverb 문항도 여기서 네트워크로 확인</text>
  </g>

  <!-- serverb -->
  <rect x="600" y="70" width="340" height="300" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="600" y="70" width="340" height="44" rx="12" fill="#334155"/>
  <rect x="600" y="98" width="340" height="16" fill="#334155"/>
  <text x="770" y="99" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">serverb · 192.168.56.12</text>
  <g font-size="13" fill="#0f172a">
    <text x="618" y="142">보조 서버 (서비스 제공 + 일부 문항)</text>
    <rect x="618" y="156" width="304" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="178">httpd :80  </text>
    <text x="710" y="178" font-family="Consolas,'D2Coding',monospace">/rhcsa/repo</text>
    <text x="808" y="178" fill="#64748b">로컬 저장소</text>
    <rect x="618" y="198" width="304" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="220">NFS 서버</text>
    <text x="710" y="220" font-family="Consolas,'D2Coding',monospace">/exports/*</text>
    <rect x="618" y="240" width="304" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="262">chronyd</text>
    <text x="710" y="262" fill="#64748b">시간 서버 (allow 56.0/24)</text>
    <rect x="618" y="282" width="304" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="304">deploy 계정</text>
    <text x="730" y="304" fill="#64748b">SSH 키 · scp 대상</text>
    <text x="618" y="346" fill="#64748b">R11: 포트 8909 포털 · NFS export 문항</text>
  </g>

  <!-- host-only network -->
  <line x1="240" y1="430" x2="940" y2="430" stroke="#4f46e5" stroke-width="4"/>
  <text x="590" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Host-only 네트워크 192.168.56.0/24 (연결 프로필 lab-net)</text>
  <line x1="405" y1="370" x2="405" y2="428" stroke="#4f46e5" stroke-width="2"/>
  <line x1="770" y1="370" x2="770" y2="428" stroke="#4f46e5" stroke-width="2"/>
  <line x1="210" y1="240" x2="236" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="220" x2="596" y2="220" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- flow -->
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="486" width="165" height="70" rx="10" fill="#fde8e8" stroke="#ee0000"/>
    <text x="102" y="514" font-weight="700" fill="#0f172a">① 스냅샷 복원</text>
    <text x="102" y="538" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">snapshot restore clean</text>
    <rect x="211" y="486" width="165" height="70" rx="10" fill="#fde8e8" stroke="#ee0000"/>
    <text x="293" y="514" font-weight="700" fill="#0f172a">② 셋업 스크립트</text>
    <text x="293" y="538" font-size="12" fill="#334155">serverb 먼저, servera 다음</text>
    <rect x="402" y="486" width="165" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="484" y="514" font-weight="700" fill="#0f172a">③ 시험 (콘솔)</text>
    <text x="484" y="538" font-size="12" fill="#334155">권장 2시간 30분</text>
    <rect x="593" y="486" width="165" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/>
    <text x="675" y="514" font-weight="700" fill="#0f172a">④ 두 VM 재부팅</text>
    <text x="675" y="538" font-size="12" fill="#334155">영속성 확인</text>
    <rect x="784" y="486" width="156" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="862" y="514" font-weight="700" fill="#0f172a">⑤ grade.sh</text>
    <text x="862" y="538" font-size="12" fill="#334155">PASS/FAIL · 총점</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="186" y1="521" x2="208" y2="521" marker-end="url(#arrow)"/>
    <line x1="377" y1="521" x2="399" y2="521" marker-end="url(#arrow)"/>
    <line x1="568" y1="521" x2="590" y2="521" marker-end="url(#arrow)"/>
    <line x1="759" y1="521" x2="781" y2="521" marker-end="url(#arrow)"/>
  </g>
  <text x="480" y="584" text-anchor="middle" font-size="12" fill="#64748b">모든 문항은 공식 목표를 바탕으로 창작한 연습 과제이며 실제 시험 문제가 아닙니다.</text>
</svg>
