<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">root 비밀번호 재설정 — 핵심은 rw · passwd · autorelabel</text>

  <!-- Start -->
  <rect x="330" y="56" width="300" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">콘솔에서 재부팅 → GRUB 메뉴에서 e</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#64748b">linux 줄 끝으로 이동 (Ctrl+e), rhgb quiet 제거</text>

  <!-- Left column: rd.break -->
  <rect x="40" y="140" width="400" height="300" rx="12" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="240" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">A. rd.break (Red Hat 문서의 기본 방법)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <rect x="60" y="184" width="360" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="72" y="206">linux 줄 끝에 rd.break → Ctrl+x</text>
    <rect x="60" y="226" width="360" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="72" y="248">mount -o remount,rw /sysroot</text>
    <rect x="60" y="268" width="360" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="72" y="290">chroot /sysroot</text>
    <rect x="60" y="310" width="360" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="72" y="332">passwd root</text>
    <rect x="60" y="352" width="360" height="34" rx="6" fill="#ffffff" stroke="#ee0000" stroke-width="2"/>
    <text x="72" y="374">touch /.autorelabel   ← chroot 안</text>
    <rect x="60" y="394" width="360" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="72" y="416">exit   →   exit</text>
  </g>

  <!-- Right column: init=/bin/bash -->
  <rect x="520" y="140" width="400" height="300" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="720" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">B. init=/bin/bash (rd.break가 막힐 때)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <rect x="540" y="184" width="360" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="552" y="206">ro → rw, 끝에 init=/bin/bash</text>
    <rect x="540" y="226" width="360" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="552" y="248">mount -o remount,rw /</text>
    <rect x="540" y="268" width="360" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="552" y="290" fill="#64748b">(chroot 불필요 — 이미 실제 루트)</text>
    <rect x="540" y="310" width="360" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="552" y="332">passwd root</text>
    <rect x="540" y="352" width="360" height="34" rx="6" fill="#ffffff" stroke="#ee0000" stroke-width="2"/>
    <text x="552" y="374">touch /.autorelabel</text>
    <rect x="540" y="394" width="360" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="552" y="416">exec /sbin/init</text>
  </g>

  <!-- Arrows from start -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M400,112 L240,136" marker-end="url(#arrow)"/>
    <path d="M560,112 L720,136" marker-end="url(#arrow)"/>
    <path d="M240,440 L420,474" marker-end="url(#arrow)"/>
    <path d="M720,440 L540,474" marker-end="url(#arrow)"/>
    <line x1="480" y1="530" x2="480" y2="546" marker-end="url(#arrow)"/>
  </g>
  <text x="480" y="132" text-anchor="middle" font-size="12" fill="#64748b">비밀번호를 요구하면 B로</text>

  <!-- Relabel -->
  <rect x="300" y="478" width="360" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">부팅 중 SELinux 전체 재레이블</text>
  <text x="480" y="520" text-anchor="middle" font-size="12" fill="#92400e">끝나면 자동으로 한 번 더 재부팅 — 끄지 말고 대기</text>

  <rect x="300" y="550" width="360" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">root 로그인 · getenforce = Enforcing</text>
</svg>
