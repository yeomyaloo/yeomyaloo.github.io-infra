<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">firewalld — 들어온 패킷의 zone 고르기</text>

  <!-- packet -->
  <rect x="20" y="170" width="160" height="80" rx="12" fill="#e2e8f0" stroke="#64748b"/>
  <text x="100" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">들어온 패킷</text>
  <text x="100" y="224" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">src 192.168.56.12</text>
  <text x="100" y="240" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">in  eth1</text>

  <!-- decisions -->
  <rect x="230" y="70" width="290" height="80" rx="10" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="250" y="98" font-size="15" font-weight="700" fill="#991b1b">① 출발지가 zone source에 있나?</text>
  <text x="250" y="124" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">--zone=work --add-source=…</text>

  <rect x="230" y="180" width="290" height="80" rx="10" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="250" y="208" font-size="15" font-weight="700" fill="#991b1b">② 인터페이스가 속한 zone?</text>
  <text x="250" y="234" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">nmcli … connection.zone internal</text>

  <rect x="230" y="290" width="290" height="80" rx="10" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="250" y="318" font-size="15" font-weight="700" fill="#991b1b">③ 둘 다 아니면 기본 zone</text>
  <text x="250" y="344" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">--set-default-zone=public</text>

  <!-- results -->
  <rect x="600" y="70" width="340" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="620" y="98" font-size="15" font-weight="700" fill="#14532d">work zone 규칙 적용</text>
  <text x="620" y="124" font-size="12" fill="#14532d">services: ssh  (serverb만 SSH 허용)</text>

  <rect x="600" y="180" width="340" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="620" y="208" font-size="15" font-weight="700" fill="#334155">internal zone 규칙 적용</text>
  <text x="620" y="234" font-size="12" fill="#334155">eth1로 온 그 밖의 출발지 (ssh 제거)</text>

  <rect x="600" y="290" width="340" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="620" y="318" font-size="15" font-weight="700" fill="#334155">public zone 규칙 적용</text>
  <text x="620" y="344" font-size="12" fill="#334155">NAT NIC(eth0) 등 — vagrant ssh 유지</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="180" y1="200" x2="226" y2="120" marker-end="url(#arrow)"/>
    <line x1="520" y1="110" x2="596" y2="110" marker-end="url(#arrow)"/>
    <line x1="375" y1="150" x2="375" y2="176" marker-end="url(#arrow)"/>
    <line x1="520" y1="220" x2="596" y2="220" marker-end="url(#arrow)"/>
    <line x1="375" y1="260" x2="375" y2="286" marker-end="url(#arrow)"/>
    <line x1="520" y1="330" x2="596" y2="330" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="558" y="102" text-anchor="middle">예</text>
    <text x="388" y="168">아니오</text>
    <text x="558" y="212" text-anchor="middle">예</text>
    <text x="388" y="278">아니오</text>
  </g>

  <text x="480" y="410" text-anchor="middle" font-size="14" fill="#991b1b">패킷당 zone은 하나 — 고른 zone의 규칙만 본다.  규칙은 --permanent 로 넣고 --reload</text>
</svg>
