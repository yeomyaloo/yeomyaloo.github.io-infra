<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RPM 저장소(dnf)와 Flatpak remote</text>

  <!-- RPM lane -->
  <rect x="20" y="56" width="920" height="226" rx="12" fill="#fde8e8" stroke="#ee0000" stroke-width="2"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#991b1b">RPM · dnf</text>

  <rect x="40" y="100" width="160" height="70" rx="10" fill="#ffffff" stroke="#ee0000"/>
  <text x="120" y="130" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#0f172a">dnf install</text>
  <text x="120" y="154" text-anchor="middle" font-size="12" fill="#64748b">servera</text>

  <rect x="250" y="96" width="290" height="170" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="395" y="120" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#334155">/etc/yum.repos.d/lab.repo</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="266" y="148">[lab-custom]</text>
    <text x="266" y="170">baseurl=http://serverb…/custom</text>
    <text x="266" y="192">enabled=1</text>
    <text x="266" y="214">gpgcheck=1</text>
    <text x="266" y="236">gpgkey=file:///etc/pki/rpm-gpg/…</text>
  </g>

  <rect x="600" y="96" width="320" height="170" rx="10" fill="#fde68a"/>
  <text x="760" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">serverb · httpd</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#78350f">
    <text x="620" y="150">/custom/</text>
    <text x="640" y="172">├ repodata/repomd.xml</text>
    <text x="640" y="194">├ tree-….rpm</text>
    <text x="640" y="216">└ lsof-….rpm</text>
    <text x="620" y="246">/dvd/BaseOS  /dvd/AppStream</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="135" x2="246" y2="135" marker-end="url(#arrow)"/>
    <line x1="540" y1="170" x2="596" y2="170" marker-end="url(#arrow)"/>
  </g>
  <text x="223" y="124" text-anchor="middle" font-size="11" fill="#334155">읽기</text>
  <text x="568" y="160" text-anchor="middle" font-size="11" fill="#334155">HTTP</text>
  <text x="40" y="202" font-size="12" fill="#334155">설치 후 조회:</text>
  <text x="40" y="222" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">rpm -q / -ql / -qf</text>
  <text x="40" y="242" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">dnf history undo</text>

  <!-- Flatpak lane -->
  <rect x="20" y="300" width="920" height="220" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="40" y="328" font-size="16" font-weight="700" fill="#312e81">Flatpak</text>

  <rect x="40" y="344" width="200" height="70" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="140" y="372" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#0f172a">flatpak remote-add</text>
  <text x="140" y="396" text-anchor="middle" font-size="12" fill="#64748b">remote 이름 + URL</text>

  <rect x="40" y="430" width="200" height="70" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="140" y="458" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#0f172a">flatpak install</text>
  <text x="140" y="482" text-anchor="middle" font-size="12" fill="#64748b">remote + 앱 ID</text>

  <rect x="300" y="344" width="260" height="156" rx="10" fill="#c7d2fe"/>
  <text x="430" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">remote: flathub</text>
  <text x="430" y="394" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#312e81">dl.flathub.org/…/flathub.flatpakrepo</text>
  <rect x="320" y="408" width="220" height="34" rx="6" fill="#ffffff"/>
  <text x="430" y="430" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">앱 org.gnome.Calculator</text>
  <rect x="320" y="450" width="220" height="34" rx="6" fill="#ffffff"/>
  <text x="430" y="472" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">런타임 org.gnome.Platform</text>

  <rect x="620" y="344" width="300" height="70" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="636" y="370" font-size="13" font-weight="700" fill="#14532d">system (기본, root)</text>
  <text x="636" y="394" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">/var/lib/flatpak — 모든 사용자</text>
  <rect x="620" y="430" width="300" height="70" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="636" y="456" font-size="13" font-weight="700" fill="#334155">--user</text>
  <text x="636" y="480" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">~/.local/share/flatpak — 본인만</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="240" y1="379" x2="296" y2="379" marker-end="url(#arrow)"/>
    <line x1="240" y1="465" x2="296" y2="465" marker-end="url(#arrow)"/>
    <line x1="560" y1="422" x2="616" y2="385" marker-end="url(#arrow)"/>
    <line x1="560" y1="422" x2="616" y2="459" marker-end="url(#arrow)"/>
  </g>
  <text x="590" y="426" text-anchor="middle" font-size="11" fill="#334155">설치</text>
</svg>
