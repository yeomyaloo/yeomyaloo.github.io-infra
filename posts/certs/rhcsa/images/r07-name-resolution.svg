<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">호스트명 해석 순서 — "serverb"는 어떻게 IP가 되나</text>

  <!-- app -->
  <rect x="20" y="80" width="200" height="110" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">애플리케이션</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155" text-anchor="middle">
    <text x="120" y="134">ping serverb</text>
    <text x="120" y="154">ssh serverb</text>
    <text x="120" y="174">getent hosts serverb</text>
  </g>

  <!-- nsswitch -->
  <rect x="270" y="80" width="250" height="110" rx="12" fill="#ee0000"/>
  <text x="395" y="110" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#ffffff">/etc/nsswitch.conf</text>
  <text x="395" y="140" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#ffffff">hosts: files dns myhostname</text>
  <text x="395" y="170" text-anchor="middle" font-size="12" fill="#fde8e8">(authselect가 관리)</text>

  <!-- sources -->
  <rect x="580" y="60" width="360" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="600" y="88" font-size="15" font-weight="700" fill="#14532d">① files → /etc/hosts</text>
  <text x="600" y="114" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">192.168.56.12 serverb.lab.example serverb</text>

  <rect x="580" y="160" width="360" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="188" font-size="15" font-weight="700" fill="#78350f">② dns → /etc/resolv.conf</text>
  <text x="600" y="212" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">search lab.example</text>
  <text x="600" y="232" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">nameserver 192.168.56.12</text>

  <rect x="580" y="270" width="360" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="600" y="298" font-size="15" font-weight="700" fill="#334155">③ myhostname</text>
  <text x="600" y="318" font-size="12" fill="#64748b">자기 호스트명은 항상 해석 (systemd)</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="135" x2="266" y2="135" marker-end="url(#arrow)"/>
    <line x1="520" y1="110" x2="576" y2="100" marker-end="url(#arrow)"/>
    <line x1="520" y1="140" x2="576" y2="200" marker-end="url(#arrow)"/>
    <line x1="520" y1="170" x2="576" y2="295" marker-end="url(#arrow)"/>
  </g>
  <text x="548" y="92" text-anchor="middle" font-size="11" fill="#334155">1순위</text>

  <!-- notes -->
  <rect x="20" y="230" width="500" height="170" rx="10" fill="#fde8e8" stroke="#ee0000"/>
  <text x="40" y="258" font-size="15" font-weight="700" fill="#991b1b">검증 도구의 차이</text>
  <g font-size="13" fill="#0f172a">
    <text x="40" y="286"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">getent hosts</tspan> : nsswitch 순서 그대로 (시스템 시각)</text>
    <text x="40" y="312"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">dig / host</tspan> : DNS만 질의, /etc/hosts 무시</text>
    <text x="40" y="338"><tspan font-family="Consolas,'D2Coding',monospace" font-weight="700">hostnamectl</tspan> : 내 이름은 /etc/hostname</text>
    <text x="40" y="364">resolv.conf는 nmcli의 ipv4.dns 로 바꾼다</text>
    <text x="40" y="386" fill="#64748b">(직접 편집하면 NetworkManager가 덮어씀)</text>
  </g>
  <text x="760" y="372" text-anchor="middle" font-size="13" fill="#334155">앞 소스에서 찾으면 거기서 멈춘다</text>
</svg>
