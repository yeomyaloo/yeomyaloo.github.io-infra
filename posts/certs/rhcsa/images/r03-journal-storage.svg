<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">로그가 남는 길 — journald와 rsyslog</text>

  <!-- Sources -->
  <rect x="20" y="70" width="190" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">로그 출처</text>
  <g font-size="13" text-anchor="middle" fill="#334155">
    <rect x="40" y="114" width="150" height="34" rx="17" fill="#e2e8f0"/><text x="115" y="136">커널 (journalctl -k)</text>
    <rect x="40" y="158" width="150" height="34" rx="17" fill="#e2e8f0"/><text x="115" y="180">서비스 stdout/stderr</text>
    <rect x="40" y="202" width="150" height="34" rx="17" fill="#e2e8f0"/><text x="115" y="224">syslog(), logger</text>
    <rect x="40" y="246" width="150" height="34" rx="17" fill="#e2e8f0"/><text x="115" y="268">systemd 자체</text>
  </g>

  <!-- journald -->
  <rect x="270" y="140" width="200" height="90" rx="10" fill="#ee0000"/>
  <text x="370" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">systemd-journald</text>
  <text x="370" y="202" text-anchor="middle" font-size="13" fill="#fde8e8">바이너리 journal 기록</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="210" y1="185" x2="266" y2="185" marker-end="url(#arrow)"/>
    <path d="M470,165 L560,100" marker-end="url(#arrow)"/>
    <path d="M470,205 L560,270" marker-end="url(#arrow)"/>
    <line x1="370" y1="230" x2="370" y2="346" marker-end="url(#arrow)"/>
  </g>

  <!-- volatile -->
  <rect x="564" y="56" width="376" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="584" y="82" font-size="15" font-weight="700" fill="#78350f">/var/log/journal 없음 (Storage=auto)</text>
  <text x="584" y="106" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">/run/log/journal/  ← 메모리(tmpfs)</text>
  <text x="584" y="130" font-size="13" fill="#b91c1c">재부팅하면 사라짐 → 이전 부팅 로그 없음</text>

  <!-- persistent -->
  <rect x="564" y="226" width="376" height="96" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="584" y="252" font-size="15" font-weight="700" fill="#14532d">Storage=persistent 또는 디렉터리 생성</text>
  <text x="584" y="276" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">/var/log/journal/&lt;machine-id&gt;/</text>
  <text x="584" y="300" font-size="13" fill="#14532d">재부팅 후에도 유지 → journalctl -b -1</text>

  <!-- rsyslog -->
  <rect x="270" y="350" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="370" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">rsyslog</text>
  <text x="370" y="410" text-anchor="middle" font-size="13" fill="#64748b">journal에서 받아 텍스트로</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="470" y1="395" x2="560" y2="395" marker-end="url(#arrow)"/>
  </g>
  <rect x="564" y="350" width="376" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">
    <text x="584" y="376">/var/log/messages</text>
    <text x="584" y="398">/var/log/secure</text>
    <text x="584" y="420">/var/log/cron</text>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="770" y="376">일반 메시지</text>
    <text x="770" y="398">인증·sudo</text>
    <text x="770" y="420">cron 작업</text>
  </g>

  <text x="20" y="340" font-size="12" fill="#64748b">확인: journalctl --list-boots</text>
  <text x="20" y="360" font-size="12" fill="#64748b">(재부팅 후 2줄 이상이면 영구 보존 성공)</text>
</svg>
