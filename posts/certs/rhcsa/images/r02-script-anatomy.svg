<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">셸 스크립트의 구성 요소와 종료 코드</text>

  <!-- invocation -->
  <rect x="30" y="60" width="430" height="44" rx="8" fill="#0f172a"/>
  <text x="46" y="88" font-family="Consolas,'D2Coding',monospace" font-size="15" fill="#86efac">$ pingcheck /root/hosts.txt ; echo $?</text>

  <!-- script -->
  <rect x="30" y="120" width="430" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">
    <text x="46" y="148" fill="#64748b">#!/bin/bash</text>
    <text x="46" y="180">[ -r "$1" ] || { echo … &gt;&amp;2; exit 1; }</text>
    <text x="46" y="212">rc=0</text>
    <text x="46" y="244">while read -r host; do</text>
    <text x="70" y="272">if ping -c1 -W1 "$host" &amp;&gt;/dev/null</text>
    <text x="70" y="298">then echo "$host UP"</text>
    <text x="70" y="324">else echo "$host DOWN"; rc=3</text>
    <text x="70" y="350">fi</text>
    <text x="46" y="378">done &lt; "$1"</text>
    <text x="46" y="414">exit $rc</text>
  </g>

  <!-- annotations -->
  <g font-size="13">
    <rect x="540" y="128" width="390" height="40" rx="8" fill="#e2e8f0"/>
    <text x="556" y="153" fill="#0f172a"><tspan font-weight="700">셔뱅</tspan> — 어떤 인터프리터로 실행할지</text>

    <rect x="540" y="160" width="390" height="40" rx="8" fill="#fde8e8" stroke="#ee0000" transform="translate(0,16)"/>
    <text x="556" y="201" fill="#991b1b"><tspan font-weight="700">인자 검사</tspan> — $1, test [ ], 실패 시 exit 1</text>

    <rect x="540" y="232" width="390" height="40" rx="8" fill="#c7d2fe"/>
    <text x="556" y="257" fill="#312e81"><tspan font-weight="700">반복문</tspan> — 파일을 한 줄씩 (while read -r)</text>

    <rect x="540" y="284" width="390" height="40" rx="8" fill="#fde68a"/>
    <text x="556" y="309" fill="#78350f"><tspan font-weight="700">조건문</tspan> — 명령의 종료 코드 0이면 참</text>

    <rect x="540" y="358" width="390" height="40" rx="8" fill="#c7d2fe"/>
    <text x="556" y="383" fill="#312e81"><tspan font-weight="700">입력 리다이렉션</tspan> — 반복문 전체에 파일 연결</text>

    <rect x="540" y="408" width="390" height="40" rx="8" fill="#86efac"/>
    <text x="556" y="433" fill="#14532d"><tspan font-weight="700">종료 코드</tspan> — 0 성공, 1~255 실패 → 호출자의 $?</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="160" y1="144" x2="536" y2="148" marker-end="url(#arrow)"/>
    <line x1="420" y1="176" x2="536" y2="196" marker-end="url(#arrow)"/>
    <line x1="250" y1="240" x2="536" y2="252" marker-end="url(#arrow)"/>
    <line x1="440" y1="268" x2="536" y2="300" marker-end="url(#arrow)"/>
    <line x1="160" y1="374" x2="536" y2="378" marker-end="url(#arrow)"/>
    <line x1="140" y1="410" x2="536" y2="428" marker-end="url(#arrow)"/>
  </g>

  <text x="480" y="480" text-anchor="middle" font-size="13" fill="#64748b">검증 습관: 정상 인자 · 인자 없음 · 잘못된 인자 세 경우를 모두 실행하고 echo $? 확인</text>
</svg>
