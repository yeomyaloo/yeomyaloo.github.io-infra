<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Kerberos — 티켓 두 장으로 끝나는 인증</text>

  <rect x="275" y="44" width="460" height="426" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-dasharray="6 4"/>
  <text x="505" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">KDC (키 배포 센터)</text>

  <rect x="40" y="80" width="180" height="44" rx="8" fill="#e2e8f0" stroke="#334155"/>
  <text x="130" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">사용자 (클라이언트)</text>
  <rect x="290" y="80" width="180" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="380" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AS (인증 서버)</text>
  <rect x="540" y="80" width="180" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="630" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TGS (티켓 발급)</text>
  <rect x="770" y="80" width="170" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="855" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">서비스 서버</text>

  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="130" y1="124" x2="130" y2="460"/>
    <line x1="380" y1="124" x2="380" y2="460"/>
    <line x1="630" y1="124" x2="630" y2="460"/>
    <line x1="855" y1="124" x2="855" y2="460"/>
  </g>

  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="132" y1="170" x2="376" y2="170"/>
    <line x1="378" y1="218" x2="134" y2="218"/>
    <line x1="132" y1="280" x2="626" y2="280"/>
    <line x1="628" y1="328" x2="134" y2="328"/>
    <line x1="132" y1="392" x2="851" y2="392"/>
    <line x1="853" y1="440" x2="134" y2="440"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle" stroke="#eef2ff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
    <text x="255" y="162">① AS-REQ: 사용자 ID, 시각</text>
    <text x="255" y="210">② AS-REP: TGT + TGS 세션키</text>
    <text x="380" y="272">③ TGS-REQ: TGT + 인증자 + 서비스 이름</text>
    <text x="380" y="320">④ TGS-REP: 서비스 티켓 + 서비스 세션키</text>
    <text x="492" y="384">⑤ AP-REQ: 서비스 티켓 + 인증자</text>
    <text x="492" y="432">⑥ AP-REP: 서버도 자신을 증명 (상호 인증, 선택)</text>
  </g>

  <rect x="40" y="484" width="880" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="508" font-size="14" fill="#334155">• <tspan font-weight="700">대칭키</tspan> 기반 · 패스워드는 네트워크로 보내지 않음 · TGT로 TGS에 반복 요청 → SSO</text>
  <text x="60" y="532" font-size="14" fill="#334155">• 인증자에 <tspan font-weight="700">타임스탬프</tspan> → 재전송 방지 → 시간 동기 필수 · KDC는 <tspan font-weight="700" fill="#dc2626">단일 실패 지점</tspan></text>
</svg>
