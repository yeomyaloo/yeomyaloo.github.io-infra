<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">유형별 답안 뼈대 — 채점자가 찾는 순서대로</text>

  <!-- Short answer -->
  <rect x="20" y="56" width="280" height="404" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="160" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">단답형 (3점)</text>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="45" y="106" width="230" height="48" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="160" y="136">① 정식 용어</text>
    <rect x="45" y="178" width="230" height="48" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="160" y="208">② 약어 + 풀네임</text>
    <rect x="45" y="250" width="230" height="48" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="160" y="280">③ 단위 · 답 개수 확인</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="160" y1="154" x2="160" y2="175"/>
    <line x1="160" y1="226" x2="160" y2="247"/>
  </g>
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#334155">예: (A) 경로 조작</text>
  <text x="160" y="360" text-anchor="middle" font-size="13" fill="#334155">(Path Traversal)</text>
  <text x="160" y="400" text-anchor="middle" font-size="13" fill="#64748b">모르면 관련 키워드라도</text>

  <!-- Essay -->
  <rect x="340" y="56" width="280" height="404" rx="12" fill="#e0f2fe" stroke="#2496ed" stroke-width="2"/>
  <text x="480" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">서술형 (12점)</text>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="365" y="106" width="230" height="48" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="480" y="136">① 정의</text>
    <rect x="365" y="178" width="230" height="48" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="480" y="208">② 원리 · 동작 (근거 인용)</text>
    <rect x="365" y="250" width="230" height="48" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="480" y="280">③ 영향 (깨지는 CIA)</text>
    <rect x="365" y="322" width="230" height="48" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="480" y="352">④ 대책 (기술 + 관리)</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="480" y1="154" x2="480" y2="175"/>
    <line x1="480" y1="226" x2="480" y2="247"/>
    <line x1="480" y1="298" x2="480" y2="319"/>
  </g>
  <text x="480" y="410" text-anchor="middle" font-size="13" fill="#64748b">번호 · 소제목으로 키워드를 드러낸다</text>

  <!-- Practical -->
  <rect x="660" y="56" width="280" height="404" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="800" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">실무형 (16점)</text>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="685" y="102" width="230" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="800" y="130">① 현황 분석</text>
    <rect x="685" y="166" width="230" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="800" y="194">② 발견 사항 (근거 줄)</text>
    <rect x="685" y="230" width="230" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="800" y="258">③ 위험 · 영향</text>
    <rect x="685" y="294" width="230" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="800" y="322">④ 조치 (설정 · 명령)</text>
    <rect x="685" y="358" width="230" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="800" y="386">⑤ 검증</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="800" y1="146" x2="800" y2="163"/>
    <line x1="800" y1="210" x2="800" y2="227"/>
    <line x1="800" y1="274" x2="800" y2="291"/>
    <line x1="800" y1="338" x2="800" y2="355"/>
  </g>
  <text x="800" y="432" text-anchor="middle" font-size="13" fill="#64748b">해킹 11 보고서 순서와 같다</text>
</svg>
