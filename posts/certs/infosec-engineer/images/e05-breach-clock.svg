<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <style>.halo{stroke:#ffffff;stroke-width:6px;stroke-linejoin:round;paint-order:stroke}</style>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">사고를 알게 된 순간부터 — 신고·통지 시계 (2026-11-19 현행)</text>

  <!-- axis: 0h at x=240, 72h at x=900 (9.1667 px/h) -->
  <line x1="240" y1="70" x2="240" y2="400" stroke="#dc2626" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"><line x1="460" y1="70" x2="460" y2="166"/><line x1="460" y1="186" x2="460" y2="246"/><line x1="460" y1="266" x2="460" y2="348"/><line x1="460" y1="374" x2="460" y2="400"/></g>
  <line x1="900" y1="70" x2="900" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="240" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">알게 된 때 (0h)</text>
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#334155">24h</text>
  <text x="900" y="66" text-anchor="middle" font-size="13" fill="#334155">72h</text>

  <!-- Row 1: network act -->
  <text x="20" y="112" font-size="14" font-weight="700" fill="#0f172a">정보통신망법</text>
  <text x="20" y="132" font-size="12" fill="#64748b">제48조의3 (침해사고)</text>
  <text x="250" y="100" font-size="13" fill="#0f172a">과기정통부 또는 KISA에 신고</text>
  <rect x="240" y="108" width="220" height="26" rx="6" fill="#2496ed"/>
  <text x="350" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">24시간 이내</text>

  <!-- Row 2: privacy notification -->
  <text x="20" y="192" font-size="14" font-weight="700" fill="#0f172a">개인정보 보호법</text>
  <text x="20" y="212" font-size="12" fill="#64748b">제34조①, 시행령 제39조</text>
  <text class="halo" x="250" y="180" font-size="13" fill="#0f172a">정보주체에게 유출 통지 (항목·경위·피해 최소화 방법·구제 절차 등)</text>
  <rect x="240" y="188" width="660" height="26" rx="6" fill="#4f46e5"/>
  <text x="570" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">72시간 이내 (긴급 차단 조치 등 사유가 있으면 해소 후 즉시)</text>

  <!-- Row 3: privacy report -->
  <text x="20" y="272" font-size="14" font-weight="700" fill="#0f172a">개인정보 보호법</text>
  <text x="20" y="292" font-size="12" fill="#64748b">제34조④, 시행령 제40조</text>
  <text class="halo" x="250" y="260" font-size="13" fill="#0f172a">보호위원회 또는 KISA에 신고 — 1천명 이상 · 민감/고유식별정보 · 외부 불법 접근 중 하나</text>
  <rect x="240" y="268" width="660" height="26" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="570" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">72시간 이내 (확인 못 한 내용은 우선 신고 후 보완)</text>

  <!-- Row 4: CIIP -->
  <text x="20" y="352" font-size="14" font-weight="700" fill="#0f172a">정보통신기반 보호법</text>
  <text x="20" y="372" font-size="12" fill="#64748b">제13조 (주요기반시설)</text>
  <path d="M240,348 L252,360 L240,372 L228,360 Z" fill="#f59e0b"/>
  <text class="halo" x="264" y="365" font-size="13" fill="#0f172a">교란·마비·파괴를 <tspan font-weight="700">인지한 때</tspan> 관계 행정기관, 수사기관 또는 KISA에 통지</text>

  <rect x="20" y="412" width="920" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="435" text-anchor="middle" font-size="13" fill="#334155">공통: 먼저 피해 확산 차단(격리) → 증거 보존 → 분석 · 같은 사고가 여러 법에 동시에 걸릴 수 있다</text>
</svg>
