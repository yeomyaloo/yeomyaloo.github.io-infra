<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">ISMS-P 인증 기준 101개 = 16 + 64 + 21</text>

  <!-- Column 1 -->
  <rect x="20" y="58" width="280" height="46" rx="8" fill="#334155"/>
  <text x="160" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. 관리체계 수립 및 운영 (16)</text>
  <g font-size="13" fill="#0f172a">
    <rect x="20" y="116" width="280" height="30" rx="6" fill="#e2e8f0"/><text x="34" y="136">1.1 관리체계 기반 마련 (6)</text>
    <rect x="20" y="152" width="280" height="30" rx="6" fill="#e2e8f0"/><text x="34" y="172">1.2 위험 관리 (4)</text>
    <rect x="20" y="188" width="280" height="30" rx="6" fill="#e2e8f0"/><text x="34" y="208">1.3 관리체계 운영 (3)</text>
    <rect x="20" y="224" width="280" height="30" rx="6" fill="#e2e8f0"/><text x="34" y="244">1.4 관리체계 점검 및 개선 (3)</text>
  </g>
  <text x="160" y="290" text-anchor="middle" font-size="13" fill="#64748b">계획 → 위험 → 운영 → 점검·개선</text>
  <text x="160" y="310" text-anchor="middle" font-size="13" fill="#64748b">(PDCA 순환)</text>

  <!-- Column 2 -->
  <rect x="320" y="58" width="320" height="46" rx="8" fill="#2496ed"/>
  <text x="480" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. 보호대책 요구사항 (64)</text>
  <g font-size="13" fill="#0f172a">
    <rect x="320" y="116" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="136">2.1 정책, 조직, 자산 관리 (3)</text>
    <rect x="320" y="152" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="172">2.2 인적 보안 (6)</text>
    <rect x="320" y="188" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="208">2.3 외부자 보안 (4)</text>
    <rect x="320" y="224" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="244">2.4 물리 보안 (7)</text>
    <rect x="320" y="260" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="280">2.5 인증 및 권한 관리 (6)</text>
    <rect x="320" y="296" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="316">2.6 접근통제 (7)</text>
    <rect x="320" y="332" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="352">2.7 암호화 적용 (2)</text>
    <rect x="320" y="368" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="388">2.8 정보시스템 도입 및 개발 보안 (6)</text>
    <rect x="320" y="404" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="424">2.9 시스템 및 서비스 운영관리 (7)</text>
    <rect x="320" y="440" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="460">2.10 시스템 및 서비스 보안관리 (9)</text>
    <rect x="320" y="476" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="496">2.11 사고 예방 및 대응 (5)</text>
    <rect x="320" y="512" width="320" height="30" rx="6" fill="#dbeafe"/><text x="334" y="532">2.12 재해복구 (2)</text>
  </g>

  <!-- Column 3 -->
  <rect x="660" y="58" width="280" height="46" rx="8" fill="#4f46e5"/>
  <text x="800" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. 개인정보 처리 단계별 (21)</text>
  <g font-size="13" fill="#0f172a">
    <rect x="660" y="116" width="280" height="30" rx="6" fill="#e0e7ff"/><text x="674" y="136">3.1 수집 시 보호조치 (7)</text>
    <rect x="660" y="152" width="280" height="30" rx="6" fill="#e0e7ff"/><text x="674" y="172">3.2 보유·이용 시 보호조치 (5)</text>
    <rect x="660" y="188" width="280" height="30" rx="6" fill="#e0e7ff"/><text x="674" y="208">3.3 제공 시 보호조치 (4)</text>
    <rect x="660" y="224" width="280" height="30" rx="6" fill="#e0e7ff"/><text x="674" y="244">3.4 파기 시 보호조치 (2)</text>
    <rect x="660" y="260" width="280" height="30" rx="6" fill="#e0e7ff"/><text x="674" y="280">3.5 정보주체 권리보호 (3)</text>
  </g>
  <text x="800" y="326" text-anchor="middle" font-size="13" fill="#64748b">수집 → 보유·이용 → 제공 → 파기</text>
  <text x="800" y="346" text-anchor="middle" font-size="13" fill="#64748b">개인정보 생애주기 순서</text>
  <text x="800" y="376" text-anchor="middle" font-size="12" fill="#94a3b8">2023년 개정 전에는 22개(합계 102)</text>

  <!-- Brackets -->
  <path d="M20,562 L20,574 L640,574 L640,562" fill="none" stroke="#2496ed" stroke-width="2.5"/>
  <text x="330" y="596" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ISMS 인증 = 1 + 2 영역 = 80개</text>
  <path d="M20,612 L20,624 L940,624 L940,612" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="480" y="648" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">ISMS-P 인증 = 1 + 2 + 3 영역 = 101개 (2026-11-19 확인, privacy.go.kr)</text>
</svg>
