<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">모의고사 합격 판정 — 과락 먼저, 평균 다음</text>

  <!-- Start -->
  <rect x="20" y="145" width="130" height="50" rx="10" fill="#e2e8f0" stroke="#334155"/>
  <text x="85" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">필기 채점</text>
  <text x="85" y="185" text-anchor="middle" font-size="12" fill="#334155">문항당 5점</text>

  <!-- Diamond 1 -->
  <polygon points="290,115 400,170 290,225 180,170" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">모든 과목</text>
  <text x="290" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">정답 8개 이상?</text>

  <!-- Diamond 2 -->
  <polygon points="540,115 650,170 540,225 430,170" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">전체 정답</text>
  <text x="540" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">60개 이상?</text>

  <!-- Pass written -->
  <rect x="690" y="145" width="140" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">필기 합격</text>
  <text x="760" y="185" text-anchor="middle" font-size="12" fill="#14532d">실기로</text>

  <!-- Fail boxes -->
  <rect x="215" y="270" width="150" height="54" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="290" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">과락 불합격</text>
  <text x="290" y="313" text-anchor="middle" font-size="12" fill="#991b1b">해당 과목 편 복기</text>
  <rect x="465" y="270" width="150" height="54" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="540" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">평균 미달 불합격</text>
  <text x="540" y="313" text-anchor="middle" font-size="12" fill="#991b1b">취약 과목부터 보강</text>

  <!-- Diamond 3 -->
  <polygon points="760,250 860,305 760,360 660,305" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="760" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">실기 60점 이상?</text>
  <text x="760" y="320" text-anchor="middle" font-size="12" fill="#334155">(축약 33/55점)</text>

  <rect x="878" y="280" width="72" height="50" rx="10" fill="#16a34a"/>
  <text x="914" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">최종</text>
  <text x="914" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">합격</text>
  <rect x="685" y="392" width="150" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="760" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">실기 재도전</text>
  <text x="760" y="432" text-anchor="middle" font-size="12" fill="#991b1b">E06 문제 반복</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="150" y1="170" x2="177" y2="170"/>
    <line x1="400" y1="170" x2="427" y2="170"/>
    <line x1="650" y1="170" x2="687" y2="170"/>
    <line x1="290" y1="225" x2="290" y2="267"/>
    <line x1="540" y1="225" x2="540" y2="267"/>
    <line x1="760" y1="195" x2="760" y2="247"/>
    <line x1="860" y1="305" x2="875" y2="305"/>
    <line x1="760" y1="360" x2="760" y2="389"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="413" y="160" text-anchor="middle" fill="#16a34a">예</text>
    <text x="668" y="160" text-anchor="middle" fill="#16a34a">예</text>
    <text x="304" y="252" fill="#dc2626">아니오</text>
    <text x="554" y="252" fill="#dc2626">아니오</text>
    <text x="866" y="296" text-anchor="middle" fill="#16a34a">예</text>
    <text x="774" y="380" fill="#dc2626">아니오</text>
  </g>

  <text x="20" y="400" font-size="13" fill="#334155">• 과목 40점 = 20문항 중 8개, 평균 60점 = 100문항 중 60개</text>
  <text x="20" y="424" font-size="13" fill="#334155">• 평균이 높아도 한 과목 7개 이하면 불합격 (판정 예시 "나")</text>
  <text x="20" y="448" font-size="13" fill="#64748b">• 기준은 2026-11-19 안내 자료 일치값 — 응시 전 KCA 공고 확인</text>
</svg>
