<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">위험 관리 절차와 업무 연속성의 두 시계 (RPO · RTO)</text>

  <!-- Left: risk process -->
  <rect x="20" y="56" width="420" height="424" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#0f172a">위험 관리 (ISMS-P 1.2)</text>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="110" y="100" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="260" y="129">① 자산 식별 · 가치 평가</text>
    <rect x="110" y="172" width="300" height="46" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="260" y="201">② 위협 · 취약성 분석</text>
    <rect x="110" y="244" width="300" height="46" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="260" y="273">③ 위험 평가 (ALE = AV×EF×ARO)</text>
    <rect x="110" y="316" width="300" height="46" rx="8" fill="#dbeafe" stroke="#2496ed"/>
    <text x="260" y="345">④ 대책 선정: 감소·전가·회피·수용</text>
    <rect x="110" y="388" width="300" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="260" y="417">⑤ 잔여 위험 ≤ DoA → 경영진 승인</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="146" x2="260" y2="169"/>
    <line x1="260" y1="218" x2="260" y2="241"/>
    <line x1="260" y1="290" x2="260" y2="313"/>
    <line x1="260" y1="362" x2="260" y2="385"/>
  </g>
  <path d="M110,411 L70,411 L70,123 L106,123" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="58" y="270" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 58 270)">주기적 재평가</text>
  <text x="230" y="464" text-anchor="middle" font-size="13" fill="#64748b">위험 = 자산 × 위협 × 취약성</text>

  <!-- Right: RPO / RTO timeline -->
  <rect x="460" y="56" width="480" height="424" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="480" y="84" font-size="16" font-weight="700" fill="#0f172a">BCP · DRP — 사고 앞뒤의 두 구간</text>
  <line x1="490" y1="230" x2="920" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="560" cy="230" r="8" fill="#2496ed"/>
  <circle cx="700" cy="230" r="9" fill="#dc2626"/>
  <circle cx="870" cy="230" r="8" fill="#16a34a"/>
  <text x="560" y="262" text-anchor="middle" font-size="13" fill="#1e3a8a">마지막 백업</text>
  <text x="700" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">사고 발생</text>
  <text x="870" y="262" text-anchor="middle" font-size="13" fill="#14532d">업무 재개</text>

  <path d="M560,190 L560,178 L700,178 L700,190" fill="none" stroke="#2496ed" stroke-width="2.5"/>
  <text x="630" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">RPO</text>
  <text x="630" y="168" text-anchor="middle" font-size="12" fill="#1e3a8a">잃어도 되는 데이터</text>
  <path d="M700,282 L700,294 L870,294 L870,282" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="785" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">RTO</text>
  <text x="785" y="334" text-anchor="middle" font-size="12" fill="#14532d">멈춰 있어도 되는 시간</text>
  <text x="700" y="120" text-anchor="middle" font-size="13" fill="#334155">BIA가 두 값을 정한다 · RTO ≤ MTD</text>

  <g font-size="13" text-anchor="middle">
    <rect x="490" y="372" width="100" height="40" rx="8" fill="#16a34a"/><text x="540" y="397" fill="#ffffff" font-weight="700">미러</text>
    <rect x="602" y="372" width="100" height="40" rx="8" fill="#86efac"/><text x="652" y="397" fill="#0f172a" font-weight="700">핫</text>
    <rect x="714" y="372" width="100" height="40" rx="8" fill="#fde68a"/><text x="764" y="397" fill="#0f172a" font-weight="700">웜</text>
    <rect x="826" y="372" width="100" height="40" rx="8" fill="#e2e8f0"/><text x="876" y="397" fill="#0f172a" font-weight="700">콜드</text>
  </g>
  <line x1="490" y1="430" x2="926" y2="430" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="490" y="456" font-size="13" fill="#334155">RTO 짧음 · 비용 큼</text>
  <text x="926" y="456" text-anchor="end" font-size="13" fill="#334155">RTO 김 · 비용 작음</text>
</svg>
