<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">암호화와 전자서명 — 어떤 키로, 무엇을 보장하나</text>

  <!-- Panel 1: public key encryption -->
  <rect x="20" y="56" width="450" height="200" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#1e3a8a">공개키 암호화 → 기밀성</text>
  <rect x="40" y="104" width="100" height="50" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="90" y="135" text-anchor="middle" font-size="15" fill="#0f172a">평문</text>
  <rect x="185" y="104" width="110" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="240" y="135" text-anchor="middle" font-size="15" fill="#0f172a">암호문</text>
  <rect x="340" y="104" width="110" height="50" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="395" y="135" text-anchor="middle" font-size="15" fill="#0f172a">평문</text>
  <line x1="142" y1="129" x2="182" y2="129" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="297" y1="129" x2="337" y2="129" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2496ed">①</text>
  <text x="317" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2496ed">②</text>
  <text x="40" y="190" font-size="14" fill="#334155">① 받는 사람(B)의 <tspan font-weight="700">공개키</tspan>로 암호화</text>
  <text x="40" y="216" font-size="14" fill="#334155">② B만 가진 <tspan font-weight="700">개인키</tspan>로 복호화</text>
  <text x="40" y="242" font-size="13" fill="#64748b">실제로는 세션키(대칭키)만 이렇게 보낸다 = 하이브리드</text>

  <!-- Panel 2: digital signature -->
  <rect x="490" y="56" width="450" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="510" y="84" font-size="16" font-weight="700" fill="#312e81">전자서명 → 무결성 · 인증 · 부인방지</text>
  <rect x="510" y="104" width="100" height="50" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="560" y="135" text-anchor="middle" font-size="15" fill="#0f172a">문서 해시</text>
  <rect x="655" y="104" width="110" height="50" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="710" y="135" text-anchor="middle" font-size="15" fill="#0f172a">서명값</text>
  <rect x="810" y="104" width="110" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="865" y="135" text-anchor="middle" font-size="15" fill="#0f172a">검증 성공</text>
  <line x1="612" y1="129" x2="652" y2="129" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="767" y1="129" x2="807" y2="129" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="632" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">①</text>
  <text x="787" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">②</text>
  <text x="510" y="190" font-size="14" fill="#334155">① 보내는 사람(A)의 <tspan font-weight="700">개인키</tspan>로 서명</text>
  <text x="510" y="216" font-size="14" fill="#334155">② A의 <tspan font-weight="700">공개키</tspan>로 검증 + 해시 비교</text>
  <text x="510" y="242" font-size="13" fill="#64748b">기밀성은 없다 — 문서 자체는 누구나 읽을 수 있음</text>

  <!-- Matrix -->
  <text x="60" y="292" font-size="16" font-weight="700" fill="#0f172a">보장하는 것 한눈에 보기</text>
  <g font-size="14">
    <rect x="60" y="304" width="840" height="40" fill="#334155"/>
    <text x="140" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">방식</text>
    <text x="320" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">쓰는 키</text>
    <text x="480" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">기밀성</text>
    <text x="600" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">무결성</text>
    <text x="720" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">출처 인증</text>
    <text x="840" y="329" text-anchor="middle" fill="#ffffff" font-weight="700">부인방지</text>
  </g>
  <g stroke="#e2e8f0">
    <rect x="60" y="344" width="840" height="46" fill="#f8fafc"/>
    <rect x="60" y="390" width="840" height="46" fill="#ffffff"/>
    <rect x="60" y="436" width="840" height="46" fill="#f8fafc"/>
    <rect x="60" y="482" width="840" height="46" fill="#ffffff"/>
    <rect x="60" y="528" width="840" height="46" fill="#f8fafc"/>
  </g>
  <g font-size="13" fill="#0f172a">
    <text x="140" y="372" text-anchor="middle">대칭키 암호 (AES·ARIA)</text>
    <text x="140" y="418" text-anchor="middle">공개키 암호 (RSA·ECC)</text>
    <text x="140" y="464" text-anchor="middle">해시 (SHA-256)</text>
    <text x="140" y="510" text-anchor="middle">MAC (HMAC)</text>
    <text x="140" y="556" text-anchor="middle">전자서명 (ECDSA 등)</text>
    <text x="320" y="372" text-anchor="middle">같은 비밀키를 양쪽이 공유</text>
    <text x="320" y="418" text-anchor="middle">받는 사람 공개키 / 개인키</text>
    <text x="320" y="464" text-anchor="middle">키 없음</text>
    <text x="320" y="510" text-anchor="middle">공유 비밀키</text>
    <text x="320" y="556" text-anchor="middle">보내는 사람 개인키 / 공개키</text>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <text x="480" y="374" fill="#16a34a">●</text><text x="600" y="374" fill="#f59e0b">△</text><text x="720" y="374" fill="#94a3b8">—</text><text x="840" y="374" fill="#94a3b8">—</text>
    <text x="480" y="420" fill="#16a34a">●</text><text x="600" y="420" fill="#94a3b8">—</text><text x="720" y="420" fill="#94a3b8">—</text><text x="840" y="420" fill="#94a3b8">—</text>
    <text x="480" y="466" fill="#94a3b8">—</text><text x="600" y="466" fill="#16a34a">●</text><text x="720" y="466" fill="#94a3b8">—</text><text x="840" y="466" fill="#94a3b8">—</text>
    <text x="480" y="512" fill="#94a3b8">—</text><text x="600" y="512" fill="#16a34a">●</text><text x="720" y="512" fill="#16a34a">●</text><text x="840" y="512" fill="#dc2626">✕</text>
    <text x="480" y="558" fill="#94a3b8">—</text><text x="600" y="558" fill="#16a34a">●</text><text x="720" y="558" fill="#16a34a">●</text><text x="840" y="558" fill="#16a34a">●</text>
  </g>
  <text x="60" y="600" font-size="13" fill="#64748b">△ 대칭키라도 GCM 같은 AEAD 모드는 무결성까지 보장 · ✕ MAC은 키를 공유하므로 제3자에게 작성자를 증명하지 못함</text>
</svg>
