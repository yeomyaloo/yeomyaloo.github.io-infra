<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OCI · CRI · CNI · CSI — 누구와 누구 사이의 약속인가</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">화살표 위 색 라벨이 그 구간의 표준</text>

  <!-- row1 -->
  <rect x="40" y="96" width="210" height="70" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="145" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Docker · Buildah · Podman</text>
  <text x="145" y="148" text-anchor="middle" font-size="12" fill="#64748b">이미지 빌드</text>
  <rect x="340" y="96" width="200" height="70" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="440" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">레지스트리</text>
  <text x="440" y="148" text-anchor="middle" font-size="12" fill="#64748b">Harbor · GHCR · Docker Hub</text>
  <line x1="250" y1="131" x2="336" y2="131" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="254" y="104" width="78" height="20" rx="10" fill="#fde68a"/>
  <text x="293" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">OCI image</text>

  <!-- row2 -->
  <rect x="40" y="250" width="180" height="80" rx="8" fill="#326ce5"/>
  <text x="130" y="284" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">kubelet</text>
  <text x="130" y="308" text-anchor="middle" font-size="12" fill="#e8eefc">각 노드</text>
  <rect x="340" y="250" width="200" height="80" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="440" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">containerd / CRI-O</text>
  <text x="440" y="308" text-anchor="middle" font-size="12" fill="#334155">컨테이너 런타임</text>
  <rect x="630" y="250" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="700" y="284" text-anchor="middle" font-size="15" font-weight="700" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">runc / crun</text>
  <text x="700" y="308" text-anchor="middle" font-size="12" fill="#334155">저수준 런타임</text>

  <line x1="220" y1="290" x2="336" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="256" y="262" width="44" height="20" rx="10" fill="#c7d2fe"/>
  <text x="278" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">CRI</text>
  <text x="278" y="312" text-anchor="middle" font-size="11" fill="#64748b">gRPC</text>

  <line x1="540" y1="290" x2="626" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="544" y="262" width="80" height="20" rx="10" fill="#fde68a"/>
  <text x="584" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">OCI runtime</text>

  <line x1="440" y1="166" x2="440" y2="246" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="196" width="134" height="20" rx="10" fill="#fde68a"/>
  <text x="517" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">OCI distribution</text>
  <text x="458" y="236" font-size="11" fill="#64748b">이미지 pull</text>

  <!-- row3 -->
  <rect x="340" y="400" width="200" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">CNI 플러그인</text>
  <text x="440" y="452" text-anchor="middle" font-size="12" fill="#334155">Calico · Cilium · Flannel</text>
  <line x1="440" y1="330" x2="440" y2="396" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="352" width="44" height="20" rx="10" fill="#86efac"/>
  <text x="472" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">CNI</text>
  <text x="502" y="366" font-size="11" fill="#64748b">Pod 네트워크 생성</text>

  <rect x="40" y="400" width="180" height="70" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">CSI 드라이버</text>
  <text x="130" y="452" text-anchor="middle" font-size="12" fill="#334155">볼륨 생성·attach·mount</text>
  <line x1="130" y1="330" x2="130" y2="396" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="352" width="44" height="20" rx="10" fill="#fca5a5"/>
  <text x="162" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">CSI</text>

  <!-- legend -->
  <rect x="800" y="96" width="140" height="374" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="870" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">누가 관리하나</text>
  <rect x="814" y="140" width="112" height="22" rx="11" fill="#fde68a"/>
  <text x="870" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">OCI</text>
  <text x="870" y="182" text-anchor="middle" font-size="11" fill="#334155">Linux Foundation</text>
  <text x="870" y="198" text-anchor="middle" font-size="11" fill="#334155">산하 (CNCF 아님)</text>
  <rect x="814" y="216" width="112" height="22" rx="11" fill="#c7d2fe"/>
  <text x="870" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">CRI</text>
  <text x="870" y="258" text-anchor="middle" font-size="11" fill="#334155">쿠버네티스가 정의</text>
  <text x="870" y="274" text-anchor="middle" font-size="11" fill="#334155">(SIG Node)</text>
  <rect x="814" y="292" width="112" height="22" rx="11" fill="#86efac"/>
  <text x="870" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">CNI</text>
  <text x="870" y="334" text-anchor="middle" font-size="11" fill="#334155">CNCF 프로젝트</text>
  <rect x="814" y="352" width="112" height="22" rx="11" fill="#fca5a5"/>
  <text x="870" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">CSI</text>
  <text x="870" y="394" text-anchor="middle" font-size="11" fill="#334155">컨테이너 오케스트</text>
  <text x="870" y="410" text-anchor="middle" font-size="11" fill="#334155">레이터 공통 명세</text>

  <text x="480" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">표준이 있어서 런타임 · 네트워크 · 스토리지를 쿠버네티스 코드 수정 없이 갈아 끼운다 (벤더 종속 회피)</text>
</svg>
