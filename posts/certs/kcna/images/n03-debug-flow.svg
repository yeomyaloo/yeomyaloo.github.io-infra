<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">증상별 애플리케이션 디버깅 — 첫 명령</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">STATUS 열을 먼저 읽고, 상태에 맞는 도구로 들어간다</text>

  <rect x="30" y="236" width="180" height="72" rx="10" fill="#326ce5"/>
  <text x="120" y="266" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas,'D2Coding',monospace" fill="#ffffff">kubectl get pods</text>
  <text x="120" y="290" text-anchor="middle" font-size="12" fill="#e8eefc">STATUS · RESTARTS</text>

  <!-- rows -->
  <g font-size="14" font-weight="700">
    <rect x="260" y="88" width="210" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="365" y="124" text-anchor="middle" fill="#0f172a">Pending</text>
    <rect x="260" y="168" width="210" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="365" y="204" text-anchor="middle" fill="#0f172a">ImagePullBackOff</text>
    <rect x="260" y="248" width="210" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="365" y="284" text-anchor="middle" fill="#0f172a">CrashLoopBackOff</text>
    <rect x="260" y="328" width="210" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="365" y="356" text-anchor="middle" fill="#0f172a">Running, READY 0/1</text>
    <text x="365" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">트래픽 안 들어옴</text>
    <rect x="260" y="408" width="210" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="365" y="436" text-anchor="middle" fill="#0f172a">Running, Ready</text>
    <text x="365" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">그런데 동작이 이상함</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M210,256 C235,256 235,118 256,118" marker-end="url(#arrow)"/>
    <path d="M210,264 C235,264 235,198 256,198" marker-end="url(#arrow)"/>
    <line x1="210" y1="276" x2="256" y2="276" marker-end="url(#arrow)"/>
    <path d="M210,288 C235,288 235,358 256,358" marker-end="url(#arrow)"/>
    <path d="M210,296 C235,296 235,438 256,438" marker-end="url(#arrow)"/>
    <line x1="470" y1="118" x2="506" y2="118" marker-end="url(#arrow)"/>
    <line x1="470" y1="198" x2="506" y2="198" marker-end="url(#arrow)"/>
    <line x1="470" y1="278" x2="506" y2="278" marker-end="url(#arrow)"/>
    <line x1="470" y1="358" x2="506" y2="358" marker-end="url(#arrow)"/>
    <line x1="470" y1="438" x2="506" y2="438" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12">
    <rect x="510" y="88" width="420" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="112" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#0f172a">kubectl describe pod → Events</text>
    <text x="524" y="134" fill="#334155">requests 부족 · taint · nodeSelector · PVC 미바인딩</text>

    <rect x="510" y="168" width="420" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="192" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#0f172a">kubectl describe pod → Events</text>
    <text x="524" y="214" fill="#334155">이미지 이름·태그 오타 · 비공개 레지스트리 인증(imagePullSecrets)</text>

    <rect x="510" y="248" width="420" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="272" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#0f172a">kubectl logs --previous · describe(Last State)</text>
    <text x="524" y="294" fill="#334155">앱 오류 · 설정 누락 · 종료 코드 137 = OOMKilled · liveness 과민</text>

    <rect x="510" y="328" width="420" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="352" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#0f172a">kubectl describe pod · get endpointslices</text>
    <text x="524" y="374" fill="#334155">readiness probe 실패 → 엔드포인트에서 제외(재시작은 안 함)</text>

    <rect x="510" y="408" width="420" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="432" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#0f172a">logs -f · exec · debug · port-forward</text>
    <text x="524" y="454" fill="#334155">셸이 없으면 kubectl debug로 임시 컨테이너를 붙인다</text>
  </g>
</svg>
