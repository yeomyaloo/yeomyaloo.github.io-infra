<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PVC에서 실제 디스크까지 — 동적 프로비저닝</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">PVC는 네임스페이스 범위, PV·StorageClass는 클러스터 범위</text>

  <!-- namespace band -->
  <rect x="20" y="86" width="340" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="34" y="108" font-size="13" font-weight="700" fill="#15803d">네임스페이스 shop</text>

  <rect x="36" y="124" width="134" height="110" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="103" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Pod</text>
  <text x="103" y="178" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">mountPath:</text>
  <text x="103" y="196" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">/data</text>

  <rect x="200" y="124" width="146" height="110" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="273" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">PVC</text>
  <text x="273" y="178" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">data-pvc</text>
  <text x="273" y="196" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">10Gi · RWO</text>
  <text x="273" y="214" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">class: fast</text>

  <line x1="170" y1="160" x2="196" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">① 참조</text>

  <!-- cluster band -->
  <rect x="380" y="86" width="560" height="330" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="2"/>
  <text x="394" y="108" font-size="13" font-weight="700" fill="#326ce5">클러스터 범위</text>

  <rect x="400" y="124" width="240" height="110" rx="8" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="520" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">StorageClass fast</text>
  <text x="520" y="176" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">provisioner: csi.example</text>
  <text x="520" y="196" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">reclaimPolicy: Delete</text>
  <text x="520" y="216" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">WaitForFirstConsumer</text>

  <rect x="680" y="124" width="240" height="110" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="800" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CSI 드라이버</text>
  <text x="800" y="178" text-anchor="middle" font-size="12" fill="#334155">컨트롤러: 볼륨 생성·삭제</text>
  <text x="800" y="200" text-anchor="middle" font-size="12" fill="#334155">노드 플러그인: attach·mount</text>

  <rect x="680" y="290" width="240" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">실제 스토리지</text>
  <text x="800" y="346" text-anchor="middle" font-size="12" fill="#334155">클라우드 블록 디스크</text>
  <text x="800" y="366" text-anchor="middle" font-size="12" fill="#334155">Ceph · NFS · 로컬 디스크</text>

  <rect x="400" y="290" width="240" height="100" rx="8" fill="#326ce5"/>
  <text x="520" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PV (자동 생성)</text>
  <text x="520" y="344" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#e8eefc">10Gi · RWO · Delete</text>
  <text x="520" y="366" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#e8eefc">Bound → shop/data-pvc</text>

  <line x1="346" y1="170" x2="396" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">②</text>
  <line x1="640" y1="170" x2="676" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">③</text>
  <line x1="800" y1="234" x2="800" y2="286" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="266" font-size="12" font-weight="700" fill="#334155">④ 볼륨 생성</text>
  <line x1="676" y1="340" x2="644" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M400,340 L273,340 L273,238" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="290" y="330" font-size="12" font-weight="700" fill="#16a34a">⑤ 바인딩 (Bound)</text>

  <!-- footer -->
  <rect x="20" y="430" width="920" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="36" y="455" font-size="13" fill="#334155">WaitForFirstConsumer: 이 PVC를 쓰는 Pod가 스케줄될 때까지 ②~⑤를 미룬다 → 그동안 PVC Pending은 정상</text>
</svg>
