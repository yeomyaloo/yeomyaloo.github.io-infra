<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">클라이언트에서 Pod까지 — 네트워크 리소스의 자리</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">Service는 고정 이름·가상 IP, EndpointSlice는 실제 Pod 목록, CNI는 Pod 네트워크 구현</text>

  <!-- top row -->
  <rect x="30" y="110" width="140" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="100" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">외부 클라이언트</text>
  <text x="100" y="160" text-anchor="middle" font-size="12" fill="#64748b">HTTPS 요청</text>

  <rect x="210" y="100" width="220" height="84" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="320" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Ingress / Gateway API</text>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#334155">L7 호스트·경로 라우팅</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#b45309">컨트롤러가 있어야 동작</text>

  <rect x="470" y="100" width="220" height="84" rx="8" fill="#326ce5"/>
  <text x="580" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Service: web</text>
  <text x="580" y="150" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#ffffff">ClusterIP 10.96.0.20</text>
  <text x="580" y="170" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#e8eefc">web.shop.svc.cluster.local</text>

  <rect x="730" y="100" width="200" height="84" rx="8" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="830" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">EndpointSlice</text>
  <text x="830" y="150" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.1.5:8080</text>
  <text x="830" y="170" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.2.7:8080</text>

  <line x1="170" y1="142" x2="206" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="142" x2="466" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="142" x2="726" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="202" text-anchor="middle" font-size="12" fill="#326ce5">selector: app=web → Ready Pod만 목록에</text>

  <!-- nodes -->
  <rect x="30" y="240" width="430" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="46" y="262" font-size="14" font-weight="700" fill="#334155">노드 k8s-w1</text>
  <rect x="500" y="240" width="430" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="516" y="262" font-size="14" font-weight="700" fill="#334155">노드 k8s-w2</text>

  <rect x="60" y="290" width="170" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">web Pod</text>
  <text x="145" y="338" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.1.5</text>

  <rect x="250" y="290" width="180" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="340" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">frontend Pod</text>
  <text x="340" y="338" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.1.9</text>

  <rect x="530" y="290" width="170" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">web Pod</text>
  <text x="615" y="338" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.2.7</text>

  <rect x="720" y="290" width="180" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="810" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">db-0 Pod</text>
  <text x="810" y="338" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.244.2.3</text>
  <text x="810" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">NetworkPolicy: web만 허용</text>

  <!-- endpoint arrows -->
  <path d="M860,184 C850,240 650,250 620,286" fill="none" stroke="#326ce5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowb)"/>
  <path d="M840,184 C800,250 220,240 150,286" fill="none" stroke="#326ce5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowb)"/>

  <!-- pod to pod -->
  <line x1="430" y1="322" x2="526" y2="322" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="46" y="410" font-size="11" fill="#64748b">kube-proxy: Service IP → Pod IP 규칙(iptables/IPVS/nftables)</text>
  <text x="516" y="410" font-size="11" fill="#64748b">kube-proxy: 같은 규칙 · 일부 CNI는 kube-proxy 대체</text>

  <!-- footer -->
  <text x="480" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">초록 화살표: 노드가 달라도 Pod IP로 NAT 없이 통신 — CNI 플러그인(Calico, Cilium, Flannel…)이 구현</text>
  <rect x="30" y="482" width="900" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="46" y="506" font-size="13" fill="#334155">Service 유형: ClusterIP(기본, 내부) · NodePort(30000~32767) · LoadBalancer(외부 IP) · ExternalName(CNAME)</text>
  <text x="46" y="527" font-size="13" fill="#334155">헤드리스(clusterIP: None): 가상 IP 없이 DNS가 Pod IP를 직접 반환 — StatefulSet과 짝</text>
</svg>
