<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Terraform Associate 실습 환경 — 비용 0원, 로컬 provider 중심</text>

  <!-- Windows PC -->
  <rect x="30" y="60" width="560" height="300" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="48" y="86" font-size="16" font-weight="700" fill="#334155">내 PC (Windows 10/11)</text>

  <!-- WSL2 -->
  <rect x="50" y="100" width="300" height="240" rx="10" fill="#f3ebfb" stroke="#7b42bc"/>
  <text x="66" y="126" font-size="15" font-weight="700" fill="#4c1d95">WSL2 Ubuntu 24.04 (base)</text>
  <text x="66" y="154" font-size="14" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">terraform 1.12.2</text>
  <text x="66" y="174" font-size="12" fill="#64748b">시험 기준 버전 · ~/bin 에 고정</text>
  <text x="66" y="202" font-size="14" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">tofu 1.13.x (선택)</text>
  <text x="66" y="222" font-size="12" fill="#64748b">비교용 · 시험 답은 Terraform 기준</text>
  <text x="66" y="250" font-size="14" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">~/tfa/t01 … t04</text>
  <text x="66" y="270" font-size="12" fill="#64748b">편마다 작업 폴더 하나</text>
  <text x="66" y="298" font-size="13" fill="#334155">provider: local · random · null</text>
  <text x="66" y="318" font-size="13" fill="#334155">(+ docker · kubernetes backend)</text>

  <!-- Docker Desktop -->
  <rect x="370" y="100" width="200" height="240" rx="10" fill="#e0f2fe" stroke="#2496ed"/>
  <text x="386" y="126" font-size="15" font-weight="700" fill="#075985">Docker Desktop</text>
  <text x="386" y="146" font-size="12" fill="#334155">WSL integration 켬</text>
  <rect x="386" y="160" width="168" height="66" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="398" y="184" font-size="13" font-weight="700" fill="#0f172a">nginx 컨테이너</text>
  <text x="398" y="206" font-size="12" fill="#334155">T02 dynamic 블록</text>
  <rect x="386" y="238" width="168" height="86" rx="8" fill="#ffffff" stroke="#326ce5"/>
  <text x="398" y="262" font-size="13" font-weight="700" fill="#0f172a">kind 클러스터 tfa</text>
  <text x="398" y="284" font-size="12" fill="#334155">T03 원격 backend</text>
  <text x="398" y="304" font-size="12" fill="#334155">Secret + Lease 잠금</text>

  <line x1="350" y1="190" x2="382" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="280" x2="382" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internet side -->
  <rect x="640" y="60" width="290" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="658" y="86" font-size="16" font-weight="700" fill="#334155">인터넷</text>
  <rect x="660" y="100" width="250" height="90" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="676" y="126" font-size="14" font-weight="700" fill="#0f172a">registry.terraform.io</text>
  <text x="676" y="148" font-size="12" fill="#334155">init 때 provider·모듈 다운로드</text>
  <text x="676" y="168" font-size="12" fill="#334155">(T01·T02)</text>
  <rect x="660" y="206" width="250" height="134" rx="10" fill="#7b42bc"/>
  <text x="676" y="234" font-size="15" font-weight="700" fill="#ffffff">HCP Terraform (T04)</text>
  <text x="676" y="258" font-size="12" fill="#ffffff">app.terraform.io</text>
  <text x="676" y="280" font-size="12" fill="#ffffff">무료 조직 · 워크스페이스</text>
  <text x="676" y="300" font-size="12" fill="#ffffff">원격 실행은 random provider만</text>
  <text x="676" y="320" font-size="12" fill="#ede9fe">(local_file은 원격 러너에 생김)</text>

  <line x1="590" y1="150" x2="656" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="270" x2="656" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="262" font-size="11" fill="#64748b">login</text>

  <!-- optional -->
  <rect x="30" y="384" width="430" height="92" rx="10" fill="#fff1f2" stroke="#ed1944" stroke-dasharray="6 4"/>
  <text x="48" y="410" font-size="15" font-weight="700" fill="#9f1239">선택 · Day 35 OpenStack (DevStack)</text>
  <text x="48" y="434" font-size="12" fill="#334155">같은 개념을 실제 클라우드 리소스로 재확인</text>
  <text x="48" y="456" font-size="12" fill="#334155">terraform-provider-openstack · k8s-openstack-tf</text>

  <rect x="500" y="384" width="430" height="92" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-dasharray="6 4"/>
  <text x="518" y="410" font-size="15" font-weight="700" fill="#9a3412">AWS는 여기서 다루지 않음</text>
  <text x="518" y="434" font-size="12" fill="#334155">비용이 드는 실습은 클라우드 탭 cloud05로 연결</text>
  <text x="518" y="456" font-size="12" fill="#334155">(S3 원격 상태 + 잠금, 모듈)</text>
</svg>
