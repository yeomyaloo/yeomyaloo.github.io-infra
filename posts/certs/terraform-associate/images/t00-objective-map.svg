<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Terraform Associate (004) — 시험 목표 8개와 이 탭의 편</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">2026-11-19 developer.hashicorp.com 확인 · 기준 Terraform 1.12 · 목표 37개 세부 항목</text>

  <!-- left: objectives -->
  <g font-size="15">
    <rect x="40" y="76" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="97" font-weight="700" fill="#4c1d95">1 · IaC with Terraform</text>
    <text x="56" y="116" font-size="12" fill="#334155">IaC 정의·장점, 멀티 클라우드·하이브리드</text>

    <rect x="40" y="134" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="155" font-weight="700" fill="#4c1d95">2 · Terraform fundamentals</text>
    <text x="56" y="174" font-size="12" fill="#334155">provider 설치·버전, 다중 provider, state 개념</text>

    <rect x="40" y="192" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="213" font-weight="700" fill="#4c1d95">3 · Core Terraform workflow</text>
    <text x="56" y="232" font-size="12" fill="#334155">init · validate · plan · apply · destroy · fmt</text>

    <rect x="40" y="250" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="271" font-weight="700" fill="#4c1d95">4 · Terraform configuration</text>
    <text x="56" y="290" font-size="12" fill="#334155">resource/data, 변수·출력, 타입, 함수, 의존성, 검증, 민감 값</text>

    <rect x="40" y="308" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="329" font-weight="700" fill="#4c1d95">5 · Terraform modules</text>
    <text x="56" y="348" font-size="12" fill="#334155">소스, 변수 스코프, 사용, 버전 관리</text>

    <rect x="40" y="366" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="387" font-weight="700" fill="#4c1d95">6 · State management</text>
    <text x="56" y="406" font-size="12" fill="#334155">local backend, 잠금, backend 블록, drift</text>

    <rect x="40" y="424" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="445" font-weight="700" fill="#4c1d95">7 · Maintain infrastructure</text>
    <text x="56" y="464" font-size="12" fill="#334155">import, CLI로 state 조회, 상세 로그(TF_LOG)</text>

    <rect x="40" y="482" width="400" height="48" rx="8" fill="#f3ebfb" stroke="#7b42bc"/>
    <text x="56" y="503" font-weight="700" fill="#4c1d95">8 · HCP Terraform</text>
    <text x="56" y="522" font-size="12" fill="#334155">인프라 생성, 협업·거버넌스, 워크스페이스·프로젝트, CLI 연동</text>
  </g>

  <!-- right: tab episodes -->
  <rect x="600" y="110" width="320" height="96" rx="10" fill="#7b42bc"/>
  <text x="620" y="140" font-size="18" font-weight="700" fill="#ffffff">T01</text>
  <text x="620" y="164" font-size="13" fill="#ffffff">IaC · 기본 워크플로</text>
  <text x="620" y="184" font-size="13" fill="#ffffff">provider 버전 고정 · 잠금 파일</text>

  <rect x="600" y="250" width="320" height="96" rx="10" fill="#7b42bc"/>
  <text x="620" y="280" font-size="18" font-weight="700" fill="#ffffff">T02</text>
  <text x="620" y="304" font-size="13" fill="#ffffff">HCL 설정 언어 · 모듈</text>
  <text x="620" y="324" font-size="13" fill="#ffffff">for_each · dynamic · 검증 · 민감 값</text>

  <rect x="600" y="372" width="320" height="96" rx="10" fill="#7b42bc"/>
  <text x="620" y="402" font-size="18" font-weight="700" fill="#ffffff">T03</text>
  <text x="620" y="426" font-size="13" fill="#ffffff">state · backend · 잠금</text>
  <text x="620" y="446" font-size="13" fill="#ffffff">import · moved · removed · drift</text>

  <rect x="600" y="482" width="320" height="56" rx="10" fill="#7b42bc"/>
  <text x="620" y="508" font-size="18" font-weight="700" fill="#ffffff">T04</text>
  <text x="670" y="508" font-size="13" fill="#ffffff">HCP Terraform · 협업</text>
  <text x="670" y="526" font-size="12" fill="#ede9fe">워크스페이스 · VCS · 정책 · 레지스트리</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="440" y1="100" x2="596" y2="140"/>
    <line x1="440" y1="158" x2="596" y2="158"/>
    <line x1="440" y1="216" x2="596" y2="178"/>
    <line x1="440" y1="274" x2="596" y2="288"/>
    <line x1="440" y1="332" x2="596" y2="312"/>
    <line x1="440" y1="390" x2="596" y2="410"/>
    <line x1="440" y1="448" x2="596" y2="432"/>
    <line x1="440" y1="506" x2="596" y2="510"/>
  </g>
  <path d="M440,166 C520,200 520,370 596,396" stroke="#7b42bc" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="518" y="226" font-size="11" fill="#7b42bc">2d state 개념</text>
  <text x="518" y="240" font-size="11" fill="#7b42bc">→ T03에서 심화</text>

  <!-- mock exam -->
  <rect x="40" y="560" width="880" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="60" y="586" font-size="17" font-weight="700" fill="#0f172a">T05 모의고사</text>
  <text x="200" y="586" font-size="14" fill="#334155">목표 1~8 전체 · 57문항 · 60분 · 참과 거짓 / 단일 선택 / 복수 선택</text>
  <text x="200" y="606" font-size="12" fill="#64748b">문항 수 57은 공식 미공개 값 대신 쓰는 이 탭의 연습 규모입니다</text>
</svg>
