<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b42bc"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">모듈의 입출력 — 들어가는 길은 변수, 나오는 길은 출력뿐</text>

  <!-- root module -->
  <rect x="30" y="60" width="900" height="300" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="50" y="88" font-size="16" font-weight="700" fill="#334155">루트 모듈 (~/tfa/t02 — terraform 명령을 실행하는 디렉터리)</text>

  <rect x="50" y="104" width="300" height="236" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="66" y="132">module "site" {</text>
    <text x="82" y="154" fill="#7b42bc">source  = "./modules/site"</text>
    <text x="82" y="180" fill="#16a34a">title   = "TFA 노트"</text>
    <text x="82" y="202" fill="#16a34a">pages   = ["t01","t02"]</text>
    <text x="66" y="224">}</text>
    <text x="66" y="262">output "index" {</text>
    <text x="82" y="284" fill="#b45309">value = module.site.index</text>
    <text x="66" y="306">}</text>
  </g>

  <!-- child module -->
  <rect x="470" y="104" width="440" height="236" rx="10" fill="#f3ebfb" stroke="#7b42bc" stroke-width="2"/>
  <text x="486" y="130" font-size="15" font-weight="700" fill="#4c1d95">자식 모듈 ./modules/site</text>
  <rect x="486" y="144" width="130" height="80" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="498" y="166" font-size="13" font-weight="700" fill="#166534">variables.tf</text>
  <text x="498" y="186" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">var.title</text>
  <text x="498" y="206" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">var.pages</text>
  <rect x="632" y="144" width="130" height="80" rx="8" fill="#ffffff" stroke="#7b42bc"/>
  <text x="644" y="166" font-size="13" font-weight="700" fill="#4c1d95">main.tf</text>
  <text x="644" y="186" font-size="12" fill="#334155">local_file 들</text>
  <text x="644" y="206" font-size="12" fill="#334155">(for_each)</text>
  <rect x="778" y="144" width="120" height="80" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="790" y="166" font-size="13" font-weight="700" fill="#92400e">outputs.tf</text>
  <text x="790" y="186" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">index</text>
  <text x="790" y="206" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">files</text>
  <line x1="616" y1="184" x2="628" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="762" y1="184" x2="774" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="486" y="256" font-size="12" fill="#334155">자식은 루트의 var·local·resource를 직접 못 본다</text>
  <text x="486" y="278" font-size="12" fill="#334155">루트도 자식 내부 리소스를 직접 못 본다 → 출력으로만</text>
  <text x="486" y="300" font-size="12" fill="#334155">provider 설정은 부모에게서 물려받는다 (기본)</text>
  <text x="486" y="322" font-size="12" fill="#64748b">리소스 주소: module.site.local_file.page["t01"]</text>

  <!-- arrows in/out -->
  <path d="M300,190 C390,190 400,170 482,170" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="372" y="168" font-size="12" fill="#166534">입력 인수</text>
  <path d="M838,226 V350 H410 V284 H356" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="372" font-size="12" fill="#92400e">출력 → module.site.index</text>

  <!-- sources -->
  <rect x="30" y="380" width="900" height="104" rx="12" fill="#ffffff" stroke="#7b42bc"/>
  <text x="50" y="406" font-size="15" font-weight="700" fill="#4c1d95">source 종류와 version</text>
  <g font-size="13">
    <text x="50" y="434" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">"./modules/site"</text>
    <text x="250" y="434" fill="#334155">로컬 경로 — 다운로드 없음, version 못 씀</text>
    <text x="560" y="434" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">"ns/name/provider"</text>
    <text x="720" y="434" fill="#334155">레지스트리 — version 사용</text>
    <text x="50" y="464" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">"git::https://…?ref=v1.2.0"</text>
    <text x="290" y="464" fill="#334155">Git — ref 로 태그·커밋 고정</text>
    <text x="560" y="464" fill="#334155">소스를 추가·변경하면 terraform init 다시</text>
  </g>
</svg>
