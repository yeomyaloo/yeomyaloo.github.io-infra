<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">원격 backend 와 상태 잠금 — 동시에 apply 하면</text>

  <!-- users -->
  <rect x="30" y="70" width="220" height="80" rx="10" fill="#f3ebfb" stroke="#7b42bc"/>
  <text x="46" y="98" font-size="15" font-weight="700" fill="#4c1d95">터미널 A</text>
  <text x="46" y="122" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">terraform apply</text>
  <text x="46" y="140" font-size="12" fill="#334155">먼저 시작 → 잠금 획득</text>

  <rect x="30" y="200" width="220" height="80" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="46" y="228" font-size="15" font-weight="700" fill="#991b1b">터미널 B</text>
  <text x="46" y="252" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">terraform apply</text>
  <text x="46" y="270" font-size="12" fill="#334155">몇 초 뒤 시작</text>

  <!-- backend -->
  <rect x="340" y="60" width="290" height="230" rx="12" fill="#e8eefc" stroke="#326ce5"/>
  <text x="356" y="88" font-size="15" font-weight="700" fill="#1e3a8a">backend "kubernetes" (kind tfa)</text>
  <rect x="356" y="104" width="258" height="72" rx="8" fill="#ffffff" stroke="#326ce5"/>
  <text x="370" y="128" font-size="13" font-weight="700" fill="#0f172a">Secret — state 저장</text>
  <text x="370" y="152" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">tfstate-default-tfa-lab</text>
  <rect x="356" y="190" width="258" height="84" rx="8" fill="#ffffff" stroke="#7b42bc" stroke-width="2"/>
  <text x="370" y="214" font-size="13" font-weight="700" fill="#4c1d95">Lease — 잠금</text>
  <text x="370" y="238" font-size="12" fill="#334155">같은 네임스페이스, kubectl get lease</text>
  <text x="370" y="260" font-size="12" fill="#334155">보유자: A (ID·작업·시각 기록)</text>

  <path d="M250,110 L352,226" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="160" font-size="12" fill="#334155">① 잠금</text>
  <path d="M250,96 L352,136" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="256" y="84" font-size="12" fill="#334155">② state R/W</text>
  <path d="M250,250 L352,250" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrowr)"/>
  <text x="262" y="244" font-size="12" fill="#dc2626">잠금 시도</text>

  <!-- error -->
  <rect x="680" y="60" width="250" height="230" rx="12" fill="#0f172a"/>
  <text x="696" y="88" font-size="13" font-weight="700" fill="#fca5a5">터미널 B 의 출력</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#e2e8f0">
    <text x="696" y="116">Error: Error acquiring</text>
    <text x="696" y="134">the state lock</text>
    <text x="696" y="162">Lock Info:</text>
    <text x="712" y="180">ID:        5f1c…</text>
    <text x="712" y="198">Operation: OperationTypeApply</text>
    <text x="712" y="216">Who:       a@base</text>
  </g>
  <text x="696" y="246" font-size="12" fill="#cbd5e1">B 는 아무것도 바꾸지 않고 멈춤</text>
  <text x="696" y="266" font-size="12" fill="#cbd5e1">→ state 손상을 막음</text>
  <line x1="630" y1="232" x2="676" y2="232" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowr)"/>

  <!-- options -->
  <rect x="30" y="314" width="900" height="130" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="50" y="340" font-size="15" font-weight="700" fill="#0f172a">잠금과 관련된 옵션</text>
  <g font-size="13">
    <text x="50" y="370" font-family="Consolas,'D2Coding',monospace" fill="#7b42bc" font-weight="700">-lock-timeout=60s</text>
    <text x="250" y="370" fill="#334155">잠금이 풀릴 때까지 최대 60초 기다렸다가 진행 (기본은 바로 실패)</text>
    <text x="50" y="398" font-family="Consolas,'D2Coding',monospace" fill="#b45309" font-weight="700">force-unlock LOCK_ID</text>
    <text x="250" y="398" fill="#334155">비정상 종료로 남은 잠금만 수동 해제 — 다른 작업이 진짜 없을 때만</text>
    <text x="50" y="426" font-family="Consolas,'D2Coding',monospace" fill="#dc2626" font-weight="700">-lock=false</text>
    <text x="250" y="426" fill="#334155">잠금을 건너뜀 — 동시 실행 시 state 가 깨질 수 있어 사실상 금지</text>
  </g>
</svg>
