<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">목록 맨 앞 "dev"를 지우면 — count 와 for_each 의 차이</text>

  <!-- count panel -->
  <rect x="30" y="60" width="430" height="400" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="50" y="90" font-size="17" font-weight="700" fill="#9a3412">count — 주소가 번호</text>
  <text x="50" y="116" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">count = length(var.envs)</text>
  <text x="50" y="136" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">name  = var.envs[count.index]</text>

  <text x="50" y="172" font-size="13" font-weight="700" fill="#334155">변경 전 ["dev","stg","prd"]</text>
  <text x="260" y="172" font-size="13" font-weight="700" fill="#334155">변경 후 ["stg","prd"]</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13">
    <rect x="50" y="184" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="60" y="206" fill="#0f172a">file[0] = dev</text>
    <rect x="50" y="228" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="60" y="250" fill="#0f172a">file[1] = stg</text>
    <rect x="50" y="272" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="60" y="294" fill="#0f172a">file[2] = prd</text>

    <rect x="260" y="184" width="180" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="270" y="206" fill="#0f172a">file[0] = stg</text>
    <rect x="260" y="228" width="180" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="270" y="250" fill="#0f172a">file[1] = prd</text>
    <rect x="260" y="272" width="180" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="5 3"/>
    <text x="270" y="294" fill="#991b1b">file[2] 삭제</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="230" y1="201" x2="256" y2="201"/>
    <line x1="230" y1="245" x2="256" y2="245"/>
    <line x1="230" y1="289" x2="256" y2="289"/>
  </g>
  <rect x="50" y="326" width="390" height="116" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="66" y="352" font-size="14" font-weight="700" fill="#991b1b">plan: 2 to add, 0 to change, 3 to destroy</text>
  <text x="66" y="376" font-size="13" fill="#334155">[0]·[1]은 내용이 바뀌어 교체(-/+), [2]는 삭제</text>
  <text x="66" y="398" font-size="13" fill="#334155">stg·prd 는 그대로인데도 다시 만들어짐</text>
  <text x="66" y="424" font-size="12" fill="#64748b">count 는 "같은 것 N개" 에 맞다 (예: 워커 3대)</text>

  <!-- for_each panel -->
  <rect x="500" y="60" width="430" height="400" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="520" y="90" font-size="17" font-weight="700" fill="#166534">for_each — 주소가 키</text>
  <text x="520" y="116" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">for_each = toset(var.envs)</text>
  <text x="520" y="136" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">name     = each.key</text>

  <text x="520" y="172" font-size="13" font-weight="700" fill="#334155">변경 전</text>
  <text x="730" y="172" font-size="13" font-weight="700" fill="#334155">변경 후</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13">
    <rect x="520" y="184" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="530" y="206" fill="#0f172a">file["dev"]</text>
    <rect x="520" y="228" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="530" y="250" fill="#0f172a">file["stg"]</text>
    <rect x="520" y="272" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="530" y="294" fill="#0f172a">file["prd"]</text>

    <rect x="730" y="184" width="180" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="5 3"/>
    <text x="740" y="206" fill="#991b1b">file["dev"] 삭제</text>
    <rect x="730" y="228" width="180" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="740" y="250" fill="#0f172a">file["stg"] 유지</text>
    <rect x="730" y="272" width="180" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="740" y="294" fill="#0f172a">file["prd"] 유지</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="700" y1="201" x2="726" y2="201"/>
    <line x1="700" y1="245" x2="726" y2="245"/>
    <line x1="700" y1="289" x2="726" y2="289"/>
  </g>
  <rect x="520" y="326" width="390" height="116" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="536" y="352" font-size="14" font-weight="700" fill="#166534">plan: 0 to add, 0 to change, 1 to destroy</text>
  <text x="536" y="376" font-size="13" fill="#334155">지운 키 하나만 삭제, 나머지 주소는 그대로</text>
  <text x="536" y="398" font-size="13" fill="#334155">map 또는 set(string) 만 받는다 (list 는 toset)</text>
  <text x="536" y="424" font-size="12" fill="#64748b">for_each 는 "이름 붙은 서로 다른 것" 에 맞다</text>
</svg>
