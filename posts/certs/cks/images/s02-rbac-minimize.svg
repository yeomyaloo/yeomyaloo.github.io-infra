<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RBAC 최소화 — 찾기 → 지우기 → 좁히기 → 검증</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">S02 과제 1의 예 · RBAC는 허용의 합집합이라 기존 바인딩을 지워야 줄어든다</text>

  <!-- before -->
  <rect x="30" y="85" width="420" height="250" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">전 — 과도한 권한</text>
  <rect x="50" y="130" width="150" height="50" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="125" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SA ci-bot</text>
  <text x="125" y="170" text-anchor="middle" font-size="11" fill="#64748b">ns s02-app</text>
  <line x1="202" y1="155" x2="250" y2="155" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="255" y="130" width="175" height="50" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="342" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">CRB ci-bot-admin</text>
  <text x="342" y="170" text-anchor="middle" font-size="11" fill="#b91c1c">→ cluster-admin</text>
  <text x="50" y="212" font-size="13" fill="#334155">찾는 명령</text>
  <text x="50" y="234" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">k get clusterrolebinding -o jsonpath=</text>
  <text x="50" y="252" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace"> '{.items[?(@.roleRef.name==</text>
  <text x="50" y="270" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace"> "cluster-admin")]...}'</text>
  <text x="50" y="300" font-size="12" fill="#7f1d1d">모든 ns · 노드 · Secret · RBAC까지 가능</text>
  <text x="50" y="320" font-size="12" fill="#7f1d1d">위험 신호: *, secrets, escalate, bind, impersonate</text>

  <line x1="455" y1="210" x2="502" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- after -->
  <rect x="510" y="85" width="420" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="720" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">후 — 필요한 만큼만</text>
  <rect x="530" y="130" width="120" height="50" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="590" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SA ci-bot</text>
  <text x="590" y="170" text-anchor="middle" font-size="11" fill="#64748b">ns s02-app</text>
  <line x1="652" y1="155" x2="690" y2="155" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="695" y="130" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="805" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">RB ci-deployer-rb</text>
  <text x="805" y="170" text-anchor="middle" font-size="11" fill="#16a34a">→ Role ci-deployer (s02-app)</text>
  <text x="530" y="212" font-size="13" fill="#334155">규칙</text>
  <text x="530" y="234" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">apps / deployments</text>
  <text x="530" y="252" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">get list watch create update patch</text>
  <text x="530" y="282" font-size="12" fill="#14532d">CRB ci-bot-admin 삭제 (주체가 하나뿐인지 먼저 확인)</text>
  <text x="530" y="302" font-size="12" fill="#14532d">지우면 안 되는 것: system:masters,</text>
  <text x="530" y="320" font-size="12" fill="#14532d">kubeadm:cluster-admins 바인딩</text>

  <!-- verify -->
  <rect x="30" y="355" width="900" height="145" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="50" y="382" font-size="15" font-weight="700" fill="#0f172a">검증 — yes여야 할 것과 no여야 할 것을 모두</text>
  <text x="50" y="408" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">SA=system:serviceaccount:s02-app:ci-bot</text>
  <rect x="50" y="420" width="420" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="62" y="440" font-size="12" fill="#14532d" font-family="Consolas,'D2Coding',monospace">k auth can-i create deployments -n s02-app --as=$SA</text>
  <text x="480" y="440" font-size="13" font-weight="700" fill="#16a34a">yes</text>
  <rect x="50" y="458" width="420" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="62" y="478" font-size="12" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">k auth can-i get secrets -n s02-app --as=$SA</text>
  <text x="480" y="478" font-size="13" font-weight="700" fill="#dc2626">no</text>
  <text x="560" y="430" font-size="12" fill="#334155">--as에는 SA 이름만 쓰지 말고</text>
  <text x="560" y="450" font-size="12" fill="#334155">system:serviceaccount:&lt;ns&gt;:&lt;이름&gt; 전체</text>
  <text x="560" y="476" font-size="12" fill="#334155">그룹은 --as=x --as-group=&lt;그룹&gt;</text>
</svg>
