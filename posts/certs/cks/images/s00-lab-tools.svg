  <text x="427" y="166" text-anchor="middle" font-size="12" fill="#64748b">192.168.56.10</text>
  <rect x="347" y="178" width="161" height="28" rx="5" fill="#e8eefc" stroke="#326ce5"/>
  <text x="357" y="197" font-size="12" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">kube-bench</text>
