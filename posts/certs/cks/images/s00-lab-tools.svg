<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CKS 실습 환경 — 어느 호스트에 어떤 도구를 두나</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">CKA cka-clean(v1.37.1) 위에 보안 도구를 얹고 스냅샷 cks-clean</text>

  <!-- base -->
  <rect x="30" y="85" width="250" height="300" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">base — WSL2 Ubuntu 24.04</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#64748b">시험의 base 역할 · Docker Desktop</text>
  <rect x="50" y="146" width="210" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="62" y="168" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">kubectl · helm · kind</text>
  <rect x="50" y="190" width="210" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="62" y="212" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">trivy v0.76.2</text>
  <rect x="50" y="234" width="210" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="62" y="256" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">bom v0.8.0</text>
  <rect x="50" y="278" width="210" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="62" y="298" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">kubesec() 함수</text>
  <text x="62" y="316" font-size="11" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">kubesec/kubesec:v2</text>
  <text x="155" y="352" text-anchor="middle" font-size="12" fill="#334155">이미지·매니페스트 분석 도구</text>
  <text x="155" y="370" text-anchor="middle" font-size="12" fill="#334155">작업 폴더 ~/cks/</text>

  <!-- ssh arrows -->
  <line x1="282" y1="170" x2="318" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#64748b">ssh</text>

  <!-- cka-main cluster -->
  <rect x="320" y="85" width="610" height="300" rx="12" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="625" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">context cka-main — kubeadm v1.37.1 · Cilium · containerd 1.7</text>

  <!-- k8s-cp -->
  <rect x="335" y="125" width="185" height="245" rx="10" fill="#ffffff" stroke="#326ce5"/>
