<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">노드의 Falco — 설정·규칙 파일과 출력 경로</text>

  <!-- engine -->
  <rect x="330" y="60" width="300" height="64" rx="10" fill="#326ce5" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Falco 엔진 (modern eBPF)</text>
  <text x="480" y="110" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#ffffff">falco-modern-bpf.service</text>

  <!-- config -->
  <rect x="20" y="160" width="280" height="230" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="160" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">설정</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">
    <text x="34" y="212" font-weight="700">/etc/falco/falco.yaml</text>
    <text x="34" y="234">rules_files:</text>
    <text x="47.2" y="252">- falco_rules.yaml</text>
    <text x="47.2" y="270">- falco_rules.local.yaml</text>
    <text x="47.2" y="288">- rules.d</text>
    <text x="34" y="310">config_files:</text>
    <text x="47.2" y="328">- /etc/falco/config.d</text>
    <text x="34" y="352" fill="#b91c1c">file_output:</text>
    <text x="47.2" y="370" fill="#b91c1c">enabled / filename</text>
  </g>

  <!-- rules stack -->
  <text x="480" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">규칙 (위에서부터 로드)</text>
  <rect x="340" y="170" width="280" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="194" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#7f1d1d">falco_rules.yaml</text>
  <text x="480" y="216" text-anchor="middle" font-size="12" fill="#7f1d1d">기본 규칙 · 직접 수정 금지</text>

  <rect x="340" y="246" width="280" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="270" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#14532d">falco_rules.local.yaml</text>
  <text x="480" y="292" text-anchor="middle" font-size="12" fill="#14532d">override: output: replace</text>

  <rect x="340" y="322" width="280" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="346" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#14532d">rules.d/*.yaml</text>
  <text x="480" y="368" text-anchor="middle" font-size="12" fill="#14532d">새 규칙 (list · macro · rule)</text>

  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="480" y1="232" x2="480" y2="244"/>
    <line x1="480" y1="308" x2="480" y2="320"/>
  </g>

  <!-- outputs -->
  <text x="800" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">경보 출력</text>
  <rect x="660" y="170" width="280" height="96" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="800" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">stdout → systemd 저널</text>
  <text x="800" y="218" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">journalctl -u</text>
  <text x="800" y="236" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">falco-modern-bpf -f</text>

  <rect x="660" y="288" width="280" height="96" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">file_output → 파일</text>
  <text x="800" y="336" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#78350f">/var/log/falco/</text>
  <text x="800" y="354" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#78350f">cks-alerts.log</text>
  <text x="800" y="374" text-anchor="middle" font-size="11" fill="#78350f">디렉터리는 미리 만든다</text>

  <!-- arrows to/from engine -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160,160 V92 H328" fill="none"/>
    <line x1="480" y1="140" x2="480" y2="126"/>
    <path d="M632,106 H720 V168" fill="none"/>
    <path d="M632,92 H950 V336 H942" fill="none"/>
  </g>

  <!-- bottom -->
  <rect x="20" y="410" width="920" height="50" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="480" y="441" text-anchor="middle" font-size="13" fill="#1e3a8a">고친 뒤: falco -V falco_rules.yaml -V &lt;고친 파일&gt; → systemctl restart falco-modern-bpf → systemctl is-active</text>
</svg>
