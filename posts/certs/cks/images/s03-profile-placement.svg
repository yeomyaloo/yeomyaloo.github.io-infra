<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">AppArmor vs seccomp — 노드에서 준비하고 Pod에서 가리키기</text>

  <!-- column titles -->
  <rect x="30" y="58" width="400" height="40" rx="8" fill="#326ce5"/>
  <text x="230" y="84" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">AppArmor (Localhost)</text>
  <rect x="470" y="58" width="400" height="40" rx="8" fill="#b91c1c"/>
  <text x="670" y="84" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">seccomp (Localhost)</text>

  <!-- step 1 -->
  <text x="30" y="126" font-size="13" font-weight="bold" fill="#64748b">① 노드에 파일 두기</text>
  <rect x="30" y="134" width="400" height="56" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="44" y="158" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">/etc/apparmor.d/s03-deny-etc-write</text>
  <text x="44" y="179" font-size="12" fill="#64748b">위치는 관례 — 여기 두면 부팅 시 자동 적재</text>
  <text x="470" y="126" font-size="13" font-weight="bold" fill="#64748b">① 노드에 파일 두기</text>
  <rect x="470" y="134" width="400" height="56" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="484" y="158" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">/var/lib/kubelet/seccomp/profiles/</text>
  <text x="484" y="179" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">  s03-deny-chmod.json</text>

  <line x1="230" y1="192" x2="230" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="192" x2="670" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <text x="30" y="242" font-size="13" font-weight="bold" fill="#64748b">② 커널에 적재</text>
  <rect x="30" y="250" width="400" height="70" rx="6" fill="#e8eefc" stroke="#326ce5"/>
  <text x="44" y="274" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">apparmor_parser -r &lt;파일&gt;</text>
  <text x="44" y="296" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">aa-status | grep s03-deny-etc-write</text>
  <text x="44" y="313" font-size="11" fill="#64748b">적재 안 하면 Pod 컨테이너가 시작되지 않음</text>
  <text x="470" y="242" font-size="13" font-weight="bold" fill="#64748b">② 적재 단계 없음</text>
  <rect x="470" y="250" width="400" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="484" y="274" font-size="13" fill="#334155">컨테이너 시작 때 런타임이 파일을 읽어 적용</text>
  <text x="484" y="296" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">python3 -m json.tool &lt;파일&gt;</text>
  <text x="484" y="313" font-size="11" fill="#64748b">JSON 문법만 미리 검사</text>

  <line x1="230" y1="322" x2="230" y2="352" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="322" x2="670" y2="352" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3: pod spec -->
  <text x="30" y="372" font-size="13" font-weight="bold" fill="#64748b">③ Pod 스펙에서 가리키기</text>
  <rect x="30" y="380" width="400" height="104" rx="6" fill="#0f172a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#e2e8f0">
    <text x="44" y="404">securityContext:</text>
    <text x="60" y="424">appArmorProfile:</text>
    <text x="76" y="444">type: Localhost</text>
    <text x="76" y="466">localhostProfile: <tspan fill="#93c5fd" font-weight="bold">s03-deny-etc-write</tspan></text>
  </g>
  <text x="470" y="372" font-size="13" font-weight="bold" fill="#64748b">③ Pod 스펙에서 가리키기</text>
  <rect x="470" y="380" width="400" height="104" rx="6" fill="#0f172a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#e2e8f0">
    <text x="484" y="404">securityContext:</text>
    <text x="500" y="424">seccompProfile:</text>
    <text x="516" y="444">type: Localhost</text>
    <text x="516" y="466" font-size="12">localhostProfile: <tspan fill="#fca5a5" font-weight="bold">profiles/s03-deny-chmod.json</tspan></text>
  </g>

  <!-- key rule -->
  <rect x="30" y="496" width="400" height="44" rx="6" fill="#e8eefc" stroke="#326ce5"/>
  <text x="44" y="516" font-size="14" font-weight="bold" fill="#326ce5">값 = 프로파일 "이름"</text>
  <text x="44" y="533" font-size="12" fill="#334155">파일 안 profile 다음 단어. 파일명과 다를 수 있음</text>
  <rect x="470" y="496" width="400" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="484" y="516" font-size="14" font-weight="bold" fill="#b91c1c">값 = seccomp 루트 기준 "상대 경로"</text>
  <text x="484" y="533" font-size="12" fill="#334155">루트는 /var/lib/kubelet/seccomp — 절대 경로 금지</text>

  <!-- common warning -->
  <rect x="30" y="556" width="840" height="48" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="46" y="577" font-size="14" font-weight="bold" fill="#334155">공통: 스케줄러는 어느 노드에 프로파일이 있는지 모른다</text>
  <text x="46" y="596" font-size="13" fill="#334155">→ 모든 노드에 두거나, nodeName / nodeSelector 로 Pod를 그 노드에 묶는다</text>
</svg>
