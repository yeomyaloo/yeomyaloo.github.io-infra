<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">저장 시 암호화 — 쓰기는 첫 provider, 읽기는 위에서부터</text>

  <!-- client -->
  <rect x="30" y="80" width="170" height="110" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="115" y="108" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">kubectl</text>
  <text x="44" y="134" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">create secret ...</text>
  <text x="44" y="156" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">get secret ...</text>
  <text x="44" y="178" font-size="11" fill="#64748b">API는 늘 평문(base64)</text>

  <!-- apiserver -->
  <rect x="250" y="70" width="350" height="250" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="264" y="96" font-size="15" font-weight="bold" fill="#326ce5">kube-apiserver (k8s-cp static Pod)</text>
  <text x="264" y="118" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">--encryption-provider-config=</text>
  <text x="264" y="134" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">  /etc/kubernetes/enc/enc.yaml</text>
  <rect x="264" y="146" width="322" height="160" rx="6" fill="#0f172a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#e2e8f0">
    <text x="276" y="166">resources: [secrets]</text>
    <text x="276" y="184">providers:</text>
    <rect x="272" y="191" width="306" height="56" rx="3" fill="#16a34a" fill-opacity="0.35"/>
    <text x="284" y="208">- secretbox:</text>
    <text x="566" y="208" text-anchor="end" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" fill="#86efac">← 새 쓰기</text>
    <text x="300" y="224">keys: [{name: key1,</text>
    <text x="300" y="240">        secret: &lt;base64 32B&gt;}]</text>
    <rect x="272" y="252" width="306" height="22" rx="3" fill="#64748b" fill-opacity="0.45"/>
    <text x="284" y="268">- identity: {}</text>
    <text x="566" y="268" text-anchor="end" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">← 옛 평문 읽기용</text>
    <text x="276" y="294" fill="#fde68a">순서가 바뀌면 = 암호화 꺼짐</text>
  </g>

  <!-- etcd -->
  <rect x="650" y="70" width="220" height="250" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="760" y="96" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">etcd</text>
  <rect x="662" y="110" width="196" height="90" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="672" y="130" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">/registry/secrets/</text>
  <text x="672" y="145" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">  s04/after-enc</text>
  <text x="672" y="168" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#16a34a" font-weight="bold">k8s:enc:secretbox:</text>
  <text x="672" y="184" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#16a34a" font-weight="bold">  v1:key1:&lt;암호문&gt;</text>
  <rect x="662" y="214" width="196" height="92" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="672" y="234" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">/registry/secrets/</text>
  <text x="672" y="249" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">  s04/db-cred</text>
  <text x="672" y="272" font-size="12" fill="#b91c1c" font-weight="bold">설정 전에 저장된 것</text>
  <text x="672" y="291" font-size="12" fill="#b91c1c">= 여전히 평문(protobuf)</text>

  <!-- arrows -->
  <line x1="200" y1="120" x2="246" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="206" y="112" font-size="11" fill="#64748b">쓰기</text>
  <line x1="602" y1="160" x2="658" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="608" y="152" font-size="11" fill="#16a34a">암호화</text>
  <line x1="658" y1="262" x2="604" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="282" font-size="11" fill="#64748b">읽기</text>
  <line x1="246" y1="170" x2="202" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="206" y="188" font-size="11" fill="#64748b">복호화</text>

  <!-- re-encrypt band -->
  <rect x="30" y="346" width="840" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="46" y="372" font-size="15" font-weight="bold" fill="#b91c1c">기존 Secret 재암호화 — 설정만으로는 예전 데이터가 바뀌지 않는다</text>
  <rect x="46" y="384" width="808" height="30" rx="4" fill="#0f172a"/>
  <text x="58" y="404" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#fde68a">kubectl get secrets --all-namespaces -o json | kubectl replace -f -</text>
  <text x="46" y="440" font-size="13" fill="#334155">모든 Secret을 다시 "쓰기" → 첫 provider로 저장됨 → db-cred도 <tspan font-family="Consolas,'D2Coding',monospace">k8s:enc:secretbox:v1:key1:</tspan> 로 바뀜</text>

  <!-- verify -->
  <rect x="30" y="474" width="840" height="108" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="46" y="498" font-size="14" font-weight="bold" fill="#334155">확인 (k8s-cp)</text>
  <text x="46" y="522" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">etcdctl --endpoints=https://127.0.0.1:2379 --cacert=.../etcd/ca.crt \</text>
  <text x="46" y="540" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">  --cert=.../etcd/server.crt --key=.../etcd/server.key \</text>
  <text x="46" y="558" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">  get /registry/secrets/&lt;ns&gt;/&lt;이름&gt; | hexdump -C</text>
  <text x="560" y="540" font-size="12" fill="#64748b">평문이 보이면 실패,</text>
  <text x="560" y="558" font-size="12" fill="#64748b"><tspan font-family="Consolas,'D2Coding',monospace">k8s:enc:</tspan> 접두어면 성공</text>
</svg>
