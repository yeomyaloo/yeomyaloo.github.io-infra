<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">트러블슈팅 진단 순서</text>

  <!-- step boxes -->
  <rect x="20" y="60" width="168" height="72" rx="10" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="104" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">① 증상</text>
  <text x="104" y="116" text-anchor="middle" font-size="13" fill="#7f1d1d">무엇이 안 되나?</text>

  <rect x="208" y="60" width="168" height="72" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="292" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">② 범위 좁히기</text>
  <text x="292" y="116" text-anchor="middle" font-size="13" fill="#78350f">어디까지 퍼졌나?</text>

  <rect x="396" y="60" width="168" height="72" rx="10" fill="#326ce5" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">③ 로그·이벤트</text>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="#ffffff">누가 왜 실패했나?</text>

  <rect x="584" y="60" width="168" height="72" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="668" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">④ 수정</text>
  <text x="668" y="116" text-anchor="middle" font-size="13" fill="#312e81">원인 하나만 고친다</text>

  <rect x="772" y="60" width="168" height="72" rx="10" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="856" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">⑤ 검증</text>
  <text x="856" y="116" text-anchor="middle" font-size="13" fill="#14532d">증상이 사라졌나?</text>

  <!-- arrows between steps -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="188" y1="96" x2="206" y2="96"/>
    <line x1="376" y1="96" x2="394" y2="96"/>
    <line x1="564" y1="96" x2="582" y2="96"/>
    <line x1="752" y1="96" x2="770" y2="96"/>
  </g>

  <!-- detail cards -->
  <g fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5">
    <rect x="20" y="150" width="168" height="150" rx="8"/>
    <rect x="208" y="150" width="168" height="150" rx="8"/>
    <rect x="396" y="150" width="168" height="150" rx="8" fill="#e8eefc" stroke="#326ce5"/>
    <rect x="584" y="150" width="168" height="150" rx="8"/>
    <rect x="772" y="150" width="168" height="150" rx="8"/>
  </g>

  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">
    <text x="32" y="180">kubectl get nodes</text>
    <text x="32" y="206">kubectl get pods -A</text>
    <text x="408" y="180">describe → Events</text>
    <text x="408" y="206">logs --previous -c</text>
    <text x="408" y="232">journalctl -u kubelet</text>
    <text x="408" y="258">crictl ps -a / logs</text>
    <text x="408" y="284">kubectl events</text>
    <text x="596" y="180">kubectl set / patch</text>
    <text x="596" y="206">manifests/*.yaml</text>
    <text x="596" y="232">config.yaml</text>
    <text x="596" y="258">enable --now</text>
    <text x="784" y="180">같은 명령 다시 실행</text>
  </g>
  <g font-size="13" fill="#334155">
    <text x="32" y="236">STATUS와</text>
    <text x="32" y="256">에러 문장을</text>
    <text x="32" y="276">그대로 읽는다</text>
    <text x="220" y="180">Pod 하나?</text>
    <text x="220" y="206">노드 하나?</text>
    <text x="220" y="232">클러스터 전체?</text>
    <text x="220" y="258">kubectl 자체가 안 됨?</text>
    <text x="220" y="284" fill="#b45309" font-weight="700">→ 볼 곳이 달라진다</text>
    <text x="784" y="206">Ready / Running</text>
    <text x="784" y="232">RESTARTS 멈춤</text>
    <text x="784" y="258">재부팅 후에도 유지?</text>
    <text x="784" y="284">(is-enabled)</text>
  </g>

  <!-- loop back -->
  <path d="M856,300 L856,340 L292,340 L292,304" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="434" y="328" width="270" height="24" rx="12" fill="#ffffff"/>
  <text x="569" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">해결 안 됨 → 범위를 다시 좁힌다</text>

  <!-- footer -->
  <rect x="20" y="370" width="920" height="50" rx="10" fill="#e8eefc" stroke="#326ce5"/>
  <text x="480" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">한 번에 하나만 바꾸고 바로 검증한다</text>
  <text x="480" y="411" text-anchor="middle" font-size="12.5" fill="#334155">여러 곳을 동시에 바꾸면 무엇이 고쳤는지, 무엇을 새로 망가뜨렸는지 알 수 없다</text>
</svg>
