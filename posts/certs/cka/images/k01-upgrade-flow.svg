<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kubeadm 업그레이드 순서 — v1.36 → v1.37 (한 노드씩)</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#64748b">공식 문서 "Upgrading kubeadm clusters" · "Upgrade Linux nodes" 절차 (2026-11-15 확인)</text>

  <!-- lane headers -->
  <rect x="30" y="80" width="430" height="40" rx="8" fill="#326ce5"/>
  <text x="245" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">① 첫 컨트롤 플레인 — k8s-cp</text>
  <rect x="500" y="80" width="430" height="40" rx="8" fill="#64748b"/>
  <text x="715" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">② 워커 — k8s-w1, 끝나면 k8s-w2</text>

  <!-- CP steps -->
  <g font-size="14">
    <rect x="30" y="134" width="430" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="46" y="161" fill="#0f172a">1. 저장소 <tspan font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">/v1.36/ → /v1.37/</tspan>, apt-get update</text>

    <rect x="30" y="188" width="430" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="46" y="215" fill="#0f172a">2. unhold → <tspan font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">kubeadm='1.37.x-*'</tspan> → hold</text>

    <rect x="30" y="242" width="430" height="44" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
    <text x="46" y="269" fill="#0f172a">3. <tspan font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#1e3a8a">kubeadm upgrade plan</tspan> → <tspan font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#1e3a8a">apply v1.37.x</tspan></text>

    <rect x="30" y="296" width="430" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="46" y="323" fill="#0f172a">4. <tspan font-family="Consolas,'D2Coding',monospace" fill="#92400e">kubectl drain k8s-cp --ignore-daemonsets</tspan></text>

    <rect x="30" y="350" width="430" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="46" y="377" fill="#0f172a">5. kubelet·kubectl 설치 → daemon-reload, restart</text>

    <rect x="30" y="404" width="430" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="46" y="431" fill="#0f172a">6. <tspan font-family="Consolas,'D2Coding',monospace" fill="#166534">kubectl uncordon k8s-cp</tspan></text>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="245" y1="178" x2="245" y2="187" marker-end="url(#arrow)"/>
    <line x1="245" y1="232" x2="245" y2="241" marker-end="url(#arrow)"/>
    <line x1="245" y1="286" x2="245" y2="295" marker-end="url(#arrow)"/>
    <line x1="245" y1="340" x2="245" y2="349" marker-end="url(#arrow)"/>
    <line x1="245" y1="394" x2="245" y2="403" marker-end="url(#arrow)"/>
  </g>

  <!-- worker steps -->
  <g font-size="14">
    <rect x="500" y="134" width="430" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="516" y="161" fill="#0f172a">1. 저장소 변경 + kubeadm(·kubectl) 설치</text>

    <rect x="500" y="188" width="430" height="44" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
    <text x="516" y="215" fill="#0f172a">2. <tspan font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#1e3a8a">kubeadm upgrade node</tspan>  (apply 아님!)</text>

    <rect x="500" y="242" width="430" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="516" y="269" fill="#0f172a">3. <tspan font-family="Consolas,'D2Coding',monospace" fill="#92400e">drain k8s-w1 --ignore-daemonsets</tspan></text>

    <rect x="500" y="296" width="430" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="516" y="323" fill="#0f172a">4. kubelet 설치 → daemon-reload, restart</text>

    <rect x="500" y="350" width="430" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="516" y="377" fill="#0f172a">5. <tspan font-family="Consolas,'D2Coding',monospace" fill="#166534">uncordon k8s-w1</tspan> → k8s-w2 반복</text>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="715" y1="178" x2="715" y2="187" marker-end="url(#arrow)"/>
    <line x1="715" y1="232" x2="715" y2="241" marker-end="url(#arrow)"/>
    <line x1="715" y1="286" x2="715" y2="295" marker-end="url(#arrow)"/>
    <line x1="715" y1="340" x2="715" y2="349" marker-end="url(#arrow)"/>
  </g>

  <!-- connector CP -> worker -->
  <path d="M460,426 C480,426 480,156 494,156" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- notes -->
  <rect x="30" y="470" width="900" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="498" font-size="14" font-weight="700" fill="#334155">기억할 규칙</text>
  <g font-size="13" fill="#334155">
    <text x="50" y="524">• 마이너는 건너뛰지 않는다 (1.34 → 1.37 한 번에 불가). 추가 컨트롤 플레인은 워커처럼 <tspan font-family="Consolas,'D2Coding',monospace">upgrade node</tspan></text>
    <text x="50" y="548">• apply 직후 get nodes VERSION은 아직 옛 값 — VERSION은 kubelet 버전이다</text>
    <text x="50" y="572">• kubeadm upgrade는 그 노드의 인증서도 자동 갱신 (<tspan font-family="Consolas,'D2Coding',monospace">--certificate-renewal=false</tspan>로 끔)</text>
  </g>
</svg>
