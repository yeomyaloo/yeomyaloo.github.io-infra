<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">컨트롤 플레인 장애 진단 흐름</text>

  <!-- start -->
  <rect x="300" y="54" width="360" height="44" rx="22" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">증상: kubectl 실패 / Pod가 안 생김</text>

  <!-- Q1 -->
  <rect x="355" y="124" width="250" height="44" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">kubectl이 응답하나?</text>

  <!-- R1 yes -->
  <rect x="660" y="112" width="280" height="180" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="800" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">예 → kubectl로 본다</text>
  <text x="676" y="164" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">kubectl -n kube-system get pods</text>
  <text x="676" y="192" font-size="13" fill="#334155">Pending + Events 없음</text>
  <text x="696" y="210" font-size="13" font-weight="700" fill="#326ce5">→ kube-scheduler</text>
  <text x="676" y="236" font-size="13" fill="#334155">ReplicaSet이 안 생김</text>
  <text x="696" y="254" font-size="13" font-weight="700" fill="#326ce5">→ kube-controller-manager</text>
  <text x="676" y="280" font-size="12" fill="#64748b">미러 Pod의 logs·describe로 원인 확인</text>

  <!-- B no -->
  <rect x="320" y="196" width="320" height="58" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">아니오 → k8s-cp에 접속</text>
  <text x="480" y="241" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">sudo crictl ps -a --name kube-apiserver</text>

  <!-- Q2 -->
  <rect x="355" y="282" width="250" height="44" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">컨테이너가 보이나?</text>

  <!-- L none -->
  <rect x="20" y="356" width="290" height="112" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">없음 → Pod 생성 자체 실패</text>
  <text x="165" y="406" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">sudo journalctl -u kubelet</text>
  <text x="165" y="432" text-anchor="middle" font-size="12.5" fill="#334155">YAML 문법 오류</text>
  <text x="165" y="452" text-anchor="middle" font-size="12.5" fill="#334155">이미지 이름 오류(pull 실패)</text>

  <!-- M exited -->
  <rect x="335" y="356" width="290" height="112" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Exited 반복 → 뜨자마자 죽음</text>
  <text x="480" y="406" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">sudo crictl logs --tail=20 ID</text>
  <text x="480" y="432" text-anchor="middle" font-size="12.5" fill="#334155">마지막 에러 문장을 읽는다</text>
  <text x="480" y="452" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#64748b">/var/log/pods/... 에도 있음</text>

  <!-- E typical -->
  <rect x="650" y="356" width="290" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="795" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">자주 보는 마지막 줄</text>
  <text x="666" y="406" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">unknown flag</text>
  <text x="800" y="406" font-size="12.5" fill="#334155">플래그 오타</text>
  <text x="666" y="430" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">no such file</text>
  <text x="800" y="430" font-size="12.5" fill="#334155">경로 오타</text>
  <text x="666" y="454" font-family="Consolas,'D2Coding',monospace" font-size="11.5" fill="#0f172a">:2379 refused</text>
  <text x="800" y="454" font-size="12.5" fill="#334155">etcd 연결</text>

  <!-- fix -->
  <rect x="160" y="496" width="640" height="48" rx="10" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">/etc/kubernetes/manifests/*.yaml 수정 (백업은 폴더 밖에)</text>
  <text x="480" y="536" text-anchor="middle" font-size="12.5" fill="#14532d">kubelet이 다시 띄움 → watch crictl ps → kubectl로 검증</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="480" y1="98" x2="480" y2="122"/>
    <line x1="605" y1="146" x2="658" y2="146"/>
    <line x1="480" y1="168" x2="480" y2="194"/>
    <line x1="480" y1="254" x2="480" y2="280"/>
    <path d="M355,304 L165,304 L165,354"/>
    <line x1="480" y1="326" x2="480" y2="354"/>
    <line x1="625" y1="412" x2="648" y2="412"/>
    <path d="M165,468 L165,482 L300,482 L300,494"/>
    <line x1="480" y1="468" x2="480" y2="494"/>
  </g>
  <g font-size="12.5" font-weight="700">
    <text x="612" y="138" fill="#16a34a">예</text>
    <text x="488" y="186" fill="#dc2626">아니오</text>
    <text x="250" y="298" fill="#64748b">없음</text>
    <text x="488" y="344" fill="#64748b">Exited</text>
  </g>
</svg>
