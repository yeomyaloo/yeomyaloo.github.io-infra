<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">Deployment 리비전과 롤백 — 과제 1의 흐름</text>

  <!-- timeline -->
  <rect x="30" y="64" width="190" height="96" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="125" y="90" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">① create deploy</text>
  <text x="125" y="115" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">nginx:1.27</text>
  <text x="125" y="142" font-size="13" fill="#64748b" text-anchor="middle">리비전 1</text>

  <rect x="250" y="64" width="190" height="96" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="345" y="90" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">② set image</text>
  <text x="345" y="115" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">nginx:1.28</text>
  <text x="345" y="142" font-size="13" fill="#64748b" text-anchor="middle">리비전 2</text>

  <rect x="470" y="64" width="190" height="96" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="90" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">③ set image</text>
  <text x="565" y="115" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">nginx:1.99-bad</text>
  <text x="565" y="142" font-size="12" fill="#dc2626" text-anchor="middle">리비전 3 · ImagePullBackOff</text>

  <rect x="690" y="64" width="190" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="90" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">④ rollout undo</text>
  <text x="785" y="115" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">--to-revision=2</text>
  <text x="785" y="142" font-size="13" fill="#16a34a" text-anchor="middle">리비전 2 → 4로 재번호</text>

  <line x1="220" y1="112" x2="248" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="112" x2="468" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="112" x2="688" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ReplicaSets -->
  <text x="30" y="210" font-size="15" font-weight="bold" fill="#334155">④ 이후의 ReplicaSet (옛 RS는 0개로 보관)</text>

  <rect x="30" y="226" width="250" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="252" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">RS shop-6c… (1.27)</text>
  <text x="155" y="278" font-size="13" fill="#64748b" text-anchor="middle">replicas 0 · 리비전 1</text>
  <text x="155" y="300" font-size="12" fill="#64748b" text-anchor="middle">undo --to-revision=1이면 재사용</text>

  <rect x="325" y="226" width="250" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="252" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">RS shop-7d… (1.28)</text>
  <text x="450" y="278" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">replicas 4 · 리비전 4</text>
  <text x="450" y="300" font-size="12" fill="#64748b" text-anchor="middle">새 RS를 만들지 않고 되살림</text>

  <rect x="620" y="226" width="250" height="90" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="745" y="252" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">RS shop-5f… (1.99-bad)</text>
  <text x="745" y="278" font-size="13" fill="#dc2626" text-anchor="middle">replicas 0 · 리비전 3</text>
  <text x="745" y="300" font-size="12" fill="#64748b" text-anchor="middle">실패한 Pod 1개도 정리됨</text>

  <path d="M785,160 C785,200 600,196 520,224" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>

  <!-- notes -->
  <rect x="30" y="340" width="410" height="96" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="46" y="366" font-size="14" font-weight="bold" fill="#b45309">maxSurge 1 · maxUnavailable 0</text>
  <text x="46" y="390" font-size="13" fill="#334155">③에서 새 Pod 1개만 실패, 기존 4개는 그대로</text>
  <text x="46" y="412" font-size="13" fill="#334155">→ 잘못된 이미지로도 서비스 중단이 없음</text>

  <rect x="470" y="340" width="400" height="96" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="486" y="366" font-size="14" font-weight="bold" fill="#326ce5">rollout history 결과</text>
  <text x="486" y="390" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">REVISION 1, 3, 4</text>
  <text x="486" y="412" font-size="13" fill="#334155">리비전 2는 사라지고 같은 템플릿이 4가 됨</text>
</svg>
