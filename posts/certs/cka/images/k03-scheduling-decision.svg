<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">스케줄러가 노드를 고르는 과정 — 과제 5의 etl Pod</text>

  <!-- Pod spec -->
  <rect x="30" y="62" width="270" height="168" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="46" y="88" font-size="15" font-weight="bold" fill="#326ce5">Pod 템플릿 (etl)</text>
  <text x="46" y="116" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">nodeAffinity: team In [data]</text>
  <text x="46" y="140" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">tolerations: team=data</text>
  <text x="131.8" y="158" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">:NoSchedule</text>
  <text x="46" y="182" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">requests: cpu 500m</text>
  <text x="46" y="206" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">priorityClassName: (선택)</text>

  <line x1="300" y1="146" x2="328" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- scheduler -->
  <rect x="330" y="62" width="540" height="168" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="346" y="88" font-size="15" font-weight="bold" fill="#334155">kube-scheduler</text>

  <rect x="346" y="100" width="168" height="118" rx="6" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="430" y="122" font-size="13" font-weight="bold" fill="#326ce5" text-anchor="middle">① 필터 (불가 노드 제외)</text>
  <text x="356" y="146" font-size="12" fill="#334155">· requests 여유</text>
  <text x="356" y="166" font-size="12" fill="#334155">· nodeSelector / affinity</text>
  <text x="356" y="186" font-size="12" fill="#334155">· taint ↔ toleration</text>
  <text x="356" y="206" font-size="12" fill="#334155">· PV nodeAffinity (K05)</text>

  <rect x="526" y="100" width="160" height="118" rx="6" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="606" y="122" font-size="13" font-weight="bold" fill="#326ce5" text-anchor="middle">② 점수 (최선 선택)</text>
  <text x="536" y="146" font-size="12" fill="#334155">· preferred affinity</text>
  <text x="536" y="166" font-size="12" fill="#334155">· PreferNoSchedule</text>
  <text x="536" y="186" font-size="12" fill="#334155">· 고르게 분산</text>

  <rect x="698" y="100" width="160" height="118" rx="6" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="778" y="122" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">③ 남는 노드 없음</text>
  <text x="708" y="146" font-size="12" fill="#334155">· 우선순위가 높으면</text>
  <text x="721.2" y="166" font-size="12" fill="#334155">낮은 Pod를 선점</text>
  <text x="708" y="186" font-size="12" fill="#334155">· 아니면 Pending</text>
  <text x="721.2" y="206" font-size="12" fill="#64748b">(Events에 사유)</text>

  <!-- nodes -->
  <rect x="30" y="300" width="260" height="140" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="326" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">k8s-cp</text>
  <text x="44" y="352" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">taint: control-plane</text>
  <text x="90.2" y="370" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">:NoSchedule</text>
  <text x="44" y="398" font-size="13" fill="#dc2626">✗ 이 taint의 toleration 없음</text>
  <text x="44" y="420" font-size="13" fill="#dc2626">✗ 라벨 team=data 없음</text>

  <rect x="320" y="300" width="260" height="140" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="326" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">k8s-w1</text>
  <text x="334" y="352" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">taint: 없음</text>
  <text x="334" y="370" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">label: (team 없음)</text>
  <text x="334" y="398" font-size="13" fill="#dc2626">✗ nodeAffinity 불일치</text>
  <text x="334" y="420" font-size="12" fill="#64748b">toleration만 있었다면 여기도 배치</text>

  <rect x="610" y="300" width="260" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="326" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">k8s-w2</text>
  <text x="624" y="352" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">taint: team=data:NoSchedule</text>
  <text x="624" y="370" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">label: team=data</text>
  <text x="624" y="398" font-size="13" fill="#16a34a" font-weight="bold">✓ 통과 → 3개 모두 배치</text>
  <text x="624" y="420" font-size="12" fill="#64748b">일반 Pod는 taint로 밀려남</text>

  <line x1="420" y1="230" x2="170" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)"/>
  <line x1="440" y1="230" x2="450" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)"/>
  <line x1="606" y1="230" x2="730" y2="296" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>

  <rect x="30" y="462" width="840" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="487" font-size="14" fill="#334155" text-anchor="middle">taint = 노드가 밀어냄 · toleration = 허용만 함 · affinity/nodeSelector = 끌어당김 → 전용 노드는 셋을 짝으로</text>
</svg>
