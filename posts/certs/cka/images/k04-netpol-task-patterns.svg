<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">NetworkPolicy 과제 문장 → YAML 세 부분으로 나누기</text>

  <!-- sentence -->
  <rect x="30" y="56" width="840" height="74" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="50" y="86" font-size="16" fill="#334155">"<tspan fill="#16a34a" font-weight="bold">monitoring 네임스페이스의 app=prometheus Pod</tspan>만</text>
  <text x="50" y="114" font-size="16" fill="#334155"> <tspan fill="#326ce5" font-weight="bold">k04의 app=web Pod</tspan>의 <tspan fill="#b45309" font-weight="bold">TCP 80</tspan>에 접근할 수 있게 하라"</text>

  <!-- yaml -->
  <rect x="30" y="150" width="440" height="270" rx="8" fill="#0f172a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#e2e8f0">
    <text x="46" y="176">metadata: {name: web-allow-prom, namespace: k04}</text>
    <text x="46" y="198">spec:</text>
    <rect x="40" y="206" width="420" height="24" rx="3" fill="#326ce5" fill-opacity="0.35"/>
    <text x="60.3" y="223">podSelector: {matchLabels: {app: web}}</text>
    <text x="60.3" y="246">policyTypes: [Ingress]</text>
    <text x="60.3" y="268">ingress:</text>
    <rect x="40" y="276" width="420" height="72" rx="3" fill="#16a34a" fill-opacity="0.35"/>
    <text x="60.3" y="292">- from:</text>
    <text x="74.6" y="312">- namespaceSelector: {matchLabels:</text>
    <text x="103.2" y="330">{kubernetes.io/metadata.name: monitoring}}</text>
    <text x="88.9" y="346">podSelector: {matchLabels: {app: prometheus}}</text>
    <rect x="40" y="356" width="420" height="44" rx="3" fill="#f59e0b" fill-opacity="0.4"/>
    <text x="74.6" y="374">ports:</text>
    <text x="74.6" y="394">- {protocol: TCP, port: 80}</text>
  </g>

  <!-- explanations -->
  <rect x="510" y="150" width="360" height="78" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="526" y="174" font-size="14" font-weight="bold" fill="#326ce5">① 대상 = spec.podSelector</text>
  <text x="526" y="196" font-size="12" fill="#334155">정책이 "보호하는" Pod. 정책의 네임스페이스 안에서만.</text>
  <text x="526" y="216" font-size="12" fill="#334155">{} 이면 그 네임스페이스의 모든 Pod</text>

  <rect x="510" y="240" width="360" height="98" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="526" y="264" font-size="14" font-weight="bold" fill="#16a34a">② 출처 = ingress.from</text>
  <text x="526" y="286" font-size="12" fill="#334155">두 셀렉터가 한 항목(하이픈 1개) → AND</text>
  <text x="526" y="306" font-size="12" fill="#334155">하이픈 2개로 나누면 → OR (과하게 허용)</text>
  <text x="526" y="326" font-size="12" fill="#334155">NS 라벨은 kubernetes.io/metadata.name 자동</text>

  <rect x="510" y="350" width="360" height="70" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="526" y="374" font-size="14" font-weight="bold" fill="#b45309">③ 포트 = Pod(컨테이너) 포트</text>
  <text x="526" y="396" font-size="12" fill="#334155">Service가 8080→80이면 정책엔 80</text>
  <text x="526" y="414" font-size="12" fill="#64748b">(HTTPRoute backendRefs는 반대로 Service 포트)</text>

  <line x1="460" y1="218" x2="508" y2="190" stroke="#326ce5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="312" x2="508" y2="290" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="380" x2="508" y2="384" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- matrix -->
  <text x="30" y="452" font-size="15" font-weight="bold" fill="#334155">검증 — 허용 하나, 차단 여럿을 모두 시험</text>
  <rect x="30" y="466" width="200" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="492" font-size="12" fill="#334155" text-anchor="middle">monitoring / app=prometheus</text>
  <text x="130" y="520" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">✓ 허용</text>
  <rect x="243" y="466" width="200" height="72" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="343" y="492" font-size="12" fill="#334155" text-anchor="middle">monitoring / app=other</text>
  <text x="343" y="520" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">✗ 차단 (Pod 불일치)</text>
  <rect x="456" y="466" width="200" height="72" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="556" y="492" font-size="12" fill="#334155" text-anchor="middle">default / app=prometheus</text>
  <text x="556" y="520" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">✗ 차단 (NS 불일치)</text>
  <rect x="669" y="466" width="201" height="72" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="769" y="492" font-size="12" fill="#334155" text-anchor="middle">monitoring / prometheus :8080</text>
  <text x="769" y="520" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">✗ 차단 (포트)</text>
</svg>
