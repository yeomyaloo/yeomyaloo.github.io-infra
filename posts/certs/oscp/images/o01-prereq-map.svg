<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">선행 지식 6영역 → PEN-200 → OSCP+</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">각 영역은 "관리자·방어자로서 할 수 있는 일"로 점검하고, 이 블로그 글로 메운다</text>

  <!-- 왼쪽 열 -->
  <g>
    <rect x="30" y="80" width="300" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    <text x="50" y="110" font-size="17" font-weight="700" fill="#14532d">리눅스</text>
    <text x="50" y="138" font-size="13" fill="#0f172a">권한·SUID·서비스·cron·sudoers 읽기</text>
    <text x="50" y="162" font-size="13" fill="#334155">RHCSA R01·R03·R08·R09</text>
    <text x="50" y="180" font-size="13" fill="#334155">해킹 06 · Day 67 하드닝</text>

    <rect x="30" y="210" width="300" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    <text x="50" y="240" font-size="17" font-weight="700" fill="#14532d">윈도우</text>
    <text x="50" y="268" font-size="13" fill="#0f172a">사용자·그룹·서비스·특권, 이벤트 로그</text>
    <text x="50" y="292" font-size="13" fill="#334155">해킹 25 (계정·권한 기초)</text>
    <text x="50" y="310" font-size="13" fill="#334155">해킹 27 · 해킹 30 (로그·탐지)</text>

    <rect x="30" y="340" width="300" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    <text x="50" y="370" font-size="17" font-weight="700" fill="#14532d">네트워크</text>
    <text x="50" y="398" font-size="13" fill="#0f172a">TCP/UDP·포트·라우팅·NAT·다중 대역</text>
    <text x="50" y="422" font-size="13" fill="#334155">Day 05 · Day 22 · H02</text>
    <text x="50" y="440" font-size="13" fill="#334155">해킹 03 · 해킹 21 (Wireshark)</text>
  </g>

  <!-- 오른쪽 열 -->
  <g>
    <rect x="630" y="80" width="300" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    <text x="650" y="110" font-size="17" font-weight="700" fill="#14532d">웹</text>
    <text x="650" y="138" font-size="13" fill="#0f172a">HTTP·세션 관찰, 취약점 원리와 안전한 코드</text>
    <text x="650" y="162" font-size="13" fill="#334155">해킹 04 · 05 · 13 · 17</text>
    <text x="650" y="180" font-size="13" fill="#334155">PortSwigger Web Security Academy</text>

    <rect x="630" y="210" width="300" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    <text x="650" y="240" font-size="17" font-weight="700" fill="#14532d">스크립팅</text>
    <text x="650" y="268" font-size="13" fill="#0f172a">Bash 가공, Python HTTP 스크립트 읽기</text>
    <text x="650" y="292" font-size="13" fill="#334155">RHCSA R02 (셸 스크립트)</text>
    <text x="650" y="310" font-size="13" fill="#334155">남의 코드를 실행 전에 읽기부터</text>

    <rect x="630" y="340" width="300" height="110" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="650" y="370" font-size="17" font-weight="700" fill="#3730a3">Active Directory</text>
    <text x="650" y="398" font-size="13" fill="#0f172a">도메인·GPO·Kerberos/NTLM·설정 실수</text>
    <text x="650" y="422" font-size="13" fill="#334155">해킹 25 격리 랩 도메인</text>
    <text x="650" y="440" font-size="13" fill="#334155">해킹 31 (레드 vs 블루)</text>
  </g>

  <!-- 가운데 -->
  <rect x="380" y="150" width="200" height="110" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="480" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">PEN-200</text>
  <text x="480" y="214" text-anchor="middle" font-size="13" fill="#0f172a">모듈 → 모듈 랩</text>
  <text x="480" y="236" text-anchor="middle" font-size="13" fill="#0f172a">→ 챌린지 랩 9개</text>

  <line x1="480" y1="260" x2="480" y2="318" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="380" y="322" width="200" height="90" rx="14" fill="#0f172a"/>
  <text x="480" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">OSCP+ 시험</text>
  <text x="480" y="382" text-anchor="middle" font-size="12" fill="#e2e8f0">비중 1위 문서화 33%</text>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#e2e8f0">2위 AD 26%</text>

  <!-- 화살표: 영역 → PEN-200 -->
  <g stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M330,135 L378,170"/>
    <path d="M330,265 L378,225"/>
    <path d="M330,395 L378,252"/>
    <path d="M630,135 L582,170"/>
    <path d="M630,265 L582,225"/>
    <path d="M630,395 L582,252"/>
  </g>

  <rect x="30" y="470" width="900" height="38" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="480" y="495" text-anchor="middle" font-size="13" fill="#7f1d1d">영역별 "예"가 절반 미만이면 기초 단계를 길게 — 그리고 기초는 랩 기간이 시작되기(상품 구매) 전에 끝낸다</text>
</svg>
