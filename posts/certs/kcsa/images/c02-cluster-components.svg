<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">클러스터 컴포넌트와 지켜야 할 지점</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">kubeadm 기본 포트 기준 · 모든 화살표는 TLS(대부분 상호 인증서) · 빨간 글씨 = CIS 벤치마크 단골 점검 항목</text>

  <!-- client -->
  <rect x="40" y="140" width="130" height="80" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="105" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">kubectl · 사용자</text>
  <text x="105" y="192" text-anchor="middle" font-size="12" fill="#334155">X.509 인증서</text>
  <text x="105" y="209" text-anchor="middle" font-size="12" fill="#334155">· OIDC 토큰</text>
  <line x1="172" y1="180" x2="228" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="250" width="130" height="150" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="105" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">클라이언트 보안</text>
  <text x="52" y="302" font-size="12" fill="#334155">kubeconfig =</text>
  <text x="52" y="320" font-size="12" fill="#334155">자격 증명 그 자체</text>
  <text x="52" y="346" font-size="12" fill="#b91c1c">파일 권한 600</text>
  <text x="52" y="372" font-size="12" fill="#334155">짧은 수명 토큰,</text>
  <text x="52" y="390" font-size="12" fill="#334155">공유 admin 금지</text>

  <!-- control plane -->
  <rect x="200" y="90" width="400" height="470" rx="14" fill="#f1f5f9" stroke="#326ce5" stroke-width="2"/>
  <text x="216" y="114" font-size="14" font-weight="700" fill="#1e3a8a">컨트롤 플레인 노드</text>

  <rect x="230" y="130" width="340" height="100" rx="10" fill="#326ce5"/>
  <text x="400" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">kube-apiserver :6443</text>
  <text x="400" y="184" text-anchor="middle" font-size="12" fill="#ffffff">익명 접근 최소화 · 인가 Node,RBAC (AlwaysAllow 금지)</text>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#ffffff">어드미션(NodeRestriction · PSA) · 감사 로그</text>

  <rect x="230" y="270" width="160" height="112" rx="10" fill="#e8eefc" stroke="#326ce5"/>
  <text x="310" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">controller-manager</text>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#1e3a8a">:10257</text>
  <text x="244" y="336" font-size="12" fill="#b91c1c">컨트롤러별 SA 사용</text>
  <text x="244" y="354" font-size="12" fill="#b91c1c">bind 127.0.0.1</text>
  <text x="244" y="372" font-size="12" fill="#b91c1c">profiling=false</text>

  <rect x="410" y="270" width="160" height="112" rx="10" fill="#e8eefc" stroke="#326ce5"/>
  <text x="490" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">kube-scheduler</text>
  <text x="490" y="312" text-anchor="middle" font-size="12" fill="#1e3a8a">:10259</text>
  <text x="424" y="336" font-size="12" fill="#b91c1c">bind 127.0.0.1</text>
  <text x="424" y="354" font-size="12" fill="#b91c1c">profiling=false</text>
  <text x="424" y="372" font-size="12" fill="#334155">kubeconfig 권한</text>

  <line x1="310" y1="268" x2="310" y2="234" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="268" x2="490" y2="234" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="232" x2="400" y2="416" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="404" font-size="11" fill="#334155">mTLS</text>

  <rect x="230" y="420" width="340" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="400" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">etcd :2379 (클라이언트) · :2380 (피어)</text>
  <text x="246" y="472" font-size="12" fill="#334155">클러스터 상태 전부 · 사실상 "클러스터의 root"</text>
  <text x="246" y="494" font-size="12" fill="#b91c1c">클라이언트 인증서 필수 · API 서버만 접근</text>
  <text x="246" y="516" font-size="12" fill="#b91c1c">Secret 저장 데이터 암호화 · 백업 파일도 보호</text>

  <!-- worker -->
  <rect x="640" y="90" width="280" height="470" rx="14" fill="#f1f5f9" stroke="#4f46e5" stroke-width="2"/>
  <text x="656" y="114" font-size="14" font-weight="700" fill="#312e81">워커 노드</text>

  <rect x="660" y="130" width="240" height="110" rx="10" fill="#4f46e5"/>
  <text x="780" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">kubelet :10250</text>
  <text x="676" y="182" font-size="12" fill="#ffffff">익명 인증 끄기 (anonymous=false)</text>
  <text x="676" y="204" font-size="12" fill="#ffffff">인가 Webhook · readOnlyPort 0</text>
  <text x="676" y="226" font-size="12" fill="#ffffff">자기 노드 Pod만 (Node 인가)</text>

  <line x1="574" y1="175" x2="656" y2="175" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="615" y="166" text-anchor="middle" font-size="11" fill="#334155">exec·logs</text>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#334155">상태 보고</text>

  <rect x="660" y="262" width="240" height="78" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="780" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">컨테이너 런타임</text>
  <text x="676" y="312" font-size="12" fill="#334155">containerd · CRI-O</text>
  <text x="676" y="330" font-size="12" fill="#b91c1c">런타임 소켓 접근 = 노드 root</text>

  <rect x="660" y="358" width="240" height="78" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="780" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Pod</text>
  <text x="676" y="408" font-size="12" fill="#334155">securityContext · PSS</text>
  <text x="676" y="426" font-size="12" fill="#334155">SA 토큰 자동 마운트 최소화</text>

  <rect x="660" y="454" width="240" height="86" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="780" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">kube-proxy</text>
  <text x="676" y="504" font-size="12" fill="#334155">Service 규칙(iptables·nftables·IPVS)</text>
  <text x="676" y="524" font-size="12" fill="#b91c1c">metrics :10249 외부 노출 금지</text>

  <rect x="40" y="574" width="880" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="596" text-anchor="middle" font-size="13" fill="#334155">그 밖의 커리큘럼 항목: Container Networking(CNI가 NetworkPolicy 집행·노드 간 암호화) · Storage(볼륨 암호화, hostPath 제한)</text>
</svg>
