<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">공격 단계(MITRE ATT&amp;CK 전술)로 본 클러스터 침해 시나리오</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">위: 공격자가 하는 일 · 아래: 그 단계에서 사슬을 끊는 통제 (창작 시나리오)</text>

  <g font-size="12">
    <!-- 1 -->
    <rect x="30" y="90" width="138" height="140" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="99" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">초기 접근</text>
    <text x="99" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Initial Access</text>
    <text x="42" y="160" fill="#334155">취약한 웹앱</text>
    <text x="42" y="178" fill="#334155">의존성으로 RCE</text>
    <text x="42" y="210" fill="#64748b">위협 모델: 악성 코드</text>
    <text x="42" y="224" fill="#64748b">실행</text>
    <line x1="170" y1="160" x2="184" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 -->
    <rect x="186" y="90" width="138" height="140" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="255" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">탐색</text>
    <text x="255" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Discovery</text>
    <text x="198" y="160" fill="#334155">환경 변수 · 마운트된</text>
    <text x="198" y="178" fill="#334155">SA 토큰 확인</text>
    <text x="198" y="210" fill="#64748b">위협 모델: 민감</text>
    <text x="198" y="224" fill="#64748b">데이터 접근</text>
    <line x1="326" y1="160" x2="340" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 -->
    <rect x="342" y="90" width="138" height="140" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="411" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">자격 증명 접근</text>
    <text x="411" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Credential Access</text>
    <text x="354" y="160" fill="#334155">토큰으로 Secret</text>
    <text x="354" y="178" fill="#334155">목록 · 메타데이터 API</text>
    <text x="354" y="210" fill="#64748b">위협 모델: 민감</text>
    <text x="354" y="224" fill="#64748b">데이터 접근</text>
    <line x1="482" y1="160" x2="496" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 -->
    <rect x="498" y="90" width="138" height="140" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="567" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">권한 상승</text>
    <text x="567" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Privilege Escalation</text>
    <text x="510" y="160" fill="#334155">privileged Pod</text>
    <text x="510" y="178" fill="#334155">+ hostPath로 탈출</text>
    <text x="510" y="210" fill="#64748b">위협 모델: 권한</text>
    <text x="510" y="224" fill="#64748b">상승</text>
    <line x1="638" y1="160" x2="652" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5 -->
    <rect x="654" y="90" width="138" height="140" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="723" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">지속</text>
    <text x="723" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Persistence</text>
    <text x="666" y="160" fill="#334155">백도어 DaemonSet ·</text>
    <text x="666" y="178" fill="#334155">정적 Pod 매니페스트</text>
    <text x="666" y="210" fill="#64748b">위협 모델: 지속</text>
    <line x1="794" y1="160" x2="808" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 6 -->
    <rect x="810" y="90" width="120" height="140" rx="10" fill="#b91c1c"/>
    <text x="870" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">영향</text>
    <text x="870" y="132" text-anchor="middle" font-size="11" fill="#ffffff">Impact</text>
    <text x="820" y="160" fill="#ffffff">크립토마이닝</text>
    <text x="820" y="178" fill="#ffffff">· 데이터 파괴</text>
    <text x="820" y="210" fill="#ffffff">위협 모델:</text>
    <text x="820" y="224" fill="#ffffff">서비스 거부</text>
  </g>

  <!-- controls -->
  <g font-size="12">
    <line x1="99" y1="292" x2="99" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="30" y="294" width="138" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="42" y="318" fill="#14532d">이미지 스캔·SBOM</text>
    <text x="42" y="338" fill="#14532d">WAF · 패치</text>

    <line x1="255" y1="292" x2="255" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="186" y="294" width="138" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="198" y="318" fill="#14532d">automountService-</text>
    <text x="198" y="336" fill="#14532d">AccountToken: false</text>
    <text x="198" y="362" fill="#14532d">Falco 셸 탐지</text>

    <line x1="411" y1="292" x2="411" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="342" y="294" width="138" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="354" y="318" fill="#14532d">최소 RBAC</text>
    <text x="354" y="338" fill="#14532d">egress 정책으로</text>
    <text x="354" y="358" fill="#14532d">메타데이터 API 차단</text>

    <line x1="567" y1="292" x2="567" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="498" y="294" width="138" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="510" y="318" fill="#14532d">PSS restricted</text>
    <text x="510" y="338" fill="#14532d">seccomp · AppArmor</text>
    <text x="510" y="358" fill="#14532d">샌드박스 런타임</text>

    <line x1="723" y1="292" x2="723" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="654" y="294" width="138" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="666" y="318" fill="#14532d">감사 로그 경보</text>
    <text x="666" y="338" fill="#14532d">어드미션 정책</text>
    <text x="666" y="358" fill="#14532d">노드 파일 무결성</text>

    <line x1="870" y1="292" x2="870" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
    <rect x="810" y="294" width="120" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="820" y="318" fill="#14532d">limits · 쿼터</text>
    <text x="820" y="338" fill="#14532d">백업 · 이상 탐지</text>
  </g>

  <rect x="30" y="404" width="900" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="426" text-anchor="middle" font-size="13" fill="#334155">MITRE ATT&amp;CK Containers 매트릭스와 Microsoft의 Threat Matrix for Kubernetes가 이런 전술 틀로 기법을 정리한다</text>
  <text x="480" y="446" text-anchor="middle" font-size="12" fill="#64748b">회색 글씨 = KCSA 커리큘럼 "Kubernetes Threat Model" 항목과의 대응 · 한 단계만 끊어도 사슬 전체가 무너진다(심층 방어)</text>
</svg>
