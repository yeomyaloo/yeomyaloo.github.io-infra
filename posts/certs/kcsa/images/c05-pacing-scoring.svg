<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">C05 모의고사 — 90분 시간 배분과 채점 기준</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">60문항 · 문항당 1점 · 45점(75%) 이상이면 합격선 통과 · 도메인별 문항 수는 공식 비중에 맞춤</text>

  <!-- timeline: 90 min = 810px, 9px/min, x 60..870 -->
  <text x="60" y="100" font-size="15" font-weight="700" fill="#334155">시간 배분 (1분 = 9px)</text>
  <rect x="60" y="114" width="540" height="56" rx="8" fill="#326ce5"/>
  <text x="330" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1회독 60분 — 문항당 1분, 모르면 깃발 표시 후 넘김</text>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#ffffff">15분마다 15문항 지점 확인 (Q15 · Q30 · Q45 · Q60)</text>
  <rect x="600" y="114" width="180" height="56" rx="8" fill="#4f46e5"/>
  <text x="690" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">깃발 재검토 20분</text>
  <text x="690" y="160" text-anchor="middle" font-size="12" fill="#ffffff">소거법으로 2지선다까지</text>
  <rect x="780" y="114" width="90" height="56" rx="8" fill="#b91c1c"/>
  <text x="825" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">10분</text>
  <text x="825" y="160" text-anchor="middle" font-size="12" fill="#ffffff">빈칸 0 확인</text>
  <g font-size="12" fill="#64748b">
    <line x1="60" y1="176" x2="60" y2="184" stroke="#64748b"/><text x="60" y="198" text-anchor="middle">0</text>
    <line x1="195" y1="176" x2="195" y2="184" stroke="#64748b"/><text x="195" y="198" text-anchor="middle">15</text>
    <line x1="330" y1="176" x2="330" y2="184" stroke="#64748b"/><text x="330" y="198" text-anchor="middle">30</text>
    <line x1="465" y1="176" x2="465" y2="184" stroke="#64748b"/><text x="465" y="198" text-anchor="middle">45</text>
    <line x1="600" y1="176" x2="600" y2="184" stroke="#64748b"/><text x="600" y="198" text-anchor="middle">60</text>
    <line x1="780" y1="176" x2="780" y2="184" stroke="#64748b"/><text x="780" y="198" text-anchor="middle">80</text>
    <line x1="870" y1="176" x2="870" y2="184" stroke="#64748b"/><text x="870" y="198" text-anchor="middle">90분</text>
  </g>

  <!-- domain counts: 1 question = 13px, x 300.. -->
  <text x="60" y="240" font-size="15" font-weight="700" fill="#334155">도메인별 문항 수 (1문항 = 13px)</text>
  <g font-size="13">
    <text x="60" y="270" fill="#0f172a">Overview of Cloud Native Security 14%</text>
    <rect x="360" y="256" width="104" height="20" rx="4" fill="#326ce5"/><text x="472" y="271" fill="#326ce5" font-weight="700">8문항 · Q1~Q8</text>
    <text x="60" y="298" fill="#0f172a">Cluster Component Security 22%</text>
    <rect x="360" y="284" width="169" height="20" rx="4" fill="#326ce5"/><text x="537" y="299" fill="#326ce5" font-weight="700">13문항 · Q9~Q21</text>
    <text x="60" y="326" fill="#0f172a">Security Fundamentals 22%</text>
    <rect x="360" y="312" width="169" height="20" rx="4" fill="#b91c1c"/><text x="537" y="327" fill="#b91c1c" font-weight="700">13문항 · Q22~Q34</text>
    <text x="60" y="354" fill="#0f172a">Threat Model 16%</text>
    <rect x="360" y="340" width="130" height="20" rx="4" fill="#b91c1c"/><text x="498" y="355" fill="#b91c1c" font-weight="700">10문항 · Q35~Q44</text>
    <text x="60" y="382" fill="#0f172a">Platform Security 16%</text>
    <rect x="360" y="368" width="130" height="20" rx="4" fill="#4f46e5"/><text x="498" y="383" fill="#4f46e5" font-weight="700">10문항 · Q45~Q54</text>
    <text x="60" y="410" fill="#0f172a">Compliance and Frameworks 10%</text>
    <rect x="360" y="396" width="78" height="20" rx="4" fill="#4f46e5"/><text x="446" y="411" fill="#4f46e5" font-weight="700">6문항 · Q55~Q60</text>
  </g>

  <!-- score box -->
  <rect x="690" y="228" width="240" height="190" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="810" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">점수 해석</text>
  <rect x="706" y="270" width="208" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="810" y="293" text-anchor="middle" font-size="13" fill="#14532d">51점 이상 · 응시 준비 완료</text>
  <rect x="706" y="314" width="208" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="337" text-anchor="middle" font-size="13" fill="#78350f">45~50점 · 약한 도메인 보강</text>
  <rect x="706" y="358" width="208" height="36" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="810" y="381" text-anchor="middle" font-size="13" fill="#7f1d1d">44점 이하 · C01~C04 재학습</text>
  <text x="810" y="410" text-anchor="middle" font-size="11" fill="#64748b">실제 시험 문항·채점 방식은 다를 수 있음</text>

  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#64748b">LF 공식: Multiple Choice Exams 60문항 · 90분 · 75% 이상 합격 (2026-11-19 확인) · 이 탭의 문항은 모두 창작</text>
</svg>
