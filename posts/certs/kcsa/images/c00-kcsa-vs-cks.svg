<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">KCSA와 CKS — 같은 보안, 다른 시험</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">KCSA는 "왜·무엇을"을 고르는 시험, CKS는 "어떻게"를 손으로 하는 시험 (2026-11-19 공식 자료 기준)</text>

  <!-- header -->
  <rect x="40" y="84" width="200" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="140" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">항목</text>
  <rect x="250" y="84" width="330" height="40" rx="6" fill="#326ce5"/>
  <text x="415" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">KCSA (Associate)</text>
  <rect x="590" y="84" width="330" height="40" rx="6" fill="#b91c1c"/>
  <text x="755" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CKS (Specialist)</text>

  <!-- rows: y step 46 -->
  <g font-size="14">
    <rect x="40" y="132" width="880" height="40" fill="#f8fafc"/>
    <text x="60" y="157" font-weight="700" fill="#334155">형식</text>
    <text x="270" y="157" fill="#0f172a">온라인 감독 · 객관식</text>
    <text x="610" y="157" fill="#0f172a">온라인 감독 · 실기(명령줄)</text>

    <text x="60" y="203" font-weight="700" fill="#334155">문항 · 시간</text>
    <text x="270" y="203" fill="#0f172a">60문항 · 90분 (문항당 1.5분)</text>
    <text x="610" y="203" fill="#0f172a">15~20개 과제 · 2시간</text>

    <rect x="40" y="224" width="880" height="40" fill="#f8fafc"/>
    <text x="60" y="249" font-weight="700" fill="#334155">합격 기준</text>
    <text x="270" y="249" font-weight="700" fill="#1e3a8a">75% 이상</text>
    <text x="610" y="249" font-weight="700" fill="#7f1d1d">67% 이상</text>

    <text x="60" y="295" font-weight="700" fill="#334155">응시 자격</text>
    <text x="270" y="295" fill="#0f172a">없음 (입문자 대상)</text>
    <text x="610" y="295" fill="#0f172a">CKA 합격자만</text>

    <rect x="40" y="316" width="880" height="40" fill="#f8fafc"/>
    <text x="60" y="341" font-weight="700" fill="#334155">기준 버전</text>
    <text x="270" y="341" fill="#0f172a">버전 표기 없음 (개념 중심)</text>
    <text x="610" y="341" fill="#0f172a">Kubernetes v1.37</text>

    <text x="60" y="387" font-weight="700" fill="#334155">응시료 · 유효기간</text>
    <text x="270" y="387" fill="#0f172a">$250 · 2년 (재응시 1회 포함)</text>
    <text x="610" y="387" fill="#0f172a">$445 · 2년 (재응시 1회 포함)</text>

    <rect x="40" y="408" width="880" height="40" fill="#f8fafc"/>
    <text x="60" y="433" font-weight="700" fill="#334155">묻는 방식</text>
    <text x="270" y="433" fill="#0f172a">"이 위협을 줄이는 통제는?"</text>
    <text x="610" y="433" fill="#0f172a">"이 매니페스트를 고쳐 막아라"</text>
  </g>

  <!-- path -->
  <rect x="40" y="470" width="150" height="50" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="115" y="501" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">본편 Day 66~73</text>
  <line x1="194" y1="495" x2="246" y2="495" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="470" width="150" height="50" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="325" y="501" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">KCSA C00~C05</text>
  <line x1="404" y1="495" x2="456" y2="495" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="470" width="120" height="50" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="520" y="501" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">CKA K00~</text>
  <line x1="584" y1="495" x2="636" y2="495" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="470" width="150" height="50" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="715" y="501" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">CKS S00~S08</text>
  <text x="810" y="490" font-size="12" fill="#64748b">CKS 합격 시</text>
  <text x="810" y="508" font-size="12" fill="#64748b">KCSA 자동 갱신</text>
</svg>
