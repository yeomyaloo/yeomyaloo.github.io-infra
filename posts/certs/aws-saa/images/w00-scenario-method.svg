<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">시나리오 문제 풀이 4단계 — 요구사항 키워드 → 서비스 선택</text>

  <!-- step boxes -->
  <rect x="30" y="70" width="200" height="150" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <circle cx="58" cy="98" r="16" fill="#ff9900"/>
  <text x="58" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="84" y="104" font-size="16" font-weight="700" fill="#0f172a">마지막 문장부터</text>
  <text x="46" y="140" font-size="13" fill="#334155">최적화 기준 찾기</text>
  <text x="46" y="166" font-size="12" fill="#9a3412">· 운영 오버헤드 최소</text>
  <text x="46" y="186" font-size="12" fill="#9a3412">· 가장 비용 효율적</text>
  <text x="46" y="206" font-size="12" fill="#9a3412">· 가장 빠른 복구</text>

  <line x1="232" y1="145" x2="260" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="264" y="70" width="200" height="150" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="292" cy="98" r="16" fill="#334155"/>
  <text x="292" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="318" y="104" font-size="16" font-weight="700" fill="#0f172a">제약 조건 밑줄</text>
  <text x="280" y="140" font-size="13" fill="#334155">숫자 · 금지어 · 필수어</text>
  <text x="280" y="166" font-size="12" fill="#334155">· 코드 변경 불가</text>
  <text x="280" y="186" font-size="12" fill="#334155">· RPO 15분, 밀리초 미만</text>
  <text x="280" y="206" font-size="12" fill="#334155">· 인터넷 경유 금지</text>

  <line x1="466" y1="145" x2="494" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="498" y="70" width="200" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="526" cy="98" r="16" fill="#dc2626"/>
  <text x="526" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="552" y="104" font-size="16" font-weight="700" fill="#0f172a">오답 소거</text>
  <text x="514" y="140" font-size="13" fill="#334155">제약을 하나라도 어기면</text>
  <text x="514" y="160" font-size="13" fill="#334155">바로 지운다</text>
  <text x="514" y="186" font-size="12" fill="#991b1b">예) 코드 변경 불가인데</text>
  <text x="514" y="206" font-size="12" fill="#991b1b">"DynamoDB로 재작성" ✗</text>

  <line x1="700" y1="145" x2="728" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="732" y="70" width="200" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="760" cy="98" r="16" fill="#16a34a"/>
  <text x="760" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="786" y="104" font-size="16" font-weight="700" fill="#0f172a">기준으로 결정</text>
  <text x="748" y="140" font-size="13" fill="#334155">남은 보기 중 ①의</text>
  <text x="748" y="160" font-size="13" fill="#334155">기준에 가장 맞는 것</text>
  <text x="748" y="186" font-size="12" fill="#166534">둘 다 되면 관리형·서버리스</text>
  <text x="748" y="206" font-size="12" fill="#166534">= 운영 오버헤드 최소</text>

  <!-- example -->
  <text x="30" y="262" font-size="16" font-weight="700" fill="#0f172a">같은 상황, 다른 기준 → 다른 정답 (창작 예시: EC2 한 대가 업로드와 썸네일을 동기 처리)</text>

  <rect x="30" y="280" width="290" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="46" y="306" font-size="13" font-weight="700" fill="#9a3412">"운영 오버헤드가 가장 적은"</text>
  <rect x="46" y="322" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="58" y="344" font-size="13" fill="#0f172a">S3 업로드 → S3 이벤트</text>
  <line x1="175" y1="358" x2="175" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="46" y="382" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="58" y="404" font-size="13" fill="#0f172a">Lambda가 썸네일 생성</text>
  <text x="46" y="448" font-size="12" fill="#64748b">서버 패치·용량 관리 없음</text>

  <rect x="335" y="280" width="290" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="351" y="306" font-size="13" font-weight="700" fill="#9a3412">"기존 EC2용 코드를 그대로"</text>
  <rect x="351" y="322" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="363" y="344" font-size="13" fill="#0f172a">S3 업로드 → SQS에 작업 등록</text>
  <line x1="480" y1="358" x2="480" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="351" y="382" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="363" y="404" font-size="13" fill="#0f172a">ASG 워커(EC2)가 큐 길이로 확장</text>
  <text x="351" y="448" font-size="12" fill="#64748b">코드 유지 + 결합도 분리</text>

  <rect x="640" y="280" width="290" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="656" y="306" font-size="13" font-weight="700" fill="#9a3412">"업로드 직후 바로 보여야"</text>
  <rect x="656" y="322" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="668" y="344" font-size="13" fill="#0f172a">동기 처리 경로 유지</text>
  <line x1="785" y1="358" x2="785" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="656" y="382" width="258" height="34" rx="6" fill="#fff4e5"/>
  <text x="668" y="404" font-size="13" fill="#0f172a">ALB + ASG로 웹 계층 수평 확장</text>
  <text x="656" y="448" font-size="12" fill="#64748b">비동기 큐는 지연을 만든다</text>
</svg>
