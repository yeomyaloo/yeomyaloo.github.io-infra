<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">KMS 봉투 암호화 (Envelope Encryption)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">KMS 키는 KMS 밖으로 나오지 않는다 · 데이터는 "데이터 키"로 암호화하고, 데이터 키를 KMS 키로 감싼다</text>

  <!-- LEFT: encrypt -->
  <rect x="16" y="74" width="456" height="408" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="100" font-size="16" font-weight="700" fill="#0f172a">암호화</text>

  <rect x="32" y="116" width="150" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="107" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">애플리케이션</text>
  <rect x="300" y="110" width="156" height="62" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="378" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">AWS KMS</text>
  <text x="378" y="156" text-anchor="middle" font-size="12" fill="#334155">KMS 키 (HSM 안)</text>
  <line x1="182" y1="134" x2="296" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="186" y="126" font-size="10" font-family="Consolas,'D2Coding',monospace" fill="#334155">① GenerateDataKey</text>
  <line x1="300" y1="160" x2="186" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="198" y="178" font-size="11" fill="#334155">키 2개 반환</text>

  <rect x="32" y="196" width="196" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="130" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">평문 데이터 키</text>
  <rect x="244" y="196" width="212" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="350" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">암호화된 데이터 키</text>

  <line x1="130" y1="236" x2="130" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="266" width="424" height="44" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="48" y="293" font-size="13" fill="#0f172a">② 평문 데이터 키 + 원본 데이터 → 암호문 (로컬에서 빠르게)</text>

  <line x1="244" y1="310" x2="244" y2="334" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="338" width="424" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="48" y="360" font-size="13" font-weight="700" fill="#166534">③ 함께 저장 (S3 객체 · EBS 볼륨 · RDS 스토리지)</text>
  <rect x="48" y="372" width="180" height="38" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="138" y="396" text-anchor="middle" font-size="13" fill="#0f172a">암호문 데이터</text>
  <rect x="244" y="372" width="196" height="38" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="342" y="396" text-anchor="middle" font-size="13" fill="#3730a3">암호화된 데이터 키</text>

  <text x="32" y="450" font-size="13" font-weight="700" fill="#dc2626">④ 평문 데이터 키는 메모리에서 즉시 폐기</text>
  <text x="32" y="470" font-size="12" fill="#64748b">디스크에는 평문 키가 절대 남지 않는다</text>

  <!-- RIGHT: decrypt -->
  <rect x="488" y="74" width="456" height="408" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="504" y="100" font-size="16" font-weight="700" fill="#0f172a">복호화</text>

  <rect x="504" y="116" width="170" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="589" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">암호화된 데이터 키</text>
  <rect x="772" y="110" width="156" height="62" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="850" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">AWS KMS</text>
  <text x="850" y="156" text-anchor="middle" font-size="12" fill="#334155">키 정책 + IAM 확인</text>
  <line x1="674" y1="134" x2="768" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="126" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">① Decrypt</text>
  <line x1="850" y1="172" x2="850" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="732" y="196" width="196" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="830" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">평문 데이터 키</text>
  <text x="504" y="214" font-size="12" fill="#334155">호출은 CloudTrail에 기록</text>
  <text x="504" y="232" font-size="12" fill="#334155">→ "키 사용 감사" 요구 충족</text>

  <line x1="830" y1="236" x2="830" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="504" y="266" width="424" height="44" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="520" y="293" font-size="13" fill="#0f172a">② 평문 데이터 키로 암호문 복호화 → 원본 데이터</text>

  <rect x="504" y="338" width="424" height="132" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="520" y="362" font-size="13" font-weight="700" fill="#9a3412">왜 이렇게 하나?</text>
  <text x="520" y="386" font-size="12" fill="#334155">· KMS Encrypt API는 최대 4 KB — 대용량은 데이터 키로</text>
  <text x="520" y="408" font-size="12" fill="#334155">· 데이터를 네트워크로 KMS에 보내지 않아 빠르다</text>
  <text x="520" y="430" font-size="12" fill="#334155">· KMS 키 교체 후에도 옛 데이터 키를 복호화할 수 있다</text>
  <text x="520" y="452" font-size="12" fill="#334155">· 키를 비활성화하거나 키 정책 권한을 빼면 즉시 접근 차단</text>

  <!-- bottom banner -->
  <rect x="16" y="500" width="928" height="64" rx="10" fill="#334155"/>
  <text x="36" y="526" font-size="14" font-weight="700" fill="#ffffff">S3 SSE-KMS의 요청 비용·할당량이 걱정되면 → S3 버킷 키(Bucket Key)</text>
  <text x="36" y="549" font-size="12" fill="#e2e8f0">버킷 수준 키를 잠시 재사용해 객체마다 KMS를 부르지 않는다 · 리전 간 복호화가 필요하면 다중 리전 키 · 전용 HSM은 CloudHSM</text>
</svg>
