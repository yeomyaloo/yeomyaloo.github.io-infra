<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9900"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">EC2 구매 옵션 고르기 — 위에서부터 질문 네 개</text>

  <!-- question column -->
  <g font-size="14" fill="#334155">
    <rect x="40" y="76" width="340" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="56" y="100" font-weight="700">Q1</text>
    <text x="90" y="100">중단돼도 이어서 처리할 수 있는</text>
    <text x="90" y="120">작업인가?</text>

    <rect x="40" y="176" width="340" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="56" y="200" font-weight="700">Q2</text>
    <text x="90" y="200">1년 이상 꾸준히 켜 두는</text>
    <text x="90" y="220">기준(baseline) 사용량인가?</text>

    <rect x="40" y="286" width="340" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="56" y="310" font-weight="700">Q3</text>
    <text x="90" y="310">특정 AZ의 용량을 약정 없이</text>
    <text x="90" y="330">반드시 확보해야 하는가?</text>

    <rect x="40" y="386" width="340" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="56" y="410" font-weight="700">Q4</text>
    <text x="90" y="410">물리 소켓·코어 단위 라이선스</text>
    <text x="90" y="430">(BYOL)를 써야 하는가?</text>
  </g>

  <!-- "no" arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="210" y1="132" x2="210" y2="172"/>
    <line x1="210" y1="232" x2="210" y2="282"/>
    <line x1="210" y1="342" x2="210" y2="382"/>
    <line x1="210" y1="442" x2="210" y2="486"/>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="218" y="157">아니오</text>
    <text x="218" y="262">아니오</text>
    <text x="218" y="367">아니오</text>
    <text x="218" y="469">아니오</text>
  </g>

  <!-- default: on-demand -->
  <rect x="40" y="490" width="340" height="64" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="210" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">온디맨드</text>
  <text x="210" y="539" text-anchor="middle" font-size="12" fill="#334155">짧거나 예측 불가한 사용, SP를 넘는 스파이크</text>

  <!-- "yes" arrows -->
  <g stroke="#ff9900" stroke-width="2" fill="none" marker-end="url(#arro)">
    <line x1="380" y1="104" x2="436" y2="104"/>
    <line x1="380" y1="204" x2="436" y2="204"/>
    <line x1="380" y1="314" x2="436" y2="314"/>
    <line x1="380" y1="414" x2="436" y2="414"/>
  </g>
  <g font-size="12" font-weight="700" fill="#c2410c">
    <text x="396" y="96">예</text>
    <text x="396" y="196">예</text>
    <text x="396" y="306">예</text>
    <text x="396" y="406">예</text>
  </g>

  <!-- answers -->
  <g fill="#334155">
    <rect x="440" y="72" width="250" height="64" rx="8" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
    <text x="456" y="97" font-size="15" font-weight="700">Spot 인스턴스</text>
    <text x="456" y="119" font-size="11">여러 유형·AZ 지정, 회수 2분 전 알림</text>

    <rect x="440" y="160" width="250" height="88" rx="8" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
    <text x="456" y="184" font-size="15" font-weight="700">Savings Plans / RI</text>
    <text x="456" y="205" font-size="11">패밀리·리전 고정 → EC2 Instance SP</text>
    <text x="456" y="223" font-size="11">변경 예정·Fargate → Compute SP</text>
    <text x="456" y="241" font-size="11">RDS 등 DB → RI 또는 Database SP</text>

    <rect x="440" y="282" width="250" height="64" rx="8" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
    <text x="456" y="307" font-size="15" font-weight="700">온디맨드 용량 예약</text>
    <text x="456" y="329" font-size="11">용량만 보장 · 할인은 SP와 결합</text>

    <rect x="440" y="382" width="250" height="64" rx="8" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
    <text x="456" y="407" font-size="15" font-weight="700">Dedicated Hosts</text>
    <text x="456" y="429" font-size="11">호스트 고정(affinity), 코어 가시성</text>
  </g>

  <!-- discount panel -->
  <rect x="716" y="72" width="222" height="482" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="827" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">온디맨드 대비 최대 할인</text>
  <text x="827" y="117" text-anchor="middle" font-size="11" fill="#64748b">(AWS 문서 표기 · 변동 가능)</text>
  <g font-size="13" fill="#334155">
    <text x="732" y="150">Spot</text>
    <rect x="732" y="158" width="162" height="16" rx="3" fill="#ff9900"/>
    <text x="900" y="171" font-size="12">90%</text>

    <text x="732" y="206">EC2 Instance SP</text>
    <rect x="732" y="214" width="130" height="16" rx="3" fill="#ffb84d"/>
    <text x="868" y="227" font-size="12">72%</text>

    <text x="732" y="262">Standard RI</text>
    <rect x="732" y="270" width="130" height="16" rx="3" fill="#ffb84d"/>
    <text x="868" y="283" font-size="12">72%</text>

    <text x="732" y="318">Compute SP</text>
    <rect x="732" y="326" width="119" height="16" rx="3" fill="#ffd08a"/>
    <text x="857" y="339" font-size="12">66%</text>

    <text x="732" y="374">온디맨드</text>
    <rect x="732" y="382" width="3" height="16" fill="#64748b"/>
    <text x="742" y="395" font-size="12">0%</text>
  </g>
  <line x1="732" y1="420" x2="922" y2="420" stroke="#e2e8f0"/>
  <g font-size="11" fill="#64748b">
    <text x="732" y="442">할인이 클수록 포기하는 것도 크다</text>
    <text x="732" y="462">· Spot: 언제든 회수될 수 있음</text>
    <text x="732" y="482">· SP·RI: 1년/3년 약정</text>
    <text x="732" y="502">· 패밀리 고정일수록 할인 ↑</text>
    <text x="732" y="522">· 선결제 비율 ↑ → 할인 ↑</text>
  </g>

  <text x="40" y="584" font-size="11" fill="#64748b">※ 할인율은 Savings Plans·EC2 문서의 "최대" 표기(2026-11-19 확인). 실제 할인은 유형·리전·약정·결제 방식마다 다르다.</text>
</svg>
