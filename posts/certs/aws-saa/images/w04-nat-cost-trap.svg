  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">NAT 비용 함정 — 같은 트래픽, 다른 청구서</text>
  <text x="247" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">흔한 구성: NAT 하나를 모두가 공유</text>
  <text x="712" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">개선 구성: AZ별 NAT + S3 엔드포인트</text>

