  <text x="618" y="276" font-size="11" fill="#334155">같은 AZ</text>
  <text x="825" y="276" font-size="11" fill="#334155">같은 AZ</text>
  <text x="597" y="480" font-size="12" font-weight="700" fill="#16a34a">추가 요금 없음</text>

  <rect x="525" y="490" width="150" height="48" rx="6" fill="#fff4e5" stroke="#ff9900"/>
  <text x="600" y="519" text-anchor="middle" font-size="13" fill="#334155">S3 (같은 리전)</text>
  <rect x="740" y="490" width="160" height="48" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="820" y="519" text-anchor="middle" font-size="13" fill="#334155">인터넷</text>

  <!-- footer -->
  <text x="30" y="572" font-size="12" fill="#334155">• 왼쪽: AZ-b 트래픽은 ① AZ 간 전송 요금 + ② NAT 처리 요금을 모두 내고, NAT가 있는 AZ-a가 단일 장애 지점이 된다.</text>
  <text x="30" y="592" font-size="12" fill="#334155">• 오른쪽: S3 트래픽은 게이트웨이 엔드포인트로 NAT를 우회하고, 인터넷 트래픽은 같은 AZ의 NAT로 나간다(NAT 시간 요금은 AZ 수만큼).</text>
  <text x="30" y="612" font-size="11" fill="#64748b">요금 예시: VPC 요금 페이지의 미국 동부(오하이오) 예 — NAT $0.045/시간 + 처리 $0.045/GB (2026-11-19 확인, 리전·시점마다 다름)</text>
</svg>
