  <text x="610" y="202" text-anchor="middle" font-size="13" fill="#334155">EC2 · EMR</text>

  <rect x="735" y="138" width="165" height="102" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="745" y="156" font-size="11" fill="#64748b">프라이빗 서브넷</text>
  <rect x="757" y="175" width="120" height="44" rx="6" fill="#e2e8f0" stroke="#334155"/>
  <text x="817" y="202" text-anchor="middle" font-size="13" fill="#334155">EC2 · EMR</text>

  <rect x="525" y="290" width="170" height="104" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="535" y="308" font-size="11" fill="#16a34a">퍼블릭 서브넷</text>
  <rect x="545" y="326" width="130" height="52" rx="6" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
  <text x="610" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">NAT 게이트웨이</text>
  <text x="610" y="367" text-anchor="middle" font-size="11" fill="#c2410c">인터넷 트래픽만</text>

  <rect x="735" y="290" width="165" height="104" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="745" y="308" font-size="11" fill="#16a34a">퍼블릭 서브넷</text>
  <rect x="752" y="326" width="130" height="52" rx="6" fill="#fff4e5" stroke="#ff9900" stroke-width="1.8"/>
  <text x="817" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">NAT 게이트웨이</text>
  <text x="817" y="367" text-anchor="middle" font-size="11" fill="#c2410c">인터넷 트래픽만</text>

  <rect x="525" y="404" width="128" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="589" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">S3 게이트웨이 EP</text>

  <g fill="none" stroke-width="2">
    <line x1="610" y1="219" x2="610" y2="322" stroke="#334155" marker-end="url(#arr)"/>
    <line x1="817" y1="219" x2="817" y2="322" stroke="#334155" marker-end="url(#arr)"/>
    <polyline points="550,205 517,205 517,420 521,420" stroke="#16a34a" stroke-dasharray="6 3" marker-end="url(#arrg)"/>
    <line x1="589" y1="436" x2="589" y2="486" stroke="#16a34a" marker-end="url(#arrg)"/>
    <line x1="660" y1="378" x2="780" y2="486" stroke="#334155" marker-end="url(#arr)"/>
    <line x1="840" y1="378" x2="840" y2="486" stroke="#334155" marker-end="url(#arr)"/>
