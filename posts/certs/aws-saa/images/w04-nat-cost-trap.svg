  <text x="153" y="424" font-size="12" font-weight="700" fill="#dc2626">② NAT 처리 요금</text>
  <text x="153" y="439" font-size="11" fill="#dc2626">(S3로 가는 GB도)</text>

  <rect x="60" y="490" width="170" height="48" rx="6" fill="#fff4e5" stroke="#ff9900"/>
