  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">인스턴스 스토어</text>

  <rect x="16" y="248" width="150" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
