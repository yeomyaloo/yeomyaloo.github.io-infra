  <line x1="480" y1="108" x2="480" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="108" x2="796" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK column -->
