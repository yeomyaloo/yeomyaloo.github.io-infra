  <text x="874" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Intelligent-Tiering</text>

  <rect x="648" y="280" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="302" font-size="12" fill="#334155">월 1회쯤 · 즉시</text>
  <line x1="784" y1="297" x2="800" y2="297" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="804" y="280" width="140" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="874" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Standard-IA</text>

  <rect x="648" y="322" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
