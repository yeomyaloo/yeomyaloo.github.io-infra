  <line x1="784" y1="339" x2="800" y2="339" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="804" y="322" width="140" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="874" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">One Zone-IA</text>

  <rect x="648" y="364" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="386" font-size="12" fill="#334155">분기 1회 · 밀리초</text>
  <line x1="784" y1="381" x2="800" y2="381" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="804" y="364" width="140" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="874" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Glacier Instant</text>

  <rect x="648" y="406" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="428" font-size="12" fill="#334155">연 1~2회 · 몇 시간 OK</text>
  <line x1="784" y1="423" x2="800" y2="423" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="804" y="406" width="140" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="874" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Glacier Flexible</text>

  <rect x="648" y="448" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="470" font-size="12" fill="#334155">수년 보관 · 최저가</text>
  <line x1="784" y1="465" x2="800" y2="465" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="804" y="448" width="140" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="874" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Deep Archive</text>

  <!-- bottom: hybrid -->
  <rect x="16" y="500" width="928" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="524" font-size="14" font-weight="700" fill="#0f172a">온프레미스와 섞일 때 (하이브리드·전송)</text>
  <text x="32" y="548" font-size="12" fill="#334155">NFS/SMB로 S3 쓰기 + 로컬 캐시 = Storage Gateway S3 File Gateway  ·  NAS → S3/EFS/FSx 온라인 대량 전송 = DataSync</text>
  <text x="32" y="570" font-size="12" fill="#334155">네트워크로는 너무 큰 데이터 = Snow Family  ·  파트너의 SFTP 업로드 = Transfer Family  ·  먼 곳에서 S3 업로드 = Transfer Acceleration</text>
</svg>
