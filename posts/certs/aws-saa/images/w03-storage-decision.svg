  <line x1="482" y1="373" x2="500" y2="373" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="504" y="352" width="124" height="42" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="566" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">FSx for ONTAP</text>

  <rect x="332" y="404" width="150" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
