  <text x="796" y="174" text-anchor="middle" font-size="11" fill="#166534">접근 빈도와 꺼내는 속도로 클래스 선택</text>

  <rect x="648" y="196" width="136" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
