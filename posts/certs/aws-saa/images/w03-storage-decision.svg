  <line x1="166" y1="269" x2="184" y2="269" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="188" y="248" width="124" height="42" rx="8" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
