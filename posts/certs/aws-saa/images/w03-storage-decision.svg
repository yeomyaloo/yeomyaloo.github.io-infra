<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">스토리지 선택 결정 트리</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">먼저 접근 방식(블록·파일·오브젝트)을 고르고, 그다음 문제의 조건 키워드로 좁힌다</text>

  <rect x="330" y="68" width="300" height="40" rx="20" fill="#334155"/>
  <text x="480" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">데이터에 어떻게 접근하나?</text>
