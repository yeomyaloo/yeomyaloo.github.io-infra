<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="590" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">계층별 캐시 — 어디에서 무엇을 줄이나?</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">사용자에게 가까울수록 원본 부하가 크게 줄고, DB 앞 캐시는 반복 쿼리를 없앤다</text>

  <!-- main flow -->
  <rect x="16" y="120" width="86" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="59" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">사용자</text>
  <line x1="102" y1="148" x2="120" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="124" y="110" width="160" height="76" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="204" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">CloudFront</text>
  <text x="204" y="156" text-anchor="middle" font-size="11" fill="#334155">엣지 로케이션 캐시</text>
  <text x="204" y="173" text-anchor="middle" font-size="11" fill="#334155">정적 파일 · 캐시 가능 응답</text>
  <line x1="284" y1="148" x2="302" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="206" text-anchor="middle" font-size="11" fill="#64748b">원본: S3(OAC) · ALB</text>

  <rect x="306" y="120" width="86" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="349" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ALB</text>
  <line x1="392" y1="148" x2="410" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="414" y="110" width="140" height="76" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="484" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">앱</text>
  <text x="484" y="162" text-anchor="middle" font-size="11" fill="#334155">EC2 · ECS · Lambda</text>

  <!-- branch to elasticache -->
  <line x1="554" y1="130" x2="600" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="604" y="72" width="160" height="62" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="684" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ElastiCache</text>
  <text x="684" y="118" text-anchor="middle" font-size="10" fill="#78350f">Valkey·Redis OSS·Memcached</text>
  <line x1="764" y1="103" x2="796" y2="103" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="94" text-anchor="middle" font-size="10" fill="#64748b">미스</text>
  <rect x="800" y="72" width="144" height="62" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="872" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">RDS · Aurora</text>
  <text x="872" y="118" text-anchor="middle" font-size="11" fill="#312e81">반복 쿼리 부하 ↓</text>

  <!-- branch to DAX -->
  <line x1="554" y1="166" x2="600" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="604" y="168" width="160" height="62" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="684" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">DAX</text>
  <text x="684" y="214" text-anchor="middle" font-size="11" fill="#78350f">DynamoDB API 호환</text>
  <line x1="764" y1="199" x2="796" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="168" width="144" height="62" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="872" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">DynamoDB</text>
  <text x="872" y="214" text-anchor="middle" font-size="11" fill="#312e81">읽기 마이크로초</text>

  <!-- latency hints -->
  <rect x="16" y="236" width="560" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="261" font-size="12" fill="#334155">"전 세계 사용자" = CloudFront  ·  "밀리초 미만·세션·순위표" = ElastiCache</text>
  <rect x="604" y="244" width="340" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="616" y="265" font-size="12" fill="#334155">"DynamoDB 마이크로초 · 코드 변경 최소" = DAX</text>

  <!-- lazy loading -->
  <rect x="16" y="296" width="456" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="322" font-size="15" font-weight="700" fill="#0f172a">지연 로딩 (Lazy loading · cache-aside)</text>
  <rect x="32" y="338" width="120" height="40" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="92" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">앱</text>
  <rect x="188" y="338" width="120" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="248" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">캐시</text>
  <rect x="336" y="338" width="120" height="40" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="396" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">DB</text>
  <text x="32" y="404" font-size="12" fill="#334155">① 캐시 조회 → 적중이면 바로 반환</text>
  <text x="32" y="426" font-size="12" fill="#334155">② 미스면 DB 조회</text>
  <text x="32" y="448" font-size="12" fill="#334155">③ 결과를 캐시에 기록 (+ TTL)</text>
  <text x="32" y="478" font-size="12" font-weight="700" fill="#166534">장점: 읽히는 것만 캐시 · 캐시 장애에도 동작</text>
  <text x="32" y="500" font-size="12" font-weight="700" fill="#991b1b">단점: 첫 요청 느림 · 오래된 데이터 가능</text>

  <!-- write-through -->
  <rect x="488" y="296" width="456" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="504" y="322" font-size="15" font-weight="700" fill="#0f172a">Write-through</text>
  <rect x="504" y="338" width="120" height="40" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="564" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">앱</text>
  <rect x="660" y="338" width="120" height="40" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="720" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">DB</text>
  <rect x="808" y="338" width="120" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="868" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">캐시</text>
  <text x="504" y="404" font-size="12" fill="#334155">① DB에 쓰기</text>
  <text x="504" y="426" font-size="12" fill="#334155">② 같은 시점에 캐시도 갱신</text>
  <text x="504" y="448" font-size="12" fill="#334155">③ 읽기는 항상 최신 캐시에서</text>
  <text x="504" y="478" font-size="12" font-weight="700" fill="#166534">장점: 캐시가 항상 최신</text>
  <text x="504" y="500" font-size="12" font-weight="700" fill="#991b1b">단점: 안 읽는 데이터도 캐시 · 쓰기 지연 증가</text>

  <!-- arrows lazy -->
  <line x1="152" y1="352" x2="184" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M152,370 C240,396 300,396 332,370" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- arrows write-through -->
  <line x1="624" y1="352" x2="656" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="352" x2="804" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="16" y="540" width="928" height="36" rx="8" fill="#334155"/>
  <text x="480" y="563" text-anchor="middle" font-size="13" fill="#ffffff">두 전략 모두 TTL을 함께 써서 오래된 데이터를 제한한다 · 캐시는 Multi-AZ 복제 그룹으로 이중화</text>
</svg>
