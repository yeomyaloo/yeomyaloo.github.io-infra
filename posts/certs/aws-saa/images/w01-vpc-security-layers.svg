<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="590" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">VPC 보안 계층 — 엣지에서 데이터까지</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">WAF·Shield(엣지) → NACL(서브넷) → 보안 그룹(ENI) → VPC 엔드포인트(사설 경로)</text>

  <!-- user -->
  <rect x="16" y="250" width="90" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="61" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">사용자</text>
  <line x1="106" y1="278" x2="124" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge -->
  <rect x="128" y="222" width="152" height="112" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="204" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">CloudFront</text>
  <rect x="140" y="260" width="128" height="28" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="204" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">WAF (L7 규칙)</text>
  <rect x="140" y="294" width="128" height="28" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="204" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Shield (DDoS)</text>
  <line x1="280" y1="278" x2="292" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC -->
  <rect x="310" y="80" width="480" height="420" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="326" y="104" font-size="14" font-weight="700" fill="#334155">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="294" y="262" width="36" height="32" rx="6" fill="#334155"/>
  <text x="312" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">IGW</text>

  <!-- public subnet (NACL) -->
  <rect x="340" y="120" width="182" height="360" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="352" y="142" font-size="13" font-weight="700" fill="#0f172a">퍼블릭 서브넷</text>
  <text x="352" y="160" font-size="11" fill="#4f46e5">NACL: 서브넷 경계</text>

  <!-- private subnet (NACL) -->
  <rect x="538" y="120" width="238" height="360" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="550" y="142" font-size="13" font-weight="700" fill="#0f172a">프라이빗 서브넷</text>
  <text x="550" y="160" font-size="11" fill="#4f46e5">NACL: 서브넷 경계</text>

  <line x1="330" y1="278" x2="350" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ALB with SG -->
  <rect x="354" y="244" width="156" height="72" rx="10" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="362" y="252" width="140" height="44" rx="8" fill="#fff4e5" stroke="#ff9900"/>
  <text x="432" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">ALB</text>
  <text x="432" y="310" text-anchor="middle" font-size="11" fill="#16a34a">SG: 443 from 0.0.0.0/0</text>

  <!-- EC2 with SG -->
  <rect x="552" y="176" width="210" height="72" rx="10" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="560" y="184" width="194" height="40" rx="8" fill="#fff4e5" stroke="#ff9900"/>
  <text x="657" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">EC2 앱 (역할 연결)</text>
  <text x="657" y="241" text-anchor="middle" font-size="11" fill="#16a34a">SG: 8080 from ALB SG</text>

  <!-- RDS with SG -->
  <rect x="552" y="284" width="210" height="72" rx="10" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="560" y="292" width="194" height="40" rx="8" fill="#fff4e5" stroke="#ff9900"/>
  <text x="657" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">RDS (KMS 암호화)</text>
  <text x="657" y="349" text-anchor="middle" font-size="11" fill="#16a34a">SG: 3306 from 앱 SG</text>

  <!-- interface endpoint ENI -->
  <rect x="560" y="400" width="194" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="657" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">인터페이스 엔드포인트</text>
  <text x="657" y="441" text-anchor="middle" font-size="11" fill="#3730a3">ENI · 사설 IP · SG 적용</text>

  <!-- arrows inside -->
  <line x1="502" y1="268" x2="556" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="657" y1="250" x2="657" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560,214 L545,214 L545,426 L556,426" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AWS services -->
  <rect x="808" y="170" width="136" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="876" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">S3</text>
  <text x="876" y="214" text-anchor="middle" font-size="11" fill="#166534">버킷 정책 SourceVpce</text>
  <text x="808" y="246" font-size="11" fill="#334155">게이트웨이 엔드포인트</text>
  <text x="808" y="262" font-size="11" fill="#334155">라우팅 테이블 · 무료</text>
  <text x="808" y="278" font-size="11" fill="#334155">S3·DynamoDB만</text>
  <line x1="754" y1="198" x2="804" y2="198" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="808" y="398" width="136" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="876" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Secrets Manager</text>
  <text x="876" y="442" text-anchor="middle" font-size="11" fill="#166534">KMS 등 대부분</text>
  <text x="808" y="474" font-size="11" fill="#334155">PrivateLink · 시간당 요금</text>
  <text x="808" y="490" font-size="11" fill="#334155">온프레미스에서도 사용</text>
  <line x1="754" y1="426" x2="804" y2="426" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="16" y="518" width="456" height="58" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="30" y="542" font-size="13" font-weight="700" fill="#166534">보안 그룹 (초록 점선) — ENI 단위</text>
  <text x="30" y="564" font-size="12" fill="#334155">Stateful · 허용 규칙만 · 다른 SG를 소스로 참조 가능</text>
  <rect x="488" y="518" width="456" height="58" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="502" y="542" font-size="13" font-weight="700" fill="#3730a3">NACL (보라 점선) — 서브넷 단위</text>
  <text x="502" y="564" font-size="12" fill="#334155">Stateless · 허용·거부 · 번호 순 · 응답용 임시 포트 필요</text>
</svg>
