<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">IAM 정책 평가 흐름 (시험용 요약)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">공식 문서 "Policy evaluation logic" 기준 · 기본은 거부 · 명시적 Deny는 어디에 있든 이긴다</text>

  <!-- start -->
  <rect x="100" y="76" width="280" height="36" rx="18" fill="#334155"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">API 요청 (주체 · 작업 · 리소스)</text>
  <line x1="240" y1="112" x2="240" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D1 -->
  <rect x="60" y="134" width="360" height="56" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="76" y="158" font-size="14" font-weight="700" fill="#0f172a">① 어느 정책이든 명시적 Deny가 있나?</text>
  <text x="76" y="178" font-size="12" fill="#64748b">SCP·RCP·리소스·자격 증명·경계·세션 전부</text>
  <line x1="420" y1="162" x2="496" y2="162" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="440" y="154" font-size="12" font-weight="700" fill="#dc2626">예</text>
  <rect x="500" y="142" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">명시적 거부</text>
  <line x1="240" y1="190" x2="240" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="207" font-size="12" fill="#16a34a" font-weight="700">아니오</text>

  <!-- D2 -->
  <rect x="60" y="218" width="360" height="56" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="76" y="242" font-size="14" font-weight="700" fill="#0f172a">② Organizations RCP·SCP가 허용하나?</text>
  <text x="76" y="262" font-size="12" fill="#64748b">상한일 뿐 권한을 주지 않음 · 관리 계정 제외</text>
  <line x1="420" y1="246" x2="496" y2="246" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="434" y="238" font-size="12" font-weight="700" fill="#dc2626">아니오</text>
  <rect x="500" y="226" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">암시적 거부</text>
  <line x1="240" y1="274" x2="240" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="291" font-size="12" fill="#16a34a" font-weight="700">예</text>

  <!-- D3 -->
  <rect x="60" y="302" width="360" height="56" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="76" y="326" font-size="14" font-weight="700" fill="#0f172a">③ 리소스 정책 또는 자격 증명 정책이 허용?</text>
  <text x="76" y="346" font-size="12" fill="#64748b">실제 "허용"을 주는 곳 (같은 계정 기준)</text>
  <line x1="420" y1="330" x2="496" y2="330" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="434" y="322" font-size="12" font-weight="700" fill="#dc2626">아니오</text>
  <rect x="500" y="310" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">암시적 거부</text>
  <line x1="240" y1="358" x2="240" y2="382" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="375" font-size="12" fill="#16a34a" font-weight="700">예</text>

  <!-- D4 -->
  <rect x="60" y="386" width="360" height="56" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="76" y="410" font-size="14" font-weight="700" fill="#0f172a">④ 권한 경계가 있다면, 경계도 허용?</text>
  <text x="76" y="430" font-size="12" fill="#64748b">사용자·역할 하나의 최대치</text>
  <line x1="420" y1="414" x2="496" y2="414" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="434" y="406" font-size="12" font-weight="700" fill="#dc2626">아니오</text>
  <rect x="500" y="394" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">암시적 거부</text>
  <line x1="240" y1="442" x2="240" y2="466" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="459" font-size="12" fill="#16a34a" font-weight="700">예</text>

  <!-- D5 -->
  <rect x="60" y="470" width="360" height="56" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="76" y="494" font-size="14" font-weight="700" fill="#0f172a">⑤ 세션 정책이 있다면, 세션 정책도 허용?</text>
  <text x="76" y="514" font-size="12" fill="#64748b">AssumeRole 시 전달한 일회성 축소</text>
  <line x1="420" y1="498" x2="496" y2="498" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="434" y="490" font-size="12" font-weight="700" fill="#dc2626">아니오</text>
  <rect x="500" y="478" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="503" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">암시적 거부</text>
  <line x1="240" y1="526" x2="240" y2="550" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="543" font-size="12" fill="#16a34a" font-weight="700">예</text>

  <!-- allow -->
  <rect x="140" y="554" width="200" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="582" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">허용</text>

  <!-- notes panel -->
  <rect x="690" y="134" width="250" height="464" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="706" y="162" font-size="15" font-weight="700" fill="#0f172a">시험에서 자주 묻는 함정</text>

  <text x="706" y="196" font-size="13" font-weight="700" fill="#c2410c">교차 계정</text>
  <text x="706" y="216" font-size="12" fill="#334155">내 자격 증명 정책 허용</text>
  <text x="706" y="234" font-size="12" fill="#334155">+ 상대 리소스 정책(또는</text>
  <text x="706" y="252" font-size="12" fill="#334155">역할 신뢰 정책) 허용 = 둘 다</text>

  <text x="706" y="290" font-size="13" font-weight="700" fill="#c2410c">SCP · 권한 경계</text>
  <text x="706" y="310" font-size="12" fill="#334155">막을 뿐 주지 않는다</text>
  <text x="706" y="328" font-size="12" fill="#334155">"SCP로 권한 부여" = 오답</text>

  <text x="706" y="366" font-size="13" font-weight="700" fill="#c2410c">KMS 키 정책</text>
  <text x="706" y="386" font-size="12" fill="#334155">모든 키에 키 정책 1개</text>
  <text x="706" y="404" font-size="12" fill="#334155">키 정책이 계정을 허용해야</text>
  <text x="706" y="422" font-size="12" fill="#334155">IAM 정책이 효력을 가짐</text>

  <text x="706" y="460" font-size="13" font-weight="700" fill="#c2410c">SCP가 적용 안 되는 것</text>
  <text x="706" y="480" font-size="12" fill="#334155">관리(management) 계정</text>
  <text x="706" y="498" font-size="12" fill="#334155">서비스 연결 역할</text>

  <text x="706" y="536" font-size="13" font-weight="700" fill="#c2410c">우선순위 한 줄</text>
  <text x="706" y="556" font-size="12" fill="#334155">명시적 Deny &gt; 상한(SCP·경계)</text>
  <text x="706" y="574" font-size="12" fill="#334155">&gt; 허용 &gt; 기본 거부</text>
</svg>
