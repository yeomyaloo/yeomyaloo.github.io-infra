<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DR 전략 4종 — DR 리전에 평소 무엇이 켜져 있나?</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">RPO = 잃어도 되는 데이터 양 · RTO = 복구까지 걸려도 되는 시간 · 수치는 대략적인 범위</text>

  <!-- column 1 -->
  <rect x="16" y="72" width="220" height="44" rx="10" fill="#16a34a"/>
  <text x="126" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">백업·복원</text>
  <rect x="16" y="124" width="220" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="148" font-size="12" font-weight="700" fill="#334155">DR 리전에 평소</text>
  <rect x="30" y="158" width="192" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="40" y="178" font-size="12" fill="#166534">데이터: 백업·스냅샷 사본</text>
  <rect x="30" y="194" width="192" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="40" y="214" font-size="12" fill="#94a3b8">앱 서버: 없음</text>
  <rect x="30" y="230" width="192" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="40" y="250" font-size="12" fill="#94a3b8">트래픽 처리: 불가</text>

  <!-- column 2 -->
  <rect x="252" y="72" width="220" height="44" rx="10" fill="#f59e0b"/>
  <text x="362" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">파일럿 라이트</text>
  <rect x="252" y="124" width="220" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="266" y="148" font-size="12" font-weight="700" fill="#334155">DR 리전에 평소</text>
  <rect x="266" y="158" width="192" height="30" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="276" y="178" font-size="12" fill="#78350f">데이터: 실시간 복제 중</text>
  <rect x="266" y="194" width="192" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="276" y="214" font-size="12" fill="#94a3b8">앱 서버: 꺼짐 (AMI·템플릿)</text>
  <rect x="266" y="230" width="192" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="276" y="250" font-size="12" fill="#94a3b8">트래픽 처리: 불가</text>

  <!-- column 3 -->
  <rect x="488" y="72" width="220" height="44" rx="10" fill="#ff9900"/>
  <text x="598" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">웜 스탠바이</text>
  <rect x="488" y="124" width="220" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="502" y="148" font-size="12" font-weight="700" fill="#334155">DR 리전에 평소</text>
  <rect x="502" y="158" width="192" height="30" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="512" y="178" font-size="12" fill="#78350f">데이터: 실시간 복제 중</text>
  <rect x="502" y="194" width="192" height="30" rx="6" fill="#fff4e5" stroke="#ff9900"/>
  <text x="512" y="214" font-size="12" fill="#9a3412">앱 서버: 축소된 채 실행</text>
  <rect x="502" y="230" width="192" height="30" rx="6" fill="#fff4e5" stroke="#ff9900"/>
  <text x="512" y="250" font-size="12" fill="#9a3412">트래픽 처리: 가능(소량)</text>

  <!-- column 4 -->
  <rect x="724" y="72" width="220" height="44" rx="10" fill="#dc2626"/>
  <text x="834" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">다중 사이트</text>
  <text x="834" y="110" text-anchor="middle" font-size="12" fill="#ffffff">액티브-액티브</text>
  <rect x="724" y="124" width="220" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="738" y="148" font-size="12" font-weight="700" fill="#334155">DR 리전에 평소</text>
  <rect x="738" y="158" width="192" height="30" rx="6" fill="#fca5a5" stroke="#dc2626"/>
  <text x="748" y="178" font-size="12" fill="#7f1d1d">데이터: 양방향·다중 활성</text>
  <rect x="738" y="194" width="192" height="30" rx="6" fill="#fca5a5" stroke="#dc2626"/>
  <text x="748" y="214" font-size="12" fill="#7f1d1d">앱 서버: 전체 규모 실행</text>
  <rect x="738" y="230" width="192" height="30" rx="6" fill="#fca5a5" stroke="#dc2626"/>
  <text x="748" y="250" font-size="12" fill="#7f1d1d">트래픽 처리: 항상 분담</text>

  <!-- RPO / RTO row -->
  <text x="16" y="306" font-size="14" font-weight="700" fill="#0f172a">RPO / RTO</text>
  <rect x="16" y="314" width="220" height="56" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="126" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">시간 / 수 시간~24시간</text>
  <text x="126" y="358" text-anchor="middle" font-size="11" fill="#64748b">백업 주기만큼 손실</text>
  <rect x="252" y="314" width="220" height="56" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="362" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">분 / 수십 분</text>
  <text x="362" y="358" text-anchor="middle" font-size="11" fill="#64748b">서버 기동·확장 시간</text>
  <rect x="488" y="314" width="220" height="56" rx="8" fill="#ffffff" stroke="#ff9900"/>
  <text x="598" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">초~분 / 분</text>
  <text x="598" y="358" text-anchor="middle" font-size="11" fill="#64748b">확장 + DNS 전환</text>
  <rect x="724" y="314" width="220" height="56" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="834" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">거의 0 / 거의 0</text>
  <text x="834" y="358" text-anchor="middle" font-size="11" fill="#64748b">트래픽만 재분배</text>

  <!-- tools row -->
  <text x="16" y="400" font-size="14" font-weight="700" fill="#0f172a">대표 도구</text>
  <text x="24" y="424" font-size="12" fill="#334155">AWS Backup 교차 리전 복사</text>
  <text x="24" y="444" font-size="12" fill="#334155">S3 CRR · CloudFormation 재구성</text>
  <text x="260" y="424" font-size="12" fill="#334155">Aurora Global Database</text>
  <text x="260" y="444" font-size="12" fill="#334155">RDS 교차 리전 복제본</text>
  <text x="260" y="464" font-size="12" fill="#334155">Elastic Disaster Recovery</text>
  <text x="496" y="424" font-size="12" fill="#334155">최소 용량 ASG + 복제 DB</text>
  <text x="496" y="444" font-size="12" fill="#334155">장애 시 ASG 확장</text>
  <text x="496" y="464" font-size="12" fill="#334155">Route 53 장애 조치</text>
  <text x="732" y="424" font-size="12" fill="#334155">DynamoDB 글로벌 테이블</text>
  <text x="732" y="444" font-size="12" fill="#334155">Route 53 지연·가중치</text>
  <text x="732" y="464" font-size="12" fill="#334155">Global Accelerator</text>

  <!-- spectrum arrow -->
  <line x1="40" y1="500" x2="920" y2="500" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="526" font-size="13" font-weight="700" fill="#166534">비용 낮음 · 복구 느림</text>
  <text x="920" y="526" text-anchor="end" font-size="13" font-weight="700" fill="#991b1b">비용 높음 · 복구 빠름</text>
  <rect x="200" y="538" width="560" height="32" rx="8" fill="#fff4e5" stroke="#ff9900"/>
  <text x="480" y="559" text-anchor="middle" font-size="13" fill="#9a3412">구분 질문: "DR 리전이 장애 전에도 요청을 처리할 수 있는가?" 예 → 웜 스탠바이 이상</text>
</svg>
