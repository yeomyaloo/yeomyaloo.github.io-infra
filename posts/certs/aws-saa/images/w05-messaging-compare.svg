<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">메시징·스트리밍 네 형제 — "누가, 몇 번, 언제 읽나?"</text>

  <!-- ========== SQS ========== -->
  <g transform="translate(21,0)">
    <rect x="0" y="62" width="222" height="380" rx="10" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
    <rect x="0" y="62" width="222" height="38" rx="10" fill="#fff4e5"/>
    <text x="111" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">Amazon SQS</text>
    <rect x="10" y="128" width="30" height="26" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="25" y="146" text-anchor="middle" font-size="12" fill="#334155">P</text>
    <line x1="40" y1="141" x2="68" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="70" y="124" width="72" height="34" rx="4" fill="#fff4e5" stroke="#ff9900"/>
    <g stroke="#ff9900" stroke-width="2"><line x1="86" y1="130" x2="86" y2="152"/><line x1="100" y1="130" x2="100" y2="152"/><line x1="114" y1="130" x2="114" y2="152"/><line x1="128" y1="130" x2="128" y2="152"/></g>
    <line x1="142" y1="136" x2="174" y2="124" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="142" y1="146" x2="174" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="176" y="110" width="36" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="194" y="127" text-anchor="middle" font-size="11" fill="#334155">C1</text>
    <rect x="176" y="150" width="36" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="194" y="167" text-anchor="middle" font-size="11" fill="#334155">C2</text>
    <text x="111" y="196" text-anchor="middle" font-size="11" fill="#64748b">한 메시지는 한 소비자만 가져감</text>
  </g>

  <!-- ========== SNS ========== -->
  <g transform="translate(253,0)">
    <rect x="0" y="62" width="222" height="380" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="0" y="62" width="222" height="38" rx="10" fill="#e0e7ff"/>
    <text x="111" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Amazon SNS</text>
    <rect x="10" y="128" width="30" height="26" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="25" y="146" text-anchor="middle" font-size="12" fill="#334155">P</text>
    <line x1="40" y1="141" x2="76" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <circle cx="100" cy="141" r="22" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="100" y="145" text-anchor="middle" font-size="11" fill="#334155">토픽</text>
    <line x1="122" y1="134" x2="172" y2="117" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="122" y1="141" x2="172" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="122" y1="148" x2="172" y2="165" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="174" y="106" width="38" height="20" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <rect x="174" y="131" width="38" height="20" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <rect x="174" y="156" width="38" height="20" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <g font-size="10" fill="#334155" text-anchor="middle"><text x="193" y="120">SQS</text><text x="193" y="145">λ</text><text x="193" y="170">메일</text></g>
    <text x="111" y="196" text-anchor="middle" font-size="11" fill="#64748b">구독자마다 복사해서 밀어 줌</text>
  </g>

  <!-- ========== EventBridge ========== -->
  <g transform="translate(485,0)">
    <rect x="0" y="62" width="222" height="380" rx="10" fill="#ffffff" stroke="#2496ed" stroke-width="2"/>
    <rect x="0" y="62" width="222" height="38" rx="10" fill="#dbeafe"/>
    <text x="111" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Amazon EventBridge</text>
    <rect x="10" y="128" width="30" height="26" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="25" y="146" text-anchor="middle" font-size="12" fill="#334155">P</text>
    <line x1="40" y1="141" x2="62" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="64" y="126" width="50" height="30" rx="4" fill="#dbeafe" stroke="#2496ed"/>
    <text x="89" y="145" text-anchor="middle" font-size="11" fill="#334155">버스</text>
    <line x1="114" y1="141" x2="126" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="128" y="128" width="36" height="26" rx="4" fill="#fde68a" stroke="#f59e0b"/>
    <text x="146" y="145" text-anchor="middle" font-size="11" fill="#334155">규칙</text>
    <line x1="164" y1="136" x2="178" y2="124" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="164" y1="146" x2="178" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="180" y="110" width="32" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="196" y="127" text-anchor="middle" font-size="11" fill="#334155">T1</text>
    <rect x="180" y="150" width="32" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="196" y="167" text-anchor="middle" font-size="11" fill="#334155">T2</text>
    <text x="111" y="196" text-anchor="middle" font-size="11" fill="#64748b">패턴이 맞는 대상으로만 보냄</text>
  </g>

  <!-- ========== Kinesis Data Streams ========== -->
  <g transform="translate(717,0)">
    <rect x="0" y="62" width="222" height="380" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="62" width="222" height="38" rx="10" fill="#dcfce7"/>
    <text x="111" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Kinesis Data Streams</text>
    <rect x="10" y="128" width="30" height="26" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="25" y="146" text-anchor="middle" font-size="12" fill="#334155">P</text>
    <line x1="40" y1="141" x2="58" y2="141" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="60" y="126" width="108" height="30" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <g stroke="#16a34a"><line x1="78" y1="126" x2="78" y2="156"/><line x1="96" y1="126" x2="96" y2="156"/><line x1="114" y1="126" x2="114" y2="156"/><line x1="132" y1="126" x2="132" y2="156"/><line x1="150" y1="126" x2="150" y2="156"/></g>
    <g font-size="10" fill="#334155" text-anchor="middle"><text x="69" y="145">1</text><text x="87" y="145">2</text><text x="105" y="145">3</text><text x="123" y="145">4</text><text x="141" y="145">5</text><text x="159" y="145">6</text></g>
    <line x1="168" y1="136" x2="180" y2="124" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="168" y1="146" x2="180" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="182" y="110" width="32" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="198" y="127" text-anchor="middle" font-size="11" fill="#334155">A</text>
    <rect x="182" y="150" width="32" height="24" rx="4" fill="#e2e8f0" stroke="#334155"/>
    <text x="198" y="167" text-anchor="middle" font-size="11" fill="#334155">B</text>
    <text x="111" y="196" text-anchor="middle" font-size="11" fill="#64748b">앱마다 자기 위치에서 다시 읽음</text>
  </g>

  <!-- rows -->
  <g font-size="11" fill="#64748b">
    <text x="33" y="232">모델</text><text x="33" y="266">소비자</text><text x="33" y="300">순서</text><text x="33" y="334">재처리</text><text x="33" y="368">보존·대상</text><text x="33" y="402">시험 단서</text>
    <text x="265" y="232">모델</text><text x="265" y="266">소비자</text><text x="265" y="300">순서</text><text x="265" y="334">재처리</text><text x="265" y="368">보존·대상</text><text x="265" y="402">시험 단서</text>
    <text x="497" y="232">모델</text><text x="497" y="266">소비자</text><text x="497" y="300">순서</text><text x="497" y="334">재처리</text><text x="497" y="368">보존·대상</text><text x="497" y="402">시험 단서</text>
    <text x="729" y="232">모델</text><text x="729" y="266">소비자</text><text x="729" y="300">순서</text><text x="729" y="334">재처리</text><text x="729" y="368">보존·대상</text><text x="729" y="402">시험 단서</text>
  </g>
  <g font-size="12" fill="#334155">
    <text x="31" y="249">큐 · 소비자가 꺼내 감(pull)</text>
    <text x="31" y="283">메시지 1건 = 소비자 1곳</text>
    <text x="31" y="317">FIFO 큐만 (그룹별)</text>
    <text x="31" y="351">불가 (처리 후 삭제)</text>
    <text x="31" y="385">최대 14일 보관</text>
    <text x="31" y="419" font-weight="700" fill="#c2410c">분리 · 버퍼 · 백로그</text>

    <text x="263" y="249">토픽 · 구독자에 밀어 줌(push)</text>
    <text x="263" y="283">구독자마다 복제</text>
    <text x="263" y="317">FIFO 토픽만</text>
    <text x="263" y="351">기본적으로 불가</text>
    <text x="263" y="385">SQS·Lambda·HTTP·메일·SMS</text>
    <text x="263" y="419" font-weight="700" fill="#4f46e5">팬아웃 · 알림</text>

    <text x="495" y="249">이벤트 버스 · 규칙이 라우팅</text>
    <text x="495" y="283">규칙마다 대상 최대 5개</text>
    <text x="495" y="317">보장하지 않음</text>
    <text x="495" y="351">아카이브 · 재생</text>
    <text x="495" y="385">AWS·SaaS 파트너·커스텀</text>
    <text x="495" y="419" font-weight="700" fill="#1d4ed8">내용 기반 필터 · SaaS</text>

    <text x="727" y="249">샤드 로그 · 위치로 읽음</text>
    <text x="727" y="283">여러 앱이 독립적으로</text>
    <text x="727" y="317">파티션 키(샤드)별</text>
    <text x="727" y="351">보존 기간 안에서 가능</text>
    <text x="727" y="385">24시간 ~ 365일</text>
    <text x="727" y="419" font-weight="700" fill="#166534">실시간 대량 · 재처리</text>
  </g>

  <!-- firehose -->
  <rect x="21" y="458" width="918" height="58" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="37" y="482" font-size="14" font-weight="700" fill="#334155">+ Amazon Data Firehose</text>
  <text x="37" y="503" font-size="12" fill="#334155">스트림을 S3·Redshift·OpenSearch·Splunk 등으로 "배달"만 한다 — 버퍼링, Parquet 변환, Lambda 변환 O / 재처리·다중 소비자 X</text>
  <text x="21" y="544" font-size="11" fill="#64748b">※ 2026-11-19 AWS 문서 기준. SQS 최대 메시지 크기는 2025-08부터 1MiB, Kinesis 보존 기간 기본 24시간(최대 365일), EventBridge 규칙당 대상 최대 5개.</text>
</svg>
