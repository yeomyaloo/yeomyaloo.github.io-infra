<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">3계층 앱 NetworkPolicy — 기본 거부 위에 허용만 더한다</text>

  <!-- namespace a05 -->
  <rect x="200" y="60" width="680" height="300" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="216" y="84" font-size="13" font-weight="bold" fill="#326ce5">namespace a05 · default-deny-ingress (podSelector: {})</text>

  <!-- tiers -->
  <rect x="230" y="140" width="170" height="100" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="315" y="164" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">web</text>
  <text x="315" y="184" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">tier=frontend</text>
  <text x="315" y="204" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">:80</text>
  <text x="315" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">allow-from-traefik</text>

  <rect x="470" y="140" width="170" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="555" y="164" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">api</text>
  <text x="555" y="184" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">tier=backend</text>
  <text x="555" y="204" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">:8080</text>
  <text x="555" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">backend-from-frontend</text>

  <rect x="700" y="140" width="160" height="100" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="780" y="164" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">db</text>
  <text x="780" y="184" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">tier=data</text>
  <text x="780" y="204" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">:5432</text>
  <text x="780" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">data-from-backend</text>

  <!-- outside namespaces -->
  <rect x="20" y="96" width="160" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="122" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">NS traefik</text>
  <text x="100" y="144" font-size="12" fill="#334155" text-anchor="middle">Ingress 컨트롤러</text>

  <rect x="20" y="250" width="160" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="276" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">NS ops (team=ops)</text>
  <text x="100" y="298" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">app=probe</text>

  <rect x="470" y="392" width="170" height="60" rx="8" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="555" y="416" font-size="13" font-weight="bold" fill="#326ce5" text-anchor="middle">NS kube-system</text>
  <text x="555" y="438" font-size="12" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">k8s-app=kube-dns :53</text>

  <rect x="700" y="392" width="160" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="416" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">외부 (인터넷)</text>
  <text x="780" y="438" font-size="12" fill="#334155" text-anchor="middle">web 등 그 밖의 곳</text>

  <!-- allowed ingress (green) -->
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrg)">
    <path d="M180,150 L227,170"/>
    <path d="M180,108 L555,108 L555,137"/>
    <path d="M400,190 L467,190"/>
    <path d="M640,190 L697,190"/>
    <path d="M180,290 L520,290 L520,243" stroke-dasharray="6,4"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#15803d">
    <text x="190" y="186">80</text>
    <text x="440" y="103">8080 (/api 라우팅)</text>
    <text x="414" y="182">8080</text>
    <text x="648" y="182">5432</text>
    <text x="196" y="284">8080 · NS·Pod 셀렉터 한 항목 = AND</text>
  </g>

  <!-- blocked frontend -> db -->
  <path d="M340,140 L340,124 L760,124 L760,137" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrr)"/>
  <circle cx="670" cy="124" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <path d="M664,118 L676,130 M676,118 L664,130" stroke="#dc2626" stroke-width="2"/>
  <text x="688" y="120" font-size="12" font-weight="bold" fill="#dc2626">frontend → db 차단</text>

  <!-- egress -->
  <path d="M590,240 L590,389" stroke="#326ce5" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <text x="598" y="330" font-size="12" font-weight="bold" fill="#326ce5">egress DNS 53</text>
  <text x="598" y="346" font-size="12" font-weight="bold" fill="#326ce5">(UDP·TCP)</text>
  <path d="M630,240 L760,389" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrr)"/>
  <circle cx="704" cy="325" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <path d="M698,319 L710,331 M710,319 L698,331" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="306" font-size="12" font-weight="bold" fill="#dc2626">backend-egress로 차단</text>

  <!-- legend -->
  <rect x="20" y="470" width="860" height="74" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <line x1="38" y1="494" x2="70" y2="494" stroke="#16a34a" stroke-width="2.5"/>
  <text x="78" y="499" font-size="13" fill="#334155">ingress 허용</text>
  <line x1="180" y1="494" x2="212" y2="494" stroke="#326ce5" stroke-width="2.5"/>
  <text x="220" y="499" font-size="13" fill="#334155">egress 허용</text>
  <line x1="320" y1="494" x2="352" y2="494" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="360" y="499" font-size="13" fill="#334155">차단(허용 목록에 없음)</text>
  <text x="38" y="528" font-size="13" fill="#334155">정책은 합집합 · <tspan font-weight="bold">ports는 Pod 포트</tspan>(Service 포트 아님) · egress를 막으면 DNS도 막히므로 kube-dns 허용을 함께</text>
</svg>
