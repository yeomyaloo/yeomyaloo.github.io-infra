<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">이미지 과제의 흐름 — Dockerfile에서 Pod와 tar까지</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">단계마다 결과물이 있고, 채점은 그 결과물을 본다</text>

  <!-- Dockerfile -->
  <rect x="24" y="84" width="250" height="232" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="40" y="110" font-size="15" font-weight="700" fill="#0f172a">Dockerfile (멀티 스테이지)</text>
  <rect x="40" y="122" width="218" height="84" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="52" y="144" font-size="13" font-weight="700" fill="#92400e">① build 스테이지</text>
  <text x="52" y="166" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">temurin:21-jdk</text>
  <text x="52" y="186" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">gradlew bootJar</text>
  <line x1="149" y1="206" x2="149" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="219" font-size="11" fill="#64748b">COPY --from=build</text>
  <rect x="40" y="224" width="218" height="80" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="52" y="246" font-size="13" font-weight="700" fill="#14532d">② 실행 스테이지</text>
  <text x="52" y="268" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">temurin:21-jre</text>
  <text x="52" y="288" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">ENV APP_VERSION · USER 10001</text>

  <line x1="274" y1="190" x2="306" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- build -->
  <rect x="310" y="130" width="180" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="400" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">빌드</text>
  <text x="324" y="182" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">docker build -t</text>
  <text x="324" y="202" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">podman build -t</text>
  <text x="324" y="226" font-size="11" fill="#64748b" font-family="Consolas,'D2Coding',monospace">--build-arg APP_VERSION</text>

  <line x1="490" y1="190" x2="522" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- local image -->
  <rect x="526" y="120" width="190" height="140" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="621" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">로컬 이미지</text>
  <text x="540" y="172" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">192.168.56.1:5000/</text>
  <text x="540" y="190" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">ckad/hello-spring:1.0</text>
  <text x="540" y="214" font-size="12" fill="#64748b">확인: images · inspect</text>
  <text x="540" y="238" font-size="12" font-weight="700" fill="#1e3a8a">채점 ① 이름·태그</text>

  <line x1="716" y1="190" x2="756" y2="190" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="736" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">push</text>

  <!-- registry -->
  <rect x="760" y="120" width="176" height="140" rx="10" fill="#e0f2fe" stroke="#2496ed" stroke-width="2"/>
  <text x="848" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">registry:2</text>
  <text x="774" y="172" font-size="12" fill="#334155">192.168.56.1:5000</text>
  <text x="774" y="194" font-size="12" fill="#334155">HTTP · insecure 설정</text>
  <text x="774" y="216" font-size="11" fill="#64748b" font-family="Consolas,'D2Coding',monospace">/v2/&lt;이름&gt;/tags/list</text>
  <text x="774" y="240" font-size="12" font-weight="700" fill="#075985">채점 ② 레지스트리 태그</text>

  <!-- save -->
  <line x1="621" y1="260" x2="621" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="294" font-size="13" font-weight="700" fill="#64748b">save</text>
  <rect x="470" y="322" width="246" height="128" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="593" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">tar 파일</text>
  <text x="484" y="372" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">docker save -o x.tar</text>
  <text x="484" y="390" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">podman save -o (docker-archive)</text>
  <text x="484" y="408" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">  --format oci-archive</text>
  <text x="484" y="434" font-size="12" font-weight="700" fill="#92400e">채점 ③ 경로·형식</text>

  <!-- pull -->
  <line x1="848" y1="260" x2="848" y2="318" stroke="#326ce5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="858" y="294" font-size="13" font-weight="700" fill="#326ce5">pull</text>
  <rect x="740" y="322" width="196" height="128" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="838" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">노드 → Pod</text>
  <text x="754" y="372" font-size="12" fill="#334155">kubelet → containerd</text>
  <text x="754" y="392" font-size="12" fill="#334155">certs.d/hosts.toml</text>
  <text x="754" y="412" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">k run --image=...</text>
  <text x="754" y="434" font-size="12" font-weight="700" fill="#14532d">채점 ④ Running</text>

  <!-- tips -->
  <rect x="24" y="340" width="420" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="40" y="366" font-size="14" font-weight="700" fill="#334155">자주 놓치는 것</text>
  <text x="40" y="390" font-size="13" fill="#334155">• Dockerfile만 고치고 다시 빌드하지 않음</text>
  <text x="40" y="412" font-size="13" fill="#334155">• 빌드 후 push 누락 → ErrImagePull</text>
  <text x="40" y="434" font-size="13" fill="#334155">• Podman은 FROM에 docker.io/library/ 전체 이름</text>
</svg>
