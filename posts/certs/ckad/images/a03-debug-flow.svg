<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">Pod가 정상이 아닐 때 — STATUS에서 원인까지</text>

  <!-- top box -->
  <rect x="300" y="56" width="300" height="50" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="450" y="78" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">Pod가 정상이 아니다</text>
  <text x="450" y="97" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">k get pod -o wide</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M450,106 L450,122 L102,122 L102,146"/>
    <path d="M450,122 L278,122 L278,146"/>
    <path d="M450,106 L450,146"/>
    <path d="M450,122 L630,122 L630,146"/>
    <path d="M450,122 L806,122 L806,146"/>
  </g>

  <!-- row labels -->
  <!-- columns: x = 20, 196, 372, 548, 724 ; width 164 -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="20" y="148" width="164" height="50" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="102" y="178" fill="#334155">Pending</text>
    <rect x="196" y="148" width="164" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="278" y="170" fill="#92400e">ErrImagePull</text>
    <text x="278" y="188" fill="#92400e">ImagePullBackOff</text>
    <rect x="372" y="148" width="164" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="454" y="170" fill="#92400e">CreateContainer</text>
    <text x="454" y="188" fill="#92400e">ConfigError</text>
    <rect x="548" y="148" width="164" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="630" y="178" fill="#991b1b">CrashLoopBackOff</text>
    <rect x="724" y="148" width="164" height="50" rx="6" fill="#dcfce7" stroke="#15803d"/>
    <text x="806" y="170" fill="#15803d">Running 0/1</text>
    <text x="806" y="188" fill="#15803d">또는 RESTARTS↑</text>
  </g>

  <!-- row 2: what to look at -->
  <text x="20" y="222" font-size="13" font-weight="bold" fill="#64748b">먼저 볼 것</text>
  <g font-size="12" fill="#334155">
    <rect x="20" y="230" width="164" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="254" font-family="Consolas,'D2Coding',monospace">k describe pod</text>
    <text x="32" y="276">Events 맨 아래</text>
    <rect x="196" y="230" width="164" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="208" y="254" font-family="Consolas,'D2Coding',monospace">k describe pod</text>
    <text x="208" y="276">Events의 Failed 줄</text>
    <rect x="372" y="230" width="164" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="384" y="254" font-family="Consolas,'D2Coding',monospace">k events --for</text>
    <text x="384" y="276" font-family="Consolas,'D2Coding',monospace">pod/X</text>
    <rect x="548" y="230" width="164" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="560" y="254" font-family="Consolas,'D2Coding',monospace">k logs X -p</text>
    <text x="560" y="276" font-family="Consolas,'D2Coding',monospace">lastState.terminated</text>
    <rect x="724" y="230" width="164" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="736" y="254" font-family="Consolas,'D2Coding',monospace">k events --for</text>
    <text x="736" y="276">"probe failed" 줄</text>
  </g>

  <!-- row 3: causes -->
  <text x="20" y="318" font-size="13" font-weight="bold" fill="#64748b">흔한 원인</text>
  <g font-size="12" fill="#334155">
    <rect x="20" y="326" width="164" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="32" y="350">requests 과다</text>
    <text x="32" y="372">nodeSelector·taint</text>
    <text x="32" y="394">PVC 미바인딩</text>
    <rect x="196" y="326" width="164" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="208" y="350">이미지 이름·태그 오타</text>
    <text x="208" y="372">레지스트리 인증 누락</text>
    <rect x="372" y="326" width="164" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="384" y="350">없는 ConfigMap·Secret</text>
    <text x="384" y="372">없는 키 참조</text>
    <text x="384" y="394">runAsNonRoot 위반</text>
    <rect x="548" y="326" width="164" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="560" y="350">앱 오류 (Exit 1)</text>
    <text x="560" y="372">OOMKilled (Exit 137)</text>
    <text x="560" y="394">명령·인자 오타</text>
    <rect x="724" y="326" width="164" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="736" y="350">probe 경로·포트 오류</text>
    <text x="736" y="372">startupProbe 부족</text>
    <text x="736" y="394">의존 서비스 미준비</text>
  </g>

  <!-- bottom: kubectl debug -->
  <rect x="20" y="440" width="868" height="120" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="40" y="466" font-size="14" font-weight="bold" fill="#326ce5">안을 들여다봐야 할 때 — kubectl debug</text>
  <g font-size="13" fill="#334155">
    <text x="40" y="494" font-weight="bold">셸이 없다</text>
    <text x="40" y="518" font-weight="bold">바로 죽는다</text>
    <text x="40" y="542" font-weight="bold">노드를 봐야 한다</text>
  </g>
  <g font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">
    <text x="170" y="494">k debug POD -it --image=busybox:1.37 --target=C</text>
    <text x="170" y="518">k debug POD -it --copy-to=POD-dbg --container=C -- sh</text>
    <text x="170" y="542">k debug node/k8s-w1 -it --image=busybox:1.37</text>
  </g>
  <g font-size="12" fill="#15803d">
    <text x="610" y="494">임시 컨테이너: 재시작 없음, 삭제 불가</text>
    <text x="610" y="518">복사본에서 명령만 셸로 교체</text>
    <text x="610" y="542">노드 파일은 /host, 끝나면 Pod 삭제</text>
  </g>
</svg>
