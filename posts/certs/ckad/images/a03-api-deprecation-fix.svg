<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">제거된 apiVersion 고치기 — Ingress v1beta1 → v1</text>

  <text x="20" y="80" font-size="14" font-weight="bold" fill="#dc2626">옛 매니페스트 (v1.22에서 제거)</text>
  <text x="570" y="80" font-size="14" font-weight="bold" fill="#15803d">고친 매니페스트 (v1.37)</text>

  <!-- left code -->
  <rect x="20" y="92" width="315" height="320" rx="8" fill="#0f172a"/>
  <rect x="26" y="102" width="303" height="20" rx="3" fill="#dc2626" fill-opacity="0.45"/>
  <rect x="26" y="174" width="303" height="38" rx="3" fill="#dc2626" fill-opacity="0.45"/>
  <rect x="26" y="337" width="303" height="38" rx="3" fill="#dc2626" fill-opacity="0.45"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#e2e8f0">
    <text xml:space="preserve" x="34" y="117">apiVersion: networking.k8s.io/v1beta1</text>
    <text xml:space="preserve" x="34" y="135">kind: Ingress</text>
    <text xml:space="preserve" x="34" y="153">metadata:</text>
    <text xml:space="preserve" x="34" y="171">  name: orders</text>
    <text xml:space="preserve" x="34" y="189">  annotations:</text>
    <text xml:space="preserve" x="34" y="207">    kubernetes.io/ingress.class: traefik</text>
    <text xml:space="preserve" x="34" y="225">spec:</text>
    <text xml:space="preserve" x="34" y="243">  rules:</text>
    <text xml:space="preserve" x="34" y="261">  - host: orders.a03.test</text>
    <text xml:space="preserve" x="34" y="279">    http:</text>
    <text xml:space="preserve" x="34" y="297">      paths:</text>
    <text xml:space="preserve" x="34" y="315">      - path: /</text>
    <text xml:space="preserve" x="34" y="333">        backend:</text>
    <text xml:space="preserve" x="34" y="351">          serviceName: orders</text>
    <text xml:space="preserve" x="34" y="369">          servicePort: 80</text>
  </g>

  <!-- right code -->
  <rect x="565" y="92" width="315" height="320" rx="8" fill="#0f172a"/>
  <rect x="571" y="102" width="303" height="20" rx="3" fill="#16a34a" fill-opacity="0.45"/>
  <rect x="571" y="192" width="303" height="20" rx="3" fill="#16a34a" fill-opacity="0.45"/>
  <rect x="571" y="300" width="303" height="20" rx="3" fill="#16a34a" fill-opacity="0.45"/>
  <rect x="571" y="336" width="303" height="56" rx="3" fill="#16a34a" fill-opacity="0.45"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#e2e8f0">
    <text x="579" y="117" xml:space="preserve">apiVersion: networking.k8s.io/v1</text>
    <text x="579" y="135" xml:space="preserve">kind: Ingress</text>
    <text x="579" y="153" xml:space="preserve">metadata:</text>
    <text x="579" y="171" xml:space="preserve">  name: orders</text>
    <text x="579" y="189" xml:space="preserve">spec:</text>
    <text x="579" y="207" xml:space="preserve">  ingressClassName: traefik</text>
    <text x="579" y="225" xml:space="preserve">  rules:</text>
    <text x="579" y="243" xml:space="preserve">  - host: orders.a03.test</text>
    <text x="579" y="261" xml:space="preserve">    http:</text>
    <text x="579" y="279" xml:space="preserve">      paths:</text>
    <text x="579" y="297" xml:space="preserve">      - path: /</text>
    <text x="579" y="315" xml:space="preserve">        pathType: Prefix</text>
    <text x="579" y="333" xml:space="preserve">        backend:</text>
    <text x="579" y="351" xml:space="preserve">          service:</text>
    <text x="579" y="369" xml:space="preserve">            name: orders</text>
    <text x="579" y="387" xml:space="preserve">            port: {number: 80}</text>
  </g>

  <!-- middle steps -->
  <g font-size="12" fill="#334155">
    <rect x="355" y="100" width="195" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="367" y="123" font-size="13" font-weight="bold" fill="#991b1b">① 적용이 실패한다</text>
    <text x="367" y="146" font-family="Consolas,'D2Coding',monospace" font-size="11">no matches for kind</text>

    <rect x="355" y="178" width="195" height="62" rx="8" fill="#e8eefc" stroke="#326ce5"/>
    <text x="367" y="201" font-size="13" font-weight="bold" fill="#326ce5">② 현재 버전 확인</text>
    <text x="367" y="224" font-family="Consolas,'D2Coding',monospace" font-size="11">k explain ingress | head -3</text>

    <rect x="355" y="256" width="195" height="62" rx="8" fill="#e8eefc" stroke="#326ce5"/>
    <text x="367" y="279" font-size="13" font-weight="bold" fill="#326ce5">③ 바뀐 필드 구조 확인</text>
    <text x="367" y="302" font-family="Consolas,'D2Coding',monospace" font-size="11">k explain ...backend.service</text>

    <rect x="355" y="334" width="195" height="62" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="367" y="357" font-size="13" font-weight="bold" fill="#15803d">④ 서버 검증 후 적용</text>
    <text x="367" y="380" font-family="Consolas,'D2Coding',monospace" font-size="11">k apply --dry-run=server</text>
  </g>
  <g stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <line x1="337" y1="131" x2="352" y2="131"/>
    <line x1="452" y1="162" x2="452" y2="175"/>
    <line x1="452" y1="240" x2="452" y2="253"/>
    <line x1="452" y1="318" x2="452" y2="331"/>
    <line x1="550" y1="365" x2="562" y2="365"/>
  </g>

  <!-- bottom -->
  <rect x="20" y="428" width="860" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="36" y="451" font-size="13" fill="#334155"><tspan font-weight="bold">apiVersion만 바꾸면 되는 것: </tspan>batch/v1beta1 → batch/v1 (CronJob) · autoscaling/v2beta2 → autoscaling/v2</text>
  <text x="36" y="473" font-size="13" fill="#334155">policy/v1beta1 → policy/v1 (PDB) · <tspan font-weight="bold">구조도 바뀐 것:</tspan> Ingress — serviceName/servicePort, pathType 필수, ingressClassName</text>
</svg>
