<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#334155">API 요청이 지나는 관문과 securityContext의 자리</text>

  <!-- row labels -->
  <g font-size="12" font-weight="bold" fill="#64748b">
    <text x="20" y="205">실패하면</text>
    <text x="20" y="268">확인 명령</text>
  </g>

  <!-- stage boxes: 요청 20/120, 인증 165/140, 인가 330/140, 어드미션 495/190, kubelet 710/170 -->
  <rect x="20" y="62" width="120" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="88" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">요청</text>
  <text x="80" y="114" font-size="12" fill="#334155" text-anchor="middle">kubectl,</text>
  <text x="80" y="132" font-size="12" fill="#334155" text-anchor="middle">앱 Pod의 SA</text>
  <text x="80" y="156" font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">Bearer 토큰</text>

  <rect x="165" y="62" width="140" height="120" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="235" y="88" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">① 인증</text>
  <text x="235" y="114" font-size="12" fill="#334155" text-anchor="middle">누구인가?</text>
  <text x="235" y="138" font-size="12" fill="#334155" text-anchor="middle">토큰 → 사용자 이름</text>
  <text x="235" y="160" font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">system:serviceaccount</text>

  <rect x="330" y="62" width="140" height="120" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="400" y="88" font-size="14" font-weight="bold" fill="#326ce5" text-anchor="middle">② 인가 (RBAC)</text>
  <text x="400" y="114" font-size="12" fill="#334155" text-anchor="middle">해도 되는가?</text>
  <text x="400" y="138" font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">Role + RoleBinding</text>
  <text x="400" y="160" font-size="12" fill="#334155" text-anchor="middle">동사 · 리소스 · 이름</text>

  <rect x="495" y="62" width="190" height="120" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590" y="88" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">③ 어드미션</text>
  <text x="507" y="114" font-size="12" fill="#334155">LimitRange: 기본값 채움</text>
  <text x="507" y="138" font-size="12" fill="#334155">ResourceQuota: 합계 검사</text>
  <text x="507" y="162" font-size="12" fill="#334155">PodSecurity: 수준 검사</text>

  <rect x="710" y="62" width="170" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="795" y="88" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">④ 실행 (kubelet)</text>
  <text x="795" y="114" font-size="12" fill="#334155" text-anchor="middle">etcd 저장 후 노드에서</text>
  <text x="795" y="138" font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">securityContext</text>
  <text x="795" y="160" font-size="12" fill="#334155" text-anchor="middle">UID · capabilities 적용</text>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="140" y1="122" x2="162" y2="122"/>
    <line x1="305" y1="122" x2="327" y2="122"/>
    <line x1="470" y1="122" x2="492" y2="122"/>
    <line x1="685" y1="122" x2="707" y2="122"/>
  </g>

  <!-- failure row -->
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <rect x="165" y="190" width="140" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="235" y="223">401 Unauthorized</text>
    <rect x="330" y="190" width="140" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="400" y="223">403 Forbidden</text>
    <rect x="495" y="190" width="190" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="590" y="213">exceeded quota</text>
    <text x="590" y="233">violates PodSecurity</text>
    <rect x="710" y="190" width="170" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="795" y="213">CreateContainer</text>
    <text x="795" y="233">ConfigError</text>
  </g>

  <!-- check row -->
  <g font-size="11" fill="#0f172a" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <rect x="20" y="276" width="120" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="80" y="306">k create token</text>
    <rect x="165" y="276" width="140" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="235" y="306">k auth whoami</text>
    <rect x="330" y="276" width="140" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="400" y="297">k auth can-i</text>
    <text x="400" y="315">--as=... -n NS</text>
    <rect x="495" y="276" width="190" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="590" y="297">k describe quota</text>
    <text x="590" y="315">k events --types=Warning</text>
    <rect x="710" y="276" width="170" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="795" y="306">k exec POD -- id</text>
  </g>

  <!-- notes -->
  <rect x="20" y="342" width="860" height="94" rx="8" fill="#e8eefc" stroke="#326ce5" stroke-width="1.5"/>
  <text x="38" y="368" font-size="13" fill="#334155"><tspan font-weight="bold">SA의 사용자 이름</tspan> = <tspan font-family="Consolas,'D2Coding',monospace">system:serviceaccount:&lt;네임스페이스&gt;:&lt;SA 이름&gt;</tspan> → <tspan font-family="Consolas,'D2Coding',monospace">--as</tspan> 값으로 그대로 사용</text>
  <text x="38" y="392" font-size="13" fill="#334155"><tspan font-weight="bold">401</tspan>은 토큰이 틀렸거나 만료(인증), <tspan font-weight="bold">403</tspan>은 신원은 맞지만 권한 없음(인가)</text>
  <text x="38" y="416" font-size="13" fill="#334155"><tspan font-weight="bold">CKAD 범위</tspan>: 어드미션 플러그인 설정은 건드리지 않고, 거부 메시지를 읽어 매니페스트를 맞춘다</text>
</svg>
