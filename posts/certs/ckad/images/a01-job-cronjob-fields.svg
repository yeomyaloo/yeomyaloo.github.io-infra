<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Job·CronJob 필드가 동작하는 시점</text>

  <!-- ===== Job ===== -->
  <text x="30" y="68" font-size="15" font-weight="700" fill="#1e3a8a">Job</text>
  <text x="70" y="68" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">completions: 6 · parallelism: 3 · backoffLimit: 2 · activeDeadlineSeconds · ttlSecondsAfterFinished</text>

  <text x="30" y="104" font-size="12" fill="#64748b">슬롯 1</text>
  <text x="30" y="138" font-size="12" fill="#64748b">슬롯 2</text>
  <text x="30" y="172" font-size="12" fill="#64748b">슬롯 3</text>
  <line x1="90" y1="186" x2="920" y2="186" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="920" y="204" text-anchor="end" font-size="12" fill="#64748b">시간</text>

  <!-- slot 1 -->
  <rect x="100" y="90" width="150" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="175" y="106" text-anchor="middle" font-size="12" fill="#14532d">성공 1</text>
  <rect x="260" y="90" width="150" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="335" y="106" text-anchor="middle" font-size="12" fill="#14532d">성공 4</text>
  <!-- slot 2 -->
  <rect x="100" y="124" width="140" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="170" y="140" text-anchor="middle" font-size="12" fill="#14532d">성공 2</text>
  <rect x="250" y="124" width="70" height="22" rx="4" fill="#fca5a5" stroke="#dc2626"/>
  <text x="285" y="140" text-anchor="middle" font-size="12" fill="#7f1d1d">실패</text>
  <rect x="340" y="124" width="140" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#14532d">재시도 → 성공 6</text>
  <!-- slot 3 -->
  <rect x="100" y="158" width="160" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="180" y="174" text-anchor="middle" font-size="12" fill="#14532d">성공 3</text>
  <rect x="270" y="158" width="150" height="22" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="345" y="174" text-anchor="middle" font-size="12" fill="#14532d">성공 5</text>

  <!-- complete -->
  <line x1="484" y1="82" x2="484" y2="186" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="94" font-size="12" font-weight="700" fill="#16a34a">Complete (6/6)</text>

  <!-- ttl -->
  <line x1="488" y1="118" x2="640" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="140" font-size="12" fill="#334155">ttlSecondsAfterFinished</text>
  <text x="494" y="158" font-size="12" fill="#334155">지나면 Job·Pod 자동 삭제</text>
  <rect x="646" y="106" width="70" height="24" rx="4" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="681" y="123" text-anchor="middle" font-size="12" fill="#64748b">삭제됨</text>

  <!-- deadline -->
  <line x1="760" y1="78" x2="760" y2="186" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="770" y="98" font-size="12" font-weight="700" fill="#dc2626">activeDeadlineSeconds</text>
  <text x="770" y="116" font-size="12" fill="#334155">시작부터 이 시간이 지나면</text>
  <text x="770" y="134" font-size="12" fill="#334155">실행 중 Pod 종료 → Failed</text>
  <text x="770" y="152" font-size="12" fill="#334155">(DeadlineExceeded)</text>

  <rect x="30" y="216" width="900" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="46" y="241" font-size="13" fill="#334155">실패 Pod는 지수 백오프(10s, 20s, 40s…)로 재시도. 실패가 backoffLimit을 넘으면 Failed(BackoffLimitExceeded). 시간 제한이 재시도보다 우선</text>

  <!-- ===== CronJob ===== -->
  <text x="30" y="296" font-size="15" font-weight="700" fill="#14532d">CronJob</text>
  <text x="104" y="296" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">schedule: "*/2 * * * *"   작업 하나가 3분 걸릴 때 (주기보다 김)</text>

  <!-- ticks -->
  <line x1="150" y1="310" x2="150" y2="490" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="350" y1="310" x2="350" y2="490" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="550" y1="310" x2="550" y2="490" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="750" y1="310" x2="750" y2="490" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="150" y="322" text-anchor="middle" font-size="12" fill="#64748b">0분</text>
  <text x="350" y="322" text-anchor="middle" font-size="12" fill="#64748b">2분</text>
  <text x="550" y="322" text-anchor="middle" font-size="12" fill="#64748b">4분</text>
  <text x="750" y="322" text-anchor="middle" font-size="12" fill="#64748b">6분</text>

  <!-- Allow -->
  <text x="30" y="352" font-size="13" font-weight="700" fill="#0f172a">Allow</text>
  <text x="30" y="368" font-size="11" fill="#64748b">(기본값)</text>
  <rect x="150" y="334" width="300" height="14" rx="3" fill="#c7d2fe" stroke="#4f46e5"/>
  <rect x="350" y="350" width="300" height="14" rx="3" fill="#c7d2fe" stroke="#4f46e5"/>
  <rect x="550" y="366" width="300" height="14" rx="3" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="862" y="360" font-size="12" fill="#334155">겹쳐서</text>
  <text x="862" y="376" font-size="12" fill="#334155">동시 실행</text>

  <!-- Forbid -->
  <text x="30" y="418" font-size="13" font-weight="700" fill="#0f172a">Forbid</text>
  <rect x="150" y="406" width="300" height="18" rx="3" fill="#86efac" stroke="#16a34a"/>
  <text x="350" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">✕</text>
  <rect x="550" y="406" width="300" height="18" rx="3" fill="#86efac" stroke="#16a34a"/>
  <text x="750" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">✕</text>
  <text x="862" y="414" font-size="12" fill="#334155">돌고 있으면</text>
  <text x="862" y="430" font-size="12" fill="#334155">건너뜀</text>

  <!-- Replace -->
  <text x="30" y="476" font-size="13" font-weight="700" fill="#0f172a">Replace</text>
  <rect x="150" y="464" width="200" height="18" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="350" y="464" width="200" height="18" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="550" y="464" width="200" height="18" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="750" y="464" width="100" height="18" rx="3" fill="#fde68a" stroke="#f59e0b"/>
  <text x="862" y="472" font-size="12" fill="#334155">이전 것을 멈추고</text>
  <text x="862" y="488" font-size="12" fill="#334155">새로 시작</text>

  <text x="30" y="524" font-size="12" fill="#64748b">히스토리: successfulJobsHistoryLimit(기본 3) · failedJobsHistoryLimit(기본 1)만큼 끝난 Job을 남김 · suspend: true면 새 실행 없음</text>
</svg>
