<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kubernetes 기본 리소스만으로 하는 배포 전략</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">Deployment 두 개 + Service 하나 — 무엇을 바꾸느냐가 다르다</text>

  <!-- ===== Blue-Green ===== -->
  <rect x="20" y="76" width="450" height="428" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="36" y="104" font-size="17" font-weight="700" fill="#0f172a">수동 블루그린 — selector를 바꾼다</text>

  <rect x="125" y="124" width="240" height="70" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="245" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Service shop</text>
  <text x="245" y="170" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Consolas,'D2Coding',monospace" text-decoration="line-through">app: shop-blue</text>
  <text x="245" y="186" text-anchor="middle" font-size="12" fill="#15803d" font-family="Consolas,'D2Coding',monospace" font-weight="700">app: shop-green</text>

  <line x1="190" y1="194" x2="130" y2="246" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowS)"/>
  <text x="112" y="224" font-size="12" fill="#94a3b8">전환 전</text>
  <line x1="300" y1="194" x2="360" y2="246" stroke="#15803d" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="338" y="224" font-size="12" font-weight="700" fill="#15803d">전환 후</text>

  <rect x="40" y="250" width="190" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Deployment shop-blue</text>
  <text x="135" y="294" text-anchor="middle" font-size="12" fill="#334155">hello-spring:1.0</text>
  <rect x="70" y="306" width="56" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="98" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>
  <rect x="144" y="306" width="56" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="172" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>

  <rect x="260" y="250" width="190" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="355" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Deployment shop-green</text>
  <text x="355" y="294" text-anchor="middle" font-size="12" fill="#334155">hello-spring:2.0</text>
  <rect x="290" y="306" width="56" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="318" y="330" text-anchor="middle" font-size="12" fill="#14532d">Pod</text>
  <rect x="364" y="306" width="56" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="392" y="330" text-anchor="middle" font-size="12" fill="#14532d">Pod</text>

  <text x="40" y="392" font-size="13" fill="#334155">① green을 미리 띄우고 Ready 확인</text>
  <text x="40" y="416" font-size="13" fill="#334155">② 한 줄로 100% 전환</text>
  <text x="56" y="438" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">k set selector svc shop app=shop-green</text>
  <text x="40" y="464" font-size="13" fill="#334155">③ 되돌리기도 selector 한 줄 (blue가 살아 있는 동안)</text>
  <text x="40" y="488" font-size="13" fill="#334155">④ 검증: endpointslice IP = green Pod IP</text>

  <!-- ===== Canary ===== -->
  <rect x="490" y="76" width="450" height="428" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="506" y="104" font-size="17" font-weight="700" fill="#0f172a">수동 카나리 — 레플리카 수를 바꾼다</text>

  <rect x="595" y="124" width="240" height="70" rx="10" fill="#e8eefc" stroke="#326ce5" stroke-width="2"/>
  <text x="715" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Service api</text>
  <text x="715" y="174" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace" font-weight="700">tier: api   (공통 라벨만)</text>

  <line x1="660" y1="194" x2="610" y2="246" stroke="#326ce5" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="586" y="224" font-size="14" font-weight="700" fill="#326ce5">≈80%</text>
  <line x1="790" y1="194" x2="840" y2="246" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="822" y="224" font-size="14" font-weight="700" fill="#15803d">≈20%</text>

  <rect x="506" y="250" width="250" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="631" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">api-stable · hello-py:1.0</text>
  <text x="631" y="292" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">tier=api, track=stable</text>
  <rect x="518" y="306" width="50" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="543" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>
  <rect x="577" y="306" width="50" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="602" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>
  <rect x="636" y="306" width="50" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="661" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>
  <rect x="695" y="306" width="50" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="720" y="330" text-anchor="middle" font-size="12" fill="#1e40af">Pod</text>

  <rect x="772" y="250" width="152" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="848" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">api-canary · 1.1</text>
  <text x="848" y="292" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">track=canary</text>
  <rect x="823" y="306" width="50" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="848" y="330" text-anchor="middle" font-size="12" fill="#14532d">Pod</text>

  <text x="506" y="392" font-size="13" fill="#334155">① 비율 ≈ 레플리카 비율 (4 : 1 → 약 80 : 20)</text>
  <text x="506" y="416" font-size="13" fill="#334155">② 각 Deployment selector는 track까지 — 겹치지 않게</text>
  <text x="506" y="440" font-size="13" fill="#334155">③ 승격: stable 이미지 교체 → canary 0개</text>
  <text x="506" y="464" font-size="13" fill="#334155">④ 정밀 가중치·헤더 라우팅은 범위 밖</text>
  <text x="522" y="488" font-size="12" fill="#64748b">→ Gateway API weight(A05) · Argo Rollouts(Day 56)</text>
</svg>
