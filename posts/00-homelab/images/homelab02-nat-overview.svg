<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">공인 IP · 사설 IP · NAT — 공유기가 하는 일</text>

  <!-- LAN -->
  <rect x="20" y="60" width="400" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="220" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">집 안 — 사설망 192.168.0.0/24</text>

  <g font-size="14">
    <rect x="50" y="110" width="210" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="66" y="134" font-weight="700" fill="#14532d">홈랩 서버</text>
    <text x="66" y="156" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">192.168.0.10</text>

    <rect x="50" y="190" width="210" height="58" rx="8" fill="#e2e8f0"/>
    <text x="66" y="214" font-weight="700" fill="#0f172a">노트북</text>
    <text x="66" y="236" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">192.168.0.23</text>

    <rect x="50" y="270" width="210" height="58" rx="8" fill="#e2e8f0"/>
    <text x="66" y="294" font-weight="700" fill="#0f172a">휴대폰</text>
    <text x="66" y="316" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">192.168.0.31</text>
  </g>

  <!-- LAN cables -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="260" y1="139" x2="470" y2="200"/>
    <line x1="260" y1="219" x2="470" y2="220"/>
    <line x1="260" y1="299" x2="470" y2="240"/>
  </g>

  <!-- Router -->
  <rect x="470" y="140" width="180" height="150" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="560" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">공유기</text>
  <g font-size="12" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="560" y="196" fill="#334155">LAN 192.168.0.1</text>
    <text x="560" y="218" fill="#c2410c" font-weight="700">WAN 203.0.113.45</text>
  </g>
  <text x="560" y="248" text-anchor="middle" font-size="13" fill="#1e3a8a">DHCP · NAT · 방화벽</text>
  <text x="560" y="272" text-anchor="middle" font-size="12" fill="#64748b">집의 유일한 공인 IP</text>

  <!-- Internet -->
  <rect x="720" y="80" width="220" height="220" rx="40" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="830" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">인터넷</text>
  <rect x="745" y="130" width="170" height="54" rx="8" fill="#fed7aa"/>
  <text x="830" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">웹 서버</text>
  <text x="830" y="172" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="Consolas,'D2Coding',monospace">198.51.100.7</text>
  <rect x="745" y="210" width="170" height="54" rx="8" fill="#fed7aa"/>
  <text x="830" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">외부 사용자 (카페)</text>
  <text x="830" y="252" text-anchor="middle" font-size="12" fill="#7c2d12">집 서버에 접속하려 함</text>

  <!-- Outbound OK -->
  <line x1="652" y1="160" x2="742" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="697" y="150" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">안→밖 OK</text>

  <!-- Inbound blocked -->
  <line x1="742" y1="240" x2="656" y2="240" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <g stroke="#dc2626" stroke-width="3">
    <line x1="688" y1="230" x2="706" y2="250"/>
    <line x1="706" y1="230" x2="688" y2="250"/>
  </g>
  <text x="697" y="270" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">밖→안 차단</text>

  <!-- NAT table -->
  <rect x="440" y="320" width="500" height="118" rx="10" fill="#ffffff" stroke="#2496ed"/>
  <text x="690" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">NAT 테이블 (공유기가 기억하는 변환 기록)</text>
  <rect x="452" y="354" width="476" height="28" fill="#e2e8f0"/>
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="462" y="373">내부 주소:포트</text>
    <text x="622" y="373">외부(공인) 주소:포트</text>
    <text x="790" y="373">상대방</text>
  </g>
  <g font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">
    <text x="462" y="402">192.168.0.23:51000</text>
    <text x="622" y="402">203.0.113.45:40001</text>
    <text x="790" y="402">198.51.100.7:443</text>
  </g>
  <text x="690" y="426" text-anchor="middle" font-size="12" fill="#64748b">응답이 오면 이 표를 보고 192.168.0.23으로 돌려보냄</text>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <text x="30" y="392" font-weight="700">사설 대역</text>
    <text x="30" y="414" font-family="Consolas,'D2Coding',monospace" font-size="12">10/8 · 172.16/12 · 192.168/16</text>
    <text x="30" y="436">인터넷에서 직접 닿지 않는다</text>
  </g>
</svg>
