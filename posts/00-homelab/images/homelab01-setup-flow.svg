<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">깡통 노트북/PC → 홈랩 서버 6단계</text>

  <!-- Step boxes: x = 12 + 160*i, width 136 -->
  <g font-size="13" text-anchor="middle">
    <!-- 1 -->
    <rect x="12" y="70" width="136" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="80" cy="96" r="15" fill="#334155"/>
    <text x="80" y="101" fill="#ffffff" font-weight="700" font-size="14">1</text>
    <text x="80" y="138" font-size="15" font-weight="700" fill="#0f172a">하드웨어 체크</text>
    <text x="80" y="168" fill="#334155">VT-x / AMD-V</text>
    <text x="80" y="190" fill="#334155">RAM · SSD</text>

    <!-- 2 -->
    <rect x="172" y="70" width="136" height="150" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
    <circle cx="240" cy="96" r="15" fill="#f59e0b"/>
    <text x="240" y="101" fill="#ffffff" font-weight="700" font-size="14">2</text>
    <text x="240" y="138" font-size="15" font-weight="700" fill="#0f172a">설치 USB</text>
    <text x="240" y="168" fill="#334155">Rufus</text>
    <text x="240" y="190" fill="#334155">balenaEtcher</text>

    <!-- 3 -->
    <rect x="332" y="70" width="136" height="150" rx="10" fill="#eff6ff" stroke="#2496ed"/>
    <circle cx="400" cy="96" r="15" fill="#2496ed"/>
    <text x="400" y="101" fill="#ffffff" font-weight="700" font-size="14">3</text>
    <text x="400" y="138" font-size="15" font-weight="700" fill="#0f172a">Ubuntu 설치</text>
    <text x="400" y="168" fill="#334155">Server 24.04 LTS</text>
    <text x="400" y="190" fill="#334155">OpenSSH 체크</text>

    <!-- 4 -->
    <rect x="492" y="70" width="136" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
    <circle cx="560" cy="96" r="15" fill="#4f46e5"/>
    <text x="560" y="101" fill="#ffffff" font-weight="700" font-size="14">4</text>
    <text x="560" y="138" font-size="15" font-weight="700" fill="#0f172a">IP 고정</text>
    <text x="560" y="168" fill="#334155">공유기 DHCP 예약</text>
    <text x="560" y="190" fill="#334155">또는 netplan</text>

    <!-- 5 -->
    <rect x="652" y="70" width="136" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <circle cx="720" cy="96" r="15" fill="#dc2626"/>
    <text x="720" y="101" fill="#ffffff" font-weight="700" font-size="14">5</text>
    <text x="720" y="138" font-size="15" font-weight="700" fill="#0f172a">SSH 키 인증</text>
    <text x="720" y="168" fill="#334155">ed25519 키</text>
    <text x="720" y="190" fill="#334155">비번 로그인 끔</text>

    <!-- 6 -->
    <rect x="812" y="70" width="136" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="880" cy="96" r="15" fill="#16a34a"/>
    <text x="880" y="101" fill="#ffffff" font-weight="700" font-size="14">6</text>
    <text x="880" y="138" font-size="15" font-weight="700" fill="#0f172a">상시 가동 · 보안</text>
    <text x="880" y="168" fill="#334155">덮개 · 절전 무시</text>
    <text x="880" y="190" fill="#334155">ufw · 자동 업데이트</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="145" x2="169" y2="145" marker-end="url(#arrow)"/>
    <line x1="310" y1="145" x2="329" y2="145" marker-end="url(#arrow)"/>
    <line x1="470" y1="145" x2="489" y2="145" marker-end="url(#arrow)"/>
    <line x1="630" y1="145" x2="649" y2="145" marker-end="url(#arrow)"/>
    <line x1="790" y1="145" x2="809" y2="145" marker-end="url(#arrow)"/>
  </g>

  <!-- phase labels -->
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <line x1="12" y1="238" x2="468" y2="238" stroke="#cbd5e1" stroke-width="2"/>
    <text x="240" y="258">서버 앞에서 (모니터 · 키보드 필요)</text>
    <line x1="492" y1="238" x2="948" y2="238" stroke="#cbd5e1" stroke-width="2"/>
    <text x="720" y="258">내 PC에서 SSH로 원격 작업 가능</text>
  </g>

  <!-- result -->
  <rect x="160" y="274" width="640" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="296" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">결과: 집 안 어디서나 ssh homelab 으로 접속되는 24시간 서버</text>
</svg>
