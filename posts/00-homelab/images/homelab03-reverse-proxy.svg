<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">리버스 프록시 — 입구 하나(443), 도메인별 분기</text>

  <!-- Users -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" text-anchor="middle">
    <rect x="20" y="96" width="220" height="64" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="130" y="120" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#7c2d12">브라우저</text>
    <text x="130" y="144" fill="#7c2d12">https://whoami.home.example.com</text>
    <rect x="20" y="216" width="220" height="64" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="130" y="240" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#7c2d12">브라우저</text>
    <text x="130" y="264" fill="#7c2d12">https://status.home.example.com</text>
  </g>

  <!-- Router -->
  <rect x="285" y="150" width="100" height="80" rx="10" fill="#eff6ff" stroke="#2496ed"/>
  <text x="335" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">공유기</text>
  <text x="335" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">80 · 443</text>

  <!-- Caddy -->
  <rect x="430" y="110" width="190" height="160" rx="12" fill="#16a34a"/>
  <text x="525" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Caddy</text>
  <text x="525" y="164" text-anchor="middle" font-size="13" fill="#dcfce7">리버스 프록시</text>
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <text x="525" y="198">HTTPS 종료</text>
    <text x="525" y="222">Host 헤더로 분기</text>
    <text x="525" y="246">인증서 자동 갱신</text>
  </g>

  <!-- Compose network -->
  <rect x="670" y="80" width="270" height="230" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="805" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Compose 네트워크</text>
  <text x="805" y="124" text-anchor="middle" font-size="12" fill="#64748b">ports 없음 — 외부에서 직접 접근 불가</text>
  <rect x="700" y="140" width="210" height="56" rx="8" fill="#93c5fd"/>
  <text x="805" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">whoami:80</text>
  <rect x="700" y="232" width="210" height="56" rx="8" fill="#93c5fd"/>
  <text x="805" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">uptime-kuma:3001</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="240" y1="128" x2="282" y2="174" marker-end="url(#arrow)"/>
    <line x1="240" y1="248" x2="282" y2="206" marker-end="url(#arrow)"/>
    <line x1="385" y1="190" x2="426" y2="190" marker-end="url(#arrow)"/>
    <line x1="620" y1="168" x2="696" y2="168" marker-end="url(#arrow)"/>
    <line x1="620" y1="260" x2="696" y2="260" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="658" y="160">whoami.*</text>
    <text x="658" y="252">status.*</text>
  </g>

  <!-- Let's Encrypt -->
  <rect x="430" y="320" width="190" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="525" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Let's Encrypt</text>
  <text x="525" y="364" text-anchor="middle" font-size="12" fill="#78350f">무료 인증서 (90일)</text>
  <line x1="525" y1="318" x2="525" y2="274" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="535" y="300" font-size="12" fill="#15803d" font-weight="700">발급 · 자동 갱신</text>

  <text x="805" y="350" text-anchor="middle" font-size="13" fill="#334155">K8s의 Ingress(Day 15)가</text>
  <text x="805" y="372" text-anchor="middle" font-size="13" fill="#334155">바로 이 역할을 클러스터에서 한다</text>
</svg>
