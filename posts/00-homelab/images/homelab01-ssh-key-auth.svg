<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SSH 키 인증 — 개인키는 내 PC를 떠나지 않는다</text>

  <!-- Client -->
  <rect x="20" y="64" width="280" height="290" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="160" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">내 PC (클라이언트)</text>
  <text x="160" y="116" text-anchor="middle" font-size="13" fill="#64748b" font-family="Consolas,'D2Coding',monospace">~/.ssh/</text>

  <rect x="45" y="134" width="230" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="160" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">개인키 (열쇠)</text>
  <text x="160" y="184" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">id_ed25519</text>

  <rect x="45" y="222" width="230" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="160" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">공개키 (자물쇠)</text>
  <text x="160" y="272" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">id_ed25519.pub</text>

  <text x="160" y="328" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">개인키는 절대 외부 유출 금지</text>

  <!-- Server -->
  <rect x="660" y="64" width="280" height="290" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="800" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">홈랩 서버 (sshd)</text>
  <text x="800" y="116" text-anchor="middle" font-size="13" fill="#64748b" font-family="Consolas,'D2Coding',monospace">192.168.0.10</text>

  <rect x="685" y="134" width="230" height="88" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="800" y="156" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">~/.ssh/authorized_keys</text>
  <rect x="705" y="168" width="190" height="40" rx="6" fill="#dcfce7"/>
  <text x="800" y="193" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">등록된 공개키</text>

  <rect x="685" y="240" width="230" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="800" y="262" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">sshd_config.d/00-hardening.conf</text>
  <g font-size="11" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">
    <text x="700" y="286">PasswordAuthentication no</text>
    <text x="700" y="304">KbdInteractiveAuthentication no</text>
    <text x="700" y="322">PermitRootLogin no</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M275,257 C340,257 330,150 380,130 L656,130" stroke="#16a34a" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="302" y1="190" x2="656" y2="190" marker-end="url(#arrow)"/>
    <line x1="656" y1="240" x2="304" y2="240" marker-end="url(#arrow)"/>
    <line x1="302" y1="290" x2="656" y2="290" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="520" y="120" fill="#15803d" font-weight="700">① 최초 1회: 공개키 등록 (ssh-copy-id)</text>
    <text x="480" y="180" font-weight="700">② 이 공개키로 로그인할게요</text>
    <text x="480" y="230" font-weight="700">③ 등록된 키 맞음 — 서명해 보세요</text>
    <text x="480" y="280" font-weight="700">④ 개인키로 세션 데이터에 서명해 전송</text>
  </g>

  <!-- Verify -->
  <rect x="330" y="312" width="300" height="34" rx="8" fill="#eff6ff" stroke="#2496ed"/>
  <text x="480" y="334" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">⑤ 서버가 공개키로 서명 검증 → 로그인</text>

  <!-- Bottom note -->
  <rect x="120" y="376" width="720" height="44" rx="22" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="403" text-anchor="middle" font-size="15" fill="#14532d" font-weight="700">네트워크로 오가는 것은 서명뿐 — 비밀번호를 훔치거나 추측할 대상이 없다</text>
</svg>
