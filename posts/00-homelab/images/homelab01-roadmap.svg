<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="370" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">이 서버 한 대로 이어지는 시리즈 실습</text>

  <!-- boxes: x = 30 + 183*i, width 168 -->
  <g text-anchor="middle">
    <rect x="30" y="66" width="168" height="160" rx="10" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
    <rect x="30" y="66" width="168" height="34" rx="10" fill="#2496ed"/>
    <text x="114" y="89" font-size="14" font-weight="700" fill="#ffffff">Chapter 1</text>
    <text x="114" y="132" font-size="16" font-weight="700" fill="#0f172a">Docker Engine</text>
    <text x="114" y="164" font-size="13" fill="#334155">컨테이너 실습</text>
    <text x="114" y="186" font-size="13" fill="#334155">Day 01 ~ 07</text>

    <rect x="213" y="66" width="168" height="160" rx="10" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
    <rect x="213" y="66" width="168" height="34" rx="10" fill="#326ce5"/>
    <text x="297" y="89" font-size="14" font-weight="700" fill="#ffffff">Day 20</text>
    <text x="297" y="132" font-size="16" font-weight="700" fill="#0f172a">kubeadm 노드</text>
    <text x="297" y="164" font-size="13" fill="#334155">고정 IP 필수</text>
    <text x="297" y="186" font-size="13" fill="#334155">(노드 IP가 바뀌면 깨짐)</text>

    <rect x="396" y="66" width="168" height="160" rx="10" fill="#f5f3ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="396" y="66" width="168" height="34" rx="10" fill="#4f46e5"/>
    <text x="480" y="89" font-size="14" font-weight="700" fill="#ffffff">Day 21 ~ 24</text>
    <text x="480" y="132" font-size="16" font-weight="700" fill="#0f172a">KVM · 브리지 · OVS</text>
    <text x="480" y="164" font-size="13" fill="#334155">VT-x / AMD-V 필수</text>
    <text x="480" y="186" font-size="13" fill="#334155">(/dev/kvm)</text>

    <rect x="579" y="66" width="168" height="160" rx="10" fill="#fff1f2" stroke="#ed1944" stroke-width="2"/>
    <rect x="579" y="66" width="168" height="34" rx="10" fill="#ed1944"/>
    <text x="663" y="89" font-size="14" font-weight="700" fill="#ffffff">Day 26</text>
    <text x="663" y="132" font-size="16" font-weight="700" fill="#0f172a">DevStack</text>
    <text x="663" y="164" font-size="13" fill="#334155">RAM 16GB+ 권장</text>
    <text x="663" y="186" font-size="13" fill="#334155">VM 안에 설치하면 안전</text>

    <rect x="762" y="66" width="168" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="762" y="66" width="168" height="34" rx="10" fill="#16a34a"/>
    <text x="846" y="89" font-size="14" font-weight="700" fill="#ffffff">Chapter 6</text>
    <text x="846" y="132" font-size="16" font-weight="700" fill="#0f172a">LLM 서버</text>
    <text x="846" y="164" font-size="13" fill="#334155">Ollama · vLLM</text>
    <text x="846" y="186" font-size="13" fill="#334155">GPU 장착 PC라면</text>
  </g>

  <!-- arrows from base up -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="114" y1="276" x2="114" y2="230" marker-end="url(#arrow)"/>
    <line x1="297" y1="276" x2="297" y2="230" marker-end="url(#arrow)"/>
    <line x1="480" y1="276" x2="480" y2="230" marker-end="url(#arrow)"/>
    <line x1="663" y1="276" x2="663" y2="230" marker-end="url(#arrow)"/>
    <line x1="846" y1="276" x2="846" y2="230" marker-end="url(#arrow)"/>
  </g>

  <!-- base -->
  <rect x="30" y="278" width="900" height="64" rx="12" fill="#334155"/>
  <text x="480" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">홈랩 서버 — Ubuntu Server 24.04 LTS</text>
  <text x="480" y="328" text-anchor="middle" font-size="13" fill="#e2e8f0">고정 IP · SSH 키 인증 · 덮개/절전 무시 · ufw · 자동 보안 업데이트 (Homelab 01)</text>
</svg>
