<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Argo CD 아키텍처</text>

  <!-- Users -->
  <rect x="20" y="70" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">사용자</text>
  <g font-size="14" text-anchor="middle">
    <rect x="45" y="114" width="150" height="36" rx="18" fill="#e2e8f0"/>
    <text x="120" y="137" fill="#0f172a">Web UI (브라우저)</text>
    <rect x="45" y="164" width="150" height="36" rx="18" fill="#e2e8f0"/>
    <text x="120" y="187" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">argocd CLI</text>
  </g>

  <!-- Git -->
  <rect x="20" y="260" width="200" height="170" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Git (설정 레포)</text>
  <text x="120" y="308" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">gitops-demo-config/apps/</text>
  <g font-size="11" font-family="Consolas,'D2Coding',monospace" text-anchor="middle">
    <rect x="45" y="322" width="150" height="30" rx="6" fill="#fde68a"/><text x="120" y="342" fill="#78350f">demo-app/base</text>
    <rect x="45" y="360" width="150" height="30" rx="6" fill="#fde68a"/><text x="120" y="380" fill="#78350f">demo-app/overlays/dev</text>
    <rect x="45" y="398" width="150" height="24" rx="6" fill="#fef3c7"/><text x="120" y="415" fill="#92400e" font-size="11">overlays/stage · prod</text>
  </g>

  <!-- Argo CD namespace -->
  <rect x="260" y="60" width="400" height="390" rx="12" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="460" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">namespace: argocd</text>

  <rect x="290" y="102" width="340" height="52" rx="8" fill="#ef7b4d"/>
  <text x="460" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">api-server</text>
  <text x="460" y="144" text-anchor="middle" font-size="12" fill="#ffffff">argocd-server · UI/CLI/API 입구, 로그인·RBAC</text>

  <rect x="290" y="200" width="150" height="86" rx="8" fill="#ffffff" stroke="#ef7b4d" stroke-width="2"/>
  <text x="365" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">repo-server</text>
  <text x="365" y="248" text-anchor="middle" font-size="12" fill="#334155">Git clone</text>
  <text x="365" y="266" text-anchor="middle" font-size="12" fill="#334155">Kustomize·Helm 렌더링</text>

  <rect x="490" y="200" width="150" height="86" rx="8" fill="#ffffff" stroke="#ef7b4d" stroke-width="2"/>
  <text x="565" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">application-</text>
  <text x="565" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">controller</text>
  <text x="565" y="260" text-anchor="middle" font-size="12" fill="#334155">원하는 상태 vs live</text>
  <text x="565" y="277" text-anchor="middle" font-size="12" fill="#334155">비교 → Sync</text>

  <rect x="290" y="320" width="150" height="40" rx="8" fill="#fca5a5"/>
  <text x="365" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">redis (캐시)</text>

  <rect x="490" y="320" width="150" height="40" rx="8" fill="#e2e8f0"/>
  <text x="565" y="345" text-anchor="middle" font-size="13" fill="#334155">dex (SSO)</text>

  <rect x="290" y="378" width="150" height="56" rx="8" fill="#e2e8f0"/>
  <text x="365" y="401" text-anchor="middle" font-size="13" fill="#334155">applicationset-</text>
  <text x="365" y="420" text-anchor="middle" font-size="13" fill="#334155">controller</text>
  <rect x="490" y="378" width="150" height="56" rx="8" fill="#e2e8f0"/>
  <text x="565" y="401" text-anchor="middle" font-size="13" fill="#334155">notifications-</text>
  <text x="565" y="420" text-anchor="middle" font-size="13" fill="#334155">controller</text>

  <!-- Kubernetes -->
  <rect x="700" y="60" width="240" height="390" rx="12" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
  <text x="820" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">kind: infra-lab</text>
  <rect x="720" y="102" width="200" height="52" rx="8" fill="#326ce5"/>
  <text x="820" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">kube-apiserver</text>

  <rect x="720" y="200" width="200" height="234" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="820" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">demo-dev · dev-demo-app</text>
  <g font-size="13" text-anchor="middle">
    <rect x="740" y="238" width="160" height="32" rx="6" fill="#86efac"/><text x="820" y="259" fill="#14532d">Deployment</text>
    <rect x="740" y="280" width="160" height="32" rx="6" fill="#bbf7d0"/><text x="820" y="301" fill="#14532d">ReplicaSet</text>
    <rect x="740" y="322" width="75" height="32" rx="6" fill="#dcfce7"/><text x="777" y="343" fill="#14532d">Pod</text>
    <rect x="825" y="322" width="75" height="32" rx="6" fill="#dcfce7"/><text x="862" y="343" fill="#14532d">Pod</text>
    <rect x="740" y="380" width="160" height="32" rx="6" fill="#86efac"/><text x="820" y="401" fill="#14532d">Service</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="140" x2="286" y2="128" marker-end="url(#arrow)"/>
    <line x1="488" y1="236" x2="444" y2="236" marker-end="url(#arrow)"/>
    <line x1="365" y1="154" x2="365" y2="196" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <line x1="365" y1="286" x2="365" y2="316" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <line x1="820" y1="154" x2="820" y2="196" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#ef7b4d" stroke-width="2.5" fill="none">
    <line x1="290" y1="262" x2="224" y2="330" marker-end="url(#arrowO)"/>
    <line x1="640" y1="230" x2="716" y2="140" marker-end="url(#arrowO)"/>
  </g>
  <g font-size="12" fill="#334155" font-weight="700">
    <text x="253" y="122" text-anchor="middle">요청</text>
    <text x="466" y="226" text-anchor="middle">렌더링</text>
    <text x="466" y="256" text-anchor="middle">요청</text>
  </g>
  <g font-size="12" fill="#c2410c" font-weight="700">
    <text x="236" y="276" text-anchor="middle">fetch</text>
    <text x="668" y="176" text-anchor="middle" transform="rotate(-49.8 668 176)">watch · apply</text>
  </g>

  <!-- Flow legend -->
  <text x="480" y="482" text-anchor="middle" font-size="14" fill="#334155">① Git 변경 감지 → ② repo-server가 렌더링 → ③ controller가 live 상태와 비교 → ④ 차이를 kube-apiserver에 적용</text>
</svg>
