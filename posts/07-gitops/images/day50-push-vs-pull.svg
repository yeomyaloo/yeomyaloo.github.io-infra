<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Push 기반 배포 vs Pull 기반 GitOps</text>

  <!-- ================= Panel A: Push ================= -->
  <rect x="20" y="52" width="920" height="254" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="80" font-size="16" font-weight="700" fill="#dc2626">① Push 기반 — CI가 클러스터에 밀어 넣는다</text>

  <rect x="40" y="110" width="110" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="95" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">개발자</text>
  <text x="95" y="162" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">git push</text>

  <rect x="190" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="260" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">앱 레포</text>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">gitops-demo-app</text>

  <rect x="190" y="222" width="140" height="58" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="260" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">레지스트리</text>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#78350f">(GHCR)</text>

  <rect x="370" y="96" width="210" height="196" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CI 러너 (클러스터 밖)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="390" y="134" width="170" height="28" rx="14" fill="#e2e8f0"/>
    <text x="475" y="153" fill="#0f172a">pytest</text>
    <rect x="390" y="170" width="170" height="28" rx="14" fill="#e2e8f0"/>
    <text x="475" y="189" fill="#0f172a">docker build/push</text>
    <rect x="390" y="206" width="170" height="28" rx="14" fill="#fca5a5"/>
    <text x="475" y="225" fill="#7f1d1d">kubectl apply</text>
  </g>
  <rect x="385" y="248" width="180" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="475" y="268" text-anchor="middle" font-size="12" fill="#b91c1c">kubeconfig 시크릿 보관</text>

  <rect x="640" y="96" width="290" height="196" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="785" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터</text>
  <rect x="660" y="136" width="250" height="40" rx="8" fill="#326ce5"/>
  <text x="785" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">kube-apiserver</text>
  <g font-size="12" text-anchor="middle">
    <rect x="672" y="196" width="70" height="30" rx="5" fill="#86efac"/><text x="707" y="216" fill="#14532d">Pod</text>
    <rect x="750" y="196" width="70" height="30" rx="5" fill="#86efac"/><text x="785" y="216" fill="#14532d">Pod</text>
    <rect x="828" y="196" width="70" height="30" rx="5" fill="#86efac"/><text x="863" y="216" fill="#14532d">Pod</text>
  </g>
  <text x="785" y="256" text-anchor="middle" font-size="12" fill="#b91c1c">수동 변경(드리프트) 감지·복구 없음</text>
  <text x="785" y="276" text-anchor="middle" font-size="12" fill="#b91c1c">Git에서 지운 리소스도 남음</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="145" x2="186" y2="145" marker-end="url(#arrow)"/>
    <line x1="330" y1="145" x2="366" y2="145" marker-end="url(#arrow)"/>
    <line x1="390" y1="184" x2="334" y2="236" marker-end="url(#arrow)"/>
  </g>
  <line x1="560" y1="220" x2="656" y2="166" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="610" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">push</text>
  <text x="610" y="248" text-anchor="middle" font-size="11" fill="#b91c1c">(인바운드)</text>

  <!-- ================= Panel B: Pull ================= -->
  <rect x="20" y="322" width="920" height="264" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="350" font-size="16" font-weight="700" fill="#16a34a">② Pull 기반 GitOps — 클러스터 안 에이전트가 Git을 당겨 온다</text>

  <rect x="40" y="380" width="110" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="95" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">개발자</text>
  <text x="95" y="432" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">git push</text>

  <rect x="190" y="380" width="140" height="70" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="260" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">앱 레포</text>
  <text x="260" y="432" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">gitops-demo-app</text>

  <rect x="190" y="498" width="140" height="58" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="260" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">레지스트리</text>
  <text x="260" y="542" text-anchor="middle" font-size="12" fill="#78350f">(GHCR)</text>

  <rect x="370" y="366" width="196" height="128" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="468" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CI 러너</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="383" y="402" width="170" height="26" rx="13" fill="#e2e8f0"/>
    <text x="468" y="420" fill="#0f172a">pytest</text>
    <rect x="383" y="434" width="170" height="26" rx="13" fill="#e2e8f0"/>
    <text x="468" y="452" fill="#0f172a">docker build/push</text>
    <rect x="383" y="466" width="170" height="24" rx="12" fill="#bbf7d0"/>
    <text x="468" y="483" fill="#14532d">태그 커밋 (git)</text>
  </g>

  <rect x="370" y="516" width="210" height="56" rx="10" fill="#ffffff" stroke="#ef7b4d" stroke-width="2"/>
  <text x="475" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">설정 레포</text>
  <text x="475" y="560" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">gitops-demo-config</text>

  <rect x="640" y="366" width="290" height="206" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="785" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터</text>
  <rect x="660" y="402" width="250" height="62" rx="8" fill="#fff1eb" stroke="#ef7b4d" stroke-width="1.5"/>
  <text x="785" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">GitOps 에이전트 (Argo CD)</text>
  <text x="785" y="451" text-anchor="middle" font-size="12" fill="#9a3412">관찰 → 비교 → 적용 (조정 루프)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="672" y="484" width="70" height="30" rx="5" fill="#86efac"/><text x="707" y="504" fill="#14532d">Pod</text>
    <rect x="750" y="484" width="70" height="30" rx="5" fill="#86efac"/><text x="785" y="504" fill="#14532d">Pod</text>
    <rect x="828" y="484" width="70" height="30" rx="5" fill="#86efac"/><text x="863" y="504" fill="#14532d">Pod</text>
  </g>
  <text x="785" y="544" text-anchor="middle" font-size="12" fill="#15803d">드리프트 → 자동 복구 (Self-heal)</text>
  <text x="785" y="562" text-anchor="middle" font-size="12" fill="#15803d">자격 증명은 클러스터 밖으로 안 나감</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="415" x2="186" y2="415" marker-end="url(#arrow)"/>
    <line x1="330" y1="415" x2="366" y2="415" marker-end="url(#arrow)"/>
    <line x1="383" y1="447" x2="334" y2="510" marker-end="url(#arrow)"/>
    <line x1="468" y1="494" x2="468" y2="512" marker-end="url(#arrow)"/>
  </g>
  <line x1="660" y1="444" x2="584" y2="534" stroke="#ef7b4d" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <text x="606" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">pull</text>
  <text x="603" y="466" text-anchor="middle" font-size="11" fill="#c2410c">(아웃바운드)</text>
</svg>
