<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CI 워크플로 흐름 — 테스트 → 빌드 → GHCR</text>

  <!-- events -->
  <text x="95" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">이벤트</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="20" y="78" width="150" height="44" rx="10" fill="#fff1eb" stroke="#ef7b4d"/><text x="95" y="105" fill="#9a3412">pull_request</text>
    <rect x="20" y="138" width="150" height="44" rx="10" fill="#fff1eb" stroke="#ef7b4d"/><text x="95" y="165" fill="#9a3412">push: main</text>
    <rect x="20" y="198" width="150" height="44" rx="10" fill="#fff1eb" stroke="#ef7b4d"/><text x="95" y="225" fill="#9a3412">push: v0.1.0</text>
  </g>

  <!-- test -->
  <rect x="215" y="100" width="150" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">test</text>
  <rect x="230" y="140" width="120" height="26" rx="13" fill="#e2e8f0"/>
  <text x="290" y="158" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">py3.12</text>
  <rect x="230" y="174" width="120" height="26" rx="13" fill="#e2e8f0"/>
  <text x="290" y="192" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">py3.13</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="170" y1="100" x2="211" y2="140" marker-end="url(#arrow)"/>
    <line x1="170" y1="160" x2="211" y2="160" marker-end="url(#arrow)"/>
    <line x1="170" y1="220" x2="211" y2="180" marker-end="url(#arrow)"/>
    <line x1="365" y1="160" x2="411" y2="160" marker-end="url(#arrow)"/>
  </g>
  <text x="388" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">needs</text>

  <!-- build -->
  <rect x="415" y="70" width="230" height="180" rx="10" fill="#ffffff" stroke="#2496ed" stroke-width="2"/>
  <text x="530" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">build</text>
  <rect x="430" y="108" width="200" height="30" rx="6" fill="#c7d2fe"/>
  <text x="530" y="128" text-anchor="middle" font-size="13" fill="#312e81">QEMU + Buildx</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="430" y="148" width="96" height="30" rx="6" fill="#bfdbfe"/><text x="478" y="168" fill="#1e3a8a">linux/amd64</text>
    <rect x="534" y="148" width="96" height="30" rx="6" fill="#bfdbfe"/><text x="582" y="168" fill="#1e3a8a">linux/arm64</text>
  </g>
  <rect x="430" y="190" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="530" y="208" text-anchor="middle" font-size="12" fill="#334155">metadata-action → 태그 계산</text>
  <text x="530" y="226" text-anchor="middle" font-size="12" fill="#334155">build-push-action → 푸시</text>

  <!-- cache -->
  <ellipse cx="530" cy="288" rx="90" ry="12" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="440" y="288" width="180" height="34" fill="#fde68a" stroke="none"/>
  <line x1="440" y1="288" x2="440" y2="322" stroke="#f59e0b"/>
  <line x1="620" y1="288" x2="620" y2="322" stroke="#f59e0b"/>
  <ellipse cx="530" cy="322" rx="90" ry="12" fill="#fde68a" stroke="#f59e0b"/>
  <ellipse cx="530" cy="288" rx="90" ry="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="530" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">GHA 캐시 (type=gha)</text>
  <line x1="505" y1="250" x2="505" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="274" x2="555" y2="254" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="266" text-anchor="end" font-size="11" fill="#334155">cache-to</text>
  <text x="562" y="266" font-size="11" fill="#334155">cache-from</text>

  <!-- GHCR -->
  <rect x="690" y="56" width="250" height="276" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="815" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">GHCR</text>
  <text x="815" y="102" text-anchor="middle" font-size="11" fill="#78350f" font-family="Consolas,'D2Coding',monospace">ghcr.io/&lt;계정&gt;/gitops-demo-app</text>
  <rect x="706" y="114" width="218" height="98" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="815" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">이미지 인덱스 (태그가 가리킴)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="718" y="144" width="96" height="26" rx="5" fill="#bfdbfe"/><text x="766" y="162" fill="#1e3a8a">amd64</text>
    <rect x="816" y="144" width="96" height="26" rx="5" fill="#bfdbfe"/><text x="864" y="162" fill="#1e3a8a">arm64</text>
    <rect x="718" y="176" width="194" height="26" rx="5" fill="#e2e8f0"/><text x="815" y="194" fill="#334155">provenance</text>
  </g>
  <text x="815" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">태그</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="706" y="244" width="106" height="28" rx="14" fill="#fde68a"/><text x="759" y="263" fill="#78350f">sha-1a2b3c4</text>
    <rect x="818" y="244" width="106" height="28" rx="14" fill="#fde68a"/><text x="871" y="263" fill="#78350f">0.1.0</text>
    <rect x="706" y="280" width="106" height="28" rx="14" fill="#fde68a"/><text x="759" y="299" fill="#78350f">0.1</text>
    <rect x="818" y="280" width="106" height="28" rx="14" fill="#fde68a"/><text x="871" y="299" fill="#78350f">latest</text>
  </g>
  <line x1="645" y1="160" x2="686" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">push</text>

  <!-- table -->
  <text x="20" y="372" font-size="15" font-weight="700" fill="#0f172a">이벤트별 동작</text>
  <rect x="20" y="384" width="920" height="36" fill="#334155"/>
  <g font-size="13" font-weight="700" fill="#ffffff">
    <text x="36" y="407">이벤트</text>
    <text x="246" y="407" text-anchor="middle">test</text>
    <text x="356" y="407" text-anchor="middle">build</text>
    <text x="466" y="407" text-anchor="middle">push</text>
    <text x="540" y="407">만들어지는 태그</text>
  </g>
  <rect x="20" y="420" width="920" height="36" fill="#f8fafc"/>
  <rect x="20" y="456" width="920" height="36" fill="#ffffff"/>
  <rect x="20" y="492" width="920" height="36" fill="#f8fafc"/>
  <rect x="20" y="384" width="920" height="144" fill="none" stroke="#94a3b8"/>
  <g font-size="13" fill="#0f172a">
    <text x="36" y="443" font-family="Consolas,'D2Coding',monospace">pull_request</text>
    <text x="246" y="443" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="356" y="443" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="466" y="443" text-anchor="middle" fill="#b91c1c" font-weight="700">안 함</text>
    <text x="540" y="443"><tspan font-family="Consolas,'D2Coding',monospace">pr-7</tspan> (빌드 검증만, 레지스트리에 올리지 않음)</text>

    <text x="36" y="479" font-family="Consolas,'D2Coding',monospace">push: main</text>
    <text x="246" y="479" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="356" y="479" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="466" y="479" text-anchor="middle" fill="#15803d" font-weight="700">푸시</text>
    <text x="540" y="479" font-family="Consolas,'D2Coding',monospace">sha-1a2b3c4</text>

    <text x="36" y="515" font-family="Consolas,'D2Coding',monospace">push: v0.1.0</text>
    <text x="246" y="515" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="356" y="515" text-anchor="middle" fill="#15803d" font-weight="700">실행</text>
    <text x="466" y="515" text-anchor="middle" fill="#15803d" font-weight="700">푸시</text>
    <text x="540" y="515" font-family="Consolas,'D2Coding',monospace">sha-1a2b3c4, 0.1.0, 0.1, latest</text>
  </g>
</svg>
