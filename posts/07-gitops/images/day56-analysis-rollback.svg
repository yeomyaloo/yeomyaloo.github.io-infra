<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AnalysisTemplate로 자동 판정 — 성공하면 진행, 실패하면 Abort</text>

  <!-- step -->
  <rect x="20" y="80" width="170" height="70" rx="10" fill="#fff1eb" stroke="#ef7b4d"/>
  <text x="105" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">setWeight 20</text>
  <text x="105" y="130" text-anchor="middle" font-size="12" fill="#334155">canary에 20% 유입</text>

  <!-- analysis run -->
  <rect x="230" y="70" width="260" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="360" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">AnalysisRun (백그라운드)</text>
  <text x="360" y="118" text-anchor="middle" font-size="12" fill="#334155">30초마다 Prometheus 질의</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">5xx / 전체 요청 (canary)</text>

  <!-- measurements -->
  <text x="530" y="78" font-size="13" font-weight="700" fill="#0f172a">측정 결과 (successCondition: result[0] &lt;= 0.05)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="530" y="92" width="72" height="48" rx="6" fill="#bbf7d0"/><text x="566" y="112" fill="#14532d">0.00</text><text x="566" y="130" fill="#14532d">성공</text>
    <rect x="610" y="92" width="72" height="48" rx="6" fill="#bbf7d0"/><text x="646" y="112" fill="#14532d">0.01</text><text x="646" y="130" fill="#14532d">성공</text>
    <rect x="690" y="92" width="72" height="48" rx="6" fill="#fecaca"/><text x="726" y="112" fill="#991b1b">0.31</text><text x="726" y="130" fill="#991b1b">실패 1</text>
    <rect x="770" y="92" width="72" height="48" rx="6" fill="#fecaca"/><text x="806" y="112" fill="#991b1b">0.29</text><text x="806" y="130" fill="#991b1b">실패 2</text>
    <rect x="850" y="92" width="80" height="48" rx="6" fill="#dc2626"/><text x="890" y="112" fill="#ffffff">0.33</text><text x="890" y="130" fill="#ffffff">실패 3</text>
  </g>
  <text x="890" y="158" text-anchor="middle" font-size="11" fill="#991b1b">failureLimit 2 초과</text>

  <!-- branches -->
  <rect x="120" y="230" width="330" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="285" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">계속 성공하면</text>
  <g font-size="13" fill="#334155">
    <text x="140" y="290">· 다음 단계(setWeight 50 …)로 진행</text>
    <text x="140" y="316">· 100% 도달 → v2가 새 stable</text>
    <text x="140" y="342">· Rollout 상태 Healthy</text>
    <text x="140" y="366">· Argo CD: Synced / Healthy</text>
  </g>

  <rect x="510" y="230" width="430" height="150" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="725" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">실패가 failureLimit를 넘으면 → Abort</text>
  <g font-size="13" fill="#334155">
    <text x="530" y="290">· HTTPRoute 가중치 즉시 stable 100%</text>
    <text x="530" y="316">· canary Pod 축소, Rollout 상태 Degraded</text>
    <text x="530" y="342">· Git은 여전히 v2 → Argo CD도 Degraded 표시</text>
    <text x="530" y="366">· 사람이 Git을 되돌리거나(revert) 고쳐서 다시 배포</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="190" y1="115" x2="226" y2="115" marker-end="url(#arrow)"/>
    <line x1="490" y1="115" x2="526" y2="115" marker-end="url(#arrow)"/>
    <path d="M300,160 L300,226" marker-end="url(#arrow)"/>
    <path d="M890,170 L890,200 L725,200 L725,226" marker-end="url(#arrow)"/>
  </g>
  <text x="310" y="200" font-size="12" font-weight="700" fill="#14532d">Successful</text>
  <text x="735" y="218" font-size="12" font-weight="700" fill="#991b1b">Failed</text>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#64748b">측정값·횟수는 예시. interval·failureLimit·임계값은 서비스 특성에 맞춰 정한다 (Day 58의 SLO와 연결)</text>
</svg>
