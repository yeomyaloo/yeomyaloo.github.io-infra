<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Chapter 7 전체 GitOps 파이프라인</text>

  <!-- Row 1: CI -->
  <rect x="30" y="66" width="120" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="90" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">개발자</text>
  <text x="90" y="124" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">git push / tag</text>

  <rect x="200" y="66" width="170" height="80" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="285" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">앱 레포</text>
  <text x="285" y="124" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">gitops-demo-app</text>

  <rect x="420" y="66" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="530" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions (CI)</text>
  <text x="530" y="124" text-anchor="middle" font-size="12" fill="#334155">pytest → buildx → push</text>
  <rect x="584" y="56" width="52" height="20" rx="10" fill="#ef7b4d"/><text x="610" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 51</text>

  <rect x="690" y="66" width="240" height="80" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="810" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">GHCR (이미지)</text>
  <text x="810" y="124" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">sha-1a2b3c4 / 0.1.0</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="106" x2="196" y2="106" marker-end="url(#arrow)"/>
    <line x1="370" y1="106" x2="416" y2="106" marker-end="url(#arrow)"/>
    <line x1="640" y1="106" x2="686" y2="106" marker-end="url(#arrow)"/>
  </g>

  <!-- Config repo -->
  <rect x="30" y="230" width="250" height="100" rx="10" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="155" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">설정 레포</text>
  <text x="155" y="284" text-anchor="middle" font-size="12" fill="#9a3412" font-family="Consolas,'D2Coding',monospace">gitops-demo-config</text>
  <text x="155" y="308" text-anchor="middle" font-size="12" fill="#334155">Kustomize base + overlays</text>
  <rect x="224" y="220" width="52" height="20" rx="10" fill="#ef7b4d"/><text x="250" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 52</text>

  <!-- Cluster -->
  <rect x="330" y="200" width="600" height="200" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="346" y="222" font-size="13" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터 (kind infra-lab)</text>

  <rect x="350" y="236" width="200" height="60" rx="8" fill="#ef7b4d"/>
  <text x="450" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Argo CD</text>
  <text x="450" y="283" text-anchor="middle" font-size="12" fill="#ffffff">동기화 · Self-heal</text>
  <rect x="494" y="226" width="52" height="20" rx="10" fill="#9a3412"/><text x="520" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 53</text>

  <rect x="690" y="236" width="220" height="60" rx="8" fill="#fff1eb" stroke="#ef7b4d"/>
  <text x="800" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Argo CD Image Updater</text>
  <text x="800" y="283" text-anchor="middle" font-size="12" fill="#9a3412">새 태그 감시 · 승격</text>
  <rect x="854" y="226" width="52" height="20" rx="10" fill="#9a3412"/><text x="880" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 54</text>

  <rect x="350" y="322" width="200" height="60" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="450" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Argo Rollouts</text>
  <text x="450" y="369" text-anchor="middle" font-size="12" fill="#312e81">Canary · Blue-Green</text>
  <rect x="494" y="312" width="52" height="20" rx="10" fill="#4f46e5"/><text x="520" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 56</text>

  <g font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <rect x="600" y="330" width="94" height="44" rx="8" fill="#86efac"/><text x="647" y="357" fill="#14532d">dev</text>
    <rect x="708" y="330" width="94" height="44" rx="8" fill="#86efac"/><text x="755" y="357" fill="#14532d">stage</text>
    <rect x="816" y="330" width="94" height="44" rx="8" fill="#86efac"/><text x="863" y="357" fill="#14532d">prod</text>
  </g>

  <!-- flow arrows -->
  <line x1="850" y1="146" x2="850" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="858" y="190" font-size="12" font-weight="700" fill="#334155">새 태그</text>
  <path d="M720,236 L720,176 L140,176 L140,226" stroke="#ef7b4d" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="430" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">태그 커밋 (write-back)</text>
  <line x1="350" y1="266" x2="284" y2="276" stroke="#ef7b4d" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <text x="312" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">pull</text>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="450" y1="296" x2="450" y2="318" marker-end="url(#arrow)"/>
    <line x1="550" y1="352" x2="596" y2="352" marker-end="url(#arrow)"/>
  </g>

  <!-- cross-cutting -->
  <rect x="30" y="420" width="440" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="250" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">시크릿 관리</text>
  <text x="250" y="474" text-anchor="middle" font-size="12" fill="#334155">SOPS(age) · External Secrets Operator</text>
  <rect x="414" y="410" width="52" height="20" rx="10" fill="#64748b"/><text x="440" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 55</text>

  <rect x="490" y="420" width="440" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="710" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">공급망 보안</text>
  <text x="710" y="474" text-anchor="middle" font-size="12" fill="#7f1d1d">Trivy 스캔 · cosign 서명 · Kyverno 정책</text>
  <rect x="874" y="410" width="52" height="20" rx="10" fill="#dc2626"/><text x="900" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Day 57</text>
</svg>
