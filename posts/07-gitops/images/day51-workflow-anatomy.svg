<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GitHub Actions 워크플로 구조</text>

  <!-- Left: YAML -->
  <rect x="20" y="56" width="380" height="426" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="80" font-size="13" font-weight="700" fill="#64748b">.github/workflows/ci.yaml</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="36" y="108">name: ci</text>
    <text x="36" y="129" fill="#c2410c" font-weight="700">on:</text>
    <text x="51" y="150" fill="#c2410c">push:</text>
    <text x="66" y="171" fill="#c2410c">branches: [main]</text>
    <text x="66" y="192" fill="#c2410c">tags: ['v*.*.*']</text>
    <text x="51" y="213" fill="#c2410c">pull_request:</text>
    <text x="36" y="234" fill="#b91c1c" font-weight="700">permissions:</text>
    <text x="51" y="255" fill="#b91c1c">contents: read</text>
    <text x="36" y="276" fill="#1d4ed8" font-weight="700">jobs:</text>
    <text x="51" y="297" fill="#1d4ed8">test:</text>
    <text x="66" y="318" fill="#1d4ed8">strategy:</text>
    <text x="81" y="339" fill="#1d4ed8">matrix:</text>
    <text x="96" y="360" fill="#1d4ed8">python-version: [...]</text>
    <text x="66" y="381" fill="#1d4ed8">steps: [...]</text>
    <text x="51" y="402" fill="#1d4ed8">build:</text>
    <text x="66" y="423" fill="#1d4ed8">needs: test</text>
    <text x="66" y="444" fill="#b91c1c">permissions: {packages: write}</text>
    <text x="66" y="465" fill="#1d4ed8">steps: [...]</text>
  </g>

  <!-- Right: events -->
  <rect x="430" y="56" width="510" height="56" rx="10" fill="#fff1eb" stroke="#ef7b4d"/>
  <text x="446" y="89" font-size="14" font-weight="700" fill="#9a3412">이벤트 (on)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="550" y="70" width="110" height="28" rx="14" fill="#ffffff" stroke="#ef7b4d"/><text x="605" y="89" fill="#9a3412">push main</text>
    <rect x="672" y="70" width="120" height="28" rx="14" fill="#ffffff" stroke="#ef7b4d"/><text x="732" y="89" fill="#9a3412">push v0.1.0</text>
    <rect x="804" y="70" width="120" height="28" rx="14" fill="#ffffff" stroke="#ef7b4d"/><text x="864" y="89" fill="#9a3412">pull_request</text>
  </g>
  <line x1="685" y1="112" x2="685" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Workflow run -->
  <rect x="430" y="140" width="510" height="342" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="446" y="164" font-size="14" font-weight="700" fill="#0f172a">Workflow 실행 (run)</text>

  <!-- test job -->
  <rect x="446" y="178" width="232" height="164" rx="10" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="462" y="200" font-size="14" font-weight="700" fill="#1e3a8a">Job: test</text>
  <text x="662" y="200" text-anchor="end" font-size="11" fill="#64748b">matrix → 2개 병렬</text>
  <rect x="458" y="212" width="208" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="470" y="234" font-size="13" font-weight="700" fill="#0f172a">러너 VM · py3.12</text>
  <text x="470" y="256" font-size="11" fill="#334155">checkout · setup-python · pytest</text>
  <rect x="458" y="276" width="208" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="470" y="298" font-size="13" font-weight="700" fill="#0f172a">러너 VM · py3.13</text>
  <text x="470" y="320" font-size="11" fill="#334155">checkout · setup-python · pytest</text>

  <!-- token -->
  <rect x="446" y="358" width="232" height="108" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="562" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">GITHUB_TOKEN</text>
  <text x="562" y="406" text-anchor="middle" font-size="12" fill="#7f1d1d">실행마다 자동 발급, 끝나면 만료</text>
  <text x="562" y="428" text-anchor="middle" font-size="12" fill="#7f1d1d">권한 = permissions 설정</text>
  <text x="562" y="450" text-anchor="middle" font-size="12" fill="#7f1d1d">미지정 권한은 none</text>

  <!-- build job -->
  <rect x="712" y="178" width="214" height="288" rx="10" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="728" y="200" font-size="14" font-weight="700" fill="#1e3a8a">Job: build</text>
  <rect x="728" y="210" width="182" height="24" rx="6" fill="#fca5a5"/>
  <text x="819" y="227" text-anchor="middle" font-size="12" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">packages: write</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="728" y="244" width="182" height="26" rx="13" fill="#e2e8f0"/><text x="819" y="262" fill="#0f172a">checkout</text>
    <rect x="728" y="278" width="182" height="26" rx="13" fill="#e2e8f0"/><text x="819" y="296" fill="#0f172a">setup-qemu</text>
    <rect x="728" y="312" width="182" height="26" rx="13" fill="#e2e8f0"/><text x="819" y="330" fill="#0f172a">setup-buildx</text>
    <rect x="728" y="346" width="182" height="26" rx="13" fill="#e2e8f0"/><text x="819" y="364" fill="#0f172a">login (ghcr.io)</text>
    <rect x="728" y="380" width="182" height="26" rx="13" fill="#e2e8f0"/><text x="819" y="398" fill="#0f172a">metadata</text>
    <rect x="728" y="414" width="182" height="26" rx="13" fill="#2496ed"/><text x="819" y="432" fill="#ffffff">build-push</text>
  </g>
  <text x="819" y="458" text-anchor="middle" font-size="11" fill="#64748b">steps는 위에서 아래로 순차 실행</text>

  <line x1="678" y1="260" x2="708" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="250" text-anchor="middle" font-size="10" fill="#334155">needs</text>
</svg>
