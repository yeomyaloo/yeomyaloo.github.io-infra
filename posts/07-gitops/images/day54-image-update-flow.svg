<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">새 이미지 → 설정 레포 태그 갱신: 두 가지 방식</text>

  <!-- Row 1 -->
  <rect x="20" y="70" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="110" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">앱 레포</text>
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">gitops-demo-app</text>

  <rect x="255" y="70" width="190" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="350" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions</text>
  <text x="350" y="120" text-anchor="middle" font-size="12" fill="#334155">빌드 · 테스트 · 푸시</text>

  <rect x="500" y="70" width="190" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="595" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">GHCR</text>
  <text x="595" y="120" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">gitops-demo-app:sha-xxxxxxx</text>

  <!-- Cluster -->
  <rect x="480" y="180" width="460" height="260" rx="12" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
  <text x="925" y="204" text-anchor="end" font-size="14" font-weight="700" fill="#1e3a8a">kind: infra-lab</text>

  <rect x="500" y="215" width="190" height="70" rx="10" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="595" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Image Updater</text>
  <text x="595" y="265" text-anchor="middle" font-size="12" fill="#334155">ImageUpdater CR</text>

  <rect x="500" y="340" width="190" height="70" rx="10" fill="#ef7b4d"/>
  <text x="595" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Argo CD</text>
  <text x="595" y="393" text-anchor="middle" font-size="12" fill="#ffffff">gitops-demo-dev</text>

  <rect x="750" y="340" width="170" height="70" rx="10" fill="#86efac"/>
  <text x="835" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">demo-dev</text>
  <text x="835" y="390" text-anchor="middle" font-size="12" fill="#14532d">dev-demo-app 롤링</text>

  <!-- Config repo -->
  <rect x="235" y="330" width="210" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">설정 레포</text>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">apps/demo-app/overlays/dev</text>
  <text x="340" y="394" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">kustomization.yaml</text>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#c2410c" font-family="Consolas,'D2Coding',monospace">newTag: sha-xxxxxxx</text>

  <!-- Common arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="105" x2="251" y2="105" marker-end="url(#arrow)"/>
    <line x1="445" y1="105" x2="496" y2="105" marker-end="url(#arrow)"/>
    <line x1="445" y1="375" x2="496" y2="375" marker-end="url(#arrow)"/>
    <line x1="690" y1="375" x2="746" y2="375" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="225" y="96">push</text>
    <text x="470" y="96">push</text>
    <text x="462" y="366">감지</text>
    <text x="718" y="366">Sync</text>
  </g>

  <!-- A: Image Updater -->
  <g stroke="#ef7b4d" stroke-width="2.5" fill="none">
    <line x1="595" y1="215" x2="595" y2="144" marker-end="url(#arrowO)"/>
    <polyline points="500,265 460,265 460,300 380,300 380,326" marker-end="url(#arrowO)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#c2410c">
    <text x="585" y="168" text-anchor="end">A① 태그 폴링(기본 2분)</text>
    <text x="492" y="318" text-anchor="start">A② git push</text>
  </g>

  <!-- B: CI -->
  <polyline points="300,140 300,326" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowB)"/>
  <g font-size="12" font-weight="700" fill="#4f46e5" text-anchor="end">
    <text x="290" y="200">B. CI가 직접 커밋/PR</text>
  </g>
  <text x="290" y="220" text-anchor="end" font-size="11" fill="#4f46e5" font-family="Consolas,'D2Coding',monospace">kustomize edit set image</text>

  <!-- Legend -->
  <g font-size="13">
    <line x1="40" y1="470" x2="80" y2="470" stroke="#ef7b4d" stroke-width="2.5"/>
    <text x="90" y="475" fill="#334155">A: Argo CD Image Updater (클러스터가 레지스트리를 보고 Git에 write-back)</text>
    <line x1="40" y1="490" x2="80" y2="490" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="90" y="495" fill="#334155">B: CI 잡이 설정 레포에 커밋 또는 PR</text>
  </g>
</svg>
