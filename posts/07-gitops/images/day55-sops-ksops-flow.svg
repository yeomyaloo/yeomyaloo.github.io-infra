<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SOPS + age + KSOPS — 암호문은 Git에, 복호화는 Argo CD에서</text>

  <!-- 1. Dev PC -->
  <rect x="20" y="70" width="190" height="190" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">① 개발자 PC</text>
  <text x="115" y="116" text-anchor="middle" font-size="12" fill="#64748b">평문으로 작성</text>
  <rect x="35" y="128" width="160" height="80" rx="6" fill="#fee2e2"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#7f1d1d">
    <text x="45" y="150">kind: Secret</text>
    <text x="45" y="170">stringData:</text>
    <text x="45" y="190">  DB_PASSWORD: S3..</text>
  </g>
  <text x="115" y="236" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">sops --encrypt</text>
  <text x="115" y="252" text-anchor="middle" font-size="11" fill="#64748b">(age 공개키 사용)</text>

  <!-- 2. Git -->
  <rect x="263" y="70" width="190" height="190" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">② Git (설정 레포)</text>
  <text x="358" y="116" text-anchor="middle" font-size="12" fill="#64748b">값만 암호문</text>
  <rect x="278" y="128" width="160" height="80" rx="6" fill="#fde68a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">
    <text x="288" y="150">DB_PASSWORD:</text>
    <text x="288" y="170">  ENC[AES256_GCM..]</text>
    <text x="288" y="190">sops: age: ...</text>
  </g>
  <text x="358" y="236" text-anchor="middle" font-size="12" fill="#334155">.sops.yaml</text>
  <text x="358" y="252" text-anchor="middle" font-size="11" fill="#64748b">secret-generator.yaml</text>

  <!-- 3. repo-server -->
  <rect x="506" y="70" width="190" height="190" rx="12" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="601" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">③ argocd-repo-server</text>
  <text x="601" y="116" text-anchor="middle" font-size="12" fill="#64748b">렌더링 중 복호화</text>
  <rect x="521" y="128" width="160" height="44" rx="6" fill="#ef7b4d"/>
  <text x="601" y="147" text-anchor="middle" font-size="12" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">kustomize build</text>
  <text x="601" y="164" text-anchor="middle" font-size="12" fill="#ffffff">+ KSOPS 플러그인</text>
  <rect x="521" y="182" width="160" height="44" rx="6" fill="#fca5a5"/>
  <text x="601" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">age 개인키</text>
  <text x="601" y="217" text-anchor="middle" font-size="11" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">Secret argocd/sops-age</text>
  <text x="601" y="248" text-anchor="middle" font-size="11" fill="#64748b">initContainer가 ksops 설치</text>

  <!-- 4. Cluster -->
  <rect x="749" y="70" width="190" height="190" rx="12" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
  <text x="844" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">④ demo-dev</text>
  <text x="844" y="116" text-anchor="middle" font-size="12" fill="#64748b">일반 Secret으로 생성</text>
  <rect x="764" y="128" width="160" height="40" rx="6" fill="#86efac"/>
  <text x="844" y="153" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">Secret dev-db-secret</text>
  <rect x="764" y="186" width="160" height="40" rx="6" fill="#bbf7d0"/>
  <text x="844" y="211" text-anchor="middle" font-size="13" fill="#14532d">Pod (envFrom)</text>
  <line x1="844" y1="168" x2="844" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows between columns -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="210" y1="165" x2="259" y2="165" marker-end="url(#arrow)"/>
    <line x1="453" y1="165" x2="502" y2="165" marker-end="url(#arrow)"/>
    <line x1="696" y1="165" x2="745" y2="165" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="236" y="156">push</text>
    <text x="479" y="156">fetch</text>
    <text x="722" y="156">apply</text>
  </g>

  <!-- Keys -->
  <rect x="20" y="290" width="433" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="40" y="318" font-size="14" font-weight="700" fill="#14532d">공개키 age1...</text>
  <text x="40" y="342" font-size="13" fill="#14532d">.sops.yaml에 적어 Git에 커밋 OK · 암호화 전용</text>

  <rect x="506" y="290" width="433" height="70" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="526" y="318" font-size="14" font-weight="700" fill="#7f1d1d">개인키 AGE-SECRET-KEY-1...</text>
  <text x="526" y="342" font-size="13" fill="#7f1d1d">내 PC keys.txt + argocd/sops-age 에만 · Git 금지</text>

  <!-- Warning -->
  <rect x="20" y="380" width="919" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="480" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">주의: 복호화된 렌더링 결과는 Argo CD의 Redis 캐시에 평문으로 남는다</text>
  <text x="480" y="428" text-anchor="middle" font-size="13" fill="#92400e">Argo CD 공식 문서는 이 "매니페스트 생성 단계" 방식보다 대상 클러스터에서 Secret을 채우는 방식을 권장</text>
</svg>
