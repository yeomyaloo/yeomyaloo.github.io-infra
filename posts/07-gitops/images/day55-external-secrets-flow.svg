<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">External Secrets Operator — Git에는 참조만, 값은 외부 저장소에</text>

  <!-- Git -->
  <rect x="20" y="70" width="200" height="230" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Git (설정 레포)</text>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#64748b">비밀 값이 없음</text>
  <rect x="35" y="130" width="170" height="150" rx="6" fill="#fde68a"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">
    <text x="45" y="152">kind: ExternalSecret</text>
    <text x="45" y="174">secretStoreRef:</text>
    <text x="55" y="194">name: fake</text>
    <text x="45" y="216">target:</text>
    <text x="55" y="236">name: db-secret-eso</text>
    <text x="45" y="258">dataFrom: extract</text>
  </g>

  <!-- Argo CD -->
  <rect x="245" y="150" width="120" height="70" rx="10" fill="#ef7b4d"/>
  <text x="305" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Argo CD</text>
  <text x="305" y="200" text-anchor="middle" font-size="12" fill="#ffffff">Sync</text>

  <!-- Cluster -->
  <rect x="390" y="60" width="360" height="370" rx="12" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
  <text x="570" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kind: infra-lab</text>

  <rect x="410" y="100" width="155" height="64" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="487" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">ExternalSecret</text>
  <text x="487" y="147" text-anchor="middle" font-size="11" fill="#334155">demo-dev · 무엇을 가져올지</text>

  <rect x="585" y="100" width="155" height="64" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="662" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">(Cluster)</text>
  <text x="662" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">SecretStore</text>
  <text x="662" y="156" text-anchor="middle" font-size="11" fill="#334155">어디에 어떻게 접속</text>

  <rect x="410" y="210" width="330" height="60" rx="8" fill="#4f46e5"/>
  <text x="575" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESO 컨트롤러</text>
  <text x="575" y="257" text-anchor="middle" font-size="12" fill="#ffffff">namespace: external-secrets</text>

  <rect x="410" y="320" width="155" height="56" rx="8" fill="#86efac"/>
  <text x="487" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Secret</text>
  <text x="487" y="364" text-anchor="middle" font-size="12" fill="#14532d" font-family="Consolas,'D2Coding',monospace">db-secret-eso</text>

  <rect x="585" y="320" width="155" height="56" rx="8" fill="#bbf7d0"/>
  <text x="662" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Pod</text>
  <text x="662" y="364" text-anchor="middle" font-size="12" fill="#14532d">envFrom / volume</text>

  <text x="575" y="410" text-anchor="middle" font-size="12" fill="#334155">앱은 Day 13과 똑같은 Secret을 사용</text>

  <!-- External store -->
  <rect x="795" y="120" width="155" height="220" rx="12" fill="#f5f3ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="872" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">외부 비밀 저장소</text>
  <g font-size="12" text-anchor="middle">
    <rect x="807" y="162" width="130" height="30" rx="6" fill="#c7d2fe"/><text x="872" y="182" fill="#1e1b4b">HashiCorp Vault</text>
    <rect x="807" y="200" width="130" height="30" rx="6" fill="#c7d2fe"/><text x="872" y="220" fill="#1e1b4b">AWS Secrets Mgr</text>
    <rect x="807" y="238" width="130" height="30" rx="6" fill="#c7d2fe"/><text x="872" y="258" fill="#1e1b4b">GCP · Azure</text>
    <rect x="807" y="276" width="130" height="30" rx="6" fill="#e2e8f0"/><text x="872" y="296" fill="#334155">Fake (학습용)</text>
  </g>
  <text x="872" y="328" text-anchor="middle" font-size="11" fill="#64748b">실제 값은 여기에만</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="185" x2="241" y2="185" marker-end="url(#arrow)"/>
    <polyline points="365,185 385,185 385,132 406,132" marker-end="url(#arrow)"/>
    <line x1="487" y1="164" x2="487" y2="206" marker-end="url(#arrow)"/>
    <line x1="662" y1="164" x2="662" y2="206" marker-end="url(#arrow)"/>
    <line x1="487" y1="270" x2="487" y2="316" marker-end="url(#arrow)"/>
    <line x1="565" y1="348" x2="581" y2="348" marker-end="url(#arrow)"/>
  </g>
  <line x1="740" y1="240" x2="791" y2="240" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowP)"/>
  <g font-size="12" font-weight="700">
    <text x="497" y="190" fill="#334155">watch</text>
    <text x="497" y="298" fill="#334155">생성 · 갱신</text>
    <text x="772" y="230" text-anchor="middle" fill="#4f46e5">읽기</text>
  </g>

  <text x="480" y="456" text-anchor="middle" font-size="14" fill="#334155">Git과 Argo CD는 값을 모른다 — 값 교체는 저장소에서, ESO가 refreshInterval마다 Secret을 동기화</text>
</svg>
