<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kustomize base와 overlays</text>

  <!-- base -->
  <rect x="300" y="56" width="360" height="136" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">base — 모든 환경 공통</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">
    <text x="320" y="108">deployment.yaml</text>
    <text x="490" y="108" fill="#64748b">image: gitops-demo-app</text>
    <text x="320" y="130">service.yaml</text>
    <text x="490" y="130" fill="#64748b">port 80 → http</text>
    <text x="320" y="152">kustomization.yaml</text>
    <text x="490" y="152" fill="#64748b">labels, generator</text>
    <text x="320" y="174" fill="#64748b">configMapGenerator: APP_ENV=base</text>
  </g>

  <!-- arrows to base -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="160" y1="252" x2="360" y2="196" marker-end="url(#arrow)"/>
    <line x1="480" y1="252" x2="480" y2="196" marker-end="url(#arrow)"/>
    <line x1="800" y1="252" x2="600" y2="196" marker-end="url(#arrow)"/>
  </g>
  <rect x="490" y="212" width="152" height="24" rx="4" fill="#ffffff"/>
  <text x="494" y="228" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">resources: ../../base</text>

  <!-- overlays -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="12">
    <rect x="20" y="252" width="280" height="162" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="160" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">overlays/dev</text>
    <text x="36" y="302" fill="#0f172a">namespace: demo-dev</text>
    <text x="36" y="321" fill="#0f172a">namePrefix: dev-</text>
    <text x="36" y="340" fill="#0f172a">newTag: sha-1a2b3c4</text>
    <text x="36" y="359" fill="#0f172a">replicas: 1</text>
    <text x="36" y="378" fill="#15803d">+ DEBUG=true (JSON 6902)</text>
    <text x="36" y="397" fill="#15803d">+ httproute.yaml</text>

    <rect x="340" y="252" width="280" height="162" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">overlays/stage</text>
    <text x="356" y="302" fill="#0f172a">namespace: demo-stage</text>
    <text x="356" y="321" fill="#0f172a">namePrefix: stage-</text>
    <text x="356" y="340" fill="#0f172a">newTag: 0.1.0</text>
    <text x="356" y="359" fill="#0f172a">replicas: 2</text>
    <text x="356" y="378" fill="#b45309">APP_ENV=stage (merge)</text>

    <rect x="660" y="252" width="280" height="162" rx="12" fill="#fff1eb" stroke="#ef7b4d" stroke-width="1.5"/>
    <text x="800" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">overlays/prod</text>
    <text x="676" y="302" fill="#0f172a">namespace: demo-prod</text>
    <text x="676" y="321" fill="#0f172a">namePrefix: prod-</text>
    <text x="676" y="340" fill="#0f172a">newTag: 0.1.0</text>
    <text x="676" y="359" fill="#0f172a">replicas: 3</text>
    <text x="676" y="378" fill="#c2410c">APP_ENV=prod (merge)</text>
    <text x="676" y="397" fill="#c2410c">+ resources ↑ (SMP)</text>
  </g>

  <!-- results -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="160" y1="414" x2="160" y2="438" marker-end="url(#arrow)"/>
    <line x1="480" y1="414" x2="480" y2="438" marker-end="url(#arrow)"/>
    <line x1="800" y1="414" x2="800" y2="438" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="442" width="280" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="160" y="463" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">dev-demo-app × 1</text>
    <text x="160" y="482" fill="#64748b">infra-lab에 배포 (오늘 실습)</text>
    <rect x="340" y="442" width="280" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="480" y="463" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">stage-demo-app × 2</text>
    <text x="480" y="482" fill="#64748b">빌드 결과만 확인 (Day 54 승격)</text>
    <rect x="660" y="442" width="280" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="800" y="463" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">prod-demo-app × 3</text>
    <text x="800" y="482" fill="#64748b">빌드 결과만 확인 (Day 54 승격)</text>
  </g>
</svg>
