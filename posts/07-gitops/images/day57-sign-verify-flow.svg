<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">스캔 → SBOM → 키리스 서명 → 입장 검증</text>

  <!-- GitHub Actions job -->
  <rect x="20" y="56" width="920" height="150" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="38" y="80" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions 워크플로 (gitops-demo-app, main push)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="38" y="96" width="150" height="62" rx="8" fill="#e2e8f0"/>
    <text x="113" y="122" font-weight="700" fill="#0f172a">① test · build</text>
    <text x="113" y="142" font-size="11" fill="#334155">GHCR 푸시 → digest</text>

    <rect x="218" y="96" width="170" height="62" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="303" y="122" font-weight="700" fill="#78350f">② Trivy 스캔</text>
    <text x="303" y="142" font-size="11" fill="#78350f">HIGH·CRITICAL → 실패</text>

    <rect x="418" y="96" width="150" height="62" rx="8" fill="#e2e8f0"/>
    <text x="493" y="122" font-weight="700" fill="#0f172a">③ SBOM 생성</text>
    <text x="493" y="142" font-size="11" fill="#334155">CycloneDX JSON</text>

    <rect x="598" y="96" width="150" height="62" rx="8" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="673" y="122" font-weight="700" fill="#9a3412">④ cosign sign</text>
    <text x="673" y="142" font-size="11" fill="#9a3412">키 없이 (keyless)</text>

    <rect x="778" y="96" width="146" height="62" rx="8" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="851" y="122" font-weight="700" fill="#9a3412">⑤ cosign attest</text>
    <text x="851" y="142" font-size="11" fill="#9a3412">SBOM을 증명으로</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="188" y1="127" x2="214" y2="127" marker-end="url(#arrow)"/>
    <line x1="388" y1="127" x2="414" y2="127" marker-end="url(#arrow)"/>
    <line x1="568" y1="127" x2="594" y2="127" marker-end="url(#arrow)"/>
    <line x1="748" y1="127" x2="774" y2="127" marker-end="url(#arrow)"/>
  </g>
  <text x="303" y="190" text-anchor="middle" font-size="12" fill="#dc2626">실패하면 여기서 멈춤 → 서명 없음</text>

  <!-- Sigstore -->
  <rect x="440" y="240" width="500" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="458" y="264" font-size="15" font-weight="700" fill="#3730a3">Sigstore 공용 인프라</text>
  <g font-size="12" text-anchor="middle">
    <rect x="458" y="278" width="140" height="66" rx="8" fill="#c7d2fe"/>
    <text x="528" y="300" font-weight="700" fill="#1e1b4b">GitHub OIDC</text>
    <text x="528" y="318" fill="#1e1b4b">id-token: write</text>
    <text x="528" y="334" fill="#1e1b4b">"이 워크플로가 실행 중"</text>
    <rect x="618" y="278" width="140" height="66" rx="8" fill="#c7d2fe"/>
    <text x="688" y="300" font-weight="700" fill="#1e1b4b">Fulcio (CA)</text>
    <text x="688" y="318" fill="#1e1b4b">수명 10분 인증서</text>
    <text x="688" y="334" fill="#1e1b4b">워크플로 신원 기록</text>
    <rect x="778" y="278" width="146" height="66" rx="8" fill="#c7d2fe"/>
    <text x="851" y="300" font-weight="700" fill="#1e1b4b">Rekor</text>
    <text x="851" y="318" fill="#1e1b4b">투명성 로그</text>
    <text x="851" y="334" fill="#1e1b4b">서명 기록 공개</text>
  </g>
  <g stroke="#4f46e5" stroke-width="2" fill="none">
    <line x1="598" y1="311" x2="614" y2="311" marker-end="url(#arrow)"/>
    <line x1="758" y1="311" x2="774" y2="311" marker-end="url(#arrow)"/>
  </g>
  <line x1="673" y1="158" x2="673" y2="236" stroke="#ef7b4d" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Registry -->
  <rect x="20" y="240" width="380" height="120" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="38" y="264" font-size="15" font-weight="700" fill="#92400e">GHCR — 이미지와 함께 저장되는 것</text>
  <g font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">
    <rect x="38" y="278" width="344" height="22" rx="4" fill="#fde68a"/>
    <text x="48" y="294">gitops-demo-app@sha256:9f2c…  (이미지)</text>
    <rect x="38" y="304" width="344" height="22" rx="4" fill="#fed7aa"/>
    <text x="48" y="320">└ 서명 (cosign 번들)</text>
    <rect x="38" y="330" width="344" height="22" rx="4" fill="#fed7aa"/>
    <text x="48" y="346">└ SBOM 증명 (CycloneDX)</text>
  </g>
  <path d="M851,158 L851,222 L210,222 L210,236" stroke="#ef7b4d" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="430" y="216" font-size="11" fill="#9a3412">서명·증명을 레지스트리에 푸시</text>

  <!-- Cluster -->
  <rect x="20" y="394" width="920" height="126" rx="12" fill="#eff6ff" stroke="#326ce5"/>
  <text x="38" y="418" font-size="15" font-weight="700" fill="#1e3a8a">클러스터 (infra-lab)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="38" y="434" width="170" height="66" rx="8" fill="#ffffff" stroke="#326ce5"/>
    <text x="123" y="460" font-weight="700" fill="#1e3a8a">Argo CD / Rollouts</text>
    <text x="123" y="482" font-size="12" fill="#334155">Pod 생성 요청</text>

    <rect x="260" y="434" width="300" height="66" rx="8" fill="#326ce5"/>
    <text x="410" y="460" font-weight="700" fill="#ffffff">Kyverno 어드미션 웹훅</text>
    <text x="410" y="482" font-size="12" fill="#ffffff">서명 신원 확인 · latest 태그 검사</text>

    <rect x="610" y="434" width="140" height="66" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="680" y="460" font-weight="700" fill="#14532d">허용</text>
    <text x="680" y="482" font-size="12" fill="#14532d">Pod 생성</text>

    <rect x="780" y="434" width="144" height="66" rx="8" fill="#fecaca" stroke="#dc2626"/>
    <text x="852" y="460" font-weight="700" fill="#991b1b">거부</text>
    <text x="852" y="482" font-size="12" fill="#991b1b">admission denied</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="208" y1="467" x2="256" y2="467" marker-end="url(#arrow)"/>
    <line x1="560" y1="458" x2="606" y2="458" marker-end="url(#arrow)"/>
    <path d="M560,480 L580,480 L580,512 L852,512 L852,504" marker-end="url(#arrow)"/>
    <path d="M300,434 L300,372" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  </g>
  <text x="310" y="388" font-size="11" fill="#334155">서명·인증서 조회</text>
</svg>
