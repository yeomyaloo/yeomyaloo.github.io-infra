<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">환경 승격 흐름 — dev → stage → prod</text>

  <!-- New image -->
  <rect x="30" y="58" width="200" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">새 이미지 :sha-8b2d4e6</text>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#334155">Image Updater 또는 CI</text>

  <!-- Git lane -->
  <rect x="15" y="120" width="930" height="140" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="930" y="142" text-anchor="end" font-size="13" font-weight="700" fill="#92400e">Git: gitops-demo-config/apps/demo-app (main)</text>

  <g font-family="Consolas,'D2Coding',monospace" text-anchor="middle">
    <rect x="30" y="152" width="200" height="90" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="130" y="178" font-size="14" font-weight="700" fill="#0f172a">overlays/dev</text>
    <text x="130" y="206" font-size="13" fill="#c2410c">newTag: sha-8b2d4e6</text>
    <rect x="380" y="152" width="200" height="90" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="480" y="178" font-size="14" font-weight="700" fill="#0f172a">overlays/stage</text>
    <text x="480" y="206" font-size="13" fill="#c2410c">newTag: sha-8b2d4e6</text>
    <rect x="730" y="152" width="200" height="90" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="830" y="178" font-size="14" font-weight="700" fill="#0f172a">overlays/prod</text>
    <text x="830" y="206" font-size="13" fill="#c2410c">newTag: sha-8b2d4e6</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#64748b">
    <text x="130" y="230">봇이 직접 push</text>
    <text x="480" y="230">PR 머지로만 변경</text>
    <text x="830" y="230">PR 머지로만 변경</text>
  </g>

  <!-- PR chips -->
  <rect x="245" y="160" width="120" height="74" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="305" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">승격 PR</text>
  <text x="305" y="201" text-anchor="middle" font-size="11" fill="#1e1b4b">태그 한 줄 diff</text>
  <text x="305" y="221" text-anchor="middle" font-size="11" fill="#1e1b4b">리뷰 1명 승인</text>

  <rect x="595" y="160" width="120" height="74" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="655" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">승격 PR</text>
  <text x="655" y="201" text-anchor="middle" font-size="11" fill="#1e1b4b">태그 한 줄 diff</text>
  <text x="655" y="221" text-anchor="middle" font-size="11" fill="#1e1b4b">CODEOWNERS 승인</text>

  <g stroke="#4f46e5" stroke-width="2" fill="none">
    <line x1="230" y1="197" x2="243" y2="197"/>
    <line x1="365" y1="197" x2="376" y2="197" marker-end="url(#arrow)"/>
    <line x1="580" y1="197" x2="593" y2="197"/>
    <line x1="715" y1="197" x2="726" y2="197" marker-end="url(#arrow)"/>
  </g>
  <line x1="130" y1="102" x2="130" y2="148" stroke="#ef7b4d" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <text x="142" y="130" font-size="12" font-weight="700" fill="#c2410c">자동</text>

  <!-- Cluster lane -->
  <rect x="15" y="300" width="930" height="120" rx="12" fill="#eef2ff" stroke="#326ce5" stroke-width="2"/>
  <text x="250" y="322" text-anchor="start" font-size="13" font-weight="700" fill="#1e3a8a">Argo CD (kind: infra-lab)</text>

  <g text-anchor="middle">
    <rect x="30" y="330" width="200" height="76" rx="8" fill="#ef7b4d"/>
    <text x="130" y="356" font-size="14" font-weight="700" fill="#ffffff">gitops-demo-dev</text>
    <text x="130" y="376" font-size="12" fill="#ffffff">automated + selfHeal</text>
    <text x="130" y="395" font-size="12" fill="#ffffff">→ demo-dev</text>
    <rect x="380" y="330" width="200" height="76" rx="8" fill="#ef7b4d"/>
    <text x="480" y="356" font-size="14" font-weight="700" fill="#ffffff">gitops-demo-stage</text>
    <text x="480" y="376" font-size="12" fill="#ffffff">automated</text>
    <text x="480" y="395" font-size="12" fill="#ffffff">→ demo-stage</text>
    <rect x="730" y="330" width="200" height="76" rx="8" fill="#ffffff" stroke="#ef7b4d" stroke-width="2"/>
    <text x="830" y="356" font-size="14" font-weight="700" fill="#9a3412">gitops-demo-prod</text>
    <text x="830" y="376" font-size="12" fill="#9a3412">automated 또는 수동 Sync</text>
    <text x="830" y="395" font-size="12" fill="#9a3412">→ demo-prod</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="130" y1="242" x2="130" y2="326" marker-end="url(#arrow)"/>
    <line x1="480" y1="242" x2="480" y2="326" marker-end="url(#arrow)"/>
    <line x1="830" y1="242" x2="830" y2="326" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="140" y="285">감지 → Sync</text>
    <text x="490" y="285">머지 후 Sync</text>
    <text x="840" y="285">머지 후 Sync</text>
  </g>

  <text x="480" y="450" text-anchor="middle" font-size="14" fill="#334155">승격 = 같은 태그(같은 이미지)를 다음 overlay로 복사하는 PR — 다시 빌드하지 않는다</text>
</svg>
