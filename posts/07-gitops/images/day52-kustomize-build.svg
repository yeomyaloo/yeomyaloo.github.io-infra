<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kustomize build — 읽고, 생성하고, 변환하고, 출력한다</text>

  <!-- input -->
  <rect x="20" y="64" width="180" height="270" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="110" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">① 입력</text>
  <rect x="34" y="106" width="152" height="96" rx="8" fill="#eff6ff" stroke="#326ce5"/>
  <text x="110" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">base</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="110" y="150">deployment.yaml</text>
    <text x="110" y="170">service.yaml</text>
    <text x="110" y="190" fill="#64748b">kustomization</text>
  </g>
  <rect x="34" y="216" width="152" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="110" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">overlays/dev</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="110" y="260">kustomization</text>
    <text x="110" y="280">httproute.yaml</text>
    <text x="110" y="304" fill="#64748b">(변경 선언)</text>
  </g>

  <!-- generators -->
  <rect x="230" y="64" width="180" height="270" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="320" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">② 생성</text>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#92400e">generators</text>
  <rect x="244" y="128" width="152" height="34" rx="6" fill="#fde68a"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">configMapGenerator</text>
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="#334155">base 값 + dev 값 merge</text>
  <line x1="320" y1="196" x2="320" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="244" y="226" width="152" height="54" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="320" y="248" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">demo-app-config</text>
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="#b45309" font-family="Consolas,'D2Coding',monospace">-9t4fbm6c2h</text>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#92400e">내용 해시 접미사</text>

  <!-- transformers -->
  <rect x="440" y="64" width="220" height="270" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="550" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">③ 변환</text>
  <text x="550" y="112" text-anchor="middle" font-size="12" fill="#4338ca">transformers</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="456" y="124" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="142" fill="#312e81">patches (SMP / 6902)</text>
    <rect x="456" y="156" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="174" fill="#312e81">namespace</text>
    <rect x="456" y="188" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="206" fill="#312e81">namePrefix</text>
    <rect x="456" y="220" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="238" fill="#312e81">labels</text>
    <rect x="456" y="252" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="270" fill="#312e81">images</text>
    <rect x="456" y="284" width="188" height="26" rx="13" fill="#c7d2fe"/><text x="550" y="302" fill="#312e81">replicas</text>
  </g>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#4338ca">이름이 바뀌면 참조도 함께 갱신</text>

  <!-- output -->
  <rect x="690" y="64" width="250" height="270" rx="12" fill="#0f172a"/>
  <text x="815" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">④ 출력 (최종 YAML)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#e2e8f0">
    <text x="704" y="120">kind: Deployment</text>
    <text x="704" y="138">metadata:</text>
    <text x="716" y="156" fill="#86efac">name: dev-demo-app</text>
    <text x="716" y="174" fill="#86efac">namespace: demo-dev</text>
    <text x="716" y="192" fill="#86efac">labels: {environment: dev}</text>
    <text x="704" y="210">spec:</text>
    <text x="716" y="228" fill="#86efac">replicas: 1</text>
    <text x="716" y="246">containers:</text>
    <text x="728" y="264" fill="#fde68a">image: ghcr.io/…:sha-1a2b3c4</text>
    <text x="728" y="282">envFrom:</text>
    <text x="740" y="300" fill="#fde68a">dev-demo-app-config-9t4f…</text>
    <text x="728" y="318" fill="#86efac">env: DEBUG=true</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="200" x2="226" y2="200" marker-end="url(#arrow)"/>
    <line x1="410" y1="200" x2="436" y2="200" marker-end="url(#arrow)"/>
    <line x1="660" y1="200" x2="686" y2="200" marker-end="url(#arrow)"/>
  </g>

  <!-- consumers -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="760" y1="334" x2="170" y2="370" marker-end="url(#arrow)"/>
    <line x1="815" y1="334" x2="480" y2="370" marker-end="url(#arrow)"/>
    <line x1="870" y1="334" x2="800" y2="370" marker-end="url(#arrow)"/>
  </g>
  <rect x="20" y="374" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="170" y="400" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">kustomize build / kubectl kustomize</text>
  <text x="170" y="421" text-anchor="middle" font-size="12" fill="#64748b">표준 출력으로 렌더링만</text>
  <rect x="330" y="374" width="300" height="60" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <text x="480" y="400" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">kubectl apply -k / diff -k</text>
  <text x="480" y="421" text-anchor="middle" font-size="12" fill="#64748b">렌더링 + 클러스터 적용 (오늘)</text>
  <rect x="640" y="374" width="300" height="60" rx="10" fill="#fff1eb" stroke="#ef7b4d"/>
  <text x="790" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Argo CD (Day 53)</text>
  <text x="790" y="421" text-anchor="middle" font-size="12" fill="#9a3412">내장 Kustomize로 같은 빌드 후 동기화</text>
</svg>
