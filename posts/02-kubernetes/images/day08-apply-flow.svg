<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kubectl apply 이후 일어나는 일</text>

  <!-- kubectl -->
  <rect x="30" y="205" width="150" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="236" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#0f172a">kubectl apply</text>

  <!-- apiserver -->
  <rect x="380" y="200" width="200" height="60" rx="10" fill="#326ce5"/>
  <text x="480" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">kube-apiserver</text>

  <!-- etcd -->
  <rect x="410" y="320" width="140" height="50" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="480" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">etcd</text>

  <!-- controllers -->
  <rect x="170" y="70" width="210" height="56" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="275" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Deployment 컨트롤러</text>
  <text x="275" y="114" text-anchor="middle" font-size="12" fill="#3730a3">ReplicaSet 생성</text>

  <rect x="420" y="70" width="210" height="56" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="525" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">ReplicaSet 컨트롤러</text>
  <text x="525" y="114" text-anchor="middle" font-size="12" fill="#3730a3">Pod 3개 생성 (nodeName 없음)</text>

  <!-- scheduler -->
  <rect x="740" y="110" width="190" height="56" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="835" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">kube-scheduler</text>
  <text x="835" y="154" text-anchor="middle" font-size="12" fill="#3730a3">노드 선택 (Binding)</text>

  <!-- kubelet -->
  <rect x="740" y="250" width="190" height="56" rx="10" fill="#dbeafe" stroke="#326ce5"/>
  <text x="835" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kubelet (선택된 노드)</text>
  <text x="835" y="294" text-anchor="middle" font-size="12" fill="#1e40af">내 노드의 새 Pod 감지</text>

  <!-- containerd -->
  <rect x="740" y="370" width="190" height="56" rx="10" fill="#86efac" stroke="#16a34a"/>
  <text x="835" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">containerd → runc</text>
  <text x="835" y="414" text-anchor="middle" font-size="12" fill="#166534">이미지 pull · 컨테이너 실행</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="180" y1="230" x2="377" y2="230" marker-end="url(#arrow)"/>
    <line x1="480" y1="262" x2="480" y2="317" marker-end="url(#arrow)"/>
    <line x1="300" y1="128" x2="418" y2="197" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="530" y1="128" x2="538" y2="197" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="582" y1="214" x2="737" y2="152" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="582" y1="228" x2="737" y2="262" marker-end="url(#arrow)"/>
    <line x1="835" y1="306" x2="835" y2="367" marker-end="url(#arrow)"/>
    <line x1="737" y1="296" x2="582" y2="250" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  </g>

  <!-- step numbers -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="279" cy="230" r="12" fill="#0f172a"/><text x="279" y="234" fill="#ffffff">1</text>
    <circle cx="480" cy="290" r="12" fill="#0f172a"/><text x="480" y="294" fill="#ffffff">2</text>
    <circle cx="359" cy="162" r="12" fill="#0f172a"/><text x="359" y="166" fill="#ffffff">3</text>
    <circle cx="534" cy="162" r="12" fill="#0f172a"/><text x="534" y="166" fill="#ffffff">4</text>
    <circle cx="660" cy="183" r="12" fill="#0f172a"/><text x="660" y="187" fill="#ffffff">5</text>
    <circle cx="660" cy="245" r="12" fill="#0f172a"/><text x="660" y="249" fill="#ffffff">6</text>
    <circle cx="835" cy="337" r="12" fill="#0f172a"/><text x="835" y="341" fill="#ffffff">7</text>
    <circle cx="660" cy="273" r="12" fill="#16a34a"/><text x="660" y="277" fill="#ffffff">8</text>
  </g>
  <g font-size="12" fill="#334155">
    <text x="279" y="210" text-anchor="middle">요청 (HTTPS)</text>
    <text x="500" y="294">저장</text>
    <text x="855" y="341">CRI</text>
    <text x="640" y="310" text-anchor="middle" fill="#15803d">상태 보고 (Running)</text>
  </g>

  <!-- note -->
  <rect x="30" y="370" width="340" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <g font-size="12" fill="#78350f">
    <text x="48" y="398" font-weight="700">kubectl은 ②에서 끝 ("created" 응답)</text>
    <text x="48" y="420">③~⑧은 각 구성 요소가 apiserver를 watch하다가</text>
    <text x="48" y="438">자기 할 일을 발견해 비동기로 진행</text>
  </g>
</svg>
