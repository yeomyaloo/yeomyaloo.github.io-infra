<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Service → EndpointSlice → Pod 연결 구조</text>

  <!-- Service -->
  <rect x="30" y="80" width="260" height="140" rx="12" fill="#326ce5"/>
  <text x="160" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Service: web</text>
  <text x="160" y="142" text-anchor="middle" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#dbeafe">ClusterIP 10.96.142.31</text>
  <rect x="55" y="160" width="210" height="40" rx="6" fill="#ffffff"/>
  <text x="160" y="186" text-anchor="middle" font-size="15" font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">selector: app=web</text>

  <!-- EndpointSlice -->
  <rect x="340" y="80" width="270" height="140" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="475" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">EndpointSlice</text>
  <g font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#312e81" text-anchor="middle">
    <text x="475" y="140">10.244.1.5:8080</text>
    <text x="475" y="166">10.244.2.7:8080</text>
    <text x="475" y="192">10.244.1.6:8080</text>
  </g>
  <text x="475" y="212" text-anchor="middle" font-size="11" fill="#64748b">EndpointSlice 컨트롤러가 자동 갱신</text>

  <!-- Pods -->
  <g font-size="14">
    <rect x="680" y="70" width="250" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="695" y="92" font-weight="700" fill="#14532d">web-…2xk8p  10.244.1.5</text>
    <text x="695" y="112" font-size="12" fill="#14532d">app=web · Ready</text>

    <rect x="680" y="132" width="250" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="695" y="154" font-weight="700" fill="#14532d">web-…9qv7m  10.244.2.7</text>
    <text x="695" y="174" font-size="12" fill="#14532d">app=web · Ready</text>

    <rect x="680" y="194" width="250" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="695" y="216" font-weight="700" fill="#14532d">web-…h5r2z  10.244.1.6</text>
    <text x="695" y="236" font-size="12" fill="#14532d">app=web · Ready</text>

    <rect x="680" y="256" width="250" height="50" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="695" y="278" font-weight="700" fill="#78350f">web-…k7d2c  10.244.2.9</text>
    <text x="695" y="298" font-size="12" fill="#92400e">app=web · Not Ready → 제외</text>

    <rect x="680" y="318" width="250" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="695" y="340" font-weight="700" fill="#334155">db-…x8f1q  10.244.1.8</text>
    <text x="695" y="360" font-size="12" fill="#64748b">app=db · 라벨 불일치 → 제외</text>
  </g>

  <!-- kube-proxy -->
  <rect x="30" y="300" width="580" height="130" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="320" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">각 노드의 kube-proxy</text>
  <text x="320" y="356" text-anchor="middle" font-size="13" fill="#334155">EndpointSlice를 watch → 커널 규칙(iptables / IPVS / nftables) 생성</text>
  <rect x="55" y="372" width="530" height="40" rx="6" fill="#e2e8f0"/>
  <text x="320" y="398" text-anchor="middle" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">10.96.142.31:80 → DNAT → 10.244.x.x:8080</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="290" y1="150" x2="337" y2="150" marker-end="url(#arrow)"/>
    <line x1="680" y1="95" x2="613" y2="135" marker-end="url(#arrow)"/>
    <line x1="680" y1="157" x2="613" y2="161" marker-end="url(#arrow)"/>
    <line x1="680" y1="219" x2="613" y2="187" marker-end="url(#arrow)"/>
    <line x1="475" y1="220" x2="475" y2="297" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="314" y="140" text-anchor="middle" font-weight="700">이름</text>
    <text x="645" y="76" text-anchor="middle" font-weight="700">Ready만</text>
    <text x="487" y="265" font-weight="700">watch</text>
  </g>
</svg>
