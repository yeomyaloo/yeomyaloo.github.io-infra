<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kubeadm init 이 하는 일 (주요 phase)</text>

  <!-- Row 1 -->
  <!-- 1 preflight -->
  <rect x="30" y="64" width="200" height="130" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <rect x="30" y="64" width="200" height="34" rx="10" fill="#f59e0b"/>
  <text x="130" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">1. preflight</text>
  <text x="130" y="122" text-anchor="middle" font-size="13" fill="#0f172a">사전 점검</text>
  <text x="130" y="144" text-anchor="middle" font-size="12" fill="#334155">CPU · 메모리 · swap</text>
  <text x="130" y="163" text-anchor="middle" font-size="12" fill="#334155">ip_forward · 포트 6443</text>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#334155">이미지 pull</text>

  <!-- 2 certs -->
  <rect x="260" y="64" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="260" y="64" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="360" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">2. certs</text>
  <text x="360" y="122" text-anchor="middle" font-size="13" fill="#0f172a">클러스터 CA와</text>
  <text x="360" y="142" text-anchor="middle" font-size="13" fill="#0f172a">컴포넌트 인증서 생성</text>
  <text x="360" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">/etc/kubernetes/pki</text>

  <!-- 3 kubeconfig -->
  <rect x="490" y="64" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="490" y="64" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="590" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">3. kubeconfig</text>
  <text x="590" y="122" text-anchor="middle" font-size="13" fill="#0f172a">admin · kubelet ·</text>
  <text x="590" y="142" text-anchor="middle" font-size="13" fill="#0f172a">scheduler 등 접속 파일</text>
  <text x="590" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">/etc/kubernetes/*.conf</text>

  <!-- 4 etcd + control-plane -->
  <rect x="720" y="64" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="720" y="64" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="820" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">4. etcd / control-plane</text>
  <text x="820" y="122" text-anchor="middle" font-size="13" fill="#0f172a">static Pod 매니페스트</text>
  <text x="820" y="142" text-anchor="middle" font-size="13" fill="#0f172a">4개 작성</text>
  <text x="820" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">/etc/kubernetes/manifests</text>

  <!-- Row 2 (right to left) -->
  <!-- 5 kubelet-start -->
  <rect x="720" y="254" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="720" y="254" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="820" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">5. kubelet-start</text>
  <text x="820" y="312" text-anchor="middle" font-size="13" fill="#0f172a">kubelet 설정 후 시작</text>
  <text x="820" y="332" text-anchor="middle" font-size="13" fill="#0f172a">→ 컨트롤 플레인 기동</text>
  <text x="820" y="366" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">/var/lib/kubelet/config.yaml</text>

  <!-- 6 mark-control-plane -->
  <rect x="490" y="254" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="490" y="254" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="590" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">6. mark-control-plane</text>
  <text x="590" y="312" text-anchor="middle" font-size="13" fill="#0f172a">노드에 라벨 + taint</text>
  <text x="590" y="332" text-anchor="middle" font-size="13" fill="#0f172a">일반 Pod 배치 금지</text>
  <text x="590" y="366" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">NoSchedule</text>

  <!-- 7 bootstrap-token -->
  <rect x="260" y="254" width="200" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <rect x="260" y="254" width="200" height="34" rx="10" fill="#326ce5"/>
  <text x="360" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">7. bootstrap-token</text>
  <text x="360" y="312" text-anchor="middle" font-size="13" fill="#0f172a">워커 join용 토큰 생성</text>
  <text x="360" y="332" text-anchor="middle" font-size="13" fill="#0f172a">+ RBAC 설정</text>
  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">TTL 24h</text>

  <!-- 8 addon -->
  <rect x="30" y="254" width="200" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="30" y="254" width="200" height="34" rx="10" fill="#16a34a"/>
  <text x="130" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">8. addon</text>
  <text x="130" y="312" text-anchor="middle" font-size="13" fill="#0f172a">CoreDNS ·</text>
  <text x="130" y="332" text-anchor="middle" font-size="13" fill="#0f172a">kube-proxy 배포</text>
  <text x="130" y="366" text-anchor="middle" font-size="11" fill="#14532d">(CNI는 포함 안 됨!)</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="230" y1="129" x2="257" y2="129" marker-end="url(#arrow)"/>
    <line x1="460" y1="129" x2="487" y2="129" marker-end="url(#arrow)"/>
    <line x1="690" y1="129" x2="717" y2="129" marker-end="url(#arrow)"/>
    <line x1="820" y1="194" x2="820" y2="251" marker-end="url(#arrow)"/>
    <line x1="720" y1="319" x2="693" y2="319" marker-end="url(#arrow)"/>
    <line x1="490" y1="319" x2="463" y2="319" marker-end="url(#arrow)"/>
    <line x1="260" y1="319" x2="233" y2="319" marker-end="url(#arrow)"/>
    <line x1="130" y1="384" x2="130" y2="413" marker-end="url(#arrow)"/>
  </g>

  <!-- Result -->
  <rect x="30" y="416" width="890" height="48" rx="8" fill="#0f172a"/>
  <text x="50" y="437" font-size="13" fill="#86efac" font-family="Consolas,'D2Coding',monospace">Your Kubernetes control-plane has initialized successfully!</text>
  <text x="50" y="455" font-size="12" fill="#e2e8f0" font-family="Consolas,'D2Coding',monospace">kubeadm join 192.168.56.10:6443 --token ... --discovery-token-ca-cert-hash sha256:...</text>
</svg>
