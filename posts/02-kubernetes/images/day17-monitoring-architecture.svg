<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kube-prometheus-stack 모니터링 아키텍처</text>

  <!-- Targets -->
  <text x="160" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Scrape 대상 (/metrics)</text>
  <g font-size="12" fill="#14532d">
    <rect x="20" y="84" width="280" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="36" y="112" font-size="15" font-weight="700">node-exporter</text>
    <text x="36" y="136">노드 CPU·메모리·디스크 (DaemonSet)</text>
    <rect x="20" y="170" width="280" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="36" y="198" font-size="15" font-weight="700">kube-state-metrics</text>
    <text x="36" y="222">Deployment·Pod 등 오브젝트 상태</text>
    <rect x="20" y="256" width="280" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="36" y="284" font-size="15" font-weight="700">kubelet / cAdvisor</text>
    <text x="36" y="308">컨테이너별 CPU·메모리 사용량</text>
    <rect x="20" y="342" width="280" height="70" rx="10" fill="#fefce8" stroke="#f59e0b"/>
    <text x="36" y="370" font-size="15" font-weight="700" fill="#78350f">내 앱 (podinfo)</text>
    <text x="36" y="394" fill="#78350f">앱이 직접 /metrics 노출</text>
  </g>
  <text x="20" y="440" font-size="13" fill="#64748b">Prometheus가 주기적으로 각 대상의 /metrics를</text>
  <text x="20" y="460" font-size="13" fill="#64748b">HTTP로 당겨온다 (Pull). 대상 목록은 자동 발견.</text>

  <!-- Operator -->
  <rect x="380" y="60" width="230" height="78" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="495" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Prometheus Operator</text>
  <text x="495" y="110" text-anchor="middle" font-size="12" fill="#3730a3">ServiceMonitor·PrometheusRule</text>
  <text x="495" y="127" text-anchor="middle" font-size="12" fill="#3730a3">CRD를 감시해 설정 반영</text>

  <!-- Prometheus -->
  <rect x="380" y="180" width="230" height="200" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="495" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">Prometheus Server</text>
  <rect x="400" y="226" width="190" height="40" rx="6" fill="#fca5a5"/>
  <text x="495" y="251" text-anchor="middle" font-size="13" fill="#7f1d1d">Service Discovery</text>
  <rect x="400" y="274" width="190" height="40" rx="6" fill="#fca5a5"/>
  <text x="495" y="299" text-anchor="middle" font-size="13" fill="#7f1d1d">TSDB (시계열 저장)</text>
  <rect x="400" y="322" width="190" height="40" rx="6" fill="#fca5a5"/>
  <text x="495" y="347" text-anchor="middle" font-size="13" fill="#7f1d1d">알림 규칙 평가</text>

  <!-- Grafana -->
  <rect x="690" y="70" width="250" height="110" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="815" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Grafana</text>
  <text x="815" y="128" text-anchor="middle" font-size="13" fill="#78350f">대시보드 시각화</text>
  <text x="815" y="152" text-anchor="middle" font-size="12" fill="#92400e">기본 대시보드 수십 개 포함</text>

  <!-- Alertmanager -->
  <rect x="690" y="250" width="250" height="100" rx="12" fill="#eff6ff" stroke="#326ce5"/>
  <text x="815" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Alertmanager</text>
  <text x="815" y="306" text-anchor="middle" font-size="12" fill="#1e3a8a">그룹핑 · 중복 제거 · 침묵(silence)</text>
  <text x="815" y="326" text-anchor="middle" font-size="12" fill="#1e3a8a">· 라우팅</text>

  <rect x="690" y="400" width="250" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="815" y="436" text-anchor="middle" font-size="14" fill="#334155">Slack · Email · PagerDuty ...</text>

  <!-- Arrows: scrape -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="380" y1="246" x2="304" y2="119" marker-end="url(#arrow)"/>
    <line x1="380" y1="256" x2="304" y2="205" marker-end="url(#arrow)"/>
    <line x1="380" y1="290" x2="304" y2="291" marker-end="url(#arrow)"/>
    <line x1="380" y1="320" x2="304" y2="377" marker-end="url(#arrow)"/>
    <line x1="495" y1="138" x2="495" y2="176" marker-end="url(#arrow)"/>
    <line x1="686" y1="140" x2="614" y2="210" marker-end="url(#arrow)"/>
    <line x1="815" y1="350" x2="815" y2="396" marker-end="url(#arrow)"/>
  </g>
  <line x1="610" y1="340" x2="686" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <g font-size="12" font-weight="700">
    <text x="340" y="100" text-anchor="middle" fill="#334155">scrape</text>
    <text x="503" y="162" fill="#334155">설정</text>
    <text x="664" y="196" fill="#334155">PromQL</text>
    <text x="646" y="352" fill="#dc2626">alert</text>
  </g>
</svg>
