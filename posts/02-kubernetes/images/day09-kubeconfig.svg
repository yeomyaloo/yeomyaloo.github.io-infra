<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kubeconfig — kubectl이 클러스터를 찾아가는 지도</text>

  <!-- file panel -->
  <rect x="20" y="58" width="430" height="362" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="80" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#64748b">~/.kube/config</text>

  <rect x="32" y="122" width="406" height="86" rx="4" fill="#dbeafe"/>
  <rect x="32" y="208" width="406" height="86" rx="4" fill="#dcfce7"/>
  <rect x="32" y="294" width="406" height="86" rx="4" fill="#e0e7ff"/>
  <rect x="32" y="383" width="406" height="22" rx="4" fill="#fde68a"/>

  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="44" y="100">apiVersion: v1</text>
    <text x="44" y="117">kind: Config</text>
    <text x="44" y="138" font-weight="700" fill="#1e3a8a">clusters:</text>
    <text x="44" y="155">- name: kind-infra-lab</text>
    <text x="44" y="172">  cluster:</text>
    <text x="44" y="189">    server: https://127.0.0.1:41235</text>
    <text x="44" y="204">    certificate-authority-data: …</text>
    <text x="44" y="224" font-weight="700" fill="#166534">users:</text>
    <text x="44" y="241">- name: kind-infra-lab</text>
    <text x="44" y="258">  user:</text>
    <text x="44" y="275">    client-certificate-data: …</text>
    <text x="44" y="290">    client-key-data: …</text>
    <text x="44" y="310" font-weight="700" fill="#3730a3">contexts:</text>
    <text x="44" y="327">- name: kind-infra-lab</text>
    <text x="44" y="344">  context:</text>
    <text x="44" y="361">    cluster: kind-infra-lab</text>
    <text x="44" y="376">    user: kind-infra-lab</text>
    <text x="44" y="399" font-weight="700" fill="#78350f">current-context: kind-infra-lab</text>
  </g>

  <!-- right: concept -->
  <rect x="600" y="62" width="260" height="44" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="730" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">current-context (지금 사용 중)</text>

  <rect x="600" y="140" width="260" height="56" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="730" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">context</text>
  <text x="730" y="184" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#3730a3">kind-infra-lab</text>

  <rect x="500" y="250" width="130" height="90" rx="10" fill="#dbeafe" stroke="#326ce5"/>
  <text x="565" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">cluster</text>
  <text x="565" y="298" text-anchor="middle" font-size="12" fill="#1e40af">어디로?</text>
  <text x="565" y="318" text-anchor="middle" font-size="11" fill="#1e40af">apiserver 주소 + CA</text>

  <rect x="645" y="250" width="130" height="90" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="710" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">user</text>
  <text x="710" y="298" text-anchor="middle" font-size="12" fill="#166534">누구로?</text>
  <text x="710" y="318" text-anchor="middle" font-size="11" fill="#166534">인증서 / 토큰</text>

  <rect x="790" y="250" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="855" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">namespace</text>
  <text x="855" y="298" text-anchor="middle" font-size="12" fill="#334155">어느 공간에서?</text>
  <text x="855" y="318" text-anchor="middle" font-size="11" fill="#334155">생략 시 default</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="730" y1="106" x2="730" y2="137" marker-end="url(#arrow)"/>
    <line x1="680" y1="196" x2="580" y2="247" marker-end="url(#arrow)"/>
    <line x1="715" y1="196" x2="712" y2="247" marker-end="url(#arrow)"/>
    <line x1="780" y1="196" x2="845" y2="247" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>

  <text x="710" y="378" text-anchor="middle" font-size="13" fill="#334155">context = cluster + user + (namespace)</text>
  <text x="710" y="402" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">kubectl config use-context &lt;이름&gt;</text>
</svg>
