<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kind 클러스터 구조 — 노드 = Docker 컨테이너</text>

  <!-- Host PC -->
  <rect x="20" y="60" width="920" height="420" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="84" font-size="14" font-weight="700" fill="#334155">내 PC (Windows / macOS / Linux)</text>

  <!-- kubectl -->
  <rect x="45" y="110" width="150" height="60" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="120" y="146" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="16" font-weight="700" fill="#0f172a">kubectl</text>
  <text x="120" y="190" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">~/.kube/config</text>
  <text x="120" y="208" text-anchor="middle" font-size="11" fill="#64748b">https://127.0.0.1:랜덤포트</text>

  <!-- note -->
  <rect x="35" y="300" width="170" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <g font-size="12" fill="#78350f" text-anchor="middle">
    <text x="120" y="326" font-weight="700">노드 IP 172.18.0.x</text>
    <text x="120" y="348">Docker 네트워크</text>
    <text x="120" y="366">내부 주소</text>
    <text x="120" y="390">(Day 12에서 활용)</text>
  </g>

  <!-- Docker Engine -->
  <rect x="230" y="95" width="690" height="370" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="575" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Docker Engine — 네트워크 "kind" (172.18.0.0/16)</text>

  <!-- control-plane node -->
  <rect x="250" y="138" width="205" height="310" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="352" y="160" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#1e3a8a">infra-lab-control-plane</text>
  <text x="352" y="177" text-anchor="middle" font-size="11" fill="#64748b">Docker 컨테이너 = 노드</text>
  <rect x="260" y="188" width="185" height="30" rx="6" fill="#dbeafe"/>
  <text x="352" y="208" text-anchor="middle" font-size="12" fill="#1e3a8a">kubelet (systemd 서비스)</text>
  <rect x="260" y="226" width="185" height="30" rx="6" fill="#e2e8f0"/>
  <text x="352" y="246" text-anchor="middle" font-size="12" fill="#0f172a">containerd</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle" fill="#312e81">
    <rect x="260" y="272" width="185" height="28" rx="6" fill="#c7d2fe"/><text x="352" y="291">kube-apiserver :6443</text>
    <rect x="260" y="306" width="185" height="28" rx="6" fill="#c7d2fe"/><text x="352" y="325">etcd</text>
    <rect x="260" y="340" width="185" height="28" rx="6" fill="#c7d2fe"/><text x="352" y="359">kube-scheduler</text>
    <rect x="260" y="374" width="185" height="28" rx="6" fill="#c7d2fe"/><text x="352" y="393">kube-controller-manager</text>
  </g>
  <rect x="260" y="408" width="185" height="28" rx="6" fill="#f1f5f9"/>
  <text x="352" y="427" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">kube-proxy · kindnet</text>
  <text x="352" y="266" text-anchor="middle" font-size="10" fill="#4f46e5">Static Pod</text>

  <!-- worker -->
  <rect x="470" y="138" width="205" height="310" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="572" y="160" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#1e3a8a">infra-lab-worker</text>
  <text x="572" y="177" text-anchor="middle" font-size="11" fill="#64748b">Docker 컨테이너 = 노드</text>
  <rect x="480" y="188" width="185" height="30" rx="6" fill="#dbeafe"/>
  <text x="572" y="208" text-anchor="middle" font-size="12" fill="#1e3a8a">kubelet (systemd 서비스)</text>
  <rect x="480" y="226" width="185" height="30" rx="6" fill="#e2e8f0"/>
  <text x="572" y="246" text-anchor="middle" font-size="12" fill="#0f172a">containerd</text>
  <rect x="480" y="272" width="185" height="28" rx="6" fill="#f1f5f9"/>
  <text x="572" y="291" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">kube-proxy · kindnet</text>
  <rect x="480" y="312" width="185" height="34" rx="6" fill="#86efac"/>
  <text x="572" y="334" text-anchor="middle" font-size="12" fill="#14532d">앱 Pod (nginx …)</text>
  <rect x="480" y="354" width="185" height="34" rx="6" fill="#86efac"/>
  <text x="572" y="376" text-anchor="middle" font-size="12" fill="#14532d">앱 Pod</text>
  <text x="572" y="420" text-anchor="middle" font-size="11" fill="#64748b">Day 10~ 실습 Pod가 여기에</text>

  <!-- worker2 -->
  <rect x="690" y="138" width="205" height="310" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="792" y="160" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#1e3a8a">infra-lab-worker2</text>
  <text x="792" y="177" text-anchor="middle" font-size="11" fill="#64748b">Docker 컨테이너 = 노드</text>
  <rect x="700" y="188" width="185" height="30" rx="6" fill="#dbeafe"/>
  <text x="792" y="208" text-anchor="middle" font-size="12" fill="#1e3a8a">kubelet (systemd 서비스)</text>
  <rect x="700" y="226" width="185" height="30" rx="6" fill="#e2e8f0"/>
  <text x="792" y="246" text-anchor="middle" font-size="12" fill="#0f172a">containerd</text>
  <rect x="700" y="272" width="185" height="28" rx="6" fill="#f1f5f9"/>
  <text x="792" y="291" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">kube-proxy · kindnet</text>
  <rect x="700" y="312" width="185" height="34" rx="6" fill="#86efac"/>
  <text x="792" y="334" text-anchor="middle" font-size="12" fill="#14532d">앱 Pod (nginx …)</text>
  <rect x="700" y="354" width="185" height="34" rx="6" fill="#86efac"/>
  <text x="792" y="376" text-anchor="middle" font-size="12" fill="#14532d">앱 Pod</text>
  <text x="792" y="420" text-anchor="middle" font-size="11" fill="#64748b">Day 10~ 실습 Pod가 여기에</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M195,140 C225,150 225,280 257,286" marker-end="url(#arrow)"/>
  </g>
</svg>
