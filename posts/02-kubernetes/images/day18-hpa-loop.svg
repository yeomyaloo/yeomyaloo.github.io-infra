<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">HPA 제어 루프</text>

  <!-- Node -->
  <rect x="20" y="70" width="200" height="280" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">노드 (kind)</text>
  <rect x="36" y="112" width="168" height="54" rx="8" fill="#16a34a"/>
  <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">kubelet</text>
  <text x="120" y="154" text-anchor="middle" font-size="12" fill="#dcfce7">(cAdvisor 내장) :10250</text>
  <g font-size="12" text-anchor="middle" fill="#14532d">
    <rect x="36" y="182" width="168" height="34" rx="6" fill="#86efac"/><text x="120" y="204">php-apache Pod</text>
    <rect x="36" y="224" width="168" height="34" rx="6" fill="#86efac"/><text x="120" y="246">php-apache Pod</text>
    <rect x="36" y="266" width="168" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/><text x="120" y="288">+ 새 Pod ...</text>
  </g>
  <text x="120" y="330" text-anchor="middle" font-size="12" fill="#64748b">requests.cpu: 200m</text>

  <!-- metrics-server -->
  <rect x="280" y="70" width="190" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="375" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">metrics-server</text>
  <text x="375" y="128" text-anchor="middle" font-size="12" fill="#3730a3">① kubelet에서 사용량 수집</text>
  <text x="375" y="148" text-anchor="middle" font-size="11" fill="#64748b" font-family="Consolas,'D2Coding',monospace">--kubelet-insecure-tls</text>

  <!-- API server -->
  <rect x="530" y="70" width="190" height="100" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="625" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">kube-apiserver</text>
  <text x="625" y="128" text-anchor="middle" font-size="12" fill="#1e3a8a">② Metrics API로 제공</text>
  <text x="625" y="148" text-anchor="middle" font-size="11" fill="#64748b" font-family="Consolas,'D2Coding',monospace">metrics.k8s.io</text>

  <!-- HPA -->
  <rect x="780" y="70" width="160" height="180" rx="12" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
  <text x="860" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">HPA 컨트롤러</text>
  <text x="860" y="120" text-anchor="middle" font-size="11" fill="#92400e">(controller-manager 안)</text>
  <g font-size="12" fill="#78350f">
    <text x="796" y="152">③ 15초마다 조회</text>
    <text x="796" y="176">· 목표값과 비교</text>
    <text x="796" y="200">· 원하는 replicas</text>
    <text x="808" y="218">계산 (min~max)</text>
  </g>

  <!-- Deployment -->
  <rect x="530" y="250" width="190" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="625" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Deployment</text>
  <text x="625" y="302" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">php-apache</text>
  <text x="625" y="326" text-anchor="middle" font-size="12" fill="#334155">④ spec.replicas 변경</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="120" x2="276" y2="120" marker-end="url(#arrow)"/>
    <line x1="470" y1="120" x2="526" y2="120" marker-end="url(#arrow)"/>
    <line x1="720" y1="120" x2="776" y2="120" marker-end="url(#arrow)"/>
    <polyline points="860,250 860,295 724,295" marker-end="url(#arrow)"/>
    <line x1="530" y1="295" x2="224" y2="295" marker-end="url(#arrow)"/>
  </g>
  <text x="377" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">⑤ ReplicaSet이 Pod 추가/삭제</text>

  <!-- Formula -->
  <rect x="250" y="362" width="690" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="270" y="390" font-size="14" fill="#78350f" font-family="Consolas,'D2Coding',monospace" font-weight="700">desired = ceil( current × 현재값 / 목표값 )</text>
  <text x="270" y="416" font-size="13" fill="#78350f">예) Pod 1개가 CPU 250%(requests 대비), 목표 50% → ceil(1 × 250 / 50) = <tspan font-weight="700">5개</tspan></text>
</svg>
