<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Pod Phase와 restartPolicy</text>

  <!-- Pending -->
  <rect x="40" y="140" width="170" height="76" rx="12" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Pending</text>
  <text x="125" y="196" text-anchor="middle" font-size="12" fill="#92400e">스케줄 대기 · 이미지 pull</text>

  <!-- Running -->
  <rect x="300" y="140" width="190" height="76" rx="12" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="395" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Running</text>
  <text x="395" y="196" text-anchor="middle" font-size="12" fill="#166534">컨테이너 1개 이상 실행 중</text>

  <!-- Succeeded -->
  <rect x="620" y="70" width="200" height="70" rx="12" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="720" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Succeeded</text>
  <text x="720" y="124" text-anchor="middle" font-size="12" fill="#3730a3">모두 exit 0 으로 종료</text>

  <!-- Failed -->
  <rect x="620" y="215" width="200" height="70" rx="12" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">Failed</text>
  <text x="720" y="269" text-anchor="middle" font-size="12" fill="#991b1b">하나 이상 실패로 종료</text>

  <!-- Unknown -->
  <rect x="40" y="300" width="170" height="64" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="125" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Unknown</text>
  <text x="125" y="350" text-anchor="middle" font-size="12" fill="#64748b">노드와 통신 두절</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="210" y1="178" x2="297" y2="178" marker-end="url(#arrow)"/>
    <line x1="490" y1="160" x2="617" y2="112" marker-end="url(#arrow)"/>
    <line x1="490" y1="198" x2="617" y2="246" marker-end="url(#arrow)"/>
    <path d="M360,140 C350,92 440,92 430,137" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="253" y="168">시작</text>
    <text x="540" y="122">성공 종료</text>
    <text x="540" y="246">실패 종료</text>
    <text x="540" y="260">(재시작 안 할 때)</text>
  </g>
  <text x="395" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">컨테이너 재시작 (같은 노드, restartPolicy)</text>
  <text x="395" y="86" text-anchor="middle" font-size="12" fill="#b91c1c">반복 크래시 → CrashLoopBackOff (10s → 20s → … 최대 5분 대기)</text>

  <!-- restartPolicy table -->
  <g font-size="13">
    <rect x="300" y="305" width="640" height="26" fill="#334155"/>
    <text x="390" y="323" text-anchor="middle" font-weight="700" fill="#ffffff">restartPolicy</text>
    <text x="595" y="323" text-anchor="middle" font-weight="700" fill="#ffffff">exit 0 (성공)</text>
    <text x="825" y="323" text-anchor="middle" font-weight="700" fill="#ffffff">exit ≠ 0 (실패)</text>

    <rect x="300" y="331" width="640" height="26" fill="#f8fafc"/>
    <text x="390" y="349" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">Always (기본)</text>
    <text x="595" y="349" text-anchor="middle" fill="#166534">재시작</text>
    <text x="825" y="349" text-anchor="middle" fill="#166534">재시작</text>

    <rect x="300" y="357" width="640" height="26" fill="#ffffff"/>
    <text x="390" y="375" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">OnFailure</text>
    <text x="595" y="375" text-anchor="middle" fill="#3730a3">종료 → Completed</text>
    <text x="825" y="375" text-anchor="middle" fill="#166534">재시작</text>

    <rect x="300" y="383" width="640" height="26" fill="#f8fafc"/>
    <text x="390" y="401" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">Never</text>
    <text x="595" y="401" text-anchor="middle" fill="#3730a3">종료 → Completed</text>
    <text x="825" y="401" text-anchor="middle" fill="#b91c1c">종료 → Error</text>
  </g>
  <rect x="300" y="305" width="640" height="104" fill="none" stroke="#94a3b8"/>
  <line x1="480" y1="305" x2="480" y2="409" stroke="#94a3b8"/>
  <line x1="710" y1="305" x2="710" y2="409" stroke="#94a3b8"/>
</svg>
