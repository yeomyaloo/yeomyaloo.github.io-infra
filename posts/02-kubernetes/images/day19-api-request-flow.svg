<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">API 요청이 통과하는 3개의 관문</text>

  <!-- Client -->
  <rect x="20" y="120" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">kubectl</text>
  <text x="85" y="184" text-anchor="middle" font-size="12" fill="#64748b">alice / dev-sa</text>

  <!-- kube-apiserver -->
  <rect x="180" y="62" width="620" height="252" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="490" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">kube-apiserver</text>

  <!-- Stage 1 -->
  <rect x="200" y="105" width="170" height="125" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="285" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">① 인증</text>
  <text x="285" y="152" text-anchor="middle" font-size="13" fill="#312e81">Authentication</text>
  <text x="285" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">"너 누구야?"</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="#334155">인증서 · SA 토큰</text>
  <text x="285" y="221" text-anchor="middle" font-size="12" fill="#334155">OIDC</text>

  <!-- Stage 2 -->
  <rect x="405" y="105" width="170" height="125" rx="10" fill="#86efac" stroke="#16a34a"/>
  <text x="490" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">② 인가</text>
  <text x="490" y="152" text-anchor="middle" font-size="13" fill="#14532d">Authorization</text>
  <text x="490" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">"그거 해도 돼?"</text>
  <text x="490" y="204" text-anchor="middle" font-size="12" fill="#334155">RBAC</text>
  <text x="490" y="221" text-anchor="middle" font-size="12" fill="#334155">Node authorizer</text>

  <!-- Stage 3 -->
  <rect x="610" y="105" width="170" height="125" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="695" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">③ 어드미션</text>
  <text x="695" y="152" text-anchor="middle" font-size="13" fill="#78350f">Admission</text>
  <text x="695" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">"내용이 규칙에 맞아?"</text>
  <text x="695" y="204" text-anchor="middle" font-size="12" fill="#334155">Quota · LimitRange</text>
  <text x="695" y="221" text-anchor="middle" font-size="12" fill="#334155">PodSecurity · Webhook</text>

  <!-- Failure boxes -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="215" y="262" width="140" height="34" rx="6" fill="#fca5a5"/>
    <text x="285" y="284" fill="#7f1d1d">401 Unauthorized</text>
    <rect x="420" y="262" width="140" height="34" rx="6" fill="#fca5a5"/>
    <text x="490" y="284" fill="#7f1d1d">403 Forbidden</text>
    <rect x="625" y="262" width="140" height="34" rx="6" fill="#fca5a5"/>
    <text x="695" y="284" fill="#7f1d1d">403 Forbidden</text>
  </g>

  <!-- etcd -->
  <rect x="830" y="120" width="110" height="90" rx="10" fill="#e2e8f0" stroke="#334155"/>
  <text x="885" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">etcd</text>
  <text x="885" y="184" text-anchor="middle" font-size="12" fill="#64748b">저장 · 응답</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="165" x2="197" y2="165" marker-end="url(#arrow)"/>
    <line x1="370" y1="165" x2="402" y2="165" marker-end="url(#arrow)"/>
    <line x1="575" y1="165" x2="607" y2="165" marker-end="url(#arrow)"/>
    <line x1="780" y1="165" x2="827" y2="165" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="285" y1="230" x2="285" y2="259" marker-end="url(#arrowRed)"/>
    <line x1="490" y1="230" x2="490" y2="259" marker-end="url(#arrowRed)"/>
    <line x1="695" y1="230" x2="695" y2="259" marker-end="url(#arrowRed)"/>
  </g>

  <text x="480" y="346" text-anchor="middle" font-size="14" fill="#334155">한 관문에서 거절되면 다음 단계로 넘어가지 않는다 — 401은 인증 실패, 403은 인가 또는 어드미션 실패</text>
</svg>
