  <!-- new RS pods -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" text-anchor="middle">
    <rect x="540" y="295" width="160" height="48" rx="8" fill="#86efac"/>
    <text x="620" y="315" fill="#14532d">web-7c9d8f6b4f-4lq2x</text><text x="620" y="333" fill="#166534">Running</text>
    <rect x="710" y="295" width="160" height="48" rx="8" fill="#86efac"/>
    <text x="790" y="315" fill="#14532d">web-7c9d8f6b4f-8vjzt</text><text x="790" y="333" fill="#166534">Running</text>
    <rect x="540" y="353" width="160" height="48" rx="8" fill="#86efac"/>
    <text x="620" y="373" fill="#14532d">web-7c9d8f6b4f-kd7mw</text><text x="620" y="391" fill="#166534">Running</text>
    <rect x="710" y="353" width="160" height="48" rx="8" fill="#86efac"/>
    <text x="790" y="373" fill="#14532d">web-7c9d8f6b4f-xp9rn</text><text x="790" y="391" fill="#166534">Running</text>
