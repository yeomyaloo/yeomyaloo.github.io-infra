  <text x="480" y="434" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#334155">이름 규칙: &lt;Deployment&gt;-&lt;pod-template-hash&gt;-&lt;랜덤 5자&gt;</text>
