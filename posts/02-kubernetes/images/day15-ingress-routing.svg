<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ingress — 진입점 하나로 여러 Service에 L7 라우팅</text>

  <!-- Clients -->
  <g font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">
    <rect x="20" y="110" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="32" y="137">GET /foo</text>
    <rect x="20" y="170" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="32" y="197">GET /bar</text>
    <rect x="20" y="230" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="32" y="257">Host: app.example.test</text>
  </g>
  <text x="115" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">클라이언트 요청</text>

  <!-- Controller -->
  <rect x="270" y="100" width="210" height="190" rx="12" fill="#326ce5"/>
  <text x="375" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Ingress Controller</text>
  <text x="375" y="158" text-anchor="middle" font-size="13" fill="#dbeafe">(예: Traefik Pod)</text>
  <text x="375" y="196" text-anchor="middle" font-size="13" fill="#ffffff">호스트 · 경로 매칭</text>
  <text x="375" y="220" text-anchor="middle" font-size="13" fill="#ffffff">TLS 종료 (HTTPS → HTTP)</text>
  <text x="375" y="244" text-anchor="middle" font-size="13" fill="#ffffff">L7 프록시</text>
  <text x="375" y="274" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#dbeafe">IngressClass: traefik</text>

  <!-- Ingress resource -->
  <rect x="270" y="330" width="210" height="110" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="375" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Ingress (규칙)</text>
  <g font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#78350f">
    <text x="286" y="382">/foo  → svc foo</text>
    <text x="286" y="402">/bar  → svc bar</text>
    <text x="286" y="422">app.example.test → foo</text>
  </g>

  <!-- Services -->
  <rect x="560" y="110" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="635" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Service foo</text>
  <text x="635" y="162" text-anchor="middle" font-size="12" fill="#64748b">ClusterIP</text>
  <rect x="560" y="220" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="635" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Service bar</text>
  <text x="635" y="272" text-anchor="middle" font-size="12" fill="#64748b">ClusterIP</text>

  <!-- Pods -->
  <g font-size="13" text-anchor="middle">
    <rect x="770" y="100" width="160" height="38" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="850" y="124" fill="#14532d">foo Pod</text>
    <rect x="770" y="148" width="160" height="38" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="850" y="172" fill="#14532d">foo Pod</text>
    <rect x="770" y="212" width="160" height="38" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="850" y="236" fill="#312e81">bar Pod</text>
    <rect x="770" y="260" width="160" height="38" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="850" y="284" fill="#312e81">bar Pod</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="210" y1="132" x2="267" y2="150" marker-end="url(#arrow)"/>
    <line x1="210" y1="192" x2="267" y2="192" marker-end="url(#arrow)"/>
    <line x1="210" y1="252" x2="267" y2="234" marker-end="url(#arrow)"/>
    <line x1="480" y1="160" x2="557" y2="145" marker-end="url(#arrow)"/>
    <line x1="480" y1="230" x2="557" y2="255" marker-end="url(#arrow)"/>
    <line x1="710" y1="140" x2="767" y2="119" marker-end="url(#arrow)"/>
    <line x1="710" y1="150" x2="767" y2="167" marker-end="url(#arrow)"/>
    <line x1="710" y1="250" x2="767" y2="231" marker-end="url(#arrow)"/>
    <line x1="710" y1="260" x2="767" y2="279" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="375" y1="330" x2="375" y2="293" marker-end="url(#arrow)"/>
  </g>
  <text x="385" y="318" font-size="12" font-weight="700" fill="#92400e">watch</text>

  <!-- Note -->
  <rect x="560" y="330" width="370" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="745" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Service(L4) vs Ingress(L7)</text>
  <text x="745" y="386" text-anchor="middle" font-size="13" fill="#334155">Service: IP:Port만 보고 분산</text>
  <text x="745" y="410" text-anchor="middle" font-size="13" fill="#334155">Ingress: Host 헤더 · URL 경로를 보고</text>
  <text x="745" y="430" text-anchor="middle" font-size="13" fill="#334155">어느 Service로 보낼지 결정</text>
</svg>
