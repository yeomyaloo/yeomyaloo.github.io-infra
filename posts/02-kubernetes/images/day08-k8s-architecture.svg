<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kubernetes 클러스터 아키텍처</text>

  <!-- kubectl -->
  <rect x="20" y="105" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="132" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="16" font-weight="700" fill="#0f172a">kubectl</text>
  <text x="85" y="153" text-anchor="middle" font-size="12" fill="#64748b">(사용자)</text>

  <!-- note -->
  <rect x="20" y="370" width="140" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <g font-size="12" fill="#78350f" text-anchor="middle">
    <text x="90" y="398" font-weight="700">핵심 원칙</text>
    <text x="90" y="422">모든 통신은</text>
    <text x="90" y="441">apiserver를</text>
    <text x="90" y="460">거친다</text>
  </g>

  <!-- Control Plane -->
  <rect x="180" y="60" width="360" height="430" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Control Plane</text>

  <rect x="200" y="110" width="320" height="50" rx="8" fill="#326ce5"/>
  <text x="360" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">kube-apiserver</text>

  <rect x="200" y="200" width="140" height="60" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="270" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">etcd</text>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#92400e">(상태 저장소)</text>

  <rect x="360" y="200" width="160" height="60" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="440" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">kube-scheduler</text>
  <text x="440" y="246" text-anchor="middle" font-size="12" fill="#3730a3">(노드 배치 결정)</text>

  <rect x="200" y="290" width="320" height="60" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="360" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">kube-controller-manager</text>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#3730a3">Deployment · ReplicaSet · Node · Job …</text>

  <rect x="200" y="380" width="320" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#334155">cloud-controller-manager (클라우드 연동 · 선택)</text>

  <text x="360" y="470" text-anchor="middle" font-size="12" fill="#64748b">애드온: CoreDNS · CNI(kindnet, Calico 등)</text>

  <!-- Worker Node 1 -->
  <rect x="600" y="60" width="340" height="200" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="2"/>
  <text x="770" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Worker Node 1</text>
  <rect x="620" y="100" width="140" height="40" rx="8" fill="#dbeafe" stroke="#326ce5"/>
  <text x="690" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kubelet</text>
  <rect x="780" y="100" width="140" height="40" rx="8" fill="#dbeafe" stroke="#326ce5"/>
  <text x="850" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kube-proxy</text>
  <rect x="620" y="155" width="300" height="36" rx="8" fill="#e2e8f0"/>
  <text x="770" y="178" text-anchor="middle" font-size="13" fill="#0f172a">containerd (Container Runtime, CRI)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="620" y="205" width="90" height="40" rx="6" fill="#86efac"/><text x="665" y="230" fill="#14532d">Pod</text>
    <rect x="725" y="205" width="90" height="40" rx="6" fill="#86efac"/><text x="770" y="230" fill="#14532d">Pod</text>
    <rect x="830" y="205" width="90" height="40" rx="6" fill="#86efac"/><text x="875" y="230" fill="#14532d">Pod</text>
  </g>

  <!-- Worker Node 2 -->
  <rect x="600" y="290" width="340" height="200" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="2"/>
  <text x="770" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Worker Node 2</text>
  <rect x="620" y="330" width="140" height="40" rx="8" fill="#dbeafe" stroke="#326ce5"/>
  <text x="690" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kubelet</text>
  <rect x="780" y="330" width="140" height="40" rx="8" fill="#dbeafe" stroke="#326ce5"/>
  <text x="850" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kube-proxy</text>
  <rect x="620" y="385" width="300" height="36" rx="8" fill="#e2e8f0"/>
  <text x="770" y="408" text-anchor="middle" font-size="13" fill="#0f172a">containerd (Container Runtime, CRI)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="620" y="435" width="90" height="40" rx="6" fill="#86efac"/><text x="665" y="460" fill="#14532d">Pod</text>
    <rect x="725" y="435" width="90" height="40" rx="6" fill="#86efac"/><text x="770" y="460" fill="#14532d">Pod</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="135" x2="197" y2="135" marker-end="url(#arrow)"/>
    <line x1="270" y1="197" x2="270" y2="163" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="440" y1="197" x2="440" y2="163" marker-end="url(#arrow)"/>
    <line x1="350" y1="287" x2="350" y2="163" marker-end="url(#arrow)"/>
    <line x1="522" y1="125" x2="617" y2="120" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="522" y1="148" x2="617" y2="345" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="690" y1="140" x2="690" y2="152" marker-end="url(#arrow)"/>
    <line x1="690" y1="370" x2="690" y2="382" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="174" y="127">HTTPS</text>
    <text x="570" y="112">watch</text>
    <text x="598" y="282" text-anchor="start">상태 보고</text>
  </g>
</svg>
