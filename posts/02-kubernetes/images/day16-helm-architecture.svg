<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Helm 아키텍처 — Chart · Repository · Release</text>

  <!-- Repository -->
  <rect x="20" y="70" width="230" height="170" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="135" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Chart Repository</text>
  <rect x="40" y="118" width="190" height="48" rx="8" fill="#fde68a"/>
  <text x="135" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">HTTP 저장소</text>
  <text x="135" y="157" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">helm repo add ...</text>
  <rect x="40" y="176" width="190" height="48" rx="8" fill="#fde68a"/>
  <text x="135" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">OCI 레지스트리</text>
  <text x="135" y="215" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">oci://ghcr.io/...</text>

  <!-- Values -->
  <rect x="20" y="270" width="230" height="160" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">내 설정 (values)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="40" y="318" width="190" height="40" rx="20" fill="#e2e8f0"/>
    <text x="135" y="343" fill="#0f172a">-f values-prod.yaml</text>
    <rect x="40" y="370" width="190" height="40" rx="20" fill="#e2e8f0"/>
    <text x="135" y="395" fill="#0f172a">--set replicaCount=3</text>
  </g>

  <!-- helm CLI -->
  <rect x="310" y="70" width="240" height="360" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="430" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">helm CLI (내 PC)</text>
  <text x="430" y="120" text-anchor="middle" font-size="12" fill="#64748b">클러스터 안 서버 컴포넌트 없음</text>
  <g font-size="14" fill="#1e1b4b">
    <rect x="330" y="140" width="200" height="56" rx="8" fill="#c7d2fe"/>
    <text x="345" y="164" font-weight="700">① 차트 가져오기</text>
    <text x="345" y="185" font-size="12" fill="#3730a3">templates/ + values.yaml</text>
    <rect x="330" y="208" width="200" height="56" rx="8" fill="#c7d2fe"/>
    <text x="345" y="232" font-weight="700">② 템플릿 렌더링</text>
    <text x="345" y="253" font-size="12" fill="#3730a3">값을 채워 평범한 YAML 생성</text>
    <rect x="330" y="276" width="200" height="56" rx="8" fill="#c7d2fe"/>
    <text x="345" y="300" font-weight="700">③ API Server에 적용</text>
    <text x="345" y="321" font-size="12" fill="#3730a3">kubeconfig 권한 그대로 사용</text>
    <rect x="330" y="344" width="200" height="56" rx="8" fill="#c7d2fe"/>
    <text x="345" y="368" font-weight="700">④ Release 기록 저장</text>
    <text x="345" y="389" font-size="12" fill="#3730a3">revision 번호 증가</text>
  </g>

  <!-- Cluster -->
  <rect x="620" y="70" width="320" height="360" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="780" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터 (kind)</text>
  <rect x="640" y="118" width="280" height="44" rx="8" fill="#326ce5"/>
  <text x="780" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">kube-apiserver</text>

  <rect x="640" y="186" width="280" height="226" rx="10" fill="#ffffff" stroke="#16a34a" stroke-dasharray="6 4"/>
  <text x="656" y="210" font-size="14" font-weight="700" fill="#14532d">namespace: demo</text>
  <text x="904" y="210" text-anchor="end" font-size="12" fill="#64748b">my-podinfo</text>
  <g font-size="13" text-anchor="middle" fill="#14532d">
    <rect x="656" y="224" width="120" height="34" rx="6" fill="#86efac"/><text x="716" y="246">Deployment</text>
    <rect x="784" y="224" width="120" height="34" rx="6" fill="#86efac"/><text x="844" y="246">Service</text>
    <rect x="656" y="266" width="120" height="34" rx="6" fill="#86efac"/><text x="716" y="288">ConfigMap</text>
    <rect x="784" y="266" width="120" height="34" rx="6" fill="#86efac"/><text x="844" y="288">Pod × N</text>
  </g>
  <rect x="656" y="318" width="248" height="78" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="780" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">릴리스 기록 (Secret)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155" text-anchor="middle">
    <text x="780" y="360">sh.helm.release.v1.my-podinfo.v1</text>
    <text x="780" y="378">sh.helm.release.v1.my-podinfo.v2</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="250" y1="168" x2="326" y2="168" marker-end="url(#arrow)"/>
    <line x1="250" y1="350" x2="300" y2="350"/>
    <polyline points="300,350 300,236 326,236" marker-end="url(#arrow)"/>
    <line x1="530" y1="304" x2="575" y2="304"/>
    <polyline points="575,304 575,140 636,140" marker-end="url(#arrow)"/>
    <line x1="780" y1="162" x2="780" y2="182" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#334155" font-weight="700">
    <text x="288" y="160" text-anchor="middle">pull</text>
    <text x="596" y="132" text-anchor="middle">apply</text>
  </g>
</svg>
