<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Service 타입 — 트래픽 경로와 포함 관계</text>

  <!-- External client -->
  <rect x="20" y="170" width="130" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">외부 사용자</text>
  <text x="85" y="228" text-anchor="middle" font-size="13" fill="#64748b">(브라우저)</text>

  <!-- External LB -->
  <rect x="185" y="150" width="170" height="120" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">외부 LB</text>
  <text x="270" y="206" text-anchor="middle" font-size="13" fill="#92400e">EXTERNAL-IP</text>
  <text x="270" y="236" text-anchor="middle" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#78350f">172.18.0.6:80</text>

  <!-- Nodes -->
  <rect x="395" y="120" width="170" height="80" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="480" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Node 1</text>
  <text x="480" y="180" text-anchor="middle" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#334155">NodeIP:31547</text>
  <rect x="395" y="220" width="170" height="80" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="480" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Node 2</text>
  <text x="480" y="280" text-anchor="middle" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#334155">NodeIP:31547</text>

  <!-- Internal client -->
  <rect x="605" y="62" width="170" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="690" y="89" text-anchor="middle" font-size="13" fill="#334155">클러스터 내부 Pod</text>

  <!-- ClusterIP -->
  <rect x="605" y="150" width="170" height="120" rx="10" fill="#326ce5"/>
  <text x="690" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Service</text>
  <text x="690" y="204" text-anchor="middle" font-size="13" fill="#dbeafe">ClusterIP (가상 IP)</text>
  <text x="690" y="230" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#ffffff">10.96.201.14:80</text>
  <text x="690" y="254" text-anchor="middle" font-size="12" fill="#dbeafe">kube-proxy 규칙</text>

  <!-- Pods -->
  <g font-size="14" text-anchor="middle">
    <rect x="815" y="120" width="125" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="877" y="150" fill="#14532d">Pod :8080</text>
    <rect x="815" y="185" width="125" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="877" y="215" fill="#14532d">Pod :8080</text>
    <rect x="815" y="250" width="125" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="877" y="280" fill="#14532d">Pod :8080</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="150" y1="210" x2="182" y2="210" marker-end="url(#arrow)"/>
    <line x1="355" y1="190" x2="392" y2="163" marker-end="url(#arrow)"/>
    <line x1="355" y1="230" x2="392" y2="257" marker-end="url(#arrow)"/>
    <line x1="565" y1="163" x2="602" y2="190" marker-end="url(#arrow)"/>
    <line x1="565" y1="257" x2="602" y2="230" marker-end="url(#arrow)"/>
    <line x1="690" y1="104" x2="690" y2="147" marker-end="url(#arrow)"/>
    <line x1="775" y1="195" x2="812" y2="148" marker-end="url(#arrow)"/>
    <line x1="775" y1="210" x2="812" y2="210" marker-end="url(#arrow)"/>
    <line x1="775" y1="225" x2="812" y2="272" marker-end="url(#arrow)"/>
  </g>

  <!-- Inclusion bars -->
  <rect x="605" y="330" width="335" height="34" rx="6" fill="#dbeafe" stroke="#326ce5"/>
  <text x="772" y="352" text-anchor="middle" font-size="14" fill="#1e3a8a"><tspan font-weight="700">ClusterIP</tspan> — 클러스터 내부 전용</text>

  <rect x="395" y="376" width="545" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="667" y="398" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="700">NodePort</tspan> = ClusterIP + 모든 노드에 30000–32767 포트 개방</text>

  <rect x="185" y="422" width="755" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="562" y="444" text-anchor="middle" font-size="14" fill="#78350f"><tspan font-weight="700">LoadBalancer</tspan> = NodePort + 외부 LB 자동 생성 (클라우드 / cloud-provider-kind)</text>
</svg>
