<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">network namespace · veth · bridge — 실습 2 토폴로지</text>

  <!-- Host -->
  <rect x="20" y="45" width="920" height="400" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="66" font-size="13" font-weight="700" fill="#334155">호스트 (root network namespace)</text>

  <!-- namespaces -->
  <g>
    <rect x="60" y="78" width="220" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="170" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">ns1</text>
    <rect x="80" y="110" width="180" height="28" rx="6" fill="#c7d2fe"/>
    <text x="170" y="129" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">eth0 10.10.0.11/24</text>
    <text x="170" y="158" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#475569">default via 10.10.0.1</text>
    <text x="170" y="182" text-anchor="middle" font-size="11" fill="#64748b">자기만의 라우팅 · ARP · iptables</text>

    <rect x="370" y="78" width="220" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="480" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">ns2</text>
    <rect x="390" y="110" width="180" height="28" rx="6" fill="#c7d2fe"/>
    <text x="480" y="129" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">eth0 10.10.0.12/24</text>
    <text x="480" y="158" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#475569">default via 10.10.0.1</text>
    <text x="480" y="182" text-anchor="middle" font-size="11" fill="#64748b">자기만의 라우팅 · ARP · iptables</text>

    <rect x="680" y="78" width="220" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="790" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">ns3</text>
    <rect x="700" y="110" width="180" height="28" rx="6" fill="#c7d2fe"/>
    <text x="790" y="129" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">eth0 10.10.0.13/24</text>
    <text x="790" y="158" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#475569">default via 10.10.0.1</text>
    <text x="790" y="182" text-anchor="middle" font-size="11" fill="#64748b">자기만의 라우팅 · ARP · iptables</text>
  </g>

  <!-- veth cables -->
  <g stroke="#16a34a" stroke-width="4">
    <line x1="170" y1="198" x2="170" y2="245"/>
    <line x1="480" y1="198" x2="480" y2="245"/>
    <line x1="790" y1="198" x2="790" y2="245"/>
  </g>
  <g font-size="11" fill="#14532d" font-weight="700">
    <text x="180" y="226">veth pair</text>
    <text x="490" y="226">veth pair</text>
    <text x="800" y="226">veth pair</text>
  </g>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="105" y="245" width="130" height="30" rx="6" fill="#86efac" stroke="#16a34a"/><text x="170" y="265" fill="#14532d">veth-ns1</text>
    <rect x="415" y="245" width="130" height="30" rx="6" fill="#86efac" stroke="#16a34a"/><text x="480" y="265" fill="#14532d">veth-ns2</text>
    <rect x="725" y="245" width="130" height="30" rx="6" fill="#86efac" stroke="#16a34a"/><text x="790" y="265" fill="#14532d">veth-ns3</text>
  </g>
  <g stroke="#16a34a" stroke-width="2">
    <line x1="170" y1="275" x2="170" y2="295"/>
    <line x1="480" y1="275" x2="480" y2="295"/>
    <line x1="790" y1="275" x2="790" y2="295"/>
  </g>

  <!-- bridge -->
  <rect x="60" y="295" width="840" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">br0 (Linux bridge) — 10.10.0.1/24 · FDB로 MAC 학습</text>

  <!-- bottom row -->
  <text x="60" y="385" font-size="12" fill="#64748b">같은 구조:</text>
  <text x="60" y="404" font-size="12" fill="#64748b">Docker docker0 · K8s cni0</text>
  <text x="60" y="423" font-size="12" fill="#64748b">libvirt virbr0</text>

  <rect x="320" y="365" width="320" height="58" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="480" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">호스트 라우팅 + NAT</text>
  <text x="480" y="409" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">ip_forward=1 · MASQUERADE</text>

  <rect x="700" y="365" width="200" height="58" rx="10" fill="#2496ed"/>
  <text x="800" y="389" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#ffffff">enp1s0</text>
  <text x="800" y="409" text-anchor="middle" font-size="12" fill="#ffffff">호스트 NIC → 인터넷</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="480" y1="345" x2="480" y2="362" marker-end="url(#arrow)"/>
    <line x1="640" y1="394" x2="697" y2="394" marker-end="url(#arrow)"/>
  </g>
</svg>
