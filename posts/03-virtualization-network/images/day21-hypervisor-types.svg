<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">하이퍼바이저의 종류 — Type 1 · Type 2 · KVM</text>

  <!-- ===== Type 1 ===== -->
  <rect x="20" y="50" width="290" height="405" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="165" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Type 1 (Bare-metal)</text>
  <text x="165" y="102" text-anchor="middle" font-size="13" fill="#64748b">ESXi · Xen · Hyper-V</text>
  <g font-size="13" text-anchor="middle">
    <rect x="35" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="75" y="144" font-size="12" font-weight="700" fill="#334155">VM 1</text>
    <rect x="40" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="75" y="172" fill="#14532d">App</text>
    <rect x="40" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="75" y="208" fill="#7f1d1d">Guest</text><text x="75" y="226" fill="#7f1d1d">OS</text>
    <rect x="125" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="165" y="144" font-size="12" font-weight="700" fill="#334155">VM 2</text>
    <rect x="130" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="165" y="172" fill="#14532d">App</text>
    <rect x="130" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="165" y="208" fill="#7f1d1d">Guest</text><text x="165" y="226" fill="#7f1d1d">OS</text>
    <rect x="215" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="255" y="144" font-size="12" font-weight="700" fill="#334155">VM 3</text>
    <rect x="220" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="255" y="172" fill="#14532d">App</text>
    <rect x="220" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="255" y="208" fill="#7f1d1d">Guest</text><text x="255" y="226" fill="#7f1d1d">OS</text>
  </g>
  <rect x="35" y="255" width="260" height="100" rx="8" fill="#f59e0b"/>
  <text x="165" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">하이퍼바이저</text>
  <text x="165" y="320" text-anchor="middle" font-size="12" fill="#ffffff">하드웨어 위에서 직접 동작</text>
  <rect x="35" y="370" width="260" height="45" rx="8" fill="#334155"/>
  <text x="165" y="398" text-anchor="middle" font-size="14" fill="#ffffff">하드웨어 (VT-x / AMD-V)</text>
  <text x="165" y="440" text-anchor="middle" font-size="13" fill="#64748b">데이터센터 · 클라우드</text>

  <!-- ===== Type 2 ===== -->
  <rect x="335" y="50" width="290" height="405" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Type 2 (Hosted)</text>
  <text x="480" y="102" text-anchor="middle" font-size="13" fill="#64748b">VirtualBox · VMware Workstation</text>
  <g font-size="13" text-anchor="middle">
    <rect x="350" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="390" y="144" font-size="12" font-weight="700" fill="#334155">VM 1</text>
    <rect x="355" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="390" y="172" fill="#14532d">App</text>
    <rect x="355" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="390" y="208" fill="#7f1d1d">Guest</text><text x="390" y="226" fill="#7f1d1d">OS</text>
    <rect x="440" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="480" y="144" font-size="12" font-weight="700" fill="#334155">VM 2</text>
    <rect x="445" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="480" y="172" fill="#14532d">App</text>
    <rect x="445" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="480" y="208" fill="#7f1d1d">Guest</text><text x="480" y="226" fill="#7f1d1d">OS</text>
    <rect x="530" y="125" width="80" height="170" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="570" y="200" fill="#334155" font-weight="700">일반 앱</text>
    <text x="570" y="220" font-size="11" fill="#64748b">(브라우저 등)</text>
  </g>
  <rect x="350" y="255" width="170" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="435" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">하이퍼바이저 (앱)</text>
  <rect x="350" y="305" width="260" height="50" rx="8" fill="#64748b"/>
  <text x="480" y="335" text-anchor="middle" font-size="14" fill="#ffffff">Host OS (Windows / macOS)</text>
  <rect x="350" y="370" width="260" height="45" rx="8" fill="#334155"/>
  <text x="480" y="398" text-anchor="middle" font-size="14" fill="#ffffff">하드웨어</text>
  <text x="480" y="440" text-anchor="middle" font-size="13" fill="#64748b">개발자 PC · 테스트</text>

  <!-- ===== KVM ===== -->
  <rect x="650" y="50" width="290" height="405" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="795" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">KVM (리눅스)</text>
  <text x="795" y="102" text-anchor="middle" font-size="13" fill="#64748b">커널 모듈 → Type 1로 분류</text>
  <g font-size="13" text-anchor="middle">
    <rect x="665" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="705" y="144" font-size="12" font-weight="700" fill="#1e3a8a">QEMU</text>
    <rect x="670" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="705" y="172" fill="#14532d">App</text>
    <rect x="670" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="705" y="208" fill="#7f1d1d">Guest</text><text x="705" y="226" fill="#7f1d1d">OS</text>
    <rect x="755" y="125" width="80" height="120" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="795" y="144" font-size="12" font-weight="700" fill="#1e3a8a">QEMU</text>
    <rect x="760" y="152" width="70" height="30" rx="5" fill="#86efac" stroke="#16a34a"/><text x="795" y="172" fill="#14532d">App</text>
    <rect x="760" y="188" width="70" height="50" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="795" y="208" fill="#7f1d1d">Guest</text><text x="795" y="226" fill="#7f1d1d">OS</text>
    <rect x="845" y="125" width="80" height="120" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="885" y="165" fill="#334155" font-weight="700">일반</text>
    <text x="885" y="183" fill="#334155" font-weight="700">프로세스</text>
    <text x="885" y="210" font-size="11" fill="#64748b">libvirtd</text>
    <text x="885" y="226" font-size="11" fill="#64748b">sshd</text>
  </g>
  <rect x="665" y="255" width="260" height="100" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="795" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Linux Kernel</text>
  <rect x="680" y="292" width="230" height="50" rx="6" fill="#f59e0b"/>
  <text x="795" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KVM 모듈 (kvm.ko · /dev/kvm)</text>
  <rect x="665" y="370" width="260" height="45" rx="8" fill="#334155"/>
  <text x="795" y="398" text-anchor="middle" font-size="14" fill="#ffffff">하드웨어 (VT-x / AMD-V)</text>
  <text x="795" y="440" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">VM = 호스트의 프로세스 하나</text>
</svg>
