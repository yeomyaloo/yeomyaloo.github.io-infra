<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Open vSwitch 아키텍처</text>

  <!-- user space -->
  <rect x="20" y="45" width="920" height="255" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="64" font-size="12" fill="#64748b">User space</text>

  <!-- clients -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" text-anchor="middle">
    <rect x="40" y="72" width="170" height="36" rx="18" fill="#e2e8f0"/><text x="125" y="95" fill="#0f172a">ovs-vsctl</text>
    <rect x="300" y="72" width="170" height="36" rx="18" fill="#e2e8f0"/><text x="385" y="95" fill="#0f172a">ovs-ofctl</text>
    <rect x="540" y="72" width="170" height="36" rx="18" fill="#e2e8f0"/><text x="625" y="95" fill="#0f172a">ovs-appctl</text>
  </g>
  <rect x="740" y="66" width="180" height="48" rx="8" fill="#ed1944"/>
  <text x="830" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SDN 컨트롤러</text>
  <text x="830" y="104" text-anchor="middle" font-size="11" fill="#ffffff">Neutron OVS agent · OVN</text>

  <!-- ovsdb-server -->
  <rect x="40" y="150" width="250" height="100" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="165" y="178" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="16" font-weight="700" fill="#312e81">ovsdb-server</text>
  <text x="165" y="202" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">conf.db</text>
  <text x="165" y="222" text-anchor="middle" font-size="12" fill="#312e81">브리지 · 포트 · 태그 · 터널 설정</text>
  <text x="165" y="240" text-anchor="middle" font-size="11" fill="#4f46e5">재부팅해도 유지</text>

  <!-- ovs-vswitchd -->
  <rect x="380" y="140" width="540" height="140" rx="10" fill="#2496ed"/>
  <text x="650" y="166" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="17" font-weight="700" fill="#ffffff">ovs-vswitchd</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="400" y="182" width="110" height="34" rx="6" fill="#dbeafe"/><text x="455" y="204" fill="#1e3a8a">table 0</text>
    <rect x="525" y="182" width="110" height="34" rx="6" fill="#dbeafe"/><text x="580" y="204" fill="#1e3a8a">table 1 …</text>
    <rect x="650" y="182" width="110" height="34" rx="6" fill="#dbeafe"/><text x="705" y="204" fill="#1e3a8a">NORMAL</text>
    <rect x="775" y="182" width="130" height="34" rx="6" fill="#dbeafe"/><text x="840" y="204" fill="#1e3a8a">MAC 학습</text>
  </g>
  <text x="650" y="242" text-anchor="middle" font-size="13" fill="#ffffff">OpenFlow 테이블로 "이 패킷을 어떻게 할지" 결정</text>
  <text x="650" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#fde68a">slow path — 캐시에 없는 첫 패킷만</text>

  <!-- kernel -->
  <rect x="20" y="310" width="920" height="95" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="32" y="329" font-size="12" fill="#4f46e5">Kernel space</text>
  <rect x="200" y="325" width="560" height="65" rx="10" fill="#f59e0b"/>
  <text x="480" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">openvswitch.ko — 커널 datapath</text>
  <text x="480" y="375" text-anchor="middle" font-size="12" fill="#ffffff">흐름 캐시(megaflow)에 매칭되면 바로 전달 = fast path</text>

  <!-- ports -->
  <g font-size="13" text-anchor="middle">
    <rect x="80" y="430" width="160" height="40" rx="8" fill="#86efac" stroke="#16a34a"/><text x="160" y="455" fill="#14532d">tap (VM)</text>
    <rect x="290" y="430" width="160" height="40" rx="8" fill="#86efac" stroke="#16a34a"/><text x="370" y="455" fill="#14532d">veth (netns)</text>
    <rect x="500" y="430" width="160" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="580" y="455" fill="#78350f">vxlan · geneve</text>
    <rect x="710" y="430" width="160" height="40" rx="8" fill="#334155"/><text x="790" y="455" fill="#ffffff">물리 NIC</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="160" y1="430" x2="260" y2="390"/>
    <line x1="370" y1="430" x2="400" y2="390"/>
    <line x1="580" y1="430" x2="560" y2="390"/>
    <line x1="790" y1="430" x2="700" y2="390"/>
  </g>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="125" y1="108" x2="140" y2="147" marker-end="url(#arrow)"/>
    <line x1="385" y1="108" x2="440" y2="137" marker-end="url(#arrow)"/>
    <line x1="625" y1="108" x2="625" y2="137" marker-end="url(#arrow)"/>
    <line x1="830" y1="114" x2="830" y2="137" marker-end="url(#arrow)"/>
    <line x1="293" y1="200" x2="377" y2="200" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="560" y1="280" x2="560" y2="322" marker-end="url(#arrow)"/>
    <line x1="720" y1="322" x2="720" y2="283" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="152" y="134">OVSDB</text>
    <text x="448" y="126">OpenFlow</text>
    <text x="633" y="128">제어 소켓</text>
    <text x="335" y="192" text-anchor="middle">OVSDB</text>
    <text x="552" y="297" text-anchor="end">③ 흐름 캐시 설치</text>
    <text x="728" y="297">② upcall (캐시 miss)</text>
  </g>
  <text x="780" y="352" font-size="12" font-weight="700" fill="#4f46e5">① 패킷 도착</text>
  <text x="780" y="372" font-size="12" font-weight="700" fill="#4f46e5">④ 이후 패킷은</text>
  <text x="780" y="388" font-size="12" font-weight="700" fill="#4f46e5">커널에서 바로</text>
</svg>
