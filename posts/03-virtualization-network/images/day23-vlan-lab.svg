<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">VLAN 실습 — VLAN-aware 브리지 + Router-on-a-stick</text>

  <!-- namespaces -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="60" width="150" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="115" y="85" font-size="16" font-weight="700" fill="#14532d">a1</text>
    <text x="115" y="108" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">10.0.10.11/24</text>
    <rect x="75" y="122" width="80" height="24" rx="12" fill="#16a34a"/><text x="115" y="139" font-size="12" fill="#ffffff">VLAN 10</text>

    <rect x="210" y="60" width="150" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="285" y="85" font-size="16" font-weight="700" fill="#14532d">a2</text>
    <text x="285" y="108" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">10.0.10.12/24</text>
    <rect x="245" y="122" width="80" height="24" rx="12" fill="#16a34a"/><text x="285" y="139" font-size="12" fill="#ffffff">VLAN 10</text>

    <rect x="600" y="60" width="150" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="675" y="85" font-size="16" font-weight="700" fill="#312e81">b1</text>
    <text x="675" y="108" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">10.0.20.21/24</text>
    <rect x="635" y="122" width="80" height="24" rx="12" fill="#4f46e5"/><text x="675" y="139" font-size="12" fill="#ffffff">VLAN 20</text>

    <rect x="770" y="60" width="150" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="845" y="85" font-size="16" font-weight="700" fill="#312e81">b2</text>
    <text x="845" y="108" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#312e81">10.0.20.22/24</text>
    <rect x="805" y="122" width="80" height="24" rx="12" fill="#4f46e5"/><text x="845" y="139" font-size="12" fill="#ffffff">VLAN 20</text>
  </g>

  <!-- r1 router -->
  <rect x="380" y="50" width="200" height="140" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">r1 (라우터)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="392" y="84" width="85" height="42" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="434" y="101" fill="#14532d">eth0.10</text><text x="434" y="118" fill="#14532d">10.0.10.1</text>
    <rect x="483" y="84" width="85" height="42" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="525" y="101" fill="#312e81">eth0.20</text><text x="525" y="118" fill="#312e81">10.0.20.1</text>
    <rect x="392" y="134" width="176" height="24" rx="6" fill="#fde68a"/>
    <text x="480" y="151" fill="#78350f">eth0 (trunk)</text>
  </g>
  <text x="480" y="178" text-anchor="middle" font-size="12" fill="#7c2d12">ip_forward=1</text>

  <!-- links -->
  <g stroke-width="4">
    <line x1="115" y1="160" x2="115" y2="225" stroke="#16a34a"/>
    <line x1="285" y1="160" x2="285" y2="225" stroke="#16a34a"/>
    <line x1="675" y1="160" x2="675" y2="225" stroke="#4f46e5"/>
    <line x1="845" y1="160" x2="845" y2="225" stroke="#4f46e5"/>
    <line x1="472" y1="190" x2="472" y2="225" stroke="#16a34a"/>
    <line x1="488" y1="190" x2="488" y2="225" stroke="#4f46e5"/>
  </g>

  <!-- ports -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <rect x="65" y="225" width="100" height="28" rx="6" fill="#ffffff" stroke="#334155"/><text x="115" y="244" fill="#0f172a">v-a1</text>
    <rect x="235" y="225" width="100" height="28" rx="6" fill="#ffffff" stroke="#334155"/><text x="285" y="244" fill="#0f172a">v-a2</text>
    <rect x="430" y="225" width="100" height="28" rx="6" fill="#ffffff" stroke="#334155"/><text x="480" y="244" fill="#0f172a">v-r1</text>
    <rect x="625" y="225" width="100" height="28" rx="6" fill="#ffffff" stroke="#334155"/><text x="675" y="244" fill="#0f172a">v-b1</text>
    <rect x="795" y="225" width="100" height="28" rx="6" fill="#ffffff" stroke="#334155"/><text x="845" y="244" fill="#0f172a">v-b2</text>
  </g>

  <!-- bridge -->
  <rect x="40" y="253" width="880" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <text x="115" y="276" fill="#16a34a">VID 10 · U · PVID</text>
    <text x="285" y="276" fill="#16a34a">VID 10 · U · PVID</text>
    <text x="480" y="276" fill="#b45309">VID 10, 20 · T</text>
    <text x="675" y="276" fill="#4f46e5">VID 20 · U · PVID</text>
    <text x="845" y="276" fill="#4f46e5">VID 20 · U · PVID</text>
  </g>
  <text x="480" y="315" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#0f172a">br0 (type bridge vlan_filtering 1)</text>

  <!-- legend / path -->
  <g font-size="13" fill="#334155">
    <text x="40" y="365"><tspan font-weight="700">U</tspan> = untagged (access 포트): 태그 없이 주고받고, PVID로 소속 VLAN을 정함</text>
    <text x="40" y="388"><tspan font-weight="700">T</tspan> = tagged (trunk 포트): 802.1Q 태그를 단 채로 여러 VLAN을 실어 나름</text>
  </g>
  <rect x="40" y="405" width="880" height="48" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="56" y="425" font-size="13" font-weight="700" fill="#7c2d12">a1 → b1 패킷 경로</text>
  <text x="56" y="444" font-size="12" fill="#7c2d12">a1 → v-a1(VLAN 10) → br0 → v-r1(태그 10) → eth0.10 → 라우팅 → eth0.20(태그 20) → br0 → v-b1(태그 제거) → b1</text>
</svg>
