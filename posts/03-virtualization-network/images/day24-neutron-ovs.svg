<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Neutron ML2/OVS — br-int · br-tun · br-ex</text>

  <!-- ===== Compute node ===== -->
  <rect x="20" y="45" width="440" height="385" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#334155">컴퓨트 노드</text>
  <g text-anchor="middle">
    <rect x="140" y="75" width="200" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="240" y="101" font-size="14" font-weight="700" fill="#7c2d12">인스턴스 (KVM VM)</text>
    <rect x="175" y="132" width="130" height="26" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="240" y="150" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">tapXXXX</text>
    <rect x="60" y="172" width="360" height="56" rx="8" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
    <text x="240" y="195" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#1e3a8a">br-int</text>
    <text x="240" y="216" font-size="12" fill="#1e3a8a">네트워크마다 로컬 VLAN 태그 (예: 1)</text>
    <text x="240" y="250" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#475569">patch-tun ↕ patch-int</text>
    <rect x="60" y="265" width="360" height="62" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="240" y="288" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#78350f">br-tun</text>
    <text x="240" y="310" font-size="12" fill="#78350f">흐름 규칙: 로컬 VLAN 1 ↔ VNI 100 (tun_id)</text>
    <rect x="170" y="340" width="140" height="28" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="240" y="359" font-size="12" fill="#78350f">vxlan 포트</text>
    <rect x="140" y="382" width="200" height="32" rx="8" fill="#334155"/>
    <text x="240" y="403" font-size="13" fill="#ffffff">NIC (터널망)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="240" y1="117" x2="240" y2="129" marker-end="url(#arrow)"/>
    <line x1="240" y1="158" x2="240" y2="169" marker-end="url(#arrow)"/>
    <line x1="150" y1="228" x2="150" y2="262" marker-end="url(#arrow)"/>
    <line x1="240" y1="327" x2="240" y2="337" marker-end="url(#arrow)"/>
    <line x1="240" y1="368" x2="240" y2="379" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Network node ===== -->
  <rect x="500" y="45" width="440" height="385" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="516" y="67" font-size="14" font-weight="700" fill="#334155">네트워크 노드</text>
  <g text-anchor="middle">
    <rect x="515" y="78" width="130" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="580" y="100" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#312e81">qdhcp-</text>
    <text x="580" y="119" font-size="11" fill="#312e81">네임스페이스</text>
    <text x="580" y="137" font-size="11" fill="#312e81">dnsmasq</text>
    <rect x="660" y="78" width="150" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="735" y="100" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#312e81">qrouter-</text>
    <text x="735" y="119" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#312e81">qr- ⇄ qg-</text>
    <text x="735" y="137" font-size="11" fill="#312e81">SNAT · Floating IP</text>
    <rect x="825" y="78" width="100" height="70" rx="8" fill="#fca5a5" stroke="#dc2626"/>
    <text x="875" y="104" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#7f1d1d">br-ex</text>
    <text x="875" y="125" font-size="11" fill="#7f1d1d">외부망 NIC</text>
    <text x="875" y="140" font-size="11" fill="#7f1d1d">→ 인터넷</text>

    <rect x="540" y="172" width="360" height="56" rx="8" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
    <text x="720" y="195" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#1e3a8a">br-int</text>
    <text x="720" y="216" font-size="12" fill="#1e3a8a">이 노드의 로컬 VLAN (예: 3) — 노드마다 다를 수 있음</text>
    <text x="720" y="250" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#475569">patch-tun ↕ patch-int</text>
    <rect x="540" y="265" width="360" height="62" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="720" y="288" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#78350f">br-tun</text>
    <text x="720" y="310" font-size="12" fill="#78350f">흐름 규칙: VNI 100 ↔ 로컬 VLAN 3</text>
    <rect x="650" y="340" width="140" height="28" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="720" y="359" font-size="12" fill="#78350f">vxlan 포트</text>
    <rect x="620" y="382" width="200" height="32" rx="8" fill="#334155"/>
    <text x="720" y="403" font-size="13" fill="#ffffff">NIC (터널망)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="720" y1="379" x2="720" y2="371" marker-end="url(#arrow)"/>
    <line x1="720" y1="340" x2="720" y2="330" marker-end="url(#arrow)"/>
    <line x1="830" y1="262" x2="830" y2="231" marker-end="url(#arrow)"/>
    <line x1="735" y1="172" x2="735" y2="151" marker-end="url(#arrow)"/>
    <line x1="810" y1="113" x2="822" y2="113" marker-end="url(#arrow)"/>
  </g>
  <line x1="580" y1="148" x2="580" y2="172" stroke="#4f46e5" stroke-width="2"/>

  <!-- tunnel -->
  <line x1="310" y1="354" x2="650" y2="354" stroke="#2496ed" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="405" y="341" width="150" height="26" rx="13" fill="#ffffff" stroke="#2496ed"/>
  <text x="480" y="359" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">VXLAN 터널 (VNI 100)</text>

  <!-- notes -->
  <text x="20" y="460" font-size="12" fill="#334155">• iptables_hybrid 방화벽이면 tap과 br-int 사이에 qbr(리눅스 브리지) + qvb/qvo(veth)가 추가됩니다.</text>
  <text x="20" y="482" font-size="12" fill="#334155">• ML2/OVN은 br-tun 없이 br-int 하나 + Geneve, 라우터·DHCP·보안 그룹을 br-int의 흐름 규칙으로 처리합니다.</text>
</svg>
