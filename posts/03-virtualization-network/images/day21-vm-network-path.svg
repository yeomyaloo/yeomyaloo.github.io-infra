<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">VM 패킷 경로 — libvirt default (NAT) 네트워크</text>

  <!-- Host -->
  <rect x="20" y="55" width="920" height="285" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="78" font-size="13" font-weight="700" fill="#334155">호스트 (Ubuntu 24.04)</text>

  <!-- VMs -->
  <rect x="40" y="90" width="160" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">vm1</text>
  <rect x="55" y="122" width="130" height="46" rx="6" fill="#fde68a"/>
  <text x="120" y="141" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#78350f">enp1s0</text>
  <text x="120" y="159" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">192.168.122.57</text>

  <rect x="40" y="210" width="160" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">vm2</text>
  <rect x="55" y="242" width="130" height="46" rx="6" fill="#fde68a"/>
  <text x="120" y="261" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#78350f">enp1s0</text>
  <text x="120" y="279" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">192.168.122.58</text>

  <!-- taps -->
  <text x="295" y="104" text-anchor="middle" font-size="11" fill="#64748b">QEMU가 여는 tap</text>
  <rect x="240" y="115" width="110" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
  <text x="295" y="140" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#14532d">vnet0</text>
  <rect x="240" y="235" width="110" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
  <text x="295" y="260" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#14532d">vnet1</text>

  <!-- bridge -->
  <rect x="390" y="100" width="150" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="475" y="170" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="17" font-weight="700" fill="#14532d">virbr0</text>
  <text x="475" y="192" text-anchor="middle" font-size="13" fill="#14532d">리눅스 브리지</text>
  <text x="475" y="214" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#14532d">192.168.122.1/24</text>

  <!-- routing + NAT -->
  <rect x="580" y="140" width="170" height="120" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="665" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">라우팅 + NAT</text>
  <text x="665" y="192" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">ip_forward = 1</text>
  <text x="665" y="214" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">MASQUERADE</text>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#78350f">출발지 → 호스트 IP</text>

  <!-- eth0 -->
  <rect x="790" y="170" width="130" height="60" rx="10" fill="#2496ed"/>
  <text x="855" y="196" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#ffffff">eth0</text>
  <text x="855" y="216" text-anchor="middle" font-size="12" fill="#ffffff">호스트 NIC</text>

  <text x="420" y="325" text-anchor="middle" font-size="12" fill="#64748b">Docker(Day 05)의 veth + docker0 + MASQUERADE 와 같은 구조 — 컨테이너는 veth, VM은 tap</text>

  <!-- Internet -->
  <ellipse cx="855" cy="380" rx="70" ry="24" fill="#e2e8f0" stroke="#64748b"/>
  <text x="855" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">인터넷</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="135" x2="237" y2="135" marker-end="url(#arrow)"/>
    <line x1="350" y1="135" x2="387" y2="135" marker-end="url(#arrow)"/>
    <line x1="200" y1="255" x2="237" y2="255" marker-end="url(#arrow)"/>
    <line x1="350" y1="255" x2="387" y2="255" marker-end="url(#arrow)"/>
    <line x1="540" y1="200" x2="577" y2="200" marker-end="url(#arrow)"/>
    <line x1="750" y1="200" x2="787" y2="200" marker-end="url(#arrow)"/>
    <line x1="855" y1="230" x2="855" y2="353" marker-end="url(#arrow)"/>
  </g>
  <path d="M 405 142 C 395 180, 395 220, 405 250" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowG)"/>
  <text x="475" y="245" text-anchor="middle" font-size="11" fill="#14532d">vm1 ↔ vm2</text>
  <text x="475" y="262" text-anchor="middle" font-size="11" fill="#14532d">(NAT 없이 L2 전달)</text>

  <!-- step badges -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="218" cy="118" r="10" fill="#334155"/><text x="218" y="122" fill="#ffffff">1</text>
    <circle cx="368" cy="118" r="10" fill="#334155"/><text x="368" y="122" fill="#ffffff">2</text>
    <circle cx="558" cy="182" r="10" fill="#334155"/><text x="558" y="186" fill="#ffffff">3</text>
    <circle cx="768" cy="182" r="10" fill="#334155"/><text x="768" y="186" fill="#ffffff">4</text>
    <circle cx="875" cy="290" r="10" fill="#334155"/><text x="875" y="294" fill="#ffffff">5</text>
  </g>
  <text x="40" y="372" font-size="13" fill="#334155">① VM NIC → ② tap(vnetN) → ③ virbr0 브리지 → ④ 라우팅 + SNAT → ⑤ 호스트 NIC</text>
  <text x="40" y="395" font-size="13" fill="#334155">같은 브리지에 붙은 VM끼리는 ③에서 바로 전달됩니다.</text>
</svg>
