<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">같은 부품, 다른 조립 — Docker · Kubernetes · OpenStack</text>

  <!-- column headers -->
  <rect x="20" y="48" width="290" height="40" rx="8" fill="#2496ed"/>
  <text x="165" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Docker (bridge)</text>
  <rect x="335" y="48" width="290" height="40" rx="8" fill="#326ce5"/>
  <text x="480" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Kubernetes (Flannel CNI)</text>
  <rect x="650" y="48" width="290" height="40" rx="8" fill="#ed1944"/>
  <text x="795" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OpenStack Neutron (ML2/OVS)</text>

  <!-- row 1: workload -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="105" width="250" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="165" y="126" font-weight="700" fill="#312e81">컨테이너</text>
    <text x="165" y="145" font-size="12" fill="#312e81">net namespace (eth0)</text>
    <rect x="355" y="105" width="250" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="480" y="126" font-weight="700" fill="#312e81">Pod</text>
    <text x="480" y="145" font-size="12" fill="#312e81">net namespace (pause 컨테이너)</text>
    <rect x="670" y="105" width="250" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="795" y="126" font-weight="700" fill="#7c2d12">인스턴스 (KVM VM)</text>
    <text x="795" y="145" font-size="12" fill="#7c2d12">virtio-net (eth0)</text>

    <!-- row 2: link -->
    <rect x="40" y="180" width="250" height="40" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="165" y="205" fill="#14532d">veth pair (eth0 ↔ vethXXXX)</text>
    <rect x="355" y="180" width="250" height="40" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="480" y="205" fill="#14532d">veth pair (eth0 ↔ vethXXXX)</text>
    <rect x="670" y="180" width="250" height="40" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="795" y="205" fill="#14532d">tap 장치 (tapXXXX)</text>

    <!-- row 3: switch -->
    <rect x="40" y="245" width="250" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="165" y="266" font-weight="700" fill="#14532d">docker0 브리지</text>
    <text x="165" y="285" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#14532d">172.17.0.1/16</text>
    <rect x="355" y="245" width="250" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="266" font-weight="700" fill="#14532d">cni0 브리지</text>
    <text x="480" y="285" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#14532d">10.244.N.1/24</text>
    <rect x="670" y="245" width="250" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="795" y="266" font-weight="700" fill="#14532d">br-int (OVS 브리지)</text>
    <text x="795" y="285" font-size="12" fill="#14532d">Day 24에서 자세히</text>

    <!-- row 4: exit -->
    <rect x="40" y="320" width="250" height="64" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="165" y="343" font-weight="700" fill="#78350f">호스트 라우팅 + NAT</text>
    <text x="165" y="363" font-size="12" fill="#78350f">MASQUERADE → eth0</text>
    <rect x="355" y="320" width="250" height="64" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="480" y="343" font-weight="700" fill="#78350f">노드 라우팅</text>
    <text x="480" y="363" font-size="12" fill="#78350f">타 노드 → flannel.1 (VXLAN)</text>
    <rect x="670" y="320" width="250" height="64" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="795" y="340" font-weight="700" fill="#78350f">qrouter- 네임스페이스</text>
    <text x="795" y="358" font-size="12" fill="#78350f">qr-/qg- · SNAT · Floating IP</text>
    <text x="795" y="376" font-size="12" fill="#78350f">→ br-ex → 외부</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="165" y1="155" x2="165" y2="177" marker-end="url(#arrow)"/>
    <line x1="165" y1="220" x2="165" y2="242" marker-end="url(#arrow)"/>
    <line x1="165" y1="295" x2="165" y2="317" marker-end="url(#arrow)"/>
    <line x1="480" y1="155" x2="480" y2="177" marker-end="url(#arrow)"/>
    <line x1="480" y1="220" x2="480" y2="242" marker-end="url(#arrow)"/>
    <line x1="480" y1="295" x2="480" y2="317" marker-end="url(#arrow)"/>
    <line x1="795" y1="155" x2="795" y2="177" marker-end="url(#arrow)"/>
    <line x1="795" y1="220" x2="795" y2="242" marker-end="url(#arrow)"/>
    <line x1="795" y1="295" x2="795" y2="317" marker-end="url(#arrow)"/>
  </g>

  <!-- common parts -->
  <rect x="20" y="405" width="920" height="48" rx="10" fill="#334155"/>
  <text x="480" y="435" text-anchor="middle" font-size="15" fill="#ffffff">공통 부품: network namespace · veth / tap · bridge(Linux 또는 OVS) · 라우팅 / NAT</text>
</svg>
