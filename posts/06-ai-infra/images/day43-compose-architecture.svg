<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="570" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RAG 스택 전체 아키텍처 — compose.yaml 하나</text>

  <!-- 바깥: 사용자, Cloudflare -->
  <rect x="20" y="80" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">브라우저</text>
  <text x="85" y="128" text-anchor="middle" font-size="12" fill="#64748b">외부 사용자</text>
  <rect x="20" y="190" width="130" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="85" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Cloudflare</text>
  <text x="85" y="236" text-anchor="middle" font-size="12" fill="#7c2d12">엣지 (HTTPS)</text>

  <!-- 호스트 -->
  <rect x="170" y="55" width="770" height="500" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="186" y="78" font-size="14" font-weight="700" fill="#334155">홈랩 서버 (Docker host) · compose 프로젝트 infra-rag</text>

  <!-- cloudflared -->
  <rect x="190" y="95" width="150" height="62" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="265" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">cloudflared</text>
  <text x="265" y="140" text-anchor="middle" font-size="12" fill="#7c2d12">H03 · systemd 서비스</text>

  <!-- web -->
  <rect x="190" y="220" width="150" height="80" rx="8" fill="#2496ed"/>
  <text x="265" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">web (nginx)</text>
  <text x="265" y="266" text-anchor="middle" font-size="12" fill="#ffffff">index.html + 프록시</text>
  <text x="265" y="286" text-anchor="middle" font-size="12" fill="#dbeafe" font-family="Consolas,'D2Coding',monospace">127.0.0.1:8080</text>

  <!-- rag-api -->
  <rect x="380" y="220" width="165" height="80" rx="8" fill="#7c3aed"/>
  <text x="462" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rag-api</text>
  <text x="462" y="266" text-anchor="middle" font-size="12" fill="#ffffff">FastAPI · non-root</text>
  <text x="462" y="286" text-anchor="middle" font-size="12" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">:8000 /ask</text>

  <!-- indexer -->
  <rect x="380" y="370" width="165" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="462" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">indexer (job)</text>
  <text x="462" y="415" text-anchor="middle" font-size="12" fill="#4c1d95">같은 이미지, 1회 실행</text>
  <text x="462" y="434" text-anchor="middle" font-size="12" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">ingest.py /docs</text>

  <!-- docs -->
  <rect x="190" y="378" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="265" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">./docs (infra 레포)</text>
  <text x="265" y="423" text-anchor="middle" font-size="12" fill="#64748b">bind mount · 읽기 전용</text>

  <!-- LLM 그룹 -->
  <rect x="600" y="90" width="325" height="125" rx="10" fill="#eff6ff" stroke="#2496ed"/>
  <text x="614" y="110" font-size="13" font-weight="700" fill="#1e3a8a">LLM — 프로필로 하나만 뜬다</text>
  <rect x="614" y="120" width="145" height="50" rx="6" fill="#ffffff" stroke="#2496ed"/>
  <text x="686" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ollama</text>
  <text x="686" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">:11434</text>
  <rect x="614" y="176" width="145" height="30" rx="6" fill="#ffffff" stroke="#2496ed" stroke-dasharray="4 3"/>
  <text x="686" y="196" text-anchor="middle" font-size="12" fill="#1e3a8a">ollama-pull (job)</text>
  <rect x="769" y="120" width="145" height="86" rx="6" fill="#2496ed"/>
  <text x="841" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">vllm</text>
  <text x="841" y="162" text-anchor="middle" font-size="12" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">:8000</text>
  <rect x="801" y="172" width="80" height="24" rx="4" fill="#86efac"/>
  <text x="841" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">GPU ×1</text>
  <!-- 프로필 태그 -->
  <rect x="717" y="124" width="38" height="18" rx="4" fill="#fde68a"/>
  <text x="736" y="138" text-anchor="middle" font-size="11" fill="#78350f" font-family="Consolas,'D2Coding',monospace">cpu</text>
  <rect x="872" y="124" width="38" height="18" rx="4" fill="#fde68a"/>
  <text x="891" y="138" text-anchor="middle" font-size="11" fill="#78350f" font-family="Consolas,'D2Coding',monospace">gpu</text>

  <!-- embed -->
  <rect x="600" y="230" width="325" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="614" y="252" font-size="14" font-weight="700" fill="#4c1d95">embed (TEI cpu)</text>
  <text x="614" y="271" font-size="12" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">BAAI/bge-m3 · :80/v1/embeddings</text>

  <!-- reranker -->
  <rect x="600" y="292" width="325" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="6 4"/>
  <text x="614" y="314" font-size="14" font-weight="700" fill="#4c1d95">reranker (선택)</text>
  <text x="614" y="333" font-size="12" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">BAAI/bge-reranker-v2-m3 · /rerank</text>
  <rect x="868" y="300" width="50" height="18" rx="4" fill="#fde68a"/>
  <text x="893" y="314" text-anchor="middle" font-size="11" fill="#78350f" font-family="Consolas,'D2Coding',monospace">rerank</text>

  <!-- qdrant -->
  <rect x="600" y="356" width="325" height="70" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="614" y="380" font-size="14" font-weight="700" fill="#78350f">qdrant</text>
  <text x="614" y="400" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">:6333 · collection infra_docs</text>
  <text x="614" y="417" font-size="12" fill="#78350f">healthcheck: /readyz</text>

  <!-- 볼륨 -->
  <text x="190" y="497" font-size="13" font-weight="700" fill="#334155">named volumes</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="320" y="478" width="130" height="30" rx="15" fill="#e2e8f0"/><text x="385" y="498" fill="#0f172a">qdrant_data</text>
    <rect x="465" y="478" width="130" height="30" rx="15" fill="#e2e8f0"/><text x="530" y="498" fill="#0f172a">tei_data</text>
    <rect x="610" y="478" width="130" height="30" rx="15" fill="#e2e8f0"/><text x="675" y="498" fill="#0f172a">ollama_data</text>
    <rect x="755" y="478" width="130" height="30" rx="15" fill="#e2e8f0"/><text x="820" y="498" fill="#0f172a">hf_cache</text>
  </g>
  <text x="190" y="535" font-size="12" fill="#64748b">컨테이너를 지워도 모델·인덱스는 남는다 (docker compose down -v 를 하기 전까지)</text>

  <!-- 화살표: 요청 경로 -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="85" y1="140" x2="85" y2="187" marker-end="url(#arrow)"/>
    <line x1="150" y1="210" x2="187" y2="140" marker-end="url(#arrow)"/>
    <line x1="265" y1="157" x2="265" y2="217" marker-end="url(#arrow)"/>
    <line x1="340" y1="260" x2="377" y2="260" marker-end="url(#arrow)"/>
    <line x1="545" y1="235" x2="597" y2="160" marker-end="url(#arrow)"/>
    <line x1="545" y1="250" x2="597" y2="255" marker-end="url(#arrow)"/>
    <line x1="545" y1="270" x2="597" y2="372" marker-end="url(#arrow)"/>
  </g>
  <line x1="545" y1="260" x2="597" y2="317" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
  <text x="358" y="252" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">/api/</text>

  <!-- 화살표: 인덱싱 경로 -->
  <g stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="340" y1="408" x2="377" y2="408" marker-end="url(#arrowP)"/>
    <line x1="545" y1="390" x2="597" y2="275" marker-end="url(#arrowP)"/>
    <line x1="545" y1="410" x2="597" y2="400" marker-end="url(#arrowP)"/>
  </g>
</svg>
