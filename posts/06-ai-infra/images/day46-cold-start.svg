<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">0 → 1 콜드스타트: 무엇이 시간을 잡아먹나</text>

  <!-- row 1: nothing prepared -->
  <text x="20" y="86" font-size="14" font-weight="700" fill="#7f1d1d">준비 없음</text>
  <text x="20" y="106" font-size="11" fill="#64748b">수 분 ~ 15분</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <rect x="130" y="70" width="170" height="44" fill="#cbd5e1"/>
    <text x="215" y="97" fill="#0f172a">GPU 노드 준비</text>
    <rect x="300" y="70" width="210" height="44" fill="#bfdbfe"/>
    <text x="405" y="97" fill="#1e3a8a">이미지 pull (10GB+)</text>
    <rect x="510" y="70" width="190" height="44" fill="#fde68a"/>
    <text x="605" y="97" fill="#78350f">모델 다운로드</text>
    <rect x="700" y="70" width="110" height="44" fill="#fed7aa"/>
    <text x="755" y="97" fill="#7c2d12">로딩</text>
    <rect x="810" y="70" width="80" height="44" fill="#fecaca"/>
    <text x="850" y="97" fill="#7f1d1d">그래프</text>
    <rect x="890" y="70" width="50" height="44" fill="#86efac"/>
    <text x="915" y="97" fill="#14532d">✔</text>
  </g>

  <!-- row 2: prepared -->
  <text x="20" y="166" font-size="14" font-weight="700" fill="#14532d">준비 완료</text>
  <text x="20" y="186" font-size="11" fill="#64748b">수십 초</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <rect x="130" y="150" width="20" height="44" fill="#cbd5e1"/>
    <rect x="150" y="150" width="20" height="44" fill="#bfdbfe"/>
    <rect x="170" y="150" width="10" height="44" fill="#fde68a"/>
    <rect x="180" y="150" width="110" height="44" fill="#fed7aa"/>
    <text x="235" y="177" fill="#7c2d12">로딩</text>
    <rect x="290" y="150" width="80" height="44" fill="#fecaca"/>
    <text x="330" y="177" fill="#7f1d1d">그래프</text>
    <rect x="370" y="150" width="50" height="44" fill="#86efac"/>
    <text x="395" y="177" fill="#14532d">✔</text>
  </g>
  <text x="440" y="177" font-size="12" fill="#334155">← 노드 · 이미지 · 모델이 이미 노드에 있음</text>

  <!-- remedies -->
  <text x="20" y="236" font-size="15" font-weight="700" fill="#0f172a">구간별 대응</text>
  <g font-size="12">
    <rect x="20" y="250" width="222" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="36" y="276" font-weight="700" fill="#0f172a">GPU 노드</text>
    <text x="36" y="300" fill="#334155">노드 상시 유지</text>
    <text x="36" y="320" fill="#334155">오버프로비저닝 (여유 1대)</text>
    <text x="36" y="340" fill="#334155">Cluster Autoscaler</text>
    <text x="36" y="360" fill="#334155">/ Karpenter (개념)</text>

    <rect x="254" y="250" width="222" height="150" rx="10" fill="#eff6ff" stroke="#2496ed"/>
    <text x="270" y="276" font-weight="700" fill="#1e3a8a">이미지</text>
    <text x="270" y="300" fill="#334155">프리풀 DaemonSet</text>
    <text x="270" y="320" fill="#334155">태그 고정 + IfNotPresent</text>
    <text x="270" y="340" fill="#334155">업그레이드 시 DaemonSet</text>
    <text x="270" y="360" fill="#334155">태그부터 먼저 교체</text>

    <rect x="488" y="250" width="222" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="504" y="276" font-weight="700" fill="#92400e">모델</text>
    <text x="504" y="300" fill="#334155">모델 캐시 PVC (Day 45)</text>
    <text x="504" y="320" fill="#334155">다운로드 Job으로 미리</text>
    <text x="504" y="340" fill="#334155">빠른 로컬 디스크 (NVMe)</text>
    <text x="504" y="360" fill="#334155">작은 · 양자화 모델</text>

    <rect x="722" y="250" width="218" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="738" y="276" font-weight="700" fill="#5b21b6">시점 · 엔진</text>
    <text x="738" y="300" fill="#334155">cron으로 미리 깨우기</text>
    <text x="738" y="320" fill="#334155">--enforce-eager</text>
    <text x="738" y="340" fill="#334155">(그래프 캡처 생략)</text>
    <text x="738" y="360" fill="#334155">클라이언트 재시도</text>
  </g>
</svg>
