<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GPU 한 장을 나눠 쓰는 두 가지 방법</text>

  <!-- Time-slicing -->
  <rect x="20" y="60" width="450" height="420" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Time-slicing (소프트웨어)</text>
  <text x="245" y="112" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">replicas: 4 → nvidia.com/gpu: 4</text>

  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="45" y="128" width="92" height="38" rx="6" fill="#86efac"/><text x="91" y="152" fill="#14532d">Pod A</text>
    <rect x="147" y="128" width="92" height="38" rx="6" fill="#93c5fd"/><text x="193" y="152" fill="#1e3a8a">Pod B</text>
    <rect x="249" y="128" width="92" height="38" rx="6" fill="#fca5a5"/><text x="295" y="152" fill="#7f1d1d">Pod C</text>
    <rect x="351" y="128" width="92" height="38" rx="6" fill="#c7d2fe"/><text x="397" y="152" fill="#312e81">Pod D</text>
  </g>

  <!-- GPU box for TS -->
  <rect x="45" y="186" width="398" height="200" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="244" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">물리 GPU 1장</text>
  <text x="65" y="236" font-size="12" fill="#334155">연산(SM) — 시간 순서로 번갈아</text>
  <g>
    <rect x="65" y="246" width="60" height="30" fill="#86efac"/>
    <rect x="125" y="246" width="60" height="30" fill="#93c5fd"/>
    <rect x="185" y="246" width="60" height="30" fill="#fca5a5"/>
    <rect x="245" y="246" width="60" height="30" fill="#c7d2fe"/>
    <rect x="305" y="246" width="60" height="30" fill="#86efac"/>
    <rect x="365" y="246" width="58" height="30" fill="#93c5fd"/>
  </g>
  <text x="65" y="300" font-size="12" fill="#334155">VRAM 24GB — 모두가 한 공간을 공유</text>
  <rect x="65" y="310" width="358" height="34" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="65" y="310" width="250" height="34" fill="#86efac" opacity="0.8"/>
  <text x="190" y="332" text-anchor="middle" font-size="12" fill="#14532d">Pod A가 18GB 사용</text>
  <text x="369" y="332" text-anchor="middle" font-size="12" fill="#7f1d1d">나머지 OOM</text>
  <text x="244" y="372" text-anchor="middle" font-size="12" fill="#64748b">메모리 · 장애 격리 없음</text>

  <g font-size="13" fill="#334155">
    <text x="45" y="414">✔ 거의 모든 NVIDIA GPU (RTX 포함)</text>
    <text x="45" y="438">✔ 설정은 ConfigMap 하나</text>
    <text x="45" y="462">✘ 성능 예측 어려움, 개발 · 실험용</text>
  </g>

  <!-- MIG -->
  <rect x="490" y="60" width="450" height="420" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="715" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">MIG (하드웨어 파티션)</text>
  <text x="715" y="112" text-anchor="middle" font-size="12" fill="#64748b" font-family="Consolas,'D2Coding',monospace">mig.config=all-1g.5gb (A100 40GB)</text>

  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="515" y="128" width="92" height="38" rx="6" fill="#86efac"/><text x="561" y="152" fill="#14532d">Pod A</text>
    <rect x="617" y="128" width="92" height="38" rx="6" fill="#93c5fd"/><text x="663" y="152" fill="#1e3a8a">Pod B</text>
    <rect x="719" y="128" width="92" height="38" rx="6" fill="#fca5a5"/><text x="765" y="152" fill="#7f1d1d">Pod C</text>
    <rect x="821" y="128" width="92" height="38" rx="6" fill="#c7d2fe"/><text x="867" y="152" fill="#312e81">Pod D</text>
  </g>

  <rect x="515" y="186" width="398" height="200" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="714" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">물리 GPU 1장 → 독립 인스턴스</text>
  <g font-size="12" text-anchor="middle">
    <rect x="530" y="226" width="86" height="118" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="573" y="262" fill="#14532d" font-weight="700">1g.5gb</text>
    <text x="573" y="284" fill="#14532d">SM 1/7</text>
    <text x="573" y="304" fill="#14532d">VRAM 5GB</text>
    <rect x="626" y="226" width="86" height="118" rx="6" fill="#93c5fd" stroke="#2563eb"/>
    <text x="669" y="262" fill="#1e3a8a" font-weight="700">1g.5gb</text>
    <text x="669" y="284" fill="#1e3a8a">SM 1/7</text>
    <text x="669" y="304" fill="#1e3a8a">VRAM 5GB</text>
    <rect x="722" y="226" width="86" height="118" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <text x="765" y="262" fill="#7f1d1d" font-weight="700">1g.5gb</text>
    <text x="765" y="284" fill="#7f1d1d">SM 1/7</text>
    <text x="765" y="304" fill="#7f1d1d">VRAM 5GB</text>
    <rect x="818" y="226" width="86" height="118" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="861" y="262" fill="#312e81" font-weight="700">1g.5gb</text>
    <text x="861" y="284" fill="#312e81">SM 1/7</text>
    <text x="861" y="304" fill="#312e81">VRAM 5GB</text>
  </g>
  <text x="714" y="372" text-anchor="middle" font-size="12" fill="#64748b">연산 · 메모리 · 장애가 인스턴스마다 분리</text>

  <g font-size="13" fill="#334155">
    <text x="515" y="414">✔ 격리 확실, 성능 예측 가능</text>
    <text x="515" y="438">✔ 멀티테넌트 운영 · SLA 추론</text>
    <text x="515" y="462">✘ A100 / H100 등 일부 GPU만, 고정 프로필</text>
  </g>
</svg>
