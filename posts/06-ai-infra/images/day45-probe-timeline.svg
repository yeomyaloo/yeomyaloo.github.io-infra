<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LLM Pod 시작 타임라인과 3가지 Probe</text>

  <!-- phases -->
  <text x="20" y="92" font-size="13" font-weight="700" fill="#334155">컨테이너</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <rect x="130" y="70" width="150" height="36" rx="6" fill="#e2e8f0"/>
    <text x="205" y="93" fill="#334155">이미지 pull</text>
    <rect x="280" y="70" width="170" height="36" fill="#fde68a"/>
    <text x="365" y="93" fill="#78350f">모델 다운로드*</text>
    <rect x="450" y="70" width="140" height="36" fill="#fed7aa"/>
    <text x="520" y="93" fill="#7c2d12">GPU 로딩</text>
    <rect x="590" y="70" width="110" height="36" fill="#fecaca"/>
    <text x="645" y="93" fill="#7f1d1d">KV · 그래프</text>
    <rect x="700" y="70" width="240" height="36" rx="6" fill="#86efac"/>
    <text x="820" y="93" fill="#14532d">서빙 (:8000 열림)</text>
  </g>
  <text x="365" y="124" text-anchor="middle" font-size="11" fill="#64748b">* PVC 캐시가 있으면 거의 0</text>

  <!-- time axis -->
  <line x1="130" y1="150" x2="940" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="130" y="168">0</text>
    <text x="280" y="168">컨테이너 시작</text>
    <text x="700" y="168">/health = 200</text>
  </g>
  <line x1="280" y1="144" x2="280" y2="156" stroke="#334155" stroke-width="2"/>
  <line x1="700" y1="144" x2="700" y2="156" stroke="#16a34a" stroke-width="2"/>

  <!-- startup -->
  <text x="20" y="212" font-size="13" font-weight="700" fill="#334155">startupProbe</text>
  <rect x="280" y="192" width="420" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <g fill="#dc2626" font-size="13" text-anchor="middle" font-weight="700">
    <text x="310" y="212">✘</text><text x="370" y="212">✘</text><text x="430" y="212">✘</text>
    <text x="490" y="212">✘</text><text x="550" y="212">✘</text><text x="610" y="212">✘</text><text x="670" y="212">✘</text>
  </g>
  <text x="712" y="212" font-size="13" font-weight="700" fill="#16a34a">✔ 통과 → 역할 끝</text>
  <text x="290" y="240" font-size="11" fill="#64748b">10초 간격 × failureThreshold 60 = 최대 10분. 이 동안은 실패해도 재시작 안 함</text>

  <!-- readiness -->
  <text x="20" y="282" font-size="13" font-weight="700" fill="#334155">readinessProbe</text>
  <rect x="280" y="262" width="420" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="490" y="282" text-anchor="middle" font-size="12" fill="#64748b">대기 (실행 안 함)</text>
  <rect x="700" y="262" width="240" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="820" y="282" text-anchor="middle" font-size="12" fill="#14532d">5초 간격 · 실패 시 엔드포인트 제외</text>

  <!-- liveness -->
  <text x="20" y="332" font-size="13" font-weight="700" fill="#334155">livenessProbe</text>
  <rect x="280" y="312" width="420" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="490" y="332" text-anchor="middle" font-size="12" fill="#64748b">대기 (실행 안 함)</text>
  <rect x="700" y="312" width="240" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="820" y="332" text-anchor="middle" font-size="12" fill="#5b21b6">15초 간격 · 3회 실패 시 재시작</text>

  <!-- warning -->
  <rect x="20" y="364" width="920" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="40" y="389" font-size="13" font-weight="700" fill="#7f1d1d">startupProbe 없이 livenessProbe만 걸면?</text>
  <text x="40" y="411" font-size="12" fill="#334155">로딩 중(:8000 닫힘)에 실패 누적 → 재시작 → 처음부터 다시 로딩 → 또 재시작 … 영원히 Ready가 되지 못한다</text>
</svg>
