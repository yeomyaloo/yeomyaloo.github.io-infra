<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">프리필과 디코드, 그리고 KV 캐시</text>

  <!-- Prefill panel -->
  <rect x="20" y="56" width="400" height="224" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#1e3a8a">① 프리필 (Prefill)</text>
  <g font-size="13" text-anchor="middle" fill="#1e3a8a">
    <rect x="40" y="102" width="64" height="28" rx="6" fill="#bfdbfe"/><text x="72" y="121">한국</text>
    <rect x="112" y="102" width="64" height="28" rx="6" fill="#bfdbfe"/><text x="144" y="121">의</text>
    <rect x="184" y="102" width="64" height="28" rx="6" fill="#bfdbfe"/><text x="216" y="121">수도</text>
    <rect x="256" y="102" width="64" height="28" rx="6" fill="#bfdbfe"/><text x="288" y="121">는</text>
    <rect x="328" y="102" width="64" height="28" rx="6" fill="#bfdbfe"/><text x="360" y="121">?</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="72" y1="130" x2="72" y2="149" marker-end="url(#arrow)"/>
    <line x1="144" y1="130" x2="144" y2="149" marker-end="url(#arrow)"/>
    <line x1="216" y1="130" x2="216" y2="149" marker-end="url(#arrow)"/>
    <line x1="288" y1="130" x2="288" y2="149" marker-end="url(#arrow)"/>
    <line x1="360" y1="130" x2="360" y2="149" marker-end="url(#arrow)"/>
    <line x1="216" y1="192" x2="216" y2="211" marker-end="url(#arrow)"/>
  </g>
  <rect x="40" y="152" width="352" height="40" rx="8" fill="#2496ed"/>
  <text x="216" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">모델 — 입력 토큰 5개를 한 번에 병렬 처리</text>
  <rect x="176" y="214" width="80" height="28" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="216" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">서울</text>
  <text x="266" y="233" font-size="12" fill="#475569">← 첫 토큰</text>
  <text x="220" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">병목: 연산량(FLOPS) · 지표: TTFT</text>

  <!-- Decode panel -->
  <rect x="440" y="56" width="500" height="224" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="84" font-size="16" font-weight="700" fill="#78350f">② 디코드 (Decode) — 한 번에 토큰 1개씩</text>

  <g font-size="13" text-anchor="middle" fill="#78350f">
    <rect x="490" y="102" width="80" height="28" rx="6" fill="#fde68a"/><text x="530" y="121">서울</text>
    <rect x="650" y="102" width="80" height="28" rx="6" fill="#fde68a"/><text x="690" y="121">입니다</text>
    <rect x="810" y="102" width="80" height="28" rx="6" fill="#fde68a"/><text x="850" y="121">.</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="475" y="152" width="110" height="40" rx="8" fill="#f59e0b"/><text x="530" y="177">모델 (1단계)</text>
    <rect x="635" y="152" width="110" height="40" rx="8" fill="#f59e0b"/><text x="690" y="177">모델 (2단계)</text>
    <rect x="795" y="152" width="110" height="40" rx="8" fill="#f59e0b"/><text x="850" y="177">모델 (3단계)</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#78350f">
    <rect x="490" y="214" width="80" height="28" rx="6" fill="#ffffff" stroke="#f59e0b"/><text x="530" y="233">입니다</text>
    <rect x="650" y="214" width="80" height="28" rx="6" fill="#ffffff" stroke="#f59e0b"/><text x="690" y="233">.</text>
    <rect x="810" y="214" width="80" height="28" rx="6" fill="#ffffff" stroke="#f59e0b"/><text x="850" y="233">&lt;끝&gt;</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="530" y1="130" x2="530" y2="149" marker-end="url(#arrow)"/>
    <line x1="690" y1="130" x2="690" y2="149" marker-end="url(#arrow)"/>
    <line x1="850" y1="130" x2="850" y2="149" marker-end="url(#arrow)"/>
    <line x1="530" y1="192" x2="530" y2="211" marker-end="url(#arrow)"/>
    <line x1="690" y1="192" x2="690" y2="211" marker-end="url(#arrow)"/>
    <line x1="850" y1="192" x2="850" y2="211" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="570" y1="226" x2="648" y2="120" marker-end="url(#arrow)"/>
    <line x1="730" y1="226" x2="808" y2="120" marker-end="url(#arrow)"/>
  </g>
  <text x="690" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">병목: 메모리 대역폭(GB/s) · 지표: 토큰/초, TPOT</text>

  <!-- KV cache panel -->
  <rect x="20" y="300" width="920" height="180" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="328" font-size="15" font-weight="700" fill="#0f172a">KV 캐시 (GPU VRAM) — 토큰마다, 층마다 K·V 벡터를 저장해 재사용</text>

  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="62" y="365">K</text>
    <text x="62" y="401">V</text>
  </g>
  <g stroke="#2496ed" fill="#bfdbfe">
    <rect x="90" y="346" width="70" height="28" rx="4"/><rect x="90" y="382" width="70" height="28" rx="4"/>
    <rect x="166" y="346" width="70" height="28" rx="4"/><rect x="166" y="382" width="70" height="28" rx="4"/>
    <rect x="242" y="346" width="70" height="28" rx="4"/><rect x="242" y="382" width="70" height="28" rx="4"/>
    <rect x="318" y="346" width="70" height="28" rx="4"/><rect x="318" y="382" width="70" height="28" rx="4"/>
    <rect x="394" y="346" width="70" height="28" rx="4"/><rect x="394" y="382" width="70" height="28" rx="4"/>
  </g>
  <g stroke="#f59e0b" fill="#fde68a">
    <rect x="470" y="346" width="70" height="28" rx="4"/><rect x="470" y="382" width="70" height="28" rx="4"/>
    <rect x="546" y="346" width="70" height="28" rx="4"/><rect x="546" y="382" width="70" height="28" rx="4"/>
    <rect x="622" y="346" width="70" height="28" rx="4"/><rect x="622" y="382" width="70" height="28" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#475569">
    <text x="125" y="428">한국</text>
    <text x="201" y="428">의</text>
    <text x="277" y="428">수도</text>
    <text x="353" y="428">는</text>
    <text x="429" y="428">?</text>
    <text x="505" y="428">서울</text>
    <text x="581" y="428">입니다</text>
    <text x="657" y="428">.</text>
  </g>

  <g font-size="13" fill="#334155">
    <rect x="716" y="348" width="14" height="14" fill="#bfdbfe" stroke="#2496ed"/>
    <text x="738" y="360">프리필에서 한 번에 채움</text>
    <rect x="716" y="374" width="14" height="14" fill="#fde68a" stroke="#f59e0b"/>
    <text x="738" y="386">디코드 때 한 칸씩 추가</text>
    <text x="716" y="414" font-weight="700">토큰당 크기 =</text>
    <text x="716" y="434">2 × 층 × KV헤드</text>
    <text x="716" y="454">× 헤드차원 × 바이트</text>
  </g>
  <text x="40" y="460" font-size="13" fill="#475569">디코드의 매 단계는 KV 캐시 전체를 읽고(어텐션), 새 토큰의 K·V를 한 칸 추가한다</text>
</svg>
