<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ollama + Open WebUI — Docker Compose 구성</text>

  <!-- Clients -->
  <rect x="20" y="120" width="170" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">LAN의 PC</text>
  <text x="105" y="167" text-anchor="middle" font-size="12" fill="#475569">브라우저</text>
  <text x="105" y="190" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#0f172a">192.168.0.10:3000</text>

  <rect x="20" y="256" width="170" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">호스트 셸 (SSH)</text>
  <text x="105" y="304" text-anchor="middle" font-size="12" fill="#475569">curl · Python · FastAPI</text>
  <text x="105" y="324" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#0f172a">127.0.0.1:11434</text>

  <!-- Host -->
  <rect x="230" y="56" width="710" height="396" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="80" font-size="14" font-weight="700" fill="#334155">홈랩 서버 — Ubuntu 24.04 + Docker</text>

  <!-- Compose network -->
  <rect x="250" y="94" width="476" height="262" rx="10" fill="#eff6ff" stroke="#2496ed" stroke-dasharray="6 4"/>
  <text x="262" y="346" font-size="12" fill="#1e3a8a">Compose 네트워크 — 서비스 이름으로 DNS 조회 (Day 05)</text>

  <!-- Open WebUI -->
  <rect x="270" y="116" width="180" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">open-webui</text>
  <text x="360" y="164" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">open-webui:v0.13.3</text>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#14532d">채팅 UI · 사용자 관리</text>
  <text x="360" y="208" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">컨테이너 :8080</text>

  <!-- Ollama -->
  <rect x="540" y="116" width="170" height="214" rx="10" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="625" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ollama</text>
  <text x="625" y="164" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#1e3a8a">ollama/ollama:0.40.16</text>
  <text x="625" y="186" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#1e3a8a">컨테이너 :11434</text>
  <text x="625" y="214" text-anchor="middle" font-size="12" fill="#475569">로드된 모델</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle" fill="#78350f">
    <rect x="556" y="224" width="138" height="28" rx="6" fill="#fde68a"/><text x="625" y="243">qwen2.5:1.5b</text>
    <rect x="556" y="260" width="138" height="28" rx="6" fill="#fde68a"/><text x="625" y="279">infra-helper</text>
  </g>
  <text x="625" y="314" text-anchor="middle" font-size="11" fill="#475569">KEEP_ALIVE 30m</text>

  <!-- Arrows: clients -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="190" y1="165" x2="267" y2="165" marker-end="url(#arrow)"/>
    <line x1="450" y1="171" x2="537" y2="171" marker-end="url(#arrow)"/>
    <line x1="190" y1="296" x2="537" y2="296" marker-end="url(#arrow)"/>
  </g>
  <rect x="196" y="145" width="68" height="15" fill="#ffffff"/>
  <text x="230" y="156" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" font-weight="700" fill="#334155">3000→8080</text>
  <text x="494" y="162" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" font-weight="700" fill="#334155">ollama:11434</text>
  <text x="455" y="316" text-anchor="middle" font-size="12" fill="#334155">127.0.0.1에만 공개</text>

  <!-- Right column: GPU, registry, modelfiles -->
  <rect x="756" y="110" width="166" height="84" rx="10" fill="#334155"/>
  <text x="839" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">NVIDIA GPU</text>
  <text x="839" y="158" text-anchor="middle" font-size="12" fill="#e2e8f0">Container Toolkit</text>
  <text x="839" y="179" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#e2e8f0">compose.gpu.yaml</text>
  <text x="839" y="214" text-anchor="middle" font-size="11" fill="#64748b">GPU가 없으면 CPU로 자동 실행</text>

  <rect x="756" y="236" width="166" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="839" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">ollama.com</text>
  <text x="839" y="281" text-anchor="middle" font-size="12" fill="#7c2d12">모델 라이브러리</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="756" y1="152" x2="713" y2="152" marker-end="url(#arrow)"/>
    <line x1="756" y1="266" x2="713" y2="266" marker-end="url(#arrow)"/>
  </g>
  <text x="734" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">pull</text>

  <!-- Volumes -->
  <g>
    <rect x="270" y="380" width="180" height="52" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="360" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">볼륨 open-webui</text>
    <text x="360" y="421" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">/app/backend/data</text>

    <rect x="540" y="380" width="170" height="52" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="625" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">볼륨 ollama (모델)</text>
    <text x="625" y="421" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#1e3a8a">/root/.ollama</text>

    <rect x="756" y="380" width="166" height="52" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="839" y="402" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#4c1d95">./modelfiles</text>
    <text x="839" y="421" text-anchor="middle" font-size="11" fill="#4c1d95">bind mount · 읽기 전용</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="360" y1="226" x2="360" y2="377" marker-end="url(#arrow)"/>
    <line x1="625" y1="330" x2="625" y2="377" marker-end="url(#arrow)"/>
    <line x1="790" y1="380" x2="706" y2="326" marker-end="url(#arrowP)" stroke="#7c3aed"/>
  </g>
</svg>
