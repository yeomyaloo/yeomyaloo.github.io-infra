<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">기동 순서 — healthcheck + depends_on 조건</text>

  <!-- 단계 헤더 -->
  <g font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="135" y="66">① 바로 시작</text>
    <text x="395" y="66">② 의존 대상이 healthy 되면</text>
    <text x="655" y="66">③ job이 성공 종료하면</text>
    <text x="865" y="66">④ 마지막</text>
  </g>

  <!-- 1열 -->
  <g>
    <rect x="40" y="80" width="190" height="46" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="135" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">qdrant</text>
    <text x="135" y="117" text-anchor="middle" font-size="11" fill="#78350f" font-family="Consolas,'D2Coding',monospace">bash /dev/tcp → /readyz</text>

    <rect x="40" y="140" width="190" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="135" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">embed</text>
    <text x="135" y="177" text-anchor="middle" font-size="11" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">curl /health</text>

    <rect x="40" y="200" width="190" height="46" rx="8" fill="#eff6ff" stroke="#2496ed"/>
    <text x="135" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ollama [cpu]</text>
    <text x="135" y="237" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">ollama list</text>

    <rect x="40" y="260" width="190" height="46" rx="8" fill="#2496ed"/>
    <text x="135" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">vllm [gpu]</text>
    <text x="135" y="297" text-anchor="middle" font-size="11" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">python urllib /health</text>

    <rect x="40" y="320" width="190" height="46" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="6 4"/>
    <text x="135" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">reranker [rerank]</text>
    <text x="135" y="357" text-anchor="middle" font-size="11" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">curl /health</text>
  </g>

  <!-- 2열 -->
  <rect x="300" y="100" width="190" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="395" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">indexer (job)</text>
  <text x="395" y="143" text-anchor="middle" font-size="11" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">ingest.py → exit 0</text>

  <rect x="300" y="190" width="190" height="46" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="395" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ollama-pull (job)</text>
  <text x="395" y="227" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">ollama pull → exit 0</text>

  <!-- 3열 -->
  <rect x="560" y="196" width="190" height="56" rx="8" fill="#7c3aed"/>
  <text x="655" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rag-api</text>
  <text x="655" y="239" text-anchor="middle" font-size="11" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">python urllib /healthz</text>

  <!-- 4열 -->
  <rect x="790" y="196" width="150" height="56" rx="8" fill="#2496ed"/>
  <text x="865" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">web</text>
  <text x="865" y="239" text-anchor="middle" font-size="11" fill="#dbeafe" font-family="Consolas,'D2Coding',monospace">nginx :8080</text>

  <!-- service_healthy (초록) -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="230" y1="103" x2="297" y2="120" marker-end="url(#arrowG)"/>
    <line x1="230" y1="163" x2="297" y2="140" marker-end="url(#arrowG)"/>
    <line x1="230" y1="223" x2="297" y2="213" marker-end="url(#arrowG)"/>
    <line x1="750" y1="224" x2="787" y2="224" marker-end="url(#arrowG)"/>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M230,283 L530,283 L557,245" marker-end="url(#arrowG)"/>
    <path d="M230,343 L620,343 L620,255" marker-end="url(#arrowG)"/>
  </g>

  <!-- service_completed_successfully (보라) -->
  <path d="M490,128 L525,128 L557,205" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>
  <path d="M490,213 L557,220" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowP)"/>

  <!-- 범례 -->
  <rect x="40" y="385" width="900" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="12" fill="#334155">
    <line x1="56" y1="410" x2="96" y2="410" stroke="#16a34a" stroke-width="2"/>
    <text x="104" y="414">condition: service_healthy</text>
    <line x1="300" y1="410" x2="340" y2="410" stroke="#7c3aed" stroke-width="2"/>
    <text x="348" y="414">condition: service_completed_successfully</text>
    <line x1="632" y1="410" x2="672" y2="410" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="680" y="414">required: false (프로필이 꺼져 있으면 건너뜀)</text>
  </g>
</svg>
