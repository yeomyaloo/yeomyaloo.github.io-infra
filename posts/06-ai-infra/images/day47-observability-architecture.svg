<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LLM 관측성 구조 — 메트릭은 Prometheus, 트레이스는 Langfuse</text>

  <!-- K8s cluster -->
  <rect x="20" y="50" width="610" height="470" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="40" y="78" font-size="16" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터 (홈랩 H01)</text>

  <!-- workloads row -->
  <rect x="40" y="112" width="150" height="72" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">rag-api</text>
  <text x="115" y="160" text-anchor="middle" font-size="12" fill="#475569">Compose → K8s(49)</text>
  <text x="115" y="176" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'D2Coding',monospace">OTel SDK</text>

  <rect x="230" y="112" width="150" height="72" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="305" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">LiteLLM</text>
  <text x="305" y="160" text-anchor="middle" font-size="12" fill="#475569">게이트웨이 (Day 40)</text>
  <text x="305" y="176" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'D2Coding',monospace">langfuse 콜백</text>

  <rect x="420" y="112" width="190" height="72" rx="8" fill="#7c3aed"/>
  <text x="515" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">vLLM</text>
  <text x="515" y="160" text-anchor="middle" font-size="12" fill="#ede9fe">vllm-qwen · ns: llm</text>
  <text x="515" y="176" text-anchor="middle" font-size="11" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">:8000/metrics</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="190" y1="148" x2="227" y2="148" marker-end="url(#arrow)"/>
    <line x1="380" y1="148" x2="417" y2="148" marker-end="url(#arrow)"/>
  </g>

  <!-- dcgm -->
  <rect x="40" y="212" width="190" height="64" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="135" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">dcgm-exporter</text>
  <text x="135" y="260" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas,'D2Coding',monospace">GPU Operator · :9400</text>

  <!-- monitoring namespace -->
  <rect x="40" y="305" width="570" height="200" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="56" y="328" font-size="13" font-weight="700" fill="#92400e">ns: monitoring</text>

  <rect x="56" y="345" width="160" height="56" rx="8" fill="#fde68a"/>
  <text x="136" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">ServiceMonitor ×2</text>
  <text x="136" y="388" text-anchor="middle" font-size="11" fill="#78350f">vllm · dcgm-exporter</text>

  <rect x="56" y="425" width="160" height="56" rx="8" fill="#fde68a"/>
  <text x="136" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">PrometheusRule</text>
  <text x="136" y="468" text-anchor="middle" font-size="11" fill="#78350f">TTFT · 대기열 · KV · GPU</text>

  <rect x="262" y="390" width="150" height="64" rx="8" fill="#f59e0b"/>
  <text x="337" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Prometheus</text>
  <text x="337" y="440" text-anchor="middle" font-size="11" fill="#ffffff">15초마다 scrape</text>

  <rect x="450" y="345" width="145" height="56" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="522" y="369" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Grafana</text>
  <text x="522" y="389" text-anchor="middle" font-size="11" fill="#475569">PromQL 대시보드</text>

  <rect x="450" y="425" width="145" height="56" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="522" y="449" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Alertmanager</text>
  <text x="522" y="469" text-anchor="middle" font-size="11" fill="#475569">알림 전송</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="216" y1="380" x2="260" y2="405" marker-end="url(#arrow)"/>
    <line x1="216" y1="450" x2="260" y2="435" marker-end="url(#arrow)"/>
    <line x1="412" y1="405" x2="448" y2="380" marker-end="url(#arrow)"/>
    <line x1="412" y1="440" x2="448" y2="452" marker-end="url(#arrow)"/>
  </g>

  <!-- scrape (pull) arrows -->
  <g stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="380" y1="390" x2="508" y2="187" marker-end="url(#arrowO)"/>
    <line x1="300" y1="390" x2="160" y2="279" marker-end="url(#arrowO)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#c2410c">
    <text x="455" y="262">scrape (pull)</text>
    <text x="236" y="300">scrape</text>
  </g>

  <!-- trace arrows -->
  <polyline points="115,112 115,96 640,96 640,140 666,140" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowP)"/>
  <line x1="305" y1="112" x2="305" y2="99" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">트레이스 push (OTLP/HTTP · 콜백)</text>

  <!-- Langfuse host -->
  <rect x="650" y="50" width="290" height="470" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="795" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">홈랩 서버 · Docker Compose</text>

  <rect x="670" y="112" width="250" height="56" rx="8" fill="#7c3aed"/>
  <text x="795" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Langfuse Web :3000</text>
  <text x="795" y="156" text-anchor="middle" font-size="11" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">/api/public/otel</text>

  <rect x="670" y="184" width="250" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="795" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Langfuse Worker</text>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#334155">
    <rect x="670" y="246" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="730" y="271">Postgres</text>
    <rect x="800" y="246" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="860" y="271">ClickHouse</text>
    <rect x="670" y="294" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="730" y="319">Redis</text>
    <rect x="800" y="294" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="860" y="319">MinIO (S3)</text>
  </g>

  <rect x="670" y="356" width="250" height="148" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="686" y="380" font-size="13" font-weight="700" fill="#312e81">Langfuse UI에서 보는 것</text>
  <g font-size="12" fill="#334155">
    <text x="686" y="404">• rag.ask → retrieval → chat 폭포수</text>
    <text x="686" y="426">• 단계별 지연 · 입력/출력 토큰</text>
    <text x="686" y="448">• 프롬프트와 답변, 검색된 출처</text>
    <text x="686" y="470">• 사용자·세션·모델별 집계</text>
    <text x="686" y="492">• 평가 점수 (Day 48)</text>
  </g>
</svg>
