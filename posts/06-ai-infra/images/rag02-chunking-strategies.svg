<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <!-- reusable document body: header bars and text lines -->
    <g id="doc">
      <rect x="0" y="0" width="140" height="260" rx="6" fill="#ffffff" stroke="#94a3b8"/>
      <rect x="10" y="10" width="70" height="8" rx="2" fill="#334155"/>
      <rect x="10" y="28" width="120" height="4" fill="#e2e8f0"/><rect x="10" y="40" width="110" height="4" fill="#e2e8f0"/>
      <rect x="10" y="52" width="120" height="4" fill="#e2e8f0"/><rect x="10" y="64" width="90" height="4" fill="#e2e8f0"/>
      <rect x="10" y="76" width="120" height="4" fill="#e2e8f0"/>
      <rect x="10" y="100" width="80" height="8" rx="2" fill="#334155"/>
      <rect x="10" y="118" width="120" height="4" fill="#e2e8f0"/><rect x="10" y="130" width="120" height="4" fill="#e2e8f0"/>
      <rect x="10" y="142" width="100" height="4" fill="#e2e8f0"/><rect x="10" y="154" width="120" height="4" fill="#e2e8f0"/>
      <rect x="10" y="166" width="70" height="4" fill="#e2e8f0"/>
      <rect x="10" y="190" width="60" height="8" rx="2" fill="#334155"/>
      <rect x="10" y="208" width="120" height="4" fill="#e2e8f0"/><rect x="10" y="220" width="110" height="4" fill="#e2e8f0"/>
      <rect x="10" y="232" width="120" height="4" fill="#e2e8f0"/>
    </g>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">청킹 전략 다섯 가지 — 같은 문서를 어떻게 자르나</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">검은 막대 = ## 헤더, 회색 줄 = 본문</text>

  <!-- column titles -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="110" y="88" fill="#991b1b">① 고정 길이</text>
    <text x="305" y="88" fill="#1e3a8a">② 헤더 기반</text>
    <text x="500" y="88" fill="#4c1d95">③ 의미 기반</text>
    <text x="695" y="88" fill="#166534">④ parent-child</text>
    <text x="890" y="88" fill="#92400e">⑤ 문맥 헤더</text>
  </g>

  <!-- 1 fixed -->
  <use href="#doc" x="40" y="100"/>
  <rect x="36" y="100" width="148" height="65" fill="#fca5a5" fill-opacity="0.35"/>
  <rect x="36" y="165" width="148" height="65" fill="#fde68a" fill-opacity="0.45"/>
  <rect x="36" y="230" width="148" height="65" fill="#fca5a5" fill-opacity="0.35"/>
  <rect x="36" y="295" width="148" height="65" fill="#fde68a" fill-opacity="0.45"/>
  <g stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="30" y1="165" x2="190" y2="165"/><line x1="30" y1="230" x2="190" y2="230"/><line x1="30" y1="295" x2="190" y2="295"/>
  </g>
  <text x="110" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">헤더를 가로질러 자름</text>

  <!-- 2 header -->
  <use href="#doc" x="235" y="100"/>
  <rect x="231" y="102" width="148" height="88" rx="4" fill="#bfdbfe" fill-opacity="0.5" stroke="#2496ed"/>
  <rect x="231" y="194" width="148" height="86" rx="4" fill="#bfdbfe" fill-opacity="0.5" stroke="#2496ed"/>
  <rect x="231" y="284" width="148" height="74" rx="4" fill="#bfdbfe" fill-opacity="0.5" stroke="#2496ed"/>

  <!-- 3 semantic -->
  <use href="#doc" x="430" y="100"/>
  <rect x="426" y="102" width="148" height="46" rx="4" fill="#c7d2fe" fill-opacity="0.5" stroke="#7c3aed"/>
  <rect x="426" y="152" width="148" height="104" rx="4" fill="#ddd6fe" fill-opacity="0.5" stroke="#7c3aed"/>
  <rect x="426" y="260" width="148" height="98" rx="4" fill="#c7d2fe" fill-opacity="0.5" stroke="#7c3aed"/>
  <text x="580" y="154" font-size="10" fill="#5b21b6">전환</text>
  <text x="580" y="262" font-size="10" fill="#5b21b6">전환</text>

  <!-- 4 parent-child -->
  <use href="#doc" x="625" y="100"/>
  <rect x="621" y="194" width="148" height="86" rx="4" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="631" y="214" width="60" height="28" rx="3" fill="#86efac" fill-opacity="0.7" stroke="#16a34a"/>
  <rect x="699" y="214" width="60" height="28" rx="3" fill="#86efac" fill-opacity="0.7" stroke="#16a34a"/>
  <rect x="631" y="246" width="60" height="28" rx="3" fill="#16a34a" stroke="#14532d"/>
  <rect x="699" y="246" width="60" height="28" rx="3" fill="#86efac" fill-opacity="0.7" stroke="#16a34a"/>
  <text x="661" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">검색됨</text>
  <text x="695" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">자식으로 검색 → 부모를 LLM에</text>

  <!-- 5 context header -->
  <use href="#doc" x="820" y="100"/>
  <rect x="816" y="194" width="148" height="86" rx="4" fill="#fde68a" fill-opacity="0.5" stroke="#f59e0b"/>
  <rect x="808" y="168" width="164" height="22" rx="4" fill="#7c3aed"/>
  <text x="890" y="183" text-anchor="middle" font-size="10" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">Day 42 &gt; 3. 청킹 &gt;</text>
  <line x1="890" y1="190" x2="890" y2="196" stroke="#7c3aed" stroke-width="2"/>

  <!-- pros / cons -->
  <g font-size="12" fill="#334155">
    <text x="30" y="392">+ 단순, 크기 균일</text>
    <text x="30" y="412">− 표·코드 중간 절단</text>
    <text x="30" y="432" fill="#64748b">기준선 용도</text>

    <text x="225" y="392">+ 의미 단위 = 섹션</text>
    <text x="225" y="412">+ 출처 표시 쉬움</text>
    <text x="225" y="432">− 섹션 길이 들쭉날쭉</text>

    <text x="420" y="392">+ 주제 경계에 가까움</text>
    <text x="420" y="412">− 문장마다 임베딩</text>
    <text x="420" y="432">− 색인 수 배 느림</text>

    <text x="615" y="392">+ 검색은 정밀하게</text>
    <text x="615" y="412">+ 문맥은 넉넉하게</text>
    <text x="615" y="432">− 프롬프트 길어짐</text>

    <text x="810" y="392">+ 짧은 청크 모호함 해소</text>
    <text x="810" y="412">+ BM25에도 효과</text>
    <text x="810" y="432">+ 추가 비용 거의 없음</text>
  </g>
  <text x="500" y="478" text-anchor="middle" font-size="13" fill="#0f172a">어느 것이 나은지는 감이 아니라 RAG 심화 01의 같은 시험지로 채점해서 정한다</text>
</svg>
