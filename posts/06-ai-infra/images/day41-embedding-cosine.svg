<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2496ed"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">임베딩: 의미가 비슷하면 벡터의 방향이 비슷하다</text>

  <!-- ===== Left: text -> model -> vector ===== -->
  <rect x="20" y="56" width="380" height="420" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <g font-size="13" text-anchor="middle">
    <rect x="36" y="82" width="190" height="40" rx="8" fill="#ffffff" stroke="#2496ed"/><text x="131" y="107" fill="#1e3a8a">고양이가 소파에서 잔다</text>
    <rect x="36" y="134" width="190" height="40" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="131" y="159" fill="#14532d">강아지가 침대에서 잔다</text>
    <rect x="36" y="186" width="190" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="131" y="211" fill="#7f1d1d">Pod 재시작 방법</text>
  </g>
  <rect x="262" y="96" width="122" height="116" rx="10" fill="#7c3aed"/>
  <text x="323" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">임베딩 모델</text>
  <text x="323" y="168" text-anchor="middle" font-size="12" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">bge-m3</text>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="226" y1="102" x2="258" y2="128" marker-end="url(#arrow)"/>
    <line x1="226" y1="154" x2="258" y2="154" marker-end="url(#arrow)"/>
    <line x1="226" y1="206" x2="258" y2="180" marker-end="url(#arrow)"/>
    <line x1="323" y1="212" x2="323" y2="250" marker-end="url(#arrow)"/>
  </g>

  <rect x="36" y="256" width="348" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13">
    <text x="50" y="282" fill="#1e3a8a">A = [ 0.12, -0.03, …, 0.08 ]</text>
    <text x="50" y="306" fill="#14532d">B = [ 0.10, -0.05, …, 0.07 ]</text>
    <text x="50" y="330" fill="#7f1d1d">C = [-0.21,  0.17, …, 0.02 ]</text>
  </g>
  <text x="370" y="350" text-anchor="end" font-size="12" fill="#64748b">각각 숫자 1024개</text>

  <rect x="36" y="378" width="348" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="210" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">코사인 유사도</text>
  <text x="210" y="430" text-anchor="middle" font-size="15" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">cos θ = A·B / (|A| × |B|)</text>
  <text x="210" y="451" text-anchor="middle" font-size="12" fill="#4c1d95">1 = 같은 방향 · 0 = 무관 · −1 = 반대</text>

  <!-- ===== Right: 2D vector space ===== -->
  <rect x="420" y="56" width="520" height="420" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="440" y="84" font-size="15" font-weight="700" fill="#0f172a">벡터 공간 (1024차원을 2차원으로 단순화)</text>

  <!-- axes -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="480" y1="410" x2="920" y2="410"/>
    <line x1="480" y1="410" x2="480" y2="104"/>
  </g>

  <!-- angle arc between Q and C -->
  <path d="M548.5,395.4 A70,70 0 0,0 521.1,353.4" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="360" font-size="12" fill="#b91c1c">θ 큼 → 유사도 낮음</text>

  <!-- vectors from origin (480,410) -->
  <line x1="480" y1="410" x2="645" y2="211" stroke="#2496ed" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="480" y1="410" x2="616" y2="190" stroke="#16a34a" stroke-width="3" marker-end="url(#aG)"/>
  <line x1="480" y1="410" x2="597" y2="250" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#aP)"/>
  <line x1="480" y1="410" x2="752" y2="352" stroke="#dc2626" stroke-width="3" marker-end="url(#aR)"/>

  <g font-size="15" font-weight="700">
    <text x="652" y="214" fill="#1e3a8a">A</text>
    <text x="606" y="182" fill="#14532d">B</text>
    <text x="604" y="262" fill="#4c1d95">Q</text>
    <text x="760" y="356" fill="#7f1d1d">C</text>
  </g>
  <text x="500" y="140" font-size="12" fill="#4c1d95">Q·A·B 사이 θ 작음 → 유사도 높음</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="722" y="104" width="200" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="736" y="128" fill="#1e3a8a"><tspan font-weight="700">A</tspan>  고양이가 소파에서 잔다</text>
    <text x="736" y="152" fill="#14532d"><tspan font-weight="700">B</tspan>  강아지가 침대에서 잔다</text>
    <text x="736" y="176" fill="#7f1d1d"><tspan font-weight="700">C</tspan>  Pod 재시작 방법</text>
    <text x="736" y="200" fill="#4c1d95"><tspan font-weight="700">Q</tspan>  질문: 반려동물 잠자리</text>
  </g>

  <text x="680" y="440" text-anchor="middle" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">cos(Q,A)=0.83   cos(Q,B)=0.81   cos(Q,C)=0.21</text>
  <text x="680" y="462" text-anchor="middle" font-size="12" fill="#64748b">(설명용 예시 값)</text>
</svg>
