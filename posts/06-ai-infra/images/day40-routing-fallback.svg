<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LiteLLM 라우팅: 모델 그룹, 로드밸런싱, Fallback</text>

  <!-- requests -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" text-anchor="middle">
    <rect x="24" y="112" width="200" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="124" y="136" fill="#0f172a">POST /v1/chat/...</text>
    <text x="124" y="156" fill="#4c1d95" font-weight="700">"model": "qwen"</text>

    <rect x="24" y="302" width="200" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="124" y="326" fill="#0f172a">POST /v1/chat/...</text>
    <text x="124" y="346" fill="#4c1d95" font-weight="700">"model": "qwen-vllm"</text>
  </g>

  <!-- router -->
  <rect x="270" y="186" width="170" height="100" rx="10" fill="#7c3aed"/>
  <text x="355" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">LiteLLM Router</text>
  <text x="355" y="244" text-anchor="middle" font-size="13" fill="#ede9fe">model_name으로</text>
  <text x="355" y="264" text-anchor="middle" font-size="13" fill="#ede9fe">모델 그룹 선택</text>

  <!-- group qwen -->
  <rect x="490" y="66" width="440" height="160" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="510" y="92" font-size="15" font-weight="700" fill="#4c1d95">모델 그룹 "qwen"</text>
  <text x="910" y="92" text-anchor="end" font-size="12" fill="#64748b">simple-shuffle + weight</text>
  <rect x="510" y="108" width="190" height="96" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="605" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">vLLM :8000</text>
  <text x="605" y="158" text-anchor="middle" font-size="13" fill="#334155">weight 3</text>
  <rect x="545" y="170" width="120" height="24" rx="12" fill="#c4b5fd"/>
  <text x="605" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">약 75%</text>
  <rect x="720" y="108" width="190" height="96" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="815" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Ollama :11434</text>
  <text x="815" y="158" text-anchor="middle" font-size="13" fill="#334155">weight 1</text>
  <rect x="755" y="170" width="120" height="24" rx="12" fill="#86efac"/>
  <text x="815" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">약 25%</text>

  <!-- group qwen-vllm -->
  <rect x="490" y="262" width="200" height="140" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="590" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">그룹 "qwen-vllm"</text>
  <rect x="510" y="302" width="160" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="590" y="329" text-anchor="middle" font-size="14" fill="#7f1d1d">vLLM :8000</text>
  <text x="590" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">✕ 연결 실패</text>
  <text x="590" y="390" text-anchor="middle" font-size="12" fill="#64748b">재시도 후 쿨다운</text>

  <!-- group qwen-ollama -->
  <rect x="730" y="262" width="200" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="830" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">그룹 "qwen-ollama"</text>
  <rect x="750" y="302" width="160" height="44" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="830" y="329" text-anchor="middle" font-size="14" fill="#14532d">Ollama :11434</text>
  <text x="830" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">✓ 대신 응답</text>
  <text x="830" y="390" text-anchor="middle" font-size="12" fill="#64748b">사용자는 에러를 못 봄</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="224" y1="140" x2="266" y2="206" marker-end="url(#arrow)"/>
    <line x1="224" y1="330" x2="266" y2="266" marker-end="url(#arrow)"/>
    <line x1="440" y1="210" x2="486" y2="160" marker-end="url(#arrow)"/>
    <line x1="440" y1="262" x2="486" y2="320" marker-end="url(#arrow)"/>
  </g>
  <line x1="690" y1="324" x2="726" y2="324" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="710" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">fallback</text>
  <line x1="710" y1="258" x2="710" y2="318" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- caption -->
  <rect x="24" y="424" width="906" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="477" y="449" text-anchor="middle" font-size="14" fill="#334155">같은 model_name = 하나의 그룹 → <tspan font-weight="700" fill="#4c1d95">그룹 안은 로드밸런싱</tspan>, 그룹 전체가 실패하면 <tspan font-weight="700" fill="#dc2626">fallbacks의 다른 그룹으로</tspan></text>
</svg>
