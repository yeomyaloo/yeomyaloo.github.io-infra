<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">기법 지도 — 파이프라인의 어디를 고치는가</text>

  <!-- Agentic loop arc -->
  <path d="M840,150 C840,82 260,82 260,150" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowr)"/>
  <text x="550" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626">Agentic RAG: 결과가 부족하면 질문을 고쳐 다시 검색 · 도구 선택 (4장)</text>

  <text x="20" y="140" font-size="14" font-weight="700" fill="#334155">질의 시점</text>

  <!-- 질의 파이프라인 -->
  <rect x="20" y="152" width="115" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="77" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">질문</text>
  <text x="77" y="218" text-anchor="middle" font-size="12" fill="#334155">(+ 대화 이력)</text>

  <rect x="160" y="152" width="200" height="96" rx="10" fill="#7c3aed"/>
  <text x="260" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">질의 변환 (2장)</text>
  <text x="260" y="196" text-anchor="middle" font-size="12.5" fill="#ffffff">query rewriting</text>
  <text x="260" y="214" text-anchor="middle" font-size="12.5" fill="#ffffff">multi-query · HyDE</text>
  <text x="260" y="232" text-anchor="middle" font-size="12.5" fill="#ede9fe">self-query (필터 추출)</text>

  <rect x="385" y="152" width="170" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="470" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">검색</text>
  <text x="470" y="196" text-anchor="middle" font-size="12.5" fill="#78350f">dense / 하이브리드 (02)</text>
  <text x="470" y="214" text-anchor="middle" font-size="12.5" fill="#78350f">payload 필터 (03)</text>
  <text x="470" y="232" text-anchor="middle" font-size="12.5" fill="#78350f">RRF로 합치기</text>

  <rect x="580" y="152" width="135" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="647" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">리랭크</text>
  <text x="647" y="208" text-anchor="middle" font-size="12.5" fill="#4c1d95">cross-encoder</text>
  <text x="647" y="226" text-anchor="middle" font-size="12.5" fill="#4c1d95">(02)</text>

  <rect x="740" y="152" width="200" height="96" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="840" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">생성</text>
  <text x="840" y="208" text-anchor="middle" font-size="12.5" fill="#14532d">LLM + 번호 인용</text>
  <text x="840" y="226" text-anchor="middle" font-size="12.5" fill="#14532d">출처는 코드가 (03)</text>

  <line x1="135" y1="200" x2="157" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="200" x2="382" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="200" x2="577" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="200" x2="737" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 색인 -> 검색 연결 -->
  <path d="M840,336 V292 H470 V251" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="285" text-anchor="middle" font-size="12" fill="#64748b">벡터 + payload</text>

  <text x="20" y="326" font-size="14" font-weight="700" fill="#334155">색인 시점</text>

  <!-- 색인 파이프라인 -->
  <rect x="20" y="338" width="115" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="77" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">문서</text>
  <text x="77" y="404" text-anchor="middle" font-size="12" fill="#334155">.md 약 200편</text>

  <rect x="160" y="338" width="200" height="96" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="260" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">청킹</text>
  <text x="260" y="390" text-anchor="middle" font-size="12.5" fill="#334155">헤더 + 길이 (Day 42)</text>
  <text x="260" y="410" text-anchor="middle" font-size="12.5" fill="#334155">크기 · 부모-자식 (02)</text>

  <rect x="385" y="338" width="330" height="96" rx="10" fill="#7c3aed"/>
  <text x="550" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">색인 강화 (3장)</text>
  <text x="550" y="388" text-anchor="middle" font-size="12.5" fill="#ffffff">contextual retrieval: 청크마다 LLM이 문맥 문장</text>
  <text x="550" y="410" text-anchor="middle" font-size="12.5" fill="#ede9fe">late chunking: 문서 전체 임베딩 후 청크별 pooling</text>

  <rect x="740" y="338" width="200" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="840" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">벡터 DB (Qdrant)</text>
  <text x="840" y="400" text-anchor="middle" font-size="12.5" fill="#78350f">dense + sparse + payload</text>

  <line x1="135" y1="386" x2="157" y2="386" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="386" x2="382" y2="386" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="386" x2="737" y2="386" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GraphRAG -->
  <rect x="20" y="460" width="920" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="40" y="486" font-size="14" font-weight="700" fill="#7f1d1d">GraphRAG (5장) — 별도의 색인 · 질의 엔진</text>
  <text x="40" y="508" font-size="12.5" fill="#7f1d1d">문서 → 엔티티·관계 그래프 → Leiden 커뮤니티 → 커뮤니티 요약 보고서 → global / local / drift / basic 질의</text>
</svg>
