<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DCGM exporter → Prometheus → Grafana</text>

  <!-- GPU node -->
  <rect x="20" y="70" width="270" height="270" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">gpu-node1</text>
  <rect x="40" y="114" width="230" height="40" rx="8" fill="#334155"/>
  <text x="155" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GPU + 드라이버</text>
  <rect x="40" y="184" width="230" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="155" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">nvidia-dcgm-exporter</text>
  <text x="155" y="232" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">:9400/metrics</text>
  <rect x="40" y="270" width="230" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="292" text-anchor="middle" font-size="12" fill="#334155">vLLM Pod (Day 45)</text>
  <text x="155" y="310" text-anchor="middle" font-size="11" fill="#64748b">→ pod · namespace 라벨로 귀속</text>

  <!-- ServiceMonitor -->
  <rect x="340" y="90" width="250" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="465" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">ServiceMonitor</text>
  <text x="465" y="141" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">nvidia-dcgm-exporter</text>
  <text x="465" y="163" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">release: monitoring</text>

  <!-- Prometheus -->
  <rect x="340" y="220" width="250" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="465" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Prometheus (Day 17)</text>
  <text x="465" y="272" text-anchor="middle" font-size="12" fill="#334155">15초마다 scrape</text>
  <text x="465" y="294" text-anchor="middle" font-size="12" fill="#334155">DCGM_FI_DEV_GPU_UTIL</text>
  <text x="465" y="314" text-anchor="middle" font-size="12" fill="#334155">DCGM_FI_DEV_FB_USED …</text>

  <!-- Grafana -->
  <rect x="650" y="90" width="290" height="110" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="795" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Grafana</text>
  <text x="795" y="142" text-anchor="middle" font-size="12" fill="#334155">DCGM 대시보드 (ID 12239)</text>
  <text x="795" y="164" text-anchor="middle" font-size="12" fill="#334155">사용률 · VRAM · 온도 · 전력</text>
  <text x="795" y="186" text-anchor="middle" font-size="11" fill="#64748b">Day 47에서 vLLM 지표와 합침</text>

  <!-- KEDA -->
  <rect x="650" y="230" width="290" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="795" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">KEDA (Day 46)</text>
  <text x="795" y="282" text-anchor="middle" font-size="12" fill="#334155">PromQL 결과로 Pod 수 조절</text>
  <text x="795" y="304" text-anchor="middle" font-size="11" fill="#64748b">GPU 지표보다 vLLM 큐 지표가</text>
  <text x="795" y="320" text-anchor="middle" font-size="11" fill="#64748b">확장 신호로 더 정확</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="155" y1="154" x2="155" y2="181" marker-end="url(#arrow)"/>
    <line x1="270" y1="216" x2="337" y2="150" marker-end="url(#arrow)"/>
    <line x1="465" y1="180" x2="465" y2="217" marker-end="url(#arrow)"/>
    <line x1="590" y1="250" x2="647" y2="170" marker-end="url(#arrow)"/>
    <line x1="590" y1="290" x2="647" y2="285" marker-end="url(#arrow)"/>
  </g>
  <text x="296" y="210" font-size="11" fill="#334155" font-weight="700">대상 발견</text>
  <text x="618" y="238" font-size="11" fill="#334155" font-weight="700">쿼리</text>
</svg>
