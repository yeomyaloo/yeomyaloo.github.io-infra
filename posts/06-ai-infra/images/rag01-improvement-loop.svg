<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">평가 → 개선 루프 — 한 바퀴에 하나만 바꾼다</text>

  <!-- 1 -->
  <rect x="150" y="70" width="200" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">① 평가 실행</text>
  <text x="250" y="118" text-anchor="middle" font-size="12" fill="#5b21b6" font-family="Consolas,'D2Coding',monospace">run_eval.py</text>
  <!-- 2 -->
  <rect x="610" y="70" width="200" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="710" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">② 실패 추출</text>
  <text x="710" y="118" text-anchor="middle" font-size="12" fill="#991b1b">triage.py → 원인 후보</text>
  <!-- 3 -->
  <rect x="730" y="200" width="200" height="64" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="830" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">③ 원인 확정</text>
  <text x="830" y="248" text-anchor="middle" font-size="12" fill="#78350f">사람이 CSV를 읽고 판정</text>
  <!-- 4 -->
  <rect x="610" y="330" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="710" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">④ 가설 · 실험</text>
  <text x="710" y="378" text-anchor="middle" font-size="12" fill="#1e40af">한 가지만 바꿔 재실행</text>
  <!-- 5 -->
  <rect x="150" y="330" width="200" height="64" rx="10" fill="#2496ed"/>
  <text x="250" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">⑤ 비교 게이트</text>
  <text x="250" y="378" text-anchor="middle" font-size="12" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">compare.py</text>
  <!-- 6 -->
  <rect x="30" y="200" width="200" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">⑥ 채택 · 기록</text>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#166534">baseline 교체 · 실험 표</text>

  <!-- cycle arrows -->
  <line x1="350" y1="102" x2="606" y2="102" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="94" text-anchor="middle" font-size="12" fill="#64748b">results.jsonl</text>
  <line x1="790" y1="134" x2="826" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="826" y1="264" x2="790" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="306" font-size="12" fill="#64748b">개선 항목</text>
  <line x1="610" y1="362" x2="354" y2="362" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="352" text-anchor="middle" font-size="12" fill="#64748b">새 실행 vs 기준</text>
  <line x1="170" y1="330" x2="134" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="306" font-size="12" fill="#166534">통과</text>
  <line x1="134" y1="200" x2="170" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="164" font-size="12" fill="#64748b">다음 바퀴</text>
  <path d="M250,394 L250,430 L710,430 L710,398" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowr)"/>
  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#991b1b">회귀면 폐기 → 다른 가설로</text>

  <!-- center: golden -->
  <rect x="390" y="195" width="200" height="74" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">골든 셋</text>
  <text x="490" y="244" text-anchor="middle" font-size="12" fill="#78350f">라벨 오류 수정</text>
  <text x="490" y="260" text-anchor="middle" font-size="12" fill="#78350f">새 실패 유형 추가</text>
  <line x1="730" y1="232" x2="594" y2="232" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="662" y="224" text-anchor="middle" font-size="11" fill="#92400e">시험지 문제</text>
  <line x1="440" y1="195" x2="330" y2="138" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
