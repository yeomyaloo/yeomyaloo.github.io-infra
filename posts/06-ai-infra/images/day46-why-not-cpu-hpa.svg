<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">동시 요청이 늘 때 각 지표는 어떻게 움직이나 (개념도)</text>

  <!-- axes -->
  <line x1="90" y1="400" x2="660" y2="400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="400" x2="90" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="436" text-anchor="middle" font-size="13" fill="#334155">동시 요청 수 →</text>
  <text x="40" y="235" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 40 235)">지표 값 (정규화)</text>

  <!-- capacity line -->
  <line x1="330" y1="80" x2="330" y2="400" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#64748b">배치 한도 (max-num-seqs)</text>
  <rect x="96" y="76" width="226" height="22" rx="4" fill="#f0fdf4"/>
  <text x="209" y="92" text-anchor="middle" font-size="12" fill="#14532d">여유 구간 — 배치로 흡수</text>
  <rect x="338" y="76" width="316" height="22" rx="4" fill="#fef2f2"/>
  <text x="496" y="92" text-anchor="middle" font-size="12" fill="#7f1d1d">포화 구간 — 사용자가 기다림</text>

  <!-- CPU: flat low -->
  <path d="M90,360 L200,352 L330,348 L650,346" fill="none" stroke="#2496ed" stroke-width="3"/>
  <!-- memory: flat high -->
  <path d="M90,150 L650,150" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- GPU util: saturate early -->
  <path d="M90,390 L130,250 L170,140 L210,120 L650,118" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- KV cache: rise to near 1 -->
  <path d="M90,398 L200,320 L300,200 L330,170 L420,130 L650,126" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <!-- waiting: 0 then linear -->
  <path d="M90,398 L330,398 L650,110" fill="none" stroke="#dc2626" stroke-width="4"/>

  <!-- legend -->
  <rect x="690" y="70" width="250" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="815" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">지표</text>
  <g font-size="13">
    <line x1="706" y1="122" x2="740" y2="122" stroke="#2496ed" stroke-width="3"/>
    <text x="750" y="127" fill="#334155">CPU 사용률</text>
    <text x="750" y="146" font-size="11" fill="#64748b">거의 평평 → HPA 무반응</text>

    <line x1="706" y1="176" x2="740" y2="176" stroke="#64748b" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="750" y="181" fill="#334155">메모리 / VRAM</text>
    <text x="750" y="200" font-size="11" fill="#64748b">시작 시 선점 → 항상 일정</text>

    <line x1="706" y1="230" x2="740" y2="230" stroke="#f59e0b" stroke-width="3"/>
    <text x="750" y="235" fill="#334155">GPU 사용률</text>
    <text x="750" y="254" font-size="11" fill="#64748b">일찍 100% 포화</text>

    <line x1="706" y1="284" x2="740" y2="284" stroke="#7c3aed" stroke-width="3"/>
    <text x="750" y="289" fill="#334155">KV 캐시 사용률</text>
    <text x="750" y="308" font-size="11" fill="#64748b">한도 직전에 상승 (선행)</text>

    <line x1="706" y1="338" x2="740" y2="338" stroke="#dc2626" stroke-width="4"/>
    <text x="750" y="343" fill="#334155" font-weight="700">대기 요청 수</text>
    <text x="750" y="362" font-size="11" fill="#64748b">한도 이후 선형 증가</text>
    <text x="750" y="380" font-size="11" fill="#dc2626" font-weight="700">→ 확장 신호</text>
  </g>
  <text x="480" y="466" text-anchor="middle" font-size="12" fill="#64748b">실제 값은 모델 · GPU · 요청 길이에 따라 다르며, 모양(경향)만 나타낸 그림</text>
</svg>
