<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Agentic RAG 루프 vs GraphRAG 색인 구조</text>

  <!-- 왼쪽: Agentic RAG -->
  <rect x="20" y="54" width="450" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="82" font-size="16" font-weight="700" fill="#0f172a">Agentic RAG — LLM이 검색을 계획 · 반복</text>

  <rect x="40" y="100" width="160" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="128" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">질문</text>

  <rect x="40" y="176" width="160" height="96" rx="10" fill="#7c3aed"/>
  <text x="120" y="204" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">에이전트 (LLM)</text>
  <text x="120" y="228" text-anchor="middle" font-size="12" fill="#ede9fe">다음 행동 결정</text>
  <text x="120" y="250" text-anchor="middle" font-size="12" fill="#ede9fe">검색? 다시? 끝?</text>

  <rect x="270" y="150" width="180" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="360" y="174" text-anchor="middle" font-size="13" fill="#78350f" font-weight="700">도구 (읽기 전용)</text>
  <rect x="284" y="186" width="152" height="32" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="360" y="207" text-anchor="middle" font-size="11.5" fill="#78350f" font-family="Consolas,'D2Coding',monospace">search_blog(query)</text>
  <rect x="284" y="226" width="152" height="32" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="360" y="247" text-anchor="middle" font-size="11.5" fill="#78350f" font-family="Consolas,'D2Coding',monospace">get_post(url)</text>
  <text x="360" y="284" text-anchor="middle" font-size="11.5" fill="#92400e">MCP 서버로 노출 가능</text>

  <line x1="120" y1="146" x2="120" y2="173" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="205" x2="267" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="234" y="190" text-anchor="middle" font-size="11.5" fill="#334155">호출</text>
  <line x1="267" y1="255" x2="203" y2="245" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="234" y="268" text-anchor="middle" font-size="11.5" fill="#334155">관찰</text>

  <rect x="40" y="306" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="120" y="334" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">답변 + 출처</text>
  <line x1="120" y1="272" x2="120" y2="303" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="334" font-size="12" fill="#64748b">최대 N단계 후 강제 종료</text>

  <rect x="36" y="372" width="418" height="136" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="398" font-size="14" font-weight="700" fill="#7f1d1d">실패 모드 → 가드</text>
  <text x="52" y="424" font-size="12.5" fill="#7f1d1d">무한 반복 · 과검색 → 단계 상한, 단계별 토큰 예산</text>
  <text x="52" y="448" font-size="12.5" fill="#7f1d1d">도구 결과 속 지시 → 결과를 데이터로 감싸기</text>
  <text x="52" y="472" font-size="12.5" fill="#7f1d1d">잘못된 행동 (LLM06) → 읽기 전용 도구만</text>
  <text x="52" y="496" font-size="12.5" fill="#7f1d1d">경로가 매번 다름 → 궤적(trajectory) 로그로 평가</text>

  <!-- 오른쪽: GraphRAG -->
  <rect x="490" y="54" width="450" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="506" y="82" font-size="16" font-weight="700" fill="#0f172a">GraphRAG — 그래프와 커뮤니티 요약</text>

  <rect x="506" y="98" width="200" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="606" y="122" text-anchor="middle" font-size="12.5" fill="#0f172a">① 문서 → TextUnit 분할</text>
  <rect x="506" y="156" width="200" height="50" rx="8" fill="#7c3aed"/>
  <text x="606" y="177" text-anchor="middle" font-size="12.5" fill="#ffffff">② 엔티티 · 관계 추출</text>
  <text x="606" y="196" text-anchor="middle" font-size="11.5" fill="#ede9fe">(LLM, 색인 비용의 약 75%)</text>
  <rect x="506" y="226" width="200" height="38" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="606" y="250" text-anchor="middle" font-size="12.5" fill="#312e81">③ Leiden 계층 군집</text>
  <rect x="506" y="284" width="200" height="38" rx="8" fill="#7c3aed"/>
  <text x="606" y="308" text-anchor="middle" font-size="12.5" fill="#ffffff">④ 커뮤니티 요약 (LLM)</text>
  <line x1="606" y1="136" x2="606" y2="153" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="606" y1="206" x2="606" y2="223" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="606" y1="264" x2="606" y2="281" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 그래프 그림 -->
  <rect x="724" y="98" width="200" height="224" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <ellipse cx="790" cy="160" rx="58" ry="48" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <ellipse cx="860" cy="260" rx="58" ry="48" fill="#ccfbf1" stroke="#0d9488" stroke-dasharray="4 3"/>
  <line x1="770" y1="140" x2="812" y2="148" stroke="#64748b" stroke-width="1.5"/>
  <line x1="770" y1="140" x2="780" y2="182" stroke="#64748b" stroke-width="1.5"/>
  <line x1="812" y1="148" x2="780" y2="182" stroke="#64748b" stroke-width="1.5"/>
  <line x1="840" y1="246" x2="884" y2="242" stroke="#64748b" stroke-width="1.5"/>
  <line x1="840" y1="246" x2="860" y2="282" stroke="#64748b" stroke-width="1.5"/>
  <line x1="780" y1="182" x2="840" y2="246" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="770" cy="140" r="6" fill="#dc2626"/>
  <circle cx="812" cy="148" r="6" fill="#dc2626"/>
  <circle cx="780" cy="182" r="6" fill="#dc2626"/>
  <circle cx="840" cy="246" r="6" fill="#0d9488"/>
  <circle cx="884" cy="242" r="6" fill="#0d9488"/>
  <circle cx="860" cy="282" r="6" fill="#0d9488"/>
  <text x="764" y="128" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Trivy</text>
  <text x="822" y="138" text-anchor="middle" font-size="10.5" fill="#7f1d1d">cosign</text>
  <text x="780" y="200" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Kyverno</text>
  <text x="836" y="234" text-anchor="middle" font-size="10.5" fill="#134e4a">Loki</text>
  <text x="896" y="232" text-anchor="middle" font-size="10.5" fill="#134e4a">Tempo</text>
  <text x="860" y="300" text-anchor="middle" font-size="10.5" fill="#134e4a">Prometheus</text>
  <text x="734" y="232" font-size="10.5" font-weight="700" fill="#991b1b">커뮤니티 A</text>
  <text x="914" y="316" text-anchor="end" font-size="10.5" font-weight="700" fill="#115e59">커뮤니티 B</text>

  <rect x="506" y="342" width="418" height="166" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="522" y="368" font-size="14" font-weight="700" fill="#4c1d95">질의 방법 (graphrag query --method)</text>
  <text x="522" y="394" font-size="12.5" fill="#4c1d95">global — 커뮤니티 요약을 맵리듀스 (전체 흐름 질문)</text>
  <text x="522" y="418" font-size="12.5" fill="#4c1d95">local — 엔티티와 이웃, 관련 조각</text>
  <text x="522" y="442" font-size="12.5" fill="#4c1d95">drift — local + 커뮤니티 맥락</text>
  <text x="522" y="466" font-size="12.5" fill="#4c1d95">basic — 일반 벡터 top-k (사실 확인형은 이쪽)</text>
  <text x="522" y="492" font-size="12" fill="#6d28d9">색인: standard (전부 LLM) / fast (NLP 추출 + 요약만 LLM)</text>
</svg>
