<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">왜 LLM 게이트웨이가 필요한가</text>

  <!-- ===== Left: without gateway ===== -->
  <rect x="20" y="56" width="370" height="424" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="205" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">게이트웨이 없이</text>

  <g font-size="14" text-anchor="middle">
    <rect x="40" y="120" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="90" y="147" fill="#0f172a">웹 앱</text>
    <rect x="40" y="200" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="90" y="227" fill="#0f172a">사내 봇</text>
    <rect x="40" y="280" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="90" y="307" fill="#0f172a">Open WebUI</text>

    <rect x="260" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="315" y="147" fill="#14532d">Ollama</text>
    <rect x="260" y="200" width="110" height="44" rx="8" fill="#ffffff" stroke="#7c3aed"/><text x="315" y="227" fill="#4c1d95">vLLM</text>
    <rect x="260" y="280" width="110" height="44" rx="8" fill="#ffffff" stroke="#f59e0b"/><text x="315" y="307" fill="#78350f">외부 API</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" fill="none" opacity="0.75">
    <line x1="140" y1="142" x2="256" y2="142" marker-end="url(#arrowR)"/>
    <line x1="140" y1="148" x2="256" y2="216" marker-end="url(#arrowR)"/>
    <line x1="140" y1="156" x2="256" y2="292" marker-end="url(#arrowR)"/>
    <line x1="140" y1="214" x2="256" y2="152" marker-end="url(#arrowR)"/>
    <line x1="140" y1="222" x2="256" y2="222" marker-end="url(#arrowR)"/>
    <line x1="140" y1="230" x2="256" y2="298" marker-end="url(#arrowR)"/>
    <line x1="140" y1="288" x2="256" y2="160" marker-end="url(#arrowR)"/>
    <line x1="140" y1="296" x2="256" y2="232" marker-end="url(#arrowR)"/>
    <line x1="140" y1="304" x2="256" y2="304" marker-end="url(#arrowR)"/>
  </g>

  <g font-size="13" fill="#334155">
    <text x="40" y="372">• 주소·모델명·키가 앱마다 제각각</text>
    <text x="40" y="398">• 외부 API 키가 코드 곳곳에 흩어짐</text>
    <text x="40" y="424">• 누가 얼마나 썼는지, 한도도 없음</text>
    <text x="40" y="450" font-weight="700" fill="#b91c1c">• 서버 하나가 죽으면 그대로 에러</text>
  </g>

  <!-- ===== Right: with gateway ===== -->
  <rect x="410" y="56" width="530" height="424" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="675" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">게이트웨이 사용</text>

  <g font-size="14" text-anchor="middle">
    <rect x="428" y="120" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="478" y="147" fill="#0f172a">웹 앱</text>
    <rect x="428" y="200" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="478" y="227" fill="#0f172a">사내 봇</text>
    <rect x="428" y="280" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="478" y="307" fill="#0f172a">Open WebUI</text>
  </g>
  <text x="478" y="350" text-anchor="middle" font-size="12" fill="#64748b">각자 가상 키 1개</text>

  <!-- gateway -->
  <rect x="572" y="104" width="190" height="236" rx="10" fill="#7c3aed"/>
  <text x="667" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">LiteLLM Proxy</text>
  <text x="667" y="150" text-anchor="middle" font-size="12" fill="#ede9fe" font-family="Consolas,'D2Coding',monospace">:4000/v1</text>
  <g font-size="13" text-anchor="middle">
    <rect x="584" y="164" width="166" height="32" rx="6" fill="#ede9fe"/><text x="667" y="185" fill="#4c1d95">가상 키 인증</text>
    <rect x="584" y="204" width="166" height="32" rx="6" fill="#ede9fe"/><text x="667" y="225" fill="#4c1d95">예산 · Rate limit</text>
    <rect x="584" y="244" width="166" height="32" rx="6" fill="#ede9fe"/><text x="667" y="265" fill="#4c1d95">라우팅 · Fallback</text>
    <rect x="584" y="284" width="166" height="32" rx="6" fill="#ede9fe"/><text x="667" y="305" fill="#4c1d95">사용량 로그</text>
  </g>

  <g font-size="14" text-anchor="middle">
    <rect x="810" y="120" width="110" height="44" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="865" y="147" fill="#14532d">Ollama</text>
    <rect x="810" y="200" width="110" height="44" rx="8" fill="#ffffff" stroke="#7c3aed"/><text x="865" y="227" fill="#4c1d95">vLLM</text>
    <rect x="810" y="280" width="110" height="44" rx="8" fill="#ffffff" stroke="#f59e0b"/><text x="865" y="307" fill="#78350f">외부 API</text>
  </g>

  <!-- postgres -->
  <rect x="602" y="384" width="130" height="56" rx="10" fill="#ffffff" stroke="#2496ed"/>
  <text x="667" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Postgres</text>
  <text x="667" y="427" text-anchor="middle" font-size="12" fill="#64748b">키 · 예산 · spend 로그</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="528" y1="142" x2="568" y2="170" marker-end="url(#arrow)"/>
    <line x1="528" y1="222" x2="568" y2="222" marker-end="url(#arrow)"/>
    <line x1="528" y1="302" x2="568" y2="274" marker-end="url(#arrow)"/>
    <line x1="762" y1="170" x2="806" y2="142" marker-end="url(#arrow)"/>
    <line x1="762" y1="222" x2="806" y2="222" marker-end="url(#arrow)"/>
    <line x1="762" y1="274" x2="806" y2="302" marker-end="url(#arrow)"/>
    <line x1="667" y1="344" x2="667" y2="380" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  </g>
  <text x="865" y="350" text-anchor="middle" font-size="12" fill="#64748b">실제 모델 서버</text>
  <text x="675" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">하나의 OpenAI 호환 엔드포인트 + 키별 한도 + 장애 우회</text>
</svg>
