<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">하이브리드 검색 + 리랭킹 — 넉넉히 모으고, 합치고, 정확히 고른다</text>

  <!-- Qdrant boundary -->
  <rect x="405" y="62" width="400" height="330" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="605" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',monospace">Qdrant query_points (서버 안에서)</text>

  <!-- question -->
  <rect x="20" y="190" width="140" height="76" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">질문</text>
  <text x="90" y="244" text-anchor="middle" font-size="11" fill="#334155">"'search' 에러가 나요"</text>

  <line x1="160" y1="212" x2="196" y2="128" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="160" y1="244" x2="196" y2="328" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- dense branch -->
  <text x="290" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">밀집 (dense)</text>
  <rect x="198" y="98" width="190" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="293" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">bge-m3 임베딩</text>
  <text x="293" y="147" text-anchor="middle" font-size="12" fill="#5b21b6">TEI embed · 1024차원</text>
  <line x1="388" y1="130" x2="428" y2="130" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="430" y="98" width="180" height="64" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="520" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">Prefetch</text>
  <text x="520" y="147" text-anchor="middle" font-size="12" fill="#5b21b6" font-family="Consolas,'D2Coding',monospace">using="dense" limit=40</text>

  <!-- sparse branch -->
  <text x="290" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">희소 (sparse · BM25)</text>
  <rect x="198" y="298" width="190" height="64" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="293" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Kiwi 형태소 + BM25 TF</text>
  <text x="293" y="347" text-anchor="middle" font-size="12" fill="#78350f">코드 토큰은 통째로</text>
  <line x1="388" y1="330" x2="428" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="430" y="298" width="180" height="64" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="520" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="Consolas,'D2Coding',monospace">Prefetch</text>
  <text x="520" y="347" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">using="sparse" limit=40</text>
  <text x="520" y="380" text-anchor="middle" font-size="11" fill="#92400e">IDF는 Qdrant가 계산 (Modifier.IDF)</text>

  <!-- fusion -->
  <line x1="610" y1="130" x2="652" y2="196" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="610" y1="330" x2="652" y2="264" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="654" y="180" width="136" height="100" rx="10" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="722" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">융합</text>
  <text x="722" y="232" text-anchor="middle" font-size="12" fill="#1e40af">RRF: Σ 1/(k+순위)</text>
  <text x="722" y="252" text-anchor="middle" font-size="12" fill="#1e40af">또는 DBSF</text>
  <text x="722" y="270" text-anchor="middle" font-size="11" fill="#1e40af">(점수 정규화 합)</text>

  <!-- rerank -->
  <line x1="790" y1="230" x2="850" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="820" y="220" text-anchor="middle" font-size="11" fill="#64748b">후보 20</text>
  <rect x="852" y="176" width="150" height="108" rx="10" fill="#16a34a"/>
  <text x="927" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">리랭커</text>
  <text x="927" y="226" text-anchor="middle" font-size="12" fill="#ffffff">cross-encoder</text>
  <text x="927" y="246" text-anchor="middle" font-size="11" fill="#ffffff">bge-reranker-v2-m3</text>
  <text x="927" y="264" text-anchor="middle" font-size="11" fill="#ffffff">(TEI) 또는 Cohere</text>

  <line x1="1002" y1="230" x2="1020" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1022" y="196" width="70" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="1057" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">top-4</text>
  <text x="1057" y="246" text-anchor="middle" font-size="12" fill="#334155">→ LLM</text>

  <!-- stage strip -->
  <rect x="198" y="414" width="592" height="40" rx="8" fill="#f1f5f9"/>
  <text x="494" y="439" text-anchor="middle" font-size="13" fill="#334155">1단계 — 빠르고 넉넉하게: 검색기별 40개 → 순위로 합쳐 20개 (수십 ms)</text>
  <rect x="852" y="414" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="972" y="439" text-anchor="middle" font-size="13" fill="#166534">2단계 — 느리고 정확하게</text>
  <text x="927" y="304" text-anchor="middle" font-size="11" fill="#166534">지연 ∝ 후보 수</text>
</svg>
