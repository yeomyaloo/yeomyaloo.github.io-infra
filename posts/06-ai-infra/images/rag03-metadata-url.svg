<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">레포 경로 한 줄에서 메타데이터 · URL · 필터까지</text>

  <!-- 입력 -->
  <rect x="30" y="56" width="900" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="50" y="90" font-size="18" font-family="Consolas,'D2Coding',monospace" fill="#334155"><tspan fill="#dc2626" font-weight="700">hacking</tspan>/<tspan fill="#4f46e5" font-weight="700">hack28</tspan>-capstone-rag-assessment.md</text>
  <text x="910" y="90" text-anchor="end" font-size="14" fill="#64748b">+ 본문 (# 제목, 난이도 ★, front matter)</text>

  <!-- 분해 -->
  <rect x="30" y="150" width="210" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="135" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">최상위 폴더 → FOLDERS</text>
  <text x="135" y="204" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">tab = "hacking"</text>
  <text x="135" y="228" text-anchor="middle" font-size="13" fill="#7f1d1d">URL 폴더 = 10-hacking</text>
  <text x="135" y="248" text-anchor="middle" font-size="11.5" fill="#991b1b">(탭 경로 /hacking/ 과 다름)</text>

  <rect x="260" y="150" width="210" height="110" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="365" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">접두어 + 숫자 → SLUG_RE</text>
  <text x="365" y="204" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">series = "hacking"</text>
  <text x="365" y="228" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">ep = 28</text>
  <text x="365" y="248" text-anchor="middle" font-size="11.5" fill="#3730a3">certs/ 아래는 하위 폴더 = 시리즈</text>

  <rect x="490" y="150" width="210" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="595" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">제목</text>
  <text x="595" y="204" text-anchor="middle" font-size="13" fill="#4c1d95">front matter title 우선,</text>
  <text x="595" y="226" text-anchor="middle" font-size="13" fill="#4c1d95">없으면 첫 '# ' 줄</text>
  <text x="595" y="248" text-anchor="middle" font-size="11.5" fill="#5b21b6">"해킹 28. 종합 실습 …"</text>

  <rect x="720" y="150" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="825" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">헤더 인용 블록 · 첫 줄</text>
  <text x="825" y="204" text-anchor="middle" font-size="13" fill="#78350f" font-family="Consolas,'D2Coding',monospace">level = 5</text>
  <text x="825" y="228" text-anchor="middle" font-size="12" fill="#78350f" font-family="Consolas,'D2Coding',monospace">has_front_matter = false</text>
  <text x="825" y="248" text-anchor="middle" font-size="11.5" fill="#92400e">front matter는 본문에서 뗀다</text>

  <line x1="88" y1="112" x2="125" y2="147" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="112" x2="345" y2="147" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="112" x2="610" y2="147" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="112" x2="820" y2="147" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- URL -->
  <text x="30" y="296" font-size="14" font-weight="700" fill="#334155">url — 색인할 때 한 번 계산해 payload에 저장, 답변 출처로 코드가 붙인다</text>
  <rect x="30" y="306" width="900" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="48" y="337" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#14532d">https://yeomyaloo.github.io/yeomyaloo.github.io-infra/<tspan fill="#dc2626" font-weight="700">10-hacking</tspan>/<tspan fill="#4f46e5" font-weight="700">hack28</tspan>-capstone-rag-assessment/</text>

  <!-- 필터 -->
  <text x="30" y="392" font-size="14" font-weight="700" fill="#334155">필터 검색 — payload 인덱스(keyword: tab·series·source, integer: ep)</text>
  <rect x="30" y="402" width="900" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="48" y="436" font-size="14" font-family="Consolas,'D2Coding',monospace" fill="#4c1d95">Filter(must=[tab == "hacking", 21 ≤ ep ≤ 28])</text>
  <text x="912" y="436" text-anchor="end" font-size="14" fill="#4c1d95">→ 해킹 21~28편의 청크만 후보로</text>
</svg>
