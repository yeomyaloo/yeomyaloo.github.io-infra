<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">블로그 문서 챗봇 — 색인 경로와 질의 경로</text>

  <!-- 색인 경로 -->
  <text x="20" y="68" font-size="15" font-weight="700" fill="#334155">① 색인 경로 (문서가 바뀔 때)</text>

  <rect x="20" y="80" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">infra 레포 (GitHub)</text>
  <text x="120" y="130" text-anchor="middle" font-size="12.5" fill="#334155">main 브랜치 .md 약 200편</text>
  <text x="120" y="150" text-anchor="middle" font-size="12.5" fill="#334155">front matter 없음</text>
  <text x="120" y="170" text-anchor="middle" font-size="12.5" fill="#334155">루트 README.md 제외</text>

  <rect x="260" y="80" width="200" height="110" rx="10" fill="#7c3aed"/>
  <text x="360" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">변경 감지 (7장)</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">git diff --name-status</text>
  <text x="360" y="150" text-anchor="middle" font-size="12.5" fill="#ede9fe">A: CronJob + PVC, 15분</text>
  <text x="360" y="170" text-anchor="middle" font-size="12.5" fill="#ede9fe">B: Actions + Tailscale</text>

  <rect x="500" y="80" width="200" height="110" rx="10" fill="#7c3aed"/>
  <text x="600" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">인덱서</text>
  <text x="600" y="130" text-anchor="middle" font-size="12.5" fill="#ffffff">blogmeta: 탭·시리즈·URL</text>
  <text x="600" y="150" text-anchor="middle" font-size="12.5" fill="#ede9fe">scan → [HOLD] 사람 검토</text>
  <text x="600" y="170" text-anchor="middle" font-size="12.5" fill="#ede9fe">청킹 → bge-m3 임베딩</text>

  <rect x="740" y="80" width="200" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="840" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Qdrant blog_docs</text>
  <text x="840" y="130" text-anchor="middle" font-size="12.5" fill="#78350f">payload: tab, series, ep,</text>
  <text x="840" y="150" text-anchor="middle" font-size="12.5" fill="#78350f">title, url, file_hash</text>
  <text x="840" y="170" text-anchor="middle" font-size="12.5" fill="#78350f">+ payload 인덱스 (5장)</text>

  <line x1="220" y1="135" x2="257" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="135" x2="497" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="135" x2="737" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="216" text-anchor="middle" font-size="12.5" fill="#64748b">+ 하루 1회 해시 전체 비교(안전망) · 색인 뒤 check_urls.py로 출처 링크 404 검사</text>

  <!-- 질의 경로 -->
  <text x="20" y="300" font-size="15" font-weight="700" fill="#334155">② 질의 경로 (질문할 때마다)</text>

  <rect x="20" y="315" width="175" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="107" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">블로그 위젯 (8-2)</text>
  <text x="107" y="362" text-anchor="middle" font-size="12" fill="#334155">github.io · 익명 (선택)</text>

  <rect x="20" y="393" width="175" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="107" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Open WebUI (8-1)</text>
  <text x="107" y="440" text-anchor="middle" font-size="12" fill="#334155">내부 · 탭별 모델</text>

  <rect x="230" y="315" width="150" height="140" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="305" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Cloudflare</text>
  <text x="305" y="366" text-anchor="middle" font-size="12.5" fill="#334155">Tunnel (포트 0개)</text>
  <text x="305" y="388" text-anchor="middle" font-size="12.5" fill="#334155">WAF 레이트 리밋</text>
  <text x="305" y="410" text-anchor="middle" font-size="12.5" fill="#334155">(선택) Turnstile</text>
  <text x="305" y="432" text-anchor="middle" font-size="12.5" fill="#334155">Access (내부용)</text>

  <rect x="415" y="315" width="200" height="140" rx="10" fill="#7c3aed"/>
  <text x="515" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rag-api (FastAPI)</text>
  <text x="515" y="366" text-anchor="middle" font-size="12.5" fill="#ffffff">탭·시리즈·편 필터 검색</text>
  <text x="515" y="388" text-anchor="middle" font-size="12.5" fill="#ffffff">출처 = payload의 url</text>
  <text x="515" y="410" text-anchor="middle" font-size="12.5" fill="#ede9fe">CORS 1개 · 5/min · 500자</text>
  <text x="515" y="432" text-anchor="middle" font-size="12.5" fill="#ede9fe">출력 검증 (Day 48)</text>

  <rect x="650" y="315" width="140" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="720" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">LiteLLM</text>
  <text x="720" y="366" text-anchor="middle" font-size="12.5" fill="#4c1d95">rag-public 키</text>
  <text x="720" y="388" text-anchor="middle" font-size="12.5" fill="#4c1d95">rpm · tpm 한도</text>
  <text x="720" y="410" text-anchor="middle" font-size="12.5" fill="#4c1d95">하루 예산 상한</text>
  <text x="720" y="432" text-anchor="middle" font-size="12.5" fill="#4c1d95">(Day 40)</text>

  <rect x="825" y="315" width="120" height="140" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="885" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">vLLM / Ollama</text>
  <text x="885" y="366" text-anchor="middle" font-size="12.5" fill="#14532d">답변 생성</text>
  <text x="885" y="400" text-anchor="middle" font-size="12" fill="#14532d">GPU 없으면</text>
  <text x="885" y="420" text-anchor="middle" font-size="12" fill="#14532d">Ollama CPU</text>

  <line x1="195" y1="346" x2="227" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="195" y1="424" x2="227" y2="412" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="385" x2="412" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="385" x2="647" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="385" x2="822" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- rag-api -> Qdrant -->
  <path d="M515,313 V252 H840 V193" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrowp)"/>
  <text x="690" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed">질문 벡터 + query_filter (tab, series, ep)</text>

  <rect x="20" y="478" width="16" height="16" rx="3" fill="#7c3aed"/>
  <text x="44" y="491" font-size="13" fill="#334155">보라 = 오늘 새로 만들거나 바꾸는 부분</text>
  <rect x="330" y="478" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="354" y="491" font-size="13" fill="#334155">나머지 = Day 42~49 구성 그대로</text>
  <text x="940" y="491" text-anchor="end" font-size="12" fill="#64748b">답변: 번호 [n] + 코드가 붙인 블로그 URL</text>
</svg>
