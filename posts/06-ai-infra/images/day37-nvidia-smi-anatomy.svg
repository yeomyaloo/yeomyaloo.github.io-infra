<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">nvidia-smi 출력 읽는 법</text>

  <!-- Terminal panel -->
  <rect x="20" y="52" width="632" height="270" rx="10" fill="#0f172a"/>
  <g font-family="Consolas,'D2Coding',monospace">
    <!-- header -->
    <g font-size="13" fill="#f8fafc">
      <text x="36" y="84">NVIDIA-SMI 580.95.05</text>
      <text x="214" y="84">Driver Version: 580.95.05</text>
      <text x="446" y="84">CUDA Version: 13.0</text>
    </g>
    <line x1="30" y1="98" x2="642" y2="98" stroke="#475569"/>
    <!-- column headers -->
    <g font-size="12" fill="#94a3b8">
      <text x="36" y="120">GPU</text><text x="72" y="120">Name</text><text x="226" y="120">Persistence-M</text>
      <text x="345" y="120">Bus-Id</text><text x="448" y="120">Disp.A</text>
      <text x="508" y="120">Volatile ECC</text>
      <text x="36" y="140">Fan</text><text x="72" y="140">Temp</text><text x="120" y="140">Perf</text><text x="236" y="140">Pwr:Usage/Cap</text>
      <text x="345" y="140">Memory-Usage</text>
      <text x="508" y="140">GPU-Util</text><text x="572" y="140">Compute M.</text>
    </g>
    <line x1="30" y1="152" x2="642" y2="152" stroke="#475569"/>
    <line x1="30" y1="155" x2="642" y2="155" stroke="#475569"/>
    <!-- data -->
    <g font-size="12" fill="#f8fafc">
      <text x="40" y="178">0</text><text x="72" y="178">NVIDIA GeForce RTX 4060 ...</text><text x="296" y="178">Off</text>
      <text x="345" y="178">00000000:01:00.0</text><text x="464" y="178">Off</text>
      <text x="560" y="178">N/A</text>
      <text x="36" y="202">N/A</text><text x="72" y="202">42C</text><text x="120" y="202">P8</text><text x="236" y="202">2W / 80W</text>
      <text x="345" y="202">2MiB / 8188MiB</text>
      <text x="508" y="202">0%</text><text x="572" y="202">Default</text>
    </g>
    <line x1="30" y1="216" x2="642" y2="216" stroke="#475569"/>
    <g stroke="#334155">
      <line x1="332" y1="104" x2="332" y2="212"/>
      <line x1="498" y1="104" x2="498" y2="212"/>
    </g>
    <!-- processes -->
    <g font-size="12">
      <text x="36" y="240" fill="#f8fafc">Processes:</text>
      <g fill="#94a3b8">
        <text x="36" y="262">GPU</text><text x="90" y="262">PID</text><text x="160" y="262">Type</text><text x="220" y="262">Process name</text><text x="520" y="262">GPU Memory</text>
      </g>
      <line x1="30" y1="272" x2="642" y2="272" stroke="#475569"/>
      <g fill="#f8fafc">
        <text x="40" y="296">0</text><text x="90" y="296">41235</text><text x="168" y="296">C</text><text x="220" y="296">/usr/bin/ollama</text><text x="520" y="296">5120MiB</text>
      </g>
    </g>
  </g>

  <!-- markers on panel -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="411" cy="80" r="9" fill="#7c3aed"/><text x="411" y="84" fill="#ffffff">1</text>
    <circle cx="606" cy="80" r="9" fill="#7c3aed"/><text x="606" y="84" fill="#ffffff">2</text>
    <circle cx="149" cy="198" r="8" fill="#7c3aed"/><text x="149" y="202" fill="#ffffff">3</text>
    <circle cx="307" cy="198" r="8" fill="#7c3aed"/><text x="307" y="202" fill="#ffffff">4</text>
    <circle cx="452" cy="198" r="8" fill="#7c3aed"/><text x="452" y="202" fill="#ffffff">5</text>
    <circle cx="538" cy="198" r="8" fill="#7c3aed"/><text x="538" y="202" fill="#ffffff">6</text>
    <circle cx="592" cy="292" r="8" fill="#7c3aed"/><text x="592" y="296" fill="#ffffff">7</text>
  </g>

  <!-- Legend -->
  <g>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <circle cx="672" cy="70" r="9" fill="#7c3aed"/><text x="672" y="74" fill="#ffffff">1</text>
      <circle cx="672" cy="108" r="9" fill="#7c3aed"/><text x="672" y="112" fill="#ffffff">2</text>
      <circle cx="672" cy="146" r="9" fill="#7c3aed"/><text x="672" y="150" fill="#ffffff">3</text>
      <circle cx="672" cy="184" r="9" fill="#7c3aed"/><text x="672" y="188" fill="#ffffff">4</text>
      <circle cx="672" cy="222" r="9" fill="#7c3aed"/><text x="672" y="226" fill="#ffffff">5</text>
      <circle cx="672" cy="260" r="9" fill="#7c3aed"/><text x="672" y="264" fill="#ffffff">6</text>
      <circle cx="672" cy="298" r="9" fill="#7c3aed"/><text x="672" y="302" fill="#ffffff">7</text>
    </g>
    <g font-size="13" font-weight="700" fill="#0f172a">
      <text x="690" y="75">Driver Version</text>
      <text x="690" y="113">CUDA Version <tspan fill="#dc2626">(주의!)</tspan></text>
      <text x="690" y="151">Temp · Perf</text>
      <text x="690" y="189">Pwr:Usage/Cap</text>
      <text x="690" y="227">Memory-Usage</text>
      <text x="690" y="265">GPU-Util</text>
      <text x="690" y="303">Processes</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="690" y="92">설치된 드라이버 버전</text>
      <text x="690" y="130">드라이버가 지원하는 최대 CUDA 버전</text>
      <text x="690" y="168">온도 / 성능 상태 P0(최대) ~ P12(최저)</text>
      <text x="690" y="206">현재 전력 / 전력 상한 (W)</text>
      <text x="690" y="244">사용 중 VRAM / 전체 VRAM</text>
      <text x="690" y="282">최근 구간 GPU 커널 실행 시간 비율</text>
      <text x="690" y="320">GPU를 쓰는 프로세스와 VRAM 사용량</text>
    </g>
  </g>

  <text x="20" y="356" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">watch -n 1 nvidia-smi   ·   nvidia-smi dmon   ·   nvidia-smi --query-gpu=memory.used,utilization.gpu --format=csv</text>
</svg>
