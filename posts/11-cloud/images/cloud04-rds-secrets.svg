<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RDS PostgreSQL — 프라이빗 DB 서브넷 + Secrets Manager</text>

  <!-- VPC -->
  <rect x="20" y="52" width="630" height="470" rx="14" fill="#fffaf2" stroke="#ff9900" stroke-width="2"/>
  <text x="36" y="74" font-size="13" font-weight="700" fill="#7c4a03">infra-cloud-vpc 10.20.0.0/16</text>

  <!-- app subnet -->
  <rect x="36" y="86" width="290" height="140" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="48" y="106" font-size="12" font-weight="700" fill="#312e81">priv-a 10.20.10.0/24</text>
  <rect x="56" y="116" width="250" height="96" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="181" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">앱 / 클라이언트 EC2</text>
  <text x="181" y="160" text-anchor="middle" font-size="12" fill="#334155">SG infra-cloud-app-sg</text>
  <text x="181" y="180" text-anchor="middle" font-size="12" fill="#334155">IAM 역할: GetSecretValue</text>
  <text x="181" y="198" text-anchor="middle" font-size="11" fill="#64748b">(이 비밀 ARN 하나만)</text>

  <!-- NAT -->
  <rect x="344" y="86" width="290" height="140" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="356" y="106" font-size="12" font-weight="700" fill="#14532d">pub-a 10.20.0.0/24</text>
  <rect x="364" y="116" width="250" height="96" rx="8" fill="#ffffff" stroke="#c2410c"/>
  <text x="489" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">NAT Gateway</text>
  <text x="489" y="164" text-anchor="middle" font-size="12" fill="#334155">Secrets Manager API 호출 경로</text>
  <text x="489" y="184" text-anchor="middle" font-size="11" fill="#64748b">(또는 secretsmanager</text>
  <text x="489" y="200" text-anchor="middle" font-size="11" fill="#64748b">인터페이스 엔드포인트)</text>
  <line x1="308" y1="164" x2="360" y2="164" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowO)"/>

  <!-- DB subnets -->
  <rect x="36" y="268" width="290" height="160" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="48" y="288" font-size="12" font-weight="700" fill="#0f172a">db-a 10.20.20.0/24</text>
  <rect x="56" y="298" width="250" height="116" rx="8" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="181" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">RDS infra-cloud-pg</text>
  <text x="181" y="342" text-anchor="middle" font-size="12" fill="#334155">PostgreSQL · db.t4g.micro</text>
  <text x="181" y="362" text-anchor="middle" font-size="12" fill="#334155">gp3 20GB · 암호화</text>
  <text x="181" y="382" text-anchor="middle" font-size="12" fill="#334155">SG infra-cloud-db-sg</text>
  <text x="181" y="402" text-anchor="middle" font-size="11" fill="#64748b">PubliclyAccessible = false</text>

  <rect x="344" y="268" width="290" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="356" y="288" font-size="12" font-weight="700" fill="#475569">db-c 10.20.21.0/24</text>
  <rect x="364" y="298" width="250" height="116" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="489" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Multi-AZ 대기 인스턴스</text>
  <text x="489" y="362" text-anchor="middle" font-size="12" fill="#64748b">운영에서는 여기에 동기 복제</text>
  <text x="489" y="382" text-anchor="middle" font-size="12" fill="#64748b">(오늘은 비용 때문에 Single-AZ)</text>

  <line x1="290" y1="214" x2="290" y2="294" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="246" font-size="12" font-weight="700" fill="#0f172a">5432 (db-sg ← app-sg)</text>
  <text x="60" y="262" font-size="11" fill="#64748b">sslmode=require</text>

  <rect x="36" y="442" width="598" height="66" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="335" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">DB 서브넷 그룹 infra-cloud-db-subnets (2a + 2c)</text>
  <text x="335" y="490" text-anchor="middle" font-size="12" fill="#475569">main 라우팅 테이블: 10.20.0.0/16 local 만 — IGW · NAT 경로 없음</text>

  <!-- Secrets Manager -->
  <rect x="680" y="60" width="300" height="190" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="830" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#7c4a03">Secrets Manager</text>
  <text x="830" y="110" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">rds!db-0a1b2c3d-...</text>
  <rect x="704" y="122" width="252" height="34" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="830" y="144" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">{"username", "password"}</text>
  <text x="830" y="180" text-anchor="middle" font-size="12" fill="#334155">RDS가 생성 · 저장 (사람은 모름)</text>
  <text x="830" y="200" text-anchor="middle" font-size="12" fill="#334155">자동 회전 기본 7일</text>
  <text x="830" y="222" text-anchor="middle" font-size="11" fill="#64748b">호스트 정보는 없음 → 엔드포인트 따로 전달</text>
  <text x="830" y="240" text-anchor="middle" font-size="11" fill="#64748b">$0.40/비밀-월 (서울, 2026-11-19, 변동 가능)</text>

  <path d="M 308 318 C 334 306 330 247 360 247 L 640 247 C 660 247 664 200 676 186" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="380" y="241" font-size="11" fill="#9a3412">RDS가 비밀 관리 (--manage-master-user-password)</text>
  <path d="M 616 150 C 640 150 650 130 676 128" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowO)"/>

  <!-- Snapshots -->
  <rect x="680" y="270" width="300" height="252" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="830" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">백업 · 스냅샷</text>
  <rect x="700" y="310" width="260" height="88" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="830" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">자동 백업 (보존 1일)</text>
  <text x="830" y="356" text-anchor="middle" font-size="12" fill="#334155">시점 복구(PITR) 가능</text>
  <text x="830" y="378" text-anchor="middle" font-size="11" fill="#64748b">--delete-automated-backups로 함께 삭제</text>
  <rect x="700" y="410" width="260" height="96" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="830" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">수동 스냅샷 snap1</text>
  <text x="830" y="456" text-anchor="middle" font-size="12" fill="#334155">DB를 지워도 남는다</text>
  <text x="830" y="476" text-anchor="middle" font-size="12" fill="#334155">→ 직접 삭제 (과금 단골)</text>
  <text x="830" y="496" text-anchor="middle" font-size="11" fill="#64748b">복원은 항상 새 인스턴스</text>
</svg>
