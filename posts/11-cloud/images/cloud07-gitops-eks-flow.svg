<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef7b4d"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">EKS 위 GitOps — Git이 바뀌면 컨트롤러가 AWS 리소스를 만든다</text>

  <!-- GitHub -->
  <rect x="20" y="78" width="186" height="118" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="113" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="113" y="126" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">gitops-demo-config</text>
  <text x="113" y="150" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#475569">apps/demo-app/</text>
  <text x="113" y="166" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#475569">overlays/eks-dev</text>
  <text x="113" y="186" text-anchor="middle" font-size="11" fill="#64748b">+ base (Day 50~63)</text>

  <!-- EKS -->
  <rect x="232" y="58" width="460" height="436" rx="14" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="252" y="82" font-size="15" font-weight="700" fill="#1e3a8a">infra-cloud-eks (Kubernetes 1.37)</text>

  <rect x="252" y="96" width="190" height="66" rx="10" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="347" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Argo CD</text>
  <text x="347" y="146" text-anchor="middle" font-size="12" fill="#9a3412">auto-sync · self-heal</text>

  <rect x="252" y="196" width="420" height="126" rx="10" fill="#ffffff" stroke="#326ce5"/>
  <text x="266" y="216" font-size="12" font-weight="700" fill="#1e3a8a">namespace demo-dev</text>
  <rect x="266" y="230" width="124" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="328" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Ingress</text>
  <text x="328" y="270" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#92400e">class: alb</text>
  <rect x="400" y="230" width="112" height="50" rx="8" fill="#e2e8f0"/>
  <text x="456" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Service</text>
  <text x="456" y="270" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">dev-demo-app</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" text-anchor="middle">
    <rect x="522" y="226" width="136" height="26" rx="6" fill="#c7d2fe"/>
    <text x="590" y="243" fill="#312e81">Pod 10.20.10.71</text>
    <rect x="522" y="258" width="136" height="26" rx="6" fill="#c7d2fe"/>
    <text x="590" y="275" fill="#312e81">Pod 10.20.11.52</text>
  </g>
  <text x="658" y="216" text-anchor="end" font-size="11" fill="#475569">Rollout dev-demo-app · 카나리 = Pod 수 비율</text>

  <rect x="252" y="370" width="420" height="108" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="266" y="390" font-size="12" font-weight="700" fill="#334155">컨트롤러 (kube-system · external-dns)</text>
  <rect x="266" y="402" width="180" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="356" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">ExternalDNS</text>
  <text x="356" y="448" text-anchor="middle" font-size="11" fill="#166534">host → Route 53 레코드</text>
  <rect x="478" y="402" width="180" height="62" rx="8" fill="#fff4e5" stroke="#ff9900"/>
  <text x="568" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">AWS Load Balancer</text>
  <text x="568" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Controller</text>
  <text x="568" y="458" text-anchor="middle" font-size="11" fill="#9a3412">Ingress → ALB</text>

  <!-- AWS side -->
  <rect x="722" y="60" width="218" height="46" rx="10" fill="#334155"/>
  <text x="831" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">사용자</text>
  <text x="831" y="99" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#e2e8f0">https://demo.example.com</text>

  <rect x="722" y="132" width="218" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="831" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Route 53</text>
  <text x="831" y="177" text-anchor="middle" font-size="11" fill="#166534">demo.example.com → ALB 별칭(A)</text>

  <rect x="722" y="214" width="218" height="86" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="831" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">ALB (퍼블릭 서브넷)</text>
  <text x="831" y="258" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#9a3412">k8s-infracloudpub-…</text>
  <text x="831" y="276" text-anchor="middle" font-size="11" fill="#9a3412">HTTPS:443 · HTTP→HTTPS</text>
  <text x="831" y="292" text-anchor="middle" font-size="11" fill="#9a3412">대상 = Pod IP (target-type ip)</text>

  <rect x="722" y="322" width="218" height="46" rx="10" fill="#ffffff" stroke="#ff9900"/>
  <text x="831" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">ACM 인증서 (무료)</text>
  <text x="831" y="360" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#9a3412">demo.example.com</text>

  <rect x="722" y="392" width="218" height="86" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="831" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">IAM 역할 (Pod Identity)</text>
  <text x="831" y="436" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">infra-cloud-aws-lbc</text>
  <text x="831" y="454" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">infra-cloud-external-dns</text>
  <text x="831" y="471" text-anchor="middle" font-size="11" fill="#64748b">SA ↔ 역할 association</text>

  <!-- arrows -->
  <line x1="206" y1="130" x2="250" y2="130" stroke="#ef7b4d" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <text x="228" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#ef7b4d">①</text>
  <line x1="347" y1="162" x2="347" y2="194" stroke="#ef7b4d" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <text x="360" y="184" font-size="12" font-weight="700" fill="#ef7b4d">② sync</text>

  <line x1="310" y1="282" x2="310" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="370" y1="282" x2="540" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="318" y="350" font-size="11" fill="#475569">watch</text>

  <line x1="658" y1="420" x2="720" y2="272" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowO)"/>
  <text x="672" y="352" font-size="12" font-weight="700" fill="#c2410c">③</text>
  <path d="M356,464 L356,512 L706,512 L706,166 L720,166" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="528" text-anchor="middle" font-size="12" fill="#16a34a">④ ExternalDNS가 레코드 생성 (upsert-only)</text>

  <line x1="831" y1="106" x2="831" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="831" y1="190" x2="831" y2="212" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="831" y1="322" x2="831" y2="302" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <line x1="722" y1="256" x2="660" y2="256" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="694" y="246" text-anchor="middle" font-size="11" fill="#334155">⑤</text>
  <line x1="722" y1="440" x2="660" y2="440" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
