<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">장기 액세스 키 vs SSO 단기 자격 증명</text>

  <!-- Left: long-term key -->
  <rect x="20" y="60" width="450" height="340" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">장기 액세스 키 (IAM 사용자)</text>
  <text x="245" y="112" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#7f1d1d">AKIA... → ~/.aws/credentials (평문)</text>

  <text x="44" y="146" font-size="13" fill="#334155">수명</text>
  <rect x="90" y="130" width="356" height="26" rx="6" fill="#fca5a5"/>
  <text x="268" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">생성 ──── 직접 지울 때까지 계속 유효</text>

  <text x="44" y="190" font-size="14" font-weight="700" fill="#0f172a">흔한 유출 경로</text>
  <g font-size="13" fill="#334155">
    <rect x="44" y="202" width="196" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="142" y="224" text-anchor="middle">GitHub 커밋</text>
    <rect x="250" y="202" width="196" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="348" y="224" text-anchor="middle">이미지 레이어 (Day 02)</text>
    <rect x="44" y="244" width="196" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="142" y="266" text-anchor="middle">블로그 스크린샷</text>
    <rect x="250" y="244" width="196" height="34" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="348" y="266" text-anchor="middle">노트북 분실</text>
  </g>
  <rect x="44" y="298" width="402" height="84" rx="10" fill="#dc2626"/>
  <text x="245" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">유출 = 전 세계 어디서나 내 계정 사용</text>
  <text x="245" y="348" text-anchor="middle" font-size="13" fill="#fee2e2">봇이 공개 저장소를 수 분 안에 스캔</text>
  <text x="245" y="368" text-anchor="middle" font-size="13" fill="#fee2e2">→ 고성능 인스턴스로 채굴, 요금 폭탄</text>

  <!-- Right: SSO -->
  <rect x="490" y="60" width="450" height="340" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">SSO / STS 단기 자격 증명</text>
  <text x="715" y="112" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#166534">ASIA... + 세션 토큰 (만료 시각 포함)</text>

  <text x="514" y="146" font-size="13" fill="#334155">수명</text>
  <rect x="560" y="130" width="150" height="26" rx="6" fill="#86efac"/>
  <text x="635" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">유효 4시간</text>
  <rect x="714" y="130" width="202" height="26" rx="6" fill="#e2e8f0"/>
  <text x="815" y="148" text-anchor="middle" font-size="13" fill="#64748b">만료 → 다시 로그인</text>

  <text x="514" y="190" font-size="14" font-weight="700" fill="#0f172a">누가 무엇으로 쓰나</text>
  <g font-size="13" fill="#334155">
    <rect x="514" y="202" width="402" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="530" y="224">사람 → Identity Center + aws sso login</text>
    <rect x="514" y="244" width="402" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="530" y="266">EC2 등 AWS 리소스 → IAM 역할 (클라우드 03)</text>
  </g>
  <rect x="514" y="286" width="402" height="34" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="530" y="308" font-size="13" fill="#334155">CI (GitHub Actions) → OIDC로 역할 맡기</text>
  <rect x="514" y="330" width="402" height="52" rx="10" fill="#16a34a"/>
  <text x="715" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">유출돼도 몇 시간 뒤 쓸모없음</text>
  <text x="715" y="372" text-anchor="middle" font-size="13" fill="#dcfce7">로그인 단계에 MFA · 감사 로그에 사람 이름</text>
</svg>
