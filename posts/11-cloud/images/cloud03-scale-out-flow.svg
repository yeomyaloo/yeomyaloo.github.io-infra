<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">스케일 아웃은 이렇게 일어난다 (대상 추적 정책)</text>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="66" width="140" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="90" y="92" font-size="14" font-weight="700" fill="#991b1b">① 부하</text>
    <text x="90" y="116" fill="#334155" font-family="Consolas,'D2Coding',monospace">curl /burn</text>
    <text x="90" y="136" fill="#334155">× 4회 (ALB가</text>
    <text x="90" y="154" fill="#334155">두 대에 분산)</text>

    <rect x="180" y="66" width="140" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="250" y="92" font-size="14" font-weight="700" fill="#78350f">② 지표</text>
    <text x="250" y="116" fill="#334155">ASG 평균 CPU</text>
    <text x="250" y="136" fill="#334155">&gt; 목표 40%</text>
    <text x="250" y="154" fill="#64748b">(1분 세부 모니터링)</text>

    <rect x="340" y="66" width="140" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="410" y="92" font-size="14" font-weight="700" fill="#78350f">③ 경보</text>
    <text x="410" y="116" fill="#334155">TargetTracking-</text>
    <text x="410" y="136" fill="#334155">...-AlarmHigh</text>
    <text x="410" y="154" fill="#64748b">몇 분 연속 초과 시</text>

    <rect x="500" y="66" width="140" height="120" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
    <text x="570" y="92" font-size="14" font-weight="700" fill="#7c4a03">④ ASG</text>
    <text x="570" y="116" fill="#334155">desired</text>
    <text x="570" y="136" fill="#334155">2 → 3 → 4</text>
    <text x="570" y="154" fill="#64748b">(max 4에서 멈춤)</text>

    <rect x="660" y="66" width="140" height="120" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="730" y="92" font-size="14" font-weight="700" fill="#312e81">⑤ 시작</text>
    <text x="730" y="116" fill="#334155">시작 템플릿으로</text>
    <text x="730" y="136" fill="#334155">EC2 + user data</text>
    <text x="730" y="154" fill="#64748b">앱 기동 2~4분</text>

    <rect x="820" y="66" width="120" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="880" y="92" font-size="14" font-weight="700" fill="#14532d">⑥ 투입</text>
    <text x="880" y="116" fill="#334155">TG 헬스 체크</text>
    <text x="880" y="136" fill="#334155">initial →</text>
    <text x="880" y="154" fill="#334155">healthy</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="161" y1="126" x2="177" y2="126" marker-end="url(#arrow)"/>
    <line x1="321" y1="126" x2="337" y2="126" marker-end="url(#arrow)"/>
    <line x1="481" y1="126" x2="497" y2="126" marker-end="url(#arrow)"/>
    <line x1="641" y1="126" x2="657" y2="126" marker-end="url(#arrow)"/>
    <line x1="801" y1="126" x2="817" y2="126" marker-end="url(#arrow)"/>
  </g>

  <!-- scale in -->
  <rect x="20" y="210" width="920" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="236" font-size="14" font-weight="700" fill="#0f172a">스케일 인 (부하 종료 후)</text>
  <text x="40" y="260" font-size="13" fill="#334155">CPU가 목표보다 낮은 상태가 약 15분 지속 → AlarmLow → desired를 천천히 줄임 (min 2 아래로는 안 내려감)</text>
  <text x="40" y="282" font-size="13" fill="#334155">확장은 빠르게(가용성), 축소는 보수적으로(진동 방지) — HPA의 scale-down 안정화 창과 같은 이유</text>

  <!-- HPA mapping -->
  <rect x="20" y="316" width="450" height="84" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <text x="245" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Day 18 HPA</text>
  <text x="245" y="366" text-anchor="middle" font-size="13" fill="#334155">metrics-server → HPA 컨트롤러 → Deployment replicas</text>
  <text x="245" y="386" text-anchor="middle" font-size="12" fill="#64748b">새 Pod는 수 초 · readinessProbe 통과 후 트래픽</text>
  <rect x="490" y="316" width="450" height="84" rx="10" fill="#fff4e5" stroke="#ff9900"/>
  <text x="715" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#7c4a03">AWS Auto Scaling</text>
  <text x="715" y="366" text-anchor="middle" font-size="13" fill="#334155">CloudWatch 지표 → 경보 → 조정 정책 → ASG desired</text>
  <text x="715" y="386" text-anchor="middle" font-size="12" fill="#64748b">새 VM은 수 분 · ALB 헬스 체크 통과 후 트래픽</text>
</svg>
