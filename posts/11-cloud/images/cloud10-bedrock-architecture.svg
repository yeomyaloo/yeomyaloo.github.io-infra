<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bedrock 경로 — infra-cloud-eks 안의 RAG 스택</text>

  <!-- Region -->
  <rect x="10" y="48" width="940" height="500" rx="14" fill="#fffbf5" stroke="#ff9900" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="26" y="72" font-size="14" font-weight="700" fill="#9a3412">AWS 리전 ap-northeast-2 (서울)</text>

  <!-- VPC -->
  <rect x="26" y="84" width="604" height="450" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="40" y="106" font-size="13" font-weight="700" fill="#334155">VPC 10.20.0.0/16 · 프라이빗 서브넷</text>

  <!-- EKS -->
  <rect x="42" y="116" width="572" height="404" rx="12" fill="#eef3fd" stroke="#326ce5" stroke-width="2"/>
  <text x="56" y="138" font-size="14" font-weight="700" fill="#1e3a8a">EKS 클러스터 infra-cloud-eks</text>

  <!-- webui ns -->
  <rect x="60" y="152" width="230" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="70" y="168" font-size="11" fill="#64748b">ns: webui</text>
  <rect x="75" y="176" width="200" height="38" rx="8" fill="#e2e8f0"/>
  <text x="175" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Open WebUI</text>

  <!-- rag ns -->
  <rect x="60" y="244" width="230" height="262" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="70" y="260" font-size="11" fill="#64748b">ns: rag</text>
  <rect x="75" y="268" width="200" height="44" rx="8" fill="#e8eefc" stroke="#326ce5"/>
  <text x="175" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">rag-api ×2</text>
  <text x="175" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">ECR 이미지 · 코드 변경 없음</text>
  <rect x="75" y="340" width="200" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="175" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Qdrant</text>
  <text x="175" y="382" text-anchor="middle" font-size="11" fill="#14532d">infra_docs_titan · EBS gp3 10Gi</text>
  <rect x="75" y="420" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="175" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">reindex CronJob</text>
  <text x="175" y="456" text-anchor="middle" font-size="11" fill="#64748b">전체 재인덱싱 1회 후 증분</text>

  <!-- gateway ns -->
  <rect x="330" y="244" width="268" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="340" y="260" font-size="11" fill="#64748b">ns: gateway</text>
  <rect x="345" y="268" width="238" height="70" rx="8" fill="#ede9fe" stroke="#4f46e5"/>
  <text x="464" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">LiteLLM</text>
  <text x="464" y="308" text-anchor="middle" font-size="11" fill="#312e81">chat → bedrock/apac.amazon.nova-lite</text>
  <text x="464" y="325" text-anchor="middle" font-size="11" fill="#312e81">embed → bedrock/amazon.titan-embed-v2</text>
  <rect x="345" y="358" width="238" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="464" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SA litellm + Pod Identity</text>
  <text x="464" y="400" text-anchor="middle" font-size="11" fill="#64748b">키 없음 · 단기 자격 증명 자동 교체</text>

  <!-- in-cluster arrows -->
  <line x1="175" y1="214" x2="175" y2="266" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="175" y1="312" x2="175" y2="338" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275" y1="290" x2="343" y2="296" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="309" y="282" text-anchor="middle" font-size="11" fill="#334155">/v1</text>
  <line x1="464" y1="338" x2="464" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- port-forward note -->
  <text x="330" y="186" font-size="12" fill="#334155">개발자 PC → kubectl port-forward</text>
  <text x="330" y="204" font-size="12" fill="#334155">(외부 공개는 ALB + HTTPS + 인증 후)</text>

  <!-- ECR -->
  <rect x="660" y="96" width="270" height="58" rx="10" fill="#ffffff" stroke="#ff9900"/>
  <text x="795" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">ECR infra-cloud/infra-rag</text>
  <text x="795" y="140" text-anchor="middle" font-size="11" fill="#64748b">scanOnPush · IMMUTABLE 태그</text>
  <line x1="658" y1="125" x2="618" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="560" y="112" text-anchor="middle" font-size="11" fill="#64748b">이미지 pull</text>

  <!-- Bedrock -->
  <rect x="660" y="190" width="270" height="200" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="795" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Amazon Bedrock</text>
  <rect x="676" y="230" width="238" height="72" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="795" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Nova Lite (생성)</text>
  <text x="795" y="271" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">apac.amazon.nova-lite-v1:0</text>
  <text x="795" y="290" text-anchor="middle" font-size="11" fill="#b91c1c">→ APAC 목적지 리전 중 하나</text>
  <rect x="676" y="312" width="238" height="64" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="795" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Titan Embeddings V2 (1024)</text>
  <text x="795" y="353" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">amazon.titan-embed-text-v2:0</text>
  <text x="795" y="369" text-anchor="middle" font-size="11" fill="#15803d">서울 리전 내</text>

  <line x1="583" y1="303" x2="658" y2="290" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="603" y="271" width="38" height="15" rx="3" fill="#ffffff" stroke="#fdba74"/>
  <text x="622" y="282" text-anchor="middle" font-size="11" fill="#9a3412">SigV4</text>

  <!-- IAM role -->
  <rect x="660" y="420" width="270" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="795" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">IAM 역할 infra-cloud-litellm-bedrock</text>
  <text x="795" y="464" text-anchor="middle" font-size="11" fill="#7f1d1d">bedrock:InvokeModel* — 두 모델만</text>
  <text x="795" y="480" text-anchor="middle" font-size="11" fill="#7f1d1d">신뢰: pods.eks.amazonaws.com</text>
  <path d="M583,390 C620,400 630,450 658,455" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
