<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Pod가 AWS 자격 증명을 받는 두 길 — Pod Identity vs IRSA</text>

  <!-- Pod Identity lane -->
  <rect x="16" y="54" width="928" height="208" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="32" y="78" font-size="15" font-weight="700" fill="#14532d">EKS Pod Identity — EC2 노드 EKS의 권장 경로</text>

  <rect x="30" y="98" width="180" height="96" rx="10" fill="#ffffff" stroke="#326ce5"/>
  <text x="120" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">컨트롤러 Pod</text>
  <text x="120" y="142" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">SA: aws-load-balancer-</text>
  <text x="120" y="157" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">controller</text>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#475569">annotation 필요 없음</text>

  <rect x="240" y="98" width="190" height="96" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="335" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">노드의 Pod Identity</text>
  <text x="335" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Agent (DaemonSet)</text>
  <text x="335" y="162" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#166534">169.254.170.23</text>
  <text x="335" y="180" text-anchor="middle" font-size="11" fill="#166534">노드당 한 번 받아 나눠 줌</text>

  <rect x="460" y="98" width="220" height="96" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">EKS Auth API</text>
  <text x="570" y="142" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#9a3412">AssumeRoleForPodIdentity</text>
  <text x="570" y="162" text-anchor="middle" font-size="11" fill="#9a3412">association 조회:</text>
  <text x="570" y="178" text-anchor="middle" font-size="11" fill="#9a3412">infra-cloud-eks / kube-system / SA → 역할</text>

  <rect x="710" y="98" width="220" height="96" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="820" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IAM 역할 infra-cloud-aws-lbc</text>
  <text x="820" y="144" text-anchor="middle" font-size="11" fill="#334155">신뢰 정책 (클러스터 무관):</text>
  <text x="820" y="162" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">pods.eks.amazonaws.com</text>
  <text x="820" y="180" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">AssumeRole + TagSession</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="210" y1="132" x2="238" y2="132" marker-end="url(#arrow)"/>
    <line x1="430" y1="132" x2="458" y2="132" marker-end="url(#arrow)"/>
    <line x1="680" y1="132" x2="708" y2="132" marker-end="url(#arrow)"/>
  </g>
  <path d="M820,194 L820,232 L120,232 L120,196" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#14532d">임시 자격 증명 (세션 태그: 클러스터·네임스페이스·SA) → SDK가 자동 사용</text>

  <!-- IRSA lane -->
  <rect x="16" y="278" width="928" height="208" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="32" y="302" font-size="15" font-weight="700" fill="#334155">IRSA — Fargate · Windows · EKS 밖에서도 동작하는 이전 방식</text>

  <rect x="30" y="322" width="180" height="96" rx="10" fill="#ffffff" stroke="#326ce5"/>
  <text x="120" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">컨트롤러 Pod</text>
  <text x="120" y="366" text-anchor="middle" font-size="11" fill="#334155">SA annotation</text>
  <text x="120" y="382" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="10" fill="#334155">eks.amazonaws.com/role-arn</text>
  <text x="120" y="404" text-anchor="middle" font-size="11" fill="#475569">+ projected SA 토큰(JWT)</text>

  <rect x="240" y="322" width="190" height="96" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="335" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">클러스터 OIDC 발급자</text>
  <text x="335" y="366" text-anchor="middle" font-size="11" fill="#334155">토큰의 sub =</text>
  <text x="335" y="382" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="10" fill="#334155">system:serviceaccount:</text>
  <text x="335" y="396" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="10" fill="#334155">kube-system:aws-lbc…</text>

  <rect x="460" y="322" width="220" height="96" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
  <text x="570" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">AWS STS</text>
  <text x="570" y="366" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#9a3412">AssumeRoleWithWebIdentity</text>
  <text x="570" y="386" text-anchor="middle" font-size="11" fill="#9a3412">SDK가 Pod마다 직접 호출</text>
  <text x="570" y="404" text-anchor="middle" font-size="11" fill="#9a3412">(해킹 23의 GitHub OIDC와 같은 원리)</text>

  <rect x="710" y="322" width="220" height="96" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="820" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IAM 역할 + OIDC 공급자</text>
  <text x="820" y="366" text-anchor="middle" font-size="11" fill="#334155">신뢰 정책에 클러스터별</text>
  <text x="820" y="382" text-anchor="middle" font-size="11" fill="#334155">OIDC 공급자 ARN + sub 조건</text>
  <text x="820" y="404" text-anchor="middle" font-size="11" fill="#7f1d1d">클러스터 추가 = 정책 수정</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="210" y1="356" x2="238" y2="356" marker-end="url(#arrow)"/>
    <line x1="430" y1="356" x2="458" y2="356" marker-end="url(#arrow)"/>
    <line x1="680" y1="356" x2="708" y2="356" marker-end="url(#arrow)"/>
  </g>
  <path d="M820,418 L820,456 L120,456 L120,420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="474" text-anchor="middle" font-size="12" fill="#334155">임시 자격 증명 → SDK가 사용</text>

  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#475569">어느 쪽이든 노드 IAM 역할에 권한을 몰아주지 않는다 — Pod(SA) 단위 최소 권한</text>
</svg>
