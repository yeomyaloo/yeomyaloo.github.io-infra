  <text x="850" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">라우팅 테이블</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12">
    <rect x="726" y="140" width="256" height="96" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="738" y="160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#14532d">infra-cloud-rt-pub</text>
    <text x="738" y="182" fill="#0f172a">10.20.0.0/16 → local</text>
    <text x="738" y="202" fill="#0f172a">0.0.0.0/0    → igw</text>
    <text x="738" y="224" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#166534">연결: pub-a, pub-c</text>

    <rect x="726" y="250" width="256" height="118" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
