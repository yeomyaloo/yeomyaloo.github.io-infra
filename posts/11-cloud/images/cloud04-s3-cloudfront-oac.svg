<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">비공개 S3 버킷을 CloudFront + OAC로만 서비스하기</text>

  <!-- User -->
  <rect x="20" y="112" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="95" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">사용자</text>
  <text x="95" y="164" text-anchor="middle" font-size="12" fill="#64748b">브라우저 / curl</text>

  <!-- CloudFront -->
  <rect x="230" y="78" width="230" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="345" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">CloudFront 배포</text>
  <text x="345" y="126" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">d1a2...cloudfront.net</text>
  <text x="345" y="150" text-anchor="middle" font-size="12" fill="#334155">엣지 캐시 · HTTPS 강제</text>
  <text x="345" y="170" text-anchor="middle" font-size="12" fill="#334155">CachingOptimized 정책</text>
  <rect x="262" y="180" width="166" height="28" rx="14" fill="#7c3aed"/>
  <text x="345" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OAC: SigV4 서명</text>

  <line x1="172" y1="140" x2="226" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="199" y="130" text-anchor="middle" font-size="12" fill="#334155">HTTPS</text>

  <!-- S3 bucket -->
  <rect x="540" y="56" width="400" height="300" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">S3 버킷 infra-cloud-site-&lt;계정ID&gt;</text>
  <text x="740" y="102" text-anchor="middle" font-size="12" fill="#166534">비공개 유지 · 서울 리전</text>
  <g font-size="12" text-anchor="middle">
    <rect x="558" y="114" width="178" height="30" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="647" y="134" fill="#0f172a">퍼블릭 액세스 차단 4개 ON</text>
    <rect x="744" y="114" width="178" height="30" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="833" y="134" fill="#0f172a">ACL 비활성 (BucketOwner)</text>
    <rect x="558" y="152" width="178" height="30" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="647" y="172" fill="#0f172a">버전 관리 Enabled</text>
    <rect x="744" y="152" width="178" height="30" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="833" y="172" fill="#0f172a">수명 주기 · SSE-S3</text>
  </g>
  <rect x="558" y="194" width="364" height="148" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="572" y="216" font-size="13" font-weight="700" fill="#14532d">버킷 정책</text>
  <text x="572" y="240" font-size="12" fill="#166534" font-weight="700">Allow  s3:GetObject</text>
  <text x="572" y="258" font-size="12" fill="#334155">주체: cloudfront.amazonaws.com</text>
  <text x="572" y="276" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">AWS:SourceArn = ...:distribution/ID</text>
  <text x="572" y="304" font-size="12" fill="#991b1b" font-weight="700">Deny  s3:*  (모든 주체)</text>
  <text x="572" y="322" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">aws:SecureTransport = false</text>

  <line x1="462" y1="160" x2="554" y2="226" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="468" y="244" font-size="12" fill="#15803d">서명된 요청</text>

  <!-- direct access blocked -->
  <path d="M 95 184 C 95 300 360 330 536 316" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)"/>
  <text x="150" y="350" font-size="12" fill="#991b1b">버킷 URL로 직접 접근</text>
  <rect x="330" y="292" width="120" height="30" rx="15" fill="#dc2626"/>
  <text x="390" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">403 거부</text>

  <!-- note -->
  <rect x="20" y="376" width="920" height="66" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="40" y="402" font-size="13" font-weight="700" fill="#78350f">S3 정적 웹 사이트 엔드포인트와의 차이</text>
  <text x="40" y="426" font-size="12" fill="#334155">웹 사이트 엔드포인트는 HTTP만 지원하고 버킷을 공개해야 함 → 이 탭에서는 CloudFront + OAC(오리진 = S3 REST 엔드포인트)만 사용</text>
</svg>
