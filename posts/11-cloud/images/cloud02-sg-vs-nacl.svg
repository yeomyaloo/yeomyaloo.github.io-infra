<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">보안 그룹(stateful) vs NACL(stateless) — 요청과 응답</text>

  <!-- Client -->
  <rect x="20" y="150" width="160" height="110" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="100" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">클라이언트</text>
  <text x="100" y="210" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">203.0.113.10</text>
  <text x="100" y="230" text-anchor="middle" font-size="12" fill="#64748b">출발 포트 51000</text>

  <!-- Subnet + NACL boundary -->
  <rect x="300" y="64" width="640" height="300" rx="14" fill="#f8fafc" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="316" y="90" font-size="15" font-weight="700" fill="#92400e">서브넷 경계 = NACL (번호 순 평가, 허용/거부)</text>

  <!-- SG around ENI -->
  <rect x="620" y="120" width="290" height="220" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="636" y="146" font-size="15" font-weight="700" fill="#312e81">ENI = 보안 그룹 (허용만)</text>
  <rect x="690" y="180" width="180" height="110" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="780" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">EC2</text>
  <text x="780" y="246" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#334155">10.20.10.37:8080</text>

  <!-- Request lane -->
  <line x1="182" y1="180" x2="686" y2="180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="318" y="170" font-size="13" font-weight="700" fill="#1d4ed8">요청 → 목적지 :8080</text>
  <rect x="320" y="192" width="150" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="395" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">NACL 인바운드</text>
  <text x="395" y="228" text-anchor="middle" font-size="12" fill="#78350f">규칙 필요 (8080)</text>
  <rect x="490" y="192" width="120" height="46" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="550" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">SG 인바운드</text>
  <text x="550" y="228" text-anchor="middle" font-size="12" fill="#312e81">규칙 필요 (8080)</text>

  <!-- Response lane -->
  <line x1="686" y1="276" x2="182" y2="276" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="318" y="298" font-size="13" font-weight="700" fill="#15803d">응답 ← 목적지 :51000 (임시 포트)</text>
  <rect x="490" y="306" width="120" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="550" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">SG 아웃바운드</text>
  <text x="550" y="342" text-anchor="middle" font-size="12" fill="#14532d">자동 허용 (추적)</text>
  <rect x="320" y="306" width="150" height="46" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="395" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">NACL 아웃바운드</text>
  <text x="395" y="342" text-anchor="middle" font-size="12" fill="#991b1b">1024-65535 규칙 필요</text>

  <!-- Bottom summary -->
  <rect x="20" y="384" width="450" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="245" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">SG: 연결을 기억 → 응답은 자동 통과</text>
  <text x="245" y="430" text-anchor="middle" font-size="12" fill="#334155">소스로 다른 SG 참조 가능 (alb-sg → app-sg → db-sg)</text>
  <rect x="490" y="384" width="450" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="715" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">NACL: 패킷마다 따로 판단 → 양방향 규칙</text>
  <text x="715" y="430" text-anchor="middle" font-size="12" fill="#334155">마지막 규칙 * (32767): 어디에도 안 맞으면 거부</text>
</svg>
