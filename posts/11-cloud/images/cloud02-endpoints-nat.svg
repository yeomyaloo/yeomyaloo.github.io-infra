  <rect x="640" y="330" width="300" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="790" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">SSM · ECR · STS · Secrets 등</text>
  <text x="790" y="378" text-anchor="middle" font-size="12" fill="#334155">$0.013/시간/AZ + $0.01/GB</text>
  <text x="790" y="398" text-anchor="middle" font-size="12" fill="#334155">SSM 3종 × 2AZ ≈ $0.078/시간</text>

  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#64748b">가격: 서울 리전, 2026-11-19 확인, 변동 가능</text>
