  <text x="375" y="258" text-anchor="middle" font-size="12" fill="#64748b">라우팅 테이블의 pl-(S3)</text>
  <line x1="212" y1="245" x2="286" y2="245" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="462" y1="245" x2="636" y2="245" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>

