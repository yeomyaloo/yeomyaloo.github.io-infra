  <text x="375" y="144" text-anchor="middle" font-size="12" fill="#64748b">pub-a + EIP</text>
  <rect x="480" y="108" width="80" height="40" rx="8" fill="#ff9900"/>
  <text x="520" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">IGW</text>
  <path d="M 150 188 C 160 140 220 128 286 128" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <line x1="462" y1="128" x2="476" y2="128" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <line x1="562" y1="128" x2="636" y2="128" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowO)"/>

