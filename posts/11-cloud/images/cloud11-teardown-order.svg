<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">클라우드 탭 완전 삭제 순서</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#64748b">원칙: 만든 컨트롤러가 살아 있을 때, 그 컨트롤러가 만든 것을 먼저 지운다</text>

  <!-- group bands -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="20" y="76" width="110" height="194" rx="10" fill="#e8eefc" stroke="#326ce5"/>
    <text x="75" y="170" fill="#1e3a8a">Kubernetes</text>
    <text x="75" y="190" font-size="12" font-weight="400" fill="#1e3a8a">kubectl</text>
    <rect x="20" y="278" width="110" height="44" rx="10" fill="#ede9fe" stroke="#4f46e5"/>
    <text x="75" y="305" fill="#312e81">Helm</text>
    <rect x="20" y="330" width="110" height="44" rx="10" fill="#fff4e5" stroke="#ff9900"/>
    <text x="75" y="357" fill="#9a3412">AWS CLI</text>
    <rect x="20" y="382" width="110" height="96" rx="10" fill="#ede9fe" stroke="#4f46e5"/>
    <text x="75" y="434" fill="#312e81">Terraform</text>
    <rect x="20" y="486" width="110" height="96" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="75" y="530" fill="#14532d">확인</text>
    <text x="75" y="550" font-size="12" font-weight="400" fill="#14532d">0원 체크</text>
  </g>

  <!-- flow arrow -->
  <line x1="146" y1="80" x2="146" y2="578" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- steps -->
  <g font-size="14" fill="#0f172a">
    <rect x="160" y="76" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="98" r="13" fill="#326ce5"/><text x="184" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="206" y="103" font-weight="700">Argo CD Application 삭제</text>

    <rect x="160" y="126" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="148" r="13" fill="#326ce5"/><text x="184" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="206" y="153" font-weight="700">Ingress · LoadBalancer Service 삭제</text>

    <rect x="160" y="176" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="198" r="13" fill="#326ce5"/><text x="184" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="206" y="203" font-weight="700">StatefulSet · PVC 삭제</text>

    <rect x="160" y="226" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="248" r="13" fill="#326ce5"/><text x="184" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="206" y="253" font-weight="700">Karpenter NodePool 삭제</text>

    <rect x="160" y="278" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="300" r="13" fill="#4f46e5"/><text x="184" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="206" y="305" font-weight="700">helm uninstall (앱 → 관측 → 컨트롤러)</text>

    <rect x="160" y="330" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="352" r="13" fill="#ff9900"/><text x="184" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
    <text x="206" y="357" font-weight="700">GuardDuty Runtime Monitoring 끄기</text>

    <rect x="160" y="382" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="404" r="13" fill="#4f46e5"/><text x="184" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text>
    <text x="206" y="409" font-weight="700">terraform destroy: eks → network</text>

    <rect x="160" y="434" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="456" r="13" fill="#4f46e5"/><text x="184" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8</text>
    <text x="206" y="461" font-weight="700">상태 버킷(모든 버전) · 잠금 테이블 삭제</text>

    <rect x="160" y="486" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="508" r="13" fill="#16a34a"/><text x="184" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">9</text>
    <text x="206" y="513" font-weight="700">잔여 확인: ENI·EBS·스냅샷·로그·ECR·KMS</text>

    <rect x="160" y="538" width="420" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="184" cy="560" r="13" fill="#16a34a"/><text x="184" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">10</text>
    <text x="206" y="565" font-weight="700">다른 리전 확인 → 이틀 뒤 Cost Explorer</text>
  </g>

  <!-- why notes -->
  <g font-size="13" fill="#475569">
    <text x="596" y="103">selfHeal이 지운 것을 다시 만들지 않게</text>
    <text x="596" y="153">LB 컨트롤러가 ALB·NLB·타깃 그룹 삭제</text>
    <text x="596" y="203">EBS CSI가 볼륨 삭제 (reclaim Delete)</text>
    <text x="596" y="253">Karpenter가 띄운 EC2 노드 종료</text>
    <text x="596" y="305">LB 컨트롤러·ExternalDNS는 맨 마지막</text>
    <text x="596" y="357">GuardDutyManaged VPC 엔드포인트 제거</text>
    <text x="596" y="409">DependencyViolation이면 남은 ENI 확인</text>
    <text x="596" y="461">버전 관리 버킷은 삭제 마커까지</text>
    <text x="596" y="513">태깅 API + 서비스별 명령 교차 확인</text>
    <text x="596" y="565">청구는 하루~이틀 늦게 반영</text>
  </g>
</svg>
