<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Neutron 네트워크 모델 — Provider vs Self-service</text>

  <!-- Internet -->
  <rect x="330" y="56" width="300" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">인터넷 / 데이터센터 물리망</text>
  <line x1="480" y1="96" x2="480" y2="140" stroke="#334155" stroke-width="2"/>

  <!-- public provider network -->
  <rect x="40" y="140" width="880" height="44" rx="8" fill="#fff1f2" stroke="#ed1944" stroke-width="2"/>
  <text x="60" y="168" font-size="15" font-weight="700" fill="#9f1239">public — Provider 네트워크 (flat, physnet: public)</text>
  <text x="900" y="168" text-anchor="end" font-size="14" fill="#9f1239" font-family="Consolas,'D2Coding',monospace">172.24.4.0/24</text>

  <!-- Provider VM (left) -->
  <line x1="160" y1="184" x2="160" y2="250" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="250" width="200" height="66" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="160" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">vm-p</text>
  <text x="160" y="301" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">172.24.4.20</text>
  <text x="160" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Provider 모델</text>
  <text x="160" y="366" text-anchor="middle" font-size="13" fill="#64748b">물리망 IP를 VM이 직접 사용</text>
  <text x="160" y="386" text-anchor="middle" font-size="13" fill="#64748b">관리자만 생성 · NAT 없음</text>

  <!-- Router -->
  <line x1="520" y1="184" x2="520" y2="225" stroke="#334155" stroke-width="2"/>
  <text x="530" y="210" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">gw 172.24.4.120</text>
  <rect x="420" y="225" width="200" height="70" rx="10" fill="#ed1944"/>
  <text x="520" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Router r1</text>
  <text x="520" y="278" text-anchor="middle" font-size="13" fill="#ffffff">SNAT · Floating IP(DNAT)</text>

  <!-- FIP annotation -->
  <rect x="650" y="222" width="250" height="76" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="775" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Floating IP (1:1 NAT)</text>
  <text x="775" y="268" text-anchor="middle" font-size="13" fill="#78350f" font-family="Consolas,'D2Coding',monospace">172.24.4.150</text>
  <text x="775" y="287" text-anchor="middle" font-size="13" fill="#78350f" font-family="Consolas,'D2Coding',monospace">⇄ 192.168.10.5 (vm1)</text>
  <line x1="650" y1="260" x2="624" y2="260" stroke="#be123c" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- net1 self-service -->
  <line x1="520" y1="295" x2="520" y2="340" stroke="#334155" stroke-width="2"/>
  <text x="530" y="324" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">if 192.168.10.1</text>
  <rect x="330" y="340" width="590" height="40" rx="8" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="350" y="365" font-size="14" font-weight="700" fill="#312e81">net1 — Self-service 네트워크 (geneve)</text>
  <text x="900" y="365" text-anchor="end" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">192.168.10.0/24</text>

  <!-- Security group box -->
  <rect x="360" y="400" width="530" height="124" rx="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="625" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Security Group: web-sg (icmp, 22/tcp, 80/tcp 허용)</text>

  <line x1="490" y1="380" x2="490" y2="418" stroke="#334155" stroke-width="2"/>
  <rect x="390" y="418" width="200" height="66" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="490" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">vm1</text>
  <text x="490" y="469" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">192.168.10.5</text>

  <line x1="760" y1="380" x2="760" y2="418" stroke="#334155" stroke-width="2"/>
  <rect x="660" y="418" width="200" height="66" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="760" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">vm2</text>
  <text x="760" y="469" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">192.168.10.6</text>

  <!-- Self-service caption -->
  <text x="40" y="440" font-size="14" font-weight="700" fill="#334155">Self-service 모델</text>
  <text x="40" y="462" font-size="13" fill="#64748b">사용자가 직접 만든 사설망</text>
  <text x="40" y="482" font-size="13" fill="#64748b">나가는 트래픽: 라우터 SNAT</text>
  <text x="40" y="502" font-size="13" fill="#64748b">들어오는 접속: Floating IP</text>
  <text x="40" y="522" font-size="13" fill="#64748b">대역이 겹쳐도 프로젝트 간 격리</text>
</svg>
