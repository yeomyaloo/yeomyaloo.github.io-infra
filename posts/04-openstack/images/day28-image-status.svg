<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Glance 이미지 상태 변화</text>

  <g font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="30" y="175" width="130" height="50" rx="25" fill="#e2e8f0" stroke="#64748b"/>
    <text x="95" y="205" fill="#0f172a">queued</text>

    <rect x="230" y="95" width="140" height="50" rx="25" fill="#fde68a" stroke="#f59e0b"/>
    <text x="300" y="125" fill="#78350f">saving</text>

    <rect x="430" y="95" width="130" height="50" rx="25" fill="#fca5a5" stroke="#dc2626"/>
    <text x="495" y="125" fill="#7f1d1d">killed</text>

    <rect x="230" y="265" width="140" height="50" rx="25" fill="#fde68a" stroke="#f59e0b"/>
    <text x="300" y="295" fill="#78350f">uploading</text>

    <rect x="430" y="265" width="140" height="50" rx="25" fill="#fde68a" stroke="#f59e0b"/>
    <text x="500" y="295" fill="#78350f">importing</text>

    <rect x="640" y="175" width="140" height="50" rx="25" fill="#16a34a"/>
    <text x="710" y="205" fill="#ffffff">active</text>

    <rect x="640" y="60" width="140" height="50" rx="25" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="710" y="90" fill="#1e1b4b">deactivated</text>

    <rect x="820" y="175" width="120" height="50" rx="25" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="880" y="205" fill="#64748b">deleted</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="160" y1="190" x2="228" y2="132" marker-end="url(#arrow)"/>
    <line x1="160" y1="210" x2="228" y2="276" marker-end="url(#arrow)"/>
    <line x1="370" y1="120" x2="427" y2="120" marker-end="url(#arrow)" stroke="#dc2626"/>
    <line x1="350" y1="145" x2="642" y2="188" marker-end="url(#arrow)"/>
    <line x1="370" y1="290" x2="427" y2="290" marker-end="url(#arrow)"/>
    <line x1="560" y1="275" x2="645" y2="218" marker-end="url(#arrow)"/>
    <line x1="690" y1="175" x2="690" y2="113" marker-end="url(#arrow)"/>
    <line x1="730" y1="110" x2="730" y2="172" marker-end="url(#arrow)"/>
    <line x1="780" y1="200" x2="817" y2="200" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#334155">
    <text x="96" y="140" font-weight="700">--file 업로드</text>
    <text x="56" y="262" font-weight="700">Image Import</text>
    <text x="398" y="112" text-anchor="middle" fill="#dc2626" font-weight="700">오류</text>
    <text x="490" y="198" text-anchor="middle" font-weight="700">업로드 완료</text>
    <text x="398" y="282" text-anchor="middle">스테이징</text>
    <text x="682" y="150" text-anchor="end" font-family="Consolas,'D2Coding',monospace">--deactivate</text>
    <text x="738" y="150" font-family="Consolas,'D2Coding',monospace">--activate</text>
    <text x="800" y="190" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">delete</text>
  </g>

  <rect x="30" y="340" width="900" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="367" text-anchor="middle" font-size="13" fill="#334155"><tspan font-weight="700">일반 등록</tspan>: image create --file → saving → active   ·   <tspan font-weight="700">Image Import</tspan>: 스테이징 업로드 후 서버가 가져오기(web-download 등)</text>
</svg>
