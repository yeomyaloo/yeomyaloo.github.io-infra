<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OpenStack 핵심 서비스 구조</text>

  <!-- Clients -->
  <g font-size="14" text-anchor="middle">
    <rect x="160" y="54" width="200" height="40" rx="20" fill="#e2e8f0"/>
    <text x="260" y="79" fill="#0f172a">Horizon (웹 대시보드)</text>
    <rect x="380" y="54" width="200" height="40" rx="20" fill="#e2e8f0"/>
    <text x="480" y="79" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">openstack CLI</text>
    <rect x="600" y="54" width="200" height="40" rx="20" fill="#e2e8f0"/>
    <text x="700" y="79" fill="#0f172a">SDK · Terraform</text>
  </g>

  <!-- API band -->
  <rect x="20" y="118" width="918" height="34" rx="8" fill="#ed1944"/>
  <text x="479" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">REST API (HTTP + JSON) · 모든 요청에 X-Auth-Token 헤더</text>

  <!-- Keystone -->
  <rect x="20" y="172" width="170" height="198" rx="10" fill="#fff1f2" stroke="#ed1944" stroke-width="2"/>
  <text x="105" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">Keystone</text>
  <g font-size="13" text-anchor="middle" fill="#334155">
    <text x="105" y="234">인증 · 권한</text>
    <text x="105" y="256">토큰 발급 / 검증</text>
    <text x="105" y="278">서비스 카탈로그</text>
    <text x="105" y="300">프로젝트 · 역할</text>
  </g>
  <text x="105" y="344" text-anchor="middle" font-size="12" fill="#64748b">≈ AWS IAM</text>

  <!-- Row 1 -->
  <g text-anchor="middle">
    <rect x="210" y="172" width="170" height="90" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="295" y="200" font-size="17" font-weight="700" fill="#1e1b4b">Nova</text>
    <text x="295" y="224" font-size="13" fill="#334155">컴퓨트 (VM)</text>
    <text x="295" y="246" font-size="12" fill="#64748b">≈ EC2</text>

    <rect x="396" y="172" width="170" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="481" y="200" font-size="17" font-weight="700" fill="#14532d">Neutron</text>
    <text x="481" y="224" font-size="13" fill="#334155">가상 네트워크</text>
    <text x="481" y="246" font-size="12" fill="#64748b">≈ VPC</text>

    <rect x="582" y="172" width="170" height="90" rx="10" fill="#fde68a" stroke="#f59e0b"/>
    <text x="667" y="200" font-size="17" font-weight="700" fill="#78350f">Glance</text>
    <text x="667" y="224" font-size="13" fill="#334155">VM 이미지</text>
    <text x="667" y="246" font-size="12" fill="#64748b">≈ AMI</text>

    <rect x="768" y="172" width="170" height="90" rx="10" fill="#fed7aa" stroke="#ea580c"/>
    <text x="853" y="200" font-size="17" font-weight="700" fill="#7c2d12">Cinder</text>
    <text x="853" y="224" font-size="13" fill="#334155">블록 스토리지</text>
    <text x="853" y="246" font-size="12" fill="#64748b">≈ EBS</text>
  </g>

  <!-- Row 2 -->
  <g text-anchor="middle">
    <rect x="210" y="280" width="170" height="90" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-dasharray="5 3"/>
    <text x="295" y="308" font-size="17" font-weight="700" fill="#1e1b4b">Placement</text>
    <text x="295" y="332" font-size="13" fill="#334155">자원 인벤토리</text>
    <text x="295" y="354" font-size="12" fill="#64748b">Nova 스케줄링에 사용</text>

    <rect x="396" y="280" width="170" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="481" y="308" font-size="17" font-weight="700" fill="#78350f">Swift</text>
    <text x="481" y="332" font-size="13" fill="#334155">오브젝트 스토리지</text>
    <text x="481" y="354" font-size="12" fill="#64748b">≈ S3</text>

    <rect x="582" y="280" width="170" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="667" y="308" font-size="17" font-weight="700" fill="#0f172a">Heat</text>
    <text x="667" y="332" font-size="13" fill="#334155">오케스트레이션</text>
    <text x="667" y="354" font-size="12" fill="#64748b">≈ CloudFormation</text>

    <rect x="768" y="280" width="170" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="853" y="308" font-size="15" font-weight="700" fill="#334155">그 밖의 프로젝트</text>
    <text x="853" y="332" font-size="12" fill="#64748b">Octavia · Magnum</text>
    <text x="853" y="354" font-size="12" fill="#64748b">Ironic · Barbican …</text>
  </g>

  <!-- Shared infra -->
  <rect x="20" y="390" width="918" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="479" y="415" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="700">공통 인프라</tspan>  MariaDB (DB) · RabbitMQ (메시지 큐) · Memcached (캐시)</text>

  <!-- Physical layer -->
  <g text-anchor="middle">
    <rect x="20" y="450" width="296" height="70" rx="10" fill="#f8fafc" stroke="#4f46e5"/>
    <text x="168" y="478" font-size="15" font-weight="700" fill="#1e1b4b">하이퍼바이저</text>
    <text x="168" y="502" font-size="12" fill="#334155">KVM / QEMU · libvirt (Day 21)</text>

    <rect x="331" y="450" width="296" height="70" rx="10" fill="#f8fafc" stroke="#16a34a"/>
    <text x="479" y="478" font-size="15" font-weight="700" fill="#14532d">가상 네트워크</text>
    <text x="479" y="502" font-size="12" fill="#334155">bridge · VXLAN · OVS / OVN (Day 22~24)</text>

    <rect x="642" y="450" width="296" height="70" rx="10" fill="#f8fafc" stroke="#ea580c"/>
    <text x="790" y="478" font-size="15" font-weight="700" fill="#7c2d12">스토리지 백엔드</text>
    <text x="790" y="502" font-size="12" fill="#334155">LVM · Ceph · 로컬 파일 시스템</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="260" y1="94" x2="260" y2="115" marker-end="url(#arrow)"/>
    <line x1="480" y1="94" x2="480" y2="115" marker-end="url(#arrow)"/>
    <line x1="700" y1="94" x2="700" y2="115" marker-end="url(#arrow)"/>
    <line x1="60" y1="152" x2="60" y2="169" marker-end="url(#arrow)"/>
    <line x1="295" y1="152" x2="295" y2="169" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#334155" font-weight="700">
    <text x="68" y="166">① 토큰 발급</text>
    <text x="303" y="166">② 토큰을 들고 API 호출</text>
  </g>
</svg>
