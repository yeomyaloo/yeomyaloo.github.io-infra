<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DevStack 올인원 — VM 한 대에 OpenStack 전부</text>

  <!-- Host PC -->
  <rect x="20" y="52" width="920" height="452" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="78" font-size="15" font-weight="700" fill="#334155">내 PC (Windows / macOS / Linux)</text>

  <rect x="36" y="104" width="170" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="121" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">웹 브라우저</text>
  <text x="121" y="152" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">:80/dashboard</text>

  <rect x="36" y="190" width="170" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="121" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">터미널 (SSH)</text>
  <text x="121" y="238" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">openstack CLI</text>

  <!-- Hypervisor band -->
  <rect x="230" y="88" width="694" height="30" rx="6" fill="#e2e8f0"/>
  <text x="577" y="108" text-anchor="middle" font-size="13" fill="#334155">하이퍼바이저: VirtualBox / VMware / Hyper-V  (중첩 가상화 ON)</text>

  <!-- Ubuntu VM -->
  <rect x="230" y="128" width="694" height="362" rx="10" fill="#fff1f2" stroke="#ed1944" stroke-width="2"/>
  <text x="248" y="152" font-size="15" font-weight="700" fill="#9f1239">Ubuntu 24.04 VM “devstack” — 192.168.56.10</text>
  <text x="248" y="172" font-size="12" fill="#64748b">4 vCPU · 8~16 GB RAM · 60 GB+ 디스크 · 사용자 stack (/opt/stack)</text>

  <text x="250" y="198" font-size="13" font-weight="700" fill="#334155">컨트롤 플레인 — systemd 유닛 devstack@*</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="250" y="208" width="100" height="38" rx="6" fill="#ed1944"/><text x="300" y="232" fill="#ffffff">keystone</text>
    <rect x="360" y="208" width="100" height="38" rx="6" fill="#fde68a"/><text x="410" y="232" fill="#78350f">g-api</text>
    <rect x="470" y="208" width="100" height="38" rx="6" fill="#c7d2fe"/><text x="520" y="232" fill="#1e1b4b">n-api</text>
    <rect x="580" y="208" width="100" height="38" rx="6" fill="#c7d2fe"/><text x="630" y="232" fill="#1e1b4b">n-sch</text>
    <rect x="690" y="208" width="100" height="38" rx="6" fill="#c7d2fe"/><text x="740" y="232" fill="#1e1b4b">n-*-cond</text>
    <rect x="800" y="208" width="104" height="38" rx="6" fill="#e0e7ff"/><text x="852" y="232" fill="#1e1b4b">placement</text>

    <rect x="250" y="254" width="210" height="38" rx="6" fill="#bbf7d0"/><text x="355" y="278" fill="#14532d">neutron (OVN)</text>
    <rect x="470" y="254" width="210" height="38" rx="6" fill="#fed7aa"/><text x="575" y="278" fill="#7c2d12">c-api · c-sch · c-vol</text>
    <rect x="690" y="254" width="214" height="38" rx="6" fill="#e2e8f0"/><text x="797" y="278" fill="#0f172a">horizon (apache2)</text>
  </g>

  <rect x="250" y="302" width="654" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="577" y="324" text-anchor="middle" font-size="13" fill="#78350f"><tspan font-weight="700">공통 인프라</tspan>  MariaDB · RabbitMQ · Memcached</text>

  <text x="250" y="362" font-size="13" font-weight="700" fill="#334155">데이터 플레인 — 이 VM 자신이 컴퓨트 노드</text>
  <rect x="250" y="372" width="210" height="100" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="355" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b" font-family="Consolas,'D2Coding',monospace">n-cpu</text>
  <text x="355" y="424" text-anchor="middle" font-size="12" fill="#334155">nova-compute</text>
  <text x="355" y="446" text-anchor="middle" font-size="12" fill="#334155">libvirt → QEMU / KVM</text>

  <rect x="480" y="372" width="170" height="100" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="565" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">인스턴스 (VM 안의 VM)</text>
  <rect x="490" y="406" width="72" height="52" rx="6" fill="#86efac"/>
  <text x="526" y="437" text-anchor="middle" font-size="12" fill="#14532d">cirros</text>
  <rect x="568" y="406" width="72" height="52" rx="6" fill="#86efac"/>
  <text x="604" y="437" text-anchor="middle" font-size="12" fill="#14532d">cirros</text>

  <rect x="680" y="372" width="224" height="100" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="792" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">OVS / OVN</text>
  <text x="792" y="422" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">br-int · br-ex</text>
  <text x="792" y="446" text-anchor="middle" font-size="12" fill="#334155">Floating IP 172.24.4.0/24</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="206" y1="136" x2="244" y2="136" marker-end="url(#arrow)"/>
    <line x1="206" y1="222" x2="246" y2="222" marker-end="url(#arrow)"/>
    <line x1="460" y1="422" x2="477" y2="422" marker-end="url(#arrow)"/>
    <line x1="652" y1="432" x2="677" y2="432" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#334155" font-weight="700">
    <text x="120" y="184" text-anchor="middle">HTTP</text>
    <text x="120" y="272" text-anchor="middle">SSH → source openrc</text>
  </g>
</svg>
