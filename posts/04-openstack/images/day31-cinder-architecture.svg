<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cinder 아키텍처 — LVM + iSCSI 백엔드</text>

  <!-- CLI -->
  <rect x="30" y="85" width="210" height="44" rx="22" fill="#e2e8f0"/>
  <text x="135" y="112" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">openstack volume create</text>

  <!-- Controller -->
  <rect x="280" y="55" width="330" height="237" rx="12" fill="#fff1f2" stroke="#ed1944" stroke-width="2"/>
  <text x="296" y="75" font-size="13" font-weight="700" fill="#9f1239">Controller</text>
  <rect x="300" y="85" width="290" height="44" rx="8" fill="#ed1944"/>
  <text x="445" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">cinder-api</text>
  <rect x="300" y="160" width="290" height="44" rx="8" fill="#fecdd3"/>
  <text x="445" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">cinder-scheduler</text>
  <rect x="300" y="235" width="290" height="44" rx="8" fill="#fecdd3"/>
  <text x="445" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">cinder-volume (LVM 드라이버)</text>

  <!-- Storage -->
  <rect x="280" y="330" width="330" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="445" y="354" text-anchor="middle" font-size="12" fill="#312e81" font-family="Consolas,'D2Coding',monospace">LVM VG  stack-volumes-lvmdriver-1</text>
  <rect x="295" y="366" width="145" height="32" rx="6" fill="#c7d2fe"/>
  <text x="367" y="387" text-anchor="middle" font-size="12" fill="#312e81" font-family="Consolas,'D2Coding',monospace">volume-7b2c…</text>
  <rect x="450" y="366" width="145" height="32" rx="6" fill="#c7d2fe"/>
  <text x="522" y="387" text-anchor="middle" font-size="12" fill="#312e81" font-family="Consolas,'D2Coding',monospace">volume-91af…</text>
  <text x="445" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">iSCSI 타겟 (LIO) · TCP 3260</text>

  <!-- Compute -->
  <rect x="660" y="55" width="280" height="395" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="676" y="75" font-size="13" font-weight="700" fill="#1e3a8a">Compute 노드</text>
  <rect x="680" y="85" width="240" height="44" rx="8" fill="#2496ed"/>
  <text x="800" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">nova-compute</text>
  <rect x="680" y="160" width="240" height="44" rx="8" fill="#93c5fd"/>
  <text x="800" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">os-brick (iSCSI initiator)</text>
  <rect x="680" y="230" width="240" height="40" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="800" y="255" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">/dev/sdX (호스트 장치)</text>
  <rect x="680" y="292" width="240" height="40" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="800" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">libvirt / QEMU</text>
  <rect x="700" y="362" width="200" height="70" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="800" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">VM</text>
  <text x="800" y="414" text-anchor="middle" font-size="13" fill="#14532d" font-family="Consolas,'D2Coding',monospace">/dev/vdb</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="240" y1="107" x2="297" y2="107" marker-end="url(#arrow)"/>
    <line x1="445" y1="129" x2="445" y2="157" marker-end="url(#arrow)"/>
    <line x1="445" y1="204" x2="445" y2="232" marker-end="url(#arrow)"/>
    <line x1="445" y1="279" x2="445" y2="327" marker-end="url(#arrow)"/>
    <line x1="680" y1="100" x2="593" y2="100" marker-end="url(#arrow)"/>
    <line x1="800" y1="204" x2="800" y2="227" marker-end="url(#arrow)"/>
    <line x1="800" y1="270" x2="800" y2="289" marker-end="url(#arrow)"/>
    <line x1="800" y1="332" x2="800" y2="359" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#334155">
    <text x="455" y="148">RPC</text>
    <text x="455" y="223">RPC</text>
  </g>
  <!-- data path -->
  <line x1="680" y1="192" x2="612" y2="410" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 4"/>

  <!-- Badges -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="268" cy="90" r="11" fill="#0f172a"/><text x="268" y="94" fill="#ffffff">1</text>
    <circle cx="470" cy="305" r="11" fill="#0f172a"/><text x="470" y="309" fill="#ffffff">2</text>
    <circle cx="636" cy="86" r="11" fill="#0f172a"/><text x="636" y="90" fill="#ffffff">3</text>
    <circle cx="666" cy="300" r="11" fill="#16a34a"/><text x="666" y="304" fill="#ffffff">4</text>
    <circle cx="824" cy="346" r="11" fill="#0f172a"/><text x="824" y="350" fill="#ffffff">5</text>
  </g>

  <!-- Legend -->
  <line x1="20" y1="466" x2="940" y2="466" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="13" fill="#334155">
    <text x="40" y="492">1  볼륨 생성: api → scheduler(백엔드 선택) → volume</text>
    <text x="40" y="516">2  cinder-volume이 LVM에 LV 생성 (volume-&lt;ID&gt;)</text>
    <text x="40" y="540">3  Nova가 Cinder에 연결 정보 요청 → LV를 iSCSI로 노출</text>
    <text x="500" y="492">4  os-brick이 iSCSI 로그인 → 호스트에 /dev/sdX</text>
    <text x="500" y="516">5  libvirt가 VM에 virtio 디스크로 연결 → /dev/vdb</text>
  </g>
  <line x1="500" y1="535" x2="540" y2="535" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 4"/>
  <text x="550" y="540" font-size="13" font-weight="700" fill="#15803d">실제 I/O 경로 — Cinder 서비스를 거치지 않음</text>
</svg>
