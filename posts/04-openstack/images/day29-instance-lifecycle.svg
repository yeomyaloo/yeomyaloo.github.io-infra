<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Nova 인스턴스 수명주기 (server status)</text>

  <g font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="200" width="140" height="50" rx="25" fill="#fde68a" stroke="#f59e0b"/>
    <text x="110" y="230" fill="#78350f">BUILD</text>

    <rect x="40" y="340" width="140" height="50" rx="25" fill="#fca5a5" stroke="#dc2626"/>
    <text x="110" y="370" fill="#7f1d1d">ERROR</text>

    <rect x="410" y="200" width="160" height="50" rx="25" fill="#16a34a"/>
    <text x="490" y="230" fill="#ffffff" font-size="16">ACTIVE</text>

    <rect x="230" y="70" width="150" height="50" rx="25" fill="#e2e8f0" stroke="#64748b"/>
    <text x="305" y="100" fill="#0f172a">SHUTOFF</text>

    <rect x="415" y="70" width="150" height="50" rx="25" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="490" y="100" fill="#1e1b4b">PAUSED</text>

    <rect x="600" y="70" width="150" height="50" rx="25" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="675" y="100" fill="#1e1b4b">SUSPENDED</text>

    <rect x="700" y="200" width="220" height="50" rx="25" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="810" y="230" fill="#1e1b4b">SHELVED_OFFLOADED</text>

    <rect x="290" y="340" width="140" height="50" rx="25" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="360" y="370" fill="#78350f">RESIZE</text>

    <rect x="490" y="340" width="170" height="50" rx="25" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="575" y="370" fill="#78350f">VERIFY_RESIZE</text>

    <rect x="760" y="340" width="150" height="50" rx="25" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="835" y="370" fill="#64748b">DELETED</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="180" y1="225" x2="407" y2="225" marker-end="url(#arrow)"/>
    <line x1="110" y1="250" x2="110" y2="337" marker-end="url(#arrow)" stroke="#dc2626"/>
    <line x1="440" y1="200" x2="340" y2="123" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="490" y1="200" x2="490" y2="123" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="540" y1="200" x2="640" y2="123" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="570" y1="225" x2="697" y2="225" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="450" y1="250" x2="390" y2="337" marker-end="url(#arrow)"/>
    <line x1="430" y1="365" x2="487" y2="365" marker-end="url(#arrow)"/>
    <line x1="560" y1="340" x2="525" y2="253" marker-end="url(#arrow)"/>
    <line x1="660" y1="365" x2="757" y2="365" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  </g>

  <g font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">
    <text x="294" y="218" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">생성 완료</text>
    <text x="118" y="300" fill="#dc2626" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">No valid host 등</text>
    <text x="382" y="168" text-anchor="end">stop / start</text>
    <text x="482" y="142" text-anchor="end">pause / unpause</text>
    <text x="620" y="182">suspend / resume</text>
    <text x="634" y="215" text-anchor="middle">shelve /</text>
    <text x="634" y="245" text-anchor="middle">unshelve</text>
    <text x="402" y="300" text-anchor="end">resize</text>
    <text x="552" y="300">resize confirm</text>
    <text x="708" y="356" text-anchor="middle">delete</text>
  </g>

  <rect x="40" y="410" width="880" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="433" text-anchor="middle" font-size="12" fill="#334155">reboot 중에는 REBOOT / HARD_REBOOT 를 거쳐 ACTIVE 로 · delete 는 어느 상태에서나 가능 · shelve 는 CPU/RAM 할당을 반납</text>
</svg>
