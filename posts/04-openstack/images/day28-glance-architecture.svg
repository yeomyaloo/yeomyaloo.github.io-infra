<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Glance 아키텍처와 이미지가 VM 디스크가 되기까지</text>

  <!-- Clients -->
  <g text-anchor="middle" font-size="14" font-weight="700">
    <rect x="20" y="80" width="180" height="50" rx="25" fill="#e2e8f0"/>
    <text x="110" y="110" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">openstack CLI</text>
    <rect x="20" y="150" width="180" height="50" rx="25" fill="#e2e8f0"/>
    <text x="110" y="180" fill="#0f172a">Horizon</text>
  </g>

  <!-- glance-api + DB -->
  <rect x="260" y="80" width="200" height="60" rx="10" fill="#f59e0b"/>
  <text x="360" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">glance-api</text>

  <rect x="260" y="190" width="200" height="74" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="360" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">MariaDB (메타데이터)</text>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#334155">이름 · 포맷 · 크기 · 해시</text>
  <text x="360" y="254" text-anchor="middle" font-size="12" fill="#334155">visibility · 속성 · 소유자</text>

  <!-- Stores -->
  <rect x="520" y="56" width="420" height="220" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="730" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">저장소 백엔드 (glance_store)</text>
  <g text-anchor="middle">
    <rect x="535" y="98" width="190" height="78" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="630" y="122" font-size="14" font-weight="700" fill="#14532d">file (DevStack 기본)</text>
    <text x="630" y="144" font-size="11" fill="#14532d" font-family="Consolas,'D2Coding',monospace">/opt/stack/data/</text>
    <text x="630" y="162" font-size="11" fill="#14532d" font-family="Consolas,'D2Coding',monospace">glance/images/</text>

    <rect x="735" y="98" width="190" height="78" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="830" y="128" font-size="14" font-weight="700" fill="#78350f">Swift</text>
    <text x="830" y="152" font-size="12" fill="#334155">오브젝트 스토리지 (Day 31)</text>

    <rect x="535" y="186" width="190" height="78" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="630" y="216" font-size="14" font-weight="700" fill="#78350f">Ceph RBD</text>
    <text x="630" y="240" font-size="12" fill="#334155">운영 표준 · raw CoW 클론</text>

    <rect x="735" y="186" width="190" height="78" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="830" y="216" font-size="14" font-weight="700" fill="#78350f">Cinder</text>
    <text x="830" y="240" font-size="12" fill="#334155">볼륨에 이미지 저장</text>
  </g>

  <!-- Compute node -->
  <rect x="20" y="310" width="920" height="152" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="40" y="336" font-size="15" font-weight="700" fill="#1e1b4b">컴퓨트 노드</text>

  <rect x="40" y="356" width="180" height="76" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="130" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b" font-family="Consolas,'D2Coding',monospace">nova-compute</text>
  <text x="130" y="412" text-anchor="middle" font-size="12" fill="#334155">이미지 요청</text>

  <rect x="290" y="356" width="240" height="76" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="410" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f" font-family="Consolas,'D2Coding',monospace">instances/_base/</text>
  <text x="410" y="406" text-anchor="middle" font-size="12" fill="#78350f">이미지 캐시 — 원본 1벌</text>
  <text x="410" y="422" text-anchor="middle" font-size="11" fill="#92400e">(기본 설정상 raw로 변환해 보관)</text>

  <g text-anchor="middle">
    <rect x="610" y="356" width="95" height="76" rx="8" fill="#86efac"/>
    <text x="657" y="388" font-size="13" font-weight="700" fill="#14532d">VM1 disk</text>
    <text x="657" y="408" font-size="11" fill="#14532d">qcow2 오버레이</text>
    <rect x="715" y="356" width="95" height="76" rx="8" fill="#86efac"/>
    <text x="762" y="388" font-size="13" font-weight="700" fill="#14532d">VM2 disk</text>
    <text x="762" y="408" font-size="11" fill="#14532d">qcow2 오버레이</text>
    <rect x="820" y="356" width="95" height="76" rx="8" fill="#86efac"/>
    <text x="867" y="388" font-size="13" font-weight="700" fill="#14532d">VM3 disk</text>
    <text x="867" y="408" font-size="11" fill="#14532d">qcow2 오버레이</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="105" x2="257" y2="105" marker-end="url(#arrow)"/>
    <line x1="200" y1="175" x2="257" y2="130" marker-end="url(#arrow)"/>
    <line x1="360" y1="140" x2="360" y2="187" marker-end="url(#arrow)"/>
    <line x1="460" y1="110" x2="517" y2="110" marker-end="url(#arrow)"/>
    <line x1="285" y1="140" x2="140" y2="353" marker-end="url(#arrow)" stroke="#4f46e5"/>
    <line x1="220" y1="394" x2="287" y2="394" marker-end="url(#arrow)"/>
    <line x1="610" y1="394" x2="533" y2="394" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12" fill="#334155" font-weight="700">
    <text x="228" y="98" text-anchor="middle">업로드</text>
    <text x="368" y="170">메타데이터</text>
    <text x="488" y="102" text-anchor="middle">파일</text>
    <text x="206" y="290" fill="#4f46e5">① GET /v2/images/{id}/file</text>
    <text x="254" y="386" text-anchor="middle">② 캐시</text>
    <text x="571" y="386" text-anchor="middle">③ backing</text>
  </g>
</svg>
