<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">토큰 발급과 검증 흐름</text>

  <!-- Lifeline headers -->
  <g text-anchor="middle" font-size="15" font-weight="700">
    <rect x="40" y="56" width="160" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="120" y="84" fill="#0f172a">사용자 (CLI)</text>
    <rect x="300" y="56" width="160" height="44" rx="8" fill="#ed1944"/>
    <text x="380" y="84" fill="#ffffff">Keystone</text>
    <rect x="540" y="56" width="200" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="640" y="77" fill="#1e1b4b">nova-api</text>
    <text x="640" y="94" fill="#4f46e5" font-size="11" font-weight="400">+ keystonemiddleware</text>
    <rect x="790" y="56" width="140" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="860" y="84" fill="#78350f">Memcached</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="120" y1="100" x2="120" y2="470"/>
    <line x1="380" y1="100" x2="380" y2="470"/>
    <line x1="640" y1="100" x2="640" y2="470"/>
    <line x1="860" y1="100" x2="860" y2="470"/>
  </g>

  <!-- Messages -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="120" y1="138" x2="377" y2="138" marker-end="url(#arrow)"/>
    <line x1="380" y1="190" x2="123" y2="190" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
    <line x1="120" y1="248" x2="637" y2="248" marker-end="url(#arrow)"/>
    <line x1="640" y1="288" x2="857" y2="288" marker-end="url(#arrow)"/>
    <line x1="640" y1="330" x2="383" y2="330" marker-end="url(#arrow)"/>
    <line x1="380" y1="380" x2="637" y2="380" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
    <line x1="640" y1="458" x2="123" y2="458" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="130" y="130" font-weight="700">① <tspan font-family="Consolas,'D2Coding',monospace">POST /v3/auth/tokens</tspan></text>
    <text x="130" y="156" fill="#64748b">아이디 · 비밀번호 + scope(프로젝트)</text>
    <text x="370" y="182" text-anchor="end" font-weight="700">② 201 · 토큰 + 역할 + 카탈로그</text>
    <text x="370" y="208" text-anchor="end" fill="#64748b" font-family="Consolas,'D2Coding',monospace">X-Subject-Token: gAAAA…</text>
    <text x="130" y="240" font-weight="700">③ <tspan font-family="Consolas,'D2Coding',monospace">GET /compute/v2.1/servers</tspan></text>
    <text x="130" y="266" fill="#64748b" font-family="Consolas,'D2Coding',monospace">X-Auth-Token: gAAAA…</text>
    <text x="650" y="280" font-weight="700">④ 검증 결과 캐시 조회</text>
    <text x="630" y="322" text-anchor="end" font-weight="700">⑤ 캐시에 없으면 토큰 검증 요청</text>
    <text x="630" y="348" text-anchor="end" fill="#64748b" font-family="Consolas,'D2Coding',monospace">GET /v3/auth/tokens</text>
    <text x="390" y="372" font-weight="700">⑥ 유효 · 사용자 · 프로젝트 · 역할</text>
    <text x="630" y="450" text-anchor="end" font-weight="700">⑧ 200 OK (서버 목록) 또는 403</text>
  </g>

  <!-- Policy check -->
  <rect x="560" y="396" width="160" height="38" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="640" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑦ policy 검사</text>
  <text x="730" y="420" font-size="12" fill="#64748b">역할로 허용 여부 결정</text>
</svg>
