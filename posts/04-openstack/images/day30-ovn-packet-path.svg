<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ML2/OVN 패킷 경로 — vm1 → 외부 (North-South)</text>

  <!-- VM -->
  <rect x="20" y="110" width="110" height="90" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="75" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">vm1</text>
  <text x="75" y="160" text-anchor="middle" font-size="13" fill="#14532d">eth0</text>
  <text x="75" y="182" text-anchor="middle" font-size="11" fill="#14532d" font-family="Consolas,'D2Coding',monospace">192.168.10.5</text>

  <!-- tap -->
  <rect x="150" y="130" width="80" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="190" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">tap</text>
  <text x="190" y="172" text-anchor="middle" font-size="11" fill="#64748b">Day 22</text>

  <!-- br-int container -->
  <rect x="250" y="66" width="455" height="174" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="477" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">br-int — OVN 논리 파이프라인 (OpenFlow)</text>

  <rect x="265" y="106" width="130" height="118" rx="8" fill="#c7d2fe"/>
  <text x="330" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">① 논리 스위치</text>
  <text x="330" y="152" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">net1</text>
  <text x="330" y="180" text-anchor="middle" font-size="12" fill="#312e81">포트 보안</text>
  <text x="330" y="200" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">SG ACL 검사</text>

  <rect x="410" y="106" width="130" height="118" rx="8" fill="#ed1944"/>
  <text x="475" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② 논리 라우터</text>
  <text x="475" y="152" text-anchor="middle" font-size="13" fill="#ffffff" font-family="Consolas,'D2Coding',monospace">r1</text>
  <text x="475" y="180" text-anchor="middle" font-size="12" fill="#ffffff">라우팅</text>
  <text x="475" y="200" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">DNAT / SNAT</text>

  <rect x="555" y="106" width="135" height="118" rx="8" fill="#c7d2fe"/>
  <text x="622" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">③ 논리 스위치</text>
  <text x="622" y="152" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">public</text>
  <text x="622" y="180" text-anchor="middle" font-size="12" fill="#312e81">localnet 포트</text>
  <text x="622" y="200" text-anchor="middle" font-size="12" fill="#312e81">→ patch 포트</text>

  <!-- br-ex -->
  <rect x="720" y="130" width="90" height="50" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="765" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">br-ex</text>
  <text x="765" y="172" text-anchor="middle" font-size="11" fill="#92400e">Day 24</text>

  <!-- external -->
  <rect x="830" y="110" width="110" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="885" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">외부</text>
  <text x="885" y="160" text-anchor="middle" font-size="13" fill="#334155">물리 NIC /</text>
  <text x="885" y="182" text-anchor="middle" font-size="13" fill="#334155">클라이언트</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="130" y1="155" x2="147" y2="155" marker-end="url(#arrow)"/>
    <line x1="230" y1="155" x2="262" y2="155" marker-end="url(#arrow)"/>
    <line x1="395" y1="165" x2="407" y2="165" marker-end="url(#arrow)"/>
    <line x1="540" y1="165" x2="552" y2="165" marker-end="url(#arrow)"/>
    <line x1="690" y1="155" x2="717" y2="155" marker-end="url(#arrow)"/>
    <line x1="810" y1="155" x2="827" y2="155" marker-end="url(#arrow)"/>
  </g>

  <!-- Day mapping row -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="75" y="222">Day 21 virtio NIC</text>
    <text x="477" y="262">Day 24: 같은 br-int 안의 OpenFlow 테이블에서 ①→②→③ 처리 (netns 없음)</text>
    <text x="765" y="202">Day 23 flat</text>
  </g>

  <!-- Address translation -->
  <line x1="20" y1="286" x2="940" y2="286" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="314" font-size="15" font-weight="700" fill="#0f172a">주소 변환 — ② 논리 라우터에서 일어나는 일</text>

  <text x="60" y="344" font-size="12" fill="#64748b">net1 구간 (사설)</text>
  <text x="580" y="344" font-size="12" fill="#64748b">public 구간 (외부)</text>

  <rect x="60" y="352" width="320" height="40" rx="6" fill="#c7d2fe"/>
  <text x="220" y="377" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">src 192.168.10.5  dst 8.8.8.8</text>
  <line x1="380" y1="372" x2="577" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">SNAT (나가는 방향)</text>
  <rect x="580" y="352" width="340" height="40" rx="6" fill="#fde68a"/>
  <text x="750" y="377" text-anchor="middle" font-size="13" fill="#78350f" font-family="Consolas,'D2Coding',monospace">src 172.24.4.150  dst 8.8.8.8</text>

  <rect x="60" y="406" width="320" height="40" rx="6" fill="#c7d2fe"/>
  <text x="220" y="431" text-anchor="middle" font-size="13" fill="#312e81" font-family="Consolas,'D2Coding',monospace">src 172.24.4.1  dst 192.168.10.5</text>
  <line x1="580" y1="426" x2="383" y2="426" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">DNAT (들어오는 방향)</text>
  <rect x="580" y="406" width="340" height="40" rx="6" fill="#fde68a"/>
  <text x="750" y="431" text-anchor="middle" font-size="13" fill="#78350f" font-family="Consolas,'D2Coding',monospace">src 172.24.4.1  dst 172.24.4.150</text>

  <text x="480" y="474" text-anchor="middle" font-size="13" fill="#15803d" font-weight="700">다른 노드의 VM끼리(East-West)는 라우터 NAT 없이 br-int ↔ br-int Geneve 터널로 전달 (Day 23)</text>
</svg>
