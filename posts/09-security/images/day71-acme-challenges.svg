<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ACME 도메인 검증 — HTTP-01 vs DNS-01</text>

  <!-- HTTP-01 -->
  <rect x="20" y="56" width="450" height="424" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="245" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">HTTP-01</text>

  <rect x="40" y="104" width="170" height="60" rx="8" fill="#326ce5"/>
  <text x="125" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cert-manager</text>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#ffffff">Order → Challenge</text>
  <rect x="280" y="104" width="170" height="60" rx="8" fill="#fde68a"/>
  <text x="365" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Let's Encrypt</text>
  <text x="365" y="150" text-anchor="middle" font-size="12" fill="#78350f">ACME 서버</text>

  <rect x="40" y="214" width="410" height="96" rx="8" fill="#ffffff" stroke="#326ce5"/>
  <text x="56" y="238" font-size="13" font-weight="700" fill="#1e3a8a">클러스터 (공인 IP의 80 포트 필요)</text>
  <rect x="56" y="250" width="180" height="46" rx="6" fill="#93c5fd"/>
  <text x="146" y="270" text-anchor="middle" font-size="12" fill="#1e3a8a">acme-solver Pod</text>
  <text x="146" y="287" text-anchor="middle" font-size="11" fill="#1e3a8a">토큰 응답</text>
  <rect x="256" y="250" width="180" height="46" rx="6" fill="#93c5fd"/>
  <text x="346" y="270" text-anchor="middle" font-size="12" fill="#1e3a8a">Gateway/Ingress :80</text>
  <text x="346" y="287" text-anchor="middle" font-size="11" fill="#1e3a8a">임시 HTTPRoute 추가</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="210" y1="126" x2="276" y2="126" marker-end="url(#arrow)"/>
    <line x1="365" y1="164" x2="365" y2="246" marker-end="url(#arrow)"/>
    <line x1="254" y1="273" x2="240" y2="273" marker-end="url(#arrow)"/>
    <line x1="125" y1="164" x2="125" y2="210" marker-end="url(#arrow)"/>
  </g>
  <text x="243" y="118" text-anchor="middle" font-size="11" fill="#334155">요청</text>
  <text x="355" y="186" text-anchor="end" font-size="11" fill="#334155">GET /.well-known/</text>
  <text x="355" y="200" text-anchor="end" font-size="11" fill="#334155">acme-challenge/&lt;토큰&gt;</text>
  <text x="70" y="192" font-size="11" fill="#334155">생성</text>

  <g font-size="13">
    <text x="40" y="346" fill="#16a34a" font-weight="700">+ 설정이 간단, 추가 비밀 없음</text>
    <text x="40" y="372" fill="#dc2626" font-weight="700">- 인터넷에서 80 포트로 닿아야 함</text>
    <text x="40" y="398" fill="#dc2626" font-weight="700">- 와일드카드(*.example.com) 불가</text>
    <text x="40" y="424" fill="#dc2626" font-weight="700">- CGNAT·사설망 불가</text>
    <text x="40" y="458" fill="#334155">홈랩: 포트포워딩한 서버 (H02·H03)</text>
  </g>

  <!-- DNS-01 -->
  <rect x="490" y="56" width="450" height="424" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">DNS-01</text>

  <rect x="510" y="104" width="170" height="60" rx="8" fill="#326ce5"/>
  <text x="595" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cert-manager</text>
  <text x="595" y="150" text-anchor="middle" font-size="12" fill="#ffffff">Order → Challenge</text>
  <rect x="750" y="104" width="170" height="60" rx="8" fill="#fde68a"/>
  <text x="835" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Let's Encrypt</text>
  <text x="835" y="150" text-anchor="middle" font-size="12" fill="#78350f">ACME 서버</text>

  <rect x="510" y="214" width="410" height="96" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="526" y="238" font-size="13" font-weight="700" fill="#14532d">DNS 제공자 (Cloudflare, Route53 …)</text>
  <rect x="526" y="250" width="380" height="46" rx="6" fill="#86efac"/>
  <text x="716" y="270" text-anchor="middle" font-size="12" fill="#14532d" font-family="Consolas,'D2Coding',monospace">_acme-challenge.example.com TXT</text>
  <text x="716" y="287" text-anchor="middle" font-size="11" fill="#14532d">API 토큰으로 생성 → 검증 후 삭제</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="680" y1="126" x2="746" y2="126" marker-end="url(#arrow)"/>
    <line x1="595" y1="164" x2="595" y2="210" marker-end="url(#arrow)"/>
    <line x1="835" y1="164" x2="835" y2="246" marker-end="url(#arrow)"/>
  </g>
  <text x="713" y="118" text-anchor="middle" font-size="11" fill="#334155">요청</text>
  <text x="540" y="192" font-size="11" fill="#334155">TXT 생성</text>
  <text x="845" y="200" font-size="11" fill="#334155">DNS 조회</text>

  <g font-size="13">
    <text x="510" y="346" fill="#16a34a" font-weight="700">+ 와일드카드 인증서 가능</text>
    <text x="510" y="372" fill="#16a34a" font-weight="700">+ 서버를 외부에 노출하지 않아도 됨</text>
    <text x="510" y="398" fill="#dc2626" font-weight="700">- DNS API 토큰 보관 필요 (권한 최소화)</text>
    <text x="510" y="424" fill="#dc2626" font-weight="700">- DNS 전파 대기로 조금 느릴 수 있음</text>
    <text x="510" y="458" fill="#334155">홈랩: Cloudflare로 도메인 관리, CGNAT 환경</text>
  </g>
</svg>
