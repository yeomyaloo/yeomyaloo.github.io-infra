<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">탐지에서 대응까지 — 우선순위별로 다른 길</text>

  <!-- 1 behavior -->
  <rect x="20" y="70" width="180" height="150" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="110" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">① 이상 행위</text>
  <g font-size="13" fill="#7f1d1d" text-anchor="middle">
    <text x="110" y="132">대화형 셸 실행</text>
    <text x="110" y="160" font-family="Consolas,'D2Coding',monospace">cat /etc/shadow</text>
    <text x="110" y="188">패키지 매니저 실행</text>
  </g>

  <!-- 2 Falco -->
  <rect x="240" y="70" width="170" height="150" rx="12" fill="#b91c1c"/>
  <text x="325" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">② Falco</text>
  <g font-size="13" fill="#fee2e2" text-anchor="middle">
    <text x="325" y="132">syscall 감시</text>
    <text x="325" y="160">룰 매칭</text>
    <text x="325" y="188">priority 부여</text>
  </g>

  <!-- 3 sidekick -->
  <rect x="450" y="70" width="170" height="150" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="535" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">③ Falcosidekick</text>
  <g font-size="13" fill="#7c2d12" text-anchor="middle">
    <text x="535" y="132">목적지별 형식 변환</text>
    <text x="535" y="160">minimumpriority</text>
    <text x="535" y="188">필터</text>
  </g>

  <!-- targets -->
  <rect x="670" y="56" width="270" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="805" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Loki → Grafana</text>
  <text x="805" y="100" text-anchor="middle" font-size="12" fill="#134e4a">NOTICE 이상 · 모두 기록·검색 (Day 60)</text>

  <rect x="670" y="126" width="270" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="805" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Alertmanager → 온콜</text>
  <text x="805" y="170" text-anchor="middle" font-size="12" fill="#7f1d1d">WARNING 이상 · 그룹핑·라우팅 (Day 62)</text>

  <rect x="670" y="196" width="270" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="805" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Falco Talon (자동 대응)</text>
  <text x="805" y="240" text-anchor="middle" font-size="12" fill="#334155">CRITICAL · 충분히 튜닝된 룰만</text>

  <g font-size="12" text-anchor="middle">
    <rect x="670" y="282" width="84" height="36" rx="6" fill="#e2e8f0"/>
    <text x="712" y="305" fill="#0f172a">라벨 부착</text>
    <rect x="762" y="282" width="100" height="36" rx="6" fill="#e2e8f0"/>
    <text x="812" y="305" fill="#0f172a">네트워크 격리</text>
    <rect x="870" y="282" width="70" height="36" rx="6" fill="#fca5a5"/>
    <text x="905" y="305" fill="#7f1d1d">Pod 종료</text>
  </g>
  <text x="805" y="340" text-anchor="middle" font-size="11" fill="#64748b">왼쪽일수록 되돌리기 쉬움</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="145" x2="237" y2="145" marker-end="url(#arrow)"/>
    <line x1="410" y1="145" x2="447" y2="145" marker-end="url(#arrow)"/>
    <line x1="620" y1="145" x2="667" y2="86" marker-end="url(#arrow)"/>
    <line x1="620" y1="152" x2="667" y2="154" marker-end="url(#arrow)"/>
    <line x1="620" y1="160" x2="667" y2="222" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="812" y1="252" x2="812" y2="279" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>

  <!-- caution box -->
  <rect x="20" y="250" width="600" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="40" y="278" font-size="15" font-weight="700" fill="#92400e">자동 대응을 붙일 때의 원칙</text>
  <g font-size="13" fill="#78350f">
    <text x="40" y="304">1. 오탐이 곧 장애 — 튜닝이 끝난 높은 우선순위 룰에만 연결</text>
    <text x="40" y="328">2. 삭제보다 격리 — 라벨 + NetworkPolicy(Day 70)처럼 되돌릴 수 있는 것부터</text>
    <text x="40" y="352">3. 증거 먼저 — 로그·파일을 수집한 뒤 조치, 처음에는 dry-run</text>
  </g>
</svg>
