<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Falco 룰의 구조 — list · macro · rule</text>

  <!-- list -->
  <rect x="20" y="62" width="540" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <rect x="34" y="72" width="56" height="22" rx="11" fill="#f59e0b"/>
  <text x="62" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">list</text>
  <text x="102" y="88" font-size="12" fill="#92400e">값 목록 (상수 배열)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="40" y="114">- list: infra_lab_pkg_mgrs</text>
    <text x="54" y="132">items: [apt, apt-get, dpkg, apk, pip]</text>
  </g>

  <!-- macro -->
  <rect x="20" y="158" width="540" height="78" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <rect x="34" y="168" width="66" height="22" rx="11" fill="#4f46e5"/>
  <text x="67" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">macro</text>
  <text x="112" y="184" font-size="12" fill="#312e81">재사용할 조건식 조각</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="40" y="210">- macro: infra_lab_pkg_mgr_proc</text>
    <text x="54" y="228">condition: proc.name in (infra_lab_pkg_mgrs)</text>
  </g>

  <!-- rule -->
  <rect x="20" y="254" width="540" height="190" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
  <rect x="34" y="264" width="56" height="22" rx="11" fill="#b91c1c"/>
  <text x="62" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">rule</text>
  <text x="102" y="280" font-size="12" fill="#7f1d1d">condition + output + priority = 경보 한 종류</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="40" y="308">- rule: Package manager in container</text>
    <text x="54" y="327">condition: <tspan fill="#4f46e5">spawned_process and container</tspan></text>
    <text x="133" y="346">and <tspan fill="#4f46e5">infra_lab_pkg_mgr_proc</tspan></text>
    <text x="54" y="365">output: Package manager launched</text>
    <text x="69" y="384">(cmd=%proc.cmdline pod=%k8s.pod.name)</text>
    <text x="54" y="403">priority: WARNING</text>
    <text x="54" y="422">tags: [container, infra_lab]</text>
  </g>
  <text x="20" y="470" font-size="12" fill="#64748b">spawned_process · container 는 기본 룰셋(falco_rules.yaml)에 정의된 매크로를 재사용</text>

  <!-- reference arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M560,112 C604,112 604,206 563,206" marker-end="url(#arrow)"/>
    <path d="M560,222 C604,222 604,340 563,340" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="606" y="163">참조</text>
    <text x="606" y="285">참조</text>
  </g>

  <!-- evaluation flow -->
  <text x="790" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">이벤트마다 일어나는 일</text>
  <g text-anchor="middle">
    <rect x="660" y="92" width="260" height="44" rx="8" fill="#e2e8f0"/>
    <text x="790" y="119" font-size="13" fill="#0f172a">syscall 이벤트 + 문맥(Pod·이미지)</text>

    <rect x="660" y="162" width="260" height="52" rx="8" fill="#fca5a5"/>
    <text x="790" y="184" font-size="13" font-weight="700" fill="#7f1d1d">condition 평가</text>
    <text x="790" y="203" font-size="11" fill="#7f1d1d">거짓이면 버리고 다음 이벤트로</text>

    <rect x="660" y="240" width="260" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="790" y="267" font-size="13" fill="#7f1d1d">output의 %필드 채우기</text>

    <rect x="660" y="310" width="260" height="52" rx="8" fill="#fde68a"/>
    <text x="790" y="332" font-size="13" font-weight="700" fill="#78350f">priority 비교</text>
    <text x="790" y="351" font-size="11" fill="#78350f">출력별 minimumpriority 이상만</text>

    <rect x="660" y="388" width="260" height="44" rx="8" fill="#b91c1c"/>
    <text x="790" y="415" font-size="13" font-weight="700" fill="#ffffff">경보 전송 (stdout · Falcosidekick)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="790" y1="136" x2="790" y2="159" marker-end="url(#arrow)"/>
    <line x1="790" y1="214" x2="790" y2="237" marker-end="url(#arrow)"/>
    <line x1="790" y1="284" x2="790" y2="307" marker-end="url(#arrow)"/>
    <line x1="790" y1="362" x2="790" y2="385" marker-end="url(#arrow)"/>
  </g>
  <text x="800" y="230" font-size="11" font-weight="700" fill="#334155">참</text>
  <text x="790" y="462" text-anchor="middle" font-size="11" fill="#64748b">EMERGENCY &gt; ALERT &gt; CRITICAL &gt; ERROR</text>
  <text x="790" y="480" text-anchor="middle" font-size="11" fill="#64748b">&gt; WARNING &gt; NOTICE &gt; INFORMATIONAL &gt; DEBUG</text>
</svg>
