  </g>

  <!-- legend -->
  <g font-size="12">
    <rect x="20" y="532" width="14" height="14" rx="3" fill="#334155"/>
    <text x="40" y="544" fill="#334155">예방 — 문을 잠근다</text>
    <rect x="190" y="532" width="14" height="14" rx="3" fill="#b91c1c"/>
    <text x="210" y="544" fill="#334155">탐지·기록 — 들어오면 안다</text>
  </g>
  <text x="940" y="544" text-anchor="end" font-size="13" fill="#334155">가장 위험한 경로부터 예방 하나 + 탐지 하나를 짝지어 둔다</text>
