<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Chapter 9 회고 — 4C 레이어별로 쌓은 방어</text>

  <!-- Cloud -->
  <rect x="20" y="56" width="920" height="460" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="44" y="88" font-size="18" font-weight="700" fill="#334155">Cloud · 인프라</text>
  <text x="44" y="110" font-size="12" fill="#64748b">홈랩 서버 · 노드 OS</text>
  <g font-size="13" fill="#334155">
    <text x="330" y="86">Day 67  SSH · sudo · nftables · fail2ban · Lynis / CIS</text>
    <text x="330" y="110">Day 66  위협 모델링 — 모든 레이어의 출발점</text>
  </g>

  <!-- Cluster -->
  <rect x="44" y="128" width="872" height="368" rx="14" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="68" y="160" font-size="18" font-weight="700" fill="#1e3a8a">Cluster</text>
  <text x="68" y="182" font-size="12" fill="#1e3a8a">API 서버 · 네트워크 · 신원</text>
  <g font-size="13" fill="#1e3a8a">
    <text x="330" y="156">Day 69  Pod Security Admission · kube-bench</text>
    <text x="330" y="178">Day 70  NetworkPolicy · 제로 트러스트 · mTLS</text>
    <text x="330" y="200">Day 71  cert-manager · OpenBao</text>
    <text x="330" y="222">Day 73  Keycloak OIDC SSO · 그룹 → RBAC</text>
  </g>
  <rect x="756" y="208" width="140" height="22" rx="11" fill="#b91c1c"/>
  <text x="826" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">감사 로그 (기록)</text>

  <!-- Container -->
  <rect x="68" y="244" width="824" height="232" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="92" y="276" font-size="18" font-weight="700" fill="#14532d">Container</text>
  <text x="92" y="298" font-size="12" fill="#14532d">런타임 · 커널 경계</text>
  <g font-size="13" fill="#14532d">
    <text x="330" y="272">Day 68  rootless · capabilities · seccomp · AppArmor</text>
    <text x="383" y="294">· read-only FS</text>
    <text x="330" y="316">Day 72  Falco — modern eBPF 런타임 탐지</text>
  </g>
  <rect x="756" y="302" width="116" height="22" rx="11" fill="#b91c1c"/>
  <text x="814" y="317" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">탐지</text>

  <!-- Code -->
  <rect x="92" y="336" width="776" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="116" y="368" font-size="18" font-weight="700" fill="#7c2d12">Code</text>
  <text x="116" y="390" font-size="12" fill="#7c2d12">이미지 · 의존성 · 시크릿</text>
  <g font-size="13" fill="#7c2d12">
    <text x="330" y="366">Day 57  Trivy · cosign · Kyverno (공급망)</text>
    <text x="330" y="390">Day 55  SOPS · External Secrets</text>
    <text x="330" y="414">Day 48  LLM 가드레일 · 프롬프트 인젝션</text>
