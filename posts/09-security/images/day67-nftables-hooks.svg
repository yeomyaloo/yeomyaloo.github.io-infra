<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">netfilter 훅과 테이블 공존 — Ubuntu 24.04 (nftables 백엔드)</text>

  <!-- Ingress -->
  <rect x="20" y="240" width="110" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="75" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">NIC</text>
  <text x="75" y="286" text-anchor="middle" font-size="12" fill="#475569">enp3s0</text>

  <rect x="160" y="240" width="150" height="60" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="2"/>
  <text x="235" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">prerouting 훅</text>
  <text x="235" y="286" text-anchor="middle" font-size="11" fill="#1e3a8a">Docker DNAT (ip nat)</text>

  <rect x="340" y="240" width="120" height="60" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">라우팅 결정</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="130" y1="270" x2="157" y2="270" marker-end="url(#arrow)"/>
    <line x1="310" y1="270" x2="337" y2="270" marker-end="url(#arrow)"/>
    <line x1="460" y1="255" x2="497" y2="170" marker-end="url(#arrow)"/>
    <line x1="460" y1="285" x2="497" y2="380" marker-end="url(#arrow)"/>
  </g>
  <text x="400" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">목적지 = 호스트</text>
  <text x="400" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#2496ed">목적지 = 컨테이너</text>

  <!-- Input hook -->
  <rect x="500" y="70" width="400" height="200" rx="12" fill="#fff5f5" stroke="#b91c1c" stroke-width="2"/>
  <text x="515" y="94" font-size="15" font-weight="700" fill="#b91c1c">input 훅 — priority 순서로 모두 통과</text>
  <rect x="515" y="106" width="370" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="530" y="131" font-size="12" fill="#7f1d1d">① inet f2b-table · f2b-chain  (filter - 1) — ban IP reject</text>
  <rect x="515" y="154" width="370" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="530" y="179" font-size="12" fill="#7f1d1d">② inet hostfw · input  (filter, policy drop) — 오늘 작성</text>
  <rect x="515" y="202" width="370" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="530" y="227" font-size="12" fill="#64748b">③ ip filter · ufw-* 체인 — ufw를 쓰면 생김 (오늘은 끔)</text>

  <rect x="940" y="140" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1010" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">로컬 프로세스</text>
  <text x="1010" y="186" text-anchor="middle" font-size="12" fill="#14532d">sshd · kubelet</text>
  <line x1="900" y1="170" x2="937" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Forward hook -->
  <rect x="500" y="330" width="400" height="130" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="515" y="354" font-size="15" font-weight="700" fill="#1e3a8a">forward 훅</text>
  <rect x="515" y="366" width="370" height="40" rx="6" fill="#dbeafe" stroke="#2496ed"/>
  <text x="530" y="391" font-size="12" fill="#1e3a8a">ip filter · DOCKER-USER / DOCKER* 체인 (Docker 관리)</text>
  <text x="530" y="438" font-size="12" fill="#475569">hostfw는 forward를 건드리지 않음 → Docker · CNI에 위임</text>

  <rect x="940" y="365" width="140" height="60" rx="8" fill="#e0f2fe" stroke="#2496ed"/>
  <text x="1010" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">컨테이너</text>
  <text x="1010" y="411" text-anchor="middle" font-size="12" fill="#0c4a6e">veth → eth0</text>
  <line x1="900" y1="395" x2="937" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <rect x="20" y="490" width="1060" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="13" fill="#334155">
    <text x="40" y="518">① 같은 훅의 base chain은 priority 순서로 모두 지나간다 — 하나라도 drop이면 끝, accept는 그 체인 안에서만 최종</text>
    <text x="40" y="542">② -p 8080:80 공개 포트는 DNAT 후 forward 경로 → input만 막는 방화벽(ufw · hostfw)을 지나지 않는다</text>
    <text x="40" y="566">③ flush ruleset은 Docker · fail2ban 테이블까지 지운다 → 자기 테이블만 교체하고, 서비스는 reload만</text>
  </g>
</svg>
