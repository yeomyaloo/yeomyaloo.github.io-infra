<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">user namespace — 컨테이너의 root는 호스트에서 누구인가</text>

  <!-- Column frames -->
  <rect x="20" y="60" width="300" height="440" rx="12" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <rect x="350" y="60" width="300" height="440" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="680" y="60" width="300" height="440" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <g font-size="17" font-weight="700" text-anchor="middle">
    <text x="170" y="92" fill="#991b1b">기본 (rootful)</text>
    <text x="500" y="92" fill="#166534">userns-remap</text>
    <text x="830" y="92" fill="#166534">rootless</text>
  </g>

  <!-- dockerd -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="110" width="260" height="46" rx="8" fill="#2496ed"/>
    <text x="170" y="138" fill="#ffffff" font-weight="700">dockerd 실행 계정: root</text>
    <rect x="370" y="110" width="260" height="46" rx="8" fill="#2496ed"/>
    <text x="500" y="138" fill="#ffffff" font-weight="700">dockerd 실행 계정: root</text>
    <rect x="700" y="110" width="260" height="46" rx="8" fill="#16a34a"/>
    <text x="830" y="138" fill="#ffffff" font-weight="700">dockerd 실행 계정: devops</text>
  </g>

  <!-- Container -->
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="176" width="260" height="56" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="170" y="200" font-weight="700">컨테이너 안</text>
    <text x="170" y="221">UID 0 (root)</text>
    <rect x="370" y="176" width="260" height="56" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="500" y="200" font-weight="700">컨테이너 안</text>
    <text x="500" y="221">UID 0 (root)</text>
    <rect x="700" y="176" width="260" height="56" rx="8" fill="#ffffff" stroke="#2496ed"/>
    <text x="830" y="200" font-weight="700">컨테이너 안</text>
    <text x="830" y="221">UID 0 (root)</text>
  </g>

  <g stroke="#334155" stroke-width="2">
    <line x1="170" y1="232" x2="170" y2="282" marker-end="url(#arrow)"/>
    <line x1="500" y1="232" x2="500" y2="282" marker-end="url(#arrow)"/>
    <line x1="830" y1="232" x2="830" y2="282" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="180" y="262">매핑 없음</text>
    <text x="510" y="262">subuid로 매핑</text>
    <text x="840" y="262">사용자 UID로 매핑</text>
  </g>

  <!-- Host identity -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="285" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="170" y="309" font-weight="700" fill="#7f1d1d">호스트에서</text>
    <text x="170" y="330" fill="#7f1d1d">UID 0 (root)</text>
    <rect x="370" y="285" width="260" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="500" y="309" font-weight="700" fill="#14532d">호스트에서</text>
    <text x="500" y="330" fill="#14532d">UID 165536 (dockremap의 subuid)</text>
    <rect x="700" y="285" width="260" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="830" y="309" font-weight="700" fill="#14532d">호스트에서</text>
    <text x="830" y="330" fill="#14532d">UID 1000 (devops)</text>
  </g>

  <!-- Other UIDs -->
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="170" y="370">컨테이너 UID 1, 2, ...</text>
    <text x="170" y="388">→ 호스트 UID 1, 2, ... (그대로)</text>
    <text x="500" y="370">컨테이너 UID 1 ~ 65535</text>
    <text x="500" y="388">→ 호스트 165537 ~ 231071</text>
    <text x="830" y="370">컨테이너 UID 1 ~ 65536</text>
    <text x="830" y="388">→ 호스트 100000 ~ 165535 (subuid)</text>
  </g>

  <!-- Result -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="410" width="260" height="70" rx="8" fill="#dc2626"/>
    <text x="170" y="438" fill="#ffffff">-v /etc:/host-etc → 쓰기 가능</text>
    <text x="170" y="462" fill="#ffffff">탈출 = 호스트 root</text>
    <rect x="370" y="410" width="260" height="70" rx="8" fill="#16a34a"/>
    <text x="500" y="438" fill="#ffffff">-v /etc:/host-etc → 거부</text>
    <text x="500" y="462" fill="#ffffff">데몬은 여전히 root</text>
    <rect x="700" y="410" width="260" height="70" rx="8" fill="#16a34a"/>
    <text x="830" y="438" fill="#ffffff">-v /etc:/host-etc → 거부</text>
    <text x="830" y="462" fill="#ffffff">데몬 탈취도 devops 권한</text>
  </g>
</svg>
