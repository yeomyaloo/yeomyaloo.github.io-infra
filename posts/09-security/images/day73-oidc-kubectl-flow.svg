<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">kubectl OIDC 로그인 흐름 (kubelogin + Keycloak)</text>

  <!-- lifeline heads -->
  <g text-anchor="middle" font-size="14" font-weight="700">
    <rect x="25" y="56" width="150" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="100" y="82" fill="#0f172a">브라우저</text>
    <rect x="215" y="56" width="150" height="42" rx="8" fill="#e0f2fe" stroke="#2496ed"/>
    <text x="290" y="82" fill="#0c4a6e">kubectl + kubelogin</text>
    <rect x="425" y="56" width="150" height="42" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="500" y="82" fill="#312e81">Keycloak</text>
    <rect x="625" y="56" width="150" height="42" rx="8" fill="#dbeafe" stroke="#326ce5"/>
    <text x="700" y="82" fill="#1e3a8a">kube-apiserver</text>
    <rect x="805" y="56" width="140" height="42" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="875" y="82" fill="#7f1d1d">RBAC · 감사 로그</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="98" x2="100" y2="560"/>
    <line x1="290" y1="98" x2="290" y2="560"/>
    <line x1="500" y1="98" x2="500" y2="560"/>
    <line x1="700" y1="98" x2="700" y2="560"/>
    <line x1="875" y1="98" x2="875" y2="560"/>
  </g>

  <!-- step 0: JWKS -->
  <line x1="697" y1="128" x2="503" y2="128" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="600" y="120" text-anchor="middle" font-size="12" fill="#312e81" stroke="#ffffff" stroke-width="5" paint-order="stroke">⓪ 디스커버리 · JWKS 공개키 받아 둠</text>

  <!-- step 1 self note -->
  <rect x="205" y="140" width="170" height="30" rx="6" fill="#ffffff" stroke="#2496ed"/>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#0c4a6e" font-family="Consolas,'D2Coding',monospace">kubectl get pods (exec)</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="290" y1="196" x2="103" y2="196" marker-end="url(#arrow)"/>
    <line x1="100" y1="236" x2="497" y2="236" marker-end="url(#arrow)"/>
    <line x1="500" y1="276" x2="293" y2="276" marker-end="url(#arrow)"/>
    <line x1="290" y1="316" x2="497" y2="316" marker-end="url(#arrow)"/>
    <line x1="500" y1="356" x2="293" y2="356" marker-end="url(#arrow)"/>
  </g>
  <line x1="290" y1="398" x2="697" y2="398" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <g font-size="12" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">
    <text x="195" y="188">① 로그인 페이지 열기</text>
    <text x="195" y="228">② alice 로그인 (Keycloak 화면)</text>
    <text x="395" y="268">③ 콜백 localhost:8000?code=…</text>
    <text x="395" y="308">④ code → 토큰 교환 (PKCE)</text>
    <text x="395" y="348">⑤ ID 토큰(JWT) + refresh</text>
  </g>
  <text x="495" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d" stroke="#ffffff" stroke-width="5" paint-order="stroke">⑥ Authorization: Bearer &lt;ID 토큰&gt;</text>

  <!-- step 7 note -->
  <rect x="580" y="414" width="240" height="56" rx="8" fill="#dbeafe" stroke="#326ce5"/>
  <text x="700" y="436" text-anchor="middle" font-size="12" fill="#1e3a8a">⑦ 서명 · 만료 · iss · aud 검증</text>
  <text x="700" y="457" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">oidc:alice [oidc:team-a-devs]</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="820" y1="442" x2="872" y2="442" marker-end="url(#arrow)"/>
    <line x1="875" y1="496" x2="703" y2="496" marker-end="url(#arrow)"/>
    <line x1="700" y1="536" x2="293" y2="536" marker-end="url(#arrow)"/>
  </g>
  <text x="848" y="434" text-anchor="middle" font-size="11" fill="#334155">⑧</text>
  <text x="788" y="488" text-anchor="middle" font-size="12" fill="#7f1d1d" stroke="#ffffff" stroke-width="5" paint-order="stroke">허용 / 403 + 감사 기록</text>
  <text x="495" y="528" text-anchor="middle" font-size="12" fill="#334155" stroke="#ffffff" stroke-width="5" paint-order="stroke">⑨ 응답 (200 또는 Forbidden)</text>

  <text x="480" y="592" text-anchor="middle" font-size="13" fill="#334155">API 서버는 요청마다 Keycloak에 묻지 않는다 — 받아 둔 공개키로 토큰을 직접 검증</text>
</svg>
