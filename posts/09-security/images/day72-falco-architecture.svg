<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Falco 아키텍처 — 커널에서 경보까지</text>

  <!-- Workload pods -->
  <rect x="20" y="70" width="210" height="260" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="125" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">워크로드 Pod</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="110" width="170" height="36" rx="6" fill="#bfdbfe"/>
    <text x="125" y="133" fill="#1e3a8a">nginx (victim)</text>
    <rect x="40" y="158" width="170" height="36" rx="6" fill="#fca5a5"/>
    <text x="125" y="181" fill="#7f1d1d">bash (대화형 셸)</text>
    <rect x="40" y="206" width="170" height="36" rx="6" fill="#fca5a5"/>
    <text x="125" y="229" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">cat /etc/shadow</text>
    <rect x="40" y="254" width="170" height="36" rx="6" fill="#fca5a5"/>
    <text x="125" y="277" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">apt-get</text>
  </g>
  <text x="125" y="316" text-anchor="middle" font-size="12" fill="#64748b">모든 동작은 syscall이 된다</text>

  <!-- Falco pod -->
  <rect x="250" y="70" width="400" height="260" rx="12" fill="#fff5f5" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Falco Pod (DaemonSet)</text>

  <!-- side column -->
  <g text-anchor="middle">
    <rect x="270" y="106" width="170" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="355" y="124" font-size="13" font-weight="700" fill="#0f172a">falcoctl 사이드카</text>
    <text x="355" y="141" font-size="11" fill="#64748b">룰 자동 다운로드·갱신</text>

    <rect x="270" y="160" width="170" height="44" rx="8" fill="#fde68a"/>
    <text x="355" y="178" font-size="13" font-weight="700" fill="#78350f">룰 파일 (YAML)</text>
    <text x="355" y="195" font-size="11" fill="#78350f">기본 룰 + rules.d/</text>

    <rect x="270" y="218" width="170" height="44" rx="8" fill="#c7d2fe"/>
    <text x="355" y="236" font-size="13" font-weight="700" fill="#312e81">container 플러그인</text>
    <text x="355" y="253" font-size="11" fill="#312e81">Pod · 이미지 메타데이터</text>

    <text x="355" y="290" font-size="11" fill="#64748b">containerd 소켓에 조회</text>
  </g>

  <!-- pipeline column (bottom-up) -->
  <g text-anchor="middle">
    <rect x="460" y="104" width="170" height="40" rx="8" fill="#b91c1c"/>
    <text x="545" y="129" font-size="13" font-weight="700" fill="#ffffff">출력 · stdout / HTTP</text>

    <rect x="460" y="160" width="170" height="44" rx="8" fill="#fca5a5"/>
    <text x="545" y="178" font-size="13" font-weight="700" fill="#7f1d1d">룰 엔진</text>
    <text x="545" y="195" font-size="11" fill="#7f1d1d">condition 평가</text>

    <rect x="460" y="218" width="170" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="545" y="236" font-size="13" font-weight="700" fill="#7f1d1d">libsinsp</text>
    <text x="545" y="253" font-size="11" fill="#7f1d1d">상태·프로세스 트리 결합</text>

    <rect x="460" y="276" width="170" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="545" y="293" font-size="13" font-weight="700" fill="#7f1d1d">libscap</text>
    <text x="545" y="309" font-size="11" fill="#7f1d1d">이벤트 수신</text>
  </g>

  <!-- Kernel band -->
  <rect x="20" y="370" width="620" height="110" rx="12" fill="#e2e8f0" stroke="#64748b"/>
  <text x="40" y="466" font-size="14" font-weight="700" fill="#334155">리눅스 커널 — kind에서는 모든 노드가 하나를 공유</text>
  <g text-anchor="middle">
    <rect x="40" y="382" width="190" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="135" y="404" font-size="13" font-weight="700" fill="#0f172a">syscall 훅</text>
    <text x="135" y="425" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">execve · openat · connect</text>

    <rect x="260" y="382" width="180" height="56" rx="8" fill="#b91c1c"/>
    <text x="350" y="404" font-size="13" font-weight="700" fill="#ffffff">modern eBPF 프로브</text>
    <text x="350" y="425" font-size="11" fill="#fee2e2">CO-RE · 커널 5.8+ · BTF</text>

    <rect x="470" y="382" width="150" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="545" y="404" font-size="13" font-weight="700" fill="#0f172a">링 버퍼</text>
    <text x="545" y="425" font-size="11" fill="#334155">커널 → 사용자 공간</text>
  </g>

  <!-- Falcosidekick -->
  <rect x="690" y="70" width="250" height="110" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="815" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Falcosidekick</text>
  <text x="815" y="124" text-anchor="middle" font-size="12" fill="#7c2d12">경보를 목적지별 형식으로 변환</text>
  <text x="815" y="144" text-anchor="middle" font-size="12" fill="#7c2d12">minimumpriority로 거르기</text>
  <text x="815" y="166" text-anchor="middle" font-size="11" fill="#64748b">(Deployment)</text>

  <g text-anchor="middle" font-size="13">
    <rect x="725" y="212" width="215" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="832" y="237" fill="#134e4a">Loki → Grafana (기록)</text>
    <rect x="725" y="264" width="215" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="832" y="289" fill="#7f1d1d">Alertmanager → 온콜</text>
    <rect x="725" y="316" width="215" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="832" y="341" fill="#334155">Falcosidekick UI</text>
    <rect x="725" y="368" width="215" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="6 4"/>
    <text x="832" y="393" fill="#334155">Falco Talon (자동 대응)</text>
    <rect x="725" y="420" width="215" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="832" y="445" fill="#334155">Slack · Webhook 등</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="125" y1="330" x2="125" y2="379" marker-end="url(#arrow)"/>
    <line x1="230" y1="410" x2="257" y2="410" marker-end="url(#arrow)"/>
    <line x1="440" y1="410" x2="467" y2="410" marker-end="url(#arrow)"/>
    <line x1="545" y1="382" x2="545" y2="319" marker-end="url(#arrow)"/>
    <line x1="545" y1="276" x2="545" y2="265" marker-end="url(#arrow)"/>
    <line x1="545" y1="218" x2="545" y2="207" marker-end="url(#arrow)"/>
    <line x1="545" y1="160" x2="545" y2="147" marker-end="url(#arrow)"/>
    <line x1="355" y1="150" x2="355" y2="157" marker-end="url(#arrow)"/>
    <line x1="440" y1="182" x2="457" y2="182" marker-end="url(#arrow)"/>
    <line x1="440" y1="240" x2="457" y2="240" marker-end="url(#arrow)"/>
    <line x1="630" y1="124" x2="687" y2="124" marker-end="url(#arrow)"/>
    <line x1="705" y1="180" x2="705" y2="440"/>
    <line x1="705" y1="232" x2="722" y2="232" marker-end="url(#arrow)"/>
    <line x1="705" y1="284" x2="722" y2="284" marker-end="url(#arrow)"/>
    <line x1="705" y1="336" x2="722" y2="336" marker-end="url(#arrow)"/>
    <line x1="705" y1="388" x2="722" y2="388" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="705" y1="440" x2="722" y2="440" marker-end="url(#arrow)"/>
  </g>
  <text x="659" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">JSON</text>

  <text x="480" y="512" text-anchor="middle" font-size="13" fill="#334155">Falco는 막지 않고 알린다 — 차단은 seccomp·AppArmor(Day 68), 격리는 NetworkPolicy(Day 70)</text>
</svg>
