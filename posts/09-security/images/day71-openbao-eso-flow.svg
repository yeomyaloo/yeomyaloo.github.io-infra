<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OpenBao Kubernetes 인증 + External Secrets — 저장할 "첫 번째 비밀"이 없다</text>

  <!-- secrets-demo namespace -->
  <rect x="20" y="60" width="300" height="420" rx="12" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="170" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ns: secrets-demo</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="104" width="260" height="52" rx="8" fill="#ffffff" stroke="#326ce5"/>
    <text x="170" y="126" font-weight="700" fill="#1e3a8a">ServiceAccount eso-openbao</text>
    <text x="170" y="146" fill="#64748b" font-size="12">ESO가 TokenRequest로 JWT 발급</text>
    <rect x="40" y="176" width="260" height="52" rx="8" fill="#c7d2fe"/>
    <text x="170" y="198" font-weight="700" fill="#312e81">SecretStore openbao</text>
    <text x="170" y="218" fill="#312e81" font-size="12">vault provider · auth.kubernetes</text>
    <rect x="40" y="248" width="260" height="52" rx="8" fill="#c7d2fe"/>
    <text x="170" y="270" font-weight="700" fill="#312e81">ExternalSecret demo-db</text>
    <text x="170" y="290" fill="#312e81" font-size="12">key demo/db · refresh 1m</text>
    <rect x="40" y="330" width="260" height="52" rx="8" fill="#86efac"/>
    <text x="170" y="352" font-weight="700" fill="#14532d">Secret demo-db</text>
    <text x="170" y="372" fill="#14532d" font-size="12">DB_USER · DB_PASSWORD</text>
    <rect x="40" y="406" width="260" height="52" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="170" y="428" font-weight="700" fill="#14532d">앱 Pod</text>
    <text x="170" y="448" fill="#14532d" font-size="12">일반 Secret처럼 사용 (Day 13)</text>
  </g>

  <!-- ESO controller -->
  <rect x="360" y="176" width="200" height="140" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">ESO 컨트롤러</text>
  <text x="460" y="226" text-anchor="middle" font-size="12" fill="#78350f">ns: external-secrets</text>
  <text x="460" y="252" text-anchor="middle" font-size="12" fill="#78350f">① SA 토큰으로 login</text>
  <text x="460" y="274" text-anchor="middle" font-size="12" fill="#78350f">③ 정책 범위 값만 읽기</text>
  <text x="460" y="296" text-anchor="middle" font-size="12" fill="#78350f">④ Secret 생성·갱신</text>

  <!-- API server -->
  <rect x="360" y="60" width="200" height="88" rx="10" fill="#326ce5"/>
  <text x="460" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">kube-apiserver</text>
  <text x="460" y="110" text-anchor="middle" font-size="12" fill="#ffffff">② TokenReview</text>
  <text x="460" y="130" text-anchor="middle" font-size="12" fill="#ffffff">진짜 토큰? 어떤 SA?</text>

  <!-- OpenBao -->
  <rect x="600" y="60" width="340" height="300" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="770" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">OpenBao (ns: openbao)</text>
  <g font-size="13">
    <rect x="620" y="102" width="300" height="60" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="634" y="126" font-weight="700" fill="#7f1d1d">auth/kubernetes · role demo</text>
    <text x="634" y="148" fill="#7f1d1d" font-size="12">SA: app, eso-openbao / ns: secrets-demo</text>
    <rect x="620" y="174" width="300" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="634" y="196" font-weight="700" fill="#7f1d1d">정책 demo-read</text>
    <text x="634" y="213" fill="#7f1d1d" font-size="12" font-family="Consolas,'D2Coding',monospace">secret/data/demo/* : read</text>
    <rect x="620" y="232" width="145" height="110" rx="8" fill="#fca5a5"/>
    <text x="692" y="258" text-anchor="middle" font-weight="700" fill="#7f1d1d">KV v2</text>
    <text x="692" y="280" text-anchor="middle" fill="#7f1d1d" font-size="12">secret/demo/db</text>
    <text x="692" y="302" text-anchor="middle" fill="#7f1d1d" font-size="12">정적 값</text>
    <rect x="775" y="232" width="145" height="110" rx="8" fill="#fca5a5"/>
    <text x="847" y="258" text-anchor="middle" font-weight="700" fill="#7f1d1d">database</text>
    <text x="847" y="280" text-anchor="middle" fill="#7f1d1d" font-size="12">creds/readonly</text>
    <text x="847" y="302" text-anchor="middle" fill="#7f1d1d" font-size="12">요청마다 새 계정</text>
    <text x="847" y="322" text-anchor="middle" fill="#7f1d1d" font-size="12">TTL 1h 후 삭제</text>
  </g>

  <!-- PostgreSQL -->
  <rect x="600" y="400" width="340" height="80" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="770" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">PostgreSQL (secrets-demo)</text>
  <text x="770" y="454" text-anchor="middle" font-size="12" fill="#334155">CREATE ROLE v-root-readonly-… / 리스 폐기 시 삭제</text>

  <!-- note -->
  <rect x="360" y="400" width="200" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="460" y="428" text-anchor="middle" font-size="12" fill="#78350f">dev 모드: 메모리 저장</text>
  <text x="460" y="448" text-anchor="middle" font-size="12" fill="#78350f">root 토큰 · TLS 없음</text>
  <text x="460" y="468" text-anchor="middle" font-size="12" fill="#78350f">학습 전용</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="300" y1="210" x2="356" y2="222" marker-end="url(#arrow)"/>
    <line x1="560" y1="196" x2="616" y2="150" marker-end="url(#arrow)"/>
    <line x1="620" y1="114" x2="564" y2="104" marker-end="url(#arrow)"/>
    <line x1="700" y1="162" x2="700" y2="170" marker-end="url(#arrow)"/>
    <line x1="616" y1="300" x2="564" y2="290" marker-end="url(#arrow)"/>
    <line x1="360" y1="300" x2="304" y2="350" marker-end="url(#arrow)"/>
    <line x1="170" y1="382" x2="170" y2="402" marker-end="url(#arrow)"/>
    <line x1="847" y1="342" x2="847" y2="396" marker-end="url(#arrow)"/>
  </g>
</svg>
