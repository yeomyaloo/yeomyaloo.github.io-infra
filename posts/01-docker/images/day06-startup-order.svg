<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">depends_on 조건에 따른 기동 순서</text>

  <!-- ===== Panel 1: service_started ===== -->
  <rect x="20" y="55" width="920" height="175" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="40" y="82" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#7f1d1d">depends_on: [db]   # condition: service_started (기본값)</text>

  <g font-size="15" font-weight="700" fill="#334155">
    <text x="40" y="130">db</text>
    <text x="40" y="190">web</text>
  </g>

  <rect x="170" y="108" width="300" height="32" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="320" y="129" text-anchor="middle" font-size="13" fill="#78350f">초기화 중 (health: starting)</text>
  <rect x="470" y="108" width="450" height="32" rx="6" fill="#86efac" stroke="#16a34a"/>
  <text x="695" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">healthy — 접속 가능</text>

  <rect x="190" y="168" width="280" height="32" rx="6" fill="#fca5a5" stroke="#dc2626"/>
  <text x="330" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">DB 접속 → connection refused ✕</text>
  <text x="490" y="189" font-size="13" fill="#7f1d1d">앱 종료 → restart 정책에 따라 재시작 반복</text>

  <!-- ===== Panel 2: service_healthy ===== -->
  <rect x="20" y="250" width="920" height="175" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="40" y="277" font-family="Consolas,'D2Coding',monospace" font-size="15" font-weight="700" fill="#14532d">depends_on: { db: { condition: service_healthy } }</text>

  <g font-size="15" font-weight="700" fill="#334155">
    <text x="40" y="325">db</text>
    <text x="40" y="385">web</text>
  </g>

  <rect x="170" y="303" width="300" height="32" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="320" y="324" text-anchor="middle" font-size="13" fill="#78350f">초기화 중 (health: starting)</text>
  <rect x="470" y="303" width="450" height="32" rx="6" fill="#86efac" stroke="#16a34a"/>
  <text x="695" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">healthy — 접속 가능</text>

  <rect x="190" y="363" width="275" height="32" rx="6" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="327" y="384" text-anchor="middle" font-size="13" fill="#64748b">Compose가 web 생성을 대기</text>
  <rect x="480" y="363" width="440" height="32" rx="6" fill="#2496ed"/>
  <text x="700" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">web 시작 → DB 접속 성공 ✓</text>

  <!-- healthy line -->
  <line x1="470" y1="95" x2="470" y2="215" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="470" y1="290" x2="470" y2="440" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">db healthcheck 통과 (pg_isready 성공)</text>

  <!-- time axis -->
  <line x1="170" y1="480" x2="925" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="485" text-anchor="end" font-size="13" fill="#334155">시간</text>
</svg>
