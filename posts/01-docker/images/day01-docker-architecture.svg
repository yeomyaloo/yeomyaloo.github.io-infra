<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Docker 아키텍처</text>

  <!-- Client -->
  <rect x="20" y="70" width="200" height="290" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Client</text>
  <text x="120" y="124" text-anchor="middle" font-size="13" fill="#64748b">(docker CLI)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="15" text-anchor="middle">
    <rect x="45" y="150" width="150" height="40" rx="20" fill="#e2e8f0"/>
    <text x="120" y="175" fill="#0f172a">docker build</text>
    <rect x="45" y="210" width="150" height="40" rx="20" fill="#e2e8f0"/>
    <text x="120" y="235" fill="#0f172a">docker pull</text>
    <rect x="45" y="270" width="150" height="40" rx="20" fill="#e2e8f0"/>
    <text x="120" y="295" fill="#0f172a">docker run</text>
  </g>

  <!-- Docker Host -->
  <rect x="270" y="60" width="420" height="340" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Docker Host</text>

  <rect x="290" y="105" width="380" height="50" rx="8" fill="#2496ed"/>
  <text x="480" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">dockerd (Docker Daemon)</text>

  <rect x="290" y="180" width="180" height="45" rx="8" fill="#60a5fa"/>
  <text x="380" y="208" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">containerd</text>

  <rect x="290" y="250" width="180" height="45" rx="8" fill="#93c5fd"/>
  <text x="380" y="278" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">runc</text>

  <rect x="290" y="320" width="180" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="380" y="338" text-anchor="middle" font-size="13" fill="#14532d">Containers</text>
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="346" width="50" height="28" rx="4" fill="#86efac"/><text x="325" y="365" fill="#14532d">web</text>
    <rect x="355" y="346" width="50" height="28" rx="4" fill="#86efac"/><text x="380" y="365" fill="#14532d">db</text>
    <rect x="410" y="346" width="50" height="28" rx="4" fill="#86efac"/><text x="435" y="365" fill="#14532d">cache</text>
  </g>

  <rect x="490" y="180" width="180" height="202" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="580" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Images (로컬)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="510" y="220" width="140" height="34" rx="6" fill="#fde68a"/><text x="580" y="242" fill="#78350f">nginx:latest</text>
    <rect x="510" y="264" width="140" height="34" rx="6" fill="#fde68a"/><text x="580" y="286" fill="#78350f">ubuntu:24.04</text>
    <rect x="510" y="308" width="140" height="34" rx="6" fill="#fde68a"/><text x="580" y="330" fill="#78350f">redis:7</text>
  </g>

  <!-- Registry -->
  <rect x="740" y="70" width="200" height="290" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="840" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Registry</text>
  <text x="840" y="124" text-anchor="middle" font-size="13" fill="#64748b">(Docker Hub 등)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="770" y="145" width="140" height="34" rx="6" fill="#fed7aa"/><text x="840" y="167" fill="#7c2d12">nginx</text>
    <rect x="770" y="189" width="140" height="34" rx="6" fill="#fed7aa"/><text x="840" y="211" fill="#7c2d12">ubuntu</text>
    <rect x="770" y="233" width="140" height="34" rx="6" fill="#fed7aa"/><text x="840" y="255" fill="#7c2d12">redis</text>
    <rect x="770" y="277" width="140" height="34" rx="6" fill="#fed7aa"/><text x="840" y="299" fill="#7c2d12">postgres</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="215" x2="286" y2="140" marker-end="url(#arrow)"/>
    <line x1="380" y1="155" x2="380" y2="177" marker-end="url(#arrow)"/>
    <line x1="380" y1="225" x2="380" y2="247" marker-end="url(#arrow)"/>
    <line x1="380" y1="295" x2="380" y2="317" marker-end="url(#arrow)"/>
    <line x1="740" y1="235" x2="674" y2="235" marker-end="url(#arrow)"/>
    <line x1="674" y1="290" x2="740" y2="290" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#334155">
    <text x="230" y="168" font-weight="700">REST API</text>
    <text x="707" y="226" text-anchor="middle" font-weight="700">pull</text>
    <text x="707" y="310" text-anchor="middle" font-weight="700">push</text>
  </g>
</svg>
