<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#0f172a">컨테이너 라이프사이클</text>

  <!-- States -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="20" y="148" width="120" height="44" rx="22" fill="#fde68a" stroke="#d97706"/>
    <text x="80" y="176" fill="#78350f">Image</text>
    <rect x="230" y="148" width="120" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="290" y="176" fill="#0f172a">Created</text>
    <rect x="450" y="148" width="120" height="44" rx="8" fill="#86efac" stroke="#16a34a"/>
    <text x="510" y="176" fill="#14532d">Running</text>
    <rect x="670" y="148" width="120" height="44" rx="8" fill="#fca5a5" stroke="#dc2626"/>
    <text x="730" y="176" fill="#7f1d1d">Stopped</text>
    <rect x="860" y="148" width="120" height="44" rx="8" fill="#cbd5e1" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="920" y="176" fill="#334155">Deleted</text>
    <rect x="450" y="278" width="120" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="510" y="306" fill="#312e81">Paused</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="140" y1="170" x2="226" y2="170" marker-end="url(#arrow)"/>
    <line x1="350" y1="170" x2="446" y2="170" marker-end="url(#arrow)"/>
    <line x1="570" y1="170" x2="666" y2="170" marker-end="url(#arrow)"/>
    <line x1="790" y1="170" x2="856" y2="170" marker-end="url(#arrow)"/>
    <!-- pause / unpause -->
    <line x1="490" y1="192" x2="490" y2="274" marker-end="url(#arrow)"/>
    <line x1="530" y1="278" x2="530" y2="196" marker-end="url(#arrow)"/>
    <!-- Stopped -> Running (restart) -->
    <path d="M730,148 Q620,70 534,145" marker-end="url(#arrow)" stroke="#16a34a"/>
    <!-- Image -> Running (run) -->
    <path d="M80,148 Q285,20 486,145" marker-end="url(#arrow)" stroke="#2496ed" stroke-dasharray="7 5"/>
  </g>

  <!-- Labels -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" text-anchor="middle" fill="#0f172a">
    <text x="185" y="136">create</text>
    <text x="400" y="136">start</text>
    <text x="620" y="136">stop / kill</text>
    <text x="825" y="136">rm</text>
    <text x="482" y="240" text-anchor="end">pause</text>
    <text x="538" y="240" text-anchor="start">unpause</text>
    <text x="630" y="88" fill="#15803d">start / restart</text>
    <text x="285" y="70" fill="#1d4ed8">docker run = create + start</text>
  </g>

  <text x="20" y="352" font-size="13" fill="#64748b">※ docker rm -f 는 Running 상태의 컨테이너도 강제로 중지 후 삭제합니다.</text>
  <text x="20" y="372" font-size="13" fill="#64748b">※ 메인 프로세스(PID 1)가 끝나면 컨테이너는 자동으로 Stopped(Exited) 상태가 됩니다.</text>
</svg>
