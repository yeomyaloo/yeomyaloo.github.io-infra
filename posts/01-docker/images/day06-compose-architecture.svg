<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">compose.yaml 하나 → 프로젝트 전체 생성</text>

  <!-- compose.yaml -->
  <rect x="20" y="70" width="180" height="300" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <rect x="20" y="70" width="180" height="36" rx="10" fill="#334155"/>
  <text x="110" y="94" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#ffffff">compose.yaml</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">
    <text x="36" y="134">services:</text>
    <text x="52" y="158" fill="#2496ed">web:</text>
    <text x="68" y="178" fill="#64748b">build: ./web</text>
    <text x="52" y="202" fill="#2496ed">db:</text>
    <text x="68" y="222" fill="#64748b">postgres:17</text>
    <text x="52" y="246" fill="#2496ed">cache:</text>
    <text x="68" y="266" fill="#64748b">redis:7-alpine</text>
    <text x="36" y="298">volumes:</text>
    <text x="52" y="322" fill="#b45309">db-data:</text>
  </g>

  <!-- up arrow -->
  <line x1="204" y1="220" x2="296" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">
    <text x="250" y="196">docker</text>
    <text x="250" y="210">compose up</text>
  </g>

  <!-- Project -->
  <rect x="300" y="60" width="640" height="400" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="320" y="86" font-size="16" font-weight="700" fill="#0f172a">프로젝트: compose-lab</text>

  <!-- Network -->
  <rect x="320" y="100" width="600" height="220" rx="10" fill="#eff6ff" stroke="#2496ed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="335" y="122" font-size="13" font-weight="700" fill="#1e3a8a">network: compose-lab_default (사용자 정의 bridge, 자동 생성)</text>

  <!-- web -->
  <rect x="345" y="150" width="185" height="120" rx="8" fill="#2496ed"/>
  <text x="437" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">web</text>
  <text x="437" y="203" text-anchor="middle" font-size="12" fill="#ffffff">Flask + gunicorn</text>
  <text x="437" y="226" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#dbeafe">compose-lab-web-1</text>
  <text x="437" y="252" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#ffffff">:5000</text>

  <!-- cache -->
  <rect x="660" y="135" width="240" height="75" rx="8" fill="#fca5a5" stroke="#dc2626"/>
  <text x="780" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">cache (Redis)</text>
  <text x="780" y="185" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#7f1d1d">compose-lab-cache-1</text>
  <text x="780" y="201" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#7f1d1d">:6379 (호스트 미공개)</text>

  <!-- db -->
  <rect x="660" y="228" width="240" height="75" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="780" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">db (PostgreSQL)</text>
  <text x="780" y="278" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#312e81">compose-lab-db-1</text>
  <text x="780" y="294" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#312e81">:5432 (호스트 미공개)</text>

  <!-- volume -->
  <rect x="660" y="360" width="240" height="70" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="780" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">named volume</text>
  <text x="780" y="412" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">compose-lab_db-data</text>

  <!-- browser -->
  <rect x="20" y="395" width="180" height="55" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="110" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">브라우저 / curl</text>
  <text x="110" y="438" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#7c2d12">localhost:8000</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="530" y1="185" x2="656" y2="172" marker-end="url(#arrow)"/>
    <line x1="530" y1="240" x2="656" y2="262" marker-end="url(#arrow)"/>
    <line x1="780" y1="303" x2="780" y2="356" stroke="#b45309" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <line x1="200" y1="420" x2="430" y2="274" stroke="#16a34a" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="593" y="168">cache:6379</text>
    <text x="593" y="272">db:5432</text>
    <text x="772" y="340" fill="#b45309" text-anchor="end">/var/lib/postgresql/data</text>
  </g>
  <text x="335" y="372" font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">8000:5000</text>
</svg>
