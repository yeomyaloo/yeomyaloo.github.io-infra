<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OverlayFS(overlay2)와 Copy-on-Write</text>

  <!-- Column headers -->
  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="330" y="68">① 읽기</text>
    <text x="490" y="68">② 수정</text>
    <text x="650" y="68">③ 삭제</text>
    <text x="810" y="68">④ 생성</text>
  </g>

  <!-- Row backgrounds -->
  <rect x="250" y="80" width="650" height="70" rx="8" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
  <rect x="250" y="190" width="650" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="250" y="300" width="650" height="60" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <rect x="250" y="370" width="650" height="60" rx="8" fill="#fff7ed" stroke="#f59e0b"/>

  <!-- Row labels -->
  <g font-size="12" fill="#64748b">
    <text x="30" y="110" font-size="16" font-weight="700" fill="#1e3a8a" font-family="Consolas,'D2Coding',monospace">merged</text>
    <text x="30" y="132">컨테이너가 실제로 보는 /</text>
    <text x="30" y="220" font-size="16" font-weight="700" fill="#14532d" font-family="Consolas,'D2Coding',monospace">upperdir</text>
    <text x="30" y="242">컨테이너 레이어 (R/W)</text>
    <text x="30" y="326" font-size="16" font-weight="700" fill="#92400e" font-family="Consolas,'D2Coding',monospace">lowerdir 2</text>
    <text x="30" y="346">이미지 Layer 2 (읽기 전용)</text>
    <text x="30" y="396" font-size="16" font-weight="700" fill="#92400e" font-family="Consolas,'D2Coding',monospace">lowerdir 1</text>
    <text x="30" y="416">이미지 Layer 1 (읽기 전용)</text>
  </g>

  <!-- Files -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle">
    <!-- merged -->
    <rect x="260" y="98" width="140" height="34" rx="6" fill="#bfdbfe"/>
    <text x="330" y="120" fill="#1e3a8a">a.txt</text>
    <rect x="420" y="98" width="140" height="34" rx="6" fill="#bfdbfe"/>
    <text x="490" y="120" fill="#1e3a8a">b.conf (수정본)</text>
    <rect x="580" y="98" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5,4"/>
    <text x="650" y="120" fill="#94a3b8">c.log (안 보임)</text>
    <rect x="740" y="98" width="140" height="34" rx="6" fill="#bfdbfe"/>
    <text x="810" y="120" fill="#1e3a8a">new.txt</text>

    <!-- upperdir -->
    <rect x="420" y="208" width="140" height="34" rx="6" fill="#86efac"/>
    <text x="490" y="230" fill="#14532d">b.conf (복사본)</text>
    <rect x="580" y="208" width="140" height="34" rx="6" fill="#fca5a5"/>
    <text x="650" y="230" fill="#7f1d1d" font-size="12">c.log (whiteout)</text>
    <rect x="740" y="208" width="140" height="34" rx="6" fill="#86efac"/>
    <text x="810" y="230" fill="#14532d">new.txt</text>

    <!-- lowerdir 2 -->
    <rect x="420" y="313" width="140" height="34" rx="6" fill="#fde68a"/>
    <text x="490" y="335" fill="#78350f">b.conf (원본)</text>
    <rect x="580" y="313" width="140" height="34" rx="6" fill="#fde68a"/>
    <text x="650" y="335" fill="#78350f">c.log</text>

    <!-- lowerdir 1 -->
    <rect x="260" y="383" width="140" height="34" rx="6" fill="#fde68a"/>
    <text x="330" y="405" fill="#78350f">a.txt</text>
  </g>

  <!-- Arrows -->
  <line x1="330" y1="381" x2="330" y2="136" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <line x1="490" y1="311" x2="490" y2="246" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="206" x2="490" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="206" x2="810" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="206" x2="650" y2="136" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Arrow labels -->
  <g font-size="12" font-weight="700">
    <text x="338" y="176" fill="#64748b">위에 없으면 아래에서 읽음</text>
    <text x="498" y="284" fill="#16a34a">copy-up</text>
    <text x="658" y="176" fill="#dc2626">가림</text>
    <text x="658" y="284" fill="#dc2626">원본은 그대로</text>
  </g>

  <!-- Bottom caption -->
  <g font-size="14" fill="#334155" text-anchor="middle">
    <text x="480" y="468">수정: 아래 레이어 파일을 upperdir로 복사(copy-up)한 뒤 수정 → Copy-on-Write</text>
    <text x="480" y="494">삭제: upperdir에 whiteout 표시만 남김 → 이미지 레이어의 원본은 절대 바뀌지 않는다</text>
  </g>
</svg>
