<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">빈 Named Volume은 채워지고, Bind Mount는 가린다</text>

  <!-- Panels -->
  <rect x="30" y="56" width="435" height="336" rx="12" fill="#f8fafc" stroke="#2496ed" stroke-width="2"/>
  <text x="247" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">빈 Named Volume 마운트</text>
  <rect x="495" y="56" width="435" height="336" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="712" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">빈 디렉터리 Bind Mount</text>

  <!-- Row labels inside panels: view -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="247" y="108">컨테이너가 보는 /usr/share/nginx/html</text>
    <text x="712" y="108">컨테이너가 보는 /usr/share/nginx/html</text>
  </g>

  <!-- Left: view -->
  <rect x="77" y="116" width="340" height="46" rx="8" fill="#86efac"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#14532d" text-anchor="middle">
    <text x="247" y="144">index.html  50x.html</text>
  </g>
  <!-- Left: volume -->
  <rect x="77" y="204" width="340" height="46" rx="8" fill="#dbeafe" stroke="#2496ed"/>
  <text x="247" y="232" text-anchor="middle" font-size="14" fill="#1e3a8a">볼륨 nginx-html (복사된 파일 보관)</text>
  <!-- Left: image -->
  <rect x="77" y="294" width="340" height="46" rx="8" fill="#fde68a"/>
  <text x="247" y="322" text-anchor="middle" font-size="14" fill="#78350f">이미지 레이어: index.html, 50x.html</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="247" y1="292" x2="247" y2="254" marker-end="url(#arrow)"/>
    <line x1="247" y1="202" x2="247" y2="166" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1d4ed8">
    <text x="257" y="278">최초 1회 복사</text>
    <text x="257" y="188">마운트</text>
  </g>

  <!-- Right: view -->
  <rect x="542" y="116" width="340" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="712" y="144" text-anchor="middle" font-size="14" fill="#64748b">(비어 있음)</text>
  <!-- Right: bind dir -->
  <rect x="542" y="204" width="340" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="712" y="232" text-anchor="middle" font-size="14" fill="#78350f">호스트 ~/docker-lab/empty (빈 폴더)</text>
  <!-- Right: image (hidden) -->
  <rect x="542" y="294" width="340" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="712" y="322" text-anchor="middle" font-size="14" fill="#94a3b8">이미지 레이어: index.html, 50x.html</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="712" y1="202" x2="712" y2="166" marker-end="url(#arrow)"/>
  </g>
  <text x="722" y="188" font-size="12" font-weight="700" fill="#92400e">마운트 (덮어씀)</text>
  <text x="712" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">위에 덮여서 안 보임 (삭제된 것은 아님)</text>

  <text x="247" y="372" text-anchor="middle" font-size="13" fill="#334155">이미 데이터가 있는 볼륨이면 복사하지 않음</text>
  <text x="712" y="372" text-anchor="middle" font-size="13" fill="#334155">호스트 폴더 내용이 그대로 보임</text>

  <text x="480" y="422" text-anchor="middle" font-size="14" fill="#334155">nginx 설정 디렉터리 등에 빈 폴더를 bind mount 하면 원래 파일이 사라진 것처럼 보이니 주의</text>
</svg>
