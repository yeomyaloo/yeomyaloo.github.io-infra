<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- ===== 좌측: VM ===== -->
  <rect x="20" y="20" width="420" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="230" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">가상 머신 (VM)</text>

  <!-- App -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="175" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="100" y="200" fill="#14532d">App A</text>
    <rect x="170" y="175" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="230" y="200" fill="#14532d">App B</text>
    <rect x="300" y="175" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="360" y="200" fill="#14532d">App C</text>

    <!-- Bins/Libs -->
    <rect x="40" y="220" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="100" y="245" fill="#312e81">Bins / Libs</text>
    <rect x="170" y="220" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="230" y="245" fill="#312e81">Bins / Libs</text>
    <rect x="300" y="220" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="360" y="245" fill="#312e81">Bins / Libs</text>

    <!-- Guest OS -->
    <rect x="40" y="265" width="120" height="40" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <text x="100" y="290" fill="#7f1d1d" font-weight="700">Guest OS</text>
    <rect x="170" y="265" width="120" height="40" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <text x="230" y="290" fill="#7f1d1d" font-weight="700">Guest OS</text>
    <rect x="300" y="265" width="120" height="40" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <text x="360" y="290" fill="#7f1d1d" font-weight="700">Guest OS</text>

    <!-- Hypervisor / Host OS / HW -->
    <rect x="40" y="310" width="380" height="40" rx="6" fill="#f59e0b"/>
    <text x="230" y="335" fill="#ffffff" font-weight="700">Hypervisor (KVM, VMware, Hyper-V)</text>
    <rect x="40" y="355" width="380" height="40" rx="6" fill="#64748b"/>
    <text x="230" y="380" fill="#ffffff">Host OS</text>
    <rect x="40" y="400" width="380" height="40" rx="6" fill="#334155"/>
    <text x="230" y="425" fill="#ffffff">하드웨어 (CPU · Memory · Disk · NIC)</text>
  </g>

  <!-- ===== 우측: Container ===== -->
  <rect x="460" y="20" width="420" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">컨테이너 (Container)</text>

  <g font-size="15" text-anchor="middle">
    <!-- App -->
    <rect x="480" y="220" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="540" y="245" fill="#14532d">App A</text>
    <rect x="610" y="220" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="670" y="245" fill="#14532d">App B</text>
    <rect x="740" y="220" width="120" height="40" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="800" y="245" fill="#14532d">App C</text>

    <!-- Bins/Libs -->
    <rect x="480" y="265" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="540" y="290" fill="#312e81">Bins / Libs</text>
    <rect x="610" y="265" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="670" y="290" fill="#312e81">Bins / Libs</text>
    <rect x="740" y="265" width="120" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="800" y="290" fill="#312e81">Bins / Libs</text>

    <!-- Engine / Host OS / HW -->
    <rect x="480" y="310" width="380" height="40" rx="6" fill="#2496ed"/>
    <text x="670" y="335" fill="#ffffff" font-weight="700">Container Runtime (Docker Engine)</text>
    <rect x="480" y="355" width="380" height="40" rx="6" fill="#64748b"/>
    <text x="670" y="380" fill="#ffffff">Host OS (커널을 모든 컨테이너가 공유)</text>
    <rect x="480" y="400" width="380" height="40" rx="6" fill="#334155"/>
    <text x="670" y="425" fill="#ffffff">하드웨어 (CPU · Memory · Disk · NIC)</text>
  </g>

  <!-- 강조 표시: Guest OS 없음 -->
  <text x="670" y="150" text-anchor="middle" font-size="14" fill="#64748b">Guest OS 계층이 없다!</text>
  <text x="670" y="172" text-anchor="middle" font-size="14" fill="#64748b">→ 이미지 크기 MB 단위</text>

  <!-- 캡션 -->
  <g font-size="15" text-anchor="middle">
    <text x="230" y="490" fill="#b91c1c">VM마다 OS 전체 포함 → 무겁고(GB) 부팅이 느림(분 단위)</text>
    <text x="670" y="490" fill="#1d4ed8">호스트 커널 공유 → 가볍고(MB) 시작이 빠름(초 단위)</text>
  </g>
</svg>
