<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">장애 대응 생애주기와 시간 지표</text>

  <!-- Phase boxes -->
  <g text-anchor="middle">
    <rect x="25" y="62" width="140" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="95" y="88" font-size="14" font-weight="700" fill="#991b1b">① 장애 발생</text>
    <text x="95" y="112" font-size="12" fill="#991b1b">사용자 영향 시작</text>
    <text x="95" y="132" font-size="12" fill="#991b1b">(아직 아무도 모름)</text>

    <rect x="179" y="62" width="140" height="92" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="249" y="88" font-size="14" font-weight="700" fill="#78350f">② 탐지</text>
    <text x="249" y="112" font-size="12" fill="#78350f">번 레이트 알림</text>
    <text x="249" y="132" font-size="12" fill="#78350f">또는 고객 제보</text>

    <rect x="333" y="62" width="140" height="92" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
    <text x="403" y="88" font-size="14" font-weight="700" fill="#312e81">③ 분류 · 선언</text>
    <text x="403" y="112" font-size="12" fill="#312e81">심각도(SEV) 결정</text>
    <text x="403" y="132" font-size="12" fill="#312e81">IC 지정, 채널 개설</text>

    <rect x="487" y="62" width="140" height="92" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="557" y="88" font-size="14" font-weight="700" fill="#134e4a">④ 완화</text>
    <text x="557" y="112" font-size="12" fill="#134e4a">롤백 · 우회 · 증설</text>
    <text x="557" y="132" font-size="12" fill="#134e4a">→ 영향 멈춤</text>

    <rect x="641" y="62" width="140" height="92" rx="10" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <text x="711" y="88" font-size="14" font-weight="700" fill="#14532d">⑤ 복구</text>
    <text x="711" y="112" font-size="12" fill="#14532d">원래 구성으로 정상화</text>
    <text x="711" y="132" font-size="12" fill="#14532d">장애 종료 선언</text>

    <rect x="795" y="62" width="140" height="92" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="865" y="88" font-size="14" font-weight="700" fill="#0f172a">⑥ 회고</text>
    <text x="865" y="112" font-size="12" fill="#334155">비난 없는 포스트모템</text>
    <text x="865" y="132" font-size="12" fill="#334155">액션 아이템 추적</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="165" y1="108" x2="176" y2="108" marker-end="url(#arrow)"/>
    <line x1="319" y1="108" x2="330" y2="108" marker-end="url(#arrow)"/>
    <line x1="473" y1="108" x2="484" y2="108" marker-end="url(#arrow)"/>
    <line x1="627" y1="108" x2="638" y2="108" marker-end="url(#arrow)"/>
    <line x1="781" y1="108" x2="792" y2="108" marker-end="url(#arrow)"/>
  </g>

  <!-- Timeline -->
  <line x1="25" y1="200" x2="935" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#334155">
    <circle cx="95" cy="200" r="6"/>
    <circle cx="249" cy="200" r="6"/>
    <circle cx="403" cy="200" r="6"/>
    <circle cx="557" cy="200" r="6"/>
    <circle cx="711" cy="200" r="6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#334155" font-family="Consolas,'D2Coding',monospace" font-weight="700">
    <text x="95" y="186">t0</text>
    <text x="249" y="186">t1</text>
    <text x="403" y="186">t2</text>
    <text x="557" y="186">t3</text>
    <text x="711" y="186">t4</text>
  </g>
  <text x="920" y="224" text-anchor="end" font-size="12" fill="#64748b">시간</text>

  <!-- Spans -->
  <g stroke-width="3" fill="none">
    <line x1="95" y1="250" x2="249" y2="250" stroke="#f59e0b"/>
    <line x1="249" y1="290" x2="403" y2="290" stroke="#4f46e5"/>
    <line x1="95" y1="330" x2="557" y2="330" stroke="#0d9488"/>
    <line x1="95" y1="370" x2="711" y2="370" stroke="#16a34a"/>
  </g>
  <g stroke-width="2">
    <line x1="95" y1="242" x2="95" y2="258" stroke="#f59e0b"/><line x1="249" y1="242" x2="249" y2="258" stroke="#f59e0b"/>
    <line x1="249" y1="282" x2="249" y2="298" stroke="#4f46e5"/><line x1="403" y1="282" x2="403" y2="298" stroke="#4f46e5"/>
    <line x1="95" y1="322" x2="95" y2="338" stroke="#0d9488"/><line x1="557" y1="322" x2="557" y2="338" stroke="#0d9488"/>
    <line x1="95" y1="362" x2="95" y2="378" stroke="#16a34a"/><line x1="711" y1="362" x2="711" y2="378" stroke="#16a34a"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="262" y="255" fill="#92400e">MTTD 탐지까지 (t1 − t0)</text>
    <text x="416" y="295" fill="#312e81">MTTA 확인까지 (t2 − t1)</text>
    <text x="570" y="335" fill="#134e4a">사용자 영향 시간 (t3 − t0)</text>
    <text x="724" y="375" fill="#14532d">MTTR (t4 − t0)</text>
  </g>
  <text x="480" y="412" text-anchor="middle" font-size="12" fill="#64748b">MTTR의 R(Repair/Recover/Resolve)과 시작점은 조직마다 다르다 → 팀 문서에 정의를 먼저 적어 둔다</text>
</svg>
