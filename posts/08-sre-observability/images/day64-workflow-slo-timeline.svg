<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Workflow 실험과 SLO 지표 (예시)</text>

  <!-- Workflow row -->
  <text x="20" y="96" font-size="12" font-weight="700" fill="#334155">Workflow</text>
  <text x="20" y="114" font-size="12" fill="#64748b">(Serial)</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <rect x="180" y="76" width="90" height="48" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <text x="225" y="98" font-family="Consolas,'D2Coding',monospace" fill="#7f1d1d">pod-kill</text>
    <text x="225" y="115" font-weight="400" fill="#7f1d1d">60s</text>
    <rect x="270" y="76" width="90" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="315" y="98" fill="#334155">Suspend</text>
    <text x="315" y="115" font-weight="400" fill="#334155">60s 회복</text>
    <rect x="360" y="76" width="180" height="48" rx="6" fill="#fde68a" stroke="#f59e0b"/>
    <text x="450" y="98" font-family="Consolas,'D2Coding',monospace" fill="#78350f">NetworkChaos delay</text>
    <text x="450" y="115" font-weight="400" fill="#78350f">+200ms, 120s</text>
    <rect x="540" y="76" width="90" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="585" y="98" fill="#334155">Suspend</text>
    <text x="585" y="115" font-weight="400" fill="#334155">60s 회복</text>
    <rect x="630" y="76" width="180" height="48" rx="6" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="720" y="98" font-family="Consolas,'D2Coding',monospace" fill="#312e81">StressChaos cpu</text>
    <text x="720" y="115" font-weight="400" fill="#312e81">2 workers, 120s</text>
  </g>
  <line x1="90" y1="100" x2="176" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="133" y="92" text-anchor="middle" font-size="11" fill="#64748b">entry</text>

  <!-- Chart frame -->
  <text x="100" y="178" font-size="12" font-weight="700" fill="#334155">p99 지연</text>
  <rect x="180" y="160" width="90" height="240" fill="#fee2e2" opacity="0.6"/>
  <rect x="360" y="160" width="180" height="240" fill="#fef3c7" opacity="0.8"/>
  <rect x="630" y="160" width="180" height="240" fill="#e0e7ff" opacity="0.8"/>
  <g stroke="#cbd5e1" stroke-dasharray="3 3">
    <line x1="180" y1="124" x2="180" y2="400"/>
    <line x1="270" y1="124" x2="270" y2="400"/>
    <line x1="360" y1="124" x2="360" y2="400"/>
    <line x1="540" y1="124" x2="540" y2="400"/>
    <line x1="630" y1="124" x2="630" y2="400"/>
    <line x1="810" y1="124" x2="810" y2="400"/>
  </g>
  <line x1="90" y1="160" x2="90" y2="400" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="910" y2="400" stroke="#334155" stroke-width="1.5"/>
  <g font-size="11" fill="#64748b" text-anchor="end" font-family="Consolas,'D2Coding',monospace">
    <text x="84" y="404">0</text>
    <text x="84" y="294">300ms</text>
    <text x="84" y="184">600ms</text>
  </g>
  <line x1="90" y1="290" x2="910" y2="290" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="906" y="283" text-anchor="end" font-size="12" font-weight="700" fill="#dc2626">SLO 300ms</text>

  <polyline fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"
    points="90,371 180,371 200,350 230,345 270,365 300,371 360,371 385,300 400,279 520,279 545,300 570,365 600,371 630,371 660,330 700,319 800,319 830,360 860,371 910,371"/>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="225" y="318" fill="#991b1b">작은 튐</text>
    <text x="450" y="250" fill="#92400e">SLO 초과 → 가설 깨짐</text>
    <text x="720" y="272" fill="#312e81">SLO 이내 유지</text>
  </g>

  <!-- X axis -->
  <g font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="90" y="418">0m</text>
    <text x="180" y="418">1m</text>
    <text x="270" y="418">2m</text>
    <text x="360" y="418">3m</text>
    <text x="450" y="418">4m</text>
    <text x="540" y="418">5m</text>
    <text x="630" y="418">6m</text>
    <text x="720" y="418">7m</text>
    <text x="810" y="418">8m</text>
    <text x="900" y="418">9m</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <line x1="150" y1="448" x2="190" y2="448" stroke="#0d9488" stroke-width="3"/>
    <text x="198" y="452">p99 지연 (rate 창 때문에 조금 늦게 반응)</text>
    <line x1="520" y1="448" x2="560" y2="448" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 5"/>
    <text x="568" y="452">SLO 임계값</text>
    <rect x="680" y="440" width="16" height="16" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="704" y="452">장애 주입 구간</text>
  </g>
</svg>
