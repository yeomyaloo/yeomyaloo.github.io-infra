<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SLO 기반 Canary — 백그라운드 분석 + 인라인 분석</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">Rollout dev-demo-app (demo-dev) · canary Service dev-demo-app-canary</text>

  <!-- Steps -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="160" width="150" height="62" rx="10" fill="#ef7b4d"/>
    <text x="105" y="185" font-weight="700" fill="#ffffff">step 0</text>
    <text x="105" y="206" fill="#ffffff">setWeight: 20</text>

    <rect x="210" y="160" width="150" height="62" rx="10" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="285" y="185" font-weight="700" fill="#9a3412">step 1</text>
    <text x="285" y="206" fill="#9a3412">pause: 2m</text>

    <rect x="390" y="160" width="150" height="62" rx="10" fill="#ef7b4d"/>
    <text x="465" y="185" font-weight="700" fill="#ffffff">step 2</text>
    <text x="465" y="206" fill="#ffffff">setWeight: 50</text>

    <rect x="570" y="160" width="170" height="62" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
    <text x="655" y="185" font-weight="700" fill="#312e81">step 3 · analysis</text>
    <text x="655" y="206" fill="#312e81">인라인 (막고 기다림)</text>

    <rect x="770" y="160" width="160" height="62" rx="10" fill="#16a34a"/>
    <text x="850" y="185" font-weight="700" fill="#ffffff">step 4</text>
    <text x="850" y="206" fill="#ffffff">setWeight: 100</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="180" y1="191" x2="206" y2="191" marker-end="url(#arrow)"/>
    <line x1="360" y1="191" x2="386" y2="191" marker-end="url(#arrow)"/>
    <line x1="540" y1="191" x2="566" y2="191" marker-end="url(#arrow)"/>
    <line x1="740" y1="191" x2="766" y2="191" marker-end="url(#arrow)"/>
  </g>

  <!-- Background analysis bar -->
  <rect x="210" y="86" width="720" height="54" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="570" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">백그라운드: canary-success-rate (startingStep: 1, count 없음 → 끝까지)</text>
  <text x="570" y="128" text-anchor="middle" font-size="12" fill="#134e4a">30초마다 · 성공률 ≥ 0.99 · failureLimit 1 · consecutiveErrorLimit 2 · inconclusiveLimit 2</text>
  <g fill="#0d9488">
    <circle cx="230" cy="150" r="4"/><circle cx="270" cy="150" r="4"/><circle cx="310" cy="150" r="4"/>
    <circle cx="350" cy="150" r="4"/><circle cx="390" cy="150" r="4"/><circle cx="430" cy="150" r="4"/>
    <circle cx="470" cy="150" r="4"/><circle cx="510" cy="150" r="4"/><circle cx="550" cy="150" r="4"/>
    <circle cx="590" cy="150" r="4"/><circle cx="630" cy="150" r="4"/><circle cx="670" cy="150" r="4"/>
    <circle cx="710" cy="150" r="4"/><circle cx="750" cy="150" r="4"/><circle cx="790" cy="150" r="4"/>
    <circle cx="830" cy="150" r="4"/><circle cx="870" cy="150" r="4"/><circle cx="910" cy="150" r="4"/>
  </g>

  <!-- Inline analysis detail -->
  <rect x="540" y="240" width="230" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="655" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">canary-latency-p95</text>
  <text x="655" y="282" text-anchor="middle" font-size="12" fill="#312e81">30초 × count 4 (약 2분)</text>
  <text x="655" y="300" text-anchor="middle" font-size="12" fill="#312e81">p95 ≤ 0.3s · failureLimit 1</text>
  <line x1="655" y1="222" x2="655" y2="238" stroke="#4f46e5" stroke-width="2"/>

  <!-- Outcomes -->
  <text x="480" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">metric 판정에 따른 Rollout 동작</text>
  <g font-size="13">
    <rect x="30" y="362" width="210" height="96" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="135" y="388" text-anchor="middle" font-weight="700" fill="#14532d">Successful</text>
    <text x="135" y="412" text-anchor="middle" fill="#14532d">다음 step 진행</text>
    <text x="135" y="434" text-anchor="middle" font-size="12" fill="#14532d">100%면 새 버전이 stable</text>

    <rect x="255" y="362" width="210" height="96" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="360" y="388" text-anchor="middle" font-weight="700" fill="#7f1d1d">Failed</text>
    <text x="360" y="412" text-anchor="middle" fill="#7f1d1d">실패 누적 &gt; failureLimit</text>
    <text x="360" y="434" text-anchor="middle" font-size="12" fill="#7f1d1d">→ abort, stable 100%</text>

    <rect x="480" y="362" width="210" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="585" y="388" text-anchor="middle" font-weight="700" fill="#4c1d95">Error</text>
    <text x="585" y="412" text-anchor="middle" fill="#4c1d95">연속 오류 &gt; consecutiveErrorLimit</text>
    <text x="585" y="434" text-anchor="middle" font-size="12" fill="#4c1d95">→ abort (측정 불가)</text>

    <rect x="705" y="362" width="225" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="817" y="388" text-anchor="middle" font-weight="700" fill="#78350f">Inconclusive</text>
    <text x="817" y="412" text-anchor="middle" fill="#78350f">판정 불가 누적 &gt; inconclusiveLimit</text>
    <text x="817" y="434" text-anchor="middle" font-size="12" fill="#78350f">→ pause, 사람이 promote/abort</text>
  </g>
  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#334155">abort는 클러스터만 되돌린다 — Git의 이미지 태그를 <tspan font-weight="700">revert</tspan>해야 롤백 완료</text>
</svg>
