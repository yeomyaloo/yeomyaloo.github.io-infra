<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Head 샘플링 vs Tail 샘플링</text>

  <!-- ===== Head panel ===== -->
  <rect x="20" y="56" width="450" height="400" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="245" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Head — 트레이스 "시작할 때" 결정</text>

  <rect x="40" y="104" width="160" height="78" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="120" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">앱 SDK</text>
  <text x="120" y="149" text-anchor="middle" font-size="12" fill="#312e81">trace ID 해시로</text>
  <text x="120" y="168" text-anchor="middle" font-size="12" fill="#312e81">25%만 선택</text>

  <g font-size="12">
    <rect x="250" y="100" width="150" height="26" rx="5" fill="#86efac"/>
    <text x="262" y="118" fill="#14532d">A 정상 20ms</text>
    <text x="425" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">✔</text>
    <rect x="250" y="134" width="150" height="26" rx="5" fill="#e2e8f0"/>
    <text x="262" y="152" fill="#334155">B 정상 25ms</text>
    <text x="425" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">✖</text>
    <rect x="250" y="168" width="150" height="26" rx="5" fill="#fca5a5"/>
    <text x="262" y="186" fill="#7f1d1d">C 에러 500</text>
    <text x="425" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">✖</text>
    <rect x="250" y="202" width="150" height="26" rx="5" fill="#fde68a"/>
    <text x="262" y="220" fill="#78350f">D 느림 800ms</text>
    <text x="425" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">✖</text>
  </g>
  <line x1="200" y1="143" x2="244" y2="143" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="250" text-anchor="middle" font-size="12" fill="#64748b">결과(에러·지연)를 모른 채 동전 던지기</text>

  <rect x="40" y="272" width="410" height="62" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="245" y="297" text-anchor="middle" font-size="14" fill="#0f172a">Tempo에 남는 것: <tspan font-weight="700">A (정상) 1개</tspan></text>
  <text x="245" y="320" text-anchor="middle" font-size="13" fill="#dc2626">찾고 싶던 C(에러)와 D(느림)는 사라짐</text>

  <g font-size="13">
    <text x="45" y="370" fill="#16a34a" font-weight="700">장점</text>
    <text x="90" y="370" fill="#334155">비용이 거의 없음, 앱에서 바로 결정</text>
    <text x="45" y="396" fill="#dc2626" font-weight="700">단점</text>
    <text x="90" y="396" fill="#334155">드문 에러·느린 요청을 놓치기 쉬움</text>
    <text x="45" y="428" fill="#4f46e5" font-weight="700">설정</text>
    <text x="90" y="428" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">OTEL_TRACES_SAMPLER=parentbased_traceidratio</text>
  </g>

  <!-- ===== Tail panel ===== -->
  <rect x="490" y="56" width="450" height="400" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="715" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#134e4a">Tail — 트레이스가 "다 모인 뒤" 결정</text>

  <rect x="510" y="104" width="160" height="78" rx="10" fill="#0d9488"/>
  <text x="590" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Collector</text>
  <text x="590" y="149" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#ccfbf1">tail_sampling</text>
  <text x="590" y="168" text-anchor="middle" font-size="12" fill="#ccfbf1">decision_wait 동안 보관</text>

  <g font-size="12">
    <rect x="720" y="100" width="150" height="26" rx="5" fill="#86efac"/>
    <text x="732" y="118" fill="#14532d">A 정상 20ms</text>
    <text x="900" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">10%</text>
    <rect x="720" y="134" width="150" height="26" rx="5" fill="#e2e8f0"/>
    <text x="732" y="152" fill="#334155">B 정상 25ms</text>
    <text x="900" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">10%</text>
    <rect x="720" y="168" width="150" height="26" rx="5" fill="#fca5a5"/>
    <text x="732" y="186" fill="#7f1d1d">C 에러 500</text>
    <text x="900" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">✔</text>
    <rect x="720" y="202" width="150" height="26" rx="5" fill="#fde68a"/>
    <text x="732" y="220" fill="#78350f">D 느림 800ms</text>
    <text x="900" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">✔</text>
  </g>
  <line x1="670" y1="143" x2="714" y2="143" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="250" text-anchor="middle" font-size="12" fill="#0f766e">정책: ERROR 전부 · 500ms+ 전부 · 나머지 10%</text>

  <rect x="510" y="272" width="410" height="62" rx="10" fill="#ffffff" stroke="#0d9488"/>
  <text x="715" y="297" text-anchor="middle" font-size="14" fill="#0f172a">Tempo에 남는 것: <tspan font-weight="700">C, D 전부 + 정상의 10%</tspan></text>
  <text x="715" y="320" text-anchor="middle" font-size="13" fill="#0f766e">원인 분석에 필요한 트레이스는 놓치지 않음</text>

  <g font-size="13">
    <text x="515" y="370" fill="#16a34a" font-weight="700">장점</text>
    <text x="560" y="370" fill="#334155">결과를 보고 고름 (에러·지연·속성 기준)</text>
    <text x="515" y="396" fill="#dc2626" font-weight="700">단점</text>
    <text x="560" y="396" fill="#334155">메모리 사용, span이 같은 인스턴스로 모여야 함</text>
    <text x="515" y="428" fill="#4f46e5" font-weight="700">확장</text>
    <text x="560" y="428" fill="#334155">앞단 loadbalancing exporter → 뒷단 tail_sampling</text>
  </g>
</svg>
