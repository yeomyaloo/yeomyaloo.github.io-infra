<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">모니터링 vs 관측성, 그리고 신호 연결</text>

  <!-- ===== Monitoring ===== -->
  <rect x="20" y="56" width="450" height="200" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#0f172a">모니터링 — 알려진 문제</text>
  <text x="40" y="104" font-size="12" fill="#64748b">known unknowns: 질문을 미리 정해 둔다</text>

  <rect x="40" y="118" width="260" height="112" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="50" y1="150" x2="290" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="144" font-size="11" fill="#b91c1c">임계값 1%</text>
  <polyline points="52,214 80,210 108,212 136,206 164,208 192,196 214,170 236,140 258,132 286,136" fill="none" stroke="#2496ed" stroke-width="2.5"/>
  <text x="230" y="222" font-size="11" fill="#64748b">시간 →</text><text x="54" y="131" font-size="11" fill="#64748b">에러율</text>

  <rect x="316" y="132" width="136" height="84" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="384" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">알림 발생</text>
  <text x="384" y="182" text-anchor="middle" font-size="12" fill="#334155">"뭔가 이상하다"</text>
  <text x="384" y="202" text-anchor="middle" font-size="12" fill="#334155">대시보드·임계값</text>
  <line x1="290" y1="150" x2="312" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Observability ===== -->
  <rect x="490" y="56" width="450" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="84" font-size="16" font-weight="700" fill="#0f766e">관측성 — 모르는 문제</text>
  <text x="510" y="104" font-size="12" fill="#64748b">unknown unknowns: 질문을 그때그때 던지며 좁힌다</text>

  <g text-anchor="middle" font-size="12" fill="#0f172a">
    <rect x="506" y="130" width="96" height="58" rx="8" fill="#ffffff" stroke="#0d9488"/>
    <text x="554" y="154">에러가</text>
    <text x="554" y="174">왜 늘었지?</text>
    <rect x="616" y="130" width="96" height="58" rx="8" fill="#ffffff" stroke="#0d9488"/>
    <text x="664" y="154">버전 0.4.1</text>
    <text x="664" y="174">에서만</text>
    <rect x="726" y="130" width="96" height="58" rx="8" fill="#ffffff" stroke="#0d9488"/>
    <text x="774" y="154">/work 라우트</text>
    <text x="774" y="174">특정 Pod</text>
    <rect x="836" y="130" width="92" height="58" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="882" y="154" font-weight="700">DB span</text>
    <text x="882" y="174" font-weight="700">3초 지연</text>
  </g>
  <g stroke="#0d9488" stroke-width="2" fill="none">
    <line x1="602" y1="159" x2="612" y2="159" marker-end="url(#arrowT)"/>
    <line x1="712" y1="159" x2="722" y2="159" marker-end="url(#arrowT)"/>
    <line x1="822" y1="159" x2="832" y2="159" marker-end="url(#arrowT)"/>
  </g>
  <text x="715" y="222" text-anchor="middle" font-size="13" fill="#334155">라벨·속성으로 쪼개고, 신호를 넘나들며 "왜"를 찾는다</text>

  <!-- ===== Signals ===== -->
  <text x="40" y="292" font-size="16" font-weight="700" fill="#0f172a">3대 신호 + 프로파일</text>

  <g text-anchor="middle">
    <rect x="20" y="306" width="190" height="118" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
    <text x="115" y="334" font-size="16" font-weight="700" fill="#1d4ed8">메트릭</text>
    <text x="115" y="358" font-size="13" fill="#0f172a">무엇이 · 얼마나</text>
    <text x="115" y="380" font-size="12" fill="#334155">싸고 빠름, 알림·SLO</text>
    <text x="115" y="408" font-size="12" fill="#64748b">Prometheus (Day 17·58)</text>

    <rect x="263" y="306" width="190" height="118" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="358" y="334" font-size="16" font-weight="700" fill="#0f766e">트레이스</text>
    <text x="358" y="358" font-size="13" fill="#0f172a">어디서 느린가</text>
    <text x="358" y="380" font-size="12" fill="#334155">요청 한 건의 경로·구간</text>
    <text x="358" y="408" font-size="12" fill="#64748b">Tempo (Day 61)</text>

    <rect x="507" y="306" width="190" height="118" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="602" y="334" font-size="16" font-weight="700" fill="#b45309">로그</text>
    <text x="602" y="358" font-size="13" fill="#0f172a">왜 실패했나</text>
    <text x="602" y="380" font-size="12" fill="#334155">이벤트 하나하나의 맥락</text>
    <text x="602" y="408" font-size="12" fill="#64748b">Loki (Day 60)</text>

    <rect x="750" y="306" width="190" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="845" y="334" font-size="16" font-weight="700" fill="#334155">프로파일</text>
    <text x="845" y="358" font-size="13" fill="#0f172a">어느 함수가</text>
    <text x="845" y="380" font-size="12" fill="#334155">CPU·메모리를 쓰나</text>
    <text x="845" y="408" font-size="12" fill="#64748b">Pyroscope 등 (개념만)</text>
  </g>

  <g stroke="#0d9488" stroke-width="2" fill="none">
    <line x1="210" y1="365" x2="259" y2="365" marker-end="url(#arrowT)"/>
    <line x1="453" y1="365" x2="503" y2="365" marker-end="url(#arrowT)"/>
    <line x1="697" y1="365" x2="746" y2="365" marker-end="url(#arrowT)" stroke-dasharray="5 4"/>
  </g>
  <g font-size="10" fill="#0f766e" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="236" y="356">exemplar</text>
    <text x="480" y="356">trace_id</text>
    <text x="722" y="356">span</text>
  </g>

  <rect x="20" y="442" width="920" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="480" y="467" text-anchor="middle" font-size="14" fill="#0f766e">신호를 trace_id로 이어 두어야 "알림 → 트레이스 → 로그"로 클릭 몇 번에 원인까지 간다 (Day 59~61)</text>
</svg>
