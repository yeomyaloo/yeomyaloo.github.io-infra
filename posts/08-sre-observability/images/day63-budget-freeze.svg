<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">에러 버짓 기반 배포 동결 (SLO 99.9% · 30일 버짓 43.2분)</text>

  <!-- Policy table (left) -->
  <rect x="20" y="60" width="360" height="420" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="200" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">③ 정책 — 남은 버짓별 행동</text>

  <rect x="40" y="106" width="320" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="56" y="132" font-size="15" font-weight="700" fill="#14532d">&gt; 50%</text>
  <text x="56" y="156" font-size="12" fill="#14532d">평소대로 배포, 실험적 기능 OK</text>
  <rect x="216" y="122" width="130" height="14" rx="3" fill="#ffffff"/>
  <rect x="216" y="122" width="100" height="14" rx="3" fill="#16a34a"/>

  <rect x="40" y="194" width="320" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="56" y="220" font-size="15" font-weight="700" fill="#713f12">25 ~ 50%</text>
  <text x="56" y="244" font-size="12" fill="#713f12">배포 계속, canary 단계를 길게</text>
  <rect x="216" y="210" width="130" height="14" rx="3" fill="#ffffff"/>
  <rect x="216" y="210" width="50" height="14" rx="3" fill="#ca8a04"/>

  <rect x="40" y="282" width="320" height="76" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="56" y="308" font-size="15" font-weight="700" fill="#7c2d12">0 ~ 25%</text>
  <text x="56" y="332" font-size="12" fill="#7c2d12">위험한 변경 보류, 신뢰성 작업 우선</text>
  <rect x="216" y="298" width="130" height="14" rx="3" fill="#ffffff"/>
  <rect x="216" y="298" width="18" height="14" rx="3" fill="#ea580c"/>

  <rect x="40" y="370" width="320" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="396" font-size="15" font-weight="700" fill="#7f1d1d">≤ 0 (소진)</text>
  <text x="56" y="420" font-size="12" fill="#7f1d1d">기능 배포 동결</text>
  <text x="56" y="442" font-size="12" fill="#7f1d1d">수정 · 롤백만 예외 승인</text>
  <rect x="216" y="386" width="130" height="14" rx="3" fill="#ffffff" stroke="#dc2626"/>

  <!-- Right: mechanisms -->
  <!-- Commit -->
  <rect x="420" y="70" width="190" height="56" rx="10" fill="#e2e8f0" stroke="#334155"/>
  <text x="515" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">새 이미지 태그 커밋</text>
  <text x="515" y="114" text-anchor="middle" font-size="11" fill="#334155">overlays/dev → Argo CD</text>

  <!-- Sync window -->
  <rect x="660" y="64" width="280" height="96" rx="10" fill="#fff1eb" stroke="#ef7b4d" stroke-width="2"/>
  <text x="800" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">② Argo CD Sync Window</text>
  <text x="800" y="110" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#9a3412">kind: deny · duration: 168h</text>
  <text x="800" y="130" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#9a3412">manualSync: true</text>
  <text x="800" y="149" text-anchor="middle" font-size="11" fill="#9a3412">사람이 선언 → 자동 sync 멈춤</text>

  <!-- Gate -->
  <rect x="420" y="180" width="300" height="86" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="570" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">① step 0: error-budget-gate</text>
  <text x="570" y="226" text-anchor="middle" font-size="12" fill="#312e81">1번 측정: 남은 버짓 = 1 − (30일 에러율 ÷ 0.001)</text>
  <text x="570" y="248" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#312e81">successCondition: result &gt; 0</text>

  <!-- Outcomes -->
  <rect x="420" y="320" width="240" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="540" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">버짓 &gt; 0</text>
  <text x="540" y="368" text-anchor="middle" font-size="12" fill="#14532d">setWeight 20 → SLO canary 분석</text>

  <rect x="690" y="320" width="250" height="74" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="815" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">버짓 ≤ 0</text>
  <text x="815" y="368" text-anchor="middle" font-size="12" fill="#7f1d1d">즉시 abort — 트래픽 0%에서 멈춤</text>

  <!-- Exception path -->
  <rect x="420" y="414" width="520" height="66" rx="10" fill="#ffffff" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text x="680" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">예외 경로 (수정 배포)</text>
  <text x="680" y="462" text-anchor="middle" font-size="12" fill="#334155">사람 확인 → <tspan font-family="Consolas,'D2Coding',monospace">kubectl argo rollouts promote --full</tspan> → 포스트모템 기록</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="515" y1="126" x2="540" y2="176" marker-end="url(#arrow)"/>
    <line x1="660" y1="112" x2="614" y2="102" marker-end="url(#arrow)"/>
    <line x1="530" y1="266" x2="530" y2="316" marker-end="url(#arrow)"/>
    <line x1="660" y1="266" x2="760" y2="316" marker-end="url(#arrow)"/>
  </g>
  <text x="637" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">차단</text>
</svg>
