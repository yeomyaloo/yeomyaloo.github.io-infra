<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Collector 배포 방식 — agent + gateway</text>

  <!-- Cluster -->
  <rect x="20" y="56" width="700" height="350" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="2"/>
  <text x="40" y="82" font-size="15" font-weight="700" fill="#1e3a8a">Kubernetes 클러스터</text>

  <!-- Node 1 -->
  <rect x="40" y="96" width="300" height="140" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="118" font-size="13" font-weight="700" fill="#334155">노드 1</text>
  <g text-anchor="middle" font-size="12">
    <rect x="56" y="130" width="80" height="34" rx="6" fill="#86efac"/><text x="96" y="152" fill="#14532d">앱 Pod A</text>
    <rect x="56" y="180" width="80" height="34" rx="6" fill="#86efac"/><text x="96" y="202" fill="#14532d">앱 Pod B</text>
  </g>
  <rect x="180" y="130" width="144" height="84" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="252" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">agent</text>
  <text x="252" y="174" text-anchor="middle" font-size="11" fill="#334155">DaemonSet</text>
  <text x="252" y="194" text-anchor="middle" font-size="11" fill="#334155">노드 로그·호스트 메트릭</text>

  <!-- Node 2 -->
  <rect x="40" y="252" width="300" height="140" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="274" font-size="13" font-weight="700" fill="#334155">노드 2</text>
  <g text-anchor="middle" font-size="12">
    <rect x="56" y="286" width="80" height="34" rx="6" fill="#86efac"/><text x="96" y="308" fill="#14532d">앱 Pod C</text>
    <rect x="56" y="336" width="80" height="34" rx="6" fill="#86efac"/><text x="96" y="358" fill="#14532d">앱 Pod D</text>
  </g>
  <rect x="180" y="286" width="144" height="84" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="252" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">agent</text>
  <text x="252" y="330" text-anchor="middle" font-size="11" fill="#334155">DaemonSet</text>
  <text x="252" y="350" text-anchor="middle" font-size="11" fill="#334155">노드 로그·호스트 메트릭</text>

  <g stroke="#0d9488" stroke-width="1.8" fill="none">
    <line x1="136" y1="147" x2="176" y2="160" marker-end="url(#arrowT)"/>
    <line x1="136" y1="197" x2="176" y2="186" marker-end="url(#arrowT)"/>
    <line x1="136" y1="303" x2="176" y2="316" marker-end="url(#arrowT)"/>
    <line x1="136" y1="353" x2="176" y2="342" marker-end="url(#arrowT)"/>
  </g>
  <text x="158" y="126" text-anchor="middle" font-size="10" fill="#0f766e">OTLP</text>

  <!-- Gateway -->
  <rect x="400" y="130" width="300" height="210" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="550" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">gateway</text>
  <text x="550" y="176" text-anchor="middle" font-size="12" fill="#334155">Deployment ×N + Service</text>
  <g font-size="12" text-anchor="middle">
    <rect x="420" y="190" width="120" height="30" rx="6" fill="#ffffff" stroke="#0d9488"/><text x="480" y="210" fill="#0f172a">collector-0</text>
    <rect x="560" y="190" width="120" height="30" rx="6" fill="#ffffff" stroke="#0d9488"/><text x="620" y="210" fill="#0f172a">collector-1</text>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="424" y="246">• 꼬리 기반 샘플링 (Day 61)</text>
    <text x="424" y="268">• 백엔드 인증 키·라우팅 일원화</text>
    <text x="424" y="290">• 민감 속성 제거·정규화</text>
    <text x="424" y="312">• 백엔드 장애 시 큐잉·재시도</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="324" y1="172" x2="396" y2="210" marker-end="url(#arrow)"/>
    <line x1="324" y1="328" x2="396" y2="290" marker-end="url(#arrow)"/>
  </g>

  <!-- Backends -->
  <g text-anchor="middle">
    <rect x="760" y="140" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="850" y="170" font-size="14" font-weight="700" fill="#0f172a">Tempo</text>
    <rect x="760" y="210" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="850" y="240" font-size="14" font-weight="700" fill="#0f172a">Loki</text>
    <rect x="760" y="280" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="850" y="310" font-size="14" font-weight="700" fill="#0f172a">Prometheus</text>
  </g>
  <text x="850" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">백엔드</text>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="700" y1="205" x2="756" y2="168" marker-end="url(#arrow)"/>
    <line x1="700" y1="235" x2="756" y2="235" marker-end="url(#arrow)"/>
    <line x1="700" y1="265" x2="756" y2="302" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="420" width="920" height="44" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="480" y="447" text-anchor="middle" font-size="14" fill="#78350f">오늘 kind 실습: agent 없이 gateway 1개 — 앱 Pod가 otel-collector.observability:4317 로 직접 전송</text>
</svg>
