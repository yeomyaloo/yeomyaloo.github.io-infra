<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Chapter 8 로드맵 — 숫자로 약속하고 지키기</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="232" y="52" width="16" height="16" rx="3" fill="#0d9488"/><text x="256" y="65" fill="#334155">기준 정하기</text>
    <rect x="362" y="52" width="16" height="16" rx="3" fill="#2496ed"/><text x="386" y="65" fill="#334155">신호 수집</text>
    <rect x="478" y="52" width="16" height="16" rx="3" fill="#f59e0b"/><text x="502" y="65" fill="#334155">알림·자동 판정</text>
    <rect x="628" y="52" width="16" height="16" rx="3" fill="#dc2626"/><text x="652" y="65" fill="#334155">검증·회고</text>
  </g>

  <!-- Row 1 -->
  <g text-anchor="middle">
    <rect x="20" y="90" width="200" height="120" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
    <text x="120" y="118" font-size="14" font-weight="700" fill="#0f766e">Day 58 (오늘)</text>
    <text x="120" y="150" font-size="16" font-weight="700" fill="#0f172a">SRE · SLI/SLO</text>
    <text x="120" y="174" font-size="16" font-weight="700" fill="#0f172a">에러 버짓</text>
    <text x="120" y="198" font-size="12" fill="#334155">Prometheus recording rule</text>

    <rect x="260" y="90" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
    <text x="360" y="118" font-size="14" font-weight="700" fill="#1d4ed8">Day 59</text>
    <text x="360" y="150" font-size="16" font-weight="700" fill="#0f172a">OpenTelemetry</text>
    <text x="360" y="174" font-size="16" font-weight="700" fill="#0f172a">계측</text>
    <text x="360" y="198" font-size="12" fill="#334155">SDK · OTLP · Collector</text>

    <rect x="500" y="90" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
    <text x="600" y="118" font-size="14" font-weight="700" fill="#1d4ed8">Day 60</text>
    <text x="600" y="150" font-size="16" font-weight="700" fill="#0f172a">로그 수집</text>
    <text x="600" y="174" font-size="16" font-weight="700" fill="#0f172a">Loki + Alloy</text>
    <text x="600" y="198" font-size="12" fill="#334155">LogQL · 라벨 설계</text>

    <rect x="740" y="90" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2496ed" stroke-width="2"/>
    <text x="840" y="118" font-size="14" font-weight="700" fill="#1d4ed8">Day 61</text>
    <text x="840" y="150" font-size="16" font-weight="700" fill="#0f172a">분산 트레이싱</text>
    <text x="840" y="174" font-size="16" font-weight="700" fill="#0f172a">Tempo</text>
    <text x="840" y="198" font-size="12" fill="#334155">로그 ↔ 트레이스 연결</text>
  </g>

  <!-- Row 2 (right to left) -->
  <g text-anchor="middle">
    <rect x="740" y="270" width="200" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="840" y="298" font-size="14" font-weight="700" fill="#b45309">Day 62</text>
    <text x="840" y="330" font-size="16" font-weight="700" fill="#0f172a">알림 설계</text>
    <text x="840" y="354" font-size="16" font-weight="700" fill="#0f172a">Alertmanager</text>
    <text x="840" y="378" font-size="12" fill="#334155">번 레이트 · 증상 기반</text>

    <rect x="500" y="270" width="200" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="298" font-size="14" font-weight="700" fill="#b45309">Day 63</text>
    <text x="600" y="330" font-size="16" font-weight="700" fill="#0f172a">SLO 기반 Canary</text>
    <text x="600" y="354" font-size="16" font-weight="700" fill="#0f172a">Argo Rollouts</text>
    <text x="600" y="378" font-size="12" fill="#334155">SLI 쿼리로 자동 판정</text>

    <rect x="260" y="270" width="200" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="360" y="298" font-size="14" font-weight="700" fill="#b91c1c">Day 64</text>
    <text x="360" y="330" font-size="16" font-weight="700" fill="#0f172a">카오스 엔지니어링</text>
    <text x="360" y="354" font-size="16" font-weight="700" fill="#0f172a">Chaos Mesh</text>
    <text x="360" y="378" font-size="12" fill="#334155">일부러 장애 내기</text>

    <rect x="20" y="270" width="200" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="298" font-size="14" font-weight="700" fill="#b91c1c">Day 65</text>
    <text x="120" y="330" font-size="16" font-weight="700" fill="#0f172a">장애 대응과 회고</text>
    <text x="120" y="354" font-size="16" font-weight="700" fill="#0f172a">포스트모템</text>
    <text x="120" y="378" font-size="12" fill="#334155">런북 · 온콜</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="220" y1="150" x2="256" y2="150" marker-end="url(#arrow)"/>
    <line x1="460" y1="150" x2="496" y2="150" marker-end="url(#arrow)"/>
    <line x1="700" y1="150" x2="736" y2="150" marker-end="url(#arrow)"/>
    <line x1="840" y1="210" x2="840" y2="266" marker-end="url(#arrow)"/>
    <line x1="740" y1="330" x2="704" y2="330" marker-end="url(#arrow)"/>
    <line x1="500" y1="330" x2="464" y2="330" marker-end="url(#arrow)"/>
    <line x1="260" y1="330" x2="224" y2="330" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback loop -->
  <path d="M60,270 C60,240 60,240 60,214" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="70" y="246" font-size="12" fill="#0f766e">SLO 재조정</text>

  <!-- bottom summary -->
  <rect x="20" y="410" width="920" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="437" text-anchor="middle" font-size="14" fill="#334155">SLO를 정하고 → 신호를 모으고 → 버짓 소진 속도로 알리고·판정하고 → 깨뜨려 보고 → 회고해 SLO를 다시 다듬는다</text>
</svg>
