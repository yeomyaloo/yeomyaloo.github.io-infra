    <text x="460" y="389" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#4c1d95">orders-api</text>
    <text x="460" y="406" fill="#5b21b6">템플릿이 생성 · 플랫폼 03</text>

    <rect x="640" y="350" width="280" height="64" rx="8" fill="#fff1eb" stroke="#ef7b4d" stroke-dasharray="6 4"/>
    <text x="780" y="368" fill="#9a3412">Template</text>
    <text x="780" y="389" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#7c2d12">spring-boot-service</text>
    <text x="780" y="406" fill="#9a3412">owner: platform-admins · 플랫폼 03</text>
  </g>
  <line x1="200" y1="348" x2="372" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="300" font-size="11" fill="#334155">partOf</text>
  <line x1="460" y1="348" x2="460" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="314" font-size="11" fill="#334155">partOf</text>
  <line x1="760" y1="348" x2="680" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="742" y="240" font-size="11" fill="#334155">ownedBy</text>

  <!-- Row 4: API and resource -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="466" width="240" height="62" rx="8" fill="#dbeafe" stroke="#326ce5"/>
    <text x="160" y="484" fill="#1e40af">API (openapi)</text>
    <text x="160" y="506" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#1e3a8a">gitops-demo-app-api</text>

    <rect x="360" y="466" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
    <text x="460" y="484" fill="#475569">Resource (database)</text>
    <text x="460" y="506" font-family="Consolas,'D2Coding',monospace" font-size="14" font-weight="700" fill="#334155">orders-db</text>
    <text x="460" y="522" fill="#475569">Crossplane XR · 플랫폼 04</text>
  </g>
  <line x1="160" y1="416" x2="160" y2="462" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168" y="444" font-size="11" fill="#334155">providesApi</text>
  <line x1="460" y1="416" x2="460" y2="462" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="468" y="444" font-size="11" fill="#334155">dependsOn</text>

  <!-- Location note -->
  <rect x="610" y="452" width="330" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="626" y="474" font-size="13" font-weight="700" fill="#0f172a">Location platform-catalog (all.yaml)</text>
  <g font-size="12" fill="#475569">
    <text x="626" y="494">→ org.yaml (Group · User), systems.yaml</text>
    <text x="626" y="512">→ templates/…/template.yaml (03)</text>
    <text x="626" y="530">→ gitops-demo-app/catalog-info.yaml</text>
  </g>

  <text x="30" y="548" font-size="11" fill="#64748b">실선: 오늘 등록 · 점선: 이후 편</text>
</svg>
