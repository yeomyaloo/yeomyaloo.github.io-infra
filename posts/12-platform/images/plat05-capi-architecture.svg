<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Cluster API 아키텍처 — kind 관리 클러스터 + Docker provider(CAPD)</text>

  <!-- Host -->
  <rect x="20" y="52" width="920" height="452" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="76" font-size="14" font-weight="700" fill="#334155">호스트 PC — Docker Desktop / Docker Engine</text>

  <!-- Management cluster -->
  <rect x="40" y="92" width="380" height="334" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="230" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">platform-lab (관리 클러스터)</text>
  <rect x="60" y="132" width="340" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="230" y="154" text-anchor="middle" font-size="13" fill="#334155">Argo CD · Backstage · Crossplane (플랫폼 01~04)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="176" width="340" height="34" rx="6" fill="#c7d2fe"/>
    <text x="230" y="198" fill="#1e1b4b">capi-controller-manager (Core)</text>
    <rect x="60" y="218" width="340" height="34" rx="6" fill="#c7d2fe"/>
    <text x="230" y="240" fill="#1e1b4b">kubeadm bootstrap (CABPK)</text>
    <rect x="60" y="260" width="340" height="34" rx="6" fill="#c7d2fe"/>
    <text x="230" y="282" fill="#1e1b4b">kubeadm control plane (KCP)</text>
    <rect x="60" y="302" width="340" height="34" rx="6" fill="#6d28d9"/>
    <text x="230" y="324" fill="#ffffff" font-weight="700">capd-controller-manager (Infrastructure)</text>
  </g>
  <rect x="60" y="348" width="340" height="62" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-dasharray="4 3"/>
  <text x="230" y="368" text-anchor="middle" font-size="12" fill="#64748b">원하는 상태 (CRD, 네임스페이스 clusters)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle" fill="#4c1d95">
    <text x="230" y="386">Cluster / ClusterClass</text>
    <text x="230" y="403">MachineDeployment / Machine</text>
  </g>

  <!-- docker.sock -->
  <text x="495" y="280" text-anchor="middle" font-size="12" fill="#64748b">컨테이너 생성·삭제</text>
  <rect x="440" y="300" width="110" height="34" rx="17" fill="#2496ed"/>
  <text x="495" y="322" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#ffffff">docker.sock</text>
  <line x1="400" y1="319" x2="438" y2="317" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="310" x2="588" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="324" x2="588" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dev-1 -->
  <rect x="590" y="92" width="330" height="154" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="755" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">dev-1 (워크로드 클러스터)</text>
  <rect x="610" y="128" width="290" height="30" rx="6" fill="#fde68a"/>
  <text x="755" y="148" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">dev-1-lb (haproxy :6443)</text>
  <rect x="610" y="168" width="140" height="60" rx="6" fill="#326ce5"/>
  <text x="680" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">control-plane</text>
  <text x="680" y="213" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#dbeafe">kindest/node</text>
  <rect x="760" y="168" width="140" height="60" rx="6" fill="#86efac"/>
  <text x="830" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">md-0 워커</text>
  <text x="830" y="213" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">kindest/node</text>

  <!-- prod-1 -->
  <rect x="590" y="262" width="330" height="164" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="755" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">prod-1 (워크로드 클러스터)</text>
  <rect x="610" y="298" width="290" height="30" rx="6" fill="#fde68a"/>
  <text x="755" y="318" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#78350f">prod-1-lb (haproxy :6443)</text>
  <rect x="610" y="340" width="90" height="70" rx="6" fill="#326ce5"/>
  <text x="655" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CP</text>
  <text x="655" y="391" text-anchor="middle" font-size="11" fill="#dbeafe">컨테이너</text>
  <rect x="710" y="340" width="90" height="70" rx="6" fill="#86efac"/>
  <text x="755" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">워커 1</text>
  <text x="755" y="391" text-anchor="middle" font-size="11" fill="#14532d">컨테이너</text>
  <rect x="810" y="340" width="90" height="70" rx="6" fill="#86efac"/>
  <text x="855" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">워커 2</text>
  <text x="855" y="391" text-anchor="middle" font-size="11" fill="#14532d">컨테이너</text>

  <!-- network -->
  <rect x="40" y="440" width="880" height="48" rx="8" fill="#e2e8f0"/>
  <text x="480" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Docker 네트워크 kind — 관리 클러스터 노드, 워크로드 노드, LB 컨테이너가 모두 같은 네트워크</text>
  <text x="480" y="479" text-anchor="middle" font-size="12" fill="#334155">그래서 platform-lab 안의 Pod(Argo CD 등)가 dev-1-lb의 컨테이너 IP:6443으로 접속할 수 있다</text>
</svg>
