<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Crossplane v1 → v2 — 무엇이 바뀌었나</text>

  <!-- Column headers -->
  <rect x="30" y="54" width="400" height="34" rx="8" fill="#e2e8f0"/>
  <text x="230" y="77" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">v1 (예전 글의 모델)</text>
  <rect x="530" y="54" width="400" height="34" rx="8" fill="#6d28d9"/>
  <text x="730" y="77" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">v2 (v2.4.3 기준)</text>
  <line x1="440" y1="71" x2="520" y2="71" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- v1 column -->
  <g font-size="12">
    <rect x="30" y="104" width="400" height="56" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="46" y="126" font-size="14" font-weight="700" fill="#78350f">Claim (네임스페이스) — 개발자</text>
    <text x="46" y="146" fill="#92400e">PostgreSQLInstanceClaim → 클러스터 XR과 바인딩</text>

    <rect x="30" y="182" width="400" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="46" y="204" font-size="14" font-weight="700" fill="#334155">XR (클러스터 범위)</text>
    <text x="46" y="224" fill="#475569">spec에 compositionRef·resourceRefs가 사용자 필드와 섞임</text>

    <rect x="30" y="260" width="400" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="46" y="282" font-size="14" font-weight="700" fill="#334155">Composition — resources: 배열</text>
    <text x="46" y="302" fill="#475569">내장 Patch &amp; Transform (함수는 선택)</text>

    <rect x="30" y="338" width="400" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="46" y="360" font-size="14" font-weight="700" fill="#334155">MR (클러스터 범위)만 조합</text>
    <text x="46" y="380" font-family="Consolas,'D2Coding',monospace" fill="#475569">rds.aws.upbound.io/v1beta1</text>

    <rect x="30" y="416" width="400" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="46" y="438" font-size="14" font-weight="700" fill="#7f1d1d">v2에서 제거</text>
    <text x="46" y="458" fill="#991b1b">ControllerConfig · External Secret Stores</text>
    <text x="46" y="476" fill="#991b1b">XR connection details · 기본 레지스트리(--registry)</text>
  </g>
  <line x1="230" y1="162" x2="230" y2="178" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="240" x2="230" y2="256" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="318" x2="230" y2="334" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- v2 column -->
  <g font-size="12">
    <rect x="530" y="104" width="400" height="56" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="546" y="126" font-size="14" font-weight="700" fill="#78350f">XR (네임스페이스, 기본) — 개발자가 직접</text>
    <text x="546" y="146" fill="#92400e">claim 없음 · Crossplane 필드는 spec.crossplane.* 로 분리</text>

    <rect x="530" y="182" width="400" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="546" y="204" font-size="14" font-weight="700" fill="#4c1d95">XRD apiextensions.crossplane.io/v2</text>
    <text x="546" y="224" fill="#5b21b6">scope: Namespaced(기본) · Cluster · LegacyCluster</text>

    <rect x="530" y="260" width="400" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="546" y="282" font-size="14" font-weight="700" fill="#4c1d95">Composition — mode: Pipeline (함수만)</text>
    <text x="546" y="302" fill="#5b21b6">go-templating · patch-and-transform · KCL · Python ...</text>

    <rect x="530" y="338" width="400" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="546" y="360" font-size="14" font-weight="700" fill="#4c1d95">아무 K8s 리소스 + 네임스페이스 MR</text>
    <text x="546" y="380" font-family="Consolas,'D2Coding',monospace" fill="#5b21b6">Cluster(CNPG) · rds.aws.m.upbound.io</text>

    <rect x="530" y="416" width="400" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="546" y="438" font-size="14" font-weight="700" fill="#14532d">새로 생긴 것 · 대체</text>
    <text x="546" y="458" fill="#166534">Operations(알파) · DeploymentRuntimeConfig</text>
    <text x="546" y="476" fill="#166534">RBAC 집계로 native 조합 권한 부여</text>
  </g>
  <line x1="730" y1="162" x2="730" y2="178" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="240" x2="730" y2="256" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="318" x2="730" y2="334" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
