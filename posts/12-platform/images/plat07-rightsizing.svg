<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">requests rightsizing — 예약한 CPU vs 실제 사용 vs VPA 추천</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="200" y1="70" x2="200" y2="350"/>
    <line x1="290" y1="70" x2="290" y2="350"/>
    <line x1="380" y1="70" x2="380" y2="350"/>
    <line x1="470" y1="70" x2="470" y2="350"/>
    <line x1="560" y1="70" x2="560" y2="350"/>
    <line x1="650" y1="70" x2="650" y2="350"/>
  </g>
  <line x1="200" y1="350" x2="650" y2="350" stroke="#334155" stroke-width="1.5"/>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="200" y="368">0</text>
    <text x="290" y="368">100m</text>
    <text x="380" y="368">200m</text>
    <text x="470" y="368">300m</text>
    <text x="560" y="368">400m</text>
    <text x="650" y="368">500m</text>
  </g>
  <text x="425" y="388" text-anchor="middle" font-size="12" fill="#64748b">컨테이너당 CPU (millicores)</text>

  <!-- checkout row -->
  <text x="20" y="104" font-size="15" font-weight="700" fill="#0f172a">checkout ×2</text>
  <text x="20" y="124" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">team=payments</text>
  <rect x="200" y="88" width="450" height="22" fill="#cbd5e1"/>
  <text x="194" y="104" text-anchor="end" font-size="11" fill="#334155">requests</text>
  <rect x="200" y="118" width="2" height="22" fill="#16a34a"/>
  <text x="230" y="134" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#16a34a">≈1m</text>
  <text x="194" y="134" text-anchor="end" font-size="11" fill="#334155">실사용</text>
  <rect x="200" y="148" width="45" height="22" fill="#6d28d9"/>
  <text x="251" y="164" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#4c1d95">50m (변경 후)</text>
  <text x="194" y="164" text-anchor="end" font-size="11" fill="#334155">새 requests</text>
  <text x="560" y="104" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">500m</text>
  <line x1="222" y1="82" x2="222" y2="182" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="228" y="196" font-size="11" fill="#7c3aed">VPA target 25m (최소 추천값)</text>

  <!-- search row -->
  <text x="20" y="244" font-size="15" font-weight="700" fill="#0f172a">search ×1</text>
  <text x="20" y="264" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#64748b">team=discovery</text>
  <rect x="200" y="228" width="180" height="22" fill="#cbd5e1"/>
  <text x="194" y="244" text-anchor="end" font-size="11" fill="#334155">requests</text>
  <text x="392" y="244" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#334155">200m</text>
  <rect x="200" y="258" width="180" height="22" fill="#86efac"/>
  <text x="194" y="274" text-anchor="end" font-size="11" fill="#334155">실사용</text>
  <text x="392" y="274" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#16a34a">≈200m (limit)</text>
  <rect x="200" y="288" width="180" height="22" fill="#6d28d9"/>
  <text x="194" y="304" text-anchor="end" font-size="11" fill="#334155">새 requests</text>
  <text x="392" y="304" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#4c1d95">200m 유지</text>
  <line x1="383" y1="222" x2="383" y2="322" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="389" y="336" font-size="11" fill="#7c3aed">VPA target ≈203m</text>

  <!-- cost panel -->
  <rect x="690" y="70" width="250" height="280" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="815" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">월 CPU 비용</text>
  <text x="815" y="116" text-anchor="middle" font-size="12" fill="#64748b">3.42원/코어·시간 × 730시간</text>
  <text x="815" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">checkout (1코어 → 0.1코어)</text>
  <text x="815" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">2,497원 → 250원</text>
  <text x="815" y="204" text-anchor="middle" font-size="12" fill="#16a34a">-90% (효율 0% → 약 2%)</text>
  <line x1="710" y1="222" x2="920" y2="222" stroke="#c4b5fd"/>
  <text x="815" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">search (0.2코어)</text>
  <text x="815" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">499원 → 499원</text>
  <text x="815" y="304" text-anchor="middle" font-size="12" fill="#64748b">이미 효율 ≈ 100%</text>
  <text x="815" y="334" text-anchor="middle" font-size="11" fill="#64748b">(값은 예시)</text>

  <rect x="20" y="404" width="920" height="44" rx="8" fill="#f1f5f9"/>
  <text x="480" y="431" text-anchor="middle" font-size="14" fill="#334155">스케줄러는 사용량이 아니라 requests로 노드를 채운다 → requests 합이 줄어야 노드 수(=비용)가 준다</text>
</svg>
