<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">골든 패스 — 템플릿 실행에서 Argo CD 배포까지</text>

  <!-- Developer -->
  <rect x="20" y="70" width="176" height="160" rx="10" fill="#fde68a" stroke="#f59e0b"/>
  <text x="108" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">개발자</text>
  <text x="108" y="116" text-anchor="middle" font-size="12" fill="#92400e">Backstage → Create</text>
  <g font-size="12" fill="#78350f">
    <text x="34" y="146">이름: orders-api</text>
    <text x="34" y="168">소유 팀: team-a-devs</text>
    <text x="34" y="190">레포: &lt;user&gt;/orders-api</text>
  </g>
  <text x="108" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">[Create] 한 번</text>
  <line x1="198" y1="150" x2="226" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Scaffolder -->
  <rect x="230" y="60" width="330" height="312" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="395" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Scaffolder (template.yaml의 steps)</text>
  <g font-size="11" fill="#5b21b6">
    <rect x="246" y="96" width="298" height="46" rx="8" fill="#ffffff" stroke="#6d28d9"/>
    <text x="258" y="115" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#4c1d95">1) fetch:template</text>
    <text x="258" y="133">skeleton/ → 작업 공간 ./service (값 채우기)</text>
    <rect x="246" y="150" width="298" height="46" rx="8" fill="#ffffff" stroke="#6d28d9"/>
    <text x="258" y="169" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#4c1d95">2) fetch:template</text>
    <text x="258" y="187">gitops/ → 작업 공간 ./gitops</text>
    <rect x="246" y="204" width="298" height="46" rx="8" fill="#ffffff" stroke="#6d28d9"/>
    <text x="258" y="223" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#4c1d95">3) publish:github</text>
    <text x="258" y="241">./service → 새 레포 생성 + push</text>
    <rect x="246" y="258" width="298" height="46" rx="8" fill="#ffffff" stroke="#6d28d9"/>
    <text x="258" y="277" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#4c1d95">4) publish:github:pull-request</text>
    <text x="258" y="295">./gitops → gitops-demo-config/apps/orders-api</text>
    <rect x="246" y="312" width="298" height="46" rx="8" fill="#ffffff" stroke="#6d28d9"/>
    <text x="258" y="331" font-family="Consolas,'D2Coding',monospace" font-size="13" font-weight="700" fill="#4c1d95">5) catalog:register</text>
    <text x="258" y="349">새 레포의 /catalog-info.yaml 등록</text>
  </g>

  <!-- Outputs -->
  <g font-size="12">
    <rect x="600" y="186" width="340" height="62" rx="10" fill="#f8fafc" stroke="#334155"/>
    <text x="614" y="208" font-size="14" font-weight="700" fill="#0f172a">GitHub 레포 &lt;user&gt;/orders-api</text>
    <text x="614" y="228" fill="#475569">Spring Boot 4.1.2 · Dockerfile · CI · catalog-info · docs</text>

    <rect x="600" y="262" width="340" height="56" rx="10" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="614" y="284" font-size="14" font-weight="700" fill="#7c2d12">gitops-demo-config PR</text>
    <text x="614" y="304" fill="#9a3412">apps/orders-api/base + overlays/dev</text>

    <rect x="600" y="330" width="340" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="614" y="352" font-size="14" font-weight="700" fill="#4c1d95">카탈로그 Component orders-api</text>
    <text x="614" y="372" fill="#5b21b6">owner team-a-devs · system gitops-demo</text>
  </g>
  <line x1="546" y1="227" x2="596" y2="217" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="546" y1="281" x2="596" y2="289" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="546" y1="335" x2="596" y2="354" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="770" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">결과물 3곳</text>
  <text x="770" y="104" text-anchor="middle" font-size="12" fill="#475569">output.links 로 실행 화면에 표시</text>
  <text x="770" y="124" text-anchor="middle" font-size="12" fill="#475569">토큰: integrations.github (Workflows 권한 포함)</text>

  <!-- Bottom: deployment pipeline -->
  <text x="20" y="418" font-size="14" font-weight="700" fill="#0f172a">배포까지</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="430" width="168" height="66" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="104" y="452" font-weight="700" fill="#78350f">개발자: 태그 push</text>
    <text x="104" y="470" font-family="Consolas,'D2Coding',monospace" fill="#78350f">v0.1.0 → CI</text>
    <text x="104" y="487" fill="#92400e">GHCR :0.1.0 (Public)</text>

    <rect x="202" y="430" width="168" height="66" rx="8" fill="#fde68a" stroke="#f59e0b"/>
    <text x="286" y="452" font-weight="700" fill="#78350f">개발자: PR 머지</text>
    <text x="286" y="470" fill="#92400e">리뷰 후 main 반영</text>
    <text x="286" y="487" fill="#92400e">(머지 = 배포)</text>

    <rect x="384" y="430" width="168" height="66" rx="8" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="468" y="452" font-weight="700" fill="#7c2d12">ApplicationSet</text>
    <text x="468" y="470" font-family="Consolas,'D2Coding',monospace" fill="#7c2d12">dev-apps</text>
    <text x="468" y="487" fill="#9a3412">새 디렉터리 감지</text>

    <rect x="566" y="430" width="168" height="66" rx="8" fill="#fff1eb" stroke="#ef7b4d"/>
    <text x="650" y="452" font-weight="700" fill="#7c2d12">Application</text>
    <text x="650" y="470" font-family="Consolas,'D2Coding',monospace" fill="#7c2d12">orders-api-dev</text>
    <text x="650" y="487" fill="#9a3412">Auto-sync</text>

    <rect x="748" y="430" width="192" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="844" y="452" font-weight="700" fill="#14532d">demo-dev</text>
    <text x="844" y="470" font-family="Consolas,'D2Coding',monospace" fill="#166534">dev-orders-api</text>
    <text x="844" y="487" fill="#166534">dev.orders-api.example.test</text>
  </g>
  <line x1="190" y1="463" x2="198" y2="463" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="463" x2="380" y2="463" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554" y1="463" x2="562" y2="463" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="736" y1="463" x2="744" y2="463" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="536" text-anchor="middle" font-size="13" fill="#4c1d95">개발자가 한 일: 폼 입력 · 태그 push · PR 머지 — 나머지는 플랫폼이 표준대로 자동 처리</text>
</svg>
