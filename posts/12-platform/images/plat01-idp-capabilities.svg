<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">IDP의 구성 — 인터페이스 · 플랫폼 기능 · 인프라</text>

  <!-- Developer -->
  <rect x="60" y="54" width="840" height="40" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">개발자 (스트림 정렬 팀) — 서비스 생성 · DB 요청 · 배포 · 문서 조회를 셀프서비스로</text>
  <line x1="480" y1="96" x2="480" y2="114" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: interface -->
  <rect x="40" y="118" width="880" height="100" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="56" y="140" font-size="14" font-weight="700" fill="#4c1d95">① 인터페이스 — 포털 · API · CLI · Git</text>
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="152" width="200" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="160" y="175" font-weight="700" fill="#4c1d95">개발자 포털</text>
    <text x="160" y="195" font-size="12" fill="#5b21b6">Backstage (플랫폼 02)</text>
    <rect x="278" y="152" width="200" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="378" y="175" font-weight="700" fill="#4c1d95">골든 패스 템플릿</text>
    <text x="378" y="195" font-size="12" fill="#5b21b6">Software Template (03)</text>
    <rect x="496" y="152" width="200" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="596" y="175" font-weight="700" fill="#4c1d95">선언형 API</text>
    <text x="596" y="195" font-size="12" fill="#5b21b6">kubectl · XR (04)</text>
    <rect x="714" y="152" width="190" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="809" y="175" font-weight="700" fill="#4c1d95">Git PR</text>
    <text x="809" y="195" font-size="12" fill="#5b21b6">gitops-demo-config</text>
  </g>
  <line x1="480" y1="220" x2="480" y2="238" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: capabilities -->
  <rect x="40" y="242" width="880" height="180" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-dasharray="6 4"/>
  <text x="56" y="264" font-size="14" font-weight="700" fill="#4c1d95">② 플랫폼 기능 (CNCF Platforms White Paper의 capability)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="56" y="276" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="136" y="300" font-weight="700" fill="#0f172a">빌드·테스트 자동화</text>
    <text x="136" y="320" font-size="12" fill="#475569">GitHub Actions</text>
    <rect x="228" y="276" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="308" y="300" font-weight="700" fill="#0f172a">딜리버리 자동화</text>
    <text x="308" y="320" font-size="12" fill="#475569">Argo CD · Rollouts</text>
    <rect x="400" y="276" width="160" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="480" y="300" font-weight="700" fill="#4c1d95">인프라 프로비저닝 API</text>
    <text x="480" y="320" font-size="12" fill="#5b21b6">Crossplane (04)</text>
    <rect x="572" y="276" width="160" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="652" y="300" font-weight="700" fill="#4c1d95">클러스터 프로비저닝</text>
    <text x="652" y="320" font-size="12" fill="#5b21b6">Cluster API (05)</text>
    <rect x="744" y="276" width="160" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="824" y="300" font-weight="700" fill="#4c1d95">데이터 서비스</text>
    <text x="824" y="320" font-size="12" fill="#5b21b6">CloudNativePG (04)</text>

    <rect x="56" y="348" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="136" y="372" font-weight="700" fill="#0f172a">관측성</text>
    <text x="136" y="392" font-size="12" fill="#475569">Prometheus · OTel</text>
    <rect x="228" y="348" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="308" y="372" font-weight="700" fill="#0f172a">ID · 비밀</text>
    <text x="308" y="392" font-size="12" fill="#475569">Keycloak · ESO</text>
    <rect x="400" y="348" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="480" y="372" font-weight="700" fill="#0f172a">보안 · 정책</text>
    <text x="480" y="392" font-size="12" fill="#475569">Kyverno · Falco</text>
    <rect x="572" y="348" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="652" y="372" font-weight="700" fill="#0f172a">아티팩트 저장소</text>
    <text x="652" y="392" font-size="12" fill="#475569">GHCR · Harbor</text>
    <rect x="744" y="348" width="160" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="824" y="372" font-weight="700" fill="#4c1d95">비용 가시성</text>
    <text x="824" y="392" font-size="12" fill="#5b21b6">OpenCost (07)</text>
  </g>
  <line x1="480" y1="424" x2="480" y2="442" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: infra -->
  <rect x="40" y="446" width="880" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="468" font-size="14" font-weight="700" fill="#334155">③ 인프라</text>
  <g font-size="13" text-anchor="middle">
    <rect x="160" y="456" width="170" height="50" rx="8" fill="#dbeafe" stroke="#326ce5"/>
    <text x="245" y="486" fill="#1e3a8a">Kubernetes · kind</text>
    <rect x="345" y="456" width="170" height="50" rx="8" fill="#fee2e2" stroke="#ed1944"/>
    <text x="430" y="486" fill="#7f1d1d">OpenStack (Ch4)</text>
    <rect x="530" y="456" width="170" height="50" rx="8" fill="#fff4e5" stroke="#ff9900"/>
    <text x="615" y="486" fill="#7c2d12">AWS (클라우드 탭)</text>
    <rect x="715" y="456" width="190" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="810" y="486" fill="#334155">홈랩 서버 (H01~H03)</text>
  </g>

  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#64748b">보라 칸 = 이 탭에서 새로 만드는 것 · 회색 칸 = 본편 Chapter 1~9에서 이미 만든 것</text>
</svg>
