  <g font-family="Consolas,'D2Coding',monospace" font-size="13" text-anchor="middle" fill="#1e1b4b">
    <rect x="232" y="240" width="100" height="32" rx="6" fill="#c7d2fe"/><text x="282" y="261">catalog</text>
    <rect x="342" y="240" width="100" height="32" rx="6" fill="#c7d2fe"/><text x="392" y="261">scaffolder</text>
    <rect x="452" y="240" width="100" height="32" rx="6" fill="#c7d2fe"/><text x="502" y="261">auth</text>
    <rect x="562" y="240" width="100" height="32" rx="6" fill="#c7d2fe"/><text x="612" y="261">techdocs</text>
    <rect x="232" y="282" width="100" height="32" rx="6" fill="#e2e8f0"/><text x="282" y="303">search</text>
    <rect x="342" y="282" width="100" height="32" rx="6" fill="#e2e8f0"/><text x="392" y="303">kubernetes</text>
