  <line x1="676" y1="244" x2="726" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="676" y1="256" x2="726" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="676" y1="298" x2="726" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
