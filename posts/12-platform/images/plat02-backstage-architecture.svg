  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Backstage 아키텍처 — 앱 · 백엔드 플러그인 · DB · 통합</text>

  <!-- Browser -->
