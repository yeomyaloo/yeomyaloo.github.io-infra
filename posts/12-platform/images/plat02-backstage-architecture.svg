  <text x="445" y="340" text-anchor="middle" font-size="12" fill="#475569">포트 7007 · 운영에서는 app 플러그인이 프런트엔드 정적 파일도 서빙</text>
  <text x="445" y="358" text-anchor="middle" font-size="12" fill="#475569">health: /.backstage/health/v1/readiness · liveness</text>

  <rect x="216" y="378" width="458" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
