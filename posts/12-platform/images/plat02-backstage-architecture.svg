  <text x="90" y="238" text-anchor="middle" font-size="12" fill="#64748b">개발자 · 플랫폼 팀</text>
  <line x1="162" y1="220" x2="196" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

