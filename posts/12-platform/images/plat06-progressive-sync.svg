<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Progressive Sync (RollingSync) — dev가 Healthy여야 prod로</text>

  <!-- commit -->
  <rect x="20" y="120" width="140" height="80" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="90" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Git push</text>
  <text x="90" y="172" text-anchor="middle" font-size="12" fill="#7c2d12">새 이미지 태그</text>
  <text x="90" y="189" text-anchor="middle" font-size="12" fill="#7c2d12">(base 변경)</text>
  <line x1="160" y1="160" x2="198" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 1 -->
  <rect x="200" y="66" width="230" height="190" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="315" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1단계 env=dev</text>
  <text x="315" y="112" text-anchor="middle" font-size="12" fill="#64748b">maxUpdate 기본 100%</text>
  <g text-anchor="middle">
    <rect x="215" y="126" width="200" height="50" rx="6" fill="#ffffff" stroke="#326ce5"/>
    <text x="315" y="147" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">demo-app-dev-1</text>
    <text x="315" y="166" font-size="11" fill="#16a34a">Sync → Healthy</text>
    <rect x="215" y="186" width="200" height="50" rx="6" fill="#ffffff" stroke="#326ce5"/>
    <text x="315" y="207" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">demo-app-dev-2</text>
    <text x="315" y="226" font-size="11" fill="#16a34a">Sync → Healthy</text>
  </g>

  <!-- gate -->
  <line x1="430" y1="160" x2="446" y2="160" stroke="#334155" stroke-width="2"/>
  <polygon points="508,118 568,160 508,202 448,160" fill="#fde68a" stroke="#f59e0b"/>
  <text x="508" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">모두</text>
  <text x="508" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Healthy?</text>
  <text x="584" y="150" text-anchor="middle" font-size="12" fill="#16a34a">예</text>
  <line x1="568" y1="160" x2="598" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="600" y="66" width="340" height="190" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="770" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">2단계 env=prod</text>
  <text x="770" y="112" text-anchor="middle" font-size="12" fill="#64748b">maxUpdate: 1 → 한 번에 1개 클러스터</text>
  <g text-anchor="middle">
    <rect x="615" y="126" width="150" height="110" rx="6" fill="#ffffff" stroke="#6d28d9"/>
    <text x="690" y="152" font-size="13" font-weight="700" fill="#4c1d95">①</text>
    <text x="690" y="176" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">demo-app-</text>
    <text x="690" y="194" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">prod-1</text>
    <text x="690" y="220" font-size="11" fill="#16a34a">Healthy 후 다음</text>
    <rect x="775" y="126" width="150" height="110" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-dasharray="5 3"/>
    <text x="850" y="152" font-size="13" font-weight="700" fill="#4c1d95">②</text>
    <text x="850" y="176" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">demo-app-</text>
    <text x="850" y="194" font-family="Consolas,'D2Coding',monospace" font-size="12" fill="#0f172a">prod-2</text>
    <text x="850" y="220" font-size="11" fill="#64748b">(있다면)</text>
  </g>

  <!-- failure path -->
  <line x1="508" y1="202" x2="508" y2="278" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="522" y="236" font-size="12" fill="#dc2626">아니오</text>
  <rect x="300" y="280" width="420" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="510" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">prod 단계는 Waiting — prod는 그대로 안전</text>
  <text x="510" y="320" text-anchor="middle" font-size="12" fill="#991b1b">dev의 Degraded 원인(예: ImagePullBackOff)을 고치면 재개</text>

  <rect x="20" y="346" width="920" height="40" rx="8" fill="#f1f5f9"/>
  <text x="480" y="371" text-anchor="middle" font-size="13" fill="#334155">생성된 Application의 autosync는 꺼지고, ApplicationSet 컨트롤러가 단계별로 Sync를 트리거한다 (v3.3+ Beta)</text>
</svg>
