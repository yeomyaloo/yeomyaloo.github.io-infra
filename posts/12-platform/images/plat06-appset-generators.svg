<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ApplicationSet 생성기 조합 — matrix와 cluster generator</text>

  <!-- Row 1 -->
  <text x="20" y="70" font-size="15" font-weight="700" fill="#4c1d95">① matrix: list × clusters → cluster-addons</text>
  <rect x="20" y="84" width="220" height="130" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="130" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">list (애드온)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="34" y="120" width="192" height="34" rx="6" fill="#fde68a"/>
    <text x="130" y="142" fill="#78350f">gateway-api-crds</text>
    <rect x="34" y="164" width="192" height="34" rx="6" fill="#fde68a"/>
    <text x="130" y="186" fill="#78350f">prometheus-operator-crds</text>
  </g>
  <text x="265" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">×</text>
  <rect x="290" y="84" width="190" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <text x="385" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">clusters</text>
  <text x="385" y="120" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#64748b">provisioner=cluster-api</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12" text-anchor="middle">
    <rect x="305" y="130" width="160" height="30" rx="6" fill="#bfdbfe"/>
    <text x="385" y="150" fill="#1e3a8a">dev-1</text>
    <rect x="305" y="170" width="160" height="30" rx="6" fill="#bfdbfe"/>
    <text x="385" y="190" fill="#1e3a8a">prod-1</text>
  </g>
  <text x="502" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">=</text>
  <rect x="525" y="84" width="415" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="732" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Application 4개 (2 × 2)</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" text-anchor="middle">
    <rect x="537" y="114" width="190" height="44" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="632" y="132" fill="#1e1b4b">gateway-api-crds</text>
    <text x="632" y="149" fill="#6d28d9">@ dev-1</text>
    <rect x="739" y="114" width="190" height="44" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="834" y="132" fill="#1e1b4b">gateway-api-crds</text>
    <text x="834" y="149" fill="#6d28d9">@ prod-1</text>
    <rect x="537" y="164" width="190" height="44" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="632" y="182" fill="#1e1b4b">prometheus-operator-crds</text>
    <text x="632" y="199" fill="#6d28d9">@ dev-1</text>
    <rect x="739" y="164" width="190" height="44" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="834" y="182" fill="#1e1b4b">prometheus-operator-crds</text>
    <text x="834" y="199" fill="#6d28d9">@ prod-1</text>
  </g>

  <!-- Row 2 -->
  <text x="20" y="256" font-size="15" font-weight="700" fill="#4c1d95">② clusters + 라벨 템플릿 → demo-app</text>
  <rect x="20" y="270" width="290" height="130" rx="10" fill="#eff6ff" stroke="#326ce5"/>
  <text x="165" y="292" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#1e3a8a">clusters: env In [dev, prod]</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="12">
    <rect x="34" y="306" width="262" height="34" rx="6" fill="#bfdbfe"/>
    <text x="46" y="328" fill="#1e3a8a">dev-1   labels.env=dev</text>
    <rect x="34" y="350" width="262" height="34" rx="6" fill="#bfdbfe"/>
    <text x="46" y="372" fill="#1e3a8a">prod-1  labels.env=prod</text>
  </g>
  <line x1="310" y1="335" x2="338" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="270" width="270" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="475" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">template</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#0f172a">
    <text x="354" y="316" fill="#6d28d9">env := {{.metadata.labels.env}}</text>
    <text x="354" y="338">name: demo-app-{{.name}}</text>
    <text x="354" y="360">path: …/overlays/{{env}}</text>
    <text x="354" y="382">namespace: demo-{{env}}</text>
  </g>
  <line x1="610" y1="335" x2="638" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="270" width="300" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <g text-anchor="middle">
    <rect x="654" y="284" width="272" height="48" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="790" y="304" font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#1e1b4b">demo-app-dev-1</text>
    <text x="790" y="322" font-size="11" fill="#6d28d9">overlays/dev → demo-dev</text>
    <rect x="654" y="340" width="272" height="48" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="790" y="360" font-family="Consolas,'D2Coding',monospace" font-size="12" font-weight="700" fill="#1e1b4b">demo-app-prod-1</text>
    <text x="790" y="378" font-size="11" fill="#6d28d9">overlays/prod → demo-prod</text>
  </g>

  <text x="480" y="434" text-anchor="middle" font-size="14" fill="#334155">클러스터 Secret이 하나 늘면 두 ApplicationSet의 생성 결과도 함께 늘어난다</text>
</svg>
