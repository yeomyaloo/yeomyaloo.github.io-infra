<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Crossplane 핵심 개념 — 누가 무엇을 만드나</text>

  <!-- Developer XR -->
  <rect x="30" y="60" width="250" height="96" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="155" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">개발자 — XR (요청서)</text>
  <text x="155" y="106" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#78350f">PostgreSQLInstance</text>
  <text x="155" y="124" text-anchor="middle" font-size="13" font-family="Consolas,'D2Coding',monospace" fill="#78350f">orders-db (ns demo-dev)</text>
  <text x="155" y="144" text-anchor="middle" font-size="12" fill="#92400e">size: small · databaseName: orders</text>
  <line x1="282" y1="108" x2="326" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Crossplane core -->
  <rect x="330" y="60" width="300" height="96" rx="10" fill="#6d28d9"/>
  <text x="480" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Crossplane v2 (crossplane-system)</text>
  <text x="480" y="110" text-anchor="middle" font-size="13" fill="#ede9fe">XR 조정 루프: Composition 선택</text>
  <text x="480" y="130" text-anchor="middle" font-size="13" fill="#ede9fe">→ 함수 파이프라인 실행 → 결과를 적용</text>
  <line x1="632" y1="108" x2="676" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Composed resources -->
  <rect x="680" y="50" width="260" height="214" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="810" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">조합된 리소스 (demo-dev)</text>
  <g font-size="12">
    <rect x="696" y="86" width="228" height="34" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="708" y="108" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#14532d">Cluster orders-db (CNPG)</text>
    <rect x="696" y="128" width="228" height="34" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="708" y="150" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#14532d">ConfigMap ...-connection</text>
    <text x="708" y="184" fill="#166534">CNPG 오퍼레이터가 이어서 생성:</text>
    <text x="708" y="204" font-family="Consolas,'D2Coding',monospace" fill="#166534">Pod orders-db-1 + PVC</text>
    <text x="708" y="222" font-family="Consolas,'D2Coding',monospace" fill="#166534">Service orders-db-rw/ro/r</text>
    <text x="708" y="240" font-family="Consolas,'D2Coding',monospace" fill="#166534">Secret orders-db-app</text>
  </g>

  <!-- Platform team definitions -->
  <rect x="330" y="186" width="300" height="250" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-dasharray="6 4"/>
  <text x="480" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">플랫폼 팀이 정의하는 API</text>
  <g font-size="12">
    <rect x="346" y="222" width="268" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="358" y="241" font-size="13" font-weight="700" fill="#4c1d95">XRD — 스키마 (새 API 타입)</text>
    <text x="358" y="258" fill="#5b21b6">size: small|medium, databaseName</text>
    <rect x="346" y="274" width="268" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="358" y="293" font-size="13" font-weight="700" fill="#4c1d95">Composition — 구현 (Pipeline)</text>
    <text x="358" y="310" fill="#5b21b6">XR 하나 → CNPG Cluster + ConfigMap</text>
    <rect x="346" y="326" width="268" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="358" y="345" font-size="13" font-weight="700" fill="#4c1d95">Function — 렌더링 로직</text>
    <text x="358" y="362" fill="#5b21b6">function-go-templating v0.13.2</text>
    <rect x="346" y="378" width="268" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="358" y="397" font-size="13" font-weight="700" fill="#4c1d95">RBAC 집계 ClusterRole</text>
    <text x="358" y="414" fill="#5b21b6">aggregate-to-crossplane: "true"</text>
  </g>
  <line x1="480" y1="184" x2="480" y2="160" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- Provider / MR -->
  <rect x="30" y="186" width="250" height="250" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="155" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Provider · Managed Resource</text>
  <g font-size="12">
    <rect x="46" y="222" width="218" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="58" y="241" font-size="13" font-weight="700" fill="#0f172a">Provider</text>
    <text x="58" y="258" font-family="Consolas,'D2Coding',monospace" fill="#334155">provider-helm v1.5.0</text>
    <rect x="46" y="274" width="218" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="58" y="293" font-size="13" font-weight="700" fill="#0f172a">ClusterProviderConfig</text>
    <text x="58" y="310" fill="#334155">default · InjectedIdentity</text>
    <rect x="46" y="326" width="218" height="60" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="58" y="345" font-size="13" font-weight="700" fill="#0f172a">MR: Release</text>
    <text x="58" y="362" font-family="Consolas,'D2Coding',monospace" fill="#334155">cloudnative-pg 0.29.2</text>
    <text x="58" y="378" fill="#334155">helm.m.crossplane.io (v2 .m.)</text>
    <text x="58" y="420" fill="#64748b">외부 API(여기선 Helm)와 1:1</text>
  </g>
  <polyline points="266,370 300,370 300,446 652,446 652,330 676,330" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- CNPG operator -->
  <rect x="680" y="290" width="260" height="70" rx="10" fill="#dbeafe" stroke="#326ce5"/>
  <text x="810" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">CNPG 오퍼레이터 (cnpg-system)</text>
  <text x="810" y="340" text-anchor="middle" font-size="12" fill="#1e40af">Cluster CR을 보고 PostgreSQL 운영</text>
  <line x1="810" y1="288" x2="810" y2="268" stroke="#326ce5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="384" width="260" height="52" rx="10" fill="#fff4e5" stroke="#ff9900" stroke-dasharray="6 4"/>
  <text x="810" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">클라우드라면: provider-aws-rds</text>
  <text x="810" y="424" text-anchor="middle" font-size="12" fill="#9a3412">MR Instance (rds.aws.m.upbound.io)</text>

  <rect x="30" y="456" width="910" height="48" rx="8" fill="#ede9fe"/>
  <text x="485" y="485" text-anchor="middle" font-size="14" fill="#4c1d95">XR = 개발자의 요청서 · XRD = 스키마 · Composition + Function = 구현 · Provider/MR = 외부 API 어댑터</text>
</svg>
