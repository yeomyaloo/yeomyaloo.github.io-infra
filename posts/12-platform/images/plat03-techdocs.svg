<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">TechDocs — basic과 recommended 배포 방식</text>

  <!-- Row 1: basic -->
  <rect x="16" y="58" width="928" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="32" y="82" font-size="15" font-weight="700" fill="#334155">basic (기본 설정) — 백엔드가 요청 시 생성 · 개발/소규모</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="100" width="160" height="96" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="110" y="124" font-size="14" font-weight="700" fill="#0f172a">서비스 레포</text>
    <text x="110" y="146" font-family="Consolas,'D2Coding',monospace" fill="#334155">docs/index.md</text>
    <text x="110" y="164" font-family="Consolas,'D2Coding',monospace" fill="#334155">mkdocs.yml</text>
    <text x="110" y="182" fill="#64748b">techdocs-ref: dir:.</text>

    <rect x="215" y="100" width="345" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="387" y="124" font-size="14" font-weight="700" fill="#4c1d95">Backstage 백엔드 (techdocs 플러그인)</text>
    <text x="387" y="146" fill="#5b21b6">첫 Docs 탭 요청 때 레포를 받아 생성</text>
    <text x="387" y="164" font-family="Consolas,'D2Coding',monospace" fill="#5b21b6">builder: local · runIn: docker</text>
    <text x="387" y="182" fill="#5b21b6">(spotify/techdocs 컨테이너로 mkdocs build)</text>

    <rect x="585" y="100" width="160" height="96" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="665" y="124" font-size="14" font-weight="700" fill="#0f172a">로컬 디스크</text>
    <text x="665" y="146" font-family="Consolas,'D2Coding',monospace" fill="#334155">publisher: local</text>
    <text x="665" y="164" fill="#64748b">백엔드 Pod 안</text>
    <text x="665" y="182" fill="#64748b">(재시작 시 다시 생성)</text>

    <rect x="770" y="100" width="160" height="96" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="850" y="124" font-size="14" font-weight="700" fill="#14532d">엔터티 Docs 탭</text>
    <text x="850" y="146" fill="#166534">브라우저</text>
  </g>
  <line x1="192" y1="148" x2="211" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="148" x2="581" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="747" y1="148" x2="766" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: recommended -->
  <rect x="16" y="236" width="928" height="172" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="32" y="260" font-size="15" font-weight="700" fill="#4c1d95">recommended — CI가 생성·업로드, 백엔드는 읽기만 · 운영</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="278" width="160" height="108" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="110" y="302" font-size="14" font-weight="700" fill="#0f172a">서비스 레포</text>
    <text x="110" y="324" fill="#334155">docs 변경 push</text>

    <rect x="215" y="278" width="160" height="108" rx="8" fill="#ffffff" stroke="#334155"/>
    <text x="295" y="302" font-size="14" font-weight="700" fill="#0f172a">CI (Actions)</text>
    <text x="295" y="324" font-family="Consolas,'D2Coding',monospace" fill="#334155">techdocs-cli</text>
    <text x="295" y="342" font-family="Consolas,'D2Coding',monospace" fill="#334155">generate</text>
    <text x="295" y="360" font-family="Consolas,'D2Coding',monospace" fill="#334155">publish</text>

    <rect x="400" y="278" width="160" height="108" rx="8" fill="#fff4e5" stroke="#ff9900"/>
    <text x="480" y="302" font-size="14" font-weight="700" fill="#7c2d12">오브젝트 스토리지</text>
    <text x="480" y="324" fill="#9a3412">S3 · GCS · Azure Blob</text>
    <text x="480" y="342" fill="#9a3412">(클라우드 탭 S3)</text>

    <rect x="585" y="278" width="160" height="108" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="665" y="302" font-size="14" font-weight="700" fill="#4c1d95">Backstage 백엔드</text>
    <text x="665" y="324" font-family="Consolas,'D2Coding',monospace" fill="#5b21b6">builder: external</text>
    <text x="665" y="342" fill="#5b21b6">읽기만 함</text>
    <text x="665" y="360" fill="#5b21b6">Docker 불필요</text>

    <rect x="770" y="278" width="160" height="108" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="850" y="302" font-size="14" font-weight="700" fill="#14532d">엔터티 Docs 탭</text>
    <text x="850" y="324" fill="#166534">브라우저</text>
  </g>
  <line x1="192" y1="332" x2="211" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="377" y1="332" x2="396" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="332" x2="581" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="747" y1="332" x2="766" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="440" text-anchor="middle" font-size="13" fill="#475569">kind의 Backstage Pod에는 Docker가 없어 basic의 runIn: docker가 실패 → 로컬 yarn start로 확인하거나 recommended로</text>
</svg>
