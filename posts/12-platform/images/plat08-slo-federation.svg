<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">중앙 Prometheus로 클러스터별 SLO 모으기</text>

  <!-- dev-1 -->
  <rect x="20" y="56" width="330" height="150" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="185" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">dev-1</text>
  <rect x="36" y="94" width="140" height="96" rx="6" fill="#ffffff" stroke="#326ce5"/>
  <text x="106" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">dev-demo-app</text>
  <text x="106" y="140" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">/metrics</text>
  <text x="106" y="158" text-anchor="middle" font-size="11" fill="#64748b">ServiceMonitor</text>
  <text x="106" y="174" text-anchor="middle" font-size="11" fill="#64748b">(Day 58 base)</text>
  <rect x="196" y="94" width="140" height="96" rx="6" fill="#fde68a"/>
  <text x="266" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Prometheus</text>
  <text x="266" y="136" text-anchor="middle" font-size="12" fill="#78350f">에이전트 모드</text>
  <text x="266" y="158" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#78350f">cluster=dev-1</text>
  <text x="266" y="176" text-anchor="middle" font-size="11" fill="#78350f">규칙 평가 없음</text>
  <line x1="176" y1="142" x2="194" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- prod-1 -->
  <rect x="20" y="226" width="330" height="150" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
  <text x="185" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">prod-1</text>
  <rect x="36" y="264" width="140" height="96" rx="6" fill="#ffffff" stroke="#326ce5"/>
  <text x="106" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">prod-demo-app</text>
  <text x="106" y="310" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">/metrics</text>
  <text x="106" y="328" text-anchor="middle" font-size="11" fill="#64748b">ServiceMonitor</text>
  <text x="106" y="344" text-anchor="middle" font-size="11" fill="#64748b">(Day 58 base)</text>
  <rect x="196" y="264" width="140" height="96" rx="6" fill="#fde68a"/>
  <text x="266" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Prometheus</text>
  <text x="266" y="306" text-anchor="middle" font-size="12" fill="#78350f">에이전트 모드</text>
  <text x="266" y="328" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#78350f">cluster=prod-1</text>
  <text x="266" y="346" text-anchor="middle" font-size="11" fill="#78350f">규칙 평가 없음</text>
  <line x1="176" y1="312" x2="194" y2="312" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- remote write arrows -->
  <line x1="336" y1="142" x2="418" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="336" y1="312" x2="418" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="384" y="214" text-anchor="middle" font-size="11" fill="#64748b">remote</text>
  <text x="384" y="228" text-anchor="middle" font-size="11" fill="#64748b">write</text>

  <!-- platform-lab -->
  <rect x="420" y="56" width="520" height="328" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="680" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">platform-lab (monitoring)</text>
  <rect x="436" y="96" width="200" height="130" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="536" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">중앙 Prometheus</text>
  <text x="536" y="146" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#7c2d12">NodePort 30090</text>
  <text x="536" y="166" text-anchor="middle" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#7c2d12">/api/v1/write</text>
  <text x="536" y="190" text-anchor="middle" font-size="11" fill="#7c2d12">enableRemoteWrite</text>
  <text x="536" y="206" text-anchor="middle" font-size="11" fill="#7c2d12">Receiver: true</text>

  <rect x="656" y="96" width="268" height="130" rx="6" fill="#ffffff" stroke="#6d28d9"/>
  <text x="790" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">PrometheusRule platform-slo</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#1e1b4b">
    <text x="668" y="146">sum by (cluster, namespace)</text>
    <text x="668" y="168">cluster_namespace:</text>
    <text x="680" y="184">sli_availability:ratio_rate5m</text>
    <text x="668" y="204">cluster_namespace:</text>
    <text x="680" y="220">error_budget_burn_rate:1h</text>
  </g>
  <line x1="636" y1="160" x2="654" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- grafana panel -->
  <rect x="436" y="242" width="488" height="134" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="452" y="262" font-size="13" font-weight="700" fill="#0f172a">Grafana · platform-slo — 번 레이트 (1h)</text>
  <line x1="460" y1="346" x2="900" y2="346" stroke="#94a3b8"/>
  <line x1="460" y1="300" x2="900" y2="300" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="904" y="296" text-anchor="end" font-size="11" fill="#dc2626">14.4</text>
  <polyline points="460,340 520,338 580,339 640,336 700,320 740,288 780,276 820,274 860,276 900,275" fill="none" stroke="#326ce5" stroke-width="2.5"/>
  <polyline points="460,341 520,340 580,341 640,340 700,341 740,339 780,340 820,341 860,340 900,340" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="460" y="366" font-size="11" fill="#326ce5">— dev-1 / demo-dev ≈ 50 (장애 주입)</text>
  <text x="700" y="366" font-size="11" fill="#16a34a">— prod-1 / demo-prod ≈ 1</text>

  <rect x="20" y="394" width="920" height="30" rx="6" fill="#f1f5f9"/>
  <text x="480" y="414" text-anchor="middle" font-size="12" fill="#334155">워크로드 클러스터는 수집·전송만, 저장·규칙·대시보드는 중앙에서 — externalLabels의 cluster가 클러스터를 구분한다</text>
</svg>
