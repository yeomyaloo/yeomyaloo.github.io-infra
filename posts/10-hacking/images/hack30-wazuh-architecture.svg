<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">실습장 Wazuh 배치 — 관측 구역의 전용 VM 하나, 두 실습망의 에이전트</text>

  <!-- hacklab -->
  <rect x="20" y="58" width="340" height="372" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="36" y="84" font-size="15" font-weight="700" fill="#14532d">hacklab  10.10.10.0/24</text>

  <rect x="36" y="98" width="140" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="106" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Kali  .5</text>
  <text x="106" y="139" text-anchor="middle" font-size="11" fill="#475569">브라우저로 대시보드</text>

  <rect x="196" y="98" width="148" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Metasploitable .30</text>
  <text x="270" y="139" text-anchor="middle" font-size="11" fill="#64748b">에이전트 없음 (감시 불가)</text>

  <rect x="36" y="164" width="308" height="250" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="52" y="188" font-size="14" font-weight="700" fill="#14532d">docker-targets  .10  (에이전트 001)</text>
  <rect x="52" y="200" width="130" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="117" y="225" text-anchor="middle" font-size="12" fill="#14532d">DVWA .20 (ipvlan)</text>
  <rect x="198" y="200" width="130" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="263" y="225" text-anchor="middle" font-size="12" fill="#14532d">Juice Shop .21</text>
  <g font-size="12" fill="#334155">
    <text x="52" y="266" font-weight="700" fill="#0f172a">에이전트가 읽는 원천</text>
    <text x="60" y="288">· Apache 접근 로그 (파일로 꺼냄)</text>
    <text x="60" y="308">· auditd — www-exec · root-cmd · cron</text>
    <text x="60" y="328">· Suricata eve.json (스캔)</text>
    <text x="60" y="348">· docker-listener (docker exec)</text>
    <text x="60" y="368">· FIM — /etc/cron.d, /etc/sudoers.d</text>
    <text x="60" y="396" fill="#b91c1c">※ ipvlan 트래픽은 VM 방화벽을 안 거침</text>
  </g>

  <!-- wazuh VM -->
  <rect x="390" y="120" width="230" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="505" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">wazuh VM (관측 구역)</text>
  <text x="505" y="166" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">enp0s8 10.10.10.11</text>
  <text x="505" y="182" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#334155">enp0s9 10.10.20.11</text>
  <rect x="406" y="196" width="198" height="52" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="505" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">server (manager)</text>
  <text x="505" y="238" text-anchor="middle" font-size="11" fill="#334155">decoder → rule → 경보 · 1514/1515</text>
  <rect x="406" y="258" width="198" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="505" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">indexer · 9200</text>
  <rect x="406" y="308" width="198" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="505" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">dashboard · 443</text>
  <text x="505" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">ip_forward = 0 (라우터 아님)</text>
  <text x="505" y="392" text-anchor="middle" font-size="11" fill="#334155">ufw: 1514·1515 + Kali→443만</text>

  <!-- adlab -->
  <rect x="650" y="58" width="290" height="372" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="666" y="84" font-size="15" font-weight="700" fill="#3730a3">adlab  10.10.20.0/24</text>
  <rect x="666" y="100" width="258" height="80" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="682" y="124" font-size="13" font-weight="700" fill="#0f172a">DC01 .10  (Tier 0)</text>
  <text x="682" y="146" font-size="11" fill="#334155">Security(4624·4728·4769) + Sysmon</text>
  <text x="682" y="166" font-size="11" fill="#334155">에이전트 → 10.10.20.11</text>
  <rect x="666" y="192" width="258" height="80" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="682" y="216" font-size="13" font-weight="700" fill="#0f172a">SRV01 .20  (Tier 1)</text>
  <text x="682" y="238" font-size="11" fill="#334155">Security + Sysmon</text>
  <text x="682" y="258" font-size="11" fill="#334155">에이전트 → 10.10.20.11</text>
  <rect x="666" y="284" width="258" height="80" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="682" y="308" font-size="13" font-weight="700" fill="#0f172a">WS01 .21  (Tier 2)</text>
  <text x="682" y="330" font-size="11" fill="#334155">Security + Sysmon</text>
  <text x="682" y="350" font-size="11" fill="#334155">에이전트 → 10.10.20.11</text>
  <text x="666" y="400" font-size="11" fill="#475569">고급 감사 정책이 먼저 (해킹 25 6-1)</text>

  <!-- arrows -->
  <line x1="344" y1="300" x2="404" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="352" y="262" font-size="11" fill="#1e3a8a">1514</text>
  <line x1="664" y1="140" x2="606" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="664" y1="232" x2="606" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="664" y1="324" x2="606" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="622" y="190" font-size="11" fill="#1e3a8a">1514</text>
  <path d="M176,123 C260,60 470,70 500,118" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="300" y="70" font-size="11" fill="#334155">HTTPS 443</text>

  <!-- notes -->
  <rect x="20" y="448" width="920" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="474" font-size="14" font-weight="700" fill="#0f172a">배치 원칙</text>
  <g font-size="12" fill="#334155">
    <text x="40" y="500">① 두 망에 다리를 걸친 유일한 장비 → 포워딩 끔, 받는 포트 최소화, 해킹 31 RoE에서 범위 제외 자산</text>
    <text x="40" y="524">② 에이전트 버전 ≤ manager 버전 (4.14.10으로 고정), 설치·업데이트는 업데이트 모드에서만</text>
    <text x="40" y="548">③ 운영 환경이라면 SIEM은 공격 대상과 다른 관리망에 둔다 (해킹 10 3-0)</text>
    <text x="40" y="572">④ 호스트 RAM 16GB면 wazuh VM만 켜 두고 hacklab 세션과 AD 세션을 번갈아 실행</text>
  </g>
</svg>
