<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">룰 트리 읽기와 튜닝 — 부모에서 자식으로, 마지막 룰이 레벨을 정한다</text>

  <!-- left: web tree -->
  <text x="40" y="70" font-size="15" font-weight="700" fill="#0f172a">기본 룰 (0245-web_rules.xml)</text>
  <rect x="40" y="84" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="135" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">31100 · L0</text>
  <text x="135" y="125" text-anchor="middle" font-size="11" fill="#475569">웹 접근 로그 묶음</text>

  <rect x="40" y="176" width="190" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">31101 · L5</text>
  <text x="135" y="217" text-anchor="middle" font-size="11" fill="#475569">4xx 응답 한 건</text>

  <rect x="40" y="268" width="190" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="135" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">31151 · L10</text>
  <text x="135" y="308" text-anchor="middle" font-size="11" fill="#475569">같은 출발지 4xx 다발</text>
  <text x="135" y="324" text-anchor="middle" font-size="11" fill="#475569">frequency · timeframe</text>

  <rect x="260" y="176" width="190" height="52" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="355" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">31103 · L7</text>
  <text x="355" y="217" text-anchor="middle" font-size="11" fill="#475569">url에 SQLi 토큰</text>

  <rect x="260" y="268" width="190" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="355" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">31106 · L6</text>
  <text x="355" y="308" text-anchor="middle" font-size="11" fill="#475569">공격 모양 요청에 200</text>
  <text x="355" y="324" text-anchor="middle" font-size="11" fill="#475569">(성공했다는 뜻 아님)</text>

  <line x1="135" y1="136" x2="135" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="136" x2="330" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="135" y1="228" x2="135" y2="264" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="142" y="252" font-size="10" fill="#475569">if_matched_sid</text>
  <line x1="355" y1="228" x2="355" y2="264" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="362" y="252" font-size="10" fill="#475569">if_sid</text>

  <!-- right: audit tree with custom -->
  <text x="510" y="70" font-size="15" font-weight="700" fill="#0f172a">기본 + 커스텀 (local_rules.xml)</text>
  <rect x="600" y="84" width="230" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="715" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">80700 · L0</text>
  <text x="715" y="125" text-anchor="middle" font-size="11" fill="#475569">audit 메시지 묶음 (여기서 멈추면 기록만)</text>

  <rect x="600" y="176" width="230" height="52" rx="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <text x="715" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">100210 · L12</text>
  <text x="715" y="217" text-anchor="middle" font-size="11" fill="#7f1d1d">audit.key = www-exec</text>

  <rect x="510" y="268" width="200" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="610" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">100212 · L0 (튜닝)</text>
  <text x="610" y="308" text-anchor="middle" font-size="11" fill="#475569">dash + 인자가 정확히</text>
  <text x="610" y="324" text-anchor="middle" font-size="11" fill="#475569">"ping -c 4 IPv4"</text>

  <rect x="730" y="268" width="200" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="830" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">100213 · L0 (튜닝)</text>
  <text x="830" y="308" text-anchor="middle" font-size="11" fill="#475569">exe = ping</text>
  <text x="830" y="324" text-anchor="middle" font-size="11" fill="#475569">(DVWA 정상 기능)</text>

  <line x1="715" y1="136" x2="715" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="228" x2="620" y2="264" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="228" x2="815" y2="264" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="358" font-size="12" fill="#334155">튜닝 룰에 안 맞는 실행(인자 뒤에 무엇이 덧붙음) → 100210 그대로 L12 경보</text>

  <!-- sibling trap -->
  <rect x="40" y="378" width="880" height="72" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="402" font-size="14" font-weight="700" fill="#9a3412">⚠ 형제 룰 함정</text>
  <text x="60" y="424" font-size="12" fill="#334155">같은 부모 밑에서는 먼저 로드된 자식이 먼저 맞으면 그쪽으로 내려간다. 커스텀은 나중에 로드되므로 평가조차 안 될 수 있다.</text>
  <text x="60" y="442" font-size="12" fill="#334155">→ logtest Phase 3에 우리 ID가 나오는지 확인. 아니면 더 깊은 기본 룰을 if_sid로, 또는 if_group으로 부모를 지정</text>

  <!-- level scale -->
  <text x="40" y="480" font-size="13" font-weight="700" fill="#0f172a">이 실습장의 레벨 기준</text>
  <rect x="40" y="490" width="150" height="44" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">0</text>
  <text x="115" y="526" text-anchor="middle" font-size="11" fill="#475569">묶음·튜닝(경보 아님)</text>
  <rect x="200" y="490" width="170" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="285" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">3 ~ 5</text>
  <text x="285" y="526" text-anchor="middle" font-size="11" fill="#475569">참고</text>
  <rect x="380" y="490" width="170" height="44" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="465" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">7 ~ 9</text>
  <text x="465" y="526" text-anchor="middle" font-size="11" fill="#475569">확인 필요</text>
  <rect x="560" y="490" width="170" height="44" rx="6" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="645" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">10 ~ 12</text>
  <text x="645" y="526" text-anchor="middle" font-size="11" fill="#7f1d1d">즉시 확인</text>
  <rect x="740" y="490" width="180" height="44" rx="6" fill="#b91c1c" stroke="#7f1d1d"/>
  <text x="830" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">13 ~ 15</text>
  <text x="830" y="526" text-anchor="middle" font-size="11" fill="#ffffff">사고 선언 후보</text>
</svg>
