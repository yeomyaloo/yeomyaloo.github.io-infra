<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">같은 로그인, 캡처에 보이는 것 — 평문 HTTP vs TLS</text>

  <!-- Left: HTTP -->
  <rect x="20" y="58" width="450" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">평문 HTTP — 10.10.10.21:3000</text>

  <rect x="20" y="116" width="450" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="36" y="144" font-size="14" font-weight="700" fill="#334155">IP</text>
  <text x="80" y="144" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">10.10.10.5 → 10.10.10.21</text>
  <text x="454" y="144" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">보임</text>

  <rect x="20" y="168" width="450" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="36" y="196" font-size="14" font-weight="700" fill="#334155">TCP</text>
  <text x="80" y="196" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">51522 → 3000</text>
  <text x="454" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">보임</text>

  <rect x="20" y="220" width="450" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="36" y="246" font-size="14" font-weight="700" fill="#b91c1c">HTTP 요청</text>
  <text x="454" y="246" text-anchor="end" font-size="12" font-weight="700" fill="#dc2626">전부 노출</text>
  <g font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">
    <text x="36" y="272">POST /rest/user/login HTTP/1.1</text>
    <text x="36" y="294">Host: 10.10.10.21:3000</text>
    <text x="36" y="316">Content-Type: application/json</text>
    <text x="36" y="342">{"email":"student@hacklab.test",</text>
    <text x="36" y="364" font-weight="700" fill="#dc2626"> "password":"Lab-Only-Pass-21"}</text>
  </g>

  <!-- Right: TLS -->
  <rect x="490" y="58" width="450" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">TLS 1.3 — 10.10.10.22:443</text>

  <rect x="490" y="116" width="450" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="506" y="144" font-size="14" font-weight="700" fill="#334155">IP</text>
  <text x="550" y="144" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">10.10.10.5 → 10.10.10.22</text>
  <text x="924" y="144" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">보임</text>

  <rect x="490" y="168" width="450" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="506" y="196" font-size="14" font-weight="700" fill="#334155">TCP</text>
  <text x="550" y="196" font-size="13" fill="#334155" font-family="Consolas,'D2Coding',monospace">51530 → 443</text>
  <text x="924" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">보임</text>

  <rect x="490" y="220" width="450" height="160" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="506" y="246" font-size="14" font-weight="700" fill="#334155">TLS Application Data</text>
  <text x="924" y="246" text-anchor="end" font-size="12" font-weight="700" fill="#16a34a">암호화됨</text>
  <g font-size="13" fill="#94a3b8" font-family="Consolas,'D2Coding',monospace">
    <text x="506" y="274">17 03 03 00 9a 4f e1 7c 2b d0 83 5e</text>
    <text x="506" y="296">a9 11 c4 6e 3b 0f 72 d8 e5 19 6a c2</text>
    <text x="506" y="318">5d 88 f0 2e 47 b6 0c 91 7a 33 de 04</text>
  </g>
  <text x="506" y="350" font-size="13" fill="#334155">경로 · 본문 · 쿠키 · 응답 토큰 모두 가려짐</text>
  <text x="506" y="370" font-size="12" fill="#64748b">남는 것: IP · 포트 · SNI(도메인 접속 시) · 크기 · 시간</text>

  <!-- Bottom -->
  <rect x="20" y="400" width="450" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">같은 L2 · 경로 중간의 누구나</text>
  <text x="245" y="458" text-anchor="middle" font-size="13" fill="#334155">비밀번호와 로그인 토큰을 그대로 읽는다</text>

  <rect x="490" y="400" width="450" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="715" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">내용은 안전 — 단, 인증서를 검증할 때만</text>
  <text x="715" y="458" text-anchor="middle" font-size="13" fill="#334155">-k · verify=False면 중간자는 막지 못함 (해킹 22)</text>
</svg>
