<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">퍼플팀 하루 — 세 개의 모자를 시간으로 나눠 쓴다</text>

  <!-- time axis -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <line x1="150" y1="66" x2="930" y2="66" stroke="#cbd5e1"/>
    <text x="150" y="60">09:00</text>
    <text x="237" y="60">10:00</text>
    <text x="323" y="60">11:00</text>
    <text x="410" y="60">12:00</text>
    <text x="497" y="60">13:00</text>
    <text x="583" y="60">14:00</text>
    <text x="670" y="60">15:00</text>
    <text x="757" y="60">16:00</text>
    <text x="843" y="60">17:00</text>
    <text x="930" y="60">18:00</text>
  </g>
  <g stroke="#e2e8f0" stroke-dasharray="3 4">
    <line x1="237" y1="70" x2="237" y2="384"/>
    <line x1="323" y1="70" x2="323" y2="384"/>
    <line x1="410" y1="70" x2="410" y2="384"/>
    <line x1="497" y1="70" x2="497" y2="384"/>
    <line x1="583" y1="70" x2="583" y2="384"/>
    <line x1="670" y1="70" x2="670" y2="384"/>
    <line x1="843" y1="70" x2="843" y2="384"/>
  </g>

  <!-- lane labels -->
  <g font-size="14" font-weight="700">
    <rect x="20" y="80" width="118" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="79" y="115" text-anchor="middle" fill="#334155">화이트셀</text>
    <rect x="20" y="160" width="118" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="79" y="195" text-anchor="middle" fill="#991b1b">레드</text>
    <rect x="20" y="240" width="118" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="79" y="275" text-anchor="middle" fill="#1e3a8a">블루</text>
    <rect x="20" y="320" width="118" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="79" y="355" text-anchor="middle" fill="#5b21b6">함께 (퍼플)</text>
  </g>

  <!-- lunch -->
  <rect x="453" y="80" width="87" height="300" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="496" y="100" text-anchor="middle" font-size="12" fill="#94a3b8">점심</text>

  <!-- white cell -->
  <rect x="150" y="84" width="43" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="171" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">RoE</text>
  <text x="171" y="124" text-anchor="middle" font-size="10" fill="#334155">스냅샷</text>
  <polygon points="280,96 290,110 280,124 270,110" fill="#f59e0b"/>
  <text x="296" y="114" font-size="11" fill="#78350f">주입 1</text>
  <polygon points="345,96 355,110 345,124 335,110" fill="#f59e0b"/>
  <text x="361" y="114" font-size="11" fill="#78350f">주입 2</text>
  <text x="560" y="114" font-size="12" fill="#334155">진행·심판 · 비상 중단 판단 (하루 내내)</text>

  <!-- red -->
  <rect x="193" y="164" width="87" height="52" rx="6" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="236" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">R1</text>
  <text x="236" y="204" text-anchor="middle" font-size="11" fill="#7f1d1d">초기 침투</text>
  <rect x="280" y="164" width="65" height="52" rx="6" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="312" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">R2</text>
  <text x="312" y="204" text-anchor="middle" font-size="11" fill="#7f1d1d">권한 상승</text>
  <rect x="345" y="164" width="65" height="52" rx="6" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="377" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">R3</text>
  <text x="377" y="204" text-anchor="middle" font-size="11" fill="#7f1d1d">내부 이동</text>
  <rect x="410" y="164" width="43" height="52" rx="6" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="431" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">R4</text>
  <text x="431" y="204" text-anchor="middle" font-size="11" fill="#7f1d1d">목표</text>

  <!-- red log arrow -->
  <path d="M431,216 L431,310 L800,310 L800,320" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="470" y="232" font-size="11" fill="#991b1b">레드 행위 로그(UTC) = 정답지 → 보고 단계 전까지 블루는 보지 않음</text>

  <!-- blue -->
  <rect x="540" y="244" width="100" height="52" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="590" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">B1</text>
  <text x="590" y="284" text-anchor="middle" font-size="11" fill="#1e3a8a">Wazuh 탐지</text>
  <rect x="640" y="244" width="60" height="52" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="670" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">B2</text>
  <text x="670" y="284" text-anchor="middle" font-size="11" fill="#1e3a8a">타임라인</text>
  <rect x="700" y="244" width="57" height="52" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="728" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">B3</text>
  <text x="728" y="284" text-anchor="middle" font-size="11" fill="#1e3a8a">격리·복구</text>

  <!-- joint -->
  <rect x="757" y="324" width="130" height="52" rx="6" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="822" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">보고 · 대조</text>
  <text x="822" y="364" text-anchor="middle" font-size="11" fill="#4c1d95">커버리지 표</text>
  <rect x="887" y="324" width="43" height="52" rx="6" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="908" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">회고</text>

  <!-- note -->
  <rect x="20" y="400" width="910" height="56" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="38" y="423" font-size="12" fill="#334155">주입(inject) = 앞 단계가 막혀도 다음 단계를 잴 수 있게 화이트셀이 시작점을 주는 것(가정된 침해). 보고서에 "주입"으로 표시한다.</text>
  <text x="38" y="443" font-size="12" fill="#334155">혼자 하는 연습은 레드·블루가 시간상 떨어져 t1→t2가 길게 나온다 — 연습 설계 때문인 숫자와 체계의 공백을 구분해서 쓴다.</text>
</svg>
