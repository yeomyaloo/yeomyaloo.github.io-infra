<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AD 구조 — 포리스트 · 도메인 · OU · GPO</text>

  <!-- 포리스트 -->
  <rect x="30" y="60" width="640" height="450" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="88" font-size="15" font-weight="700" fill="#334155">포리스트 (최상위 보안 경계)</text>

  <!-- 도메인 -->
  <rect x="55" y="104" width="590" height="388" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="132" font-size="16" font-weight="700" fill="#1e3a8a">도메인 ad.hacklab.test (NetBIOS: HACKLAB)</text>

  <!-- DC -->
  <rect x="75" y="150" width="250" height="72" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="200" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">DC01 · 10.10.20.10</text>
  <text x="200" y="198" text-anchor="middle" font-size="13" fill="#334155">NTDS.dit · Kerberos KDC · DNS</text>
  <text x="200" y="214" text-anchor="middle" font-size="12" fill="#991b1b">Tier 0</text>

  <!-- 특권 그룹 -->
  <rect x="345" y="150" width="280" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="485" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">특권 그룹</text>
  <text x="485" y="198" text-anchor="middle" font-size="13" fill="#334155">Domain · Enterprise · Schema Admins</text>
  <text x="485" y="214" text-anchor="middle" font-size="12" fill="#78350f">멤버 최소화 · 변경 시 즉시 알림</text>

  <!-- OU들 -->
  <text x="75" y="256" font-size="14" font-weight="700" fill="#1e3a8a">OU (객체 폴더 · GPO 연결 · 권한 위임 단위)</text>
  <rect x="75" y="270" width="130" height="92" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="140" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">OU=Tier0</text>
  <text x="140" y="318" text-anchor="middle" font-size="12" fill="#334155">t0 관리자</text>
  <text x="140" y="336" text-anchor="middle" font-size="12" fill="#334155">PAW</text>

  <rect x="219" y="270" width="130" height="92" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="284" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">OU=Tier1</text>
  <text x="284" y="318" text-anchor="middle" font-size="12" fill="#334155">SRV01</text>
  <text x="284" y="336" text-anchor="middle" font-size="12" fill="#334155">t1 관리자</text>

  <rect x="363" y="270" width="130" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="428" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">OU=Tier2</text>
  <text x="428" y="318" text-anchor="middle" font-size="12" fill="#334155">WS01 · 직원</text>
  <text x="428" y="336" text-anchor="middle" font-size="12" fill="#334155">헬프데스크</text>

  <rect x="507" y="270" width="118" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="566" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">ServiceAccounts</text>
  <text x="566" y="318" text-anchor="middle" font-size="12" fill="#334155">gMSA</text>
  <text x="566" y="336" text-anchor="middle" font-size="12" fill="#334155">SPN 계정</text>

  <!-- 도메인 GPO 박스 (도메인 내부 하단) -->
  <rect x="75" y="392" width="550" height="82" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="350" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">도메인에 연결된 GPO (모든 OU가 상속)</text>
  <text x="350" y="440" text-anchor="middle" font-size="13" fill="#334155">비밀번호 정책 · 고급 감사 정책 · LLMNR 끄기 · LM 인증 수준 5</text>
  <text x="350" y="460" text-anchor="middle" font-size="12" fill="#15803d">하위 OU의 GPO가 나중에 적용되어 덮어쓸 수 있음</text>

  <!-- 오른쪽: OU 단위 GPO -->
  <rect x="700" y="104" width="230" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="815" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">GPO: Tier2 LAPS</text>
  <text x="815" y="152" text-anchor="middle" font-size="12" fill="#334155">PC마다 다른 로컬</text>
  <text x="815" y="170" text-anchor="middle" font-size="12" fill="#334155">관리자 비밀번호</text>
  <text x="815" y="194" text-anchor="middle" font-size="12" fill="#15803d">OU=Tier2에 연결</text>

  <rect x="700" y="232" width="230" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="815" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">GPO: 로그온 제한</text>
  <text x="815" y="280" text-anchor="middle" font-size="12" fill="#334155">상위 계층 관리자의</text>
  <text x="815" y="298" text-anchor="middle" font-size="12" fill="#334155">로컬·RDP 로그온 거부</text>
  <text x="815" y="322" text-anchor="middle" font-size="12" fill="#15803d">Tier1·Tier2 OU에 연결</text>

  <g stroke="#15803d" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <path d="M700,180 Q600,240 470,268"/>
    <path d="M700,300 L650,377 L284,377 L284,368"/>
  </g>

  <!-- 적용 순서 -->
  <rect x="700" y="372" width="230" height="138" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="815" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">GPO 적용 순서 (LSDOU)</text>
  <text x="815" y="424" text-anchor="middle" font-size="13" fill="#334155">로컬 → 사이트 → 도메인 → OU</text>
  <text x="815" y="446" text-anchor="middle" font-size="12" fill="#334155">나중에 적용된 것이 이김</text>
  <text x="815" y="470" text-anchor="middle" font-size="12" fill="#b91c1c">GPO 편집 권한 = 그 OU 전체 PC</text>
  <text x="815" y="488" text-anchor="middle" font-size="12" fill="#b91c1c">를 바꿀 수 있는 권한</text>
</svg>
