<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">의존성·시크릿 점검이 걸리는 위치</text>

  <!-- ① 커밋 전 -->
  <rect x="20" y="70" width="166" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="103" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">① 커밋 전</text>
  <text x="103" y="124" text-anchor="middle" font-size="13" fill="#334155">개발자 PC</text>
  <text x="103" y="152" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">pre-commit</text>
  <text x="103" y="172" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">gitleaks --staged</text>
  <text x="103" y="210" text-anchor="middle" font-size="12" fill="#b45309">--no-verify로 건너뜀</text>

  <!-- ② 푸시 -->
  <rect x="206" y="70" width="166" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="289" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">② 푸시 시점</text>
  <text x="289" y="124" text-anchor="middle" font-size="13" fill="#334155">GitHub 서버</text>
  <text x="289" y="152" text-anchor="middle" font-size="13" fill="#0f172a">push protection</text>
  <text x="289" y="172" text-anchor="middle" font-size="13" fill="#0f172a">(secret scanning)</text>
  <text x="289" y="210" text-anchor="middle" font-size="12" fill="#b45309">지원 패턴만 차단</text>

  <!-- ③ PR CI -->
  <rect x="392" y="70" width="166" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="475" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">③ PR 머지 전</text>
  <text x="475" y="124" text-anchor="middle" font-size="13" fill="#334155">GitHub Actions</text>
  <text x="475" y="152" text-anchor="middle" font-size="13" fill="#0f172a">OSV-Scanner (SCA)</text>
  <text x="475" y="172" text-anchor="middle" font-size="13" fill="#0f172a">gitleaks (CI)</text>
  <text x="475" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">우회할 수 없는 관문</text>

  <!-- ④ 빌드 -->
  <rect x="578" y="70" width="166" height="160" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="661" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">④ 이미지 빌드</text>
  <text x="661" y="124" text-anchor="middle" font-size="13" fill="#334155">main · 태그 push</text>
  <text x="661" y="152" text-anchor="middle" font-size="13" fill="#0f172a">Trivy 이미지 스캔</text>
  <text x="661" y="172" text-anchor="middle" font-size="13" fill="#0f172a">SBOM · cosign 서명</text>
  <text x="661" y="210" text-anchor="middle" font-size="12" fill="#4338ca">Day 57 (반복 안 함)</text>

  <!-- ⑤ 운영 -->
  <rect x="764" y="70" width="176" height="160" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="852" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">⑤ 운영 중</text>
  <text x="852" y="124" text-anchor="middle" font-size="13" fill="#334155">이미 배포된 버전</text>
  <text x="852" y="152" text-anchor="middle" font-size="13" fill="#0f172a">새 CVE 공개</text>
  <text x="852" y="172" text-anchor="middle" font-size="13" fill="#0f172a">→ Dependabot alert</text>
  <text x="852" y="210" text-anchor="middle" font-size="12" fill="#b91c1c">KEV·EPSS로 우선순위</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="186" y1="150" x2="203" y2="150" marker-end="url(#arrow)"/>
    <line x1="372" y1="150" x2="389" y2="150" marker-end="url(#arrow)"/>
    <line x1="558" y1="150" x2="575" y2="150" marker-end="url(#arrow)"/>
    <line x1="744" y1="150" x2="761" y2="150" marker-end="url(#arrow)"/>
  </g>

  <!-- Dependabot loop -->
  <rect x="392" y="290" width="548" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="666" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Dependabot — 의존성 갱신 PR을 ③으로 보낸다</text>
  <text x="666" y="346" text-anchor="middle" font-size="13" fill="#334155">security updates: 권고 나오면 즉시 · version updates: 주기적, cooldown 7일</text>
  <g stroke="#f59e0b" stroke-width="2.5" fill="none">
    <path d="M852,230 L852,286" marker-end="url(#arrow)"/>
    <path d="M475,290 L475,234" marker-end="url(#arrow)"/>
  </g>
  <text x="862" y="264" font-size="12" fill="#92400e">alert</text>
  <text x="485" y="264" font-size="12" fill="#92400e">PR</text>

  <!-- footer -->
  <rect x="20" y="290" width="350" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="195" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">왼쪽일수록 싸고 빠르다</text>
  <text x="195" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">오른쪽일수록 확실하다</text>
  <text x="480" y="410" text-anchor="middle" font-size="13" fill="#64748b">세 겹(커밋 전 · 푸시 · CI) 중 어느 하나만으로는 부족하다 — 최종 관문은 CI</text>
</svg>
