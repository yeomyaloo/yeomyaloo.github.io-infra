<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">동일 출처 정책과 CORS — 요청은 나가고, 읽기를 막는다</text>

  <!-- ===== left: origin compare ===== -->
  <rect x="20" y="58" width="420" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="230" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">출처 = 스킴 + 호스트 + 포트</text>
  <text x="36" y="114" font-size="12" fill="#64748b">기준 페이지</text>
  <rect x="36" y="122" width="388" height="30" rx="6" fill="#dbeafe" stroke="#2496ed"/>
  <text x="50" y="142" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">https://app.demo.example.test</text>

  <g font-size="12">
    <rect x="36" y="168" width="388" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="48" y="192" font-family="Consolas,'D2Coding',monospace" fill="#14532d">https://app.demo.example.test/a</text>
    <text x="414" y="192" text-anchor="end" font-weight="700" fill="#14532d">같은 출처</text>

    <rect x="36" y="212" width="388" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="48" y="236" font-family="Consolas,'D2Coding',monospace" fill="#7f1d1d">http://app.demo.example.test</text>
    <text x="414" y="236" text-anchor="end" font-weight="700" fill="#7f1d1d">다른 출처 (스킴)</text>

    <rect x="36" y="256" width="388" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="48" y="280" font-family="Consolas,'D2Coding',monospace" fill="#92400e">https://api.demo.example.test</text>
    <text x="414" y="273" text-anchor="end" font-weight="700" fill="#92400e">다른 출처</text>
    <text x="414" y="288" text-anchor="end" font-size="11" fill="#92400e">같은 사이트</text>

    <rect x="36" y="300" width="388" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="48" y="324" font-family="Consolas,'D2Coding',monospace" fill="#7f1d1d">https://app.demo.example.test:8443</text>
    <text x="414" y="324" text-anchor="end" font-weight="700" fill="#7f1d1d">다른 출처 (포트)</text>
  </g>

  <!-- ===== right: CORS sequence ===== -->
  <rect x="460" y="58" width="480" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="700" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">허용된 출처의 CORS 요청</text>

  <rect x="480" y="100" width="130" height="40" rx="8" fill="#dbeafe" stroke="#2496ed"/>
  <text x="545" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">브라우저</text>
  <text x="545" y="133" text-anchor="middle" font-size="11" fill="#1e3a8a">app 페이지의 스크립트</text>
  <rect x="790" y="100" width="130" height="40" rx="8" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="855" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">API 서버</text>

  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="545" y1="140" x2="545" y2="344"/>
    <line x1="855" y1="140" x2="855" y2="344"/>
  </g>

  <g font-size="11" font-family="Consolas,'D2Coding',monospace">
    <text x="556" y="164" fill="#334155">1) OPTIONS /api/me (preflight)</text>
    <text x="556" y="178" fill="#334155">Origin: https://app…</text>
    <line x1="548" y1="186" x2="851" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="844" y="208" text-anchor="end" fill="#15803d">2) 204  Allow-Origin: https://app…</text>
    <text x="844" y="222" text-anchor="end" fill="#15803d">Allow-Credentials: true · Vary: Origin</text>
    <line x1="852" y1="230" x2="549" y2="230" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <text x="556" y="254" fill="#334155">3) PATCH /api/me  (쿠키 포함)</text>
    <line x1="548" y1="262" x2="851" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="844" y="284" text-anchor="end" fill="#15803d">4) 200  Allow-Origin: https://app…</text>
    <line x1="852" y1="292" x2="549" y2="292" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>
  <rect x="480" y="306" width="440" height="38" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="700" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">출처가 허용 목록에 있으므로 스크립트가 응답을 읽음</text>

  <!-- ===== bottom: SOP summary ===== -->
  <text x="20" y="390" font-size="15" font-weight="700" fill="#0f172a">허용 목록에 없는 출처의 페이지라면?</text>
  <g font-size="13">
    <rect x="20" y="402" width="296" height="104" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="36" y="428" font-weight="700" fill="#92400e">요청 보내기 → 나간다</text>
    <text x="36" y="452" fill="#92400e">SOP는 전송을 막지 않음</text>
    <text x="36" y="474" fill="#92400e">쿠키 첨부는 SameSite가 결정</text>
    <text x="36" y="496" fill="#92400e">→ CSRF는 따로 막는다 (3장)</text>

    <rect x="332" y="402" width="296" height="104" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="348" y="428" font-weight="700" fill="#14532d">응답 읽기 → 브라우저가 차단</text>
    <text x="348" y="452" fill="#14532d">Allow-Origin이 없거나 다르면</text>
    <text x="348" y="474" fill="#14532d">스크립트에 응답을 넘기지 않음</text>
    <text x="348" y="496" fill="#14532d">CORS는 이 차단을 "푸는" 규칙</text>

    <rect x="644" y="402" width="296" height="104" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="660" y="428" font-weight="700" fill="#7f1d1d">⚠ 서버가 Origin을 반사하면</text>
    <text x="660" y="452" fill="#7f1d1d">+ Allow-Credentials: true</text>
    <text x="660" y="474" fill="#7f1d1d">→ 어느 사이트든 응답을 읽음</text>
    <text x="660" y="496" fill="#7f1d1d">(Starlette의 * + credentials)</text>
  </g>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#334155">CORS는 인가가 아니다 — curl·서버 간 호출에는 적용되지 않으므로 서버 인가(해킹 16)는 별도로</text>
</svg>
