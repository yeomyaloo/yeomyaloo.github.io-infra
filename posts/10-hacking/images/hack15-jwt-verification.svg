<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">JWT 검증 — decode가 아니라 7단계 verify</text>

  <!-- token -->
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#64748b">Base64URL 인코딩 — 누구나 읽을 수 있음</text>
  <text x="790" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">신뢰의 유일한 근거</text>
  <rect x="20" y="72" width="200" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="120" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">헤더</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">alg · kid · typ</text>
  <text x="232" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">.</text>
  <rect x="244" y="72" width="420" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="454" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">페이로드 (클레임)</text>
  <text x="454" y="112" text-anchor="middle" font-size="11" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">iss · aud · sub · exp · iat · groups · scope</text>
  <text x="676" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">.</text>
  <rect x="688" y="72" width="252" height="50" rx="6" fill="#dbeafe" stroke="#2496ed"/>
  <text x="814" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">서명</text>
  <text x="814" y="112" text-anchor="middle" font-size="11" fill="#1e3a8a">발급자 개인키로 헤더+페이로드에</text>

  <!-- 7 steps: x = 20 + i*132, w=122 -->
  <rect x="20" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="81" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">① 알고리즘</text>
  <text x="81" y="194" text-anchor="middle" font-size="12" fill="#14532d">서버가 고정</text>
  <text x="81" y="212" text-anchor="middle" font-size="11" fill="#14532d" font-family="Consolas,'D2Coding',monospace">RS256</text>

  <rect x="152" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="213" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">② 키 선택</text>
  <text x="213" y="194" text-anchor="middle" font-size="12" fill="#14532d">kid → 신뢰한</text>
  <text x="213" y="212" text-anchor="middle" font-size="12" fill="#14532d">JWKS에서</text>

  <rect x="284" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="345" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">③ 서명</text>
  <text x="345" y="194" text-anchor="middle" font-size="12" fill="#14532d">공개키로</text>
  <text x="345" y="212" text-anchor="middle" font-size="12" fill="#14532d">검증</text>

  <rect x="416" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="477" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">④ iss</text>
  <text x="477" y="194" text-anchor="middle" font-size="12" fill="#14532d">기대 발급자와</text>
  <text x="477" y="212" text-anchor="middle" font-size="12" fill="#14532d">정확히 일치</text>

  <rect x="548" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="609" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑤ aud</text>
  <text x="609" y="194" text-anchor="middle" font-size="12" fill="#14532d">이 API가</text>
  <text x="609" y="212" text-anchor="middle" font-size="12" fill="#14532d">수신자인가</text>

  <rect x="680" y="148" width="122" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="741" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑥ exp · nbf</text>
  <text x="741" y="194" text-anchor="middle" font-size="12" fill="#14532d">만료 · 시작</text>
  <text x="741" y="212" text-anchor="middle" font-size="12" fill="#14532d">작은 시계 오차</text>

  <rect x="812" y="148" width="128" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="876" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">⑦ 권한</text>
  <text x="876" y="194" text-anchor="middle" font-size="12" fill="#14532d">groups · scope</text>
  <text x="876" y="212" text-anchor="middle" font-size="12" fill="#14532d">로 인가</text>

  <line x1="142" y1="187" x2="150" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="274" y1="187" x2="282" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="406" y1="187" x2="414" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="538" y1="187" x2="546" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="187" x2="678" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="802" y1="187" x2="810" y2="187" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fail bar -->
  <rect x="20" y="240" width="920" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="262" text-anchor="middle" font-size="13" fill="#7f1d1d">어느 단계든 실패 → 401 + WWW-Authenticate: Bearer + auth_failed 로그 (사유만, 토큰 값은 남기지 않음)</text>

  <!-- mistakes -->
  <text x="20" y="302" font-size="14" font-weight="700" fill="#b91c1c">흔한 실수 — 내 코드 점검 대상</text>
  <rect x="20" y="314" width="122" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="81" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">헤더의 alg를</text>
  <text x="81" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">그대로 허용</text>
  <rect x="152" y="314" width="122" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="213" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">짧은 HMAC 비밀</text>
  <text x="213" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">코드에 하드코딩</text>
  <rect x="284" y="314" width="122" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="345" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">decode만 하고</text>
  <text x="345" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">verify 생략</text>
  <rect x="548" y="314" width="122" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="609" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">aud 미검사 →</text>
  <text x="609" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">남의 토큰 수용</text>
  <rect x="680" y="314" width="122" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="741" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">수명 수일 ·</text>
  <text x="741" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">폐기 수단 없음</text>
  <rect x="812" y="314" width="128" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="876" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">URL 규칙만,</text>
  <text x="876" y="360" text-anchor="middle" font-size="12" fill="#7f1d1d">객체 검사 없음</text>

  <!-- settings mapping -->
  <rect x="20" y="398" width="455" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="38" y="422" font-size="13" font-weight="700" fill="#0f172a">Spring Security 7 (리소스 서버)</text>
  <text x="38" y="444" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">issuer-uri · jws-algorithms: RS256</text>
  <text x="38" y="460" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">audiences: demo-api · groups → GROUP_*</text>
  <rect x="485" y="398" width="455" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="503" y="422" font-size="13" font-weight="700" fill="#0f172a">FastAPI + PyJWT 2.15</text>
  <text x="503" y="444" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">PyJWKClient · algorithms=["RS256"]</text>
  <text x="503" y="460" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">issuer · audience · require · leeway</text>

  <rect x="20" y="478" width="920" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="499" text-anchor="middle" font-size="13" fill="#78350f">키는 비대칭 + JWKS + 교체(kid) · 액세스 토큰은 5~15분 · 즉시 폐기가 필요하면 인트로스펙션이나 차단 목록</text>
</svg>
