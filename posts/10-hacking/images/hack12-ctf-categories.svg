<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CTF 분야와 이 시리즈의 연결</text>

  <!-- 1행 -->
  <rect x="20" y="64" width="290" height="152" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="40" y="96" font-size="19" font-weight="700" fill="#14532d">Web</text>
  <text x="40" y="124" font-size="13" fill="#334155">입력 검증 · 인증·세션 · 접근 제어</text>
  <text x="40" y="146" font-size="13" fill="#334155">입문자에게 가장 친숙</text>
  <rect x="40" y="168" width="250" height="30" rx="15" fill="#ffffff" stroke="#15803d"/>
  <text x="165" y="188" text-anchor="middle" font-size="13" fill="#14532d">연결: 해킹 04 · 05</text>

  <rect x="335" y="64" width="290" height="152" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="355" y="96" font-size="19" font-weight="700" fill="#991b1b">Pwnable (System)</text>
  <text x="355" y="124" font-size="13" fill="#334155">메모리 오류 · 실행 흐름</text>
  <text x="355" y="146" font-size="13" fill="#334155">진입 장벽이 가장 높음</text>
  <rect x="355" y="168" width="250" height="30" rx="15" fill="#ffffff" stroke="#b91c1c"/>
  <text x="480" y="188" text-anchor="middle" font-size="13" fill="#991b1b">연결: Day 07 (프로세스·커널)</text>

  <rect x="650" y="64" width="290" height="152" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="96" font-size="19" font-weight="700" fill="#4c1d95">Reversing</text>
  <text x="670" y="124" font-size="13" fill="#334155">실행 파일을 거꾸로 읽기</text>
  <text x="670" y="146" font-size="13" fill="#334155">악성코드 분석의 기초</text>
  <rect x="670" y="168" width="250" height="30" rx="15" fill="#ffffff" stroke="#7c3aed"/>
  <text x="795" y="188" text-anchor="middle" font-size="13" fill="#4c1d95">새 영역</text>

  <!-- 2행 -->
  <rect x="20" y="236" width="290" height="152" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="268" font-size="19" font-weight="700" fill="#78350f">Crypto</text>
  <text x="40" y="296" font-size="13" fill="#334155">약한 키 · 재사용 · 모드 오용</text>
  <text x="40" y="318" font-size="13" fill="#334155">암호를 "잘못 쓴" 경우</text>
  <rect x="40" y="340" width="250" height="30" rx="15" fill="#ffffff" stroke="#f59e0b"/>
  <text x="165" y="360" text-anchor="middle" font-size="13" fill="#78350f">연결: Day 71 (인증서·시크릿)</text>

  <rect x="335" y="236" width="290" height="152" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="268" font-size="19" font-weight="700" fill="#1e3a8a">Forensics</text>
  <text x="355" y="296" font-size="13" fill="#334155">로그 · 패킷 · 디스크 · 메모리</text>
  <text x="355" y="318" font-size="13" fill="#334155">블루팀 핵심 역량</text>
  <rect x="355" y="340" width="250" height="30" rx="15" fill="#ffffff" stroke="#2563eb"/>
  <text x="480" y="360" text-anchor="middle" font-size="13" fill="#1e3a8a">연결: Day 60 · 72 · 83</text>

  <rect x="650" y="236" width="290" height="152" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="670" y="268" font-size="19" font-weight="700" fill="#0f172a">Misc · Cloud/K8s</text>
  <text x="670" y="296" font-size="13" fill="#334155">퍼즐 · 스크립팅 · 설정 실수</text>
  <text x="670" y="318" font-size="13" fill="#334155">인프라 경험이 강점</text>
  <rect x="670" y="340" width="250" height="30" rx="15" fill="#ffffff" stroke="#64748b"/>
  <text x="795" y="360" text-anchor="middle" font-size="13" fill="#334155">연결: 해킹 03 · 07~82</text>

  <!-- 형식 -->
  <text x="20" y="428" font-size="14" font-weight="700" fill="#0f172a">형식</text>
  <g font-size="13" text-anchor="middle">
    <rect x="70" y="410" width="250" height="28" rx="6" fill="#15803d"/>
    <text x="195" y="429" fill="#ffffff">Jeopardy — 입문 추천</text>
    <rect x="335" y="410" width="290" height="28" rx="6" fill="#e2e8f0"/>
    <text x="480" y="429" fill="#334155">Attack-Defense — 패치·탐지도 함께</text>
    <rect x="640" y="410" width="300" height="28" rx="6" fill="#e2e8f0"/>
    <text x="790" y="429" fill="#334155">King of the Hill — 대회마다 다름</text>
  </g>
  <text x="480" y="466" text-anchor="middle" font-size="12" fill="#64748b">대회 서버만 대상 · 풀이(write-up)는 대회가 끝난 뒤 공개</text>
</svg>
