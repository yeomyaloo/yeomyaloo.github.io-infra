<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">클라우드 IAM 방어 계층</text>

  <!-- Side tags -->
  <rect x="890" y="66" width="40" height="324" rx="8" fill="#15803d"/>
  <text x="910" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" transform="rotate(90 910 228)">예방 · 사전 검사</text>
  <rect x="890" y="400" width="40" height="56" rx="8" fill="#326ce5"/>
  <text x="910" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">발견</text>

  <!-- Layer 1 -->
  <rect x="30" y="66" width="200" height="56" rx="8" fill="#14532d"/>
  <text x="130" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">조직 가드레일 (SCP)</text>
  <rect x="240" y="66" width="640" height="56" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="256" y="100" font-size="14" fill="#334155">허용 리전 밖 금지 · CloudTrail 끄기 금지 · IMDSv2 아닌 인스턴스 생성 금지</text>

  <!-- Layer 2 -->
  <rect x="30" y="132" width="200" height="56" rx="8" fill="#15803d"/>
  <text x="130" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">위임 상한선</text>
  <rect x="240" y="132" width="640" height="56" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="256" y="166" font-size="14" fill="#334155">Permissions boundary — 개발자가 역할을 만들어도 경계 이상은 불가</text>

  <!-- Layer 3 -->
  <rect x="30" y="198" width="200" height="56" rx="8" fill="#16a34a"/>
  <text x="130" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">신원 정책</text>
  <rect x="240" y="198" width="640" height="56" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="256" y="232" font-size="14" fill="#334155">최소 권한 · PassRole 범위 제한 · 장기 키 대신 역할/SSO · IAM 쓰기는 관리자만</text>

  <!-- Layer 4 -->
  <rect x="30" y="264" width="200" height="56" rx="8" fill="#22c55e"/>
  <text x="130" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">리소스 설정</text>
  <rect x="240" y="264" width="640" height="56" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="256" y="298" font-size="14" fill="#334155">계정 수준 S3 Block Public Access · IMDSv2 required · 공개는 CloudFront + OAC</text>

  <!-- Layer 5 -->
  <rect x="30" y="330" width="200" height="60" rx="8" fill="#86efac"/>
  <text x="130" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">사전 검사</text>
  <rect x="240" y="330" width="640" height="60" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="256" y="354" font-size="14" fill="#334155">IAM Access Analyzer — 외부 접근 · 미사용 접근 · check-access-not-granted</text>
  <text x="256" y="376" font-size="13" fill="#64748b">정책 시뮬레이터 (simulate-principal-policy) · CI에서 PR 차단</text>

  <!-- Layer 6 -->
  <rect x="30" y="400" width="200" height="56" rx="8" fill="#326ce5"/>
  <text x="130" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">탐지</text>
  <rect x="240" y="400" width="640" height="56" rx="8" fill="#eff6ff" stroke="#326ce5"/>
  <text x="256" y="434" font-size="14" fill="#334155">CloudTrail 권한 변경 이벤트 → EventBridge 알림 · GuardDuty 결과</text>
</svg>
