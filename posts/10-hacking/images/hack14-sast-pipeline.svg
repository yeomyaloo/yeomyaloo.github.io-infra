<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SAST 파이프라인 — 로컬에서 Security 탭까지</text>

  <!-- stage 1: local -->
  <rect x="20" y="60" width="200" height="250" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="120" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">① 개발자 PC</text>
  <rect x="36" y="102" width="168" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="124" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">semgrep scan</text>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#334155">p/java + .semgrep/</text>
  <rect x="36" y="166" width="168" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="188" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">semgrep --test</text>
  <text x="120" y="208" text-anchor="middle" font-size="11" fill="#334155">규칙도 테스트한다</text>
  <rect x="36" y="230" width="168" height="54" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="252" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">codeql database</text>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#334155">create → analyze</text>

  <!-- stage 2: PR -->
  <rect x="250" y="60" width="230" height="250" rx="10" fill="#fff7ed" stroke="#ef7b4d"/>
  <text x="365" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">② Pull Request (Actions)</text>
  <rect x="266" y="102" width="198" height="86" rx="6" fill="#ffffff" stroke="#ef7b4d"/>
  <text x="365" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">semgrep 잡</text>
  <text x="365" y="146" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">--baseline-commit</text>
  <text x="365" y="164" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">--error --sarif-output</text>
  <text x="365" y="181" text-anchor="middle" font-size="11" fill="#7c2d12">새 결과만, 초~분</text>
  <rect x="266" y="198" width="198" height="96" rx="6" fill="#ffffff" stroke="#ef7b4d"/>
  <text x="365" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">codeql 잡</text>
  <text x="365" y="242" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">codeql-action@v4</text>
  <text x="365" y="260" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">build-mode: none</text>
  <text x="365" y="278" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">security-extended</text>

  <!-- stage 3: SARIF -->
  <rect x="510" y="120" width="160" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="590" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">③ SARIF 2.1.0</text>
  <text x="590" y="174" text-anchor="middle" font-size="12" fill="#4c1d95">ruleId · level</text>
  <text x="590" y="194" text-anchor="middle" font-size="12" fill="#4c1d95">locations · codeFlows</text>
  <text x="590" y="214" text-anchor="middle" font-size="12" fill="#4c1d95">fingerprints</text>
  <text x="590" y="236" text-anchor="middle" font-size="11" fill="#4c1d95" font-family="Consolas,'D2Coding',monospace">category 분리</text>

  <!-- stage 4: security tab -->
  <rect x="700" y="60" width="240" height="250" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="820" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">④ Security 탭</text>
  <text x="820" y="106" text-anchor="middle" font-size="12" fill="#14532d">Code scanning alerts</text>
  <rect x="716" y="120" width="208" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="820" y="145" text-anchor="middle" font-size="13" fill="#7f1d1d">Open — 조치 대기</text>
  <rect x="716" y="170" width="208" height="40" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="820" y="195" text-anchor="middle" font-size="13" fill="#14532d">Fixed — 재분석에서 사라짐</text>
  <rect x="716" y="220" width="208" height="40" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="820" y="245" text-anchor="middle" font-size="13" fill="#334155">Dismissed — 사유 기록</text>
  <text x="820" y="288" text-anchor="middle" font-size="12" fill="#14532d">PR 줄 주석 · 브랜치 보호</text>

  <!-- arrows -->
  <line x1="220" y1="185" x2="246" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="145" x2="507" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="246" x2="507" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="185" x2="696" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="112" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">upload-sarif@v4</text>

  <!-- timing bar -->
  <text x="20" y="346" font-size="14" font-weight="700" fill="#0f172a">언제 무엇이 도나</text>
  <rect x="20" y="358" width="200" height="34" rx="6" fill="#e2e8f0"/>
  <text x="120" y="380" text-anchor="middle" font-size="12" fill="#334155">저장 · 커밋 전 (초)</text>
  <rect x="250" y="358" width="230" height="34" rx="6" fill="#fed7aa"/>
  <text x="365" y="380" text-anchor="middle" font-size="12" fill="#7c2d12">PR마다 (초 ~ 수십 분)</text>
  <rect x="510" y="358" width="160" height="34" rx="6" fill="#ddd6fe"/>
  <text x="590" y="380" text-anchor="middle" font-size="12" fill="#4c1d95">main 푸시</text>
  <rect x="700" y="358" width="240" height="34" rx="6" fill="#bbf7d0"/>
  <text x="820" y="380" text-anchor="middle" font-size="12" fill="#14532d">주간 schedule — 새 쿼리로 재점검</text>

  <rect x="20" y="414" width="920" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="439" text-anchor="middle" font-size="13" fill="#78350f">시크릿은 CodeQL 기본 묶음에서 빠짐(2.21.1~) → Semgrep 팀 규칙 + GitHub secret scanning · push protection + 해킹 19 gitleaks</text>
</svg>
