<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">pull_request vs pull_request_target — 신뢰 경계</text>

  <!-- left: pull_request -->
  <rect x="20" y="60" width="450" height="280" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d" font-family="Consolas,'D2Coding',monospace">pull_request</text>

  <rect x="40" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">포크 PR 코드</text>
  <text x="115" y="162" text-anchor="middle" font-size="12" fill="#64748b">신뢰할 수 없음</text>

  <rect x="290" y="110" width="160" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">러너</text>
  <text x="370" y="162" text-anchor="middle" font-size="12" fill="#334155">PR 쪽 워크플로 실행</text>
  <line x1="190" y1="145" x2="286" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="238" y="137" text-anchor="middle" font-size="12" fill="#334155">실행</text>

  <text x="40" y="218" font-size="14" fill="#0f172a">GITHUB_TOKEN: <tspan font-weight="700" fill="#15803d">읽기 전용</tspan></text>
  <text x="40" y="244" font-size="14" fill="#0f172a">시크릿: <tspan font-weight="700" fill="#15803d">주지 않음</tspan></text>
  <rect x="40" y="264" width="410" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="245" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">남의 코드가 돌아도 가져갈 것이 없다</text>

  <!-- right: pull_request_target -->
  <rect x="490" y="60" width="450" height="280" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="715" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">pull_request_target</text>

  <rect x="510" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="585" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">포크 PR 코드</text>
  <text x="585" y="162" text-anchor="middle" font-size="12" fill="#64748b">신뢰할 수 없음</text>

  <rect x="760" y="110" width="160" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="840" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">러너</text>
  <text x="840" y="162" text-anchor="middle" font-size="12" fill="#334155">기본 브랜치 워크플로</text>
  <line x1="660" y1="145" x2="756" y2="145" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="708" y="129" text-anchor="middle" font-size="12" fill="#b91c1c">체크아웃해</text>
  <text x="708" y="167" text-anchor="middle" font-size="12" fill="#b91c1c">실행하면?</text>

  <text x="510" y="218" font-size="14" fill="#0f172a">GITHUB_TOKEN: <tspan font-weight="700" fill="#b91c1c">쓰기 가능</tspan></text>
  <text x="510" y="244" font-size="14" fill="#0f172a">시크릿: <tspan font-weight="700" fill="#b91c1c">줌</tspan></text>
  <rect x="510" y="264" width="410" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="715" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">pwn request — 남의 코드가 내 권한으로 돈다</text>

  <!-- timeline -->
  <text x="480" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">GitHub가 바꾼 기본값</text>
  <line x1="80" y1="400" x2="880" y2="400" stroke="#64748b" stroke-width="2"/>
  <circle cx="160" cy="400" r="8" fill="#4f46e5"/>
  <circle cx="480" cy="400" r="8" fill="#4f46e5"/>
  <circle cx="800" cy="400" r="8" fill="#dc2626"/>
  <text x="160" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">2025-12-08</text>
  <text x="160" y="452" text-anchor="middle" font-size="12" fill="#334155">워크플로·체크아웃 기준을</text>
  <text x="160" y="470" text-anchor="middle" font-size="12" fill="#334155">항상 기본 브랜치로</text>
  <text x="480" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">2026-06 · 07-20</text>
  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#334155">actions/checkout이 포크 PR</text>
  <text x="480" y="470" text-anchor="middle" font-size="12" fill="#334155">head·merge 체크아웃을 거부</text>
  <text x="800" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">2026-12-02 (예정)</text>
  <text x="800" y="452" text-anchor="middle" font-size="12" fill="#334155">공개 레포에서</text>
  <text x="800" y="470" text-anchor="middle" font-size="12" fill="#334155">pull_request_target 기본 차단</text>
</svg>
