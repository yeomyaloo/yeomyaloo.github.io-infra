<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CVSS v4.0 메트릭 그룹</text>

  <!-- Base -->
  <rect x="20" y="60" width="600" height="290" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="40" y="88" font-size="17" font-weight="700" fill="#14532d">Base (기본) — 항상 필수</text>

  <!-- 악용 가능성 -->
  <rect x="36" y="102" width="200" height="232" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="136" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">악용 가능성</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">
    <text x="52" y="162">AV</text><text x="96" y="162">N · A · L · P</text>
    <text x="52" y="198">AC</text><text x="96" y="198">L · H</text>
    <text x="52" y="234" fill="#b91c1c">AT</text><text x="96" y="234">N · P</text>
    <text x="52" y="270">PR</text><text x="96" y="270">N · L · H</text>
    <text x="52" y="306">UI</text><text x="96" y="306">N · <tspan fill="#b91c1c">P · A</tspan></text>
  </g>

  <!-- 취약 시스템 -->
  <rect x="250" y="102" width="176" height="232" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="338" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">취약 시스템 영향</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">
    <text x="268" y="162">VC</text><text x="310" y="162">H · L · N</text>
    <text x="268" y="198">VI</text><text x="310" y="198">H · L · N</text>
    <text x="268" y="234">VA</text><text x="310" y="234">H · L · N</text>
  </g>
  <text x="338" y="282" text-anchor="middle" font-size="12" fill="#475569">취약점이 있는</text>
  <text x="338" y="300" text-anchor="middle" font-size="12" fill="#475569">그 시스템 자체</text>

  <!-- 후속 시스템 -->
  <rect x="440" y="102" width="166" height="232" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="523" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">후속 시스템 영향</text>
  <g font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">
    <text x="456" y="162">SC</text><text x="496" y="162">H · L · N</text>
    <text x="456" y="198">SI</text><text x="496" y="198">H · L · N</text>
    <text x="456" y="234">SA</text><text x="496" y="234">H · L · N</text>
  </g>
  <text x="523" y="282" text-anchor="middle" font-size="12" fill="#475569">다른 시스템</text>
  <text x="523" y="300" text-anchor="middle" font-size="12" fill="#475569">예: XSS 피해자 브라우저</text>

  <!-- Threat -->
  <rect x="640" y="60" width="300" height="86" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="656" y="86" font-size="16" font-weight="700" fill="#92400e">Threat (위협)</text>
  <text x="656" y="110" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">E  A · P · U · X</text>
  <text x="656" y="132" font-size="12" fill="#475569">X(미정의) = A(실제 공격 중)로 계산</text>

  <!-- Environmental -->
  <rect x="640" y="160" width="300" height="86" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="656" y="186" font-size="16" font-weight="700" fill="#312e81">Environmental (환경)</text>
  <text x="656" y="210" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#0f172a">CR · IR · AR  +  M*</text>
  <text x="656" y="232" font-size="12" fill="#475569">우리 자산의 중요도, 기본값 수정</text>

  <!-- Supplemental -->
  <rect x="640" y="260" width="300" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="656" y="286" font-size="16" font-weight="700" fill="#334155">Supplemental (부가)</text>
  <text x="656" y="310" font-family="Consolas,'D2Coding',monospace" font-size="13" fill="#0f172a">S · AU · R · V · RE · U</text>
  <text x="656" y="334" font-size="12" fill="#475569">설명용 — 점수에 반영되지 않음</text>

  <!-- 이름 붙이기 -->
  <text x="20" y="390" font-size="15" font-weight="700" fill="#0f172a">어떤 그룹을 썼는지 이름으로 표시</text>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="402" width="220" height="40" rx="8" fill="#dcfce7"/>
    <text x="130" y="427" fill="#14532d">CVSS-B · Base만</text>
    <rect x="253" y="402" width="220" height="40" rx="8" fill="#fef3c7"/>
    <text x="363" y="427" fill="#78350f">CVSS-BT · + Threat</text>
    <rect x="486" y="402" width="220" height="40" rx="8" fill="#e0e7ff"/>
    <text x="596" y="427" fill="#312e81">CVSS-BE · + 환경</text>
    <rect x="719" y="402" width="221" height="40" rx="8" fill="#f1f5f9"/>
    <text x="829" y="427" fill="#334155">CVSS-BTE · 모두</text>
  </g>

  <!-- 등급 구간 -->
  <text x="20" y="478" font-size="15" font-weight="700" fill="#0f172a">등급 구간</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="462" width="120" height="40" fill="#e2e8f0"/>
    <text x="180" y="487" fill="#334155">None 0.0</text>
    <rect x="240" y="462" width="170" height="40" fill="#bbf7d0"/>
    <text x="325" y="487" fill="#14532d">Low 0.1–3.9</text>
    <rect x="410" y="462" width="180" height="40" fill="#fde68a"/>
    <text x="500" y="487" fill="#78350f">Medium 4.0–6.9</text>
    <rect x="590" y="462" width="180" height="40" fill="#fdba74"/>
    <text x="680" y="487" fill="#7c2d12">High 7.0–8.9</text>
    <rect x="770" y="462" width="170" height="40" fill="#dc2626"/>
    <text x="855" y="487" fill="#ffffff">Critical 9.0–10.0</text>
  </g>
  <text x="480" y="536" text-anchor="middle" font-size="12" fill="#64748b">빨간 글씨 = v4.0에서 새로 생기거나 바뀐 것 · 점수는 MacroVector 표 기반이라 FIRST 공식 계산기로 구한다</text>
</svg>
