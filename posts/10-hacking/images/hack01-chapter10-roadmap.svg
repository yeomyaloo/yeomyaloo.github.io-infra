    <rect x="200" y="275" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="287" y="306" font-size="14" font-weight="700" fill="#0f172a">해킹 06 권한 상승</text>
    <text x="287" y="327" font-size="12" fill="#475569">SUID · sudo · cron 점검</text>
    <text x="287" y="350" font-size="12" fill="#15803d">↔ Day 67 sudo 정책</text>

    <rect x="385" y="275" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="472" y="306" font-size="14" font-weight="700" fill="#0f172a">해킹 07 컨테이너</text>
    <text x="472" y="327" font-size="12" fill="#475569">privileged · docker.sock</text>
    <text x="472" y="350" font-size="12" fill="#15803d">↔ Day 07 · 68</text>

    <rect x="570" y="275" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="657" y="306" font-size="14" font-weight="700" fill="#0f172a">해킹 08 K8s</text>
    <text x="657" y="327" font-size="12" fill="#475569">Kubernetes Goat</text>
    <text x="657" y="350" font-size="12" fill="#15803d">↔ Day 19 · 69~71</text>

    <rect x="755" y="275" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="842" y="306" font-size="14" font-weight="700" fill="#0f172a">해킹 09 클라우드 IAM</text>
    <text x="842" y="327" font-size="12" fill="#475569">CloudGoat 개념</text>
    <text x="842" y="350" font-size="12" fill="#15803d">↔ 최소 권한 · Day 71</text>

    <!-- Row 4 -->
    <rect x="200" y="380" width="175" height="90" rx="10" fill="#dbeafe" stroke="#326ce5"/>
    <text x="287" y="411" font-size="14" font-weight="700" fill="#1e3a8a">해킹 10 탐지 관점</text>
    <text x="287" y="432" font-size="12" fill="#1e40af">흔적 모으기</text>
    <text x="287" y="455" font-size="12" fill="#15803d">↔ Day 72 Falco · 60</text>

    <rect x="385" y="380" width="175" height="90" rx="10" fill="#dbeafe" stroke="#326ce5"/>
    <text x="472" y="411" font-size="14" font-weight="700" fill="#1e3a8a">해킹 11 보고서</text>
    <text x="472" y="432" font-size="12" fill="#1e40af">재현 · CVSS · 권고</text>
    <text x="472" y="455" font-size="12" fill="#15803d">↔ Day 65 포스트모템</text>

    <rect x="570" y="380" width="175" height="90" rx="10" fill="#dbeafe" stroke="#326ce5"/>
    <text x="657" y="411" font-size="14" font-weight="700" fill="#1e3a8a">해킹 12 다음 단계</text>
    <text x="657" y="432" font-size="12" fill="#1e40af">CTF · 버그바운티</text>
    <text x="657" y="455" font-size="12" fill="#15803d">↔ 자격증 · 진로</text>
  </g>

  <!-- Right note for row 1/2 -->
  <rect x="570" y="65" width="360" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="750" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">대상은 hacklab 안의 IP뿐</text>
  <text x="750" y="122" text-anchor="middle" font-size="12" fill="#7f1d1d">Kali .5 · DVWA .20 · Juice Shop .21</text>
  <text x="750" y="142" text-anchor="middle" font-size="12" fill="#7f1d1d">Metasploitable .30</text>

  <rect x="755" y="170" width="175" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="842" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">모든 공격 주제 =</text>
  <text x="842" y="230" text-anchor="middle" font-size="13" fill="#334155">탐지 + 조치와 짝</text>

  <rect x="755" y="380" width="175" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="842" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">진행 방식</text>
  <text x="842" y="440" text-anchor="middle" font-size="13" fill="#334155">퍼플팀처럼 반복</text>

  <!-- Legend -->
  <g font-size="12">
    <rect x="200" y="492" width="14" height="14" rx="3" fill="#ffffff" stroke="#334155"/>
    <text x="222" y="504" fill="#334155">공격 원리 실습 (연습용 대상)</text>
    <rect x="420" y="492" width="14" height="14" rx="3" fill="#dbeafe" stroke="#326ce5"/>
    <text x="442" y="504" fill="#334155">방어 · 보고</text>
    <text x="560" y="504" fill="#15803d" font-weight="700">↔ 짝을 이루는 방어 (앞 챕터)</text>
  </g>
