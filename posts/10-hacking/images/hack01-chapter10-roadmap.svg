<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">해킹 트랙 로드맵 — 공격 이해 ↔ 탐지 · 조치</text>

  <!-- vertical progress arrow -->
  <line x1="18" y1="72" x2="18" y2="460" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Row labels -->
  <g text-anchor="middle" font-weight="700">
    <rect x="30" y="65" width="150" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="105" y="116" font-size="16" fill="#14532d">준비</text>

    <rect x="30" y="170" width="150" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="105" y="211" font-size="15" fill="#14532d">웹 · 네트워크</text>
    <text x="105" y="233" font-size="12" font-weight="400" fill="#166534">정보 수집 → 웹</text>

    <rect x="30" y="275" width="150" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="105" y="314" font-size="15" fill="#14532d">호스트 ·</text>
    <text x="105" y="336" font-size="15" fill="#14532d">클라우드 네이티브</text>

    <rect x="30" y="380" width="150" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="105" y="421" font-size="15" fill="#14532d">방어로</text>
    <text x="105" y="443" font-size="15" fill="#14532d">돌아오기</text>
  </g>

  <!-- Cards: 175 wide, x = 200, 385, 570, 755 -->
  <g text-anchor="middle">
    <!-- Row 1 -->
    <rect x="200" y="65" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="287" y="96" font-size="14" font-weight="700" fill="#0f172a">해킹 01 입문</text>
    <text x="287" y="117" font-size="12" fill="#475569">법 · 허가 · 진로</text>
    <text x="287" y="140" font-size="12" fill="#15803d">↔ Day 66 위협 모델</text>

    <rect x="385" y="65" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="472" y="96" font-size="14" font-weight="700" fill="#0f172a">해킹 02 격리 실습장</text>
    <text x="472" y="117" font-size="12" fill="#475569">hacklab 10.10.10.0/24</text>
    <text x="472" y="140" font-size="12" fill="#15803d">↔ H01 · Day 21~22</text>

    <!-- Row 2 -->
    <rect x="200" y="170" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="287" y="201" font-size="14" font-weight="700" fill="#0f172a">해킹 03 정보 수집</text>
    <text x="287" y="222" font-size="12" fill="#475569">nmap · 디렉터리 탐색</text>
    <text x="287" y="245" font-size="12" fill="#15803d">↔ Day 67 nftables · H02</text>

    <rect x="385" y="170" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="472" y="201" font-size="14" font-weight="700" fill="#0f172a">해킹 04 웹 ①</text>
    <text x="472" y="222" font-size="12" fill="#475569">Burp · SQLi · XSS</text>
    <text x="472" y="245" font-size="12" fill="#15803d">↔ 안전한 쿼리 · 인코딩</text>

    <rect x="570" y="170" width="175" height="90" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="657" y="201" font-size="14" font-weight="700" fill="#0f172a">해킹 05 웹 ②</text>
    <text x="657" y="222" font-size="12" fill="#475569">인가 · SSRF · 업로드</text>
    <text x="657" y="245" font-size="12" fill="#15803d">↔ Day 70 NetworkPolicy</text>

