<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CSRF와 세 겹의 방어 — SameSite · 토큰 · Fetch Metadata</text>

  <!-- other site page -->
  <rect x="20" y="64" width="160" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="100" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">다른 사이트의 페이지</text>
  <text x="100" y="114" text-anchor="middle" font-size="12" fill="#7f1d1d">사용자가 방문</text>
  <text x="100" y="132" text-anchor="middle" font-size="12" fill="#7f1d1d">폼 자동 제출 유도</text>

  <!-- browser -->
  <rect x="20" y="180" width="160" height="130" rx="10" fill="#dbeafe" stroke="#2496ed"/>
  <text x="100" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">사용자 브라우저</text>
  <text x="100" y="228" text-anchor="middle" font-size="12" fill="#1e3a8a">내 앱에 로그인된 상태</text>
  <rect x="34" y="242" width="132" height="54" rx="6" fill="#ffffff" stroke="#2496ed"/>
  <text x="100" y="262" text-anchor="middle" font-size="11" font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">__Host-sid</text>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#1e3a8a">자동으로 붙는 쿠키</text>

  <line x1="100" y1="144" x2="100" y2="176" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- gates -->
  <g font-size="12">
    <rect x="210" y="180" width="200" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="310" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">① SameSite 쿠키</text>
    <text x="224" y="232" fill="#334155">Lax: 다른 사이트에서 시작된</text>
    <text x="224" y="250" fill="#334155">POST에는 쿠키 미첨부</text>
    <text x="224" y="276" fill="#b91c1c">한계: 같은 사이트의 다른</text>
    <text x="224" y="294" fill="#b91c1c">하위 도메인은 못 막음</text>

    <rect x="430" y="180" width="200" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="530" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">② CSRF 토큰</text>
    <text x="444" y="232" fill="#334155">내 페이지만 아는 값을</text>
    <text x="444" y="250" fill="#334155">헤더·폼에 넣어 대조</text>
    <text x="444" y="276" fill="#b91c1c">한계: 빠진 엔드포인트,</text>
    <text x="444" y="294" fill="#b91c1c">XSS가 있으면 무력</text>

    <rect x="650" y="180" width="200" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="750" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">③ Fetch Metadata</text>
    <text x="664" y="232" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#334155">Sec-Fetch-Site: cross-site</text>
    <text x="664" y="250" fill="#334155">Origin 불일치 → 거부</text>
    <text x="664" y="276" fill="#b91c1c">한계: 헤더 없는 오래된</text>
    <text x="664" y="294" fill="#b91c1c">브라우저 정책 필요</text>
  </g>

  <rect x="870" y="200" width="70" height="90" rx="10" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="905" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">내 앱</text>
  <text x="905" y="260" text-anchor="middle" font-size="11" fill="#312e81">상태 변경</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="180" y1="245" x2="206" y2="245" marker-end="url(#arrow)"/>
    <line x1="410" y1="245" x2="426" y2="245" marker-end="url(#arrow)"/>
    <line x1="630" y1="245" x2="646" y2="245" marker-end="url(#arrow)"/>
    <line x1="850" y1="245" x2="866" y2="245" marker-end="url(#arrow)"/>
  </g>
  <text x="530" y="160" text-anchor="middle" font-size="13" fill="#334155">POST /api/profile — 세 겹 중 하나라도 걸리면 403 + csrf_rejected 로그</text>

  <!-- bottom: which defense when -->
  <text x="20" y="352" font-size="15" font-weight="700" fill="#0f172a">상황별로 필요한 방어</text>
  <g font-size="12">
    <rect x="20" y="364" width="222" height="112" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="34" y="388" font-size="13" font-weight="700" fill="#14532d">서버 렌더링 + 세션 쿠키</text>
    <text x="34" y="412" fill="#14532d">프레임워크 기본 토큰</text>
    <text x="34" y="432" fill="#14532d">+ SameSite=Lax</text>
    <text x="34" y="458" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">csrf(withDefaults())</text>

    <rect x="252" y="364" width="222" height="112" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="266" y="388" font-size="13" font-weight="700" fill="#14532d">SPA + 세션 쿠키</text>
    <text x="266" y="412" fill="#14532d">double-submit 토큰</text>
    <text x="266" y="432" fill="#14532d">+ SameSite + Fetch Metadata</text>
    <text x="266" y="458" font-family="Consolas,'D2Coding',monospace" font-size="11" fill="#14532d">csrf(csrf -&gt; csrf.spa())</text>

    <rect x="484" y="364" width="222" height="112" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="498" y="388" font-size="13" font-weight="700" fill="#312e81">SPA + Bearer 토큰만</text>
    <text x="498" y="412" fill="#312e81">자동 첨부가 없어 CSRF 대상 아님</text>
    <text x="498" y="432" fill="#312e81">대신 XSS 방어(CSP)가 핵심</text>
    <text x="498" y="458" fill="#312e81">쿠키 로그인도 있으면 끄지 말 것</text>

    <rect x="716" y="364" width="224" height="112" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="730" y="388" font-size="13" font-weight="700" fill="#92400e">위험한 동작</text>
    <text x="730" y="412" fill="#92400e">비밀번호·이메일 변경, 송금</text>
    <text x="730" y="432" fill="#92400e">위에 더해 재인증</text>
    <text x="730" y="458" fill="#92400e">(DVWA CSRF Impossible 방식)</text>
  </g>

  <rect x="20" y="490" width="920" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="480" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">⚠ GET으로 상태를 바꾸지 말 것 — SameSite=Lax는 다른 사이트에서의 최상위 GET 이동에는 쿠키를 붙인다</text>
</svg>
