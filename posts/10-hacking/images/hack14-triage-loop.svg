<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">결과 분류와 규칙 튜닝 — 억제보다 개선</text>

  <!-- results -->
  <rect x="20" y="180" width="150" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="95" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">새 결과</text>
  <text x="95" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">PR · Security 탭</text>

  <!-- triage -->
  <rect x="210" y="170" width="150" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="285" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">분류</text>
  <text x="285" y="222" text-anchor="middle" font-size="12" fill="#78350f">경로를 직접 읽고</text>
  <text x="285" y="242" text-anchor="middle" font-size="12" fill="#78350f">두 사람이 판정</text>
  <line x1="170" y1="215" x2="206" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- four outcomes -->
  <rect x="420" y="60" width="200" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">진짜 취약점</text>
  <text x="520" y="108" text-anchor="middle" font-size="12" fill="#334155">source→sink 실재, 검증 없음</text>

  <rect x="420" y="142" width="200" height="66" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">오탐</text>
  <text x="520" y="190" text-anchor="middle" font-size="12" fill="#334155">도구가 모르는 검증</text>

  <rect x="420" y="224" width="200" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">테스트 코드</text>
  <text x="520" y="272" text-anchor="middle" font-size="12" fill="#334155">src/test의 의도된 값</text>

  <rect x="420" y="306" width="200" height="66" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">수용 (won't fix)</text>
  <text x="520" y="354" text-anchor="middle" font-size="12" fill="#334155">위험을 알고 받아들임</text>

  <line x1="360" y1="200" x2="416" y2="96" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="208" x2="416" y2="175" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="222" x2="416" y2="256" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="232" x2="416" y2="336" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- actions -->
  <rect x="670" y="60" width="270" height="66" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="805" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">코드 수정 → 재스캔</text>
  <text x="805" y="108" text-anchor="middle" font-size="12" fill="#14532d">알림이 Fixed로 자동 종료</text>

  <rect x="670" y="142" width="270" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="805" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">규칙 튜닝 (우선)</text>
  <text x="805" y="190" text-anchor="middle" font-size="12" fill="#4c1d95">ok: 테스트 → sanitizer·조건 추가</text>

  <rect x="670" y="224" width="270" height="66" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="805" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">경로 제외</text>
  <text x="805" y="272" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">.semgrepignore · paths-ignore</text>

  <rect x="670" y="306" width="270" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="805" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">억제 + 근거 기록</text>
  <text x="805" y="354" text-anchor="middle" font-size="12" fill="#78350f">nosemgrep: id · Dismiss 사유 · 재검토일</text>

  <line x1="620" y1="93" x2="666" y2="93" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="175" x2="666" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="257" x2="666" y2="257" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="339" x2="666" y2="339" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop back -->
  <path d="M 805 372 L 805 402 L 95 402 L 95 254" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <text x="450" y="396" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">다음 스캔: 같은 오탐이 다시 나오지 않는다 · 오탐률 추세를 지표로</text>

  <rect x="20" y="422" width="920" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="447" text-anchor="middle" font-size="13" fill="#78350f">닫는 버튼은 숨기는 버튼이기도 하다 — 사유 · 검토자 · 날짜 없이 Dismiss하지 않는다</text>
</svg>
