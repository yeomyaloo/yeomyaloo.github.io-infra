<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">퍼플팀 루프 — 행위 하나마다 "보였나?"를 확인한다</text>

  <!-- 중앙 -->
  <circle cx="480" cy="255" r="78" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">퍼플팀</text>
  <text x="480" y="272" text-anchor="middle" font-size="13" fill="#5b21b6">같은 행위로</text>
  <text x="480" y="290" text-anchor="middle" font-size="13" fill="#5b21b6">다시 확인</text>

  <!-- ① 계획 -->
  <rect x="380" y="62" width="200" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">① 계획</text>
  <text x="480" y="110" text-anchor="middle" font-size="13" fill="#334155">ATT&amp;CK 기법 고르기</text>
  <text x="480" y="128" text-anchor="middle" font-size="13" fill="#334155">범위·허가 확인</text>

  <!-- ② 실행 -->
  <rect x="700" y="160" width="220" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="810" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">② 실행 (레드)</text>
  <text x="810" y="208" text-anchor="middle" font-size="13" fill="#334155">격리 실습장에서</text>
  <text x="810" y="226" text-anchor="middle" font-size="13" fill="#334155">앞 Day 행위를 다시</text>

  <!-- ③ 관찰 -->
  <rect x="620" y="340" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">③ 관찰 (블루)</text>
  <text x="730" y="388" text-anchor="middle" font-size="13" fill="#334155">Loki·Falco·감사 로그</text>
  <text x="730" y="406" text-anchor="middle" font-size="13" fill="#334155">시각 기준으로 검색</text>

  <!-- ④ 판정 -->
  <rect x="120" y="340" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">④ 판정</text>
  <text x="230" y="388" text-anchor="middle" font-size="13" fill="#334155">4단계 중 어디인가</text>
  <text x="230" y="406" text-anchor="middle" font-size="13" fill="#334155">공백이면 원인 분류</text>

  <!-- ⑤ 개선 -->
  <rect x="40" y="160" width="220" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="150" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">⑤ 개선</text>
  <text x="150" y="208" text-anchor="middle" font-size="13" fill="#334155">수집·룰·라우팅·품질</text>
  <text x="150" y="226" text-anchor="middle" font-size="13" fill="#334155">고친 뒤 ②로 재검증</text>

  <!-- 화살표 -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M580,102 Q700,110 760,156"/>
    <path d="M800,240 Q800,300 770,336"/>
    <path d="M620,380 L344,380"/>
    <path d="M190,340 Q150,300 150,244"/>
    <path d="M200,160 Q250,105 376,102"/>
  </g>

  <!-- 범례 -->
  <text x="40" y="462" font-size="14" font-weight="700" fill="#0f172a">④ 판정 4단계</text>
  <rect x="160" y="444" width="170" height="28" rx="6" fill="#fca5a5"/>
  <text x="245" y="463" text-anchor="middle" font-size="13" fill="#7f1d1d">보이지 않음</text>
  <rect x="345" y="444" width="170" height="28" rx="6" fill="#fde68a"/>
  <text x="430" y="463" text-anchor="middle" font-size="13" fill="#78350f">기록만 됨</text>
  <rect x="530" y="444" width="170" height="28" rx="6" fill="#fed7aa"/>
  <text x="615" y="463" text-anchor="middle" font-size="13" fill="#7c2d12">검색 가능</text>
  <rect x="715" y="444" width="170" height="28" rx="6" fill="#86efac"/>
  <text x="800" y="463" text-anchor="middle" font-size="13" fill="#14532d">알림</text>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="332" y1="458" x2="343" y2="458"/>
    <line x1="517" y1="458" x2="528" y2="458"/>
    <line x1="702" y1="458" x2="713" y2="458"/>
  </g>
  <text x="480" y="490" text-anchor="middle" font-size="12" fill="#64748b">질문은 늘 "어떻게 하면 보이게 하나" — 탐지 회피는 다루지 않는다</text>
</svg>
