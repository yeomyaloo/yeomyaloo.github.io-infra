<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kerberos와 NTLM — 메시지 흐름과 DC에 남는 이벤트</text>

  <!-- ===== Kerberos (왼쪽) ===== -->
  <rect x="20" y="58" width="460" height="482" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Kerberos (기본)</text>

  <rect x="40" y="104" width="120" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">사용자</text>
  <text x="100" y="148" text-anchor="middle" font-size="12" fill="#334155">WS01</text>

  <rect x="320" y="104" width="140" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="390" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">KDC (DC01)</text>
  <text x="390" y="148" text-anchor="middle" font-size="12" fill="#334155">AS + TGS</text>

  <rect x="320" y="420" width="140" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">서비스 (SRV01)</text>
  <text x="390" y="464" text-anchor="middle" font-size="12" fill="#334155">SPN: MSSQLSvc/…</text>

  <!-- 생명선 -->
  <line x1="100" y1="160" x2="100" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="390" y1="160" x2="390" y2="420" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="102" y1="196" x2="386" y2="196"/>
    <line x1="386" y1="232" x2="104" y2="232"/>
    <line x1="102" y1="292" x2="386" y2="292"/>
    <line x1="386" y1="328" x2="104" y2="328"/>
    <line x1="102" y1="452" x2="316" y2="452"/>
  </g>
  <text x="244" y="188" text-anchor="middle" font-size="12" fill="#334155">① AS-REQ (비밀번호 키로 사전 인증)</text>
  <text x="244" y="224" text-anchor="middle" font-size="12" fill="#334155">AS-REP: TGT 발급</text>
  <text x="244" y="284" text-anchor="middle" font-size="12" fill="#334155">② TGS-REQ (TGT + 원하는 SPN)</text>
  <text x="244" y="320" text-anchor="middle" font-size="12" fill="#334155">TGS-REP: 서비스 티켓</text>
  <text x="208" y="444" text-anchor="middle" font-size="12" fill="#334155">③ AP-REQ: 티켓 제출</text>

  <!-- 이벤트 배지 -->
  <rect x="404" y="182" width="66" height="22" rx="5" fill="#dcfce7"/>
  <text x="437" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4768</text>
  <rect x="404" y="278" width="66" height="22" rx="5" fill="#dcfce7"/>
  <text x="437" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4769</text>

  <!-- 경고 박스 -->
  <rect x="40" y="352" width="260" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="170" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">서비스 티켓 = 서비스 계정 키로 암호화</text>
  <text x="170" y="394" text-anchor="middle" font-size="12" fill="#334155">약한 비밀번호 → gMSA · AES로 방어</text>

  <text x="250" y="516" text-anchor="middle" font-size="12" fill="#64748b">실패: 4771(사전 인증) · 서비스 쪽 로그온: 4624</text>

  <!-- ===== NTLM (오른쪽) ===== -->
  <rect x="500" y="58" width="440" height="482" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="720" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">NTLM (구식 · 대체 경로)</text>

  <rect x="520" y="104" width="110" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">사용자</text>
  <text x="575" y="148" text-anchor="middle" font-size="12" fill="#334155">IP로 접속 등</text>

  <rect x="665" y="104" width="110" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">서버</text>
  <text x="720" y="148" text-anchor="middle" font-size="12" fill="#334155">SRV01</text>

  <rect x="810" y="104" width="110" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="865" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">DC01</text>
  <text x="865" y="148" text-anchor="middle" font-size="12" fill="#334155">검증</text>

  <line x1="575" y1="160" x2="575" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="720" y1="160" x2="720" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="865" y1="160" x2="865" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="577" y1="200" x2="716" y2="200"/>
    <line x1="716" y1="240" x2="579" y2="240"/>
    <line x1="577" y1="280" x2="716" y2="280"/>
    <line x1="722" y1="320" x2="861" y2="320"/>
    <line x1="861" y1="356" x2="724" y2="356"/>
  </g>
  <text x="646" y="192" text-anchor="middle" font-size="12" fill="#334155">① 협상</text>
  <text x="646" y="232" text-anchor="middle" font-size="12" fill="#334155">② 챌린지</text>
  <text x="646" y="272" text-anchor="middle" font-size="12" fill="#334155">③ 해시로 응답</text>
  <text x="792" y="312" text-anchor="middle" font-size="12" fill="#334155">④ 전달</text>
  <text x="792" y="348" text-anchor="middle" font-size="12" fill="#334155">결과</text>
  <rect x="877" y="308" width="54" height="22" rx="5" fill="#dcfce7"/>
  <text x="904" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4776</text>

  <rect x="520" y="412" width="400" height="104" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="720" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">위험: 해시가 비밀번호처럼 동작</text>
  <text x="720" y="458" text-anchor="middle" font-size="12" fill="#334155">릴레이 · Pass-the-Hash (개념) · NTLMv1은 2025 OS에서 제거</text>
  <text x="720" y="480" text-anchor="middle" font-size="12" fill="#14532d">방어: 사용처 감사 → Kerberos로 이전</text>
  <text x="720" y="500" text-anchor="middle" font-size="12" fill="#14532d">→ SMB·LDAP 서명 필수 → NTLM 제한</text>
</svg>
