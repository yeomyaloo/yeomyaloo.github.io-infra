<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">세션 생애 주기 — 재발급, 타임아웃, 서버 측 무효화</text>

  <!-- absolute timeout bracket -->
  <path d="M 290 78 L 290 70 L 900 70 L 900 78" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="595" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">절대 타임아웃 (예: 8시간) — 활동과 무관하게 끝</text>

  <!-- timeline -->
  <line x1="30" y1="190" x2="930" y2="190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="930" y="214" text-anchor="end" font-size="12" fill="#64748b">시간</text>

  <!-- events -->
  <circle cx="110" cy="190" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="30" y="92" width="160" height="72" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="110" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">로그인 페이지</text>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#334155">익명 세션 A</text>
  <text x="110" y="154" text-anchor="middle" font-size="11" fill="#64748b">권한 없음</text>

  <circle cx="290" cy="190" r="9" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <rect x="210" y="92" width="160" height="72" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="290" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">로그인 성공</text>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#14532d">A 폐기 → B 발급</text>
  <text x="290" y="154" text-anchor="middle" font-size="11" fill="#14532d">재발급</text>

  <rect x="390" y="92" width="190" height="72" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="485" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">요청마다</text>
  <text x="485" y="136" text-anchor="middle" font-size="12" fill="#1e3a8a">유휴 타이머 갱신</text>
  <text x="485" y="154" text-anchor="middle" font-size="11" fill="#1e3a8a">30분 무활동이면 만료</text>
  <circle cx="430" cy="190" r="5" fill="#2496ed"/>
  <circle cx="470" cy="190" r="5" fill="#2496ed"/>
  <circle cx="500" cy="190" r="5" fill="#2496ed"/>
  <circle cx="545" cy="190" r="5" fill="#2496ed"/>

  <circle cx="680" cy="190" r="9" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <rect x="600" y="92" width="160" height="72" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="680" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">권한 상승</text>
  <text x="680" y="136" text-anchor="middle" font-size="12" fill="#14532d">MFA · 관리자 모드</text>
  <text x="680" y="154" text-anchor="middle" font-size="11" fill="#14532d">B 폐기 → C 발급</text>

  <circle cx="860" cy="190" r="9" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <rect x="780" y="92" width="160" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="860" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">로그아웃 ·</text>
  <text x="860" y="136" text-anchor="middle" font-size="12" fill="#7f1d1d">비밀번호 변경</text>
  <text x="860" y="154" text-anchor="middle" font-size="11" fill="#7f1d1d">서버에서 C 삭제</text>

  <!-- connectors -->
  <line x1="110" y1="164" x2="110" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="290" y1="164" x2="290" y2="180" stroke="#15803d" stroke-width="1.5"/>
  <line x1="680" y1="164" x2="680" y2="180" stroke="#15803d" stroke-width="1.5"/>
  <line x1="860" y1="164" x2="860" y2="180" stroke="#dc2626" stroke-width="1.5"/>

  <!-- failure modes -->
  <text x="30" y="244" font-size="14" font-weight="700" fill="#b91c1c">빠뜨리면</text>
  <rect x="30" y="256" width="290" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="175" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">재발급 없음 = 세션 고정</text>
  <text x="175" y="302" text-anchor="middle" font-size="12" fill="#334155">로그인 전 A를 아는 누군가가</text>
  <text x="175" y="322" text-anchor="middle" font-size="12" fill="#334155">로그인된 세션을 공유</text>

  <rect x="335" y="256" width="290" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="480" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">타임아웃 없음</text>
  <text x="480" y="302" text-anchor="middle" font-size="12" fill="#334155">공용 PC의 열린 세션,</text>
  <text x="480" y="322" text-anchor="middle" font-size="12" fill="#334155">탈취된 세션을 계속 연장</text>

  <rect x="640" y="256" width="290" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="785" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">쿠키만 삭제</text>
  <text x="785" y="302" text-anchor="middle" font-size="12" fill="#334155">복사된 세션 ID는 계속 유효</text>
  <text x="785" y="322" text-anchor="middle" font-size="12" fill="#334155">(서명 쿠키 세션도 같은 문제)</text>

  <!-- settings -->
  <rect x="30" y="352" width="445" height="64" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="48" y="376" font-size="13" font-weight="700" fill="#0f172a">Spring Security</text>
  <text x="48" y="398" font-size="11" fill="#334155">changeSessionId() · timeout: 30m · 절대 타임아웃 필터</text>
  <rect x="485" y="352" width="445" height="64" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="503" y="376" font-size="13" font-weight="700" fill="#0f172a">FastAPI</text>
  <text x="503" y="398" font-size="11" fill="#334155">Redis 서버 측 세션 · token_urlsafe(32) · revoke_all()</text>

  <rect x="30" y="426" width="900" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="448" text-anchor="middle" font-size="13" fill="#78350f">쿠키: __Host- 접두사 · HttpOnly · Secure · SameSite=Lax · URL에 세션 ID 금지 · 로그에는 ID 해시 앞부분만</text>
</svg>
