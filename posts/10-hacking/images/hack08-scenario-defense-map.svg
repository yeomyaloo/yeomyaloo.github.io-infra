    <text x="132" y="290">egress 기본 거부 (Day 70)</text>
    <text x="132" y="318">Trivy 비밀 스캔 (Day 57)</text>
    <text x="132" y="346">유출 키 즉시 폐기</text>

    <rect x="265" y="232" width="205" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="367" y="262">NetworkPolicy 기본 거부</text>
    <text x="367" y="290">(Day 19 · 70)</text>
    <text x="367" y="318">서비스 자체 인증</text>
    <text x="367" y="346">(Redis ACL · TLS)</text>

    <rect x="500" y="232" width="205" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="602" y="262">와일드카드 Role 제거</text>
    <text x="602" y="290">SA 토큰 미마운트 (Day 69)</text>
    <text x="602" y="318">cluster-admin 바인딩 점검</text>
    <text x="602" y="346">(Day 19)</text>

    <rect x="735" y="232" width="205" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="837" y="262">PSA baseline 이상 (Day 69)</text>
    <text x="837" y="290">privileged·hostPath 제거</text>
    <text x="837" y="318">해킹 07 점검</text>
    <text x="837" y="346">체크리스트</text>
  </g>

  <!-- Detect row -->
  <g font-size="12" text-anchor="middle" fill="#1e3a8a">
    <rect x="30" y="396" width="205" height="104" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
    <text x="132" y="426">앱 로그: 요청한 URL</text>
    <text x="132" y="452">Falco: 메타데이터 접근</text>
    <text x="132" y="478">접근 로그: /.git 요청</text>

    <rect x="265" y="396" width="205" height="104" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
    <text x="367" y="426">Falco: 스캐너 실행</text>
    <text x="367" y="452">흐름 로그: 새 NS 간 연결</text>
    <text x="367" y="478">Redis 접속 로그</text>

    <rect x="500" y="396" width="205" height="104" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
    <text x="602" y="426">Falco: K8s API 접근</text>
    <text x="602" y="452">감사 로그: SA의</text>
    <text x="602" y="478">secrets list (Day 73)</text>

    <rect x="735" y="396" width="205" height="104" rx="10" fill="#eff6ff" stroke="#326ce5" stroke-width="2"/>
    <text x="837" y="426">Falco: privileged 시작</text>
    <text x="837" y="452">Falco: 민감 파일 읽기</text>
    <text x="837" y="478">감사 로그: Pod 생성자</text>
  </g>
</svg>
