<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PR마다 일회용 스테이징을 띄우고 ZAP으로 점검</text>

  <!-- trigger -->
  <rect x="20" y="170" width="140" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PR 열림</text>
  <text x="90" y="228" text-anchor="middle" font-size="13" fill="#334155">또는 정기 스캔</text>
  <text x="90" y="250" text-anchor="middle" font-size="12" fill="#64748b">(schedule)</text>

  <!-- runner frame -->
  <rect x="190" y="60" width="540" height="370" rx="14" fill="#f8fafc" stroke="#2496ed" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="210" y="86" font-size="14" font-weight="700" fill="#1d4ed8">GitHub 호스티드 러너 — Job이 끝나면 VM째 폐기</text>

  <!-- steps -->
  <rect x="210" y="102" width="150" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="285" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">① checkout</text>
  <text x="285" y="146" text-anchor="middle" font-size="12" fill="#64748b">이 PR의 코드</text>

  <rect x="380" y="102" width="330" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="545" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">② docker compose up -d --build --wait</text>
  <text x="545" y="146" text-anchor="middle" font-size="12" fill="#64748b">헬스체크 통과까지 대기</text>
  <line x1="360" y1="130" x2="376" y2="130" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- app -->
  <rect x="500" y="190" width="210" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="605" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">일회용 스테이징</text>
  <text x="605" y="246" text-anchor="middle" font-size="13" fill="#0f172a">gitops-demo-app</text>
  <text x="605" y="270" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">127.0.0.1:8000</text>
  <text x="605" y="294" text-anchor="middle" font-size="12" fill="#15803d">외부에 노출되지 않음</text>
  <line x1="605" y1="158" x2="605" y2="186" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- zap -->
  <rect x="210" y="186" width="230" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="325" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">③ ZAP Baseline</text>
  <text x="325" y="230" text-anchor="middle" font-size="12" fill="#334155">스파이더 + 수동 스캔</text>

  <rect x="210" y="258" width="230" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="325" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">④ ZAP API 스캔</text>
  <text x="325" y="302" text-anchor="middle" font-size="12" fill="#334155">openapi.json → 능동 스캔</text>

  <line x1="440" y1="216" x2="496" y2="230" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="288" x2="496" y2="274" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- teardown -->
  <rect x="210" y="350" width="500" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">⑤ docker compose down -v  (if: always())</text>
  <text x="460" y="394" text-anchor="middle" font-size="12" fill="#64748b">실패해도 환경을 남기지 않음</text>
  <line x1="605" y1="310" x2="605" y2="346" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="160" y1="220" x2="186" y2="220" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- outputs -->
  <text x="845" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">결과</text>
  <rect x="760" y="100" width="180" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="850" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">PR 체크 실패/통과</text>
  <text x="850" y="148" text-anchor="middle" font-size="12" fill="#334155">rules.tsv의 FAIL만</text>

  <rect x="760" y="178" width="180" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="850" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">아티팩트</text>
  <text x="850" y="226" text-anchor="middle" font-size="12" fill="#334155">HTML · JSON · MD 리포트</text>

  <rect x="760" y="256" width="180" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="850" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">GitHub 이슈</text>
  <text x="850" y="304" text-anchor="middle" font-size="12" fill="#334155">정기 스캔이 하나를 갱신</text>

  <rect x="760" y="334" width="180" height="64" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="850" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">SARIF</text>
  <text x="850" y="382" text-anchor="middle" font-size="12" fill="#334155">Automation sarif-json</text>

  <line x1="730" y1="250" x2="756" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="480" y="450" text-anchor="middle" font-size="13" fill="#b91c1c">target에는 러너 안의 127.0.0.1만 — 운영 · 공유 스테이징 · 남의 주소는 절대 넣지 않는다</text>
</svg>
