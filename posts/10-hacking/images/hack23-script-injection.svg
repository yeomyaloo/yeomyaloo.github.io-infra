<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">스크립트 인젝션 — 표현식 직접 삽입 vs 환경 변수 경유</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">PR 제목(작성자가 정함) = a"; ls $GITHUB_WORKSPACE"   (GitHub 공식 문서의 예)</text>

  <!-- unsafe row -->
  <rect x="20" y="80" width="920" height="170" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="40" y="108" font-size="16" font-weight="700" fill="#b91c1c">취약 — ${{ }}를 run에 직접</text>

  <rect x="40" y="122" width="400" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="146" font-size="12" fill="#64748b">워크플로 YAML</text>
  <text x="52" y="172" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">run: echo "${{ github.event.pull_request.title }}"</text>

  <line x1="440" y1="157" x2="506" y2="157" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="116" text-anchor="middle" font-size="11" fill="#334155">텍스트 치환</text>

  <rect x="510" y="122" width="410" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="522" y="146" font-size="12" fill="#64748b">셸이 실제로 실행하는 스크립트</text>
  <text x="522" y="172" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">echo "a"; <tspan fill="#dc2626" font-weight="700">ls $GITHUB_WORKSPACE</tspan>""</text>

  <text x="40" y="226" font-size="14" fill="#7f1d1d">따옴표가 닫히고 뒤의 명령이 실행된다 — 권한 있는 컨텍스트라면 시크릿·쓰기 토큰까지</text>

  <!-- safe row -->
  <rect x="20" y="270" width="920" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="40" y="298" font-size="16" font-weight="700" fill="#15803d">안전 — env로 넘기고 "$VAR"로 읽기</text>

  <rect x="40" y="312" width="400" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="334" font-size="12" fill="#64748b">워크플로 YAML</text>
  <text x="52" y="358" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">env:</text>
  <text x="70" y="374" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">PR_TITLE: ${{ github.event.pull_request.title }}</text>
  <text x="52" y="390" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">run: echo "$PR_TITLE"</text>

  <line x1="440" y1="354" x2="506" y2="354" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="342" text-anchor="middle" font-size="11" fill="#334155">변수 전달</text>

  <rect x="510" y="312" width="410" height="84" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="522" y="334" font-size="12" fill="#64748b">셸이 보는 것</text>
  <text x="522" y="358" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">echo "$PR_TITLE"     ← 스크립트는 그대로</text>
  <text x="522" y="380" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#15803d">출력: a"; ls $GITHUB_WORKSPACE"</text>

  <text x="40" y="424" font-size="14" fill="#14532d">값은 변수의 내용(데이터)일 뿐 코드로 해석되지 않는다 — zizmor template-injection · actionlint가 탐지</text>
</svg>
