<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a29h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">펌웨어 하드닝 계층 — 부팅부터 망 분리까지</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">만드는 쪽(제조사·개발자)이 고치는 것과, 사용자가 할 수 있는 것</text>

  <!-- 제조사 영역 -->
  <rect x="36" y="86" width="620" height="438" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="60" y="114" font-size="16" font-weight="700" fill="#166534">제조사 · 개발자 입장 — 신뢰 사슬을 만든다</text>

  <!-- 1 보안 부팅 -->
  <rect x="60" y="130" width="572" height="74" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="80" y="156" font-size="14" font-weight="700" fill="#166534">① 보안 부팅 (Verified Boot)</text>
  <text x="80" y="180" font-size="12" fill="#334155">ROM → 부트로더 → 커널 → 루트FS 서명을 단계로 확인. 한 곳만 틀려도 부팅 중단</text>
  <text x="80" y="197" font-size="12" fill="#15803d">→ 루트FS를 바꿔 다시 넣어도(4장) 부팅되지 않음</text>

  <!-- 2 서명 업데이트 -->
  <rect x="60" y="214" width="572" height="74" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="80" y="240" font-size="14" font-weight="700" fill="#166534">② 서명된 업데이트 + 롤백 방지</text>
  <text x="80" y="264" font-size="12" fill="#334155">제조사 개인키로 서명 → 기기가 공개키로 검증한 파일만 적용, 다운그레이드 차단</text>
  <text x="80" y="281" font-size="12" fill="#15803d">→ "풀고 다시 묶기"(FMK)로 만든 위조 펌웨어를 거부</text>

  <!-- 3 디버그 포트 -->
  <rect x="60" y="298" width="280" height="96" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="80" y="324" font-size="14" font-weight="700" fill="#166534">③ 디버그 포트 잠금</text>
  <text x="80" y="348" font-size="12" fill="#334155">UART getty 끄기 /</text>
  <text x="80" y="366" font-size="12" fill="#334155">부트로더 암호</text>
  <text x="80" y="386" font-size="12" fill="#334155">JTAG·SWD fuse로 잠금</text>

  <!-- 4 최소 서비스 -->
  <rect x="352" y="298" width="280" height="96" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="372" y="324" font-size="14" font-weight="700" fill="#166534">④ 최소 서비스</text>
  <text x="372" y="348" font-size="12" fill="#334155">텔넷·FTP 제거, 기본계정 없애기</text>
  <text x="372" y="366" font-size="12" fill="#334155">관리화면 LAN에만 바인딩</text>
  <text x="372" y="386" font-size="12" fill="#334155">BusyBox·TLS 최신으로</text>

  <!-- 5 SBOM -->
  <rect x="60" y="404" width="572" height="100" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="80" y="430" font-size="14" font-weight="700" fill="#166534">⑤ SBOM (구성요소 목록)</text>
  <text x="80" y="454" font-size="12" fill="#334155">펌웨어에 들어간 라이브러리·버전 목록 → 새 취약점 공개 시 "우리 기기에 있나?"를 조회로 답함</text>
  <text x="80" y="474" font-size="12" fill="#334155">Day 57·해킹 19의 애플리케이션 SBOM을 펌웨어로 확장. EMBA 등이 자동 생성</text>
  <text x="80" y="493" font-size="12" fill="#15803d">→ 영국 PSTI · EU CRA 흐름에서 점차 요구사항</text>

  <!-- 사용자 영역 -->
  <rect x="676" y="86" width="248" height="438" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="800" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">사용자 입장</text>
  <text x="800" y="136" text-anchor="middle" font-size="12.5" fill="#334155">못 고치는 기기는</text>
  <text x="800" y="154" text-anchor="middle" font-size="12.5" fill="#334155">격리한다</text>

  <rect x="696" y="176" width="208" height="92" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="800" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">⑥ 망 분리</text>
  <text x="800" y="226" text-anchor="middle" font-size="11.5" fill="#334155">IoT 전용 VLAN /</text>
  <text x="800" y="244" text-anchor="middle" font-size="11.5" fill="#334155">게스트 Wi-Fi</text>
  <text x="800" y="262" text-anchor="middle" font-size="11.5" fill="#64748b">해킹 26 · Day 23</text>

  <rect x="696" y="282" width="208" height="92" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="800" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">차단 로그 = 센서</text>
  <text x="800" y="332" text-anchor="middle" font-size="11.5" fill="#334155">IoT→LAN 차단에</text>
  <text x="800" y="350" text-anchor="middle" font-size="11.5" fill="#334155">로그 → Loki 알림</text>
  <text x="800" y="368" text-anchor="middle" font-size="11.5" fill="#64748b">7장 · Day 60·62</text>

  <rect x="696" y="388" width="208" height="92" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="800" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">교체 기준</text>
  <text x="800" y="438" text-anchor="middle" font-size="11.5" fill="#334155">EOL·장기 미업뎃</text>
  <text x="800" y="456" text-anchor="middle" font-size="11.5" fill="#334155">기기는 격리·교체</text>
  <text x="800" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">해킹 26 7장</text>

  <text x="800" y="504" text-anchor="middle" font-size="11.5" fill="#1e3a8a">탐지는 네트워크·경계에서</text>
</svg>
