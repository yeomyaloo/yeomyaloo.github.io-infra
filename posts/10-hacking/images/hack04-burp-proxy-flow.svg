<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Burp Suite — 요청을 가로채 보고, 고쳐서 다시 보내기</text>

  <!-- Kali -->
  <rect x="20" y="60" width="600" height="310" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="40" y="88" font-size="16" font-weight="700" fill="#14532d">Kali</text>
  <text x="84" y="88" font-size="13" fill="#15803d" font-family="Consolas,'D2Coding',monospace">10.10.10.5</text>

  <!-- Browser -->
  <rect x="40" y="115" width="160" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">브라우저</text>
  <text x="120" y="177" text-anchor="middle" font-size="13" fill="#334155">Burp 내장</text>
  <text x="120" y="197" text-anchor="middle" font-size="13" fill="#334155">Chromium</text>

  <!-- Burp -->
  <rect x="240" y="100" width="360" height="255" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Burp Suite Community</text>

  <rect x="260" y="140" width="320" height="78" rx="8" fill="#fde68a"/>
  <text x="420" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Proxy  <tspan font-family="Consolas,'D2Coding',monospace">127.0.0.1:8080</tspan></text>
  <text x="420" y="186" text-anchor="middle" font-size="13" fill="#78350f">Intercept: 멈추고 Forward / Drop</text>
  <text x="420" y="207" text-anchor="middle" font-size="13" fill="#78350f">HTTP history: 지나간 요청·응답 기록</text>

  <rect x="260" y="255" width="320" height="82" rx="8" fill="#c7d2fe"/>
  <text x="420" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Repeater</text>
  <text x="420" y="302" text-anchor="middle" font-size="13" fill="#312e81">왼쪽 Request 값 고치기 → Send</text>
  <text x="420" y="323" text-anchor="middle" font-size="13" fill="#312e81">오른쪽 Response 비교 (크기·시간)</text>

  <!-- hacklab targets -->
  <rect x="680" y="60" width="260" height="310" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="810" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">hacklab (격리 네트워크)</text>

  <rect x="700" y="115" width="220" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="810" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">DVWA</text>
  <text x="810" y="168" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">10.10.10.20</text>

  <rect x="700" y="215" width="220" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="810" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Juice Shop</text>
  <text x="810" y="268" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="Consolas,'D2Coding',monospace">10.10.10.21:3000</text>

  <text x="810" y="324" text-anchor="middle" font-size="13" fill="#334155">Target → Scope에 이 둘만 등록</text>
  <text x="810" y="345" text-anchor="middle" font-size="12" fill="#64748b">범위 밖 요청은 기록하지 않음</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="200" y1="170" x2="256" y2="170" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="420" y1="218" x2="420" y2="251" marker-end="url(#arrow)"/>
    <line x1="580" y1="165" x2="696" y2="150" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="580" y1="300" x2="696" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#334155" font-weight="700">
    <text x="228" y="160" text-anchor="middle">요청</text>
    <text x="430" y="240">Send to Repeater (Ctrl+R)</text>
    <text x="638" y="145" text-anchor="middle">Forward</text>
    <text x="640" y="306" text-anchor="middle">다시 보내기</text>
  </g>

  <text x="480" y="405" text-anchor="middle" font-size="13" fill="#334155">프런트엔드 검증을 지나친 요청이 백엔드에서 어떻게 처리되는지 확인하는 "디버깅 도구"로 쓴다</text>
</svg>
