<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">이미 커밋된 시크릿 — 대응 순서</text>

  <!-- step boxes -->
  <rect x="20" y="70" width="166" height="170" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="103" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">① 폐기·교체</text>
  <text x="103" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">가장 먼저, 지금 당장</text>
  <text x="103" y="156" text-anchor="middle" font-size="13" fill="#0f172a">키 무효화</text>
  <text x="103" y="178" text-anchor="middle" font-size="13" fill="#0f172a">새 키 발급</text>
  <text x="103" y="200" text-anchor="middle" font-size="13" fill="#0f172a">앱·CI 시크릿 갱신</text>
  <text x="103" y="226" text-anchor="middle" font-size="12" fill="#64748b">유출 값 = 쓸모없음</text>

  <rect x="206" y="70" width="166" height="170" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="289" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">② 영향 조사</text>
  <text x="289" y="126" text-anchor="middle" font-size="12" fill="#92400e">노출 기간 동안 무슨 일?</text>
  <text x="289" y="156" text-anchor="middle" font-size="13" fill="#0f172a">클라우드 감사 로그</text>
  <text x="289" y="178" text-anchor="middle" font-size="13" fill="#0f172a">GitHub 감사 로그</text>
  <text x="289" y="200" text-anchor="middle" font-size="13" fill="#0f172a">DB 접속 기록</text>
  <text x="289" y="226" text-anchor="middle" font-size="12" fill="#64748b">Day 60 Loki</text>

  <rect x="392" y="70" width="166" height="170" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="475" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">③ 히스토리 정리</text>
  <text x="475" y="126" text-anchor="middle" font-size="12" fill="#4338ca">급한 불이 아니라 청소</text>
  <text x="475" y="156" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#0f172a">git filter-repo</text>
  <text x="475" y="178" text-anchor="middle" font-size="13" fill="#0f172a">강제 푸시</text>
  <text x="475" y="200" text-anchor="middle" font-size="13" fill="#0f172a">캐시는 Support 요청</text>
  <text x="475" y="226" text-anchor="middle" font-size="12" fill="#64748b">팀에 먼저 공지</text>

  <rect x="578" y="70" width="166" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="661" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">④ 재발 방지</text>
  <text x="661" y="126" text-anchor="middle" font-size="12" fill="#15803d">들어온 경로를 막는다</text>
  <text x="661" y="156" text-anchor="middle" font-size="13" fill="#0f172a">pre-commit gitleaks</text>
  <text x="661" y="178" text-anchor="middle" font-size="13" fill="#0f172a">push protection · CI</text>
  <text x="661" y="200" text-anchor="middle" font-size="13" fill="#0f172a">시크릿 저장소로</text>
  <text x="661" y="226" text-anchor="middle" font-size="12" fill="#64748b">Day 55 · Day 71</text>

  <rect x="764" y="70" width="176" height="170" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="852" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">⑤ 기록</text>
  <text x="852" y="126" text-anchor="middle" font-size="12" fill="#334155">다음 사람을 위해</text>
  <text x="852" y="156" text-anchor="middle" font-size="13" fill="#0f172a">타임라인</text>
  <text x="852" y="178" text-anchor="middle" font-size="13" fill="#0f172a">원인 · 조치</text>
  <text x="852" y="200" text-anchor="middle" font-size="13" fill="#0f172a">포스트모템</text>
  <text x="852" y="226" text-anchor="middle" font-size="12" fill="#64748b">Day 65 · 해킹 27</text>

  <g stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="186" y1="155" x2="203" y2="155" marker-end="url(#arrow)"/>
    <line x1="372" y1="155" x2="389" y2="155" marker-end="url(#arrow)"/>
    <line x1="558" y1="155" x2="575" y2="155" marker-end="url(#arrow)"/>
    <line x1="744" y1="155" x2="761" y2="155" marker-end="url(#arrow)"/>
  </g>

  <!-- wrong order warning -->
  <rect x="20" y="270" width="920" height="110" rx="12" fill="#fff7ed" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="302" font-size="16" font-weight="700" fill="#b91c1c">흔한 실수: ③ 히스토리 정리부터 한다</text>
  <text x="40" y="330" font-size="14" fill="#0f172a">· 지우는 동안에도 키는 유효하다 — 공개 레포의 키는 몇 분 안에 수집될 수 있다</text>
  <text x="40" y="356" font-size="14" fill="#0f172a">· 포크 · 다른 사람의 클론 · PR ref · 캐시에는 원문이 남는다 → 정리는 폐기를 대신하지 못한다</text>
</svg>
