<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">rate limiting을 세 겹으로 — 게이트웨이 · 앱 · LLM 게이트웨이</text>

  <!-- clients -->
  <rect x="20" y="90" width="110" height="150" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="75" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">클라이언트</text>
  <text x="75" y="146" text-anchor="middle" font-size="12" fill="#334155">사용자 · 스크립트</text>
  <text x="75" y="166" text-anchor="middle" font-size="12" fill="#334155">다른 서비스</text>
  <text x="75" y="186" text-anchor="middle" font-size="12" fill="#334155">LLM 에이전트</text>

  <!-- layer 1 -->
  <rect x="160" y="80" width="200" height="170" rx="10" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="260" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">① 게이트웨이</text>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#1e3a8a">Traefik (Day 15)</text>
  <text x="174" y="156" font-size="12" fill="#1e3a8a">기준: IP</text>
  <text x="174" y="178" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">rateLimit average 20</text>
  <text x="174" y="196" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#1e3a8a">burst 40 / 1s</text>
  <text x="174" y="226" font-size="12" fill="#1e3a8a">앱에 닿기 전에 차단</text>

  <!-- layer 2 -->
  <rect x="390" y="80" width="200" height="170" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="490" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">② 앱</text>
  <text x="490" y="126" text-anchor="middle" font-size="12" fill="#14532d">Bucket4j · slowapi</text>
  <text x="404" y="156" font-size="12" fill="#14532d">기준: 사용자 · 엔드포인트</text>
  <text x="404" y="178" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#14532d">login 5/minute</text>
  <text x="404" y="196" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#14532d">size ≤ 100</text>
  <text x="404" y="226" font-size="12" fill="#14532d">여러 Pod면 Redis 공유</text>

  <!-- layer 3 -->
  <rect x="620" y="80" width="200" height="170" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">③ LLM 게이트웨이</text>
  <text x="720" y="126" text-anchor="middle" font-size="12" fill="#4c1d95">LiteLLM (Day 40)</text>
  <text x="634" y="156" font-size="12" fill="#4c1d95">기준: 가상 키 · 토큰 · 비용</text>
  <text x="634" y="178" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#4c1d95">rpm_limit · tpm_limit</text>
  <text x="634" y="196" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#4c1d95">max_budget</text>
  <text x="634" y="226" font-size="12" fill="#4c1d95">청구서 폭탄 방지</text>

  <!-- model -->
  <rect x="850" y="110" width="90" height="110" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="895" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">모델</text>
  <text x="895" y="180" text-anchor="middle" font-size="12" fill="#334155">vLLM</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="130" y1="165" x2="156" y2="165" marker-end="url(#arrow)"/>
    <line x1="360" y1="165" x2="386" y2="165" marker-end="url(#arrow)"/>
    <line x1="590" y1="165" x2="616" y2="165" marker-end="url(#arrow)"/>
    <line x1="820" y1="165" x2="846" y2="165" marker-end="url(#arrow)"/>
  </g>

  <!-- 429 boxes -->
  <g stroke="#b91c1c" stroke-width="2" fill="none">
    <line x1="260" y1="250" x2="260" y2="280" marker-end="url(#arrowRed)"/>
    <line x1="490" y1="250" x2="490" y2="280" marker-end="url(#arrowRed)"/>
    <line x1="720" y1="250" x2="720" y2="280" marker-end="url(#arrowRed)"/>
  </g>
  <g font-size="12">
    <rect x="170" y="284" width="180" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="260" y="304" text-anchor="middle" font-weight="700" fill="#7f1d1d">429 Too Many Requests</text>
    <text x="260" y="322" text-anchor="middle" fill="#7f1d1d">접근 로그에 기록</text>
    <rect x="400" y="284" width="180" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="490" y="304" text-anchor="middle" font-weight="700" fill="#7f1d1d">429 + Retry-After</text>
    <text x="490" y="322" text-anchor="middle" fill="#7f1d1d">rate_limited 이벤트</text>
    <rect x="630" y="284" width="180" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="720" y="304" text-anchor="middle" font-weight="700" fill="#7f1d1d">한도·예산 초과 거부</text>
    <text x="720" y="322" text-anchor="middle" fill="#7f1d1d">키별 사용량 기록</text>
  </g>

  <!-- caveats -->
  <rect x="20" y="356" width="440" height="128" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="36" y="380" font-size="14" font-weight="700" fill="#92400e">⚠ 클라이언트 IP를 어떻게 알아내나</text>
  <text x="36" y="404" font-size="12" fill="#92400e">앞에 프록시가 있으면 모두 같은 IP로 보임</text>
  <text x="36" y="424" font-size="12" fill="#92400e">X-Forwarded-For는 신뢰하는 프록시가 붙인 것만</text>
  <text x="36" y="444" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#92400e">ipStrategy.depth · forward-headers-strategy</text>
  <text x="36" y="468" font-size="12" fill="#92400e">아무 헤더나 믿으면 한도를 우회당함</text>

  <rect x="480" y="356" width="460" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="496" y="380" font-size="14" font-weight="700" fill="#0f172a">탐지 신호 (Loki · Alertmanager)</text>
  <text x="496" y="404" font-size="12" fill="#334155">429 비율 급증 · 특정 IP/사용자 집중</text>
  <text x="496" y="424" font-size="12" fill="#334155">429 뒤에도 다른 IP로 같은 계정 시도 (분산 대입)</text>
  <text x="496" y="444" font-size="12" fill="#334155">LiteLLM 키별 토큰·지출 급증 (Day 47 대시보드)</text>
  <text x="496" y="468" font-size="12" fill="#334155">가입·쿠폰 완료 수가 평소의 N배 (API6)</text>
</svg>
