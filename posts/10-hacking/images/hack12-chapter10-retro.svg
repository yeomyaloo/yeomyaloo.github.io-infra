  <text x="480" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">공격을 배운 이유는 막고, 보고, 고치기 위해서다</text>
  <text x="480" y="482" text-anchor="middle" font-size="12" fill="#64748b">모든 실습은 허가된 격리 실습장 또는 연습용 대상에서만</text>
