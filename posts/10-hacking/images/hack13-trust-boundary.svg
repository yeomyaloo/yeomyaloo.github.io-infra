<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">신뢰 경계 — 들어올 때 검증, 나갈 때 인코딩</text>

  <!-- Zone A: outside -->
  <rect x="20" y="58" width="210" height="384" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="125" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">경계 밖 (source)</text>
  <rect x="36" y="100" width="178" height="50" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="125" y="130" text-anchor="middle" font-size="13" fill="#0f172a">요청 쿼리·경로·본문</text>
  <rect x="36" y="166" width="178" height="50" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="125" y="196" text-anchor="middle" font-size="13" fill="#0f172a">헤더 · 쿠키</text>
  <rect x="36" y="232" width="178" height="50" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="125" y="262" text-anchor="middle" font-size="13" fill="#0f172a">업로드 파일 이름·내용</text>
  <rect x="36" y="298" width="178" height="50" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="125" y="328" text-anchor="middle" font-size="13" fill="#0f172a">외부 API · LLM 응답</text>
  <rect x="36" y="364" width="178" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="125" y="386" text-anchor="middle" font-size="13" fill="#0f172a">내부 서비스·DB의 값</text>
  <text x="125" y="404" text-anchor="middle" font-size="11" fill="#991b1b">처음 출처가 사용자일 수 있음</text>

  <!-- Boundary line -->
  <line x1="250" y1="52" x2="250" y2="448" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="250" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">신뢰 경계</text>

  <!-- Zone B: app -->
  <rect x="270" y="58" width="420" height="384" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="480" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">내 앱 (신뢰 영역)</text>

  <rect x="288" y="140" width="150" height="200" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="363" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">① 입구: 검증</text>
  <text x="363" y="200" text-anchor="middle" font-size="13" fill="#14532d">타입 · enum 우선</text>
  <text x="363" y="226" text-anchor="middle" font-size="13" fill="#14532d">길이 · 범위 제한</text>
  <text x="363" y="252" text-anchor="middle" font-size="13" fill="#14532d">정규화 후 검증</text>
  <text x="363" y="278" text-anchor="middle" font-size="13" fill="#14532d">서버 측에서</text>
  <text x="363" y="314" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas,'D2Coding',monospace">@Valid / Pydantic</text>

  <rect x="456" y="200" width="78" height="80" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="495" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">비즈니스</text>
  <text x="495" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">로직</text>

  <rect x="552" y="140" width="122" height="200" rx="8" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="613" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">② 출구</text>
  <text x="613" y="200" text-anchor="middle" font-size="13" fill="#1e3a8a">인코딩 · 바인딩</text>
  <text x="613" y="226" text-anchor="middle" font-size="13" fill="#1e3a8a">문맥별로</text>
  <text x="613" y="252" text-anchor="middle" font-size="13" fill="#1e3a8a">마지막 순간에</text>
  <text x="613" y="278" text-anchor="middle" font-size="13" fill="#1e3a8a">근본 조치</text>

  <text x="480" y="378" text-anchor="middle" font-size="12" fill="#334155">에러 응답은 일반 메시지 + 오류 ID, 로그는 비밀 없이</text>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#334155">권한은 최소로 (DB 계정 · Actuator · 컨테이너)</text>

  <!-- arrows source -> validate -->
  <line x1="214" y1="125" x2="286" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="191" x2="286" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="257" x2="286" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="323" x2="286" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="214" y1="389" x2="286" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="438" y1="240" x2="454" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="534" y1="240" x2="550" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Zone C: interpreters -->
  <line x1="710" y1="52" x2="710" y2="448" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="710" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">신뢰 경계</text>
  <rect x="730" y="58" width="210" height="384" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="835" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">해석기 (sink)</text>
  <rect x="744" y="100" width="182" height="50" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="835" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">DB</text>
  <text x="835" y="140" text-anchor="middle" font-size="12" fill="#334155">파라미터 바인딩</text>
  <rect x="744" y="166" width="182" height="50" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="835" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">브라우저</text>
  <text x="835" y="206" text-anchor="middle" font-size="12" fill="#334155">템플릿 자동 이스케이프</text>
  <rect x="744" y="232" width="182" height="50" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="835" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">셸 · OS 명령</text>
  <text x="835" y="272" text-anchor="middle" font-size="12" fill="#334155">셸 없이 인자 배열</text>
  <rect x="744" y="298" width="182" height="50" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="835" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">파일 시스템</text>
  <text x="835" y="338" text-anchor="middle" font-size="12" fill="#334155">정규화 + 기준 디렉터리</text>
  <rect x="744" y="364" width="182" height="50" rx="8" fill="#ffffff" stroke="#2496ed"/>
  <text x="835" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">로그</text>
  <text x="835" y="404" text-anchor="middle" font-size="12" fill="#334155">구조화(JSON) 필드</text>

  <!-- arrows output -> sinks -->
  <line x1="674" y1="190" x2="742" y2="125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="215" x2="742" y2="191" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="240" x2="742" y2="257" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="265" x2="742" y2="323" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="290" x2="742" y2="389" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="480" width="920" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="501" text-anchor="middle" font-size="13" fill="#78350f">입력 검증은 공격면을 줄이고, 출구의 인코딩·바인딩이 근본 조치 — 둘 다 한다 · 해킹 14의 SAST는 이 그림을 source → sink로 본다</text>
</svg>
