<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">포트 상태 — SYN 스캔(-sS)에 대한 대상의 응답</text>

  <!-- Column 1: open -->
  <rect x="20" y="60" width="300" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="94" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d" font-family="Consolas,'D2Coding',monospace">open</text>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="70" y="124">Kali</text><text x="270" y="124">대상</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="70" y1="132" x2="70" y2="290"/><line x1="270" y1="132" x2="270" y2="290"/>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="72" y1="165" x2="266" y2="165" marker-end="url(#arrow)"/>
    <line x1="268" y1="215" x2="74" y2="215" marker-end="url(#arrow)"/>
    <line x1="72" y1="265" x2="266" y2="265" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="170" y="157" fill="#334155">SYN</text>
    <text x="170" y="207" fill="#15803d">SYN/ACK</text>
    <text x="170" y="257" fill="#334155">RST</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="170" y="322" fill="#14532d">서비스가 듣고 있음</text>
    <text x="170" y="346" fill="#14532d" font-weight="700">→ 공격 표면: 꼭 필요한가?</text>
    <text x="170" y="372" fill="#64748b" font-size="12">-sS는 연결을 완성하지 않음</text>
  </g>

  <!-- Column 2: closed -->
  <rect x="330" y="60" width="300" height="330" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="94" text-anchor="middle" font-size="20" font-weight="700" fill="#334155" font-family="Consolas,'D2Coding',monospace">closed</text>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="380" y="124">Kali</text><text x="580" y="124">대상</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="380" y1="132" x2="380" y2="290"/><line x1="580" y1="132" x2="580" y2="290"/>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="382" y1="165" x2="576" y2="165" marker-end="url(#arrow)"/>
    <line x1="578" y1="215" x2="384" y2="215" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle" font-family="Consolas,'D2Coding',monospace">
    <text x="480" y="157" fill="#334155">SYN</text>
    <text x="480" y="207" fill="#334155">RST</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="480" y="322" fill="#334155">듣는 서비스 없음 · nft reject</text>
    <text x="480" y="346" fill="#334155" font-weight="700">→ 호스트 존재는 드러남</text>
    <text x="480" y="372" fill="#64748b" font-size="12">정상 클라이언트는 빨리 실패를 앎</text>
  </g>

  <!-- Column 3: filtered -->
  <rect x="640" y="60" width="300" height="330" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="790" y="94" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309" font-family="Consolas,'D2Coding',monospace">filtered</text>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="690" y="124">Kali</text><text x="890" y="124">대상</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="690" y1="132" x2="690" y2="290"/><line x1="890" y1="132" x2="890" y2="290"/>
  </g>
  <rect x="826" y="140" width="40" height="150" rx="4" fill="#fde68a" stroke="#f59e0b"/>
  <text x="846" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f" transform="rotate(-90 846 222)">nftables drop</text>
  <line x1="692" y1="165" x2="822" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="757" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" font-family="Consolas,'D2Coding',monospace">SYN</text>
  <g stroke="#dc2626" stroke-width="3">
    <line x1="745" y1="203" x2="769" y2="227"/>
    <line x1="769" y1="203" x2="745" y2="227"/>
  </g>
  <text x="757" y="252" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">응답 없음</text>
  <g font-size="13" text-anchor="middle">
    <text x="790" y="322" fill="#78350f">방화벽이 버림 (policy drop)</text>
    <text x="790" y="346" fill="#78350f" font-weight="700">→ 정보 최소 · 스캔 느려짐</text>
    <text x="790" y="372" fill="#64748b" font-size="12">같은 L2면 ARP로 존재는 보임</text>
  </g>

  <!-- Banner -->
  <rect x="20" y="408" width="920" height="50" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Day 67 nftables:  drop → filtered   ·   reject with tcp reset → closed   ·   accept + 서비스 → open</text>
</svg>
