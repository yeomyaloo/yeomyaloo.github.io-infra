<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">집 네트워크 분리 — IoT와 손님은 인터넷만 (Day 23 VLAN)</text>

  <!-- 인터넷 + 라우터 -->
  <rect x="400" y="58" width="160" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">인터넷</text>
  <rect x="340" y="130" width="280" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="480" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">라우터 + 방화벽 (VLAN 트렁크)</text>
  <text x="480" y="178" text-anchor="middle" font-size="12" fill="#334155">공유기 · OpenWrt · 또는 홈랩 서버 + nftables</text>
  <line x1="480" y1="102" x2="480" y2="128" stroke="#334155" stroke-width="2"/>

  <!-- 네 세그먼트 -->
  <rect x="20" y="250" width="215" height="170" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="127" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">main</text>
  <text x="127" y="300" text-anchor="middle" font-size="12" fill="#334155">기본 · 192.168.0.0/24</text>
  <text x="127" y="330" text-anchor="middle" font-size="12" fill="#334155">내 노트북 · 휴대폰</text>
  <text x="127" y="350" text-anchor="middle" font-size="12" fill="#334155">가족 기기</text>

  <rect x="255" y="250" width="215" height="170" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="362" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">lab</text>
  <text x="362" y="300" text-anchor="middle" font-size="12" fill="#334155">VLAN 10 · 192.168.10.0/24</text>
  <text x="362" y="330" text-anchor="middle" font-size="12" fill="#334155">홈랩 서버</text>
  <rect x="275" y="350" width="175" height="54" rx="8" fill="#ffffff" stroke="#15803d" stroke-dasharray="5 4"/>
  <text x="362" y="372" text-anchor="middle" font-size="11" fill="#14532d">그 안의 hacklab · adlab</text>
  <text x="362" y="390" text-anchor="middle" font-size="11" fill="#14532d">Internal Network로 또 격리</text>

  <rect x="490" y="250" width="215" height="170" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="597" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">iot</text>
  <text x="597" y="300" text-anchor="middle" font-size="12" fill="#334155">VLAN 20 · 192.168.20.0/24</text>
  <text x="597" y="330" text-anchor="middle" font-size="12" fill="#334155">플러그 · 카메라 · TV</text>
  <text x="597" y="356" text-anchor="middle" font-size="12" fill="#991b1b">인터넷만 허용</text>
  <text x="597" y="376" text-anchor="middle" font-size="12" fill="#991b1b">내부망으로 새 연결 금지</text>

  <rect x="725" y="250" width="215" height="170" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="832" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">guest</text>
  <text x="832" y="300" text-anchor="middle" font-size="12" fill="#334155">VLAN 30 · 게스트 SSID</text>
  <text x="832" y="330" text-anchor="middle" font-size="12" fill="#334155">손님 기기</text>
  <text x="832" y="356" text-anchor="middle" font-size="12" fill="#78350f">인터넷만 허용</text>
  <text x="832" y="376" text-anchor="middle" font-size="12" fill="#78350f">게스트끼리도 격리</text>

  <!-- 라우터에서 세그먼트로 -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M400,194 L127,246"/>
    <path d="M450,194 L362,246"/>
    <path d="M510,194 L597,246"/>
    <path d="M560,194 L832,246"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="240" y="208">untagged</text>
    <text x="412" y="228" text-anchor="start">tag 10</text>
    <text x="566" y="228" text-anchor="start">tag 20</text>
    <text x="712" y="216">tag 30</text>
  </g>

  <!-- 허용 / 차단 화살표 -->
  <path d="M235,440 Q300,470 362,424" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="250" y="484" text-anchor="middle" font-size="12" fill="#14532d">main → lab: SSH · 웹만 허용</text>

  <path d="M597,424 Q480,500 140,424" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowr)"/>
  <text x="560" y="486" text-anchor="middle" font-size="12" fill="#991b1b">iot → main·lab: 차단 + 로그 "IOT-TO-LAN"</text>
  <text x="560" y="506" text-anchor="middle" font-size="12" fill="#991b1b">(예방이자 탐지 센서)</text>

  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#64748b">가정용 공유기라면 첫걸음은 "게스트 Wi-Fi(내부망 접근 차단)로 IoT 옮기기"</text>
</svg>
