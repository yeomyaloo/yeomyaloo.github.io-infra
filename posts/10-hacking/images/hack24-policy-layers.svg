<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">IaC 점검 계층 — CI · 배포 직전 · 어드미션 · 런타임</text>

  <!-- columns -->
  <rect x="20" y="60" width="214" height="290" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="127" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">① PR (코드)</text>
  <text x="127" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Checkov · Trivy</text>
  <text x="127" y="148" text-anchor="middle" font-size="12" fill="#334155">보는 것: 레포의 파일</text>
  <text x="127" y="168" text-anchor="middle" font-size="12" fill="#334155">Terraform + K8s</text>
  <text x="127" y="198" text-anchor="middle" font-size="12" fill="#334155">우회: kubectl 직접 적용</text>
  <text x="127" y="218" text-anchor="middle" font-size="12" fill="#334155">은 거치지 않음</text>
  <text x="127" y="248" text-anchor="middle" font-size="12" fill="#334155">예외: 코드 주석 (리뷰됨)</text>
  <text x="127" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">가장 빠르고 쌈</text>

  <rect x="248" y="60" width="214" height="290" rx="12" fill="#e0f2fe" stroke="#2496ed" stroke-width="2"/>
  <text x="355" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">② 배포 직전</text>
  <text x="355" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">plan JSON · 렌더링</text>
  <text x="355" y="148" text-anchor="middle" font-size="12" fill="#334155">변수 · for_each · 모듈이</text>
  <text x="355" y="168" text-anchor="middle" font-size="12" fill="#334155">모두 풀린 최종 값</text>
  <text x="355" y="198" text-anchor="middle" font-size="12" fill="#334155">kustomize build 결과</text>
  <text x="355" y="218" text-anchor="middle" font-size="12" fill="#334155">helm template 결과</text>
  <text x="355" y="248" text-anchor="middle" font-size="12" fill="#334155">plan에 민감 값 주의</text>
  <text x="355" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">정적 렌더링 한계 보완</text>

  <rect x="476" y="60" width="214" height="290" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="583" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">③ 클러스터 입구</text>
  <text x="583" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">PSA · Kyverno · OPA</text>
  <text x="583" y="148" text-anchor="middle" font-size="12" fill="#334155">보는 것: API에 들어오는</text>
  <text x="583" y="168" text-anchor="middle" font-size="12" fill="#334155">최종 K8s 객체</text>
  <text x="583" y="198" text-anchor="middle" font-size="12" fill="#334155">GitOps · 수동 · Helm</text>
  <text x="583" y="218" text-anchor="middle" font-size="12" fill="#334155">모든 경로를 봄</text>
  <text x="583" y="248" text-anchor="middle" font-size="12" fill="#334155">클라우드 리소스는 못 봄</text>
  <text x="583" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">반드시 막는 강제 계층</text>

  <rect x="704" y="60" width="236" height="290" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="822" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">④ 실행 중</text>
  <text x="822" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Falco · kube-bench</text>
  <text x="822" y="148" text-anchor="middle" font-size="12" fill="#334155">보는 것: 실제 행위 ·</text>
  <text x="822" y="168" text-anchor="middle" font-size="12" fill="#334155">노드 설정</text>
  <text x="822" y="198" text-anchor="middle" font-size="12" fill="#334155">설정이 아닌 행동을 탐지</text>
  <text x="822" y="248" text-anchor="middle" font-size="12" fill="#334155">Day 69 · Day 72</text>
  <text x="822" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">이미 실행된 뒤 · 사후</text>

  <g stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="234" y1="205" x2="245" y2="205" marker-end="url(#arrow)"/>
    <line x1="462" y1="205" x2="473" y2="205" marker-end="url(#arrow)"/>
    <line x1="690" y1="205" x2="701" y2="205" marker-end="url(#arrow)"/>
  </g>

  <!-- same policy bridge -->
  <path d="M127,350 L127,392 L583,392 L583,354" stroke="#4f46e5" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="200" y="404" width="560" height="52" rx="10" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="480" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">팀 고유 규칙은 같은 정책 파일을 양쪽에서</text>
  <text x="480" y="446" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">kyverno apply (CI)  ↔  Kyverno (클러스터) · conftest ↔ Gatekeeper</text>
</svg>
