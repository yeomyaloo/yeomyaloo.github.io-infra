<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">여러 원천을 하나의 타임라인으로 — 먼저 UTC로 맞춘다</text>

  <!-- 원천들 -->
  <g font-size="12">
    <rect x="20" y="64" width="250" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="86" font-size="14" font-weight="700" fill="#78350f">웹 접근 로그 (DVWA)</text>
    <text x="34" y="108" fill="#334155">실습장 Loki · 시각 +0900</text>

    <rect x="20" y="132" width="250" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="34" y="154" font-size="14" font-weight="700" fill="#991b1b">Falco 경보 (Day 72)</text>
    <text x="34" y="176" fill="#334155">클러스터 Loki · UTC (Z)</text>

    <rect x="20" y="200" width="250" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="34" y="222" font-size="14" font-weight="700" fill="#1e3a8a">K8s 감사 로그 (Day 73)</text>
    <text x="34" y="244" fill="#334155">클러스터 Loki · UTC (Z)</text>

    <rect x="20" y="268" width="250" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="34" y="290" font-size="14" font-weight="700" fill="#14532d">journald · auth.log</text>
    <text x="34" y="312" fill="#334155">epoch μs · 로컬 시간(KST)</text>

    <rect x="20" y="336" width="250" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="34" y="358" font-size="14" font-weight="700" fill="#3730a3">auditd (Day 67)</text>
    <text x="34" y="380" fill="#334155">epoch 초 · ausearch는 로컬 시간</text>
  </g>

  <!-- 수집 -->
  <rect x="320" y="150" width="190" height="160" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="415" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">내보내기</text>
  <text x="415" y="204" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">logcli --output=jsonl</text>
  <text x="415" y="226" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">journalctl -o json</text>
  <text x="415" y="248" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#334155">ausearch --format csv</text>
  <text x="415" y="276" text-anchor="middle" font-size="12" fill="#b91c1c">+ sha256sum</text>
  <text x="415" y="294" text-anchor="middle" font-size="12" fill="#64748b">(저장소가 둘 → 따로 받기)</text>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M270,93 Q300,120 318,170"/>
    <path d="M270,161 Q296,175 318,196"/>
    <path d="M270,229 L318,229"/>
    <path d="M270,297 Q296,285 318,264"/>
    <path d="M270,365 Q300,340 318,290"/>
  </g>

  <!-- 정규화 -->
  <rect x="560" y="150" width="170" height="160" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="645" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">정규화</text>
  <text x="645" y="204" text-anchor="middle" font-size="12" fill="#334155">시각 → UTC</text>
  <text x="645" y="226" text-anchor="middle" font-size="12" fill="#334155">공통 열로</text>
  <text x="645" y="248" text-anchor="middle" font-size="12" fill="#334155">time · source · 주체</text>
  <text x="645" y="270" text-anchor="middle" font-size="12" fill="#334155">· event · detail</text>
  <text x="645" y="294" text-anchor="middle" font-size="12" font-family="Consolas,'D2Coding',monospace" fill="#115e59">timeline.py</text>
  <line x1="512" y1="230" x2="556" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 결과 -->
  <rect x="780" y="150" width="160" height="160" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="860" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">timeline.csv</text>
  <text x="860" y="206" text-anchor="middle" font-size="12" fill="#334155">시간순 정렬</text>
  <text x="860" y="228" text-anchor="middle" font-size="12" fill="#334155">고정점에서</text>
  <text x="860" y="248" text-anchor="middle" font-size="12" fill="#334155">앞뒤로 넓히기</text>
  <text x="860" y="276" text-anchor="middle" font-size="12" fill="#64748b">규모가 커지면</text>
  <text x="860" y="294" text-anchor="middle" font-size="12" fill="#64748b">plaso · Timesketch</text>
  <line x1="732" y1="230" x2="776" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 하단 타임라인 띠 -->
  <text x="20" y="430" font-size="14" font-weight="700" fill="#0f172a">INC-20261115-01 (UTC)</text>
  <line x1="40" y1="480" x2="930" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="80" cy="480" r="7" fill="#f59e0b"/>
    <text x="80" y="462" fill="#78350f">01:02 정찰</text>
    <text x="80" y="502" fill="#64748b">t0</text>

    <circle cx="190" cy="480" r="7" fill="#f59e0b" stroke="#b91c1c" stroke-width="2"/>
    <text x="190" y="462" fill="#78350f">01:07 알림</text>
    <text x="190" y="502" fill="#b91c1c">t1 (아무도 안 봄)</text>

    <circle cx="300" cy="480" r="7" fill="#f59e0b"/>
    <text x="300" y="462" fill="#78350f">01:14 SQLi</text>

    <circle cx="410" cy="480" r="7" fill="#dc2626"/>
    <text x="410" y="462" fill="#991b1b">01:31 셸</text>

    <circle cx="510" cy="480" r="7" fill="#2563eb"/>
    <text x="510" y="462" fill="#1e3a8a">01:34 403×57</text>

    <circle cx="610" cy="480" r="7" fill="#2563eb" stroke="#0f172a" stroke-width="2"/>
    <text x="610" y="462" fill="#1e3a8a">01:36 인지</text>
    <text x="610" y="502" fill="#0f172a">t2 · SEV2</text>

    <circle cx="710" cy="480" r="7" fill="#4f46e5"/>
    <text x="710" y="462" fill="#3730a3">01:43 cron</text>

    <circle cx="800" cy="480" r="7" fill="#0d9488"/>
    <text x="800" y="462" fill="#115e59">01:52 격리</text>
    <text x="800" y="502" fill="#115e59">t3</text>

    <circle cx="890" cy="480" r="7" fill="#15803d"/>
    <text x="890" y="462" fill="#14532d">03:30 복구</text>
    <text x="890" y="502" fill="#14532d">t4</text>
  </g>
  <text x="480" y="540" text-anchor="middle" font-size="12" fill="#64748b">t1 → t2 사이 29분 = 라우팅 공백(해킹 10) → 포스트모템 액션 아이템</text>
</svg>
