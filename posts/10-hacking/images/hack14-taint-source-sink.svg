<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">taint 분석 — source에서 sink까지, sanitizer를 거쳤나</text>

  <!-- column headers -->
  <text x="130" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">source</text>
  <text x="370" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">전파</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">sanitizer</text>
  <text x="830" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">sink</text>

  <!-- lane 1: SQLi (reported) -->
  <rect x="20" y="84" width="920" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="36" y="106" font-size="13" font-weight="700" fill="#991b1b">경로 1 — 보고됨 (java/sql-injection, tainted-sql-string)</text>
  <rect x="40" y="124" width="180" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="148" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">@RequestParam</text>
  <text x="130" y="168" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">String name</text>
  <rect x="250" y="124" width="240" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="148" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">sql = "SELECT … '"</text>
  <text x="370" y="168" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">      + name + "'"</text>
  <rect x="520" y="124" width="160" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text x="600" y="157" text-anchor="middle" font-size="13" fill="#b91c1c">없음</text>
  <rect x="720" y="124" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="820" y="148" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">jdbc.queryForList</text>
  <text x="820" y="168" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">(sql)</text>
  <line x1="220" y1="152" x2="246" y2="152" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="152" x2="516" y2="152" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="680" y1="152" x2="716" y2="152" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="480" y="216" text-anchor="middle" font-size="13" fill="#991b1b">오염된 값이 그대로 해석기에 도착 → 결과로 보고, PR 체크 실패</text>

  <!-- lane 2: path (not reported) -->
  <rect x="20" y="250" width="920" height="150" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="36" y="272" font-size="13" font-weight="700" fill="#14532d">경로 2 — 보고 안 함 (sanitizer 통과)</text>
  <rect x="40" y="290" width="180" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="314" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">@RequestParam</text>
  <text x="130" y="334" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">String name</text>
  <rect x="250" y="290" width="240" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="370" y="324" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">resolveSafe(name)</text>
  <rect x="520" y="290" width="160" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" font-size="12" fill="#14532d">허용 목록</text>
  <text x="600" y="334" text-anchor="middle" font-size="11" fill="#14532d" font-family="Consolas,'D2Coding',monospace">normalize+startsWith</text>
  <rect x="720" y="290" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2496ed" stroke-width="2"/>
  <text x="820" y="314" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">Files.readAllBytes</text>
  <text x="820" y="334" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">(path)</text>
  <line x1="220" y1="318" x2="246" y2="318" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="318" x2="516" y2="318" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="680" y1="318" x2="716" y2="318" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="480" y="382" text-anchor="middle" font-size="13" fill="#14532d">sanitizer를 지나며 taint 해제 → 보고하지 않음 (도구가 모르는 검증이면 오탐 → 모델에 추가)</text>

  <rect x="20" y="416" width="920" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="441" text-anchor="middle" font-size="13" fill="#78350f">source·sink는 해킹 13의 신뢰 경계 입구·출구 · Semgrep CE는 파일 안 흐름, CodeQL은 파일 간 흐름까지 추적</text>
</svg>
