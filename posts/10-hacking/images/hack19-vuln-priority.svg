<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">취약점 우선순위 — KEV → EPSS → CVSS → 도달 가능성</text>

  <!-- start -->
  <rect x="20" y="90" width="120" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="80" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SCA 결과</text>
  <text x="80" y="148" text-anchor="middle" font-size="13" fill="#334155">취약점 30개</text>

  <!-- decisions -->
  <rect x="170" y="90" width="180" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="260" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">KEV 등재?</text>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#334155">(실제 악용 사실, CISA)</text>

  <rect x="380" y="90" width="180" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="470" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">EPSS 상위 1%</text>
  <text x="470" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">+ 외부 노출?</text>
  <text x="470" y="162" text-anchor="middle" font-size="12" fill="#334155">(30일 악용 확률, FIRST)</text>

  <rect x="590" y="90" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="670" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">CVSS High 이상?</text>
  <text x="670" y="148" text-anchor="middle" font-size="12" fill="#334155">(성공 시 심각도)</text>

  <rect x="780" y="90" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="860" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">도달 가능?</text>
  <text x="860" y="148" text-anchor="middle" font-size="12" fill="#334155">(취약 함수를 호출?)</text>

  <!-- horizontal arrows (아니오 / 예) -->
  <g stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="140" y1="130" x2="166" y2="130" marker-end="url(#arrow)"/>
    <line x1="350" y1="130" x2="376" y2="130" marker-end="url(#arrow)"/>
    <line x1="560" y1="130" x2="586" y2="130" marker-end="url(#arrow)"/>
    <line x1="750" y1="130" x2="776" y2="130" marker-end="url(#arrow)"/>
  </g>
  <text x="363" y="82" text-anchor="middle" font-size="12" fill="#64748b">아니오</text>
  <text x="573" y="82" text-anchor="middle" font-size="12" fill="#64748b">아니오</text>
  <text x="763" y="82" text-anchor="middle" font-size="12" fill="#64748b">예</text>

  <!-- vertical arrows to outcomes -->
  <g stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="260" y1="170" x2="260" y2="226" marker-end="url(#arrow)"/>
    <line x1="470" y1="170" x2="470" y2="226" marker-end="url(#arrow)"/>
    <line x1="670" y1="170" x2="670" y2="226" marker-end="url(#arrow)"/>
    <line x1="860" y1="170" x2="860" y2="226" marker-end="url(#arrow)"/>
    <path d="M940,150 L952,150 L952,375 L944,375" marker-end="url(#arrow)"/>
  </g>
  <text x="272" y="204" font-size="12" fill="#64748b">예</text>
  <text x="482" y="204" font-size="12" fill="#64748b">예</text>
  <text x="682" y="204" font-size="12" fill="#64748b">아니오</text>
  <text x="872" y="204" font-size="12" fill="#64748b">예</text>
  <text x="945" y="200" font-size="12" fill="#64748b" text-anchor="end">아니오</text>

  <!-- outcomes -->
  <rect x="170" y="230" width="180" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="260" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">P0</text>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#0f172a">즉시 ~ 48시간</text>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#b91c1c">이미 공격에 쓰이는 중</text>

  <rect x="380" y="230" width="180" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="470" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">P0</text>
  <text x="470" y="290" text-anchor="middle" font-size="14" fill="#0f172a">즉시 ~ 48시간</text>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#b91c1c">곧 공격받을 가능성 높음</text>

  <rect x="590" y="230" width="160" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="670" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">P3</text>
  <text x="670" y="290" text-anchor="middle" font-size="14" fill="#0f172a">정기 갱신</text>
  <text x="670" y="316" text-anchor="middle" font-size="12" fill="#64748b">Dependabot이 흡수</text>

  <rect x="780" y="230" width="160" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="860" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">P1</text>
  <text x="860" y="288" text-anchor="middle" font-size="14" fill="#0f172a">1주 안에</text>
  <text x="860" y="312" text-anchor="middle" font-size="12" fill="#92400e">업그레이드 PR</text>

  <rect x="780" y="345" width="160" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">P2 · 다음 스프린트</text>
  <text x="860" y="393" text-anchor="middle" font-size="12" fill="#15803d">예외에 사유 + 만료일</text>

  <!-- legend -->
  <rect x="20" y="360" width="730" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="388" font-size="14" fill="#0f172a"><tspan font-weight="700">KEV</tspan> = 실제로 악용된 사실 (있다/없다)</text>
  <text x="40" y="412" font-size="14" fill="#0f172a"><tspan font-weight="700">EPSS</tspan> = 앞으로 30일 안에 악용 시도가 관찰될 확률 (0~1)</text>
  <text x="40" y="436" font-size="14" fill="#0f172a"><tspan font-weight="700">CVSS</tspan> = 성공했을 때의 심각도 — 점수 하나로 순서를 정하지 않는다</text>
</svg>
