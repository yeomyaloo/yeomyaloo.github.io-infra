<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OWASP API Security Top 10 2023 — 네 묶음으로 보기</text>
  <text x="300" y="64" text-anchor="middle" font-size="13" fill="#64748b">항목 (2026-11 기준 최신판)</text>
  <text x="775" y="64" text-anchor="middle" font-size="13" fill="#64748b">묶음별 핵심 조치</text>

  <!-- rows: y = 80 + i*40, h = 36 -->
  <g font-size="13">
    <!-- API1 -->
    <rect x="20" y="80" width="560" height="36" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="34" y="103" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#7f1d1d">API1</text>
    <text x="90" y="96" fill="#0f172a" font-weight="700">Broken Object Level Authorization (BOLA)</text>
    <text x="90" y="111" font-size="11" fill="#7f1d1d">객체 단위 인가 실패 — ID만 바꿔 남의 객체 접근</text>
    <!-- API2 -->
    <rect x="20" y="120" width="560" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="143" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#312e81">API2</text>
    <text x="90" y="136" fill="#0f172a" font-weight="700">Broken Authentication</text>
    <text x="90" y="151" font-size="11" fill="#312e81">인증 결함 — 토큰·세션·로그인 흐름</text>
    <!-- API3 -->
    <rect x="20" y="160" width="560" height="36" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="34" y="183" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#7f1d1d">API3</text>
    <text x="90" y="176" fill="#0f172a" font-weight="700">Broken Object Property Level Authorization (BOPLA)</text>
    <text x="90" y="191" font-size="11" fill="#7f1d1d">속성 단위 인가 실패 — 과도한 노출 + 대량 할당</text>
    <!-- API4 -->
    <rect x="20" y="200" width="560" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="34" y="223" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#92400e">API4</text>
    <text x="90" y="216" fill="#0f172a" font-weight="700">Unrestricted Resource Consumption</text>
    <text x="90" y="231" font-size="11" fill="#92400e">자원 소비 제한 없음 — 빈도·크기·페이지·비용</text>
    <!-- API5 -->
    <rect x="20" y="240" width="560" height="36" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="34" y="263" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#7f1d1d">API5</text>
    <text x="90" y="256" fill="#0f172a" font-weight="700">Broken Function Level Authorization (BFLA)</text>
    <text x="90" y="271" font-size="11" fill="#7f1d1d">기능 단위 인가 실패 — 일반 사용자가 관리 기능 호출</text>
    <!-- API6 -->
    <rect x="20" y="280" width="560" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="34" y="303" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#92400e">API6</text>
    <text x="90" y="296" fill="#0f172a" font-weight="700">Unrestricted Access to Sensitive Business Flows</text>
    <text x="90" y="311" font-size="11" fill="#92400e">구매·가입·쿠폰 같은 흐름의 자동화 남용</text>
    <!-- API7 -->
    <rect x="20" y="320" width="560" height="36" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="34" y="343" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#334155">API7</text>
    <text x="90" y="336" fill="#0f172a" font-weight="700">Server Side Request Forgery</text>
    <text x="90" y="351" font-size="11" fill="#334155">서버가 사용자 URL을 대신 요청 (해킹 05)</text>
    <!-- API8 -->
    <rect x="20" y="360" width="560" height="36" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="34" y="383" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#334155">API8</text>
    <text x="90" y="376" fill="#0f172a" font-weight="700">Security Misconfiguration</text>
    <text x="90" y="391" font-size="11" fill="#334155">CORS·보안 헤더·에러 노출·기본값 (해킹 17)</text>
    <!-- API9 -->
    <rect x="20" y="400" width="560" height="36" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="34" y="423" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#334155">API9</text>
    <text x="90" y="416" fill="#0f172a" font-weight="700">Improper Inventory Management</text>
    <text x="90" y="431" font-size="11" fill="#334155">문서에 없는 옛 버전·디버그·숨은 엔드포인트</text>
    <!-- API10 -->
    <rect x="20" y="440" width="560" height="36" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="34" y="463" font-family="Consolas,'D2Coding',monospace" font-weight="700" fill="#334155">API10</text>
    <text x="90" y="456" fill="#0f172a" font-weight="700">Unsafe Consumption of APIs</text>
    <text x="90" y="471" font-size="11" fill="#334155">외부 API 응답을 검증 없이 신뢰</text>
  </g>

  <!-- right: group boxes -->
  <g font-size="13">
    <rect x="610" y="80" width="330" height="100" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="626" y="104" font-size="15" font-weight="700" fill="#7f1d1d">인가 (API1 · 3 · 5)</text>
    <text x="626" y="128" fill="#7f1d1d">기능: 경로·메서드 규칙 + denyAll()</text>
    <text x="626" y="149" fill="#7f1d1d">객체: findByIdAndOwnerId</text>
    <text x="626" y="170" fill="#7f1d1d">속성: 요청/응답 DTO 분리</text>

    <rect x="610" y="192" width="330" height="78" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="626" y="216" font-size="15" font-weight="700" fill="#312e81">인증 (API2)</text>
    <text x="626" y="239" fill="#312e81">JWT 검증 · OIDC 위임 → 해킹 15</text>
    <text x="626" y="260" fill="#312e81">로그인 시도 제한 → 해킹 05</text>

    <rect x="610" y="282" width="330" height="78" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="626" y="306" font-size="15" font-weight="700" fill="#92400e">자원 · 흐름 (API4 · 6)</text>
    <text x="626" y="329" fill="#92400e">게이트웨이 → 앱 → LiteLLM 세 겹</text>
    <text x="626" y="350" fill="#92400e">size 상한 · 타임아웃 · 키별 예산</text>

    <rect x="610" y="372" width="330" height="104" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="626" y="396" font-size="15" font-weight="700" fill="#334155">연결 · 설정 · 관리 (API7 ~ 10)</text>
    <text x="626" y="419" fill="#334155">OpenAPI 스펙 diff를 CI에 · 운영 문서 끄기</text>
    <text x="626" y="441" fill="#334155">SSRF 허용 목록 · 외부 응답도 스키마 검증</text>
    <text x="626" y="463" fill="#334155">CORS · 보안 헤더 → 해킹 17</text>
  </g>

  <rect x="20" y="496" width="920" height="48" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="480" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">빨간 줄 세 개(API1·3·5)가 모두 인가 — API 위험의 절반은 "누가 무엇에 접근하나"</text>
</svg>
