<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SQL Injection — 코드와 데이터의 경계</text>

  <!-- LEFT: concat -->
  <rect x="20" y="58" width="450" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="245" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">문자열 연결 (취약)</text>

  <rect x="20" y="112" width="450" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="136" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">sql = f"SELECT ... WHERE name = '{name}'"</text>
  <text x="40" y="157" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">conn.execute(sql)</text>

  <text x="245" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DB가 받는 것: 완성된 문장 하나</text>
  <rect x="40" y="212" width="250" height="52" fill="#e2e8f0"/>
  <rect x="290" y="212" width="160" height="52" fill="#fca5a5"/>
  <rect x="40" y="212" width="410" height="52" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="243" text-anchor="middle" font-size="13" fill="#334155">개발자가 쓴 코드</text>
  <text x="370" y="243" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="700">사용자 입력</text>
  <text x="245" y="286" text-anchor="middle" font-size="12" fill="#b91c1c">경계가 사라짐 — 입력 속 따옴표가 문법이 된다</text>

  <line x1="245" y1="296" x2="245" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="330" width="450" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="245" y="360" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">파서가 입력까지 SQL 문법으로 해석</text>
  <text x="245" y="386" text-anchor="middle" font-size="13" fill="#7f1d1d">→ 조건 변경 · 다른 테이블 조회 · 변조</text>

  <!-- RIGHT: bind -->
  <rect x="490" y="58" width="450" height="40" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="715" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">파라미터 바인딩 (안전)</text>

  <rect x="490" y="112" width="450" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="510" y="136" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">sql = "SELECT ... WHERE name = ?"</text>
  <text x="510" y="157" font-size="13" fill="#0f172a" font-family="Consolas,'D2Coding',monospace">conn.execute(sql, (name,))</text>

  <text x="715" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DB가 받는 것: 틀과 값을 따로</text>
  <rect x="510" y="212" width="230" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="625" y="236" text-anchor="middle" font-size="13" fill="#334155">SQL 틀</text>
  <text x="625" y="255" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas,'D2Coding',monospace">... name = ?</text>
  <rect x="760" y="212" width="160" height="52" rx="6" fill="#86efac" stroke="#16a34a"/>
  <text x="840" y="236" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">값 목록</text>
  <text x="840" y="255" text-anchor="middle" font-size="12" fill="#14532d" font-family="Consolas,'D2Coding',monospace">[name]</text>
  <text x="715" y="286" text-anchor="middle" font-size="12" fill="#15803d">별도 채널 — 값은 문법이 될 수 없다</text>

  <line x1="715" y1="296" x2="715" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="330" width="450" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="715" y="360" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">틀을 먼저 해석한 뒤 값을 채움</text>
  <text x="715" y="386" text-anchor="middle" font-size="13" fill="#14532d">→ 무엇이 들어 있든 "데이터"로만 비교</text>

  <rect x="20" y="424" width="920" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="449" text-anchor="middle" font-size="13" fill="#78350f">바인딩할 수 없는 자리(테이블·컬럼 이름, ORDER BY 방향)는 허용 목록으로 매핑 · ORM도 text()/f-string을 섞으면 다시 취약</text>
</svg>
