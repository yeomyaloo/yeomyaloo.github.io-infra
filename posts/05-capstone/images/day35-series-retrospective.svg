    <text x="40" y="217" font-size="14" font-weight="700" fill="#0f172a">Kubernetes</text>
    <text x="40" y="237" font-size="12" fill="#475569">여러 컨테이너를 자동으로</text>

    <rect x="20" y="258" width="230" height="78" rx="10" fill="#eef2ff"/>
