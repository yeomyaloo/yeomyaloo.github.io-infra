    <text x="40" y="321" font-size="12" fill="#475569">KVM · bridge · VXLAN · OVS</text>

    <rect x="20" y="342" width="230" height="78" rx="10" fill="#ffe4e6"/>
    <rect x="20" y="342" width="8" height="78" rx="4" fill="#ed1944"/>
    <text x="40" y="364" font-size="13" font-weight="700" fill="#9f1239">Chapter 4 · Day 25–33</text>
    <text x="40" y="385" font-size="14" font-weight="700" fill="#0f172a">OpenStack</text>
    <text x="40" y="405" font-size="12" fill="#475569">나만의 프라이빗 클라우드</text>

    <rect x="20" y="426" width="230" height="78" rx="10" fill="#dcfce7"/>
    <rect x="20" y="426" width="8" height="78" rx="4" fill="#16a34a"/>
    <text x="40" y="448" font-size="13" font-weight="700" fill="#14532d">Chapter 5 · Day 34–35</text>
    <text x="40" y="469" font-size="14" font-weight="700" fill="#0f172a">종합 프로젝트</text>
    <text x="40" y="489" font-size="12" fill="#475569">K8s on OpenStack + IaC</text>
  </g>

  <!-- Chapter 6 teaser -->
  <rect x="290" y="62" width="645" height="86" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="612" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">다음 시즌 · Chapter 6. AI 인프라</text>
  <text x="612" y="112" text-anchor="middle" font-size="13" fill="#78350f">GPU 노드 · vLLM / Ollama LLM 서빙</text>
  <text x="612" y="134" text-anchor="middle" font-size="13" fill="#78350f">RAG 파이프라인 + 벡터 DB · K8s 위 LLM 운영 · 모니터링</text>

