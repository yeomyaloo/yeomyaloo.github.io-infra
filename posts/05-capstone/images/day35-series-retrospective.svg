  <g font-size="12" text-anchor="middle" fill="#ffffff">
    <rect x="302" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="344" y="395">Keystone</text>
    <rect x="394" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="436" y="395">Glance</text>
    <rect x="486" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="528" y="395">Nova</text>
    <rect x="578" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="620" y="395">Neutron</text>
    <rect x="670" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="712" y="395">Cinder</text>
    <rect x="762" y="376" width="85" height="28" rx="6" fill="#ed1944"/><text x="804" y="395">Octavia</text>
  </g>

  <rect x="290" y="422" width="570" height="44" rx="8" fill="#c7d2fe"/>
  <text x="575" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Ch.3  KVM / QEMU / libvirt · Linux bridge · VXLAN · OVS</text>

  <rect x="290" y="474" width="570" height="40" rx="8" fill="#e2e8f0"/>
  <text x="575" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">물리 서버 (CPU · RAM · NIC · Disk)</text>

  <!-- IaC bar (Ch.5) -->
  <rect x="875" y="230" width="60" height="184" rx="8" fill="#16a34a"/>
  <text transform="translate(898,322) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Terraform (IaC)</text>
  <text transform="translate(920,322) rotate(-90)" text-anchor="middle" font-size="11" fill="#dcfce7">Ch.5 · 코드로 관리</text>

  <!-- Arrow from stack top to Chapter 6 -->
  <line x1="575" y1="170" x2="575" y2="152" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="612" y="540" text-anchor="middle" font-size="12" fill="#64748b">아래에서 위로: 물리 서버 → 가상화 → 클라우드 → VM → 클러스터 → 컨테이너</text>
</svg>
