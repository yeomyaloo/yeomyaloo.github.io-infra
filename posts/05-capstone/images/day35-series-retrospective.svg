    <text x="40" y="133" font-size="14" font-weight="700" fill="#0f172a">Docker</text>
    <text x="40" y="153" font-size="12" fill="#475569">컨테이너 하나를 제대로</text>

    <rect x="20" y="174" width="230" height="78" rx="10" fill="#e0e7ff"/>
    <rect x="20" y="174" width="8" height="78" rx="4" fill="#326ce5"/>
