  <text x="575" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ch.1  컨테이너 — containerd · 이미지 · namespace / cgroup</text>

  <rect x="290" y="230" width="570" height="50" rx="8" fill="#326ce5"/>
  <text x="575" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ch.2  Kubernetes — kubeadm · Service · PVC (+ OCCM · Cinder CSI)</text>

  <rect x="290" y="288" width="570" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Ch.5  VM × 3 — k8s-cp1 · k8s-w1 · k8s-w2 (Nova 인스턴스)</text>

  <rect x="290" y="346" width="570" height="68" rx="8" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
