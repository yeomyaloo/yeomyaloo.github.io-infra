<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">K8s 리소스가 OpenStack 리소스로 바뀌는 흐름</text>

  <!-- Lane 1: LoadBalancer -->
  <rect x="20" y="64" width="920" height="200" rx="12" fill="#fff1f2" stroke="#ed1944"/>
  <text x="36" y="92" font-size="15" font-weight="700" fill="#9f1239">① Service type: LoadBalancer → Octavia (OCCM)</text>

  <g text-anchor="middle">
    <rect x="40" y="110" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="117" y="138" font-size="14" font-weight="700" fill="#1e3a8a">Service</text>
    <text x="117" y="162" font-size="12" fill="#334155">type: LoadBalancer</text>
    <text x="117" y="182" font-size="12" fill="#334155">(kubectl expose)</text>

    <rect x="221" y="110" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="298" y="138" font-size="14" font-weight="700" fill="#1e3a8a">OCCM</text>
    <text x="298" y="162" font-size="12" fill="#334155">Service 변경 감시</text>
    <text x="298" y="182" font-size="12" fill="#334155">(service 컨트롤러)</text>

    <rect x="402" y="110" width="155" height="90" rx="10" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
    <text x="479" y="138" font-size="14" font-weight="700" fill="#9f1239">Octavia API</text>
    <text x="479" y="162" font-size="12" fill="#334155">LB · listener 생성</text>
    <text x="479" y="182" font-size="12" fill="#334155">pool · member 등록</text>

    <rect x="583" y="110" width="155" height="90" rx="10" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
    <text x="660" y="138" font-size="14" font-weight="700" fill="#9f1239">amphora VM</text>
    <text x="660" y="162" font-size="12" fill="#334155">VIP 10.0.10.50</text>
    <text x="660" y="182" font-size="12" fill="#334155">+ Floating IP 연결</text>

    <rect x="764" y="110" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="841" y="138" font-size="14" font-weight="700" fill="#1e3a8a">Service 상태</text>
    <text x="841" y="162" font-size="12" fill="#334155">status.loadBalancer</text>
    <text x="841" y="182" font-size="12" fill="#334155">EXTERNAL-IP = FIP</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="40" y="232">조건: Octavia 설치 + cloud.conf [LoadBalancer] floating-network-id · subnet-id</text>
    <text x="40" y="252">트래픽: FIP → VIP → member(노드IP:NodePort) → kube-proxy → Pod</text>
  </g>

  <!-- Lane 2: PVC -->
  <rect x="20" y="284" width="920" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="36" y="312" font-size="15" font-weight="700" fill="#92400e">② PersistentVolumeClaim → Cinder 볼륨 (Cinder CSI)</text>

  <g text-anchor="middle">
    <rect x="40" y="330" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="117" y="358" font-size="14" font-weight="700" fill="#1e3a8a">PVC</text>
    <text x="117" y="382" font-size="12" fill="#334155">storageClass: cinder</text>
    <text x="117" y="402" font-size="12" fill="#334155">5Gi 요청</text>

    <rect x="221" y="330" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="298" y="358" font-size="14" font-weight="700" fill="#1e3a8a">cinder-csi</text>
    <text x="298" y="382" font-size="12" fill="#334155">controller plugin</text>
    <text x="298" y="402" font-size="12" fill="#334155">CreateVolume 호출</text>

    <rect x="402" y="330" width="155" height="90" rx="10" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
    <text x="479" y="358" font-size="14" font-weight="700" fill="#9f1239">Cinder API</text>
    <text x="479" y="382" font-size="12" fill="#334155">볼륨 생성</text>
    <text x="479" y="402" font-size="12" fill="#334155">(pvc-xxxx)</text>

    <rect x="583" y="330" width="155" height="90" rx="10" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
    <text x="660" y="358" font-size="14" font-weight="700" fill="#9f1239">Nova API</text>
    <text x="660" y="382" font-size="12" fill="#334155">VM에 volume attach</text>
    <text x="660" y="402" font-size="12" fill="#334155">(ControllerPublish)</text>

    <rect x="764" y="330" width="155" height="90" rx="10" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="841" y="358" font-size="14" font-weight="700" fill="#1e3a8a">cinder-csi node</text>
    <text x="841" y="382" font-size="12" fill="#334155">mkfs · mount</text>
    <text x="841" y="402" font-size="12" fill="#334155">→ Pod의 /data</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="40" y="452">조건: Cinder 설치 + 노드에서 Keystone(auth-url) 접근 가능 + Nova/Cinder AZ 일치(또는 ignore-volume-az)</text>
    <text x="40" y="472">WaitForFirstConsumer: Pod가 배치될 노드가 정해진 뒤에 볼륨 생성</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="196" y1="155" x2="219" y2="155" marker-end="url(#arrow)"/>
    <line x1="377" y1="155" x2="400" y2="155" marker-end="url(#arrow)"/>
    <line x1="558" y1="155" x2="581" y2="155" marker-end="url(#arrow)"/>
    <line x1="739" y1="155" x2="762" y2="155" marker-end="url(#arrow)"/>
    <line x1="196" y1="375" x2="219" y2="375" marker-end="url(#arrow)"/>
    <line x1="377" y1="375" x2="400" y2="375" marker-end="url(#arrow)"/>
    <line x1="558" y1="375" x2="581" y2="375" marker-end="url(#arrow)"/>
    <line x1="739" y1="375" x2="762" y2="375" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#334155">
    <rect x="300" y="502" width="18" height="18" rx="4" fill="#dbeafe" stroke="#326ce5" stroke-width="2"/>
    <text x="326" y="516">Kubernetes 쪽 (클러스터 안)</text>
    <rect x="520" y="502" width="18" height="18" rx="4" fill="#ffe4e6" stroke="#ed1944" stroke-width="2"/>
    <text x="546" y="516">OpenStack 쪽 (API · 리소스)</text>
  </g>
</svg>
