<!doctype html>
<html lang="ko">
<head>
{{ partial "head.html" . }}
</head>
<body>
<header class="topbar">
  <button class="nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="목차 열기">☰</button>
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <nav class="topnav" aria-label="주 메뉴">
    {{- range site.Menus.main }}
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
    <button class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">◐</button>
  </nav>
</header>
<div class="layout">
  <aside id="sidebar" class="sidebar">{{ partial "sidebar.html" . }}</aside>
  <main class="content">
    {{ block "main" . }}{{ end }}
  </main>
</div>
<footer class="footer">
  <span>© {{ now.Year }} {{ site.Params.author }}</span>
  <a href="{{ site.Params.github }}">GitHub</a>
</footer>
<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var side = document.getElementById('sidebar');
    btn.addEventListener('click', function () {
      var open = side.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    // 다크 모드 전환 + Giscus 댓글 테마 동기화
    var root = document.documentElement;
    document.querySelector('.theme-toggle').addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      var frame = document.querySelector('iframe.giscus-frame');
      if (frame) {
        frame.contentWindow.postMessage({ giscus: { setConfig: { theme: next } } }, 'https://giscus.app');
      }
    });
  })();
</script>
</body>
</html>
