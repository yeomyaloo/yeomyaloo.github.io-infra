{{- /* 입력: 페이지 목록. 날짜·제목·요약·태그를 보여줍니다. */ -}}
<ul class="post-list">
  {{- range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{- with .Summary }}<p class="post-summary">{{ . | plainify | truncate 140 }}</p>{{ end }}
    {{- with .GetTerms "tags" }}
    <span class="tags">{{ range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}</span>
    {{- end }}
  </li>
  {{- end }}
</ul>
